l_english:
#20261111_kpopmodder: Use font-compatible separators in the new defence-cost tooltips.
#20261111_kpopmodder: Explain an unsuccessful stationing plan after refusal or changed circumstances.
#20261111_kpopmodder: Localise bilateral defence-cost spirits, conditional focus outcomes, stationing choices and news.
 HOK_KOR_us_defense_cost_sharing_1:0 "American Defence Costs"
 HOK_KOR_us_defense_cost_sharing_1_desc:0 "Signing a mutual defence treaty also means paying to sustain the alliance. To maintain America's security commitment, our government contributes to defence costs and directs resources raised at home towards our countries' defence cooperation.\n\nThis national spirit is removed if the other country ceases to exist or the two countries go to war."
 HOK_KOR_us_defense_cost_sharing_2:0 "American Defence Costs"
 HOK_KOR_us_defense_cost_sharing_2_desc:0 "Under the new agreement, the cost of maintaining American barracks, supply depots and transport networks has been added to our budget. America calls it fair burden-sharing; we call it spending on our security. Whichever wording we choose, our government must pay the bill.\n\nThis national spirit is removed if the other country ceases to exist or the two countries go to war."
 HOK_KOR_korean_defense_contribution_1:0 "Korean Defence Contribution"
 HOK_KOR_korean_defense_contribution_1_desc:0 "The Republic of Korea contributes to defence costs under our mutual defence treaty. Its contribution supports our security commitments in the Far East and reduces the burden that would otherwise fall entirely on American taxpayers.\n\nThis national spirit is removed if the other country ceases to exist or the two countries go to war."
 HOK_KOR_korean_defense_contribution_2:0 "Korean Defence Contribution"
 HOK_KOR_korean_defense_contribution_2_desc:0 "Under the new stationing agreement, the Republic of Korea will bear a larger share of the cost of supporting American barracks, supplies and operations. Korea gains security, while we ease the burden on our taxpayers. The alliance remains valuable, and the source of the funds to sustain it is now clear.\n\nThis national spirit is removed if the other country ceases to exist or the two countries go to war."
 HOK_KOR_us_defense_treaty_request_tt:0 "If America chooses to conclude the treaty, both countries will gain defence-cost national spirits.\nRepublic of Korea: §Y$HOK_KOR_us_defense_cost_sharing_1$§!: Consumer Goods Factories factor §R+5%§!.\nUnited States: §Y$HOK_KOR_korean_defense_contribution_1$§!: Consumer Goods Factories factor §G-5%§!."
 HOK_KOR_us_defense_treaty_accept_tt:0 "The Republic of Korea gains §Y$HOK_KOR_us_defense_cost_sharing_1$§! (Consumer Goods Factories factor §R+5%§!), and the United States gains §Y$HOK_KOR_korean_defense_contribution_1$§! (Consumer Goods Factories factor §G-5%§!)."
 HOK_KOR_us_defense_station_request_tt:0 "Propose stationing negotiations to America. The outcome depends on America's choice.\n§YDeployment and cost-sharing agreement§!: the national spirits' final Consumer Goods Factories factors become §R+35%§! for the Republic of Korea and §G-15%§! for the United States; Korea receives 3 US divisions.\n§YDominion status§!: the Republic of Korea becomes an American dominion, retaining the existing defence-cost spirits and receiving 3 US divisions.\n§YRefusal to station troops§!: the existing treaty and defence-cost spirits remain, with no additional effects.\nAmerica must approve the deployment to meet §YKATUSA§!'s stationing approval requirement."
 HOK_KOR_us_defense_waiting_tt:0 "Awaiting America's decision on stationing US forces in Korea"
 HOK_KOR_us_defense_station_approved_tt:0 "America has approved the stationing of US forces in Korea"
 HOK_KOR_us_defense_station_agreement_tt:0 "Upgrade the defence-cost national spirits. Their final Consumer Goods Factories factors become:\nRepublic of Korea's §Y$HOK_KOR_us_defense_cost_sharing_2$§!: §R+35%§!.\nUnited States' §Y$HOK_KOR_korean_defense_contribution_2$§!: §G-15%§!.\nThe Republic of Korea receives 3 US divisions, fulfilling the stationing approval requirement for the §YKATUSA§! focus.\nTriggers the world news event §YRepublic of Korea–United States Defence Cost Agreement§!."
 HOK_KOR_us_defense_dominion_tt:0 "The Republic of Korea becomes an American §Ydominion§!.\nBoth countries retain the treaty-stage defence-cost spirits (Consumer Goods Factories factors: Republic of Korea §R+5%§!; United States §G-5%§!).\nThe Republic of Korea receives 3 US divisions, fulfilling the stationing approval requirement for the §YKATUSA§! focus.\nKorea is notified, and the world news event §YThe Republic of Korea, America's 51st State!§! is triggered."
 HOK_KOR_us_defense_refused_tt:0 "No US divisions are stationed in Korea, and no additional defence-cost effects apply.\nThis outcome does not alter the existing mutual defence treaty or either country's current defence-cost spirits (normal treaty-stage Consumer Goods Factories factors: Republic of Korea §R+5%§!; United States §G-5%§!).\nThe Republic of Korea is notified that the stationing plan has not been concluded."
 HOK_KOR_us_defense.1.t:0 "Korea Requests US Forces"
 HOK_KOR_us_defense.1.d:0 "The government of the Republic of Korea has requested that our troops be stationed in Korea to put cooperation under the mutual defence treaty into practice. This is an opportunity to secure a forward base in the Pacific, but there is no need to leave American taxpayers with the entire cost of maintaining troops and supplies across the ocean.\n\nWe could approve the deployment while demanding a larger Korean contribution to its cost. We could go further and make the Republic of Korea an American dominion, placing its security and foreign policy under our direction. We could also retain the treaty while refusing to station troops."
 HOK_KOR_us_defense.1.a:0 "Conclude a deployment and defence cost-sharing agreement."
 HOK_KOR_us_defense.1.b:0 "Make the Republic of Korea an American dominion."
 HOK_KOR_us_defense.1.c:0 "Refuse to station US forces in Korea."
 HOK_KOR_us_defense.2.t:0 "America Approves US Forces in Korea"
 HOK_KOR_us_defense.2.d:0 "The American government has approved our request to station US forces in Korea. Our countries have also agreed on a new defence cost-sharing agreement to support the troops' deployment and operations.\n\nThe Republic of Korea will retain its independence and strengthen its security through the American deployment. In return, our government will bear greater costs. Washington has announced that the agreement shares the responsibilities of the alliance fairly."
 HOK_KOR_us_defense.2.a:0 "Security comes at a price."
 HOK_KOR_us_defense.3.t:0 "The Republic of Korea, America's 51st State!"
 HOK_KOR_us_defense.3.d:0 "The United States government has announced that the Republic of Korea has become an American dominion. Under the new relationship, the Korean government will continue to administer its domestic affairs, but its independent diplomatic and military actions will be subject to the restrictions of dominion status.\n\nAmerica has declared this decision a historic agreement combining our countries' security and prosperity, and the first step towards the birth of 'America's 51st state'."
 HOK_KOR_us_defense.3.a:0 "Accept"
 HOK_KOR_us_defense.4.t:0 "US Forces Deployment Falls Through"
 HOK_KOR_us_defense.4.d:0 "Our countries' talks on stationing US forces in Korea have not led to a deployment. America has either declined the request, or changed circumstances in one or both countries have made the stationing plan impossible to carry out.\n\nNo new stationing agreement has been concluded, and this outcome alone does not alter the existing treaty or defence-cost arrangements. Our military plans can no longer assume the arrival of American troops."
 HOK_KOR_us_defense.4.a:0 "Review the plans that assumed their deployment."
 HOK_KOR_us_defense.5.t:0 "Republic of Korea–United States Defence Cost Agreement"
 HOK_KOR_us_defense.5.d:0 "The governments of the Republic of Korea and the United States have concluded talks on the stationing of US forces in Korea and announced a new defence cost-sharing agreement. Reflecting American demands for a greater contribution, the agreement requires the Republic of Korea to bear a larger share of the cost of supporting American deployment and operations.\n\nThe American government stated that the agreement would reduce the disproportionate burden on its taxpayers and distribute the benefits and responsibilities of the alliance fairly. It also stressed that a sustainable alliance must rest not only on friendly declarations, but on a willingness to bear the corresponding costs."
 HOK_KOR_us_defense.5.a:0 "Even an alliance comes with a bill."
 HOK_KOR_us_defense.6.t:0 "The Republic of Korea, America's 51st State!"
 HOK_KOR_us_defense.6.d:0 "The United States government has officially announced that the Republic of Korea has become an American dominion. Calling Korea 'America's 51st state', Washington has celebrated the beginning of a new relationship uniting security and economic interests on both sides of the Pacific.\n\nThe Republic of Korea will retain its own government and domestic administration, but the new dependent relationship will restrict some of the powers it exercised as an independent state. The American government describes this as the culmination of an ever-closer alliance."
 HOK_KOR_us_defense.6.a:0 "Another star for the flag?"
