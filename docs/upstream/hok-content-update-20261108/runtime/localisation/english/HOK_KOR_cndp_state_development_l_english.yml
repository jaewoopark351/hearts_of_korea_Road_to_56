 HOK_KOR_cndp_develop_gyeongsangnam_desc:0 "마산과 울산을 중심으로 지역 개발을 추진해 경상남도의 도시 성장을 뒷받침합니다.\n\n$HOK_KOR_cndp_project_rules$"
