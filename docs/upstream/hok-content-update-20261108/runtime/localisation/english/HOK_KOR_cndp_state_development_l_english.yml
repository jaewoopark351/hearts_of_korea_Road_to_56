 HOK_KOR_cndp_develop_hwanghaenam:0 "황해남도 개발"
 HOK_KOR_cndp_develop_hwanghaenam_desc:0 "해주와 주변 지역의 개발 여력을 넓혀 황해남도의 성장을 뒷받침합니다. 공장 종류별 건설 한도에서 추가 부지를 확보할 여지가 확인되지 않으면 착수할 수 없습니다.\n\n$HOK_KOR_cndp_project_rules$"
