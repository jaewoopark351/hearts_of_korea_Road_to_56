#20261108_kpopmodder: Describe the independent CNDP state projects and their cancellation and completion rules.
 HOK_KOR_cndp_project_rules:0 "취소 시 정치력은 반환되지 않으며 재착수할 수 있습니다. 완료 보상은 주마다 한 번만 지급됩니다."
 HOK_KOR_cndp_meaningful_space:0 "추가 공장 부지를 확보할 여력이 확인되어야 합니다."
 HOK_KOR_cndp_developed_v1:0 "해당 주의 국토개발 사업 완료"

 HOK_KOR_cndp_develop_jeollabuk:0 "전라북도 개발"
 HOK_KOR_cndp_develop_jeollabuk_desc:0 "군산과 내륙 거점의 성장을 뒷받침해 전라북도의 개발 기반을 넓힙니다.\n\n$HOK_KOR_cndp_project_rules$"
