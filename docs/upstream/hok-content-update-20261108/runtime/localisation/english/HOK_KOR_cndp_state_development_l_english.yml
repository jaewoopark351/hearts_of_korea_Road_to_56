 HOK_KOR_cndp_develop_gyeongsangbuk_desc:0 "포항을 비롯한 산업 거점의 성장을 지원해 경상북도의 개발 여력을 넓힙니다.\n\n$HOK_KOR_cndp_project_rules$"
