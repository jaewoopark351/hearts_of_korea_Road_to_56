#20261107_kpopmodder: Name the exact successor state preferred by each research facility.
#20261031_kpopmodder: Explain conditional research-facility placement and independent one-time named-scientist training.
 HOK_KOR_land_research_network_tt:0 "If we do not own a §YLand Experimental Facility§!, construct §Y1§! in a fully controlled owned core state, prioritising §Y$STATE_525$§!. No facility is constructed in a state that already has another experimental facility, or if no eligible state is available.\nIndependently of facility placement, if §Y$KOR_yonggwan_kim$§! is in our country, their land specialisation level increases by §G1§!. This scientist training reward is granted only once."
 HOK_KOR_naval_research_network_tt:0 "If we do not own a §YNaval Experimental Facility§!, construct §Y1§! in a fully controlled owned core coastal state, prioritising §Y$HOK_KOR_STATE_1086$§!. No facility is constructed in a state that already has another experimental facility, or if no eligible state is available.\nIndependently of facility placement, if §Y$KOR_bugil_hwang$§! is in our country, their naval specialisation level increases by §G1§!. This scientist training reward is granted only once."
 HOK_KOR_air_research_network_tt:0 "If we do not own a §YAir Experimental Facility§!, construct §Y1§! in a fully controlled owned core state, prioritising §Y$STATE_1144$§!. No facility is constructed in a state that already has another experimental facility, or if no eligible state is available.\nIndependently of facility placement, if §Y$KOR_gyeongyeon_jo$§! is in our country, their air specialisation level increases by §G1§!. This scientist training reward is granted only once."
 HOK_KOR_nuclear_research_network_tt:0 "If we do not own a §YNuclear Experimental Facility§!, construct §Y1§! in a fully controlled owned core state, prioritising §Y$HOK_KOR_STATE_1028$§!. No facility is constructed in a state that already has another experimental facility, or if no eligible state is available.\nIndependently of facility placement, if §Y$KOR_sanglok_do$§! is in our country, their nuclear specialisation level increases by §G1§!. This scientist training reward is granted only once."
