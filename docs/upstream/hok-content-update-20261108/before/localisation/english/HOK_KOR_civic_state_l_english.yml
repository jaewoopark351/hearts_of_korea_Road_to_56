l_english:
#20261011_kpopmodder: Localise independent industrial policies, procurement scandals and the fictional prosecutor-coup chain with exact costs and deadlines.
 HOK_KOR_chaebol_established:0 "재벌의 산업망"
 HOK_KOR_chaebol_established_desc:0 "재벌 영향력 25~49. 기업의 투자·납품망이 산업 동원의 기반을 제공합니다."
 HOK_KOR_chaebol_dominant:0 "재벌 중심의 산업 동원"
 HOK_KOR_chaebol_dominant_desc:0 "재벌의 영향력이 75 이상이면 강력한 생산망을 사용할 수 있습니다. 협력 정책에서는 매월 비리와 기관 장악도 누적됩니다."
 HOK_KOR_civic_established:0 "조직된 시민사회"
 HOK_KOR_civic_established_desc:0 "시민사회 영향력 25~49. 현장의 협의와 공개 정보가 정책 집행의 기반을 제공합니다."
 HOK_KOR_civic_dominant:0 "시민사회의 공적 감시"
 HOK_KOR_civic_dominant_desc:0 "시민사회의 영향력이 75 이상일 때 활성화됩니다. 공적 감시와 숙련 인력의 연속성이 정책을 지탱합니다."
 HOK_KOR_chaebol_cooperation:0 "재벌과의 산업 협력"
 HOK_KOR_chaebol_cooperation_desc:0 "빠른 공장 확장과 생산을 얻는 대신, 재벌의 영향력이 75 이상이면 매월 비리 +2와 기관 장악 +1이 누적됩니다."
 HOK_KOR_civic_reform:0 "시민사회의 산업 협약"
 HOK_KOR_civic_reform_desc:0 "현장 협의와 공개된 산업 계약으로 생산·연구·안정도·인력 기반을 넓힙니다. 필요한 공공 서비스에 따른 소비재 부담은 소폭 증가합니다. 매월 비리 -1. 기관 장악망 해체를 마치기 전에는 기득권의 개혁 저항으로 매월 기관 장악 +1이 누적됩니다."
 HOK_KOR_public_ownership:0 "공공 소유의 산업망"
 HOK_KOR_public_ownership_desc:0 "국유화한 산업망은 생산과 민간 공장 확장을 지원합니다. 기존 기업의 기술 계약은 별도 승계 정책으로 유지할 수 있습니다. 매월 비리 -1."
 HOK_KOR_civic_production_quality:0 "현장 품질 협약"
 HOK_KOR_civic_production_quality_desc:0 "검증된 공정과 숙련 기술자의 연속성이 생산 효율의 성장·한계·초기 효율을 높입니다."
 HOK_KOR_civic_professional_service:0 "전문 군 인력 체계"
 HOK_KOR_civic_professional_service_desc:0 "군 교육과 경력 관리가 새로 임용되는 육군 지휘관의 공격·군수 능력과 부대 회복을 개선합니다."
 HOK_KOR_civic_contract_succession:0 "기술 계약의 공적 승계"
 HOK_KOR_civic_contract_succession_desc:0 "소유권을 바꾸면서도 기술 계약과 숙련 인력을 승계합니다."
 HOK_KOR_procurement_corruption_moderate:0 "누적된 조달 비리"
 HOK_KOR_procurement_corruption_moderate_desc:0 "누적 비리 40~69. 계약 검증 비용과 유출된 자금이 연구·생산·정치력에 부담을 줍니다."
 HOK_KOR_procurement_corruption_severe:0 "조달 카르텔"
 HOK_KOR_procurement_corruption_severe_desc:0 "누적 비리 70 이상. 비리와 특혜의 손실이 협력 정책의 생산 이익을 크게 잠식합니다."
 HOK_KOR_air_procurement_accident:0 "항공 조달 사고"
 HOK_KOR_air_procurement_accident_desc:0 "가상의 한국화약 급행 화약·탄약 공급과 컨소시엄의 검수 누락이 격납고 폭발로 이어졌습니다. 비행대의 피해와 무너진 정비 체계 때문에 항공 사고 위험이 높아지고 임무 효율과 경험 획득이 떨어집니다. 항공 조달 복구 결정을 완료하면 해제됩니다."
 HOK_KOR_prosecutor_pressure:0 "개혁 기관에 대한 반격"
 HOK_KOR_prosecutor_pressure_desc:0 "조달 카르텔과 결탁한 가상의 검찰 권력망이 개혁 정부의 집행을 막고 있습니다. 90일 안에 기관 장악을 60 미만으로 낮추거나 증거를 확보해야 합니다."
 HOK_KOR_prosecutorial_takeover_idea:0 "검찰 권력망의 국정 장악"
 HOK_KOR_prosecutorial_takeover_idea_desc:0 "가상의 검찰 권력망이 행정 집행과 예산을 장악했습니다. 시민사회 산업 협약의 기본 혜택이 중단됩니다. 시민적 위임 회복 결정을 완료하면 복구됩니다."
 HOK_KOR_fast_air_procurement:0 "항공 계약 급행 처리"
 HOK_KOR_fast_air_procurement_desc:0 "한국화약의 항공용 화약·탄약 급행 공급을 포함한 가상의 납품 계약으로 항공기 연구와 소형 항공기 생산을 가속합니다. 납품 컨소시엄이 생략한 검수 절차 때문에 30~45일 후 안전 경고가 도착하며, 조사를 거부하면 격납고 폭발로 이어집니다."
 HOK_KOR_fast_rocket_procurement:0 "추진제 계약 급행 처리"
 HOK_KOR_fast_rocket_procurement_desc:0 "가상의 한국화약 추진제 계약으로 로켓 연구와 로켓 특별 프로젝트를 가속합니다. 30~45일 후 안전 경고가 도착하며 조사를 거부하면 폭발 사고로 이어집니다."
 HOK_KOR_rocket_procurement_accident:0 "추진제 공장 폭발"
 HOK_KOR_rocket_procurement_accident_desc:0 "급행 납품의 안전 경고를 묵살한 뒤 가상의 한국화약 추진제 공장에서 폭발이 발생했습니다. 추진제 인증과 시험 일정이 중단되어 로켓 연구와 로켓 특별 프로젝트가 지연됩니다. 추진제 조달 복구 결정을 완료하면 해제됩니다."
 HOK_KOR_support_chaebol_tt:0 "재벌 영향력 +10, 누적 비리 +5, 기관 장악 +3. 정치력 50을 소모하고 지원·견제 행동에 90일 공통 대기기간을 적용합니다."
 HOK_KOR_suppress_chaebol_tt:0 "재벌 영향력 -10, 누적 비리 -3. 기득권의 저항으로 기관 장악 +4. 정치력 50을 소모하고 지원·견제 행동에 90일 공통 대기기간을 적용합니다."
 HOK_KOR_support_civic_tt:0 "시민사회 영향력 +10, 누적 비리 -2. 시민 개혁 정책에서는 기득권의 저항으로 기관 장악 +3. 정치력 50을 소모하고 지원·견제 행동에 90일 공통 대기기간을 적용합니다."
 HOK_KOR_suppress_civic_tt:0 "시민사회 영향력 -10, 누적 비리 +8, 기관 장악 +5. 정치력 50을 소모하고 지원·견제 행동에 90일 공통 대기기간을 적용합니다."
 HOK_KOR_civic_balance:0 "재벌과 시민사회"
 HOK_KOR_civic_balance_desc:0 "두 영향력은 독립적으로 움직이며 합계 100으로 고정되지 않습니다. 지원·견제에는 정치력 50과 90일 공통 대기기간이 적용됩니다. 누적 비리 40/70에서 조달 손실이 커집니다. 시민 개혁과 기관 장악 60 이상이 겹치면 가상의 검찰 권력망이 반격합니다."
 HOK_KOR_procurement_integrity:0 "군수 조달과 공적 검증"
 HOK_KOR_procurement_integrity_desc:0 "재벌의 산업망을 이용하면 항공·추진제 계약을 급행 처리할 수 있습니다. 두 계약은 365일 공통 대기기간과 진행 슬롯을 공유하며, 조사·복구 중에는 새 급행 계약을 시작할 수 없습니다. 경고를 조사하면 혜택을 포기하고 60일 동안 검증합니다. 묵살하면 계약 착수 후 45~90일에 사고가 발생합니다. 이 조달 스캔들은 대체역사 사건입니다."
 HOK_KOR_support_chaebol:0 "재벌 지원"
 HOK_KOR_support_chaebol_desc:0 "재벌 영향력 +10, 누적 비리 +5, 기관 장악 +3. 정치력 50을 소모하고 지원·견제 행동에 90일 공통 대기기간을 적용합니다."
 HOK_KOR_suppress_chaebol:0 "재벌 견제"
 HOK_KOR_suppress_chaebol_desc:0 "재벌 영향력 -10, 누적 비리 -3. 기득권의 저항으로 기관 장악 +4. 정치력 50을 소모하고 지원·견제 행동에 90일 공통 대기기간을 적용합니다."
 HOK_KOR_support_civic:0 "시민사회 지원"
 HOK_KOR_support_civic_desc:0 "시민사회 영향력 +10, 누적 비리 -2. 시민 개혁 정책에서는 기득권의 저항으로 기관 장악 +3. 정치력 50을 소모하고 지원·견제 행동에 90일 공통 대기기간을 적용합니다."
 HOK_KOR_suppress_civic:0 "시민사회 견제"
 HOK_KOR_suppress_civic_desc:0 "시민사회 영향력 -10, 누적 비리 +8, 기관 장악 +5. 정치력 50을 소모하고 지원·견제 행동에 90일 공통 대기기간을 적용합니다."
 HOK_KOR_secure_prosecutorial_records:0 "검찰 권력망의 증거 보전"
 HOK_KOR_secure_prosecutorial_records_desc:0 "90일 위기 안에 증거를 확보하십시오. 정치력 150, 45일. 기관 장악 -15. 증거 보전은 진행 중인 정변 위기를 막지만, 기관 개혁을 완수하지 않으면 이후 반격이 다시 일어날 수 있습니다."
 HOK_KOR_break_capture_networks:0 "기관 장악망 해체"
 HOK_KOR_break_capture_networks_desc:0 "정치력 200을 투입하고 60일 동안 인사·예산·조달 기록을 공개합니다. 착수 시 안정도 -5%. 완료 시 기관 장악 -25, 누적 비리 -10, 시민사회 영향력 +5. 개혁 저항의 월간 기관 장악 증가가 끝납니다. 이후 지원·견제나 은폐로 기관 장악이 다시 올라갈 수 있습니다."
 HOK_KOR_restore_civilian_mandate:0 "시민적 위임 회복"
 HOK_KOR_restore_civilian_mandate_desc:0 "시민사회 영향력 50 이상, 정치력 200, 90일. 가상의 검찰 국정 장악을 해소하고 시민 산업 협약의 기본 혜택을 복구합니다. 완료 시 기관 장악 -30, 누적 비리 -10, 안정도 +5%."
 HOK_KOR_prosecutor_coup_countdown:0 "검찰 정변의 기한"
 HOK_KOR_prosecutor_coup_countdown_desc:0 "90일 안에 기관 장악을 60 미만으로 낮추거나 증거 보전 결정을 완료해야 합니다. 실패하면 검찰 국정 장악과 시민 산업 협약의 기본 혜택 중단이 발생합니다."
 HOK_KOR_independent_procurement_audit:0 "독립 조달 감사"
 HOK_KOR_independent_procurement_audit_desc:0 "정치력 100, 60일. 완료 시 누적 비리 -12, 기관 장악 -5. 감사 완료 뒤 180일 대기기간. 분야별 결함 경고와 사고는 각 조사·복구 절차로 처리해야 합니다."
 HOK_KOR_fast_track_air_contracts:0 "항공 계약 급행 처리"
 HOK_KOR_fast_track_air_contracts_desc:0 "재벌 영향력 40 이상, 정치력 75. 분야별 급행 혜택을 얻으며 누적 비리 +10, 기관 장악 +5. 혜택의 상한은 180일이지만 30~45일 후 결함 경고가 발생하며 조사 또는 사고로 즉시 종료됩니다. 경고를 묵살하면 계약 착수 후 45~90일에 사고가 발생합니다. 항공과 로켓 계약은 진행 슬롯과 365일 대기기간을 공유하며, 조사·복구 중이거나 사고 피해가 남아 있으면 새 급행 계약을 시작할 수 없습니다."
 HOK_KOR_recover_air_procurement:0 "항공 조달 복구"
 HOK_KOR_recover_air_procurement_desc:0 "정치력 150, 60일. 독립 시험·안전 점검과 납품 체계 재건을 완료하면 해당 분야의 사고 국민정신이 해제됩니다. 완료 시 누적 비리 -10, 기관 장악 -5. 계약의 365일 대기기간은 유지됩니다."
 HOK_KOR_fast_track_rocket_contracts:0 "추진제 계약 급행 처리"
 HOK_KOR_fast_track_rocket_contracts_desc:0 "재벌 영향력 40 이상, 정치력 75. 분야별 급행 혜택을 얻으며 누적 비리 +10, 기관 장악 +5. 혜택의 상한은 180일이지만 30~45일 후 결함 경고가 발생하며 조사 또는 사고로 즉시 종료됩니다. 경고를 묵살하면 계약 착수 후 45~90일에 사고가 발생합니다. 항공과 로켓 계약은 진행 슬롯과 365일 대기기간을 공유하며, 조사·복구 중이거나 사고 피해가 남아 있으면 새 급행 계약을 시작할 수 없습니다."
 HOK_KOR_recover_rocket_procurement:0 "추진제 조달 복구"
 HOK_KOR_recover_rocket_procurement_desc:0 "정치력 150, 60일. 독립 시험·안전 점검과 납품 체계 재건을 완료하면 해당 분야의 사고 국민정신이 해제됩니다. 완료 시 누적 비리 -10, 기관 장악 -5. 계약의 365일 대기기간은 유지됩니다."
 HOK_KOR_CIVIC.1.t:0 "항공용 화약 납품의 안전 경고"
 HOK_KOR_CIVIC.1.d:0 "항공 납품 컨소시엄에 한국화약이 급행 공급한 항공용 화약·탄약의 시험 기록이 실제 품질과 일치하지 않는다는 보고가 올라왔다. 컨소시엄이 생략한 검수 절차 때문에 격납고에 보관된 납품물의 안전도 보장할 수 없다. 독립 조사를 시작하면 급행 혜택은 즉시 끝나며 60일 동안 두 분야의 새 계약을 진행할 수 없다. 경고를 묵살하면 15~45일 뒤 사고가 발생한다.\n\n이 한국화약 납품 사건은 1936년 한국을 배경으로 한 모드의 가상 대체역사다."
 HOK_KOR_CIVIC.1.a:0 "급행 납품을 중지하고 독립 조사를 시작한다."
 HOK_KOR_CIVIC.1.b:0 "납기를 우선한다. 보고는 내부에서 처리하라."
 HOK_KOR_CIVIC.2.t:0 "항공기 격납고의 폭발"
 HOK_KOR_CIVIC.2.d:0 "한국화약의 급행 항공용 화약·탄약 공급에서 제기된 안전 경고를 묵살한 뒤, 납품물을 보관한 격납고에서 폭발이 발생했다. 비행대가 피해를 입었고 항공 납품 컨소시엄과 조달 책임자는 누락된 검수 기록의 책임을 서로 미루고 있다. 운용 안전과 정비 체계가 흔들려 항공 사고 위험이 높아지고 임무 효율과 경험 획득이 떨어진다. 피해는 항공 조달 복구 결정을 완료해야 해소된다.\n\n이 사건과 업체의 결탁은 모드의 가상 대체역사 설정이며 실존 기업의 역사적 비리나 사건을 뜻하지 않는다."
 HOK_KOR_CIVIC.2.a:0 "피해와 계약 기록을 공개한다."
 HOK_KOR_CIVIC.2.b:0 "업계 보상금으로 수습하고 기록은 비공개로 돌린다."
 HOK_KOR_CIVIC.3.t:0 "항공 조달의 검증 완료"
 HOK_KOR_CIVIC.3.d:0 "독립 시험과 납품 기록 대조를 완료했다. 해당 분야의 사고 국민정신이 해제되며 누적 비리 -10, 기관 장악 -5. 다른 분야의 사고와 계약의 365일 공통 대기기간은 그대로 유지된다. 새 계약을 급행 처리하면 다시 경고와 사고가 발생할 수 있다."
 HOK_KOR_CIVIC.3.a:0 "검증된 납품 체계로 돌아간다."
 HOK_KOR_CIVIC.11.t:0 "추진제 조달의 결함 경고"
 HOK_KOR_CIVIC.11.d:0 "한국화약 추진제 계약의 급행 납품에서 시험 기록과 실제 품질이 일치하지 않는다는 보고가 올라왔다. 빠른 전력화를 위해 생략한 검증 절차가 이제 위험으로 돌아왔다. 독립 조사를 시작하면 급행 혜택은 즉시 끝나며 60일 동안 두 분야의 새 계약을 진행할 수 없다. 경고를 묵살하면 15~45일 뒤 사고가 발생한다.\n\n이 납품 사건은 1936년 한국을 배경으로 한 모드의 가상 대체역사다."
 HOK_KOR_CIVIC.11.a:0 "급행 납품을 중지하고 독립 조사를 시작한다."
 HOK_KOR_CIVIC.11.b:0 "납기를 우선한다. 보고는 내부에서 처리하라."
 HOK_KOR_CIVIC.12.t:0 "추진제 공장의 폭발"
 HOK_KOR_CIVIC.12.d:0 "한국화약의 급행 추진제 계약에서 제기된 안전 경고를 묵살한 뒤 생산 시설에서 폭발이 발생했다. 시험 일정과 추진제 인증이 중단되어 로켓 연구와 로켓 특별 프로젝트가 지연된다. 피해는 추진제 조달 복구 결정을 완료해야 해소된다.\n\n이 사건은 모드의 가상 대체역사이며 실존 기업의 역사적 사건이나 비리를 뜻하지 않는다."
 HOK_KOR_CIVIC.12.a:0 "피해와 계약 기록을 공개한다."
 HOK_KOR_CIVIC.12.b:0 "업계 보상금으로 수습하고 기록은 비공개로 돌린다."
 HOK_KOR_CIVIC.13.t:0 "추진제 조달의 검증 완료"
 HOK_KOR_CIVIC.13.d:0 "독립 시험과 납품 기록 대조를 완료했다. 해당 분야의 사고 국민정신이 해제되며 누적 비리 -10, 기관 장악 -5. 다른 분야의 사고와 계약의 365일 공통 대기기간은 그대로 유지된다. 새 계약을 급행 처리하면 다시 경고와 사고가 발생할 수 있다."
 HOK_KOR_CIVIC.13.a:0 "검증된 납품 체계로 돌아간다."
 HOK_KOR_CIVIC.24.t:0 "개혁 정부를 겨눈 검찰 권력망"
 HOK_KOR_CIVIC.24.d:0 "공개 조달과 시민사회 산업 협약이 기존 이권을 위협하자, 업체와 결탁한 검찰 권력망이 예산 승인과 행정 집행을 봉쇄하기 시작했다. 이들은 개혁 정부를 무력화하고 국정을 장악하려 한다.\n\n90일 안에 기관 장악을 60 미만으로 낮추거나 검찰 권력망의 증거 보전 결정을 마쳐야 한다. 증거 보전은 정치력 150·45일, 기관 장악망 해체는 정치력 200·60일이다. 기한을 넘기면 시민사회 산업 협약의 기본 혜택이 중단되고 국정 장악 국민정신이 적용된다.\n\n검찰 정변과 기업 결탁은 이 모드의 가상 대체역사 설정이다."
 HOK_KOR_CIVIC.24.a:0 "기록을 확보하고 기관 장악을 끊어라."
 HOK_KOR_CIVIC.21.t:0 "검찰 정변 저지"
 HOK_KOR_CIVIC.21.d:0 "기관 장악이 위험선 아래로 내려가거나 조달 기록의 증거가 보전되어 국정 장악 시도는 막혔다. 위기 국민정신은 해제되고 365일 동안 같은 정변 위기가 다시 발생하지 않는다. 기관 장악망 해체를 마치면 시민 개혁에 대한 월간 기관 장악 증가도 끝낼 수 있다."
 HOK_KOR_CIVIC.21.a:0 "개혁의 집행권을 지킨다."
 HOK_KOR_CIVIC.22.t:0 "검찰 권력망의 국정 장악"
 HOK_KOR_CIVIC.22.d:0 "90일의 대비 기한을 넘긴 뒤, 가상의 검찰 권력망이 예산과 행정 집행을 장악했다. 시민사회 산업 협약의 기본 혜택이 중단되고 국정 장악 국민정신이 적용된다. 기존 지도자나 군사 쿠데타 경로와 별개로, 시민사회 영향력 50 이상에서 정치력 200·90일의 시민적 위임 회복 결정을 통해 집행권을 되찾아야 한다."
 HOK_KOR_CIVIC.22.a:0 "시민적 위임을 회복할 준비를 한다."
 HOK_KOR_CIVIC.23.t:0 "시민적 위임의 회복"
 HOK_KOR_CIVIC.23.d:0 "시민사회가 기록 공개와 행정 복원을 뒷받침하여 검찰 권력망의 국정 장악을 해소했다. 시민사회 산업 협약의 기본 혜택이 복구된다. 월간 개혁 저항은 끝나지만 새로운 특혜 계약과 은폐는 다시 비리와 기관 장악을 키울 수 있다."
 HOK_KOR_CIVIC.23.a:0 "공개된 기록 위에서 다시 시작한다."
 HOK_KOR_chaebol_interfering:0 "재벌의 산업 간섭"
 HOK_KOR_chaebol_interfering_desc:0 "재벌 영향력 50~74. 산업 계약과 납품망에 개입할 수 있을 만큼 재벌의 영향력이 커졌습니다."
 HOK_KOR_civic_interfering:0 "시민사회의 정책 참여"
 HOK_KOR_civic_interfering_desc:0 "시민사회 영향력 50~74. 현장 협의와 공적 감시가 정책 집행에 지속적으로 영향을 줍니다."
