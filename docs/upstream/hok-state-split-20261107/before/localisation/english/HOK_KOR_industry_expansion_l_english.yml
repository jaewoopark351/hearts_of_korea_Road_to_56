l_english:
#20261003_kpopmodder: Clarify Gyeongsang coastal-state wording without changing construction requirements.
#20261003_kpopmodder: Explain new decision and spirit policies through concrete circumstances; preserve gameplay and lifecycle rules.
#20260926_kpopmodder: Use escaped ASCII dialogue quotes and compact decision UI text; preserve gameplay and explicit lifecycle warnings.
#20260926_kpopmodder: Compact new focus descriptions for the fixed-height UI; preserve gameplay and non-focus localisation.
#20260925_kpopmodder: Rewrite focus, decision and event prose with grounded voices; preserve keys, gameplay rules and paired Korean text.
#20260923_kpopmodder: 요청한 반복 디시전 7종의 민간공장 비용을 제거하고 정치력 150 비용에 맞춰 설명을 동기화합니다.
#20260921_kpopmodder: 승인된 보상 강화에 맞춰 최종 교체값·영구 효과·반복 사업 조건과 협정 설명을 두 언어 채널에 동기화합니다.
#20260921_kpopmodder: 현재 산업 국민정신 수치에 중점·국민정신 설명과 통합 생산계획 툴팁을 맞추고 단계 교체를 명시합니다.
#20260921_kpopmodder: 바닐라 산업·교육·투자 구조를 한국의 기존 기관과 연결한 신규 설명을 양쪽 언어 채널에 제공합니다.
 HOK_KOR_link_power_grids:0 "전국 전력망 연계"
 HOK_KOR_link_power_grids_desc:0 "발전소에 전력이 남는데 공장의 기계는 멈춥니다. 지역별 발전·배전을 잇겠습니다. 연계된 전력망으로 공장 에너지 소비가 10% 감소합니다."
 HOK_KOR_industrial_power_allocation:0 "산업용 전력 배분"
 HOK_KOR_industrial_power_allocation_desc:0 "총발전량보다 어느 공장이 언제 받는지가 중요합니다. 산업 수요에 맞춰 배전합니다. 에너지 소비 감소는 20%로 교체되며 이전 단계와 중첩되지 않습니다."
 HOK_KOR_industrial_measurement_standards:0 "공업 계량규격 통일"
 HOK_KOR_industrial_measurement_standards_desc:0 "\"같은 치수인데 왜 안 맞습니까?\"\n\"두 공장의 자부터 가져오게.\"\n계량규격과 검사 기준을 통일해 부품을 다시 깎는 낭비를 줄이겠습니다."
 HOK_KOR_factory_safety_inspections:0 "공장 안전검사제"
 HOK_KOR_factory_safety_inspections_desc:0 "기계가 다시 돌아가도 다친 사람의 삶은 돌아오지 않습니다. 정기 안전검사와 교육으로 검사 날에만 깨끗한 작업장을 바꾸겠습니다."
 HOK_KOR_national_power_coordination:0 "국가전력조정위원회"
 HOK_KOR_national_power_coordination_desc:0 "전선이 이어졌다면 보수 일정도 이어져야 합니다. 팔도의 전력 수급을 함께 조정합니다. 에너지 소비 감소는 30%로 교체되며 이전 단계와 중첩되지 않습니다."
 HOK_KOR_technical_colleges:0 "실업전문학교 확충"
 HOK_KOR_technical_colleges_desc:0 "칠판의 회로를 실제 기계로 옮길 손이 필요합니다. 실업전문학교의 실습을 늘려 전기·통신 기술을 현장에서 다룰 인재를 기르겠습니다."
 HOK_KOR_workshop_apprenticeships:0 "공장 도제교육"
 HOK_KOR_workshop_apprenticeships_desc:0 "\"설명서를 덮고 기계 소리부터 들어 보게.\"\n숙련공의 경험이 신입에게 전해지도록 도제교육을 마련합니다. 생산효율 성장 +30%를 얻습니다."
 HOK_KOR_workers_night_schools:0 "노동자 야간학교"
 HOK_KOR_workers_night_schools_desc:0 "\"선생, 제 이름부터 배워도 되겠소?\"\n야간교실을 엽니다. 안정도는 5%p 오르고, 연구 +10%는 기한 없이 적용됩니다. 농촌 순회교육과 별개입니다."
 HOK_KOR_university_industry_labs:0 "산학 공동연구실"
 HOK_KOR_university_industry_labs_desc:0 "실험실에서 된 일이 공장에서 안 된다면 같은 기계를 함께 봐야 합니다. 공동연구실에서 현장의 문제와 새로운 공정을 시험하겠습니다."
 HOK_KOR_skilled_workforce:0 "숙련공 양성체계"
 HOK_KOR_skilled_workforce_desc:0 "새 생산선이라고 숙련까지 처음부터 쌓을 필요는 없습니다. 실습·경력·재교육을 잇습니다. 생산효율 성장 +60%로 도제교육을 교체하며 중첩되지 않습니다."
 HOK_KOR_production_review:0 "생산공정 실태조사"
 HOK_KOR_production_review_desc:0 "새 공장부터 짓기 전에 쌓인 부품과 멈춘 공정을 보겠습니다. 병목을 조사한 뒤 대량생산에 집중할지 설계 변경에 대비할지 정하겠습니다."
 HOK_KOR_standardized_mass_production:0 "표준규격 대량생산"
 HOK_KOR_standardized_mass_production_desc:0 "검증된 설계를 오래 찍어내되 전환의 부담은 감수합니다. 생산효율 상한 +15%, 전환 시 효율 유지 -5%. 유연한 생산라인과 양립하지 않습니다."
 HOK_KOR_flexible_production_lines:0 "유연한 생산라인"
 HOK_KOR_flexible_production_lines_desc:0 "설계가 바뀌어도 경험은 이어 쓰겠습니다. 전환 시 효율 유지 +20%, 생산효율 상한 -2.5%. 표준규격 대량생산과 양립하지 않습니다."
 HOK_KOR_production_quality_assurance:0 "생산품 품질보증"
 HOK_KOR_production_quality_assurance_desc:0 "납품한 공장과 받은 부대가 같은 검사표를 보게 하겠습니다. 새 생산선의 시행착오를 줄여 기본 생산효율 +10%를 얻습니다."
 HOK_KOR_integrated_production_planning:0 "통합 생산계획"
 HOK_KOR_integrated_production_planning_desc:0 "선택한 방식에 부품·인력 공급을 맞춥니다.\n대량생산: 효율 상한 +30%, 전환 유지 -5%.\n유연생산: 전환 유지 +40%, 상한 -2.5%.\n선택한 정책만 교체하며 이전 단계와 중첩되지 않습니다."
 HOK_KOR_regional_industry_fund:0 "지역 공업 투자기금"
 HOK_KOR_regional_industry_fund_desc:0 "도면보다 공사비가 늦으면 사람과 자재가 흩어집니다. 지역 공업 투자기금을 마련해 후속 사업의 첫 삽부터 다음 공정까지 잇겠습니다."
 HOK_KOR_pyeongan_machine_workshops:0 "평안 기계공업 육성"
 HOK_KOR_pyeongan_machine_workshops_desc:0 "평안의 가공 기술을 병기 생산으로 잇겠습니다. 후속 투자 사업에 정치력 150을 쓰면 군수공장을 건설합니다. 민간공장은 점유하지 않습니다."
 HOK_KOR_gangwon_electrical_workshops:0 "강원 전기기기 공업"
 HOK_KOR_gangwon_electrical_workshops_desc:0 "전력을 만드는 곳에서 전기를 쓸 기기도 만들겠습니다. 강원의 전기기기 공업을 준비합니다. 실제 건설은 별도의 투자 사업으로 진행합니다."
 HOK_KOR_chungcheong_supplier_network:0 "충청 부품공급망"
 HOK_KOR_chungcheong_supplier_network_desc:0 "큰 공장도 작은 부품을 기다립니다. 충청의 부품공급망을 준비하고, 후속 투자 사업으로 민간공장을 세워 각지의 생산을 잇겠습니다."
 HOK_KOR_gyeongsang_export_workshops:0 "경상 수출조선 지원"
 HOK_KOR_gyeongsang_export_workshops_desc:0 "수출할 화물 곁에는 그것을 실을 배도 필요합니다. 경상의 항만·공업 기반을 잇고, 후속 조선소 투자 사업으로 건조 능력을 넓히겠습니다."
 HOK_KOR_energy_coordination_1:0 "연계된 전력망"
 HOK_KOR_energy_coordination_1_desc:0 "발전소마다 따로 배전 계획을 세우면 한 지역에 전력이 남아도 다른 지역의 기계는 멈춥니다. 지역별 발전과 배전 계획을 연결하여 공장이 필요한 전력을 제때 받도록 하고 낭비를 줄이고 있습니다.\n\n공장 에너지 소비 §G-10%§!가 적용됩니다."
 HOK_KOR_energy_coordination_2:0 "산업용 전력 배분"
 HOK_KOR_energy_coordination_2_desc:0 "전력망을 연결한 뒤에도 공장이 한꺼번에 기계를 돌리는 시간에는 배전이 몰립니다. 공업지대의 생산 일정과 전력 수요를 함께 살펴, 어느 지역에 언제 전력을 보낼지 조정하는 체계를 마련했습니다.\n\n공장 에너지 소비 §G-20%§!가 적용됩니다. §Y연계된 전력망§!을 대체하며 이전 단계와 중첩되지 않습니다."
 HOK_KOR_energy_coordination_3:0 "국가전력조정위원회"
 HOK_KOR_energy_coordination_3_desc:0 "한 지역의 발전 설비를 보수할 때 이웃 지역의 공급 계획까지 바꾸어야 한다면 개별 공장의 요청만으로는 해결하기 어렵습니다. 국가전력조정위원회가 각지의 전력 수급과 설비 보수 일정을 함께 조정하여 연결된 전력망을 안정적으로 운용합니다.\n\n공장 에너지 소비 §G-30%§!가 적용됩니다. §Y산업용 전력 배분§!을 대체하며 이전 단계와 중첩되지 않습니다."
 HOK_KOR_night_school_spirit:0 "노동자 야간교육"
 HOK_KOR_night_school_spirit_desc:0 "낮에 생산라인을 지키는 노동자는 학교의 수업 시간에 맞춰 일을 멈출 수 없습니다. 일을 마친 뒤에도 배움을 이어 갈 수 있도록 야간교실을 열고, 글과 셈에서 도면과 기초 과학까지 현장에서 필요한 지식을 익히게 하고 있습니다.\n\n연구 속도 §G+10%§!가 기한 없이 적용됩니다."
 HOK_KOR_workforce_1:0 "공장 도제교육"
 HOK_KOR_workforce_1_desc:0 "새 노동자가 작업 순서를 익힐 때마다 숙련공의 손과 설명이 필요합니다. 도면만 넘겨주고 생산을 재촉하는 대신, 같은 작업대에서 가공과 조립을 반복하며 현장의 경험이 다음 사람에게 전해지도록 돕고 있습니다.\n\n생산효율 성장 §G+30%§!가 적용됩니다."
 HOK_KOR_workforce_2:0 "숙련공 양성체계"
 HOK_KOR_workforce_2_desc:0 "한 공방에서 배운 기술이 다른 공장의 교육과 이어지지 않으면 숙련 인력도 매번 같은 과정을 되풀이해야 합니다. 실업교육·현장 실습·재교육을 연결하여 새 노동자를 가르칠 사람과 다시 배울 기회를 꾸준히 마련하고 있습니다.\n\n생산효율 성장 §G+60%§!가 적용됩니다. §Y공장 도제교육§!을 대체하며 이전 단계와 중첩되지 않습니다."
 HOK_KOR_mass_production_1:0 "표준규격 대량생산"
 HOK_KOR_mass_production_1_desc:0 "설계와 작업 순서가 자주 바뀌면 공장도 같은 부품을 오래 만들어 얻는 숙련을 쌓기 어렵습니다. 검증된 규격을 유지하여 대량생산에 집중하되, 새 품목으로 전환할 때는 기존 생산 경험을 더 많이 잃는 부담을 감수합니다.\n\n생산효율 상한 §G+15%§!, 생산라인 전환 시 효율 유지 §R-5%§!가 적용됩니다."
 HOK_KOR_mass_production_2:0 "통합된 대량생산 계획"
 HOK_KOR_mass_production_2_desc:0 "같은 설계로 계속 생산하더라도 부품이나 작업자가 제때 오지 않으면 양산 일정은 끊어집니다. 부품 조달과 인력 배치를 생산 일정에 맞추어 표준규격의 장기 생산을 뒷받침하고 있습니다. 품목 전환에 따른 부담은 그대로 남습니다.\n\n생산효율 상한 §G+30%§!, 생산라인 전환 시 효율 유지 §R-5%§!가 적용됩니다. §Y표준규격 대량생산§!을 대체하며 이전 단계와 중첩되지 않습니다."
 HOK_KOR_flexible_production_1:0 "유연한 생산라인"
 HOK_KOR_flexible_production_1_desc:0 "새 장비를 만들라는 지시가 내려올 때마다 공구와 작업 순서까지 처음부터 익혀서는 납품을 따라갈 수 없습니다. 설계가 바뀌어도 기존 작업 경험을 활용하도록 설비와 전환 절차를 마련했습니다. 한 품목의 장기 생산에 집중할 수 있는 여력 일부는 양보합니다.\n\n생산라인 전환 시 효율 유지 §G+20%§!, 생산효율 상한 §R-2.5%§!가 적용됩니다."
 HOK_KOR_flexible_production_2:0 "통합된 유연생산 계획"
 HOK_KOR_flexible_production_2_desc:0 "전환 절차를 정해도 새 부품과 공구가 늦으면 생산라인은 다시 기다려야 합니다. 설비 준비와 부품 공급계획을 함께 조정하여 품목이 바뀔 때 기존 생산 경험을 더 많이 이어 쓰고 있습니다. 장기 양산의 효율 상한을 일부 양보하는 선택은 유지됩니다.\n\n생산라인 전환 시 효율 유지 §G+40%§!, 생산효율 상한 §R-2.5%§!가 적용됩니다. §Y유연한 생산라인§!을 대체하며 이전 단계와 중첩되지 않습니다."
 HOK_KOR_quality_control:0 "생산품 품질보증"
 HOK_KOR_quality_control_desc:0 "납품한 공장과 받은 부대가 서로 다른 검사 기준을 쓰면 새 생산라인도 무엇부터 바로잡아야 할지 알기 어렵습니다. 공통 검사표와 납품 기록을 이어, 앞선 생산에서 확인한 작업 기준을 새 생산선의 가동 준비에 활용하고 있습니다.\n\n기본 생산효율 §G+10%§!가 적용됩니다."
 HOK_KOR_regional_industry_projects:0 "지역 공업 투자"
 HOK_KOR_regional_industry_projects_desc:0 "도면이 공장이 되려면 다음 투자가 필요합니다. 기계 가공, 전기기기, 부품 공급과 선박 건조는 지역마다 필요한 설비가 다릅니다. 후속 지역 중점에서 준비한 계획을 실제 공사와 납품으로 이어 갑니다.\n\n사업당 정치력 150, 민간공장 점유 없음, 공사 90일입니다. 같은 지역의 동시 중복은 불가합니다. 완료하거나 취소된 뒤에는 조건을 갖추고 비용을 다시 내면 횟수 제한 없이 반복할 수 있습니다."
 HOK_KOR_regional_industry_fund_tt:0 "후속 지역 중점으로 §Y지역 공업 투자§! 사업을 준비할 수 있습니다. 각 사업은 §Y정치력 150§!만 사용하며 민간공장을 점유하지 않습니다. 공사 기간은 §Y90일§!입니다. 완료 후 같은 사업을 다시 선택할 수 있으며, 건설 부지와 소유·완전통제 조건은 계속 필요합니다."
 HOK_KOR_pyeongan_industry_project:0 "평안 기계공장 투자"
 HOK_KOR_pyeongan_industry_project_desc:0 "병기 주문이 늘어도 가공할 기계와 작업장이 부족하면 평안의 도면은 납품으로 이어지지 못합니다. 평안의 가공 설비와 작업장을 늘려 도면이 병기 생산으로 이어지게 합니다.\n\n정치력 §Y150§!을 소모하며 민간공장은 점유하지 않습니다. §Y90일§! 후 평안에 슬롯 §G1개§!와 군수공장 §G1개§!를 추가합니다.\n\n이 주의 소유권이나 완전통제를 잃거나 건설 슬롯이 없어지거나 한국이 항복하면 취소되며 비용은 환급되지 않습니다. 완료 또는 취소 후 조건을 갖추고 비용을 다시 내면 반복할 수 있습니다."
 HOK_KOR_gangwon_industry_project:0 "강원 전기기기 공장 투자"
 HOK_KOR_gangwon_industry_project_desc:0 "전력을 공급할 수 있어도 전기기기를 만들 설비가 부족하면 각지의 공장은 필요한 기기를 기다려야 합니다. 강원의 전력을 생산에 쓸 전기기기 공장을 세웁니다.\n\n정치력 §Y150§!을 소모하며 민간공장은 점유하지 않습니다. §Y90일§! 후 강원에 슬롯 §G1개§!와 민간공장 §G1개§!를 추가합니다.\n\n이 주의 소유권이나 완전통제를 잃거나 건설 슬롯이 없어지거나 한국이 항복하면 취소되며 비용은 환급되지 않습니다. 완료 또는 취소 후 조건을 갖추고 비용을 다시 내면 반복할 수 있습니다."
 HOK_KOR_chungcheong_industry_project:0 "충청 부품공장 투자"
 HOK_KOR_chungcheong_industry_project_desc:0 "큰 공장의 조립선도 작은 부품 하나가 늦으면 멈춥니다. 완성품보다 먼저 도착할 부품을 충청에서 만들도록 가공과 납품의 기반을 늘립니다.\n\n정치력 §Y150§!을 소모하며 민간공장은 점유하지 않습니다. §Y90일§! 후 충청에 슬롯 §G1개§!와 민간공장 §G1개§!를 추가합니다.\n\n이 주의 소유권이나 완전통제를 잃거나 건설 슬롯이 없어지거나 한국이 항복하면 취소되며 비용은 환급되지 않습니다. 완료 또는 취소 후 조건을 갖추고 비용을 다시 내면 반복할 수 있습니다."
 HOK_KOR_gyeongsang_shipbuilding_project:0 "경상 수출조선소 투자"
 HOK_KOR_gyeongsang_shipbuilding_project_desc:0 "선박 주문을 받아도 선체를 조립할 자리가 모자라면 항만의 계약서는 납기를 기다리는 서류로 남습니다. 계약서 속 선박을 건조할 자리를 경상에 마련합니다.\n\n정치력 §Y150§!을 소모하며 민간공장은 점유하지 않습니다. 해안에 접한 경상에 건설 부지가 필요하며, §Y90일§! 후 슬롯 §G1개§!와 조선소 §G1개§!를 추가합니다.\n\n이 주의 소유권이나 완전통제를 잃거나 건설 슬롯이 없어지거나 한국이 항복하면 취소되며 비용은 환급되지 않습니다. 완료 또는 취소 후 조건을 갖추고 비용을 다시 내면 반복할 수 있습니다."
 HOK_KOR_integrated_production_planning_tt:0 "선택한 생산 정책의 국민정신을 상위 단계로 교체합니다.\n§Y표준규격 대량생산§!: 생산효율 상한 §G+30%§!, 생산라인 전환 시 효율 유지 §R-5%§!.\n§Y유연한 생산라인§!: 생산라인 전환 시 효율 유지 §G+40%§!, 생산효율 상한 §R-2.5%§!. 이전 단계와 중첩되지 않으며 두 정책의 효과를 동시에 받지 않습니다."
