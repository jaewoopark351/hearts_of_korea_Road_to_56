 HOK_KOR_civic_ui_leader_tt:0 "The current head of the Korean government, shown using an existing leader portrait."
 HOK_KOR_civic_ui_leader_unmapped_tt:0 "No panel portrait is registered for the current leader. The name and office still reflect the current government."
 HOK_KOR_civic_ui_chaebol_tt:0 "The chaebol exercise influence through investment, production and supply contracts. Their influence and accumulated procurement corruption are tracked separately."
 HOK_KOR_civic_ui_civic_tt:0 "Civil society supports labour, education, fair appointments and public oversight. Reform brings benefits alongside consumer-goods demands and resistance from entrenched interests."
 HOK_KOR_civic_ui_corruption_tt:0 "Procurement corruption accumulates through privileged contracts and waived inspections. Poor procurement burdens apply at 40; severe cartel burdens apply at 70. Investigations, inspections and supplier replacement can reduce it."
 HOK_KOR_civic_ui_capture_tt:0 "Institutional capture measures the power of networks that obstruct administration and investigations. It can outlast chaebol influence and threaten a reforming government."
 HOK_KOR_civic_ui_support_chaebol_tt:0 "Spend 50 political power to raise chaebol influence by up to 10. Support is unavailable at 100 and restraint at 0. Privileged dependence increases corruption and capture. All support and restraint actions share a 90-day cooldown."
 HOK_KOR_civic_ui_suppress_chaebol_tt:0 "Spend 50 political power to lower chaebol influence by up to 10. Support is unavailable at 100 and restraint at 0. Stronger oversight reduces corruption but may provoke entrenched interests. All support and restraint actions share a 90-day cooldown."
 HOK_KOR_civic_ui_support_civic_tt:0 "Spend 50 political power to raise civil-society influence by up to 10. Support is unavailable at 100 and restraint at 0. Public oversight reduces corruption and broadens reform support. All support and restraint actions share a 90-day cooldown."
 HOK_KOR_civic_ui_suppress_civic_tt:0 "Spend 50 political power to lower civil-society influence by up to 10. Support is unavailable at 100 and restraint at 0. Weakened oversight and repression increase corruption and social burdens. All support and restraint actions share a 90-day cooldown."
 HOK_KOR_civic_ui_actions_locked:0 "Complete the Industrial and Social Compact focus to support or restrain factions."
