#20261003_kpopmodder: Apply varied HOI4 fascist and communist voices to description narrative; preserve effects and explicit rules.
#20261003_kpopmodder: Explain new decision and spirit policies through concrete circumstances; preserve gameplay and lifecycle rules.
#20260926_kpopmodder: Use escaped ASCII dialogue quotes and compact decision UI text; preserve gameplay and explicit lifecycle warnings.
#20260926_kpopmodder: Compact new focus descriptions for the fixed-height UI; preserve gameplay and non-focus localisation.
#20260926_kpopmodder: Restore fictional class-conscious and hardline planning voices while preserving all gameplay rules.
#20260925_kpopmodder: Rewrite focus, decision and event prose with grounded voices; preserve keys, gameplay rules and paired Korean text.
 #20260922_kpopmodder: Describe technical diffusion, production administration, and programs sharing the governance limits.
 HOK_KOR_yeo_rural_service_survey:0 "농촌 공동업무 조사"
 HOK_KOR_yeo_rural_service_survey_desc:0 "\"그 장부는 부농만 읽을 줄 아는 겁니까?\"\n조합원이 서기 옆에 의자를 놓습니다. 공동 회계·설비 업무를 조사하여 함께 다룰 기술부터 갖추겠습니다."
 HOK_KOR_yeo_cooperative_advisers:0 "조합 기술상담소"
 HOK_KOR_yeo_cooperative_advisers_desc:0 "\"손이 더러워서...\" \"그 손이 가져온 문제를 풀러 온 거요.\"\n조합 기술상담소가 연구실의 지식을 고장 난 설비와 작업대로 가져가겠습니다."
 HOK_KOR_yeo_workshop_bulletins:0 "작업장 기술회보"
 HOK_KOR_yeo_workshop_bulletins_desc:0 "\"실패까지 실으면 웃음거리가 되겠소.\"\n\"다른 동무가 같은 쇠를 버리게 둘 순 없지.\"\n기술회보로 현장의 성공과 실패를 함께 나누겠습니다."
 HOK_KOR_yeo_joint_service_accounts:0 "공동업무 회계 공개"
 HOK_KOR_yeo_joint_service_accounts_desc:0 "\"우리 모두의 돈이라 묻는 거요.\"\n조합 지원의 비용과 성과를 공개합니다. 순회 기술교육·농촌 기반시설 지원 사업을 엽니다."
 HOK_KOR_yeo_technical_extension:0 "전국 조합 기술보급망"
 HOK_KOR_yeo_technical_extension_desc:0 "들판의 질문을 연구실로, 연구실의 답을 작업대로 보내겠습니다. 전국의 상담소와 회보를 이어 기술이 모든 조합원의 손에 닿게 하겠습니다."
 HOK_KOR_pak_planning_secretariat:0 "국가계획 사무국"
 HOK_KOR_pak_planning_secretariat_desc:0 "\"모두 당의 지시를 따랐습니다.\" \"그럼 각자 맡은 지시부터 적으시오.\"\n계획과 보고를 국가계획 사무국에 모아 책임과 처리 순서를 정하겠습니다."
 HOK_KOR_pak_provincial_plan_offices:0 "지방계획 연락소"
 HOK_KOR_pak_provincial_plan_offices_desc:0 "\"전달은 끝났습니다.\"\n\"실적이 돌아올 때까지 끝난 것이 아니오.\"\n지방계획 연락소가 중앙의 명령과 현장의 답변을 잇겠습니다."
 HOK_KOR_pak_technical_delegates:0 "현장 기술대표단"
 HOK_KOR_pak_technical_delegates_desc:0 "\"이 쇳조각도 사상검토를 받으면 붙습니까?\"\n기술대표가 설비의 한계를 계획·연구에 반영합니다. 공정 전환 관리·신규 생산선 가동 지원 사업을 엽니다."
 HOK_KOR_pak_plan_review_sessions:0 "계획실적 검토회의"
 HOK_KOR_pak_plan_review_sessions_desc:0 "\"미달 사유서입니까?\" \"아직은.\"\n닫힌 회의실에서 보고와 실적을 대조하겠습니다. 담당 기관의 오늘 다짐은 다음 회의에 집행 결과로 돌아와야 합니다."
 HOK_KOR_yeo_technical_extension_1:0 "조합 기술보급 I"
 HOK_KOR_yeo_technical_extension_1_desc:0 "지식이 소수의 책상에만 머문다면 배움의 해방을 선언한 보람이 없습니다. 조합 기술상담소는 연구기관의 답을 작업장과 기반시설 공사에 전하고, 현장에서 얻은 질문을 다시 연구실로 보냅니다. 거친 손으로 공구를 잡는 사람도 우리 기술의 주인입니다. 그 손이 가져온 문제부터 함께 풀겠습니다.\n\n공산정부를 잃으면 제거됩니다."
 HOK_KOR_yeo_technical_extension_2:0 "조합 기술보급 II"
 HOK_KOR_yeo_technical_extension_2_desc:0 "어느 조합이 힘들여 얻은 답을 다른 조합이 처음부터 다시 찾아야 한다면 우리는 아직 충분히 연결되지 못한 것입니다. 전국의 상담소와 기술회보가 사례를 나누고 현장의 질문을 연구기관으로 돌려보냅니다. 우리의 자랑은 기술을 혼자 아는 몇 사람이 아니라, 그 기술로 연구와 공사를 함께 이어 가는 조합들입니다.\n\n같은 계열의 I단계를 대체하며 하위 단계의 혜택을 유지·강화합니다. 공산정부를 잃으면 제거됩니다."
 HOK_KOR_pak_planning_administration_1:0 "계획행정 I"
 HOK_KOR_pak_planning_administration_1_desc:0 "중앙이 생산 품목을 바꾸면 현장은 새 지시에 따라야 합니다. 그러나 노동자의 숙련도 인민의 재산인데, 새 공문이 왔다고 그 재산까지 버릴 수는 없습니다. 계획과 현장 보고를 연결해 바뀌는 작업과 이어 쓸 경험을 함께 기록합니다. 계획의 전환이 숙련의 상실이 되지 않게 하는 것도 국가의 책임입니다.\n\n공산정부를 잃으면 제거됩니다."
 HOK_KOR_pak_planning_administration_2:0 "계획행정 II"
 HOK_KOR_pak_planning_administration_2_desc:0 "생산계획을 바꾸는 권한은 중앙에 있습니다. 작업자의 손까지 새것으로 바꾸는 권한은 아직 없으니, 현장 기술대표가 남긴 경험을 제대로 써야 합니다. 이전 공정의 기록을 다음 지시와 함께 전달하고 새 생산선의 가동 절차도 미리 익힙니다. 우리의 계획이 현장의 준비보다 먼저 완성되는 관행을 줄여 갑니다.\n\n품목 전환의 효율 보존을 강화하고 신규 생산선의 시작 효율도 높입니다. 기존 생산선의 효율을 즉시 올리는 효과는 아닙니다. 같은 계열의 I단계를 대체하며 공산정부를 잃으면 제거됩니다."
 HOK_KOR_yeo_mobile_technical_training_project:0 "순회 기술교육"
 HOK_KOR_yeo_mobile_technical_training_project_desc:0 "\"동무, 배웠으면 혼자만 알고 있지 마시오.\"\n배움은 모두의 것이라 선언했지만 연구실의 문턱과 조합의 작업대 사이에는 아직 먼 길이 있습니다. 순회 교관이 그 길을 오가며 새 기술을 가르치고 현장의 질문을 교육과 연구로 연결합니다. 가르치러 간 사람도 배워 돌아와야 합니다. 그래야 우리 모두의 기술이 되지 않겠소?\n\n정치력 150을 소모하며 효과는 즉시 시작해 90일간 적용됩니다. 민간공장은 점유하지 않습니다. 후속 내정사업은 한 번에 하나만 진행하며, 종료·취소 후 이 범주 전체가 90일간 대기합니다. 공산 경제정책 사업과는 각각 하나씩 병행할 수 있습니다. 공산정부나 해금 조건 상실, 항복·내전 시 취소되며 비용은 환급되지 않습니다."
 HOK_KOR_yeo_rural_infrastructure_project:0 "농촌 기반시설 지원"
 HOK_KOR_yeo_rural_infrastructure_project_desc:0 "\"곡식을 실어 나를 길도 없이 풍년만 자랑하자는 거요?\"\n노농의 나라가 얻은 풍요를 길가에서 기다리게 할 수는 없습니다. 조합이 인력과 장비의 일정을 맞추고 마을마다 따로 준비하던 자재와 작업을 함께 조정하겠습니다. 우리의 연대가 들판과 작업장을 잇는 길에서도 드러나게 합시다. 훌륭한 표어는 곡식을 운반해 주지 않습니다.\n\n사업 효과는 전국의 기반시설 건설에 적용됩니다. 정치력 150을 소모하며 효과는 즉시 시작해 90일간 적용됩니다. 민간공장은 점유하지 않습니다. 후속 내정사업은 한 번에 하나만 진행하며, 종료·취소 후 이 범주 전체가 90일간 대기합니다. 공산 경제정책 사업과는 각각 하나씩 병행할 수 있습니다. 공산정부나 해금 조건 상실, 항복·내전 시 취소되며 비용은 환급되지 않습니다."
 HOK_KOR_pak_process_conversion_project:0 "생산공정 전환 관리"
 HOK_KOR_pak_process_conversion_project_desc:0 "\"새 계획이라고 우리 손까지 새것으로 바꿀 수는 없소.\"\n새 계획을 따르자는 데 이견이 없다고 해서 쇠를 깎던 경험까지 새것이 되는 것은 아닙니다. 이전 공정의 기록과 설비 조정 순서를 새 품목에 맞춰 활용하여 축적한 생산 효율을 더 많이 지킵니다. 국가가 바꾸려는 것은 생산 품목이지, 인민이 어렵게 익힌 손의 기억이 아닙니다.\n\n정치력 150을 소모하며 효과는 즉시 시작해 90일간 적용됩니다. 민간공장은 점유하지 않습니다. 후속 내정사업은 한 번에 하나만 진행하며, 종료·취소 후 이 범주 전체가 90일간 대기합니다. 공산 경제정책 사업과는 각각 하나씩 병행할 수 있습니다. 공산정부나 해금 조건 상실, 항복·내전 시 취소되며 비용은 환급되지 않습니다."
 HOK_KOR_pak_new_production_lines_project:0 "신규 생산선 가동 지원"
 HOK_KOR_pak_new_production_lines_project_desc:0 "\"계획서에는 벌써 돌아간답니다.\" \"그러니 우리가 먼저 익숙해져야지.\"\n우리 계획의 낙관은 새 생산선의 첫날부터 시작됩니다. 현장도 그 낙관을 따라가려면 가동 절차를 미리 익히고 설비 준비를 맞춰야 합니다. 새 생산선의 시작 효율을 높여 계획과 작업장 사이의 출발 간격을 줄이겠습니다. 첫 보고서가 훌륭하다는 사실만으로 작업자가 기계에 익숙해지지는 않으니 말입니다.\n\n기존 생산선의 효율을 즉시 올리지는 않습니다. 정치력 150을 소모하며 효과는 즉시 시작해 90일간 적용됩니다. 민간공장은 점유하지 않습니다. 후속 내정사업은 한 번에 하나만 진행하며, 종료·취소 후 이 범주 전체가 90일간 대기합니다. 공산 경제정책 사업과는 각각 하나씩 병행할 수 있습니다. 공산정부나 해금 조건 상실, 항복·내전 시 취소되며 비용은 환급되지 않습니다."
