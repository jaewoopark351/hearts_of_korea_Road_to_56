l_korean:
#20261003_kpopmodder: Explain new decision and spirit policies through concrete circumstances; preserve gameplay and lifecycle rules.
#20261002_kpopmodder: Explain the scrap-collection tier through discarded metal and the need to recover scarce raw materials.
#20261002_kpopmodder: Explain the need for permanent and emergency material recycling in spirit prose instead of repeating mechanics.
#20261002_kpopmodder: Describe the strengthened material-cycle tiers and the repeatable 90-day emergency program.
#20260926_kpopmodder: Use escaped ASCII dialogue quotes and compact decision UI text; preserve gameplay and explicit lifecycle warnings.
#20260926_kpopmodder: Compact new focus descriptions for the fixed-height UI; preserve gameplay and non-focus localisation.
#20260925_kpopmodder: Rewrite focus, decision and event prose with grounded voices; preserve keys, gameplay rules and paired Korean text.
#20260923_kpopmodder: Describe regional operating conditions and shared field-specialization rewards.
 HOK_KOR_cmn_export_invoices:0 "수출거래 명세"
 HOK_KOR_cmn_export_invoices_desc:0 "물건을 보냈는데 대금이 묶이면 다음 달의 작업도 멈춥니다. 계약과 결제 기록을 맞추어 상품의 값이 공장으로 돌아오게 하겠습니다."
 HOK_KOR_cmn_commercial_arbitration:0 "상거래 중재절차"
 HOK_KOR_cmn_commercial_arbitration_desc:0 "불량의 책임을 다투는 동안 다음 주문이 끊깁니다. 상거래 중재 기준을 세워 수출업체가 거래와 설비 투자를 이어가게 하겠습니다."
 HOK_KOR_cmn_shipping_documents:0 "선적서류 통일"
 HOK_KOR_cmn_shipping_documents_desc:0 "짐은 부두에 있는데 서류가 달라 배에 싣지 못합니다. 선적 서식과 통신을 통일하여 화물보다 서류가 늦는 일을 줄이겠습니다."
 HOK_KOR_cmn_market_sampling:0 "해외시장 견본"
 HOK_KOR_cmn_market_sampling_desc:0 "\"값은 알겠소. 직접 만져 볼 수는 없습니까?\"\n거래와 선적 체계에 견본 전시를 더해 첫 주문을 끌어내겠습니다."
 HOK_KOR_cmn_export_settlement:0 "수출대금 결제관행"
 HOK_KOR_cmn_export_settlement_desc:0 "수출대금이 들어오는 날을 알아야 원료와 품삯을 준비합니다. 결제 관행을 정착시켜 한 번의 주문을 다음 투자로 잇겠습니다."
 HOK_KOR_cmn_ore_classification:0 "원료 광종분류"
 HOK_KOR_cmn_ore_classification_desc:0 "비슷해 보이는 돌도 용광로에서는 다릅니다. 광종과 공정별 원료를 조사하여 어디에 무엇을 쓸지 산업 연구로 밝혀내겠습니다."
 HOK_KOR_cmn_scrap_collection:0 "폐금속 수거망"
 HOK_KOR_cmn_scrap_collection_desc:0 "공장 뒤의 쇳조각도 다시 쓸 원료입니다. 폐금속과 부산물을 회수하여 새 원료가 부족할 때 손에 쥔 것부터 살리겠습니다."
 HOK_KOR_cmn_coke_testing:0 "코크스 품질시험"
 HOK_KOR_cmn_coke_testing_desc:0 "불이 붙는다고 같은 연료는 아닙니다. 코크스와 광물의 품질을 시험하고 결과를 채굴 현장에 돌려보내겠습니다."
 HOK_KOR_cmn_foundry_exchange:0 "제련 현장교류"
 HOK_KOR_cmn_foundry_exchange_desc:0 "옆 공장도 같은 실패를 되풀이할 필요는 없습니다. 수거망과 품질시험을 갖춘 제련소들이 경험을 나누고 설비에 재투자하게 하겠습니다."
 HOK_KOR_cmn_closed_material_cycle:0 "원료 순환체계"
 HOK_KOR_cmn_closed_material_cycle_desc:0 "수거한 원료가 창고에서 잊혀져서는 안 됩니다. 품질시험과 재투입까지 이어 자원 생산과 원료 부족 대응을 강화하겠습니다."
 HOK_KOR_cmn_motor_driver_courses:0 "기동부대 운전과정"
 HOK_KOR_cmn_motor_driver_courses_desc:0 "\"차는 움직일 줄 압니다.\"\n\"앞차가 멈추면 뒤의 종대는?\"\n운전대를 잡는 법을 넘어 부대 전체를 움직이는 법을 가르치겠습니다."
 HOK_KOR_cmn_mechanized_loading:0 "기계화 승하차훈련"
 HOK_KOR_cmn_mechanized_loading_desc:0 "차량만 떠나고 장비가 땅에 남으면 기동이 아닙니다. 승하차와 정비 순서를 맞추어 사람과 장비가 함께 움직이게 하겠습니다."
 HOK_KOR_cmn_march_discipline:0 "기동종대 규율"
 HOK_KOR_cmn_march_discipline_desc:0 "선두의 도착이 종대 전체의 도착은 아닙니다. 무선 연락과 행군 기록을 맞추어 뒤처진 차량까지 파악하겠습니다."
 HOK_KOR_cmn_mobile_unit_recovery:0 "기동부대 재정렬"
 HOK_KOR_cmn_mobile_unit_recovery_desc:0 "목적지에 도착한 차량들을 다시 부대로 모아야 합니다. 기계화 운용과 행군 규율을 결합해 재정렬 때도 시간과 연료를 아끼겠습니다."
 HOK_KOR_cmn_emergency_turn_drills:0 "긴급변침 연습"
 HOK_KOR_cmn_emergency_turn_drills_desc:0 "함대가 침로를 바꿀 때 손상된 배를 놓쳐서는 안 됩니다. 긴급변침과 이탈을 반복하여 각 함정이 제 차례와 거리를 익히게 하겠습니다."
 HOK_KOR_cmn_smoke_screen_procedures:0 "연막 이탈절차"
 HOK_KOR_cmn_smoke_screen_procedures_desc:0 "연막은 펼쳤지만 돌아갈 방향을 모르면 철수가 아닙니다. 초기 교전 뒤의 신호와 이탈 절차를 익혀 함대를 빠져나오게 하겠습니다."
 HOK_KOR_cmn_rescue_station_drills:0 "해상구조 당직"
 HOK_KOR_cmn_rescue_station_drills_desc:0 "구조 요청을 받은 뒤 준비를 시작해서는 늦습니다. 당직과 지원 함정, 수리 절차를 정비하여 먼 바다에서도 서로를 지키겠습니다."
 HOK_KOR_cmn_flight_weather_logs:0 "비행기상 일지"
 HOK_KOR_cmn_flight_weather_logs_desc:0 "출발지의 맑은 하늘이 목적지까지 이어지지는 않습니다. 비행장별 기상 일지와 통신으로 다음 조종사에게 관측을 전하겠습니다."
 HOK_KOR_cmn_instrument_approaches:0 "계기접근 절차"
 HOK_KOR_cmn_instrument_approaches_desc:0 "\"활주로가 보이지 않습니다.\"\n\"계기를 확인하고, 익힌 절차대로.\"\n시야를 잃기 전에 계기접근과 착륙을 배워야 합니다."
 HOK_KOR_cmn_adverse_weather_flying:0 "악천후 비행규정"
 HOK_KOR_cmn_adverse_weather_flying_desc:0 "돌아올 때의 하늘은 다를 수 있습니다. 관측과 교범으로 악천후의 부담을 줄이겠습니다. 계기비행 가지와 함께 추진할 수 있습니다."
 HOK_KOR_cmn_export_practice_1:0 "수출거래 체계 I"
 HOK_KOR_cmn_export_practice_1_desc:0 "물건을 보내고도 대금을 받지 못하면 공장은 다음 주문에 쓸 원료와 품삯을 마련할 수 없습니다. 거래 명세와 중재 절차를 갖추어 판매자와 구매자가 같은 계약을 확인하게 했습니다. 분쟁과 결제 지연에 묶이던 자금이 다시 설비 투자로 돌아갈 바탕이 마련되었습니다.\n\n집권 이념이 바뀌어도 유지되는 공통 산업 제도입니다."
 HOK_KOR_cmn_export_practice_2:0 "수출거래 체계 II"
 HOK_KOR_cmn_export_practice_2_desc:0 "수출품이 부두에 도착해도 서류가 맞지 않으면 배에 오르지 못하고, 대금이 언제 들어올지 모르면 다음 생산도 준비하기 어렵습니다. 선적 서식과 결제 관행을 거래 체계에 연결하여 주문부터 입금까지 책임을 이어갑니다. 해외의 첫 주문이 꾸준한 거래와 공장 확충으로 이어지도록 실무가 정착했습니다.\n\nI단계를 대체하며 집권 이념이 바뀌어도 유지됩니다."
 HOK_KOR_cmn_material_cycle_1:0 "원료 순환체계 I"
 HOK_KOR_cmn_material_cycle_1_desc:0 "공장 뒤편에 버려진 쇳조각과 수명을 다한 기계 부품에도 다시 쓸 금속이 남아 있습니다. 새 원료가 부족할수록 한 번 들여온 자재를 끝까지 써야 합니다. 수거망은 작업장마다 흩어진 폐금속을 모으고, 다시 쓸 금속을 가려 제련소로 보냅니다. 버려지던 금속이 다시 용광로로 돌아갈 때, 원료를 기다리던 공장도 다음 작업을 이어 갈 수 있습니다."
 HOK_KOR_cmn_material_cycle_2:0 "원료 순환체계 II"
 HOK_KOR_cmn_material_cycle_2_desc:0 "광산에서 캐내는 원료만으로는 늘어나는 공장의 수요를 감당하기 어렵습니다. 수입에만 기대면 먼바다의 사정 하나로 용광로와 작업대가 멈출 수 있습니다. 공장에서 잘려 나온 쇳조각과 닳아서 버린 기계 부품에도 다시 쓸 금속이 남아 있습니다. 이를 재질별로 가려내고 녹여 필요한 공장으로 돌려보내는 순환망은 새 원료가 제때 들어오지 않아도 생산을 이어 갈 바탕이 됩니다."
 HOK_KOR_cmn_mobile_operations_1:0 "기동부대 운용 I"
 HOK_KOR_cmn_mobile_operations_1_desc:0 "선두 차량이 목적지에 도착해도 뒤의 병력과 장비가 흩어져 있으면 부대는 움직일 준비가 되지 않은 것입니다. 운전과 승하차, 정비 순서를 함께 익혀 출발 때부터 사람과 차량을 한 종대로 묶습니다. 길 위에서 되풀이하던 정차와 공회전을 줄여 다음 이동을 준비합니다.\n\n혜택은 육군 전체에 적용되며 집권 이념이 바뀌어도 유지됩니다."
 HOK_KOR_cmn_mobile_operations_2:0 "기동부대 운용 II"
 HOK_KOR_cmn_mobile_operations_2_desc:0 "앞차가 멈춘 이유를 뒤차가 모르면 짧은 고장이 긴 정체로 번집니다. 무선 연락과 행군 기록으로 뒤처진 차량을 파악하고, 도착한 병력을 다시 부대로 모으는 절차를 정착시켰습니다. 운전과 정비에 종대 전체의 조정을 더해 사람과 연료를 기다림에 낭비하지 않도록 합니다.\n\nI단계를 대체합니다. 혜택은 육군 전체에 적용되며 집권 이념이 바뀌어도 유지됩니다."
 HOK_KOR_cmn_smoke_withdrawal:0 "함대 이탈절차"
 HOK_KOR_cmn_smoke_withdrawal_desc:0 "적을 발견한 뒤에는 모든 함정이 같은 순간에 돌아설 수 없습니다. 손상된 배와 뒤따르는 함정이 서로의 침로를 막지 않도록 이탈 신호와 연막 사용 순서를 반복해 익힙니다. 초기 교전 뒤 물러나야 할 때도 각 함정이 제 차례와 거리를 알고 움직이도록 마련한 절차입니다.\n\n집권 이념이 바뀌어도 유지되는 공통 해군 제도입니다."
 HOK_KOR_cmn_maritime_rescue:0 "해상구조 체계"
 HOK_KOR_cmn_maritime_rescue_desc:0 "먼바다에서 구조 요청을 받은 뒤에 예비 부품과 지원 함정을 찾기 시작해서는 늦습니다. 당직 중인 함정과 수리 인력이 연락을 이어 가며, 항해 중 문제가 생긴 배가 어디에서 도움을 받을지 미리 준비합니다. 함대가 모항에서 멀어져도 서로를 지원하고 손상된 배를 다시 항해에 투입할 기반입니다.\n\n집권 이념이 바뀌어도 유지되는 공통 해군 제도입니다."
 HOK_KOR_cmn_instrument_flying:0 "계기비행 체계"
 HOK_KOR_cmn_instrument_flying_desc:0 "구름 속에서 활주로가 보이지 않을 때 조종사의 감각만으로 비행기를 이끌 수는 없습니다. 비행장과 조종사가 같은 접근 절차를 사용하고, 계기를 확인하는 순서를 훈련합니다. 시야를 잃어도 준비한 절차에 따라 돌아올 수 있도록 사고의 위험을 줄이는 체계입니다.\n\n집권 이념이 바뀌어도 유지되는 공통 공군 제도입니다."
 HOK_KOR_cmn_weather_flying:0 "악천후 비행교범"
 HOK_KOR_cmn_weather_flying_desc:0 "출발지의 맑은 하늘이 목적지까지 이어지지는 않습니다. 비행장별 관측과 앞서 돌아온 조종사의 기록을 모아 바람과 구름이 작전에 주는 부담을 교범에 반영합니다. 바뀌는 기상 속에서도 관측을 전달하고 익힌 절차로 임무를 수행할 준비를 갖췄습니다.\n\n계기비행 체계와 별도로 적용되며 집권 이념이 바뀌어도 유지됩니다."
 HOK_KOR_cmn_material_cycle_projects:0 "원료 순환 집중 지원"
 HOK_KOR_cmn_material_cycle_projects_desc:0 "수거할 금속이 남아 있어도 집하장과 선별 시설이 밀리면 제련소는 원료를 기다려야 합니다. 상설 순환망이 급증한 수요를 따라가도록 회수·선별·재투입 시설과 운송을 집중 지원합니다.\n\n긴급 시설 확충은 별도의 90일 국민정신으로 적용됩니다. 다른 지역 사업의 동시 진행 제한과 종료 후 대기시간을 사용하지 않습니다."
 HOK_KOR_cmn_emergency_material_cycle:0 "긴급 원료 순환체계 시설 확충"
 HOK_KOR_cmn_emergency_material_cycle_desc:0 "원료를 확보하는 일은 광산에서 새로운 광석을 캐내는 것으로 끝나지 않습니다. 공장에 쌓인 금속 절삭편, 수명을 다한 기계 부품, 폐차량과 철거 자재에도 산업을 다시 움직일 원료가 남아 있습니다. 그러나 기존 수거망과 평상시의 처리 능력만으로는 급증하는 생산 수요에 맞춰 이러한 자재를 빠짐없이 회수하고, 필요한 공장에 제때 공급하기 어렵습니다. 원료 부족이 생산 현장의 병목으로 이어지기 전에 집하장과 선별 시설, 재용해 설비의 처리 능력을 집중적으로 확충하고 철도·창고·제련소 사이의 운송을 조정해야 합니다.\n\n정부는 90일 동안 긴급 행정 지원을 투입하여 지역별 수거 계약과 운송 배정을 정비하고, 회수 원료의 품질 검사와 재투입 기준을 통일할 것입니다. 혼합된 폐금속은 용도에 따라 분리하고, 재사용할 수 있는 부품과 다시 녹여야 하는 자재는 각각 적합한 시설로 보내겠습니다. 공장별 원료 수요와 회수 자재의 공급을 함께 파악하여 창고에 묶인 물자를 줄이고, 원료가 부족한 생산 현장에 우선 공급함으로써 기존 순환체계의 역량을 일시적으로 끌어올릴 것입니다.\n\n이번 사업은 상설 원료 순환체계에 더해 시행하는 한시적인 집중 확충·운영 조치입니다. 긴급 지원이 끝나면 추가 처리와 운송 지원은 종료되지만, 이미 정착한 기본 원료 순환체계는 유지됩니다. 다시 수요가 높아지거나 공급에 압박이 생기면 새로운 정치적·행정적 지원을 투입하여 같은 사업을 재개할 수 있습니다. 진행 중인 사업을 겹쳐 시행하기보다, 정해진 기간 동안 회수와 재투입에 역량을 집중하여 자원 확보를 늘리고 원료 부족에 따른 생산 차질을 줄이겠습니다.\n\n§Y정치력 150§!을 소모하여 §Y90일 동안§! 별도 국민정신으로 자원 획득 효율 §G+30%§!, 자원 부족 불이익 §G-30%§!를 추가합니다. 원료 순환체계 II와 합친 이 정책의 효과는 §G+90%/-90%§!이며, 종료 후 기본 §Y+60%/-60%§!로 돌아갑니다. 활성 중에는 재사용할 수 없으며, 종료 후 별도 대기 없이 다시 사용할 수 있습니다. 사용 횟수에 따른 중첩이나 영구 누적은 없습니다. 내전·항복 또는 기본 국민정신 상실 시 긴급 지원을 종료하며 정치력은 환급하지 않습니다."
 HOK_KOR_cmn_emergency_material_cycle_boost:0 "긴급 원료 순환체계 시설 확충"
 HOK_KOR_cmn_emergency_material_cycle_boost_desc:0 "제련소에서는 녹일 금속을 기다리는데, 다른 공장의 뒤뜰에는 아직 쓸 수 있는 쇳조각이 쌓여 있습니다. 생산이 갑자기 늘어나면 평소의 수거차량과 선별장만으로는 이 자재를 제때 회수하기 어렵습니다. 집하장과 재용해 설비를 서둘러 확충하고 운송편을 늘려 흩어진 금속을 원료가 모자란 공장으로 보내고 있습니다. 새 광산을 열고 먼바다에서 원료가 도착하기를 기다리는 동안에도 용광로의 불은 꺼뜨릴 수 없습니다."
