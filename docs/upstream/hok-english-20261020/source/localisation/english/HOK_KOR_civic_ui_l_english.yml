 HOK_KOR_civic_ui_leader_tt:0 "The current leader of the Korean government. The portrait uses existing leader artwork."
 HOK_KOR_civic_ui_leader_unmapped_tt:0 "No panel portrait has been registered for the current leader. The name and title reflect the current government."
 HOK_KOR_civic_ui_chaebol_tt:0 "The chaebol business conglomerates influence the running of the state through investment, production and supply contracts. Their influence and the procurement corruption already accumulated are tracked separately."
 HOK_KOR_civic_ui_civic_tt:0 "Civil society supports labour, education, fair appointments and public auditing. Securing the benefits of reform requires bearing the consumer goods burden and resisting a backlash from vested interests."
 HOK_KOR_civic_ui_corruption_tt:0 "Procurement corruption accumulates through preferential contracts and skipped inspections. At 40 or above, defective procurement imposes a burden; at 70 or above, corruption cartels impose a severe burden. Accident investigations, inspections and replacement supply chains can reduce it."
 HOK_KOR_civic_ui_capture_tt:0 "Institutional capture measures the extent to which power networks colluding with the chaebol can interfere with administration and investigations. It can persist even after chaebol influence falls, and is linked to the risk of a coup against a reforming government."
 HOK_KOR_civic_ui_support_chaebol_tt:0 "Spend 50 Political Power to raise Chaebol Influence by up to 10. Support is unavailable at 100 influence. Reliance on preferential treatment increases Procurement Corruption and Institutional Capture. All support and restraint actions share a 90-day cooldown."
 HOK_KOR_civic_ui_suppress_chaebol_tt:0 "Spend 50 Political Power to reduce Chaebol Influence by up to 10. Restraint is unavailable at 0 influence. Stronger oversight reduces corruption but may provoke a backlash from vested interests. All support and restraint actions share a 90-day cooldown."
 HOK_KOR_civic_ui_support_civic_tt:0 "Spend 50 Political Power to raise Civil Society Influence by 10. Public scrutiny reduces Procurement Corruption and broadens the foundations of reform. All support and restraint actions share a 90-day cooldown."
 HOK_KOR_civic_ui_suppress_civic_tt:0 "Spend 50 Political Power to reduce Civil Society Influence by 10. Weaker oversight and repression increase corruption and leave society to bear the cost. All support and restraint actions share a 90-day cooldown."
 HOK_KOR_civic_ui_actions_locked:0 "Complete the Industrial and Social Compact focus to unlock support and restraint actions."
