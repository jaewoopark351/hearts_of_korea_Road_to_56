l_english:
#20261011_kpopmodder: Localise independent industrial policies, procurement scandals and the fictional prosecutor-coup chain with exact costs and deadlines.
 HOK_KOR_chaebol_established:0 "Chaebol Industrial Networks"
 HOK_KOR_chaebol_established_desc:0 "Chaebol Influence: 25–49. Corporate investment and supply networks provide a foundation for industrial mobilisation."
 HOK_KOR_chaebol_dominant:0 "Chaebol-led Industrial Mobilisation"
 HOK_KOR_chaebol_dominant_desc:0 "Chaebol Influence of 75 or above gives access to powerful production networks. Under the cooperation policy, corruption and institutional capture also accumulate every month."
 HOK_KOR_civic_established:0 "Organised Civil Society"
 HOK_KOR_civic_established_desc:0 "Civil Society Influence: 25–49. Workplace consultation and publicly available information provide a foundation for implementing policy."
 HOK_KOR_civic_dominant:0 "Public Scrutiny by Civil Society"
 HOK_KOR_civic_dominant_desc:0 "Active when Civil Society Influence is 75 or above. Public scrutiny and continuity in the skilled workforce sustain policy."
 HOK_KOR_chaebol_cooperation:0 "Industrial Cooperation with the Chaebol"
 HOK_KOR_chaebol_cooperation_desc:0 "Rapid factory expansion and production come at a price: when Chaebol Influence is 75 or above, Corruption increases by 2 and Institutional Capture by 1 every month."
 HOK_KOR_civic_reform:0 "Civil Society Industrial Compact"
 HOK_KOR_civic_reform_desc:0 "Workplace consultation and transparent industrial contracts broaden the foundations of production, research, stability and manpower. The public services required slightly increase the consumer goods burden. Corruption: -1 each month. Until institutional capture networks have been dismantled, resistance to reform by vested interests increases Institutional Capture by 1 each month."
 HOK_KOR_public_ownership:0 "Publicly Owned Industrial Networks"
 HOK_KOR_public_ownership_desc:0 "Nationalised industrial networks support production and civilian factory expansion. Existing corporate technology agreements can be retained through a separate policy on contract succession. Corruption: -1 each month."
 HOK_KOR_civic_production_quality:0 "Workplace Quality Compact"
 HOK_KOR_civic_production_quality_desc:0 "Proven processes and continuity among skilled technicians improve production efficiency growth, the efficiency cap and base efficiency."
 HOK_KOR_civic_professional_service:0 "Professional Military Personnel System"
 HOK_KOR_civic_professional_service_desc:0 "Military education and career management improve the attack and logistics skills of newly appointed army commanders, as well as unit recovery."
 HOK_KOR_civic_contract_succession:0 "Technology Agreements under Public Ownership"
 HOK_KOR_civic_contract_succession_desc:0 "Technology agreements and skilled personnel are retained through the change of ownership."
 HOK_KOR_procurement_corruption_moderate:0 "Accumulated Procurement Corruption"
 HOK_KOR_procurement_corruption_moderate_desc:0 "Accumulated Corruption: 40–69. The cost of verifying contracts and the diversion of funds burden research, production and Political Power."
 HOK_KOR_procurement_corruption_severe:0 "Procurement Cartel"
 HOK_KOR_procurement_corruption_severe_desc:0 "Accumulated Corruption: 70 or above. Losses from corruption and preferential treatment severely erode the production gains of the cooperation policy."
 HOK_KOR_air_procurement_accident:0 "Aircraft Procurement Accident"
 HOK_KOR_air_procurement_accident_desc:0 "Fictional expedited deliveries of explosives and ammunition by Korea Explosives, combined with inspections skipped by the consortium, have caused a hangar explosion. Damage to the air wings and the collapse of maintenance arrangements increase the risk of air accidents and reduce mission efficiency and experience gain. Removed on completion of the Aircraft Procurement Recovery decision."
 HOK_KOR_prosecutor_pressure:0 "Backlash Against Reforming Institutions"
 HOK_KOR_prosecutor_pressure_desc:0 "A fictional power network within the prosecution service, colluding with a procurement cartel, is obstructing the reforming government's work. Reduce Institutional Capture below 60 or secure evidence within 90 days."
 HOK_KOR_prosecutorial_takeover_idea:0 "Prosecution Power Network Seizes Government"
 HOK_KOR_prosecutorial_takeover_idea_desc:0 "A fictional power network within the prosecution service has seized control of administration and the budget. The basic benefits of the Civil Society Industrial Compact are suspended. Complete the Restore the Popular Mandate decision to restore them."
 HOK_KOR_fast_air_procurement:0 "Fast-track Aircraft Contracts"
 HOK_KOR_fast_air_procurement_desc:0 "Fictional supply contracts, including expedited deliveries of aviation explosives and ammunition from Korea Explosives, accelerate aircraft research and small aircraft production. Inspections skipped by the supply consortium prompt a safety warning after 30–45 days. Refusing an investigation leads to a hangar explosion."
 HOK_KOR_fast_rocket_procurement:0 "Fast-track Propellant Contracts"
 HOK_KOR_fast_rocket_procurement_desc:0 "A fictional propellant contract with Korea Explosives accelerates rocket research and rocket Special Projects. A safety warning arrives after 30–45 days. Refusing an investigation leads to an explosion."
 HOK_KOR_rocket_procurement_accident:0 "Propellant Factory Explosion"
 HOK_KOR_rocket_procurement_accident_desc:0 "An explosion has occurred at a fictional Korea Explosives propellant factory after safety warnings over fast-track deliveries were ignored. Propellant certification and testing schedules have been suspended, delaying rocket research and rocket Special Projects. Removed on completion of the Propellant Procurement Recovery decision."
 HOK_KOR_support_chaebol_tt:0 "Chaebol Influence +10, Accumulated Corruption +5, Institutional Capture +3. Costs 50 Political Power and applies a shared 90-day cooldown to all support and restraint actions."
 HOK_KOR_suppress_chaebol_tt:0 "Chaebol Influence -10, Accumulated Corruption -3. Resistance from vested interests increases Institutional Capture by 4. Costs 50 Political Power and applies a shared 90-day cooldown to all support and restraint actions."
 HOK_KOR_support_civic_tt:0 "Civil Society Influence +10, Accumulated Corruption -2. Under the civic reform policy, resistance from vested interests increases Institutional Capture by 3. Costs 50 Political Power and applies a shared 90-day cooldown to all support and restraint actions."
 HOK_KOR_suppress_civic_tt:0 "Civil Society Influence -10, Accumulated Corruption +8, Institutional Capture +5. Costs 50 Political Power and applies a shared 90-day cooldown to all support and restraint actions."
 HOK_KOR_civic_balance:0 "Chaebol and Civil Society"
 HOK_KOR_civic_balance_desc:0 "The two influence levels change independently and do not have a fixed total of 100. Support and restraint actions cost 50 Political Power and share a 90-day cooldown. Procurement losses increase at Accumulated Corruption levels of 40 and 70. When civic reform coincides with Institutional Capture of 60 or above, a fictional power network within the prosecution service launches a counterattack."
 HOK_KOR_procurement_integrity:0 "Military Procurement and Public Verification"
 HOK_KOR_procurement_integrity_desc:0 "The chaebol's industrial networks allow aircraft and propellant contracts to be fast-tracked. The two contracts share a 365-day cooldown and a single active contract slot. No new fast-track contract can begin during an investigation or recovery. Investigating a warning means giving up the benefits and spending 60 days on verification. Ignoring it causes an accident 45–90 days after the contract begins. This procurement scandal is an alternate-history event."
 HOK_KOR_support_chaebol:0 "Support the Chaebol"
 HOK_KOR_support_chaebol_desc:0 "Chaebol Influence +10, Accumulated Corruption +5, Institutional Capture +3. Costs 50 Political Power and applies a shared 90-day cooldown to all support and restraint actions."
 HOK_KOR_suppress_chaebol:0 "Restrain the Chaebol"
 HOK_KOR_suppress_chaebol_desc:0 "Chaebol Influence -10, Accumulated Corruption -3. Resistance from vested interests increases Institutional Capture by 4. Costs 50 Political Power and applies a shared 90-day cooldown to all support and restraint actions."
 HOK_KOR_support_civic:0 "Support Civil Society"
 HOK_KOR_support_civic_desc:0 "Civil Society Influence +10, Accumulated Corruption -2. Under the civic reform policy, resistance from vested interests increases Institutional Capture by 3. Costs 50 Political Power and applies a shared 90-day cooldown to all support and restraint actions."
 HOK_KOR_suppress_civic:0 "Restrain Civil Society"
 HOK_KOR_suppress_civic_desc:0 "Civil Society Influence -10, Accumulated Corruption +8, Institutional Capture +5. Costs 50 Political Power and applies a shared 90-day cooldown to all support and restraint actions."
 HOK_KOR_secure_prosecutorial_records:0 "Secure Evidence Against the Prosecution Power Network"
 HOK_KOR_secure_prosecutorial_records_desc:0 "Secure evidence within the 90-day crisis. Costs 150 Political Power and takes 45 days. Institutional Capture -15. Securing evidence stops the current coup crisis, but another counterattack may occur later unless institutional reform is completed."
 HOK_KOR_break_capture_networks:0 "Dismantle Institutional Capture Networks"
 HOK_KOR_break_capture_networks_desc:0 "Spend 200 Political Power and 60 days making personnel, budget and procurement records public. Stability -5% when started. On completion: Institutional Capture -25, Accumulated Corruption -10, Civil Society Influence +5. Ends the monthly increase in Institutional Capture caused by resistance to reform. Subsequent support or restraint actions, or cover-ups, can raise Institutional Capture again."
 HOK_KOR_restore_civilian_mandate:0 "Restore the Popular Mandate"
 HOK_KOR_restore_civilian_mandate_desc:0 "Requires Civil Society Influence of at least 50. Costs 200 Political Power and takes 90 days. Ends the fictional prosecution network's takeover of government and restores the basic benefits of the Civil Society Industrial Compact. On completion: Institutional Capture -30, Accumulated Corruption -10, Stability +5%."
 HOK_KOR_prosecutor_coup_countdown:0 "Prosecution Coup Deadline"
 HOK_KOR_prosecutor_coup_countdown_desc:0 "Within 90 days, reduce Institutional Capture below 60 or complete the decision to secure evidence. Failure results in a prosecution takeover of government and suspends the basic benefits of the Civil Society Industrial Compact."
 HOK_KOR_independent_procurement_audit:0 "Independent Procurement Audit"
 HOK_KOR_independent_procurement_audit_desc:0 "Costs 100 Political Power and takes 60 days. On completion: Accumulated Corruption -12, Institutional Capture -5. A 180-day cooldown begins when the audit is completed. Warnings about defects and accidents in each sector must be addressed through their respective investigation and recovery procedures."
 HOK_KOR_fast_track_air_contracts:0 "Fast-track Aircraft Contracts"
 HOK_KOR_fast_track_air_contracts_desc:0 "Requires Chaebol Influence of at least 40. Costs 75 Political Power. Grants fast-track benefits for the sector, with Accumulated Corruption +10 and Institutional Capture +5. The benefits last for a maximum of 180 days, but a defect warning arrives after 30–45 days, and an investigation or accident ends them immediately. Ignoring the warning causes an accident 45–90 days after the contract begins. Aircraft and rocket contracts share a single active contract slot and a 365-day cooldown. No new fast-track contract can begin while an investigation or recovery is under way, or while the effects of an accident remain."
 HOK_KOR_recover_air_procurement:0 "Aircraft Procurement Recovery"
 HOK_KOR_recover_air_procurement_desc:0 "Costs 150 Political Power and takes 60 days. Completing independent tests, safety checks and the rebuilding of the supply system removes the accident National Spirit for this sector. On completion: Accumulated Corruption -10, Institutional Capture -5. The contract's 365-day cooldown remains in force."
 HOK_KOR_fast_track_rocket_contracts:0 "Fast-track Propellant Contracts"
 HOK_KOR_fast_track_rocket_contracts_desc:0 "Requires Chaebol Influence of at least 40. Costs 75 Political Power. Grants fast-track benefits for the sector, with Accumulated Corruption +10 and Institutional Capture +5. The benefits last for a maximum of 180 days, but a defect warning arrives after 30–45 days, and an investigation or accident ends them immediately. Ignoring the warning causes an accident 45–90 days after the contract begins. Aircraft and rocket contracts share a single active contract slot and a 365-day cooldown. No new fast-track contract can begin while an investigation or recovery is under way, or while the effects of an accident remain."
 HOK_KOR_recover_rocket_procurement:0 "Propellant Procurement Recovery"
 HOK_KOR_recover_rocket_procurement_desc:0 "Costs 150 Political Power and takes 60 days. Completing independent tests, safety checks and the rebuilding of the supply system removes the accident National Spirit for this sector. On completion: Accumulated Corruption -10, Institutional Capture -5. The contract's 365-day cooldown remains in force."
 HOK_KOR_CIVIC.1.t:0 "Safety Warning over Aviation Explosives Deliveries"
 HOK_KOR_CIVIC.1.d:0 "A report states that test records for the aviation explosives and ammunition supplied on an expedited basis by Korea Explosives to the aircraft supply consortium do not match their actual quality. With inspections omitted by the consortium, even the safety of the deliveries stored in the hangars cannot be guaranteed. An independent investigation would immediately end the fast-track benefits and prevent new contracts in either sector for 60 days. Ignoring the warning will cause an accident in 15–45 days.\n\nThis incident involving Korea Explosives deliveries is part of the mod's fictional alternate history, set in Korea in 1936."
 HOK_KOR_CIVIC.1.a:0 "Halt the expedited deliveries and begin an independent investigation."
 HOK_KOR_CIVIC.1.b:0 "Delivery deadlines come first. Deal with the report internally."
 HOK_KOR_CIVIC.2.t:0 "Explosion in an Aircraft Hangar"
 HOK_KOR_CIVIC.2.d:0 "After safety warnings about Korea Explosives' expedited deliveries of aviation explosives and ammunition were ignored, an explosion occurred in a hangar holding the supplies. Air wings have suffered damage, while the aircraft supply consortium and procurement officials blame one another for the missing inspection records. Operational safety and maintenance arrangements have been undermined, increasing the risk of air accidents and reducing mission efficiency and experience gain. The damage can only be remedied by completing the Aircraft Procurement Recovery decision.\n\nThis incident and the company's collusion are fictional elements of the mod's alternate-history setting. They do not represent historical corruption or incidents involving a real company."
 HOK_KOR_CIVIC.2.a:0 "Publish the damage reports and contract records."
 HOK_KOR_CIVIC.2.b:0 "Settle the matter with industry compensation and keep the records confidential."
 HOK_KOR_CIVIC.3.t:0 "Aircraft Procurement Verification Complete"
 HOK_KOR_CIVIC.3.d:0 "Independent tests and checks against delivery records are complete. The accident National Spirit for this sector is removed, with Accumulated Corruption -10 and Institutional Capture -5. Accidents in other sectors and the contracts' shared 365-day cooldown remain in effect. Fast-tracking another contract can lead to further warnings and accidents."
 HOK_KOR_CIVIC.3.a:0 "Return to a verified supply system."
 HOK_KOR_CIVIC.11.t:0 "Defect Warning in Propellant Procurement"
 HOK_KOR_CIVIC.11.d:0 "A report states that test records for expedited deliveries under the Korea Explosives propellant contract do not match their actual quality. The verification procedures skipped to bring the equipment into service sooner have now become a source of danger. An independent investigation would immediately end the fast-track benefits and prevent new contracts in either sector for 60 days. Ignoring the warning will cause an accident in 15–45 days.\n\nThis procurement incident is part of the mod's fictional alternate history, set in Korea in 1936."
 HOK_KOR_CIVIC.11.a:0 "Halt the expedited deliveries and begin an independent investigation."
 HOK_KOR_CIVIC.11.b:0 "Delivery deadlines come first. Deal with the report internally."
 HOK_KOR_CIVIC.12.t:0 "Explosion at a Propellant Factory"
 HOK_KOR_CIVIC.12.d:0 "An explosion has occurred at a production facility after safety warnings over Korea Explosives' fast-track propellant contract were ignored. Testing schedules and propellant certification have been suspended, delaying rocket research and rocket Special Projects. The damage can only be remedied by completing the Propellant Procurement Recovery decision.\n\nThis incident is part of the mod's fictional alternate history and does not represent historical events or corruption involving a real company."
 HOK_KOR_CIVIC.12.a:0 "Publish the damage reports and contract records."
 HOK_KOR_CIVIC.12.b:0 "Settle the matter with industry compensation and keep the records confidential."
 HOK_KOR_CIVIC.13.t:0 "Propellant Procurement Verification Complete"
 HOK_KOR_CIVIC.13.d:0 "Independent tests and checks against delivery records are complete. The accident National Spirit for this sector is removed, with Accumulated Corruption -10 and Institutional Capture -5. Accidents in other sectors and the contracts' shared 365-day cooldown remain in effect. Fast-tracking another contract can lead to further warnings and accidents."
 HOK_KOR_CIVIC.13.a:0 "Return to a verified supply system."
 HOK_KOR_CIVIC.24.t:0 "Prosecution Power Network Targets the Reforming Government"
 HOK_KOR_CIVIC.24.d:0 "As transparent procurement and the Civil Society Industrial Compact threaten established vested interests, a power network within the prosecution service, colluding with companies, has begun blocking budget approvals and administrative action. It seeks to cripple the reforming government and seize control of the state.\n\nWithin 90 days, reduce Institutional Capture below 60 or complete the Secure Evidence Against the Prosecution Power Network decision. Securing evidence costs 150 Political Power and takes 45 days; dismantling institutional capture networks costs 200 Political Power and takes 60 days. If the deadline passes, the basic benefits of the Civil Society Industrial Compact will be suspended and the takeover National Spirit applied.\n\nThe prosecution coup and corporate collusion are fictional elements of this mod's alternate-history setting."
 HOK_KOR_CIVIC.24.a:0 "Secure the records and end the capture of our institutions."
 HOK_KOR_CIVIC.21.t:0 "Prosecution Coup Thwarted"
 HOK_KOR_CIVIC.21.d:0 "Institutional Capture has fallen below the danger threshold, or evidence from the procurement records has been secured, thwarting the attempted takeover. The crisis National Spirit is removed, and the same coup crisis cannot recur for 365 days. Completing the dismantling of institutional capture networks can also end the monthly increase in Institutional Capture caused by resistance to civic reform."
 HOK_KOR_CIVIC.21.a:0 "Defend the authority to carry out reform."
 HOK_KOR_CIVIC.22.t:0 "Prosecution Power Network Seizes Government"
 HOK_KOR_CIVIC.22.d:0 "The 90-day period for taking precautions has expired, and the fictional prosecution power network has seized control of the budget and administration. The basic benefits of the Civil Society Industrial Compact are suspended and the takeover National Spirit is applied. Separately from the existing leader and military coup paths, executive authority must be recovered through the Restore the Popular Mandate decision, which requires Civil Society Influence of at least 50, costs 200 Political Power and takes 90 days."
 HOK_KOR_CIVIC.22.a:0 "Prepare to restore the popular mandate."
 HOK_KOR_CIVIC.23.t:0 "The Popular Mandate Restored"
 HOK_KOR_CIVIC.23.d:0 "With civil society backing the disclosure of records and the restoration of administration, the prosecution power network's control of government has been broken. The basic benefits of the Civil Society Industrial Compact are restored. Monthly resistance to reform ends, but new preferential contracts and cover-ups can again increase corruption and institutional capture."
 HOK_KOR_CIVIC.23.a:0 "Start again with the records open to all."
 HOK_KOR_chaebol_interfering:0 "Chaebol Interference in Industry"
 HOK_KOR_chaebol_interfering_desc:0 "Chaebol Influence: 50–74. The chaebol have gained enough influence to intervene in industrial contracts and supply networks."
 HOK_KOR_civic_interfering:0 "Civil Society Participation in Policy"
 HOK_KOR_civic_interfering_desc:0 "Civil Society Influence: 50–74. Workplace consultation and public scrutiny have a sustained influence on the implementation of policy."
