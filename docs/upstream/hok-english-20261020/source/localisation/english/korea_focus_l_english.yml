l_english:
 kor_hok_gookppong_enabled_flag:0 "The Super-Korea option was enabled in the custom game rules before the game began."
 KOR_devalue_the_won_desc:0 "Since the Great Depression began, the world's major powers have devalued their currencies to make their exports more competitive and stabilise prices. We have been unable to do so because of pressure from Japan, which resented the growing price competitiveness of Korean agricultural produce. Now, however, we must act decisively to assert our economic sovereignty and overcome the Depression."
 KOR_support_light_industry_export:0 "Support Light Industry Exports"
 KOR_support_light_industry_export_desc:0 "The Korean Peninsula has few natural resources to export. We have therefore imported raw materials from abroad, processed them and exported the manufactured goods. Since the Great Depression, however, soaring raw material prices have bankrupted most of our industrial firms, making even this difficult. We must increase production and exports of agricultural produce and light industrial goods that require little specialist technology or capital, such as wigs and 'Korean mink' made from rat skins."
 KOR_ask_the_ifc_to_invest:0 "Seek IFC Investment"
 KOR_ask_the_ifc_to_invest_desc:0 "The International Finance Corporation (IFC) has its eye on Korea. It predicts that our advantageous location for exports and our industrious people will one day make Korea one of the world's leading economies, and hopes to reap the rewards of its investment when that distant day arrives. A meeting with the IFC's investment assessment team is being prepared at the Ministry of Foreign Affairs."
 KOR_eight_province_development_committee:0 "Eight Provinces Development Committee"
 KOR_eight_province_development_committee_desc:0 "Led by the economist and businessman Ilhan New, the Eight Provinces Development Committee is a subcommittee reporting directly to the Minister of Economic Affairs. Its purpose is to develop the Korean Peninsula's limited territory efficiently, according to the characteristics of each region."
 KOR_northern_development:0 "Develop the Northern Region"
 KOR_northern_development_desc:0 "Before developing the north, we must send officials to survey the region and purchase or nationalise the land needed for economic development."
 KOR_southern_development:0 "Develop the Southern Region"
 KOR_southern_development_desc:0 "Before developing the south, we must send officials to survey the region and purchase or nationalise the land needed for economic development."
 KOR_central_region_development:0 "Develop the Central Region"
 KOR_central_region_development_desc:0 "Before developing the central region, we must send officials to survey it and purchase or nationalise the land needed for economic development."
 KOR_develop_unsan_gold_mine:0 "Unsan Gold Mines"
 KOR_develop_unsan_gold_mine_desc:0 "Some of Asia's largest gold mines lie around Unsan, Changseon and Deokcheon in North Pyeongan Province. During the old empire, Queen Min granted mining rights to the American Horace Newton Allen in exchange for protection for the Min family. Mining ended in the mid-1920s, but unexplored gold veins remain. Even conservative estimates suggest deposits large enough to rank tenth in the world. We must develop these mines to replenish our treasury."
 KOR_build_soyanggang_dam:0 "Resume Construction of Soyanggang Dam"
 KOR_build_soyanggang_dam_desc:0 "Soyanggang Dam was designed to be the largest rock-fill dam in the East, with a total storage capacity of 2.9 billion tonnes of water. Although the Great Depression left it unfinished and abandoned, completing it would allow us to supply electricity and running water throughout the capital region and Gangwon Province."
 KOR_honam_plain_food_factory:0 "Honam Plain Food Processing Plants"
 KOR_honam_plain_food_factory_desc:0 "Honam is one of the peninsula's few extensive plains and a major grain-producing region: Korea's breadbasket. By building industrial poultry farms to produce the chicken Koreans favour, alongside large food processing plants making American-style pressed ham, we can create jobs, produce goods for export and improve our people's diet."
 KOR_saemangeum_reclamation:0 "Expand the Daedeok Industrial Complex"
 KOR_saemangeum_reclamation_desc:0 "Daejeon, in the Hoseo region, is home to the Daedeok Industrial Complex, which produces light industrial goods for civilian use, including small machinery, electronics, chemicals, textiles and paper. We must expand the complex and provide the facilities and conditions that will allow more small and medium-sized firms, as well as larger businesses, to move in and begin operating."
 KOR_busan_free_trade_zone:0 "Busan Free Trade Zone"
 KOR_busan_free_trade_zone_desc:0 "Since opening to foreign trade, Busan has been the peninsula's largest port city and an entrepot for trade between Japan, China and the Soviet Union. To develop it into an international trading port on the scale of British Hong Kong, China's Shanghai or Japan's Tokyo, we must introduce favourable arrangements for business and invest at the national level."
 KOR_agricultural_support_in_jaeryeong_plain:0 "Support Farming on the Jaeryeong Plain"
 KOR_agricultural_support_in_jaeryeong_plain_desc:0 "The Jaeryeong Plain in Hwanghae Province is smaller than the Honam Plain in Jeolla, but enjoys easy access to the capital region in Gyeonggi and the Pyongyang area in Pyeongan. Investment and support for its farms could turn it into a centre supplying fresh agricultural produce to Seoul and Pyongyang."
 KOR_support_gaema_plateau:0 "Support Livestock Farming on the Gaema Plateau"
 KOR_support_gaema_plateau_desc:0 "The Gaema Plateau occupies most of Hamgyeong Province. Rice cannot be grown there, and even human habitation is difficult, but its broad highland plains are well suited to Alpine-style livestock farming. Supporting this industry will bring economic benefits and provide sturdy military horses, trained on the plateau, to transport our supplies."
 KOR_seoul_national_university_expansion:0 "Expand Seoul National University"
 KOR_seoul_national_university_expansion_desc:0 "If anyone asks about the future of our country, tell them to raise their eyes towards Gwanak, the home of Seoul National University. Since the republic's foundation in 1906, this national university has followed the Western model of four-year degrees across a broad range of subjects, educating Korea's finest minds and advancing scholarship. Budget cuts since the Great Depression, however, have prevented us from investing adequately in it. This unhappy state of affairs must end."
 KOR_attract_worldclass_scholars:0 "Attract World-Class Scholars"
 KOR_attract_worldclass_scholars_desc:0 "Now that we have some financial breathing room, the state must invite world-class scholars to Korea. We must invest sufficiently in their research into new technologies to ensure that we no longer fall behind developments elsewhere in the world."
 KOR_hamgyeong_underground_resources:0 "Develop Hamgyeong's Mineral Resources"
 KOR_hamgyeong_underground_resources_desc:0 "Hamgyeong Province consists largely of rugged mountains, making it poorly suited to farming. Beneath them, however, lie substantial mineral deposits that we can put to use."
 KOR_gangwon_underground_resources:0 "Develop Gangwon's Mineral Resources"
 KOR_gangwon_underground_resources_desc:0 "Gangwon Province consists largely of rugged mountains, making it poorly suited to farming. Beneath them, however, lie substantial mineral deposits that we can put to use."
 KOR_comprehensive_national_development_plan:0 "Comprehensive National Development Plan"
 KOR_comprehensive_national_development_plan_desc:0 "The Comprehensive National Development Plan will develop and urbanise the entire Korean Peninsula. Although it will require enormous amounts of time and money, developing the whole peninsula will prepare every part of our small country for industrialisation."
 KOR_synthetic_rubber:0 "Synthetic Rubber"
 KOR_synthetic_rubber_desc:0 "The peninsula's climate is unsuitable for rubber trees, so we depend on imports for all our rubber. To reduce the outflow of national wealth and work towards self-sufficiency, we must draw on the formula for styrene-butadiene synthetic rubber patented by Germany's IG Farben and meet at least part of our domestic demand ourselves."
 KOR_gyeongbu_expressway:0 "Gyeongbu Motorway"
 KOR_gyeongbu_expressway_desc:0 "Since the Great Depression began in 1929, we have sought to restore the economy and create jobs through major state-led civil engineering projects, drawing on Roosevelt's New Deal and Hitler's autobahns. A shortage of funds brought construction to a halt in 1935. Light industrial exports have now given us some room in the tax budget, so we must resume these works, even at this late stage."
 KOR_gyeongui_expressway:0 "Gyeongui Motorway"
 KOR_gyeongui_expressway_desc:0 "With the Gyeongbu Motorway complete, it is time to resume construction of the Gyeongui Motorway. Once that too is finished, travel between Sinuiju and Busan will become possible within a single day. It will also greatly assist emergency troop redeployments to the north."
 KOR_first_new_city_plan:0 "First New Towns Plan"
 KOR_first_new_city_plan_desc:0 "Seoul is our country's political, economic and cultural centre, and everyone wants to live there. Yet the city is already overcrowded and short of housing. We must build satellite settlements around it, called 'new towns', using the peninsula's abundant limestone to construct two million homes in blocks of flats. By integrating their transport networks, we can turn the capital region into a single vast metropolis."
 KOR_construction_boom_desc:0 "Our state-led civil engineering projects have greatly increased government debt, but they have also brought unemployment down sharply. Money is circulating again, and the economy is reviving. Construction firms have accumulated expertise in major public works and are now simply waiting for us to give them more contracts."
 KOR_development_of_heavy_industry:0 "Develop Heavy Industry"
 KOR_development_of_heavy_industry_desc:0 "Light industrial exports have given us a little breathing room. We must now shift from an economy centred on light industry to one based on heavy industry and chemicals. Before proceeding, we must carefully assess our industrial capabilities and study the technologies of other industrial powers."
 KOR_guro_industrial_complex:0 "Guro Industrial Complex"
 KOR_guro_industrial_complex_desc:0 "We will build the first, second and third Korea Export Industrial Complexes in Guro, Seoul, where access to Incheon Port favours exports. Together, these manufacturing sites will become the capital region's largest industrial complex. The sunsets will look lovely through the factory smoke."
 KOR_pohang_iron__steel_company:0 "Pohang Iron and Steel Company"
 KOR_pohang_iron__steel_company_desc:0 "Until now, we have produced none of our own steel, the staple on which industry depends, relying entirely on American and Japanese imports. Yet domestic steel production is essential to the continued development of heavy industry. We will therefore establish the state-owned Pohang Iron and Steel Company in Pohang, Gyeongsang Province, and build our own blast furnaces to produce steel with our own hands!"
 KOR_namdong_imhae_industrial_complex:0 "Southeastern Coastal Industrial Belt"
 KOR_namdong_imhae_industrial_complex_desc:0 "Gyeongsang Province is well placed for heavy industry, with Busan Port providing convenient access for imports of raw materials and exports of finished goods. We will establish a vast belt of heavy and chemical industry from Yeongil Bay in eastern Gyeongsang to Gwangyang Bay, linking Ulsan, Busan, Changwon, Geoje and Tongyeong."
 KOR_saemaeul_undong:0 "[GetSaemaulUndongName]"
 KOR_saemaeul_undong_default:0 "New Village Movement"
 KOR_saemaeul_undong_commie:0 "Chollima Movement"
 KOR_saemaeul_undong_desc:0 "The New Village Movement is a programme of rural modernisation rooted in hyangyak, Korea's traditional system of village community compacts. Through this social movement, we will eradicate poverty in rural areas that have received less development than the cities, rebuilding, educating, redeveloping and modernising our countryside."
 KOR_industrialized_society:0 "An Industrial Society"
 KOR_industrialized_society_desc:0 "Our country is no longer an underdeveloped agrarian nation. Vast numbers of factory and office workers commute through cities filled with skyscrapers and factories, while service workers cater to their needs. Young people study to make their own way in the world, rather than simply inheriting the family trade."
 KOR_miracle_on_the_han_river:0 "Miracle on the Han River"
 KOR_miracle_on_the_han_river_desc:0 "Our country has finally overcome all the lingering effects of the Great Depression and succeeded in rebuilding and developing its economy. Rapid industrialisation and urbanisation have brought considerable problems of their own, but our remarkable economic growth has given us the economic and industrial strength to stand alongside the nations of Europe."
 KOR_mugunghwa_kkochi_pieossseubnida:0 "The Rose of Sharon Has Bloomed"
 KOR_mugunghwa_kkochi_pieossseubnida_desc:0 "Early experiments in atomic science have shown promising results. Harnessing this power will give us weapons unlike anything humanity has ever seen."
 KOR_create_add:0 "Establish the Agency for Defense Development"
 KOR_create_add_desc:0 "Now that we have some financial breathing room, we must bring together this country's finest scientific minds and establish the Agency for Defense Development. By developing new weapons of war, it will help us overcome our technological backwardness."
 KOR_korean_jet_engine:0 "A Modern Singijeon Rocket"
 KOR_korean_jet_engine_desc:0 "The idea of flying over great distances to strike enemy territory is hardly unfamiliar to the Korean people. We must work to develop long-range projectiles that can do just that."
 KOR_oil_from_korean_coal:0 "Coal Liquefaction"
 KOR_oil_from_korean_coal_desc:0 "The Korean Peninsula produces not a drop of oil, but has abundant coal. To achieve fuel independence, we must produce our own oil using the coal liquefaction process Germany first demonstrated during the Great War, some twenty years ago."
 kor_triumph_for_the_manchuria_flag:0 "The conquest of Manchuria is complete."
 KOR_the_manchurian_project:0 "The Manchurian Project"
 KOR_the_manchurian_project_desc:0 "At last, we have recovered Manchuria, our people's ancestral homeland. Its population is now an intricate mixture of Manchus (Jurchens), Mongols, Han Chinese, Japanese settlers brought over by the Japanese Empire (hikiagesha), White Russian emigres who settled after the Russian Civil War, and ethnic Koreans in Gando. We must quickly take over Manchuria's administrative offices and dispatch officials to investigate what can be done with this land."
 KOR_manchurian_oil:0 "Develop the Manchurian Oilfields"
 KOR_manchurian_oil_desc:0 "One of the officials we sent to Manchuria has discovered signs of oil in the north. After a hair-raising adventure evading mounted bandits, he returned safely with military assistance, carrying a map showing the location. Hearing the news, America's Standard Oil and Britain's Royal Dutch Shell have offered to invest. Developing these oilfields could make us entirely self-sufficient in oil for industry and our strategic reserves."
 KOR_multiethnic_embrace:0 "Embrace Cultural Diversity"
 KOR_multiethnic_embrace_desc:0 "Manchuria may once have been Korean territory, but we must face present realities. To take full possession of its territory and industrial facilities, and retain them in the future, we must uphold the humanistic values of freedom and democracy. By respecting the cultures of its peoples and recognising their autonomy, we can encourage them to regard us as neighbours rather than rulers, and ultimately to see Korea as their new homeland."
 KOR_invitation_jewish:0 "Permit Jewish Settlement"
 KOR_invitation_jewish_desc:0 "During our occupation of the Manchurian imperial palace, we obtained documents on the 'Fugu Plan'. Japan and Manchukuo had intended to settle Jews facing persecution in Europe and the Americas in Manchuria, making use of their labour, capital and technical expertise. Their alliance with Germany prevented the plan from coming to fruition, but we now rule Manchuria in their place. There is no reason we should not make use of it."
 KOR_invitation_white_russian:0 "Permit Anti-Communist Russian Settlement"
 KOR_invitation_white_russian_desc:0 "After the Russian Civil War, hundreds of thousands of Russians who supported the Whites fled the Bolsheviks and scattered across the world. Many live in Harbin, a Manchurian city founded by Russians. We can offer these wandering exiles citizenship of the Republic of Korea in return for military service, allowing them to settle securely in Manchuria."
 KOR_korean_dream_desc:0 "Our tolerant embrace of cultural diversity has given great hope to the persecuted across the world. In the name of freedom and democracy, people of every race, white, black and Asian alike, are escaping racial discrimination, the suffering of war and colonial rule to enter the Republic of Korea: a cradle of true, unfeigned liberty and Asia's beacon of freedom."
 KOR_proclaim_federation_of_balhae:0 "Federation of Balhae"
 KOR_proclaim_federation_of_balhae_desc:0 "We are no longer Koreans, Manchus, Chinese, Mongols, Russians, Japanese, Jews or outsiders of any other kind. In the spirit of Hongik Ingan, 'benefit all humanity', we are building a truly liberal democratic country as equal members of society and fellow citizens. We will now give our country a name that better reflects our values, taking it from the only multi-ethnic state in Korean history. Pro Hominum Beneficio! Pax Balhaeana!"
 KOR_deportation_of_chinese_from_manchuria:0 "Cultural Assimilation Policy"
 KOR_deportation_of_chinese_from_manchuria_desc:0 "We call ourselves a single people, but we have in fact assimilated many peoples who entered the peninsula over the centuries. Mongols in late Goryeo, Jurchens in early Joseon, and Japanese defectors and Ming refugees in the middle of the Joseon period all eventually became Korean. We already have ample experience of such things. Now that Manchuria has returned to the fold, its inhabitants too must all be 'assimilated' as Koreans. However many of them there may be."
 KOR_korean_settlement:0 "Build Korean Settlements"
 KOR_korean_settlement_desc:0 "Ever since our ancestral Manchurian lands returned to the fold, many of the peninsula's poorer inhabitants have wanted to make their fortune in this 'land of opportunity'. To meet their expectations, we must build affluent residential settlements for Koreans in Manchuria and arrange for them to move there."
 KOR_teaching_korean_to_manchurians:0 "Compulsory Korean-Language Education"
 KOR_teaching_korean_to_manchurians_desc:0 "Koreans are people who regard Korea as their homeland, enjoy its culture, think like Koreans and speak Korean. To give the inhabitants of Manchuria this golden opportunity to become Korean, we will first bestow upon them the honour of learning Hunminjeongeum, the Korean alphabet."
 KOR_rebuild_guknaeseong_as_new_city:0 "Build the New City of Gungnae"
 KOR_rebuild_guknaeseong_as_new_city_desc:0 "The site of Gungnae, Goguryeo's old capital, is not actually well suited to a city. The Yalu River can supply water, but the forbiddingly rugged mountains are among the worst possible conditions for urban construction. Yet it is the ideal place for a monument to our reconquest of Manchuria and a principal gateway from the peninsula into Manchuria. We must therefore mobilise every resource our construction industry possesses to rebuild this glorious city!"
 KOR_revive_of_goguryo:0 "The Rebirth of Goguryeo"
 KOR_revive_of_goguryo_desc:0 "Our rule over Manchuria is now an established fact in both name and substance. We are ready to adopt a new national name that expresses our continental ambitions all the more firmly."
 KOR_rebuild_manchurian_heavy_industry_facility:0 "Rebuild Manchurian Heavy Industry"
 KOR_rebuild_manchurian_heavy_industry_facility_desc:0 "Manchuria was already one of Asia's most industrialised regions. Unfortunately, most of its heavy industrial facilities were destroyed or lost during our military operations and the transfer of administration. We must rebuild these industrial complexes without delay."
 KOR_arsenal_of_far_east:0 "Arsenal of the Far East"
 KOR_arsenal_of_far_east_desc:0 "Since the industrial complexes were rebuilt, Manchurian heavy industry has enjoyed an unbroken boom. We must harness this momentum to turn Manchuria into the arsenal of the Far East and prepare for future conflicts."
 KOR_resource_exploration_in_manchuria:0 "Develop Manchuria's Mineral Resources"
 KOR_resource_exploration_in_manchuria_desc:0 "Manchuria's vast Sanjiang Plain is suitable for farming, but also holds abundant resources that have yet to be explored. Exploiting these mineral deposits will make us self-sufficient in more raw materials."
 KOR_build_the_gyeryongdae:0 "Build the Gyeryongdae Headquarters"
 KOR_build_the_gyeryongdae_desc:0 "The Army, Navy and Air Force headquarters in Seoul are housed separately, hampering unified command and cooperation between the services. Their buildings are also too cramped to handle the growing burden of military administration. For more efficient command, we must build a vast joint headquarters at Gyeryong in Chungcheong Province for all three services."
 KOR_establish_dasmfe:0 "Establish the Military Morale Agency"
 KOR_establish_dasmfe_desc:0 "Our soldiers have little idea of the political principles they should uphold, who their enemies are or what they should be fighting for. The military's cooperation with civilians and its public relations are little short of disastrous. We must therefore establish a morale education and public affairs branch, combining the strengths and functions of Soviet political officers with those of Western military public affairs branches. A Defense Agency for Spiritual and Mental Force Enhancement will systematically train the personnel assigned to it."
 KOR_begin_rearmament:0 "Begin Rearmament"
 KOR_begin_rearmament_desc:0 "More than thirty years of peace since the Korean-Japanese-Russian War have left our armed forces dangerously complacent and out of touch with combat. Military budgets and both the quality and quantity of equipment have declined to alarming levels. With tensions rising around the world, we must allocate additional military funding and prepare to reopen the arms factories idled by the Great Depression."
 KOR_daehanminguk_yuggun:0 "Republic of Korea Army"
 KOR_daehanminguk_yuggun_desc:0 "The mainstay of national defence: Pride & Trust. Since the republic's foundation in 1906, the Republic of Korea Army has guarded our homeland's mountains and rivers. We must review its present condition."
 KOR_army_augmentation:0 "Expand the Army"
 KOR_army_augmentation_desc:0 "Disarmament following the Great Depression reduced our army from fifty divisions to twenty-two, most of which are themselves only half their authorised size. We must invite former servicemen in the reserves to volunteer for a return to active duty and form them into divisions at full strength."
 KOR_army_augmentation_tt:0 "Receive 4 full-strength infantry divisions in the capital."
 KOR_organization_rokasf:0 "Establish the 1st Airborne Corps"
 KOR_organization_rokasf_desc:0 "Lieutenant Colonel Kim Gong-su, military attache at our embassy in the Soviet Union and former personal aide to the celebrated retired general Hong Beom-do, observed the Soviet Kiev manoeuvres of 1935. He has recommended that our army establish an airborne force of corps strength. Airborne troops can deploy strategically to places inaccessible by land. To make this possible, we must select the finest soldiers from our field units and form and train airborne divisions."
 KOR_organization_rokasf_tt:0 "Receive 3 elite airborne divisions in the capital."
 KOR_armored_focus:0 "Armour Focus"
 KOR_armored_focus_desc:0 "The tank is destined to rule the battlefields of the future. We will gather and study the experience and technology of Europe's leading tank-producing nations, including France, Germany and Czechoslovakia."
 KOR_mobile_infantry:0 "Mobile Infantry"
 KOR_mobile_infantry_desc:0 "Motorised infantry travelling rapidly by lorry may be expensive, but they are well worth the cost as a strategic reserve. We must go further and develop armoured half-tracks from modified agricultural tractors, providing robust protection and the ability to cross difficult terrain."
 KOR_armored_vanguard:0 "Armoured Vanguard"
 KOR_armored_vanguard_desc:0 "The age of armoured warfare demands larger tanks with thicker armour and guns of greater penetrating power. Our army must keep pace. We must build proper armoured divisions capable of combined-arms operations alongside motorised infantry!"
 KOR_armored_vanguard_tt:0 "Receive 2 medium tank divisions in the capital."
 KOR_infantry_focus:0 "Infantry Focus"
 KOR_infantry_focus_desc:0 "The infantry are there at both the beginning and the end of every war. However powerful our weapons, a battle is only over when an infantryman plants the flag. Infantry embody the army and, indeed, the armed forces as a whole. We must invest more in them and hold extreme cold and hot weather exercises across the entire force to build up our experience of infantry warfare."
 KOR_new_model_rifle:0 "Develop a New Rifle"
 KOR_new_model_rifle_desc:0 "Lieutenant Chae Byeong-deok, an ordnance officer at the Busan Arsenal, has studied foreign small arms and designed a weapon superior to our army's current standard rifle, the Mannlicher M1907. He has recommended its adoption. Once we give our approval, we can prepare production lines for our troops' new small arms."
 KOR_improved_artillery:0 "Introduce Improved Artillery"
 KOR_improved_artillery_desc:0 "Artillery is the god of war. Against its overwhelming firepower, the enemy can do nothing. We must develop, produce and deploy bigger, more powerful guns of ever greater calibre."
 KOR_expansion_of_non_combat_support_units:0 "Expand Support Services"
 KOR_expansion_of_non_combat_support_units_desc:0 "War is not the responsibility of the combat arms alone. Adequate logistics for front-line soldiers and effective assistance from the support services are essential to modern warfare."
 KOR_research_army_doctrine:0 "Research Army Doctrine"
 KOR_research_army_doctrine_desc:0 "Neither infantry nor the most advanced tanks can win a war on their own. We must concentrate on developing our tactical and strategic capabilities alike. Army Headquarters already has talented staff officers ready to meet these requirements."
 KOR_daehanminguk_haegun:0 "Republic of Korea Navy"
 KOR_daehanminguk_haegun_desc:0 "To the seas, to the world! Heirs to Admiral Yi Sun-sin, the Republic of Korea Navy has defended our maritime sovereignty and territorial waters since the republic's foundation in 1906. We must review its present condition."
 KOR_invitation_of_foreign_naval_designers:0 "Recruit German Shipbuilders"
 KOR_invitation_of_foreign_naval_designers_desc:0 "Our naval cooperation with Germany ended after Adolf Hitler came to power, but some German employees of Blohm & Voss Korea, which built the Eulji Mundeok-class heavy cruisers, remain in the country. We must grant them special naturalisation and make it easier for them to stay in Korea and continue designing ships for us."
 KOR_organization_rokmc:0 "Establish the Republic of Korea Marine Corps"
 KOR_organization_rokmc_desc:0 "Lieutenant Colonel Hwang Geun-chul has proposed creating a force within the Navy specialising in land warfare. He is known as a sixteenth-generation descendant of Hwang Hui, the celebrated chief minister of early Joseon, and as the son of Hwang Ryong, the five-term Liberal-Independence Party MP for Yeongil County. Supported by heavy naval gunfire from the main fleet, such troops could readily breach even strongly fortified port defences. We must select sailors and naval police from our ships to form marine divisions."
 KOR_organization_rokmc_tt:0 "Receive 3 elite marine divisions in the capital."
 KOR_large_surface_fleet:0 "Build an Ocean-Going Fleet"
 KOR_large_surface_fleet_desc:0 "The Great Depression may have thwarted its plans, but our navy has never abandoned its dream of an ocean-going fleet. Steel fortresses that range across the oceans, strategic weapons embodying the nation's power: these are the true symbols of a navy."
 KOR_battleship_focus:0 "Sejong the Great-Class Battleships"
 KOR_battleship_focus_desc:0 "Before developing a new battleship of our own, we must review the warship designs drawn up under the shipbuilding programme planned before the Great Depression and complete a battleship design fit for a new age."
 KOR_carrier_focus:0 "Baekdusan-Class Aircraft Carriers"
 KOR_carrier_focus_desc:0 "Opinions within the Navy are divided over the potential of naval aviation, but few doubt the usefulness of aircraft carriers for maritime reconnaissance and supporting duties. There is ample reason to study early carriers built on discarded battlecruiser hulls, such as the American Lexington class and Britain's Courageous."
 KOR_build_new_ship:0 "Build New Capital Ships"
 KOR_build_new_ship_desc:0 "With the designs settled, we will now begin building our first home-grown capital ships!"
 KOR_fate_of_hms_tiger_tt:0 "Adds either 2 battleships or 2 aircraft carriers to the production queue, depending on the focus previously chosen."
 KOR_fate_of_hms_tiger_BC_tt:0 "Adds 2 Sejong the Great-class battleships to the production queue, one 90% complete and the other 30% complete."
 KOR_fate_of_hms_tiger_CV_tt:0 "Adds 2 Baekdusan-class aircraft carriers to the production queue, one 80% complete and the other 20% complete."
 KOR_commerce_raiding:0 "Commerce Raiding Focus"
 KOR_commerce_raiding_desc:0 "Regrettably, we must face reality. A powerful ocean-going fleet has long been our navy's ambition, but our limited budget makes it impossible for now. Instead, we must study the German Empire's commerce raiding and submarine warfare during the Great War. These proved that a smaller fleet with a modest budget could still fulfil a navy's strategic objectives."
 KOR_new_submarine:0 "Introduce New Submarines"
 KOR_new_submarine_desc:0 "Submarines are the modern successors to our turtle ships and our only means of resisting the overwhelmingly superior Imperial Japanese Navy. We must study the shortcomings of the German submarine designs left by BV Korea and develop more advanced boats with better underwater performance."
 KOR_submarine_Squadron:0 "Submarine Fleet"
 KOR_submarine_Squadron_desc:0 "To assemble a formidable submarine wolfpack, we need more training boats and exercises that reflect real combat. Fortunately, through BV Korea's mediation, we can purchase another seven Type II U-boats that Germany has used for training and is preparing to retire."
 KOR_vision_1950_desc:0 "Vision 1950 is Admiral Son Won-il's shipbuilding plan to create an ocean-going navy, including battleships and aircraft carriers, before 1950. We must pursue this goal and build a powerful fleet to defend our territorial waters, allocating more resources to the shipyards and asking them to work overtime."
 KOR_jeju_naval_base:0 "Build Jeju Naval Base"
 KOR_jeju_naval_base_desc:0 "Jeju is a volcanic island south of the peninsula and the largest island in our country. Some call it an island of peace, but it is also an outstanding strategic position from which to control the southern seas and threaten both China's capital region around Nanjing and Sasebo, headquarters of the Imperial Japanese Navy's Third Fleet. We must fortify Jeju and build a major naval base there, making it Korea's Pearl Harbor and a forward base for our navy's advance into the oceans."
 KOR_peninsula_dockyard:0 "Expand the Peninsula's Dockyards"
 KOR_peninsula_dockyard_desc:0 "Since the Army conquered Manchuria, our country's attention has turned from the land to the sea. Backed by ample funding, we will build dockyards at every suitable site along our peninsula's three coastlines and expand the fleet."
 KOR_daehanminguk_gonggun:0 "Republic of Korea Air Force"
 KOR_daehanminguk_gonggun_desc:0 "The highest power defending the Republic of Korea! Formed on Brigadier General Noh Baek-rin's recommendation in 1925, the Republic of Korea Air Force is a young service that became independent of the Army Air Corps as the world's third independent air force. We must review its present condition."
 KOR_new_fighter:0 "New Fighters"
 KOR_new_fighter_desc:0 "The Air Force needs new tactical aircraft with greater durability and flight performance to replace its ageing machines. We can instruct aircraft manufacturers to submit prototypes for a competition."
 KOR_expand_air_bases:0 "Expand Air Bases"
 KOR_expand_air_bases_desc:0 "Before expanding our air power, we must build additional air bases throughout the country where tactical aircraft can be maintained and pilots can rest."
 KOR_1st_air_defense_brigade:0 "1st Air Defence Artillery Brigade"
 KOR_1st_air_defense_brigade_desc:0 "Our Air Force has far too few tactical aircraft to defend our skies. Our ground-based air defences are also woefully inadequate in both quality and quantity. They belong to the Army rather than the Air Force, making coordination with our aircraft equally poor. We must transfer all existing Army air defence artillery battalions to the Air Force, reinforce their equipment and personnel, and reorganise them into the Air Force's 1st Air Defence Artillery Brigade."
 KOR_korea_aerospace_industry_desc:0 "Korea's aircraft industry is inefficiently divided between several small firms, including Samsung Aerospace, Hanjin, Daewoo Heavy Industries' aircraft division and Hyundai Space and Aircraft, despite our country's small size and limited demand. We must merge these companies into a single state-owned enterprise that will act according to our needs."
 KOR_tactical_air_force:0 "Tactical Air Force"
 KOR_tactical_air_force_desc:0 "The Air Force's purpose is, above all, to assist the Army. Its main task should be supporting army operations with strike groups made up of large numbers of small, agile interceptors, dive bombers and attack aircraft."
 KOR_air_artillery_desc:0 "The accurate bombing of the dive bombers and attack aircraft flown by our experienced attack squadrons is a nightmare for enemy ground troops. We must share their experience with every pilot in the Air Force, turning the entire service into flying artillery."
 KOR_strategic_air_force:0 "Strategic Air Force"
 KOR_strategic_air_force_desc:0 "The Air Force's purpose is far greater than merely helping the Army! With magnificent four-engined heavy bombers, we can attack the enemy's homeland, shattering morale and industrial capacity. Even without directly supporting the Army, our Air Force can weaken the enemy and ultimately secure victory for our country."
 KOR_burn_the_enemy_mainland_desc:0 "There is no such thing as an innocent civilian. Enemy civilians are potential combatants who assist their country's war effort, and we need not limit our bombing capability out of concern for them. Alongside conventional high-explosive bombs, our bombers must make full use of incendiaries and napalm to roast the enemy homeland to a golden brown."
 KOR_establishment_of_the_afoc:0 "Invest in the Air Force Academy"
 KOR_establishment_of_the_afoc_desc:0 "Unlike the Army and Navy, the Air Force has had no academy of its own. Until now, it has recruited pilots from civilian flying schools and commissioned them as second lieutenants to become combat pilots. For all their romantic ideals of aviation and considerable flying skill, they have struggled to adapt to the military's strict chain of command. We must open an Air Force Academy to train our own pilots and develop and study aerial tactics."
 KOR_age_of_jet:0 "Into the Jet Age"
 KOR_age_of_jet_desc:0 "Compared with existing propeller aircraft, jet-powered machines still belong to the realm of fantasy, but more and more engineers believe they could become a reality. Since the conquest of Manchuria, our armed forces have had both an overwhelming need and ample funding. Our Air Force is now ready to commit the enormous sums required to bring these almost fantastical machines to life!"
 KOR_future_of_the_republic:0 "The Future of the Republic"
 KOR_future_of_the_republic_desc:0 "The new year of 1936 has dawned. We must take stock of our country's condition and consider its future."
 KOR_commie_civil_war:0 "Communist supporters proclaim the Daegu Commune in Daegu and begin a civil war."
 KOR_korea_manchuria_border_dispute_tt:0 "When war begins with Manchukuo, if it is a Japanese puppet, occupying Manchuria on your own while outside any faction will allow you to choose peace negotiations with Japan."
 KOR_long_live_the_dictatorship_of_the_proletariat:0 "Long Live the Dictatorship of the Proletariat!"
 KOR_long_live_the_dictatorship_of_the_proletariat_desc:0 "The workers and peasants of the Republic of Korea have long been exploited in the name of sacrifice for national modernisation. After the Great Depression, 200,000 citizens of Daegu, the 'Moscow of Korea', peacefully demanded jobs, food and doctors. Branded 'Reds', they were slaughtered at gunpoint and bayonet by Syngman Rhee's government. We waited for dialogue, but they never intended to talk. We will endure this no longer. We will begin a revolution in this land, truly for the workers and peasants!"
 KOR_agitate_the_union:0 "Win over the Trade Unions"
 KOR_agitate_the_union_desc:0 "Under the security crackdown that followed the Great Depression, the freedom to form trade unions guaranteed by Article 33 of the Republic's constitution has become a dead letter. Unions are collapsing one after another under repression by the police and hired thugs employed by the chaebol business conglomerates. We must give them weapons and invite them to join our cause."
 KOR_formation_of_the_provisional_peoples_committee:0 "Form the Provisional People's Committee"
 KOR_formation_of_the_provisional_peoples_committee_desc:0 "Everything is ready. We will rise in Daegu. Major unions, workers and peasants from across the country have already begun gathering in Gyeongsang Province. Some anti-Rhee military commanders, ashamed of the suppression of the Daegu Socialisation Movement, have also agreed to join us. Together, we will drive Syngman Rhee's Liberal-Independence Party regime, which massacred its own people, from this land!"
 KOR_proclaim_peoples_republic_of_korea:0 "Proclaim the People's Republic of Korea"
 KOR_proclaim_peoples_republic_of_korea_desc:0 "Thanks to our workers, peasants and principled soldiers, we have overthrown Syngman Rhee's regime and carried our national liberation revolution to victory! We will now replace the sham republic with a state truly for the workers and peasants."
 KOR_yeo_woon_hyung_as_the_leader:0 "Chairman Lyuh Woon-hyung"
 KOR_yeo_woon_hyung_as_the_leader_desc:0 "Mongyang Lyuh Woon-hyung, the former leader of the Korean Social Democratic Party, has at last regained his freedom. He worked to improve the harsh conditions endured by workers and peasants, only to be held under house arrest for years by the Liberal-Independence Party regime after the Daegu Socialisation Movement. We must acclaim him as chairman so that we can build a country truly for the workers and peasants."
 KOR_park_heon_young_as_the_leader:0 "Chairman Pak Hon-yong"
 KOR_park_heon_young_as_the_leader_desc:0 "Following the failure of the Daegu Socialisation Movement, Ijeong Pak Hon-yong of the former Workers' Party of Joseon went into exile in the Soviet Union, where he directed the communist revolution against Syngman Rhee. He has finally returned to his homeland. For the cause of world revolution, we must acclaim him as chairman of our new country."
 KOR_confiscation_of_chaebol_assets:0 "Nationalise Chaebol Assets"
 KOR_confiscation_of_chaebol_assets_desc:0 "The chaebol have amassed their fortunes by sucking the blood of workers and peasants. Even the Great Depression did nothing to curb their insatiable greed. Their property will now be confiscated by the workers' and peasants' republic, and every last part of their accumulated wealth will be redistributed."
 KOR_lessons_form_the_civil_war:0 "Lessons of the Civil War"
 KOR_lessons_form_the_civil_war_desc:0 "The bloody civil war fought across our homeland has left many wounds, but it also gave our workers' and peasants' army valuable combat experience. Young, promising officers loyal to the socialist cause have had the opportunity to distinguish themselves."
 KOR_korea_manchuria_border_dispute:0 "Provoke Southern Manchuria with Shellfire"
 KOR_korea_manchuria_border_dispute_desc:0 "We may have replaced the sham republic with a new country for workers and peasants, but we have by no means forgotten our compatriots in Gando and Manchuria. Manchuria's feudalists will surely threaten our new homeland in time. We must strike them down before they have a chance to bare their claws."
 KOR_democratic_communism:0 "Democratic Communism"
 KOR_democratic_communism_desc:0 "The old Republic of Korea's bourgeois democracy may have served only the wealthy, but its principles and ideals still deserve respect. We will build a workers' and peasants' republic in the truest sense, with a directly elected chairman and the freedom to form political parties."
 KOR_pain_sharing:0 "Share the Burden"
 KOR_pain_sharing_desc:0 "We have seen all too clearly how the economic hardship that followed the Great Depression destroyed countless families and tore society apart. In place of the old Republic's laissez-faire economy, we must share their burden through a basic income targeted at the poor and vulnerable, alongside state-run social security and health insurance systems."
 KOR_rural_support_plan:0 "Rural Development Plan"
 KOR_rural_support_plan_desc:0 "Since the Great Depression, this country's independent farmers have been utterly ruined, left weeping over produce they cannot sell. To help them, the state will purchase agricultural surpluses and create jobs for farmers during the agricultural off-season."
 KOR_road_to_world_revolution:0 "The Road to World Revolution"
 KOR_road_to_world_revolution_desc:0 "Our communist revolution in Korea has succeeded, but the world remains full of suffering workers exploited by the bourgeoisie. The bourgeois powers are always seeking a chance to crush revolutionary Korea. Until world revolution is complete, our own revolution cannot be over."
 KOR_purge_reactionarist:0 "Purge the Reactionaries"
 KOR_purge_reactionarist_desc:0 "During the Korean Revolutionary War, we arrested great numbers of Liberal-Independence Party politicians, collaborators in Syngman Rhee's army, police officers, landowners and chaebol magnates, together with every member of their families. They are enemies of the revolution, subversives with no place in the new workers' and peasants' republic. Fair trials before the people's courts will establish their guilt or innocence and deliver 'appropriate' punishment..."
 KOR_heavy_industry_concentration:0 "Stalinist Heavy Industry"
 KOR_heavy_industry_concentration_desc:0 "The revolution has only just begun! To liberate the entire world from the bourgeoisie, we must produce more weapons, not mere everyday necessities!"
 KOR_anti_fascist_coalition:0 "Anti-Fascist Alliance"
 KOR_anti_fascist_coalition_desc:0 "The world is burning. The bourgeois powers are being driven back by the fascists, and once they fall, we will be next. 'For now', we must therefore put ideological differences aside and form a united front with them to stop the fascists."
 KOR_collaborating_with_western_capitalists:0 "Negotiate with Western Capitalists"
 KOR_collaborating_with_western_capitalists_desc:0 "The Western capitalists have formed the Allies and are fighting the fascists on the European front. We will approach them with an offer to send reinforcements in return for recognising the People's Republic of Korea as the peninsula's rightful, legitimate government."
 KOR_join_the_chinese_united_front:0 "Join the Chinese United Front"
 KOR_join_the_chinese_united_front_desc:0 "Since the Manchurian Incident, Japanese imperialists have been violating China's sovereignty. The Chinese have united to resist them. We too must join them and fight the Japanese imperialists together!"
 KOR_ilboneul_gonggyeoghanda:0 "Attack Japan"
 KOR_ilboneul_gonggyeoghanda_desc:0 "Korea will no longer stand by and watch Japan pursue its imperial ambitions. We will launch a crusade to bring Japanese imperialism to an end."
 KOR_join_the_comintern:0 "Stand with the Comintern"
 KOR_join_the_comintern_desc:0 "The Comintern is an international organisation united in the struggle to liberate the world from the bourgeoisie and bring it under communism. We will join it and make its cause our own."
 KOR_soviet_economic_aid:0 "Soviet Economic Aid"
 KOR_soviet_economic_aid_desc:0 "The Soviet Union is the leader of the socialist nations, having achieved remarkable development over many years through its vast territory and industrious people. We will demand economic investment from it, as the front line of socialism in the Far East."
 KOR_request_for_Siberia:0 "Request Eastern Siberia"
 KOR_request_for_Siberia_desc:0 "We and the Soviet Union are bound by blood and are practically one body. It would scarcely be an exaggeration to call the Soviet Union western Korea and Korea the eastern Soviet Union. We should therefore propose that the administration of Eastern Siberia, so difficult to supervise directly from Moscow, be formally transferred to Seoul, allowing us to 'manage' it on their behalf."
 KOR_preparing_for_asian_liberation:0 "Prepare to Liberate Asia"
 KOR_preparing_for_asian_liberation_desc:0 "Asia has suffered far too long at the hands of feudalists and imperialists. We must declare ourselves the leading socialist power in Asia and support communist parties across the continent to bring all of Asia under communism."
 KOR_support_the_japanese_communist_party:0 "Support the Japanese Communist Party"
 KOR_support_the_japanese_communist_party_desc:0 "Our comrades in the Japanese Communist Party have suffered merciless repression under the feudalists' \"Peace Preservation Law\". We will now support our communist brothers in Japan."
 KOR_support_the_chinese_communist_party:0 "Support the Chinese Communist Party"
 KOR_support_the_chinese_communist_party_desc:0 "Our comrades in the Chinese Communist Party are surrounded and utterly exhausted after the Long March. We must help them and join forces to bring communism to China!"
 KOR_overthrow_of_japanese_feudalist:0 "Attack Japan's Feudalists"
 KOR_overthrow_of_japanese_feudalist_desc:0 "The time has come to free the Japanese people from the evil rule of the Japanese imperialists. We will drive out Japan's feudalists and liberate the Japanese islands!"
 KOR_no_cpc_no_new_china:0 "Without the Communist Party, There Is No New China"
 KOR_no_cpc_no_new_china_desc:0 "China has suffered for too long under military dictators and warlords. Together with our comrades in the Chinese Communist Party, we will liberate the whole of China. Without the Communist Party, there can be no new China!"
 KOR_attack_the_western_imperialists:0 "Attack the Western Capitalists"
 KOR_attack_the_western_imperialists_desc:0 "We have liberated all the major countries of East Asia. Now it is the turn of the imperialists who exploit the suffering peoples of Asia's colonies. We will drive them out and liberate the entire continent."
 KOR_preemptive_strike_on_manchuria_tt:0 "When war begins with Manchukuo, if it is a Japanese puppet, occupying all of Manchuria on your own while outside any faction will allow you to choose peace negotiations with Japan."
 KOR_construction_syngman_rhee_line_tt:0 "Adds 2 levels of land forts along the Korean-Manchurian border."
 KOR_syngman_rhee_line_final_fortifications_tt:0 "Adds 2 levels of land forts along the Korean-Manchurian border."
 KOR_port_fortification_tt:0 "Adds 3 levels of coastal forts in Incheon, Busan, Nampo, Haeju, Wonsan, Mokpo and Gunsan."
 KOR_minshu_ikki_tt:0 "The Japanese democrats we support begin a civil war, and we automatically join the war on their side."
 KOR_overthrow_the_chinese_dictators_tt:0 "The Chinese democrats we support declare independence on the Shandong Peninsula, and we gain war goals against all Chinese warlords."
 KOR_democracy_advance_forward:0 "Democracy Marches On!"
 KOR_democracy_advance_forward_desc:0 "The Great Depression and the Daegu Socialisation Movement have left our people deeply disappointed in the democratic republic and doubtful of its future. Yet we must not abandon this path. As Asia's first and only democratic republic, Korea must not allow Asia's beacon of freedom to go out."
 KOR_president_kim_gu:0 "President Kim Gu"
 KOR_president_kim_gu_desc:0 "The Liberal Party's Syngman Rhee has handled the Great Depression and the Daegu Socialisation Movement appallingly. To safeguard the democratic republic, he must stand aside at the next presidential election. The Liberal-Independence Party's next presidential candidate should be Kim Gu, leader of the Independence Party and our current vice-president."
 KOR_syngman_rhee_reelected:0 "Re-elect Syngman Rhee"
 KOR_syngman_rhee_reelected_desc:0 "The idea of President Syngman Rhee leaving office is absurd! His Excellency has fought against absolute monarchy and Japan since the Musul People's Revolt, alongside former president Philip Jaisohn, our founding father and first president. The President will stand again at the next election as the Liberal-Independence Party's official candidate."
 KOR_independent_party_in_power:0 "Independence Party Rule"
 KOR_independent_party_in_power_desc:0 "The Liberal-Independence coalition was a disastrous choice. Although it was unavoidable if we were to defend democracy, it deeply disappointed the public and served merely to absolve Syngman Rhee of his dreadful conduct during the Great Depression and the Daegu Socialisation Movement. Our Independence Party will now split from the Liberals once more and pursue its own course."
 KOR_cooperation_with_the_jaebeol:0 "Cooperate with the Chaebol"
 KOR_cooperation_with_the_jaebeol_desc:0 "Although the Great Depression bankrupted most businesses and factories, some chaebol business conglomerates managed to weather its effects. We should grant them modest privileges, encouraging them to put their capabilities to work for our country."
 KOR_liberal_party_sole_power:0 "Liberal Party Rule"
 KOR_liberal_party_sole_power_desc:0 "We may currently share power under the Liberal-Independence coalition, but those Independence Party fellows mix with our Liberals like oil and water. The economy is slowly recovering from the Great Depression, and the effects of the Daegu Socialisation Movement are beginning to fade. It is time to reconsider our cooperation with the Independence Party."
 KOR_democracy_is_our_strength:0 "Democracy Is Our Strength"
 KOR_democracy_is_our_strength_desc:0 "Our government may have offered the people little but disappointment since the Great Depression, but freedom and democracy remain our country's true strength. We must emphasise this and ask for their forgiveness and cooperation."
 KOR_ban_extremism:0 "Ban Extremism"
 KOR_ban_extremism_desc:0 "In the wake of the Great Depression and the Daegu Socialisation Movement, violent extremist groups of both political extremes and gangs of political thugs have sprung up like poisonous mushrooms. We must bring the full force of the law down on these violent political organisations without leniency and disband them. They bring nothing but turmoil to politics."
 KOR_strengthen_government_support:0 "Strengthen Support for the Government"
 KOR_strengthen_government_support_desc:0 "We have drawn up plans for the next twenty years to realise the values and aspirations of the Korean people. If we show them that our democratic Republic is worth preserving, Korea can rise again as one."
 KOR_national_unity:0 "Unite the Nation"
 KOR_national_unity_desc:0 "Our country is now united and ready to rise again. We are Asia's first democratic republic. As long as our great history continues, our descendants too will defend and develop democracy."
 KOR_expend_military_budget:0 "Increase the Military Budget"
 KOR_expend_military_budget_desc:0 "The peace that followed the Korean-Japanese-Russian War's end in 1906, together with disarmament during the Great Depression, has denied the sons of our country in the armed forces the funding and treatment they deserve. With the government regaining stability and tensions rising around the world, this unhappy state of affairs must end."
 KOR_homeland_defence_special_act:0 "Enact the Homeland Defence Special Act"
 KOR_homeland_defence_special_act_desc:0 "Our enemies have been foolish enough to invade free Korea. Not one of our people was born for war, yet every last one of us is ready to unite in defence of our freedom and send these invaders into an inferno. We have done so before: in the Goguryeo-Sui War, the Silla-Tang War, the resistance to the Mongol invasions, the Imjin War, the Manchu invasions of 1627 and 1636, and the Korean-Japanese-Russian War!"
 KOR_the_vanguard_of_asian_democracy:0 "Vanguard of Asian Democracy"
 KOR_the_vanguard_of_asian_democracy_desc:0 "The Republic of Korea is Asia's first democratic republic and remains its only one. America stands aloof and Europe is preoccupied with its own troubles, so neither seems likely to help us. Even alone, we must act as the vanguard of Asian democracy and spread the values of freedom and democracy across the continent."
 KOR_stop_moderate_diplomacy:0 "Abandon Moderate Diplomacy"
 KOR_stop_moderate_diplomacy_desc:0 "The Portsmouth system established after the Korean-Japanese-Russian War and the signing of the Treaty of Portsmouth has collapsed. Our permanent neutrality is all but meaningless, Japan has established Manchukuo, and the League of Nations has remained silent. Diplomatic solutions plainly no longer work. To assert our will and defend democracy, we need a bolder foreign policy."
 KOR_war_on_pacifism:0 "War on Pacifism"
 KOR_war_on_pacifism_desc:0 "Some of our people still insist that international law guarantees our permanent neutrality. They fiercely oppose our military build-up, arguing that it violates the constitution's explicit rejection of aggressive war and will provoke Japan. Yet negotiation is a privilege of the strong, and power is the only law of international politics. We must first wage 'war' on the anti-war movement at home."
 KOR_claiming_northern_conquest:0 "The Case for a Northern Expedition"
 KOR_claiming_northern_conquest_desc:0 "To defend our freedom, independence and democracy, we will now begin wartime propaganda against Manchukuo, the enemy that poses a direct threat across our land frontier."
 KOR_preemptive_strike_on_manchuria:0 "Pre-emptive Strike on Manchuria"
 KOR_preemptive_strike_on_manchuria_desc:0 "The decisive hour has come. We will recover Gando, lost after the Korean-Japanese-Russian War, and go to war against Manchukuo, which threatens our homeland at every turn, and its Japanese backers. We will proclaim this a war of self-defence and prevention, rather than aggression, and deliver our declaration of war in accordance with international legal practice. Long live the Republic of Korea. Long live its armed forces."
 KOR_rok_roc_alliance:0 "Korean-Chinese Alliance"
 KOR_rok_roc_alliance_desc:0 "Japan's expansionism crossed the line with the Manchurian Incident. It makes no secret of its desire to conquer all of Asia, and Korea will be next after Manchuria. An alliance with China would mean permanently relinquishing Gando, lost after the Korean-Japanese-Russian War, and Manchuria, once ruled by our predecessors Goguryeo and Balhae. Nevertheless, we must consider it for our survival."
 KOR_prepare_for_the_next_war:0 "Prepare for the Next War"
 KOR_prepare_for_the_next_war_desc:0 "Article 5 of Chapter I of the Republic's constitution prevents us from waging aggressive war and forcing our troops and armed forces to violate the constitution. Yet the world is growing unstable, the movements of Japan, Manchukuo and the Soviet Union are ominous, and our permanent neutrality has become a dead letter. We must begin preparing to defend our homeland."
 KOR_construction_syngman_rhee_line:0 "Build the Hong Beom-do Line"
 KOR_construction_syngman_rhee_line_desc:0 "The Great War in Europe taught us that modern warfare favours the defender. A strong line of fortifications backed by heavy firepower can exact a terrible price from an attacker. We will therefore begin fortifying our northern frontier, following the examples of France's Maginot Line, Czechoslovakia's Sudeten fortifications and Belgium's Eben-Emael defences."
 KOR_syngman_rhee_line_final_fortifications:0 "Complete the Hong Beom-do Line"
 KOR_syngman_rhee_line_final_fortifications_desc:0 "Work on the Hong Beom-do Line is progressing smoothly. The Yalu and Tumen rivers already serve as natural moats, giving it considerable strength. Nevertheless, we will fortify it further to establish a complete deterrent to war."
 KOR_port_fortification:0 "Fortify the Ports"
 KOR_port_fortification_desc:0 "With the northern frontier fortified, it is time to build coastal defences! Our navy is hopelessly outmatched by the Imperial Japanese Navy. We must therefore fortify our ports heavily and prepare to stop Japanese landing forces supported by powerful naval gunfire."
 KOR_join_the_allie:0 "Join the Allies"
 KOR_join_the_allie_desc:0 "Since the Anglo-Japanese Alliance ended following the Washington Naval Treaty, Britain and Japan have become potential enemies competing over interests in China. We can approach Britain and ask to join its alliance, offering to help contain Japan and send a large army to the European front."
 KOR_establish_ofn:0 "Establish the Organisation of Free Nations"
 KOR_establish_ofn_desc:0 "The Great Depression and the rise of fascism have set the world ablaze. Korea and the United States cannot defend the free world alone. We must propose to America that our Mutual Defence Treaty be replaced by a new international military alliance, inviting all those who share our aims!"
 KOR_liberation_of_the_europe:0 "Liberate Europe"
 KOR_liberation_of_the_europe_desc:0 "The West's fat-bellied white men may inflict suffering on their colonial subjects in Asia and Africa to satisfy their own greed, but that does not mean we should be indifferent to their living under Nazi Germany's barbarous tyranny. We must join the Allied cause against Nazi Germany, the common enemy of humanity. Naturally, in return for our entry into the war against Germany, they must formally recognise Korea's permanent annexation of, and sovereignty over, Manchuria. They have no choice."
 KOR_founding_of_the_asian_union:0 "Found the Asian Union"
 KOR_founding_of_the_asian_union_desc:0 "We have defeated Japan and absorbed every part of our ancestral Manchurian lands, emerging as Asia's newest great power. We must now create our own military treaty organisation to liberate Asia and assert our ideals throughout the world."
 KOR_invitation_to_independent_asian_countries:0 "Invite Independent Asian Countries"
 KOR_invitation_to_independent_asian_countries_desc:0 "We will offer membership of the Asian Union to every Asian country whose independence is threatened by imperialists. Together, we must liberate Asia and spread the values of freedom and democracy."
 KOR_invite_china:0 "Invite China"
 KOR_invite_china_desc:0 "Since the Opium War, China has suffered under the encroachments of the Western powers. In the name of the Asian Union, we will invite China to join our alliance."
 KOR_support_for_democracy_in_china:0 "Support Chinese Democrats"
 KOR_support_for_democracy_in_china_desc:0 "The Western powers' brutal economic encroachments have contributed to China's semi-colonial condition, but the deeper problem is its failure to make democracy work and the domination of government by warlords and military dictators. We will support Chinese democrats with the will to act and encourage resistance to these rulers."
 KOR_overthrow_the_chinese_dictators:0 "Oust China's Dictators"
 KOR_overthrow_the_chinese_dictators_desc:0 "Our forces will now enter China in a 'special military operation' to sweep away the monstrous dictator Chiang Kai-shek and the motley warlords who oppress its people. Asian Union forces are already assembling along the Chinese border. As our troops cross the Korean-Chinese frontier, an uprising backed by us will break out on the Shandong Peninsula. Long live the Asian Union! Long live Asian democracy!"
 KOR_invite_japan:0 "Invite Japan"
 KOR_invite_japan_desc:0 "Remarkably, Japan is now governed by democrats, and its democracy is working properly. Relations between our countries have been dreadful since the Korean-Japanese-Russian War, but if their commitment to democracy is sincere, we should politely invite them into the Asian Union and ask whether they wish to join us."
 KOR_support_for_democracy_in_japan:0 "Support Japanese Democrats"
 KOR_support_for_democracy_in_japan_desc:0 "Since the end of Taisho democracy, the Japanese people have suffered terribly under militarist and feudal tyranny. The freedom-loving, democratic Asian Union cannot tolerate such atrocities. We will secretly supply freedom-loving Japanese with the weapons and materials they need to resist."
 KOR_minshu_ikki:0 "Democratic Uprising in Japan"
 KOR_minshu_ikki_desc:0 "Our forces and those of the Asian Union will now launch an all-out attack on Japan to liberate its freedom-loving people. As we attack, Japan's democrats will rise to free their homeland from the Emperor and the military. With the support of the freedom-loving Japanese people, Korean and Asian Union forces will consign Japan's feudalists and militarists to the dustbin of history!"
 KOR_asian_independence_support:0 "Support Asian Independence"
 KOR_asian_independence_support_desc:0 "The age of imperialism is ending and the age of independence is dawning, yet Europe's fat-bellied rulers cannot read the signs. They still imagine that their Asian colonies will remain their private preserves forever. The Asian Union will no longer stand idly by. To help the suffering peoples of Asia oppressed by whites, we will secretly establish and support their governments in exile in Seoul."
 KOR_expelling_european_imperialists:0 "Expel the European Imperialists"
 KOR_expelling_european_imperialists_desc:0 "Europe's imperialists claim to uphold parliamentary democracy and wage a crusade against fascism. In reality, they exploit the blood, sweat and tears of the non-white peoples of their colonies to fight their wars. Their democracy is a sham serving only their own white kind. We will end this hypocrisy and launch a crusade for true freedom in Asia. Long live the Asian Union! Long live Asian independence!"
 KOR_death_to_the_fascists:0 "Death to the Fascists"
 KOR_death_to_the_fascists_desc:0 "The foolish fascists believe in eugenics, imagining themselves superior as whites to us Asians, and are consumed by the delusion that they can make the entire world theirs. Teaching them a lesson is the rightful mission of free Korea and the Asian Union."
 KOR_end_of_the_red_plague:0 "End the Red Plague"
 KOR_end_of_the_red_plague_desc:0 "The Soviet Union proclaims that it will free workers from capitalist exploitation and build paradise on earth. In reality, it is an oligarchy run by a handful of elite Bolsheviks, oppressing its own ethnic minorities: nothing more than red imperialism wearing a communist mask. Cleansing this red plague is the duty of free Korea and the Asian Union."
 KOR_korea_in_the_world:0 "Korea in the World"
 KOR_korea_in_the_world_desc:0 "United we live; divided we can only die. The Great Depression and the rise of fascism may have set the world ablaze, but as a responsible democracy and a member of the world community, we must join forces with like-minded free nations to overcome this age of crisis!"
 KOR_korean_volunteer_corps:0 "Korean Volunteer Corps"
 KOR_korean_volunteer_corps_desc:0 "Since the Great Depression and the rise of fascism, ideological conflicts great and small have broken out across the world. Before these struggles reach our own country, we must boldly support forces whose success will help preserve our independence and ensure that they emerge victorious."
 KOR_trust_in_the_west:0 "Trust in the West"
 KOR_trust_in_the_west_desc:0 "Since the Great War ended in 1919 and the Treaty of Versailles was signed, two great powers have upheld the world order: the British Empire and the French Third Republic. They are working tirelessly to maintain the status quo. We must cooperate with them to preserve our independence and peace in the Far East!"
 KOR_contect_with_america:0 "Contact America"
 KOR_contect_with_america_desc:0 "After the Korean-Japanese-Russian War, President Syngman Rhee travelled to America and earned a doctorate in political science at Princeton University. With Woodrow Wilson as his academic supervisor, he developed powerful connections in the American Democratic Party. We can use these connections to try to conclude a new military alliance with America in defence of freedom and democracy..."
 KOR_rok_us_mutual_defense_treaty:0 "Korean-American Mutual Defence Treaty"
 KOR_rok_us_mutual_defense_treaty_desc:0 "Since the Manchurian Incident, America has been the Pacific power most alarmed by Japan's expansionist adventures. It seeks a partner to contain Japan and protect its territory in the Philippines. American isolationism has deepened since the Great Depression, but a mutual defence treaty is still a proposal worth putting forward for both our sakes."
 rok_us_alliance_formed_flag:0 "The Korean-American Mutual Defence Treaty has been signed."
 KOR_expand_merchant_marine:0 "Requisition More Merchant Ships"
 KOR_expand_merchant_marine_desc:0 "We have allied with Britain in return for sending troops to the European front. Unfortunately, we do not have enough transport ships to carry those troops and their supplies to Europe. We must ask our allies to lend us transports and requisition cargo ships owned by domestic shipping companies as state assets."
 KOR_learn_from_french_army:0 "Invite Chasseurs Alpins Instructors"
 KOR_learn_from_french_army_desc:0 "France's elite mountain troops, the Chasseurs Alpins, are famous for their blue berets and distinctive climbing sticks. Their prowess in mountain warfare earned them a formidable reputation during the Great War. With mountains covering seventy per cent of the Korean Peninsula, we must invite them as instructors to train a Korean equivalent. Even our ordinary infantry will have much to learn from their mountain warfare skills."
 KOR_usfk:0 "Deploy US Forces in Korea"
 KOR_usfk_desc:0 "The Korean-American Mutual Defence Treaty guarantees our independence, but American isolationists could abandon that promise at any time. The US Army also wants to station troops in Korea in advance, giving it a bridgehead for a future war with Japan. Permitting their deployment will strengthen our security and provide a tripwire to ensure that America continues to guarantee our independence."
 KOR_usfk_tt:0 "Receive 3 US divisions stationed in Korea as reinforcements."
 KOR_lend_lease_from_usa:0 "American Economic Aid"
 KOR_lend_lease_from_usa_desc:0 "Since the Korean-American Mutual Defence Treaty was signed, relations between Korea and America have grown closer. We should now be able to guarantee mutual economic assistance in wartime."
 KOR_british_naval_ship:0 "Purchase British Destroyers"
 KOR_british_naval_ship_desc:0 "To carry our troops safely to Europe through the Indian Ocean and the Suez Canal, we need a naval squadron to escort our transports. Our navy is too weak to spare ships from the defence of our own waters. We must therefore order destroyers from Britain to escort our expeditionary force."
 KOR_allies_military_aid:0 "Allied Military Aid"
 KOR_allies_military_aid_desc:0 "Our troops bound for Europe need better heavy weapons! We will ask our allies to build arms factories to equip the soldiers who will shed their blood for them in distant lands."
 KOR_katusa:0 "KATUSA"
 KOR_katusa_desc:0 "Since the deployment of US forces in Korea, their commander has complained to our president about a shortage of personnel. He has proposed a verbal agreement to attach Korean servicemen temporarily to American units, where they would fight alongside US troops. This would give our soldiers an excellent opportunity to encounter advanced American doctrine, equipment and technology at first hand. We must not turn it down!"
 KOR_invite_macarthur:0 "Invite MacArthur"
 KOR_invite_macarthur_desc:0 "General MacArthur, a friend of President Syngman Rhee from his years studying in America and the thirteenth US Army Chief of Staff, retired from the US Army after disagreements with Roosevelt. He is now serving as field marshal of the Philippine Army. The Republic of Korea Army needs such an outstanding soldier more than the Philippines does! We must ask the American government to send him to Korea."
 KOR_eef_command:0 "Establish European Expeditionary Force Command"
 KOR_eef_command_desc:0 "Everything is ready! We are prepared to deploy our troops to the European front, and equipment and supplies await shipment at Busan and Incheon. For the largest and most distant military expedition in our history since Dangun, we must establish a European Expeditionary Force Command to direct all Korean forces in Europe locally, rather than from the Ministry of National Defence at home, and give it the discretion it needs."
 KOR_forced_decolonization:0 "The Tide of Decolonisation"
 KOR_forced_decolonization_desc:0 "Britain and France led the Entente to victory in the Great War, but even the victors are growing old and losing their strength through continued warfare. Their hold over their eastern colonies weakens by the day. It is time to tell them to grant their Asian colonies freedom, and that Korea is the country capable of leading them into the light of true democracy."
 KOR_freedom_to_indochina:0 "Freedom for Indochina"
 KOR_freedom_to_indochina_desc:0 "French Indochina has abundant rice and a large workforce. We must give its people freedom and draw on their strength!"
 KOR_freedom_to_malaysia:0 "Freedom for Malaysia"
 KOR_freedom_to_malaysia_desc:0 "The British Straits Settlements occupy a strategic position controlling the Strait of Malacca, the principal trade route between East and West. We must give their people freedom and draw on their strength!"
 KOR_freedom_to_philippines:0 "Freedom for the Philippines"
 KOR_freedom_to_philippines_desc:0 "The Filipinos won independence from Spain and established Christianity and democracy for themselves, only to be colonised by America. We must give them freedom and draw on their strength!"
 KOR_freedom_to_indonesia:0 "Freedom for Indonesia"
 KOR_freedom_to_indonesia_desc:0 "The Dutch East Indies produce vast quantities of rubber and oil and occupy a strategic position between the Pacific and Indian oceans. We must give their people freedom and draw on their strength!"
 KOR_abcdfk_blocade:0 "The ABCDFK Encirclement"
 KOR_abcdfk_blocade_desc:0 "Japan has few mineral resources and depends on imports for most of the raw materials used to produce supplies for its wars of aggression. If our free allies impose simultaneous embargoes on Japan, we can severely diminish its ability to wage war."
 KOR_pressure_on_thailand:0 "Pressure Siam"
 KOR_pressure_on_thailand_desc:0 "Like us, Siam is one of the few Asian countries to retain its independence. It is a constitutional monarchy, but the pro-Japanese fascist general Plaek Phibunsongkhram could turn it into a Japanese ally at any time. We must secretly support Siam's democrats to prevent such a miscalculation."
 KOR_freedom_to_ryukyu_and_ainu:0 "Guarantee Ryukyuan and Ainu Liberation"
 KOR_freedom_to_ryukyu_and_ainu_desc:0 "To ensure that Japan never again dreams of continental expansion, we must divide it permanently and diminish its power. We will secretly contact representatives of Japan's ethnic minorities in preparation for partitioning the country should the need arise."
 KOR_end_the_threat:0 "End the Threat"
 KOR_end_the_threat_desc:0 "Despite our diplomatic efforts to preserve peace in the Far East, compromise with Japan has proved impossible. We have no choice left but to stop it by force."
 KOR_absorb_the_allies:0 "Absorb the Allies"
 KOR_absorb_the_allies_desc:0 "The British-led Allies are a group of nations united in defence of freedom, and their values differ little from ours. We will invite their members to join the Organisation of Free Nations."
 KOR_securing_the_former_commonwealth:0 "Secure the Former Commonwealth"
 KOR_securing_the_former_commonwealth_desc:0 "Following political change in Britain, its dominions have severed their ties and begun pursuing independent policies. We must invite them to join us and combine our strength!"
 KOR_torch_of_the_freedom:0 "Torch of Anti-Communism"
 KOR_torch_of_the_freedom_desc:0 "Our Organisation of Free Nations, defender of these beautiful lands, must strengthen its ideological unity around a single purpose: freedom, democracy and anti-communism."
 KOR_torch_of_the_freedom_tt:0 "Adds the Torch of Anti-Communism national spirit to all allies for 365 days."
 KOR_protect_benelux:0 "Protect the Benelux Countries"
 KOR_protect_benelux_desc:0 "The Low Countries are a gateway to Europe and faced a grave German threat during the Great War. We will politely offer to guarantee their security and invite them to join the Organisation of Free Nations."
 KOR_protect_finland:0 "Protect Finland"
 KOR_protect_finland_desc:0 "The small northern European nation of Finland faces a grave Soviet threat. We will politely offer its freedom-loving people our protection and membership of the Organisation of Free Nations."
 KOR_crash_the_nazis:0 "Eradicate National Socialism"
 KOR_crash_the_nazis_desc:0 "Germany's National Socialists claim to be different from communists, but their economic policies have a distinctly red smell, and many leading officials have a past in the communist movement. These 'mutant communists' will receive exactly the same 'equal treatment' as every other kind."
 KOR_hunt_the_bear:0 "Hunt the Bear"
 KOR_hunt_the_bear_desc:0 "The Soviet Union, founded through the Russian Revolution, is the headquarters of communism throughout the world. Until it is eradicated, nowhere on earth can be safe from communism."
 KOR_fasci_civil_war:0 "Troops led by commanders belonging to the Supreme Council for National Reconstruction secretly assemble in Seoul and attempt a coup."
 KOR_empowering_the_nrsc:0 "Power to the Supreme Council!"
 KOR_empowering_the_nrsc_desc:0 "The Great Depression and the Daegu Socialisation Movement have plainly brought the Republic to a crisis. We can no longer entrust our country's fate to civilian politicians. The armed forces, the vanguard of national defence, and their clandestine military organisation, the Supreme Council for National Reconstruction, are the only answer to our country's plight."
 KOR_gathering_the_farright_in_the_military:0 "Recruit the Military Far Right"
 KOR_gathering_the_farright_in_the_military_desc:0 "Military cuts after the Great Depression forced many capable servicemen into retirement. Among those still serving, many righteous soldiers are also dissatisfied with the present Republic. We must win them all over and bring them into the Supreme Council for National Reconstruction."
 KOR_establishment_of_the_national_salvation_army:0 "The Eulhae Military Uprising"
 KOR_establishment_of_the_national_salvation_army_desc:0 "The time has come! Our Supreme Council for National Reconstruction will advance on Seoul, drive out the corrupt and incompetent Rhee government and the established politicians, and bring true freedom and prosperity to this land. Long live the Republic of Korea! Long live the uprising forces!"
 KOR_stop_democracy:0 "Korean-Style Democracy"
 KOR_stop_democracy_desc:0 "Recent events have proved conclusively that Western democracy does not suit us. We must replace the Western system of direct presidential elections in which the whole population participates with Korean-style democracy: an indirect presidential election conducted by 'patriots' appointed by the president."
 KOR_samcheong_re_education_camp:0 "Samcheong Re-education Camp"
 KOR_samcheong_re_education_camp_desc:0 "During our surprise occupation of Seoul and Gyeonggi Province, Syngman Rhee escaped us. We did, however, seize the Liberal-Independence Party headquarters and arrest Kim Gu, Ahn Chang-ho, its other leading figures and all of its full voting members in Gyeonggi. They are the chief culprits who misled decent, patriotic citizens and brought turmoil to this land. Every last one must pay for those crimes with their life."
 KOR_armed_forces_intelligence_command_desc:0 "Since the accursed Bolsheviks' Russian Revolution, our homeland, which borders Russia, has been far from safe from communist revolution. We must expand our existing military counter-intelligence unit into the Armed Forces Intelligence Command to keep watch over subversives."
 KOR_prussia_in_the_far_east:0 "Military-First Rule"
 KOR_prussia_in_the_far_east_desc:0 "During the thirty-odd years of peace since the Korean-Japanese-Russian War, civilians have ignored the military's sacrifices and politicians have denied it adequate funding. This unhappy state of affairs must end. Our country must be reorganised into a garrison state like German Prussia, where the state is the barracks and the barracks are the state."
 KOR_taming_the_jaebeol:0 "Tame the Chaebol"
 KOR_taming_the_jaebeol_desc:0 "The chaebol have long clung to civilian politicians, enriching themselves by exploiting ordinary decent people through collusion between business and politics. During the coup, however, we seized all their Seoul headquarters, and their chairmen are now detained in Intelligence Command safe houses. We will summon them all and demand loyalty to the military regime. They can come aboard with us, or go to Samcheong Re-education Camp."
 KOR_korea_reigns_above_the_world:0 "Korea Reigns over the World"
 KOR_korea_reigns_above_the_world_desc:0 "It is over. Syngman Rhee has fled to America. The Free Korea Corps and the soldiers who sided with him have all surrendered and await military trials and admission to Samcheong Re-education Camp. Our crusade to save the country has succeeded. We will now proclaim the Second Republic, and His Excellency Cheolgi Lee Beom-seok will formally take office as President of the Republic of Korea."
 KOR_threelegged_boys:0 "Three-Legged Crow Youth"
 KOR_threelegged_boys_desc:0 "Today's children and adolescents, corrupted by decadent Western culture, do as they please and refuse to listen to their elders. We will require every child and adolescent to join the 'Three-Legged Crow Youth', teaching them loyalty to their fathers, superiors and country. Basic military training will prepare those aged seventeen and over to take up military duties immediately."
 KOR_anticommunism_agreement_signed:0 "Sign the Anti-Comintern Pact"
 KOR_anticommunism_agreement_signed_desc:0 "The Republic of Korea is threatened by the Soviet Union to the north, Japan to the east and Manchukuo to the north-west. To break this diplomatic encirclement, we must seek cooperation with Germany and Italy, whose governments are led by anti-communist patriots like ourselves."
 KOR_memory_of_goguryeo:0 "Memories of Goguryeo"
 KOR_memory_of_goguryeo_desc:0 "Of all the states in our people's history, Goguryeo was the one most worthy of the name of empire. As its heirs, we must make restoring its glory our mission."
 KOR_manchulus:0 "Manchluss"
 KOR_manchulus_desc:0 "Since we made the restoration of Goguryeo's glory our supreme task, recovering its former territory has become our people's fervent wish. Japan's puppet Manchukuo will hardly stand idly by, but the threat of our powerful army may persuade it to settle the matter 'peacefully'."
 KOR_demand_primorye:0 "Demand Primorye"
 KOR_demand_primorye_desc:0 "Our national strength has grown remarkably since we recovered Manchuria. We will now demand Russia's Primorye region, home to many Koreans, as a matter of 'border adjustment'. With their security threatened on the European front, they may respond favourably to avoid a war on two fronts."
 KOR_demands_submission_to_mongolia:0 "Demand Mongolia's Submission"
 KOR_demands_submission_to_mongolia_desc:0 "Since the age of Genghis Khan ended, Mongolia has been no more than a declining minor power. If we threaten it with our powerful army, it will readily comply, with Soviet security guarantees already in doubt."
 KOR_operation_hyojong:0 "Operation Shin Ryu"
 KOR_operation_hyojong_desc:0 "The Soviet Union, that self-proclaimed 'workers' paradise and homeland of revolution', seeks to contaminate the entire world with its nauseating ideology. We will no longer stand by and watch."
 KOR_demand_shandong:0 "Demand the Shandong Peninsula"
 KOR_demand_shandong_desc:0 "The Shandong Peninsula is a strategic trading centre once reached by Baekje and a promising land for development. We will politely demand that the Republic of China lease us the entire peninsula. If it fears our strength, it will readily accept. "
 KOR_operation_eulji:0 "Operation Eulji"
 KOR_operation_eulji_desc:0 "China's vast territory, resources and manpower are a rich prize essential to free Korea's prosperity. A united and developed China would also become our most dangerous challenger in the distant future. To emerge as the true victor of this age, we must bring China under our control."
 KOR_fate_of_tibet:0 "The Fate of Tibet"
 KOR_fate_of_tibet_desc:0 "Tibet is protected by rugged mountains, but a small country like that can no longer hold out against great powers such as China and India. We will therefore politely offer Tibet our 'protection'. Naturally, it must accept!"
 KOR_puppet_mengjiang:0 "Puppet Mengkukuo"
 KOR_puppet_mengjiang_desc:0 "Now that we have successfully absorbed Manchukuo, the people of Mengkukuo are beginning to doubt Japan's protection. We will invite them to accept the 'protection' of a rising Korea in place of a declining Japan. With us so close at hand, they will comply."
 KOR_operation_chungmu:0 "Operation Chungmu"
 KOR_operation_chungmu_desc:0 "The time has come. Japan mercilessly trampled our compatriots during the Imjin War and the Korean-Japanese-Russian War. It is the obstacle we must overcome to become the true ruler of East Asia. We will now launch our meticulously planned invasion. Long live the Republic of Korea."
 KOR_fall_of_the_sun:0 "The Setting Sun"
 KOR_fall_of_the_sun_desc:0 "Our fearless armed forces have easily seized the entire Japanese archipelago. We will now defile the Japanese in spirit, pride and body so that they never again dare harm free Korea... To that end, we must establish an administration to govern Japan efficiently."
 KOR_southern_attack:0 "Strike South"
 KOR_southern_attack_desc:0 "With Japan in our hands, the southern resource region is next. Its resources are essential to free Korea's industrial development, and the Western colonial troops guarding them are nothing but a rabble!"
 KOR_horang_horang_horang:0 "Operation Chungjang"
 KOR_horang_horang_horang_desc:0 "Despicable America condemns free Korea's wars of conquest and has the insolence to threaten an embargo. It once regarded Japan as a potential enemy, yet now treats us this way after we 'dealt with' Japan for it. Clearly, this is a plot to dominate Asia. We will answer with the will of free Korea and avenge the American expedition of 1871."
 KOR_ties_with_anti_communist_allies:0 "Ties with Anti-Communist Allies"
 KOR_ties_with_anti_communist_allies_desc:0 "The Soviet Union to our north once fomented the Daegu Socialisation Movement in a plot to turn our proud homeland red. To protect our sacred territory, we must cooperate with the fascist powers opposing the Soviets!"
 KOR_friendship_with_germany:0 "Friendship with Germany"
 KOR_friendship_with_germany_desc:0 "His Excellency Lee Beom-seok completed a General Staff course in Germany while still a major. After promotion to lieutenant colonel, he served as defence attache at Korea's embassy in Germany and became acquainted with Adolf Hitler. The bond between His Excellency and the Fuhrer will be a major asset in our diplomacy with Germany."
 KOR_join_the_axis:0 "Join the Axis"
 KOR_join_the_axis_desc:0 "National Socialist Germany has broken the chains of Versailles and grows stronger by the day. Having witnessed its strength and determination while studying there, His Excellency Lee Beom-seok has no doubts about its capabilities. We must join Germany in the Axis and stand together!"
 KOR_korean_general_staff:0 "A Korean General Staff"
 KOR_korean_general_staff_desc:0 "Germany's General Staff system trains senior commanders and staff officers of remarkable skill and ability. His Excellency Lee Beom-seok experienced it himself as a young officer sent to Germany for state-funded training. We must ask Germany to send instructors to help us create a 'Korean General Staff system'."
 KOR_german_technology:0 "German Technology"
 KOR_german_technology_desc:0 "German science and technology are the finest in the world. As members of the anti-communist crusade, we must ask Germany to share its technology with us."
 KOR_friendship_with_japan:0 "Friendship with Japan"
 KOR_friendship_with_japan_desc:0 "Since the Korean-Japanese-Russian War, relations between Korea and Japan could not be called good by any stretch of the imagination. Even so, we have much to learn from Japan. We must reassess our diplomatic relations from the ground up and consider friendship and closer ties."
 KOR_join_the_co_prosperity_sphere:0 "Join the Co-Prosperity Sphere"
 KOR_join_the_co_prosperity_sphere_desc:0 "Japan seeks to liberate all Asia in the name of the Greater East Asia Co-Prosperity Sphere. We can ask to stand alongside it in the common cause of Greater East Asian prosperity."
 KOR_purchase_japanese_weapons:0 "Purchase Japanese Weapons"
 KOR_purchase_japanese_weapons_desc:0 "We are rapidly expanding our armed forces to fulfil our part in the cause of Greater East Asian prosperity, but we lack weapons. We must ask our Japanese friends to sell us arms."
 kor_coronation_in_gyeongbok_palace:0 "Yi Un has been crowned at Gyeongbok Palace."
 kor_coronation_in_myongdong_cathedral:0 "Yi Un has been crowned at Myeongdong Cathedral."
 KOR_urihwangsilsaranghoe:0 "Imperial Family Appreciation Society"
 KOR_urihwangsilsaranghoe_desc:0 "The Imperial Family Appreciation Society is a civil association working to restore the monarchy and rebuild the Korean Empire, led by Gye Yeon-su, head of the Taebaek faith. We must review the association's present condition and plan our next steps towards restoring the imperial family."
 KOR_take_control_the_radio_media:0 "Take Control of Radio Broadcasting"
 KOR_take_control_the_radio_media_desc:0 "Nobody in the Republic of Korea currently advocates restoring the imperial family, even as a joke. We must therefore turn to radio, a product of the latest scientific advances. Most households have at least one set, using it for entertainment and information. With 'donations' from royalists and followers of the Taebaek faith, we will buy up radio stations and cultivate favourable opinion towards the former Joseon royal family..."
 KOR_deoksugung_pyeonguihoe:0 "Deoksu Palace Council"
 KOR_deoksugung_pyeonguihoe_desc:0 "At the coming parliamentary election, we expect to displace the Liberal-Independence Party and win a majority. We will then formally demand the Republic's dissolution in its own National Assembly... Until the rightful emperor takes the throne, the Deoksu Palace Council, reorganised from the Imperial Family Appreciation Society, will replace the republican government and exercise legislative, judicial and executive authority. Nobody will dare challenge us."
 KOR_revise_the_constitution:0 "Amend the Constitution"
 KOR_revise_the_constitution_desc:0 "Article 11, paragraph 2 of the Republic's constitution states: 'No system of privileged social classes shall be recognised, nor may any such system be established in any form.' This provision obstructs the return of this land's rightful ruler. As the final step towards restoring the imperial family, we will formally suspend this provision and every other constitutional obstacle to the Korean Empire's revival."
 KOR_return_of_the_king:0 "The Return of the King"
 KOR_return_of_the_king_desc:0 "Everything is ready! We will escort His Imperial Highness Crown Prince Yi Un, the Empire's true heir, from Jeonju to Seoul and restore what is rightfully his."
 KOR_imperial_regent_gyeyeonsu:0 "Imperial Regent Gye Yeon-su"
 KOR_imperial_regent_gyeyeonsu_desc:0 "Gye Yeon-su has rendered outstanding service in reviving the Empire through his years of leadership and financial support for the Imperial Family Appreciation Society. To honour his achievements, we must appoint him imperial regent, allowing him to oversee affairs of state on behalf of our still-inexperienced emperor."
 KOR_purge_the_imperialists:0 "Purge the Royalists"
 KOR_purge_the_imperialists_desc:0 "The time has come! We have placed a foolish, empty-headed young master on the throne, while His Holiness Gye Yeon-su holds all real power in this country. Once we have 'dealt with' the few clever ones who remain, nobody will be left to obstruct the Hwan Empire's revival..."
 KOR_educate_hwandangogi:0 "Introduce Hwandan Gogi in Schools"
 KOR_educate_hwandangogi_desc:0 "We will now teach our growing children and adolescents the Hwandan Gogi, the true history of our people. We will officially adopt it as a textbook in primary, middle and high schools, and hold recitation and book review competitions to make it more familiar to the young."
 KOR_idolization_dangun:0 "Cult of Dangun"
 KOR_idolization_dangun_desc:0 "Hwanin, the true father of all peoples, sent Dangun Wanggeom to our chosen Hwan people. His Holiness Gye Yeon-su embodies their will and serves as their messenger. Every Korean must now join the Taebaek faith and raise their voice in praise of them. All other religions will be officially banned."
 KOR_ideological_fanaticism:0 "Hwan Mystical Fanaticism"
 KOR_ideological_fanaticism_desc:0 "The entire Korean people are now united in the name of the Taebaek faith. There will be no more internal strife. We must devote body and soul to His Holiness Gye Yeon-su and give him our complete loyalty in rebuilding the Hwan Empire."
 KOR_northern_restoration:0 "Pacify the Great North"
 KOR_northern_restoration_desc:0 "Manchuria to the north is the ancestral homeland of our Hwan people, the promised paradise and sacred land to which Dangun led us. We will drive out whoever occupies it and reclaim our ancestral soil!"
 KOR_empire_of_hwan:0 "Revive the Hwan Empire"
 KOR_empire_of_hwan_desc:0 "Our Hwan nation was founded first. (The country founded by our Hwan people is the oldest.) \nHwan is perfect unity and light. (Hwan means complete oneness and radiance.) \nPerfect unity is the wisdom and power of the Three Gods. (Complete oneness is the wisdom and might of the Three Gods.)"
 KOR_retake_yellow_river_civilization:0 "Reclaim the Yellow River Civilisation"
 KOR_retake_yellow_river_civilization_desc:0 "The Hwan peoples' many states formed a league of twelve. (The Hwan people formed a federation of twelve countries.) \n To the south, Wolji and Yangyun practised farming. (The states of Wolji and Yangyun lay in the south and engaged in agriculture.)"
 KOR_conquest_indu:0 "Conquer Indu"
 KOR_conquest_indu_desc:0 "The western Hwan founded Indu; cow-worship brought expulsion. (The Hwan who went east founded Indu; they worshipped cattle and were excommunicated.)"
 KOR_sumilyee:0 "Rebuild Sumili"
 KOR_sumilyee_desc:0 "The Hwan of the far west founded Sumili. (The Hwan people who travelled furthest west founded the state of Sumili.) \nSumili built fortresses and subdued the western barbarians. (Sumili built strongholds and conquered the barbarian peoples to its west.)"
 KOR_occupat_yamoedo:0 "Occupy Yamoedo"
 KOR_occupat_yamoedo_desc:0 "The Hwan people mastered the seas. (The Hwan people were skilled seafarers.) \n They found an island chain and named it Yamoedo. (They named the islands they discovered at sea 'Yamoedo'.)"
 KOR_liberation_of_sanaba_and_tonggosa:0 "Liberate Sanaba and Tonggosa"
 KOR_liberation_of_sanaba_and_tonggosa_desc:0 "The Hwan who went north cleared the forests. (The Hwan who travelled north opened up the forests.) \n The northern Hwan founded Tonggosa and Sanaba. (The Hwan people of the north founded the states of Tonggosa and Sanaba.)"
 KOR_our_true_enemy:0 "Our True Enemy"
 KOR_our_true_enemy_desc:0 "Hwan in the east and Fin in the west were the two greatest powers. (The eastern state of Hwan and the western state of Fin were the strongest.) \nHwan and Fin could not coexist, and their lands ran red. (Hwan and Fin fought a great war against one another.) \nHwan fell, Fin perished, and the world descended into chaos. (The war destroyed both countries and brought a dark age upon the world.)"
 KOR_hwan_world_order:0 "The Hwan World Order"
 KOR_hwan_world_order_desc:0 "At that time, all people called themselves Hwan, and those who governed them were called In. (Everyone on earth then called themselves 'Hwan', and a person who ruled a group was called 'In'.) \n\nHe spread enlightenment on heaven's behalf and brought an end to strife. (On behalf of heaven, he widely taught and enlightened the people, so that they no longer fought.)"
 KOR_oppose_gyeyeonsu:0 "Oust Gye Yeon-su"
 KOR_oppose_gyeyeonsu_desc:0 "Gye Yeon-su is plainly a deranged old man. His efforts may have restored the Empire, but his abnormal Hwan mystical beliefs and ideology will certainly harm the imperial family and the country. It is time to 'dispose of' him and his followers."
 KOR_reconstruction_confusian_order:0 "Restore the Neo-Confucian Order"
 KOR_reconstruction_confusian_order_desc:0 "Now that the Emperor, this land's rightful sovereign, has become its true master, it is time to sweep away the sordid remnants introduced by the republicans. The Neo-Confucian order, the ideological foundation of Joseon and the Korean Empire, is the only means of purifying this land once more."
 KOR_revive_bibyeonsa:0 "Restore the Border Defence Council"
 KOR_revive_bibyeonsa_desc:0 "The Border Defence Council (Bibyeonsa) was Joseon's highest deliberative body after the Imjin War, exercising legislative, judicial and executive authority. Late in the dynasty, powerful clans abused its leadership to dominate affairs of state. Yet its ability to concentrate all state power in one person is precisely what His Majesty needs. We will restore the Council, with His Imperial Majesty, the rightful ruler of this land, personally serving as its head."
 KOR_go_with_kaiserreich:0 "Stand with the Kaiserreich"
 KOR_go_with_kaiserreich_desc:0 "Before the Korean-Japanese-Russian War, Kaiser Wilhelm II of the German Empire was remarkably friendly towards our former sovereign, Emperor Gojong, addressing him as 'Kaiser von Korea'. The Korean Empire's fall in the Musul People's Revolt after that war, followed by the German Empire's collapse in the Great War, prevented an alliance from being realised. With imperial rule restored in both countries, it is time to fulfil that unrealised alliance!"
 KOR_agitate_nationalist:0 "Rally the Nationalists"
 KOR_agitate_nationalist_desc:0 "The republicans' success in rallying nationalists during the Korean-Japanese-Russian War played a major part in destroying the old Empire. Since the republicans lost Gando, however, the Republic has failed to meet their expectations. We must turn this to our advantage, rallying nationalists to silence the imperial family's opponents and consolidate its rule."
 KOR_reform_military:0 "Reform the Armed Forces"
 KOR_reform_military_desc:0 "During the thirty-odd peaceful years since the Korean-Japanese-Russian War, the republicans have allowed our armed forces to degenerate into a corrupt and decadent institution. His Imperial Majesty, nominally the grand marshal and supreme commander of the imperial Army, Navy and Air Force, will now personally order military reform. Under the principle of strict obedience to superiors, those below him must naturally comply without complaint."
 KOR_reconstruction_sapodae:0 "Re-establish the Sapodae Militia"
 KOR_reconstruction_sapodae_desc:0 "The Sapodae were a local Korean militia established by the old Empire to uphold our effective control of Gando, maintaining public order and defending the territory until the republicans lost it. Although the organisation then collapsed completely, we will now secretly rebuild it and infiltrate its members into Gando, preparing them to strike Manchukuo from behind at the decisive moment."
 KOR_gando_revellion:0 "Rebellion in Gando"
 KOR_gando_revellion_desc:0 "The time has finally come! As the infiltrated Sapodae and local Koreans launch simultaneous uprisings across Gando, our forces will advance into our rightful territory to 'protect' our people. With the help of our beloved subjects there, we will also recover all of our ancestral Manchurian lands, once the territory of Goguryeo. May the Lord on High preserve the Emperor!"
 KOR_revenge_samjeondo:0 "Avenge Samjeondo"
 KOR_revenge_samjeondo_desc:0 "With Manchukuo destroyed, its self-styled 'Emperor', Aisin-Gioro Puyi, captured by our fearless armed forces, is confined in the Manchurian imperial palace under strict guard. We will bring him to Seoul and force him to kneel three times and strike his forehead to the ground nine times before the true emperor, His Majesty Yi Un, until his head splits open. This will perfectly avenge the humiliation inflicted on our former sovereign Injo by Aisin-Gioro Hong Taiji three hundred years ago and greatly raise our people's morale."
 KOR_sojunghwa:0 "The Little China Tradition"
 KOR_sojunghwa_desc:0 "Joseon and its successor, the Korean Empire, have never forgotten their debt to the Ming dynasty. We have now taken revenge upon the Jurchens and the Aisin-Gioro clan who destroyed it. Korea can therefore claim to be more than 'Little China': we are the true heir to the Chinese Empire. We must actively proclaim this to our people."
 KOR_claim_the_mandate_of_heaven:0 "Claim the Mandate of Heaven"
 KOR_claim_the_mandate_of_heaven_desc:0 "The Chinese order that has long governed the East was never the exclusive preserve of the Han. The Xianbei, Mongols and Manchus, whom the Han dismissed as northern barbarians, all became rulers of China and holders of the Mandate of Heaven. There is no reason we eastern peoples cannot do the same!"
 KOR_korean_ming_empire:0 "Korean-Ming Empire"
 KOR_korean_ming_empire_desc:0 "The Central Plain is now ruled by a rabble of commoners calling themselves the 'Republic of China', with no rightful emperor of the Chinese Empire. We must drive out these rebels and restore the order of the Three Sovereigns and Five Emperors to the heart of China."
 KOR_revenge_yimjin:0 "Avenge the Imjin War"
 KOR_revenge_yimjin_desc:0 "From the Japanese pirates of late Goryeo to the Imjin War and the Korean-Japanese-Russian War, the Yamato people have been our ancestral enemies, threatening the imperial family and our country for generations. We must conquer the islands that stand like a wall around the peninsula in Korea's name and ensure that the Yamato people never again insult our imperial family."
 KOR_the_last_empire:0 "The Last Empire"
 KOR_the_last_empire_desc:0 "The United States continues to voice 'diplomatic concern' over the Korean Empire's aggressive expansion. To the north, the Soviet Union denounces us as 'a warmongering autocrat like the Tsar, exploiting workers and consumed by aristocratic vanity', stirring up our decent people. The imperial family and the Empire will tolerate these insults no longer. We will answer them with deeds rather than words. Long live the Korean Empire! Long live His Imperial Majesty!"
 KOR_emperors_order:0 "The Emperor's Command"
 KOR_emperors_order_desc:0 "A great many unresolved problems accumulated in this country between the onset of the Great Depression and His Majesty's accession. Now that the Emperor has taken the throne, the long work of administration must begin to address them."
 KOR_royal_guards_division:0 "Establish the Imperial Guard Division"
 KOR_royal_guards_division_desc:0 "The Korean Imperial Armed Forces inherited the personnel of the Republic's military, so their loyalty cannot yet be trusted completely. We must offer high pay, good equipment and better treatment to the Imperial Family Appreciation Society's fanatical royalists and the strongest soldiers in the regular imperial forces. Formed into an Imperial Guard Division directly subordinate to the imperial family, rather than the military establishment, they will serve as its bodyguard and personal troops."
 KOR_march_of_the_king:0 "The Emperor Takes the Field"
 KOR_march_of_the_king_desc:0 "Joseon's founding ruler, Emperor Taejo, was a warrior who personally led his armies, but for a monarch to take command on the battlefield is extraordinarily dangerous in modern warfare. Yet, as Napoleon of France demonstrated, an emperor leading his troops in person can be an inexpensive and effective means of raising their morale and trust. We should consider having His Majesty take the field himself."
 KOR_modern_sejong_the_great:0 "A Modern Sejong the Great"
 KOR_modern_sejong_the_great_desc:0 "Our newly enthroned emperor has shown considerable enthusiasm for his duties, but his lack of experience makes him inefficient. We must distribute more of the work among officials of proven ability and loyalty who can assist His Majesty."
 KOR_dedication_of_emperor:0 "The Emperor's Devotion"
 KOR_dedication_of_emperor_desc:0 "As the country's sovereign, the monarch enjoys more privileges than ordinary people, but also bears great duties and responsibilities, including his role as a symbol of national unity. His Majesty must set an example, venturing beyond the palace to meet the public through charitable service and visits of encouragement, earning their willing respect and loyalty."
 KOR_addresses_to_the_korean_nation:0 "An Address to the Korean Nation"
 KOR_addresses_to_the_korean_nation_desc:0 "Our country must no longer tear itself apart through internal strife. With His Imperial Majesty as our rallying point, the entire nation must unite to overcome this age of crisis."
 KOR_lee_seong_gyes_resurrection:0 "The Rebirth of Yi Seong-gye"
 KOR_lee_seong_gyes_resurrection_desc:0 "Against all expectations, the Emperor has shown greater skill in military command than anyone anticipated. He now seems more at home on the battlefield than at work in the palace. It is as though Emperor Taejo, Yi Seong-gye, has been reborn. Under His Majesty's effective command, our armed forces have grown strong, and both soldiers and civilians hold him in the highest regard."
 KOR_constitutional_monarchy:0 "Establish a Constitutional Monarchy"
 KOR_constitutional_monarchy_desc:0 "The Empire has been restored, but times have changed. The Emperor himself feels unsuited to governing and wishes to fulfil only his hereditary duty of safeguarding the royal ancestral shrines and the state. We will respect his wishes and establish a constitutional monarchy."
 KOR_nomination_prime_minister:0 "Reconcile with the Republicans"
 KOR_nomination_prime_minister_desc:0 "Ahn Chang-ho, Kim Gu and Lyuh Woon-hyung are republicans with little affection for the imperial family, but their patriotism appears sincere. By promising to limit imperial authority and introduce a constitutional monarchy modelled on Sweden's constitution, we can win them over to our side."
 KOR_re_open_national_assambly:0 "Reopen the National Assembly"
 KOR_re_open_national_assambly_desc:0 "To form a democratic government under a constitutional monarchy, we will begin restoring the parliament closed after the Republic's overthrow. Its members will once again be chosen in free elections, as under the old Republic."
 KOR_reaffirming_the_independence_of_the_judiciary:0 "Guarantee Judicial Independence"
 KOR_reaffirming_the_independence_of_the_judiciary_desc:0 "We will guarantee the judiciary's independence under the democratic separation of powers. We will also explicitly establish that even the Emperor must face judgement under the law if he breaks it, firmly protecting the judiciary's authority and independence."
 KOR_confucian_democracy:0 "Confucian Democracy"
 KOR_confucian_democracy_desc:0 "Confucianism, the first humanistic philosophy to emerge in East Asia, emphasises benevolence, righteousness, propriety and wisdom. Confucianism and democracy are by no means incompatible. We must strive for a more developed democracy that cares for the vulnerable, respects the experience of the elderly and seeks the respect of others through virtuous conduct."
 KOR_join_the_allies_2:0 "Join the Allies"
 KOR_join_the_allies_2_desc:0 "At last, the turmoil and disturbances within our country have fully subsided. Yet the wider world is burning. As a freedom-loving nation, Korea will do its part and gladly lend its strength to friends willing to stand with us."
 KOR_joint_military_practice:0 "Joint Allied Military Exercises"
 KOR_joint_military_practice_desc:0 "Thirty-odd years of peace since the Korean-Japanese-Russian War have left our armed forces behind those of other countries. Through joint military exercises with our allies, we will learn what their forces have to teach us."
 KOR_aeguk_gongchae:0 "Patriotic Bonds"
 KOR_aeguk_gongchae_desc:0 "All Koreans must now unite in loyalty and righteousness to prepare for war. The people are components of the Empire. If thirty million subjects cut back on luxuries and the state collects the savings each month, we can produce more rifles, tanks and aircraft. We must issue patriotic bonds and compel the people to buy them, providing more supplies for the war effort."
 KOR_penal_regions:0 "Introduce Penal Units"
 KOR_penal_regions_desc:0 "According to the Wuzi treatise on warfare, penal units conscripted from prisoners are an excellent instrument. Those seeking to wash away their dishonour and earn forgiveness, or regain their freedom, will fight all the more bravely. Even if they do not, using enemy bullets instead of our own to dispose of society's refuse, those who neglect their parents, speak disrespectfully of the imperial family or hold republican ideas, is an undeniably attractive arrangement."
 KOR_gyeongui_expressway_tt:0 "Reduces the effects of the Great Depression."
 KOR_call_up_the_rokrf:0 "Call Up the National Defence Corps"
 KOR_call_up_the_rokrf_desc:0 "We are fighting the worst war in our people's history against an enemy several times stronger than ourselves. Outnumbered, we will recruit volunteers from women, second-category national service reservists and the middle-aged and elderly, whose physical condition makes them unsuitable for the regular forces, to form guerrilla units defending their local areas. They may lack the regulars' capabilities, but they will fight tenaciously for their homes and homeland, just as the righteous armies did during the Mongol invasions, the Imjin War and the Korean-Japanese-Russian War!"