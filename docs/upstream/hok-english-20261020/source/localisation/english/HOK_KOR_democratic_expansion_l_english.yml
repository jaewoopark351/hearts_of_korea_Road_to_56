#20260926_kpopmodder: Use escaped ASCII dialogue quotes and compact decision UI text; preserve gameplay and explicit lifecycle warnings.
#20260926_kpopmodder: Compact new focus descriptions for the fixed-height UI; preserve gameplay and non-focus localisation.
#20260925_kpopmodder: Rewrite focus, decision and event prose with grounded voices; preserve keys, gameplay rules and paired Korean text.
#20260923_kpopmodder: 공직 감찰 정비와 상위 공개 결산 제도의 매일 정치력 +1.0을 설명에 반영합니다.
#20260923_kpopmodder: 요청한 반복 디시전 7종의 민간공장 비용을 제거하고 정치력 150 비용에 맞춰 설명을 동기화합니다.
#20260921_kpopmodder: 승인된 보상 강화에 맞춰 최종 교체값·영구 효과·반복 사업 조건과 협정 설명을 두 언어 채널에 동기화합니다.
#20260921_kpopmodder: 바닐라 제도·원조·협정 구조를 한국 후속 중점에 맞춰 번안하고 신규 효과와 비용을 영문·한국어 채널에 함께 표시합니다.
 HOK_KOR_parliamentary_committee:0 "National Policy Consultative Committee"
 HOK_KOR_parliamentary_committee_desc:0 "While parliament argues over responsibility, livelihoods outside its doors cannot wait. Representatives of each political group and the administration will sit down together and begin with what they can agree to carry out."
 HOK_KOR_civil_service_audit:0 "Reform Public Service Oversight"
 HOK_KOR_civil_service_audit_desc:0 "\"Do I still have to follow the procedure when I come on his recommendation?\"\nThe answer must not differ from office to office. Records of appointments, spending and requests for favours will hold the public service to account."
 HOK_KOR_technical_civic_schools:0 "Expand Vocational and Civic Education"
 HOK_KOR_technical_civic_schools_desc:0 "We will teach people to read a machine's gauges and understand their rights as citizens.\nRequires ownership, full control and construction space in Gyeonggi, Jeolla and Chungcheong. Each state receives two building slots and two civilian factories, alongside one 25% electronics research bonus."
 HOK_KOR_rural_education_missions:0 "Rural Teaching Missions"
 HOK_KOR_rural_education_missions_desc:0 "One villager brings the teacher a letter; another brings a broken farm implement. Lessons will begin with the village's own questions. The +10% research speed benefit has no time limit."
 HOK_KOR_public_accounts_committee:0 "Parliamentary Public Accounts Committee"
 HOK_KOR_public_accounts_committee_desc:0 "If the budget promised a school, show us a school when the accounts are presented. A parliamentary public accounts committee with specialist staff will scrutinise how taxes have been spent."
 HOK_KOR_volunteer_liaison_bureau:0 "Volunteer Liaison Bureau"
 HOK_KOR_volunteer_liaison_bureau_desc:0 "Once we decide to send troops, we must keep listening to those we have sent. Liaison officers and interpreters will ensure that requests from the battlefield reach home."
 HOK_KOR_overseas_medical_detachments:0 "Overseas Medical Support Teams"
 HOK_KOR_overseas_medical_detachments_desc:0 "A reply promising help does not deliver equipment. We will train medical staff and open the way to sending support equipment from our stockpiles to allies at war and countries hosting our volunteers."
 HOK_KOR_volunteer_supply_depots:0 "Volunteer Supply Plan"
 HOK_KOR_volunteer_supply_depots_desc:0 "Even a small force abroad needs food and ammunition on time. Experience gained in organising overseas supply will reduce supply consumption across the entire Korean army by 10%, with no time limit."
 HOK_KOR_expeditionary_lessons:0 "Exchange Combat Lessons"
 HOK_KOR_expeditionary_lessons_desc:0 "We will listen to what went wrong before hearing of successes. Overseas experience can be studied in peacetime, while a separate conference on field experience can be held when we are at war or have volunteers abroad."
 HOK_KOR_overseas_relief_network:0 "Overseas Relief Network"
 HOK_KOR_overseas_relief_network_desc:0 "Aid must not sit in warehouses waiting for a destination. Networks linking Korean communities abroad and aid officials will deliver basic equipment from our stockpiles to allies at war and countries hosting our volunteers."
 HOK_KOR_asian_trade_secretariat:0 "Asian Joint Trade Secretariat"
 HOK_KOR_asian_trade_secretariat_desc:0 "A joint declaration still leaves countries with different contracts. The trade secretariat will coordinate each country's requests while allowing every country to decide what it will agree to."
 HOK_KOR_asian_customs_convention:0 "Asian Customs Convention"
 HOK_KOR_asian_customs_convention_desc:0 "The right to refuse a signature is part of cooperation as well. We will propose a convention to ease the cost of importing Korean resources. Countries that accept receive a 30% reduction in those import costs for 730 days."
 HOK_KOR_asian_development_fund:0 "Asian Joint Development Fund"
 HOK_KOR_asian_development_fund_desc:0 "The next page after the agreement should contain a factory to build. We will support civilian factory construction in allied countries participating in the customs convention. Each project costs only 150 Political Power and occupies no civilian factories."
 HOK_KOR_asian_armaments_commission:0 "Asian Joint Armaments Commission"
 HOK_KOR_asian_armaments_commission_desc:0 "If supposedly identical equipment uses incompatible parts, joint defence comes to a halt. An allied armaments commission will begin by sharing standards and production experience."
 HOK_KOR_asian_license_agreement:0 "Asian Licensed Production Agreement"
 HOK_KOR_asian_license_agreement_desc:0 "Sharing drawings must still respect production rights. We will propose a reciprocal licensed production agreement. Actual licences require separate contracts; if the feature is unavailable, practical armaments training will take its place."

 HOK_KOR_accountable_administration_idea:0 "Accountable Administration"
 HOK_KOR_accountable_administration_idea_desc:0 "It is hard to trust the public service when the same application is treated differently depending on who recommended the applicant or which desk receives it. Records of appointments, spending and requests for favours, supported by inspection procedures, now preserve continuity of work and responsibility when officials change.\n\nApplies while the government remains democratic."
 HOK_KOR_public_accounts_idea:0 "Public Accounts System"
 HOK_KOR_public_accounts_idea_desc:0 "Expenditure ledgers alone cannot show whether the schools and facilities in a budget have actually been built. Parliament examines and publishes both the records of implementation and their results, requiring the administration that spent the taxes to account for them before the public.\n\nRetains Accountable Administration's §G+1.0§! daily Political Power and provides §G+2%§! Stability. Applies while the government remains democratic and does not stack with the previous §YAccountable Administration§! national spirit."
 HOK_KOR_rural_education_idea:0 "Rural Teaching Programme"
 HOK_KOR_rural_education_idea_desc:0 "In villages far from a school, continuing an education can mean giving up work to travel to town. A permanent programme sends teachers and students to villages to teach basic science and technology, using questions raised on the spot to shape the next lesson.\n\nProvides §G+10%§! Research Speed with no time limit. This effect is separate from workers' evening classes."
 HOK_KOR_volunteer_supply_idea:0 "Improved Overseas Supply Administration"
 HOK_KOR_volunteer_supply_idea_desc:0 "Late requests from volunteers far from home and conflicting warehouse delivery records make it difficult to send the right equipment on time. Communications and supply procedures developed through overseas support are now being applied throughout the Korean army.\n\nProvides §G-10%§! Supply Consumption with no time limit. Applies alongside the supply benefit of the Integrated Logistics System."
 HOK_KOR_customs_participant_idea:0 "Korean-Asian Customs Convention"
 HOK_KOR_customs_participant_idea_desc:0 "Even buying resources from another member of the same faction leaves the costs imposed by each country's import terms. A customs convention agreed with Korea reduces the cost of importing Korean resources and puts the signed terms into practice in actual trade.\n\nThe convention lasts §Y730 days§!. The participant must remain in Korea's faction. It ends if the two countries go to war with one another, or if Korea loses its democratic government or faction leadership."
 HOK_KOR_license_participant_idea:0 "Korean-Asian Licensed Production Agreement"
 HOK_KOR_license_participant_idea_desc:0 "Even with the rights to produce foreign equipment, unfamiliar processes and technological differences make manufacturing difficult. A reciprocal licensed production agreement with Korea helps each country learn the production processes for equipment it has licensed and cope with the technological gap.\n\nThe modifiers apply only to licensed production between Korea and the participating country. Actual equipment licences require separate contracts. The agreement ends after §Y730 days§!, upon leaving the faction, if the two countries go to war with one another, or if Korea loses its democratic government or faction leadership."
 HOK_KOR_asian_license_relation:0 "Asian Licensed Production Agreement"
 HOK_KOR_license_participant_tt:0 "Reciprocal licensed production speed with Korea: §G+30%§!\nReduction in the production penalty from the technological gap: §G+30%§!\nWillingness to accept licence contracts: §G+20§!"

 HOK_KOR_overseas_support_category:0 "Overseas Support and Combat Lessons"
 HOK_KOR_overseas_support_category_desc:0 "Some supplies need to arrive before the paperwork. We will listen to what the battlefield needs and turn stocks in our warehouses and reports from our units into practical assistance.\n\nEquipment aid can be sent to countries at war that are not fighting Korea and either belong to our faction or host our volunteers. Equipment sent is deducted from our stockpiles."
 HOK_KOR_send_medical_equipment:0 "Send Medical and Support Equipment to [FROM.GetName]"
 HOK_KOR_send_medical_equipment_desc:0 "Medical staff need equipment, not promises. We will compare the requested supplies with stocks in our warehouses and prepare the equipment to send.\n\nSpends §Y10§! Political Power to send §Y50 units§! of stockpiled support equipment. The recipient must be at war, must not be fighting Korea, and must either belong to our faction or host our volunteers. The same country can receive this aid again after §Y60 days§!."
 HOK_KOR_send_relief_equipment:0 "Send Basic Equipment Aid to [FROM.GetName]"
 HOK_KOR_send_relief_equipment_desc:0 "Aid plans must not pile up while the unit requesting equipment waits. We will match the items on its requisition to our warehouse stocks and prepare infantry equipment that can actually be sent.\n\nSpends §Y15§! Political Power to send §Y100 units§! of stockpiled infantry equipment. The recipient must be at war, must not be fighting Korea, and must either belong to our faction or host our volunteers. The same country can receive this aid again after §Y90 days§!."
 HOK_KOR_field_experience_conference:0 "Field Experience Conference"
 HOK_KOR_field_experience_conference_desc:0 "\"Please begin with what did not go according to plan.\"\nReports from the front and our forces abroad will be brought together to examine where orders were delayed and why supplies were held up. The conference will preserve one unit's hard-won lessons for the next operation.\n\nCosts §Y35§! Political Power and runs for §Y30 days§! while Korea is at war or has volunteers abroad. Grants §G25§! Army Experience on completion and can only be undertaken once. Cancelled if both our participation in war and our volunteer deployment end, if the government ceases to be democratic, or if Korea capitulates. Neither the cost nor the opportunity to undertake it is restored."
 HOK_KOR_asian_cooperation_category:0 "Asian Union Cooperation"
 HOK_KOR_asian_cooperation_category_desc:0 "Cooperation must continue from signatures to implementation. Trade officials and production specialists from each country will turn agreed terms into actual resource purchases, equipment contracts and factory construction.\n\nAgreements enter into force when the other country accepts. New members and countries that previously declined can receive fresh offers once they meet the requirements."
 HOK_KOR_offer_customs_convention:0 "Offer a Customs Convention to [FROM.GetName]"
 HOK_KOR_offer_customs_convention_desc:0 "Even members of the same faction struggle to increase necessary trade when importing resources is too costly. We will offer terms for imports of Korean resources, leaving the other country to decide whether to participate.\n\nSpends §Y25§! Political Power to propose the convention. If accepted, the participating country's cost of importing Korean resources is §Greduced by 30%§! for §Y730 days§!. It can be proposed to the same country again after §Y180 days§! and does not overlap with an existing convention. Ends upon leaving the faction, if the two countries go to war with one another, or if Korea loses its democratic government or faction leadership."
 HOK_KOR_offer_license_agreement:0 "Offer a Licensed Production Agreement to [FROM.GetName]"
 HOK_KOR_offer_license_agreement_desc:0 "Producing imported equipment in a country's own factories requires work on production processes and technological differences even after a contract is signed. A promise of joint production cannot replace contracts for individual types of equipment.\n\nSpends §Y25§! Political Power to propose the agreement. If accepted, provides §G+30%§! licensed production speed, §G+30%§! reduction in the production penalty from the technological gap, and §G+20§! AI willingness to accept licence contracts between the two countries for §Y730 days§!. Equipment licences require separate contracts; no designs are granted.\n\nIt can be proposed to the same country again after §Y180 days§!. The agreement ends upon leaving the faction, if the two countries go to war with one another, or if Korea loses its democratic government or faction leadership."
 HOK_KOR_finance_allied_industry:0 "Support Civilian Factory Construction in [FROM.GetName]"
 HOK_KOR_finance_allied_industry_desc:0 "We will turn an ally's plans into a working factory. Construction officials in a country participating in the customs convention will help us check local conditions and prepare the ground for a civilian factory.\n\nCosts §Y150§! Political Power and occupies no Korean civilian factories. The recipient must have construction space in a core state it owns and fully controls. After §Y180 days§!, §G1§! civilian factory is built and §G1§! building slot is added in a state meeting these requirements.\n\nCancelled if Korea loses its democratic government, independence or faction leadership, or if the recipient loses its customs convention or membership of Korea's faction. Also cancelled if either country capitulates, the two countries go to war with one another, the recipient ceases to exist, or it loses all eligible core states with construction space. If cancelled, or if no space is available on completion, no factory is received and costs are not refunded. After completion or cancellation, investment can be repeated without a limit on the number of projects by meeting the requirements and paying again."
 HOK_KOR_industrial_project_commitment_tt:0 "Costs §Y150§! Political Power and occupies no civilian factories. Construction takes §Y180 days§!.\nInvestment in the same country can be repeated after completion or cancellation, with the cost paid again.\nIf cancelled, or if no space is available on completion, no factory is received and costs are not refunded."
 HOK_KOR_customs_offers_tt:0 "Offers current allies a customs convention lasting §Y730 days§!. Only countries that accept receive §G-30%§! to the cost of importing resources from Korea. The convention ends upon leaving the faction, if the two countries go to war with one another, or if Korea loses its democratic government or faction leadership."
 HOK_KOR_license_offers_tt:0 "Offers current allies a reciprocal licensed production agreement lasting §Y730 days§!. Licensed production modifiers apply only between Korea and a country that accepts. Modifiers in both directions are removed when the agreement ends."

 HOK_KOR_democratic_expansion.1.t:0 "Korea Proposes a Customs Convention"
 HOK_KOR_democratic_expansion.1.desc:0 "Korea's Joint Trade Secretariat has sent a proposal for a customs convention. Staff reviewing the terms for resource trade have laid the document open at the signature page.\n\n\"The other countries in the union have received the same offer.\"\n\"Then it is for us to say whether it suits our circumstances.\"\n\nGame rules:\nFor 730 days, the convention reduces the cost of resources our country imports from Korea. We must remain in the same faction and must not be at war with one another. The convention also ends if Korea loses its democratic government or faction leadership."
 HOK_KOR_democratic_expansion.1.a:0 "Reply that we will participate on these terms."
 HOK_KOR_democratic_expansion.1.b:0 "Tell them we will not sign this time."
 HOK_KOR_democratic_expansion.2.t:0 "[FROM.GetName] Joins the Customs Convention"
 HOK_KOR_democratic_expansion.2.desc:0 "The reply from the government of [FROM.GetName] confirms its agreement to participate in the convention. The trade official checked the signed document and took out the paperwork needed to put the trading arrangements in place.\n\n\"Shall we send a congratulatory telegram first?\"\n\"Do. Include our officials' contact details as well.\"\n\nThe two countries' agreement is now a promise to be honoured in actual trade."
 HOK_KOR_democratic_expansion.2.a:0 "Now to put the promised procedures in place."
 HOK_KOR_democratic_expansion.3.t:0 "[FROM.GetName] Declines the Customs Convention"
 HOK_KOR_democratic_expansion.3.desc:0 "The reply from [FROM.GetName] was polite, but made clear that it would not participate in this customs convention. The head of the secretariat reread the words 'voluntary participation' in the proposal.\n\n\"Do we keep that wording in the next proposal?\"\n\"We must. Write back and thank them for considering it.\"\n\nGame rules:\nNo convention effects have been applied. A fresh offer can be made after the required interval between negotiations."
 HOK_KOR_democratic_expansion.3.a:0 "We respect their decision."
 HOK_KOR_democratic_expansion.4.t:0 "Korea Proposes a Licensed Production Agreement"
 HOK_KOR_democratic_expansion.4.desc:0 "A proposal for a licensed production agreement has arrived from Korea. As the contracts official explained the terms, the production manager pulled the equipment list closer.\n\n\"Can we begin production as soon as this agreement is signed?\"\n\"No. The licence for each type of equipment requires a separate contract.\"\n\nWe must now decide whether to accept common procedures or retain our present procurement policy.\n\nGame rules:\nThe agreement provides production modifiers in both directions for 730 days, but actual licences must be secured through separate contracts. It ends upon leaving the faction, if the two countries go to war with one another, or if Korea loses its democratic government or faction leadership."
 HOK_KOR_democratic_expansion.4.a:0 "Sign the agreement and prepare individual contracts."
 HOK_KOR_democratic_expansion.4.b:0 "Retain our present procurement policy."
 HOK_KOR_democratic_expansion.5.t:0 "[FROM.GetName] Accepts the Licensed Production Agreement"
 HOK_KOR_democratic_expansion.5.desc:0 "The government of [FROM.GetName] has accepted the reciprocal licensed production agreement. Having checked the agreement, the staff immediately opened the list of equipment requiring separate negotiations.\n\n\"The signatures are done.\"\n\"The equipment contracts start here.\"\n\nThe two countries will use common procedures while negotiating production rights and terms for each type of equipment separately."
 HOK_KOR_democratic_expansion.5.a:0 "Let the officials proceed with the contracts."
 HOK_KOR_democratic_expansion.6.t:0 "[FROM.GetName] Declines the Licensed Production Agreement"
 HOK_KOR_democratic_expansion.6.desc:0 "The government of [FROM.GetName] has decided not to sign this licensed production agreement. The official attached its reply to the proposal.\n\n\"Shall I speculate on their reasons in the report?\"\n\"Record only the answer we have. The next negotiations will begin with that record too.\"\n\nGame rules:\nLicensed production terms between the two countries remain unchanged. A fresh proposal can be considered after the required interval between negotiations."
 HOK_KOR_democratic_expansion.6.a:0 "Keep the reply on file and await another opportunity."
