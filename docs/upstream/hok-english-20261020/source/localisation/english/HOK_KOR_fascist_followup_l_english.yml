#20261003_kpopmodder: Apply varied HOI4 fascist and communist voices to description narrative; preserve effects and explicit rules.
#20261003_kpopmodder: Explain new decision and spirit policies through concrete circumstances; preserve gameplay and lifecycle rules.
#20260926_kpopmodder: Use escaped ASCII dialogue quotes and compact decision UI text; preserve gameplay and explicit lifecycle warnings.
#20260926_kpopmodder: Compact new focus descriptions for the fixed-height UI; preserve gameplay and non-focus localisation.
#20260926_kpopmodder: Restore fictional NRSC command and conscription black comedy while preserving all gameplay rules.
#20260925_kpopmodder: Rewrite focus, decision and event prose with grounded voices; preserve keys, gameplay rules and paired Korean text.
#20260923_kpopmodder: Describe independent occupation, interservice and post-coup reconstruction policies and their actual gates.
 HOK_KOR_nrsc_military_administration:0 "Military Government Handbook"
 HOK_KOR_nrsc_military_administration_desc:0 "\"The army gives the orders, but where do people take complaints?\"\nThe officer points to the clerk's name in the handbook. \"Here.\"\nWe shall divide military government duties in the non-core territories we control."
 HOK_KOR_nrsc_civil_supply_offices:0 "Civilian Supply Offices"
 HOK_KOR_nrsc_civil_supply_offices_desc:0 "\"Another stamp?\"\n\"So we can find out where it got held up.\"\nWe shall reorganise supply and complaints offices to reduce the garrison burden. This can be pursued independently of the Complaints and Compensation Register."
 HOK_KOR_nrsc_claims_accounts:0 "Complaints and Compensation Register"
 HOK_KOR_nrsc_claims_accounts_desc:0 "\"Who took it?\" \"The army.\"\n\"The army must give a name too.\"\nWe shall record the units and officials responsible in complaints and property records."
 HOK_KOR_nrsc_civil_administration_rules:0 "Military Government Regulations"
 HOK_KOR_nrsc_civil_administration_rules_desc:0 "\"If these are the state's orders, why is the next desk saying something different?\"\nWe shall integrate supply and complaints work, adding compliance growth and lower garrison damage to the existing reductions in resistance and garrison requirements."
 HOK_KOR_nrsc_interservice_liaison:0 "Interservice Liaison Office"
 HOK_KOR_nrsc_interservice_liaison_desc:0 "\"Who's my superior?\"\n\"Go in and they'll all speak as though they are.\"\nThe Interservice Liaison Office shall coordinate the three services' supply requisitions and transport schedules."
 HOK_KOR_nrsc_joint_logistics_board:0 "Joint Logistics Board"
 HOK_KOR_nrsc_joint_logistics_board_desc:0 "Every requisition is stamped top priority.\n\"Top priorities must queue too.\"\nWe shall reduce army supply waste and naval and air force fuel waste. This can be pursued independently of the Integrated Requisition and Transport Register."
 HOK_KOR_nrsc_joint_dispatch_records:0 "Integrated Requisition and Transport Register"
 HOK_KOR_nrsc_joint_dispatch_records_desc:0 "\"We never ordered it.\" \"You signed here.\"\n\"I thought it was an exercise.\"\nWe shall link requisition and dispatch records, using communications research to connect handovers between the three services."
 HOK_KOR_nrsc_service_supply_rules:0 "Joint Logistics Regulations"
 HOK_KOR_nrsc_service_supply_rules_desc:0 "\"Any exceptions?\"\n\"Your unit's name isn't here.\"\nWe shall give the logistics board and register a common set of rules, strengthening the existing supply savings and naval and air force fuel savings together."
 HOK_KOR_nrsc_reconstruction_secretariat:0 "Reconstruction Administration Secretariat"
 HOK_KOR_nrsc_reconstruction_secretariat_desc:0 "\"Everything is urgent.\" \"That doesn't mean everything can come first.\"\nOnce the regime established after the Eulhae Military Uprising is in order and the war has ended, we shall coordinate reconstruction budgets. Requires ownership and full control of Gyeonggi."
 HOK_KOR_nrsc_public_accounts:0 "Prioritise the Administrative Budget"
 HOK_KOR_nrsc_public_accounts_desc:0 "\"Can reconstruction be done just by giving orders?\" \"Start with payment orders.\"\nWe shall give priority to administration and accounting, also supporting building repairs. Mutually exclusive with the construction budget."
 HOK_KOR_nrsc_construction_practice:0 "Prioritise the Construction Budget"
 HOK_KOR_nrsc_construction_practice_desc:0 "\"When do we start?\" \"On paper, we already have.\"\nWe shall give priority to civilian factory construction and building repairs. Mutually exclusive with the administrative budget. The Establish Regular Reconstruction Budgets focus strengthens it."
 HOK_KOR_nrsc_reconstruction_budget:0 "Establish Regular Reconstruction Budgets"
 HOK_KOR_nrsc_reconstruction_budget_desc:0 "\"Does this mean the reminders stop?\" \"They'll be regular too.\"\nWe shall strengthen the chosen budget. Administration supports daily Political Power and existing repair benefits; construction supports civilian factory construction and repair speed."
 HOK_KOR_nrsc_occupation_administration_1:0 "Occupation Administration System I"
 HOK_KOR_nrsc_occupation_administration_1_desc:0 "The National Salvation Army has declared that it has brought order and attentive care to the occupied territories. To make that true, residents seeking food should less often be greeted by the muzzle of a sentry's rifle. Civilian supply offices and military government officials shall take supply requests and complaints, sharing out everyday duties. Residents find the right office and soldiers return to guard duty. It hardly speaks well of our order when explaining our goodwill always requires armed men.\n\nThe institution remains if occupied territory is lost, but its occupation effects have no territory to apply to. Removed if the government ceases to be fascist."
 HOK_KOR_nrsc_occupation_administration_2:0 "Occupation Administration System II"
 HOK_KOR_nrsc_occupation_administration_2_desc:0 "Posters on the streets promise a peaceful new order. Residents at the counter ask where the property taken yesterday and the supplies still missing fit into that order. We shall bring the supply offices' ledgers, property and compensation records, and handovers by responsible units under common procedures, leaving someone answerable. Building a record of completed work, instead of asserting our authority from scratch each time, can reduce recurring friction and garrison casualties. After all, we must govern even those residents who find a poster unconvincing.\n\nReplaces Occupation Administration System I, adding compliance growth and reduced garrison damage to its existing benefits. Removed if the government ceases to be fascist."
 HOK_KOR_nrsc_service_coordination_1:0 "Joint Logistics Coordination I"
 HOK_KOR_nrsc_service_coordination_1_desc:0 "The army, navy and air force each claim top priority because they bear the nation's fate. Perhaps that fate can be divided into three, but the same warehouse and transport cannot. The Joint Logistics Board shall review each service's requisitions against actual operational schedules, reducing wasted supplies and fuel. Meetings drag on not because anyone lacks loyalty to the nation, but because each side believes it has quite enough.\n\nApplies separately from existing staff and supply policies. Removed if the government ceases to be fascist."
 HOK_KOR_nrsc_service_coordination_2:0 "Joint Logistics Coordination II"
 HOK_KOR_nrsc_service_coordination_2_desc:0 "In meetings, the nation's interests always come before the services' pride. Whether that remains true afterwards can only be established by reading requisition, dispatch and receipt records together. The common register and logistics regulations reduce duplicate demands and wasted journeys, carrying agreed arrangements for supplies and fuel across all three services even when the officials change. It has become harder to call an exception for one's own service a necessity for the entire nation.\n\nReplaces Joint Logistics Coordination I, strengthening all existing supply savings and naval and air force fuel savings. Removed if the government ceases to be fascist."
 HOK_KOR_nrsc_administrative_budget_1:0 "Reconstruction Administrative Budget I"
 HOK_KOR_nrsc_administrative_budget_1_desc:0 "The National Salvation Army has restored order and will pursue reconstruction with equal resolve. People on site awaiting payment would like to know whether that resolve can be delivered as building materials. We shall give priority to administration and accounting, appointing those responsible for reviewing requests and releasing funds. Support for building repairs will ensure that orders do not remain in the approval tray. If the state's authority is to reach the worksite, payment approvals must not lose their way.\n\nCannot be chosen together with the construction budget. Removed if the government ceases to be fascist."
 HOK_KOR_nrsc_administrative_budget_2:0 "Reconstruction Administrative Budget II"
 HOK_KOR_nrsc_administrative_budget_2_desc:0 "The National Salvation Army's decisions cannot be excellent for just one day. Particularly for institutions having to explain today what was approved yesterday. Regular reviews of requests and accounts, with continuity in responsibility for implementation, shall give the regime the foundations to put its decisions into effect every day. Existing support for building repairs is retained. When administration needs a special order every time it moves, there is a limit to how far this can demonstrate the leadership's exceptional competence.\n\nReplaces Reconstruction Administrative Budget I. Building repair benefits remain at their existing level. Removed if the government ceases to be fascist."
 HOK_KOR_nrsc_construction_budget_1:0 "Reconstruction Works Budget I"
 HOK_KOR_nrsc_construction_budget_1_desc:0 "In the speeches announcing reconstruction, the factory chimneys are already rising. On site, only the foundations are there, so the works will need some help keeping pace with the speeches. Giving priority to civilian factory construction and repairs to damaged buildings will bring people and materials together. We shall make the National Salvation Army's achievements visible. One cannot pose at the opening ceremony holding only a blueprint.\n\nCannot be chosen together with the administrative budget. Removed if the government ceases to be fascist."
 HOK_KOR_nrsc_construction_budget_2:0 "Reconstruction Works Budget II"
 HOK_KOR_nrsc_construction_budget_2_desc:0 "The first achievements of reconstruction deserve to be widely celebrated. If the next works involve another hunt for materials as though nothing had been built before, the boasting may have to wait. We shall plan expansion and repairs together, carrying experience from one site to the next and committing resources more quickly both to new civilian factories and to restoring existing buildings. Every ceremony may be new, but preparations for the works need not start from scratch each time.\n\nReplaces Reconstruction Works Budget I, strengthening both civilian factory construction and building repair benefits. Removed if the government ceases to be fascist."
