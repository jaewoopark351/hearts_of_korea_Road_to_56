#20261003_kpopmodder: Explain new decision and spirit policies through concrete circumstances; preserve gameplay and lifecycle rules.
#20260926_kpopmodder: Use escaped ASCII dialogue quotes and compact decision UI text; preserve gameplay and explicit lifecycle warnings.
#20260926_kpopmodder: Compact new focus descriptions for the fixed-height UI; preserve gameplay and non-focus localisation.
#20260925_kpopmodder: Rewrite focus, decision and event prose with grounded voices; preserve keys, gameplay rules and paired Korean text.
#20260923_kpopmodder: Localize shared project gates while preserving their flag conditions.
#20260923_kpopmodder: Describe regional operating conditions and shared field-specialization rewards.
 HOK_KOR_mc_county_dossiers:0 "Survey Manchurian Local Administration"
 HOK_KOR_mc_county_dossiers_desc:0 "People must not have to explain their circumstances afresh at every office. We will survey administrative districts in Manchuria. Ownership and full control of the relevant territory are required; losing either cancels the focus."
 HOK_KOR_mc_payroll_registers:0 "Local Public Services"
 HOK_KOR_mc_payroll_registers_desc:0 "The office must be open when residents arrive. We will establish Manchurian Public Services I. It applies only while we own and fully control the territory, and does not transfer to other regions or owners."
 HOK_KOR_mc_service_counters:0 "Administrative Communications Network"
 HOK_KOR_mc_service_counters_desc:0 "We will bridge the gap between documents said to have been sent and offices that say they never arrived. Research will support communications and the operation of facilities. This can be pursued before or after the other parallel policy."
 HOK_KOR_mc_dispute_records:0 "Coordinate Public Requests and Supplies"
 HOK_KOR_mc_dispute_records_desc:0 "Two offices are responsible for the supplies, yet neither delivers them where they are needed. Combining public services and communications will see requests from residents and requisitions through to completion."
 HOK_KOR_mc_service_calendar:0 "Regular Local Administration"
 HOK_KOR_mc_service_calendar_desc:0 "The office's promises must survive a change of officials. Public Services will advance to tier II, unlocking a 90-day project costing 150 Political Power. Restarting the project after regaining the territory restores the higher-tier institution."
 HOK_KOR_mc_interpreter_desks:0 "Multilingual Administrative Offices"
 HOK_KOR_mc_interpreter_desks_desc:0 "We will listen to residents before asking for their seals. Multilingual offices will open. Ownership and full control of the relevant territory are required; losing either cancels the focus."
 HOK_KOR_mc_residence_certificates:0 "Help Residents Settle"
 HOK_KOR_mc_residence_certificates_desc:0 "A new address does not mean that someone has settled in. We will establish Manchurian Community Support I. It applies only while we own and fully control the territory, and does not transfer to other regions or owners."
 HOK_KOR_mc_municipal_consultation:0 "Local Health and Education"
 HOK_KOR_mc_municipal_consultation_desc:0 "We will ask whom clinic guidance and school notices actually reach. Research will support the operation of health and education facilities. This can be pursued before or after the other parallel policy."
 HOK_KOR_mc_shared_service_manuals:0 "Joint Administration Agreement"
 HOK_KOR_mc_shared_service_manuals_desc:0 "People should receive the same guidance at every office. We will bring together working standards for settlement support, health and education in an established joint administration agreement."
 HOK_KOR_mc_community_mediation:0 "Regular Community Support"
 HOK_KOR_mc_community_mediation_desc:0 "People must still have somewhere to ask for help after receiving assistance. Community Support will advance to tier II, unlocking a 90-day project costing 150 Political Power. Restarting the project after regaining the territory restores the higher-tier institution."
 HOK_KOR_mc_workshop_inventory:0 "Survey Manchurian Industrial Stocks"
 HOK_KOR_mc_workshop_inventory_desc:0 "We will check whether the machinery listed in the accounts actually works. Manchuria's equipment and raw materials will be surveyed. Ownership and full control of the relevant territory are required; losing either cancels the focus."
 HOK_KOR_mc_metallurgical_trials:0 "By-Product Recovery System"
 HOK_KOR_mc_metallurgical_trials_desc:0 "Before discarding anything, we will see whether it can serve as raw material again. We will establish Manchurian Materials Recovery I. It applies only while we own and fully control the territory, and does not transfer to other regions or owners."
 HOK_KOR_mc_material_recovery:0 "Mineral Sorting Trials"
 HOK_KOR_mc_material_recovery_desc:0 "What a mineral can be used for matters more than its name. Research will support sorting trials and the practical use of technology. This can be pursued before or after the other parallel policy."
 HOK_KOR_mc_foundry_batches:0 "Exchanges between Smelters"
 HOK_KOR_mc_foundry_batches_desc:0 "Smelting workers who have used recovered materials will compare their records with the technicians conducting sorting trials. The two will pool their findings, sharing successful mixtures and failed processes alike."
 HOK_KOR_mc_integrated_recovery:0 "Materials Recovery Cooperation"
 HOK_KOR_mc_integrated_recovery_desc:0 "Recovered materials must not pile up in warehouses once more. Materials Recovery will advance to tier II, unlocking a 90-day project costing 150 Political Power. Restarting the project after regaining the territory restores the higher-tier institution."
 HOK_KOR_mc_tenancy_records:0 "Survey Housing in Gungnae"
 HOK_KOR_mc_tenancy_records_desc:0 "An address on record does not make a house habitable. We will survey housing and repair needs in Gungnae. Ownership and full control of the relevant territory are required; losing either cancels the focus."
 HOK_KOR_mc_sanitation_rounds:0 "Urban Infrastructure"
 HOK_KOR_mc_sanitation_rounds_desc:0 "The roads and drains outside a home are part of daily life as well. We will establish Gungnae Urban Management I. It applies only while we own and fully control the territory, and does not transfer to other regions or owners."
 HOK_KOR_mc_housing_repairs:0 "Housing Repair Techniques"
 HOK_KOR_mc_housing_repairs_desc:0 "If the same roof leaks again, sending more materials is not enough. Research will support repair techniques and the operation of facilities. This can be pursued before or after the other parallel policy."
 HOK_KOR_mc_market_inspections:0 "Market and Sanitation Improvements"
 HOK_KOR_mc_market_inspections_desc:0 "Someone must take responsibility for the problems between homes and markets as well. We will combine urban management and repair experience to improve sanitation on the streets residents use every day."
 HOK_KOR_mc_settled_municipality:0 "Everyday Life in the Settled City"
 HOK_KOR_mc_settled_municipality_desc:0 "We will build a city that works without special instructions. Urban Management will advance to tier II, unlocking a 90-day project costing 150 Political Power. Restarting the project after regaining the territory restores the higher-tier institution."
 HOK_KOR_mc_local_services_1:0 "Manchurian Public Services I"
 HOK_KOR_mc_local_services_1_desc:0 "An administrative institution in the target state. Applies only while Korea owns and fully controls the territory, and is removed at the daily update if those conditions are lost."
 HOK_KOR_mc_local_services_2:0 "Manchurian Public Services II"
 HOK_KOR_mc_local_services_2_desc:0 "An administrative institution in the target state. Applies only while Korea owns and fully controls the territory, and is removed at the daily update if those conditions are lost."
 HOK_KOR_mc_local_services_concentrated:0 "Intensive Manchurian Administration and Transport Project"
 HOK_KOR_mc_local_services_concentrated_desc:0 "A regional effect provided by a 90-day intensive project costing 150 Political Power. Removed when the project ends or is cancelled, or territorial conditions are lost."
 HOK_KOR_mc_community_services_1:0 "Manchurian Community Support I"
 HOK_KOR_mc_community_services_1_desc:0 "An administrative institution in the target state. Applies only while Korea owns and fully controls the territory, and is removed at the daily update if those conditions are lost. A democratic government must also be maintained."
 HOK_KOR_mc_community_services_2:0 "Manchurian Community Support II"
 HOK_KOR_mc_community_services_2_desc:0 "An administrative institution in the target state. Applies only while Korea owns and fully controls the territory, and is removed at the daily update if those conditions are lost. A democratic government must also be maintained."
 HOK_KOR_mc_community_services_concentrated:0 "Manchurian Settlement Support Project"
 HOK_KOR_mc_community_services_concentrated_desc:0 "A regional effect provided by a 90-day intensive project costing 150 Political Power. Removed when the project ends or is cancelled, or territorial conditions are lost."
 HOK_KOR_mc_material_recovery_1:0 "Manchurian Materials Recovery I"
 HOK_KOR_mc_material_recovery_1_desc:0 "An administrative institution in the target state. Applies only while Korea owns and fully controls the territory, and is removed at the daily update if those conditions are lost."
 HOK_KOR_mc_material_recovery_2:0 "Manchurian Materials Recovery II"
 HOK_KOR_mc_material_recovery_2_desc:0 "An administrative institution in the target state. Applies only while Korea owns and fully controls the territory, and is removed at the daily update if those conditions are lost."
 HOK_KOR_mc_material_recovery_concentrated:0 "Intensive Manchurian Materials Recovery Project"
 HOK_KOR_mc_material_recovery_concentrated_desc:0 "A regional effect provided by a 90-day intensive project costing 150 Political Power. Removed when the project ends or is cancelled, or territorial conditions are lost."
 HOK_KOR_mc_municipal_routine_1:0 "Gungnae Urban Management I"
 HOK_KOR_mc_municipal_routine_1_desc:0 "An administrative institution in the target state. Applies only while Korea owns and fully controls the territory, and is removed at the daily update if those conditions are lost."
 HOK_KOR_mc_municipal_routine_2:0 "Gungnae Urban Management II"
 HOK_KOR_mc_municipal_routine_2_desc:0 "An administrative institution in the target state. Applies only while Korea owns and fully controls the territory, and is removed at the daily update if those conditions are lost."
 HOK_KOR_mc_municipal_routine_concentrated:0 "Gungnae Housing and Facilities Repair Project"
 HOK_KOR_mc_municipal_routine_concentrated_desc:0 "A regional effect provided by a 90-day intensive project costing 150 Political Power. Removed when the project ends or is cancelled, or territorial conditions are lost."
 HOK_KOR_manchurian_followup_programs:0 "Manchurian Administrative Projects"
 HOK_KOR_manchurian_followup_programs_desc:0 "Office intake records, residents' homes, recovered materials in warehouses and urban construction schedules may seem like separate concerns, but together they keep daily life in the region moving. Building on the institutions established in each field, we will concentrate support on practical bottlenecks. Each project requires completion of the final focus in its field.\n\nEach project costs 150 Political Power and occupies no civilian factories. A regional intensive effect applies for 90 days from the start, with only one of the four projects allowed at a time. When a project ends or is cancelled, all four share a 90-day waiting period. A relevant tier II institution removed because territorial conditions were lost is restored by restarting its project after the territory is regained. It remains after the 90-day project ends if its own conditions are still met. Regional institutions are also removed at the daily update if territorial conditions are lost. No factories or resources are permanently granted, and one-off rewards already received from focuses are not taken back."
 HOK_KOR_mc_local_services_project:0 "Intensive Manchurian Administration and Transport Project"
 HOK_KOR_mc_local_services_project_desc:0 "\"It is not that the goods are missing. No one has decided where to receive them.\"\nOffices send requisitions back to warehouses, warehouses send them on to other offices, and supplies wait for transport. We will assign receiving officials and destinations, and coordinate warehouse and railway schedules so that administrative requests lead to actual deliveries.\n\nCosts 150 Political Power and provides an intensive administration and transport effect for 90 days from the start. Restores Manchurian Public Services II if previously acquired and subsequently removed. The tier II institution remains after the 90-day project ends if its own conditions are still met. Occupies no civilian factories. Only one Manchurian administrative project may run at a time; all four share a 90-day waiting period after completion or cancellation. Cancelled if continuing requirements, including ownership and full control of the target territory, are lost, or in the event of capitulation or civil war. Costs are not refunded."
 HOK_KOR_mc_community_services_project:0 "Manchurian Settlement Support Project"
 HOK_KOR_mc_community_services_project_desc:0 "Residents should not have to explain the same circumstances again at every office. We will align intake and handover procedures between multilingual offices and local institutions so that guidance from the office that verified a resident's address is also recognised by schools and clinics. Settlement support will help people with a new address find the assistance they need for daily life as well.\n\nCosts 150 Political Power and provides an intensive settlement support effect for 90 days from the start. Restores Manchurian Community Support II if previously acquired and subsequently removed. The tier II institution remains after the 90-day project ends if its own conditions are still met. Occupies no civilian factories. Only one Manchurian administrative project may run at a time; all four share a 90-day waiting period after completion or cancellation. Requires a democratic government and ownership and full control of the target territory. Cancelled if these conditions are lost, or in the event of capitulation or civil war. Costs are not refunded."
 HOK_KOR_mc_material_recovery_project:0 "Intensive Manchurian Materials Recovery Project"
 HOK_KOR_mc_material_recovery_project_desc:0 "We will connect shortages of raw materials with stocks of recovered goods. If recovered materials remain mixed together in warehouses, smelters can do little but wait for fresh supplies. Sorting records will be matched to smelters' requirements, with intensive support for handovers and transport to get reusable materials to the processes that need them.\n\nCosts 150 Political Power and provides an intensive materials recovery effect for 90 days from the start. Restores Manchurian Materials Recovery II in the relevant states if previously acquired and subsequently removed. The tier II institution remains after the 90-day project ends if its own conditions are still met. Occupies no civilian factories. Only one Manchurian administrative project may run at a time; all four share a 90-day waiting period after completion or cancellation. Losing ownership or full control of even one target state cancels the entire project, as does loss of other continuing requirements, capitulation or civil war. Costs are not refunded."
 HOK_KOR_mc_municipal_routine_project:0 "Gungnae Housing and Facilities Repair Project"
 HOK_KOR_mc_municipal_routine_project_desc:0 "We will begin by reducing the need to dig up the road just after repairing a house. When deliveries of housing repair materials clash with road and drainage work, residents and workers are left waiting at the same blocked street. We will review Gungnae's housing and construction records together, coordinating material deliveries with infrastructure maintenance so that work across the city does not get in its own way.\n\nCosts 150 Political Power and provides an intensive housing and facilities repair effect for 90 days from the start. Restores Gungnae Urban Management II if previously acquired and subsequently removed. The tier II institution remains after the 90-day project ends if its own conditions are still met. Occupies no civilian factories. Only one Manchurian administrative project may run at a time; all four share a 90-day waiting period after completion or cancellation. Cancelled if continuing requirements, including ownership and full control of the target territory, are lost, or in the event of capitulation or civil war. Costs are not refunded."
