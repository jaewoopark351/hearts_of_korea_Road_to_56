l_english:
 KOR_agrarian_society:0 "Agrarian Society"
 KOR_agrarian_society_desc:0 "The Republic of Korea is a predominantly agrarian society. Around half its people work in agriculture, and attempts to mechanise farming have failed. There is simply no prospect of getting farmers to do other work during the busy farming season."
 KOR_great_depression:0 "Great Depression"
 KOR_great_depression_desc:0 "Beginning with the American stock market crash of 1929, the Great Depression has spread across the world and dealt a severe blow to the Korean economy. Unemployment has soared and tax revenues have plummeted. Almost every business except a handful of chaebol conglomerates and their affiliates has gone bankrupt. Even now, our streets are filled with long queues of unemployed people at soup kitchens and the sight of gaunt women and children begging."
 KOR_home_of_the_free:0 "Asia's Beacon of Freedom"
 KOR_home_of_the_free_desc:0 "We are Asia's only \"true\" democracy. We have held our ground while China groans under warlords, military dictators and mounted bandits, while Japan wallows in fanatical militarism and primitive, feudal emperor worship, and while other parts of Asia suffer under Western imperialism. Our people consider this country Asia's only modern nation-state. The spirit of freedom, independence and democracy embodied by the Hanseong Republican Government of 1905 still beats in their hearts."
 KOR_legacy_of_resistance:0 "Legacy of Resistance"
 KOR_legacy_of_resistance_desc:0 "From the Goguryeo–Sui War, the Silla–Tang War and the Goryeo–Liao Wars to the resistance against the Mongols, the Japanese invasions of the Imjin War, the Later Jin invasion of 1627 and the Korean-Japanese-Russian War, our history has been a struggle to defend our independence against foreign powers. Like the mugunghwa flower that blooms again after withering, we have endured, willingly making great sacrifices to preserve our own language and culture against stronger foes. Any invader who sets foot on our sacred soil will pay dearly. Even if we are enslaved by a foreign power, our people will resist to the end."
 KOR_ridiculed_army:0 "A Ridiculed Army"
 KOR_ridiculed_army_desc:0 "The Republic of Korea's armed forces are far from an elite fighting force. Thirty years of peace since the Korean-Japanese-Russian War have erased their combat experience. Having remained neutral during the Great War, they now lag some twenty years behind in doctrine, tactics and weapons development. Confucian values that have prized literary accomplishment over martial skill since Joseon also lead people to regard military service as an 'unpleasant' occupation. It is common for civilians to mock men in uniform."
 KOR_disjointed_government:0 "Political Turmoil"
 KOR_disjointed_government_desc:0 "Korean politics are anything but stable. Amid the turmoil following the Great Depression, the bloody suppression of the Daegu Socialisation Movement and the forced dissolution of the Korean Social Democratic Party and the Workers' Party of Joseon were followed in 1931 by a coalition agreement between the Liberal Party and the Independence Party. Many saw this as a cynical bargain and began to doubt how representative our democracy really was. The Seoul Communist Group has grown by exploiting the Rhee government's failure to respond promptly to the Depression. The Supreme Council for National Reconstruction loathes communism, fears the Soviet Union on our northern border and admires German and Italian fascism. Clashes involving these movements, together with factional infighting within the coalition, frequently turn bloody. Without a suitable 'clean-up', these forces threaten to overthrow the country."
