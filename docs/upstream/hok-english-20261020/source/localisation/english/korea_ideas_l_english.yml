 KOR_homeland_defence_special_act_ideas:0 "Special Homeland Defence Act"
 KOR_homeland_defense_special_act_ideas_desc:0 "Our enemies have been foolish enough to invade free Korea. Just as they did in the Goguryeo–Sui War, the Silla–Tang War, the resistance against the Mongols, the Imjin War and the Korean-Japanese-Russian War, our people stand united to the very last person, ready to send these invaders into the fires of hell!"
