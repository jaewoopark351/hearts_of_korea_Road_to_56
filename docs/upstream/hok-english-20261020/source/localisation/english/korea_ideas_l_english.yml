 KOR_jaeryeong_plain_agricultural_products:0 "Fruits of Agricultural Support in the Jaeryeong Plain"
 KOR_jaeryeong_plain_agricultural_products_desc:0 "Alongside the Honam Plain, traditionally one of the peninsula's main farming regions, the newly developed Jaeryeong Plain in Hwanghae now supplies the Seoul and Pyongyang metropolitan areas with affordable, high-quality agricultural and livestock products. Even after feeding those cities, it produces a substantial surplus. Our soldiers can therefore enjoy generous helpings of good rice, kimchi, soya beans, pork and eggs."
