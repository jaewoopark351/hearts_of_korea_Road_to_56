l_english:
 landmark_gyeongbokgung: "Gyeongbokgung Palace"
 landmark_gyeongbokgung_plural: "$landmark_gyeongbokgung$"
 landmark_gyeongbokgung_desc: "Built in 1395 as Joseon's principal royal palace, Gyeongbokgung was destroyed during the Japanese invasions of 1592 and lay in ruins for 275 years. In 1867, it was rebuilt under the direction of Heungseon Daewongun, Yi Ha-eung. It subsequently became one of the Korean Empire's main palaces. After the Korean-Japanese-Russian War ended in 1906, Philip Jaisohn (Seo Jae-pil), known by his pen name Songjae, proclaimed the abolition of the monarchy and the establishment of a republic here on behalf of the Hanseong Republican Government. The palace has served as the Republic of Korea's presidential palace ever since. For a country with a strongly centralised state dating back to Joseon, Gyeongbokgung embodies supreme power over the peninsula and the authority that accompanies it."
