 HOK_JAP_gain_core_on_north_sakhalin_category:0 "Recover Northern Sakhalin"
 HOK_JAP_gain_core_on_north_sakhalin_category_desc:0 "Northern Sakhalin, known in Japanese as Sagaren, was administered jointly by Japan and Russia under the Treaty of Shimoda of 1855, then lost under the Karafuto–Chishima Exchange Treaty of 1875. Unlike southern Sakhalin, or Karafuto, recovered after the Korean-Japanese-Russian War ended in 1906, it remained unrecovered. Now that we have finally reclaimed it, we must declare this land our territory once again!"
