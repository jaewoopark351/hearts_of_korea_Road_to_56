l_english:

 #20260909_kpopmodder: 원작 HoK 일본 민주주의 분기 문자열을 영문·한국어 채널에 함께 복구합니다.
 # HoK Japanese democratic focuses
 HOK_JAP_strengthen_civilian_government:0 "Strengthen Civilian Government"
 HOK_JAP_strengthen_civilian_government_desc:0 "The growing value placed on liberalism and democracy will be a great source of strength for our country, rather than a threat. We must further strengthen civilian government so that it can protect these ideals."
 HOK_JAP_ally_with_the_zaibatsus:0 "Cooperate with the Zaibatsu"
 HOK_JAP_ally_with_the_zaibatsus_desc:0 "Our country's great business conglomerates have long held unprecedented political and economic power. They are proof of the opportunities that freedom and individuality allow, and we must cooperate with them in the national interest."
 HOK_JAP_research_spending:0 "Research Spending"
 HOK_JAP_research_spending_desc:0 "To make the most of our country's finest minds, we must allocate a research and development budget large enough to match their abilities."
 HOK_JAP_returning_home_SMCR_elite:0 "Recall the South Manchuria Railway Elite"
 HOK_JAP_returning_home_SMCR_elite_desc:0 "The South Manchuria Railway Company, known as Mantetsu, is more than a railway company: it is an armaments business and a think tank, drawing scholars and young people of many political persuasions deemed 'subversive' at home. Now that our country can once again embrace different perspectives, we must recall them so that their talents can serve the nation again."
 HOK_JAP_invest_nigo_project:0 "Resume the Ni-Go Project"
 HOK_JAP_invest_nigo_project_desc:0 "Early experiments in atomic science have yielded promising results. Harnessing this power would give us weapons unlike anything humanity has ever seen."
 HOK_JAP_oppose_peace_preservation_law:0 "Oppose the Peace Preservation Law"
 HOK_JAP_oppose_peace_preservation_law_desc:0 "Enacted in 1925, the Peace Preservation Law provided the legal basis for suppressing republican, liberal and civil rights movements, as well as communists and socialists, within Japan. Since the Great Depression, its scope and penalties have been strengthened further. This oppressive law curtails our freedom and accelerates the country's militarisation. We shall oppose it resolutely."
 HOK_JAP_memories_of_taisho_democracy:0 "Memories of Taisho Democracy"
 HOK_JAP_memories_of_taisho_democracy_desc:0 "Before our country became militarised, the 1920s saw functioning civilian control, a separation of powers and freedom of the press. It was also a cultural and economic golden age for Japan. We must encourage public nostalgia for those 'good old days' and urge the people to reclaim their rights."
 HOK_JAP_purge_the_militarists:0 "Purge the Militarists"
 HOK_JAP_purge_the_militarists_desc:0 "If more rational thinking is to prevail, we must purge our islands of those who believe military force is the answer to everything. Let them seek their fortunes beyond our borders."
 HOK_JAP_pre_emptive_coup:0 "Minshu Ikki: The Democratic Uprising"
 HOK_JAP_pre_emptive_coup_desc:0 "The time has come. The current government and the military are running out of control, losing support and preparing a desperate last stand. Leaving them to it will bring disaster upon our country. Liberals, socialists, communists, farmers, the marginalised Burakumin communities, younger officers, police officers and junior officials: at this moment, we are all brothers. It is time to rise for our children's freedom and future."
 HOK_JAP_the_showa_constitution:0 "The Showa Constitution"
 HOK_JAP_the_showa_constitution_desc:0 "We accept and respect the history of the imperial house, but authoritarianism has no place in the Japan we seek to build. The Emperor shall remain a symbolic leader, with his powers limited by a constitution, as in many Western countries."
 HOK_JAP_proclaim_the_republic:0 "Proclaim the Republic"
 HOK_JAP_proclaim_the_republic_desc:0 "Japan's Emperor is the legitimate heir to an unbroken line descending from the goddess Amaterasu Omikami. Yet for a thousand years, from the Heian era until the restoration of imperial rule, the imperial throne held no real power. Since the Meiji Restoration, the throne has encouraged the militarists to compete in displays of loyalty, making it the chief culprit in our country's militarisation. There will therefore be no place for the Emperor in the coming age of the people. In keeping with the times, we shall proclaim a republic in which the people are sovereign."
 HOK_JAP_strength_civilian_control:0 "Strengthen Civilian Control"
 HOK_JAP_strength_civilian_control_desc:0 "Under the old government, the Imperial Army and Imperial Navy defied civilian authority on the pretext that they answered only to the Emperor. Like samurai warlords of an earlier age, they repeatedly staged coups and murdered heads of government. Such conduct can no longer be tolerated in the new era. We must require them to swear loyalty to the people's government and place them under government supervision."
 HOK_JAP_new_officers:0 "Support the New Officer Corps"
 HOK_JAP_new_officers_desc:0 "Our armed forces suffered heavy casualties and the collapse of the officer corps during the civil war. Yet we also discovered new talent that had gone unrecognised for various reasons. Promoting these officers and entrusting them with command can fill the gaps, while their advancement will further consolidate the government's authority over the military."
 HOK_JAP_joint_staff_office:0 "Joint Staff Office"
 HOK_JAP_joint_staff_office_desc:0 "Under the old government, the Imperial Army and Imperial Navy traced their origins to the Choshu and Satsuma domains respectively. Their rivalry had continued since the Satsuma Rebellion, severely damaging joint operations and weapons development. We must therefore establish a new joint headquarters to coordinate the army and navy, replacing the Imperial General Headquarters. Its chief, appointed by the civilian government, shall hold full operational command and coordinate both services' operations."
 HOK_JAP_citizen_in_uniform:0 "Citizens in Uniform"
 HOK_JAP_citizen_in_uniform_desc:0 "Our armed forces are no longer an army of slaves that treats unquestioning obedience to superiors as a virtue. They are a people's army defending our homes and our country. We can unite them in spirit through a sense of duty to honour the countless citizens who shed their blood in the civil war and to defend the democratic government their sacrifice made possible."
 HOK_JAP_review_foreign_policy:0 "Review Foreign Policy"
 HOK_JAP_review_foreign_policy_desc:0 "Unrest at home is subsiding, but crises arising in Europe increasingly threaten our freedom. We must strengthen our ties with free and friendly nations so that we can weather this age of crisis together."
 HOK_JAP_datsuonyua:0 "Leave Europe, Join Asia"
 HOK_JAP_datsuonyua_desc:0 "Since the Meiji Restoration, we have called ourselves a European nation rather than part of uncivilised Asia. Now the age of Asia has come again. A free Asian alliance centred on [JAP.GetNameDef] must embody the spirit of the times and become the central task of our national strategy."
 HOK_JAP_go_with_korea:0 "Conclude a Japanese–Korean Alliance"
 HOK_JAP_go_with_korea_desc:0 "Since the Korean-Japanese-Russian War ended in 1906, our relations with Korea could hardly be called good, even in the politest terms. Yet we share the values of freedom and democracy, and are destined to confront the Soviet threat from the north together. As the vanguard defending freedom and democracy in the Far East, our two nations must strengthen their security partnership."
 HOK_JAP_rok_jpn_free_trade_agreement:0 "Japanese–Korean Free Trade Agreement"
 HOK_JAP_rok_jpn_free_trade_agreement_desc:0 "Most of [JAP.GetNameDef] is mountainous. Since industrialisation, a shortage of farmland has left us dependent on imports for most of our rice. Korea, by contrast, boasts enormous agricultural output, exemplified by the Honam Plain. Trade between our two nations would allow each to meet the other's needs."
 HOK_JAP_rebuild_anglo_japanese_alliance:0 "Rebuild the Anglo-Japanese Alliance"
 HOK_JAP_rebuild_anglo_japanese_alliance_desc:0 "Our alliance with Britain was dissolved under the Washington Naval Treaty of 1921. Nevertheless, our two countries have much in common and could be dependable allies in halting the Soviet advance southwards. We must therefore propose rebuilding the Anglo-Japanese Alliance."
 HOK_JAP_pacific_guardian:0 "Guardian of the Pacific"
 HOK_JAP_pacific_guardian_desc:0 "We shall take on the role of guardian to every Asian nation around the Pacific. Once freed from Western imperialism, they will need a guiding hand to lead them towards full democracy."
 HOK_JAP_anti_communist_bulwark:0 "Anti-communist Bulwark"
 HOK_JAP_anti_communist_bulwark_desc:0 "The principles of democracy are incompatible with communism. We must stand firm against this ideology, protecting both ourselves and all those who rely on us."
 HOK_JAP_liberation_of_manchuria:0 "Liberation of Manchuria"
 HOK_JAP_liberation_of_manchuria_desc:0 "The puppet state we once established in Manchuria remains, along with the militarists we expelled. Both still threaten our freedom and democratic government. We must eradicate them for good, washing away our dishonour and securing our safety."
 HOK_JAP_demand_sagaren:0 "Demand Northern Sakhalin"
 HOK_JAP_demand_sagaren_desc:0 "Sakhalin currently contains our only land border and is our ancestral territory, settled by us since the seventeenth century. We must therefore firmly demand that [SOV.GetNameDef], which occupies this territory, hand it over."
 HOK_JAP_rebuild_the_goverment:0 "Rebuild the Government Administration"
 HOK_JAP_rebuild_the_goverment_desc:0 "The civil war has shattered the administrative systems and civil service organisations of countless government bodies. We must rebuild the machinery of government."
 HOK_JAP_abolition_peace_preservation_law:0 "Abolish the Peace Preservation Law"
 HOK_JAP_abolition_peace_preservation_law_desc:0 "A new era has dawned, and it is time to abolish the Peace Preservation Law, a relic of the old order. Liberals at home and figures in the colonies will warmly welcome this measure."
 HOK_JAP_expansion_of_local_autonomy:0 "Expand Local Self-government"
 HOK_JAP_expansion_of_local_autonomy_desc:0 "Before the domains were abolished and replaced with prefectures, [JAP.GetNameDef] was a country of local self-government, where local affairs were handled locally. Excessive centralisation after the Meiji Restoration accelerated the country's militarisation. We shall learn from this and expand local powers."
 HOK_JAP_disband_takumusho:0 "Dissolve the Ministry of Colonial Affairs"
 HOK_JAP_disband_takumusho_desc:0 "The Ministry of Colonial Affairs administered all the old Japanese Empire's colonies. A hotbed of inhumane colonial rule and exploitation, it is hated by the colonised peoples. We shall abolish it and place every colony directly under the Cabinet and government. The constitution of [JAP.GetNameDef] shall apply to the colonies just as it does to the home islands, ending rule with an iron fist."
 HOK_JAP_free_election_in_taiwan:0 "Free Elections in Taiwan"
 HOK_JAP_free_election_in_taiwan_desc:0 "Taiwan, acquired after the Sino-Japanese War of 1895, has long been troubled by demonstrations demanding independence. We shall therefore hold a free vote for local Taiwanese residents, excluding those of Japanese descent, giving them the choice between independence and integration into our home territory."
 HOK_JAP_develop_taiwan:0 "Develop Taiwan"
 HOK_JAP_develop_taiwan_desc:0 "Taiwan may be small beside Honshu, but it has an ample workforce and the potential to develop heavy industry. We must invest more in the island."
 HOK_JAP_integrate_nanyo_gunto:0 "Integrate the South Seas Islands"
 HOK_JAP_integrate_nanyo_gunto_desc:0 "The former German Pacific islands we gained in return for joining the Great War in Europe are currently administered as a League of Nations mandate. Yet their indigenous populations have already been assimilated to a considerable degree. We shall therefore formally integrate these territories into our home territory."
 HOK_JAP_develop_nanyo_gunto:0 "Develop the South Seas Islands"
 HOK_JAP_develop_nanyo_gunto_desc:0 "The South Seas Islands are our bridgehead for expansion southwards and our base for reaching out into the ocean. We must invest more in the region."
 HOK_JAP_develop_home_island:0 "Develop Industry in the Home Islands"
 HOK_JAP_develop_home_island_desc:0 "Some claim there is no room left to develop Honshu. This is untrue, merely a pretext for invading the continent. Our homeland still abounds in places needing development and promising industries. The home islands alone give us the potential to become an industrial power capable of competing with the world's leading industrial nations."
 HOK_JAP_making_use_of_our_islands:0 "Make Use of Our Islands"
 HOK_JAP_making_use_of_our_islands_desc:0 "We have possessed countless islands since ancient times, yet they have all been neglected. We shall make them more strategically and materially valuable to the nation."
 HOK_JAP_karafuto_oil_field:0 "Develop the Karafuto Oilfields"
 HOK_JAP_karafuto_oil_field_desc:0 "Southern Sakhalin, recovered from the Russian Empire in the Korean-Japanese-Russian War, holds oil deposits. Small oilfields are already operating, but there is potential to extract much more. We must develop these oilfields further and reduce our dependence on foreign oil."
 HOK_JAP_home_island_agriculture:0 "Encourage Domestic Agriculture"
 HOK_JAP_home_island_agriculture_desc:0 "Since industrialisation and the Great Depression, our agriculture has lost its ability to compete with imported produce on price and is falling into decline. Rural young people are being driven towards despair and extremism. We must introduce policies to revive agriculture in the home islands."
 HOK_JAP_development_tohoku_region:0 "Resume Tohoku Development"
 HOK_JAP_development_tohoku_region_desc:0 "After the Korean-Japanese-Russian War thwarted our attempt to advance onto the Korean Peninsula, Tohoku received substantial investment and development as an alternative. Yet it still lags behind the Pacific Belt. We shall invest further in Tohoku's infrastructure."
 HOK_JAP_modernize_tatara_ironworks:0 "Modernise Tatara Ironmaking"
 HOK_JAP_modernize_tatara_ironworks_desc:0 "Tatara is a traditional Japanese ironmaking method using the iron sand abundant in Tohoku. Industrialisation and Westernisation after the Meiji Restoration caused it to be forgotten. We must find ways to modernise tatara ironmaking and put it to use in heavy industry."
 HOK_JAP_tohoku_dairy_farming:0 "Support Tohoku Dairy Farming"
 HOK_JAP_tohoku_dairy_farming_desc:0 "Tohoku's cool climate and broad plains make it well suited to dairy farming. We shall put cattle and horses out to pasture here, concentrating on high-value dairy farming using the products they provide."
 HOK_JAP_sinkansen:0 "Shinkansen Trunk Railway"
 HOK_JAP_sinkansen_desc:0 "The railways of [JAP.GetNameDef] carry relatively little freight for their size because they were built to narrow gauge from the outset. We must improve our rail transport capacity by building higher-capacity standard-gauge trunk lines alongside the existing routes."
 HOK_JAP_strength_civilian_control_tt:0 "§GRemoves§! the §YPolitically Connected§! trait from all army commanders."
 HOK_JAP_go_with_korea_tt:0 "If we lead our faction, invite §YKorea§! to join it. If we do not lead our faction, propose to our faction leader that §YKorea§! be invited to join."
 HOK_JAP_sinkansen_tooltip:0 "Raises the railway from §YTokyo§! to §YNagasaki§! to §Glevel 5§!."

 # Events
 hok_jap_democratic.1.t:0 "The People Demand Repeal of the Peace Preservation Law"
 hok_jap_democratic.1.d:0 "Protests against the Peace Preservation Law, once confined to a few areas, have now spread widely. Today, major Japanese cities, including Tokyo and Osaka, were packed with demonstrators demanding the law's repeal, an end to militarism and the restoration of democracy. Young university students, intellectuals, liberals, communists, Burakumin and protesters from many other backgrounds and walks of life are confronting Imperial Army military police, the Tokyo Metropolitan Police and local police rushed to the scene. What should we do?"
 hok_jap_democratic.1.a:0 "Disloyal traitors! Open fire!"
 hok_jap_democratic.1.b:0 "We must listen to the people's voice."
 hok_jap_democratic.2.t:0 "Tatsuji Fuse"
 hok_jap_democratic.2.d:0 "Today, Tatsuji Fuse was arrested at his home by the Special Higher Police on suspicion of violating the Peace Preservation Law. A former prosecutor and human rights lawyer, he also has a political career, having stood for the Labour-Farmer Party and been elected to the House of Representatives in the 1928 general election. Respected by ordinary people, he led the recent protests demanding the law's repeal. \n\nHe criticised the Peace Preservation Law and the current regime's lack of democratic legitimacy, declaring that he would continue to fight for the law's repeal and the restoration of democracy. \n\nAfter twelve hours of torture, he confessed to every charge. What should we do with him?"
 hok_jap_democratic.2.a:0 "Charge him under the Peace Preservation Law and throw him into Osaka Prison!"
 hok_jap_democratic.3.t:0 "Militarists Exiled to Manchukuo"
 hok_jap_democratic.3.d:0 "The government has decided to send military hardliners to Manchukuo temporarily in an effort to quieten its opponents. Most are already well known by name and face to the opposition for their role in suppressing the recent protests against the Peace Preservation Law. The current government and military hope that exiling them to Manchuria will ease public anger, but whether it will work remains uncertain..."
 hok_jap_democratic.3.a:0 "Dumping them in Manchuria should keep things quiet for a while, shouldn't it?"
 hok_jap_democratic.4.t:0 "Japanese Militarists"
 hok_jap_democratic.4.d:0 "Today, the Empire of Japan unilaterally informed us that it would be sending us some of its military officers. The Japanese ambassador in Manchukuo said little, but many appear to be hardliners associated with the Imperial Way Faction. They have sworn loyalty to us and begun their struggle to turn our army into a powerful force."
 hok_jap_democratic.4.a:0 "Gentlemen, welcome to Manchuria!"
 hok_jap_democratic.5.t:0 "Democrats Plot a Pre-emptive Coup"
 hok_jap_democratic.5.d:0 "After the military threatened once again to restrict the people's inviolable democratic rights under the Peace Preservation Law, democratic elements within the government launched a surprise attack against the state. The Japanese National Liberation Committee has been formed in western Japan, led by democrats, liberals, communists, regular police officers, trade unions and Burakumin long dissatisfied with the military. With astonishing speed, a substantial part of the armed forces has taken up arms to defend the people and their right to freedom.\n\nThis split in the military has allowed representatives of the people to seize power in the legislature and executive. The civil war has only just begun, but Tokyo's current militarist government is unlikely to submit easily."
 hok_jap_democratic.5.a:0 "Drive out the militarist scum for our children's freedom and future!"
 hok_jap_democratic.6.t:0 "Civil War in the Japanese Empire"
 hok_jap_democratic.6.d:0 "The Empire of Japan, which has played the overlord and interfered in every affair of ours in Manchuria, has fallen into civil war! As conflict between Japan's democrats and militarists escalates, most Japanese officials and the Kwantung Army have withdrawn to suppress the uprising. Some Kwantung Army officers have sworn loyalty to us instead of returning to Japan. Japanese influence over Manchukuo has now disappeared completely. \n\n For the first time since Manchukuo's founding in 1931, we have finally regained complete freedom."
 hok_jap_democratic.6.a:0 "Now is the time to restore the glory of the Manchu people!"
 hok_jap_democratic.7.t:0 "Seize Lushun"
 hok_jap_democratic.7.d:0 "With Japan descending into civil war, the Japanese garrison guarding the leased territory of Lushun at the tip of the Liaodong Peninsula has also withdrawn to the home islands. Lushun is now effectively unclaimed territory, offering a perfect opportunity to enter without bloodshed. \n\n Our Imperial Guard is already prepared to seize Lushun."
 hok_jap_democratic.7.a:0 "Advance!"
 hok_jap_democratic.8.t:0 "Lushun Seized by Manchukuo!"
 hok_jap_democratic.8.d:0 "While the civil war rages on Honshu, Manchukuo's troops have entered Lushun harbour without bloodshed, following the withdrawal of our garrison for the war. As our flag is lowered from the local flagstaff and theirs is raised, there is nothing we can do for now..."
 hok_jap_democratic.8.a:0 "Damn it!"
 hok_jap_democratic.9.t:0 "Seize East Hebei"
 hok_jap_democratic.9.d:0 "With Japan descending into civil war, all its garrisons have withdrawn from East Hebei, which it has occupied since the Manchurian Incident of 1931. Their turmoil gives us a perfect opportunity to enter East Hebei without bloodshed. \n\n Local commanders of the Northeastern Army are already prepared to advance into East Hebei."
 hok_jap_democratic.9.a:0 "Advance!"
 hok_jap_democratic.10.t:0 "East Hebei Seized by the Republic of China's Northeastern Army!"
 hok_jap_democratic.10.d:0 "While the civil war rages on Honshu, the Republic of China's Northeastern Army has entered East Hebei without bloodshed, following the withdrawal of our garrison for the war. As our flag is lowered from the local flagstaff and theirs is raised, there is nothing we can do for now..."
 hok_jap_democratic.10.a:0 "Damn it!"
 hok_jap_democratic.12.t:0 "The Fate of the Imperial Family"
 hok_jap_democratic.12.d:0 "The Japanese National Liberation Committee has decided to abolish the monarchy and proclaim a republic, but one question remains: what is to become of the Emperor and his family? Most former imperial family members have already been expelled from military and public office. Yet many of our people still revere the Emperor, making the family's treatment a serious headache. Most committee members favour exile to Switzerland, fearing attempts to restore the monarchy and destabilise domestic politics. Some, however, propose a small independent state comprising the Kyoto Imperial Palace, the Emperor's residence until 1868, and the surrounding ten metres, where he could remain as head of Shinto. What shall we do?"
 hok_jap_democratic.12.a:0 "Confiscate their property and exile them to Switzerland."
 hok_jap_democratic.12.b:0 "Establish an imperial state in Kyoto as a Shinto Vatican."
 hok_jap_democratic.13.t:0 "Japan Proposes a Korean–Japanese Free Trade Agreement"
 hok_jap_democratic.13.d:0 "Today, Kenzo Nakagawa, the ambassador of [JAP.GetNameDef] to [KOR.GetNameDef], visited Gyeongbokgung Palace to propose a Korean–Japanese free trade agreement. They wish to import more of our agricultural produce, which would greatly benefit our national finances. How shall we respond?"
 hok_jap_democratic.13.a:0 "An excellent idea!"
 hok_jap_democratic.13.b:0 "No."
 hok_jap_democratic.14.t:0 "Korea Agrees to the Japanese–Korean Free Trade Agreement"
 hok_jap_democratic.14.d:0 "Ahn Jae-hong, the ambassador of [KOR.GetNameDef] to [JAP.GetNameDef], has informed us that his government agrees to conclude the Japanese–Korean trade agreement we proposed. We shall now import Korean agricultural produce cheaply, while they gain additional income."
 hok_jap_democratic.14.a:0 "Excellent."
 hok_jap_democratic.15.t:0 "Free Elections in Taiwan"
 hok_jap_democratic.15.d:0 "Today, the civil administration of [JAP.GetNameDef] in Taiwan, housed in the former Governor-General's office, announced a vote on Taiwanese independence. The news has spread rapidly through the local press, and voting is scheduled for tomorrow. \n\nWe must now wait to see whether they choose independence or full integration into our home territory..."
 hok_jap_democratic.15.a:0 "Let us hear the voices of the Taiwanese people."
 hok_jap_democratic.16.t:0 "Taiwan Chooses Integration"
 hok_jap_democratic.16.d:0 "Fortunately, in the vote among local Taiwanese residents, integration into our home territory narrowly defeated independence. Taiwan is therefore officially no longer an overseas dependency, but part of our homeland, incorporated into the prefectural administrative system. \n\nSince the vote, Taiwanese independence supporters have shifted their efforts towards securing greater privileges for Taiwan in the parliament of [JAP.GetNameDef]."
 hok_jap_democratic.16.a:0 "Excellent."
 hok_jap_democratic.17.t:0 "Taiwan Chooses Independence"
 hok_jap_democratic.17.d:0 "Regrettably, in the vote among local Taiwanese residents, independence narrowly defeated integration into our home territory. As of midnight today, administration of Taiwan has been transferred to the 'Provisional Transitional Government of the Republic of Taiwan', led by local residents. \n\nAlthough their government will remain under our strong influence for some time, the Japanese flag at the Governor-General's office in Taipei has now been quietly lowered. The green flag of their independent government has been raised in its place."
 hok_jap_democratic.17.a:0 "They have our blessing."
 hok_jap_democratic.18.t:0 "[JAP.GetNameDef] Demands Northern Sakhalin"
 hok_jap_democratic.18.d:0 "Today, the ambassador of [JAP.GetNameDef] to [SOV.GetNameDef] visited the Kremlin in Moscow and delivered a diplomatic note formally requesting the transfer of northern Sakhalin. They warned that they would pursue 'firmer' diplomacy unless the territory was handed over immediately. How should we respond?"
 hok_jap_democratic.18.a:0 "Hand northern Sakhalin over to them."
 hok_jap_democratic.18.b:0 "Out of the question!"
 hok_jap_democratic.19.t:0 "The Soviets Cede Northern Sakhalin!"
 hok_jap_democratic.19.d:0 "Astonishingly, the foreign ministry of [SOV.GetNameDef] has informed us that it will cede northern Sakhalin to us in full. The ambassador of [SOV.GetNameDef] in Tokyo conveyed the view that peace between [SOV.GetNameDef] and [JAP.GetNameDef] must continue for the sake of stability in the Far East. \n\nNorthern Sakhalin, Sagaren, has at last returned to our embrace. The whole of Sakhalin is now entirely under our control."
 hok_jap_democratic.19.a:0 "They're... actually giving it to us?"
 hok_jap_democratic.20.t:0 "The Soviets Refuse to Cede Northern Sakhalin!"
 hok_jap_democratic.20.d:0 "As expected, the foreign ministry of [SOV.GetNameDef] has firmly rejected our demand for northern Sakhalin, calling it 'the utterly shameless greed of imperialists'. \n\n It appears that recovering northern Sakhalin will require 'somewhat more forceful' diplomacy..."
 hok_jap_democratic.20.a:0 "You know perfectly well what that means, don't you?"
 hok_jap_democratic.21.t:0 "Tomoyuki Yamashita Seeks to Change Sides"
 hok_jap_democratic.21.d:0 "Today, our Japanese National Liberation Committee captured General Tomoyuki Yamashita, one of the militarists' commanders, in battle. General Yamashita claims to admire democracy and says he had always intended to surrender to us voluntarily. Yet he is an opportunist who previously belonged to the Imperial Way Faction. Should we forgive him and accept him as one of our commanders?"
 hok_jap_democratic.21.a:0 "Prove your worth if you want to live!"
 hok_jap_democratic.22.t:0 "A Name for the New Republic"
 hok_jap_democratic.22.d:0 "The National Liberation Committee has decided to establish a new republican government in place of the old Japanese Empire. Some members have proposed a new national name that would make a clean break with the feudal past and express the new republic's values and ideals. \n\nThe first candidate is the 'Republic of Yamato', taking its name from Japan's first state and another name for Japan. \n\nThe second is the 'Republic of Daiwa', combining Daiwa, another name for Yamato, with a republican style modelled on fellow East Asian republics, the Republic of China and the Republic of Korea. \n\nThe final candidate is the 'United States of Fuso', named after the legendary Eastern island where a great tree stands at the place the sun rises. Fuso is also a poetic name for Japan. What shall we choose?"
 hok_jap_democratic.22.a:0 "Republic of Yamato"
 hok_jap_democratic.22.b:0 "Republic of Daiwa"
 hok_jap_democratic.22.c:0 "United States of Fuso"
 hok_jap_democratic.22.e:0 "...Let's just call it Japan."
 hok_jap_democratic.23.t:0 "[JAP.GetNameDef] Proposes Inviting [KOR.GetNameDef] to Our Faction"
 hok_jap_democratic.23.d:0 "[JAP.GetNameDef] has proposed inviting [KOR.GetNameDef] to our faction. [KOR.GetNameDef] has great geopolitical value as a bastion for our faction's advance into the Far East. How shall we respond?"
 hok_jap_democratic.23.a:0 "Why not?"
 hok_jap_democratic.23.b:0 "No."
 HOK_SEA_japan_1_civilian_government:0 "Put down the rebellion with the authority of the civilian government."

 # News events
 newsj.1.title:0 "Minshu Ikki: The Democratic Uprising"
 newsj.1.desc:0 "Astonishingly, civil war has broken out in the Japanese Empire, which has moved towards militarism since the early 1930s! The conflict pits the existing militarist government against the Japanese National Liberation Committee, which seeks to restore democracy. The two sides are already fighting across the Japanese islands. \n\nJapan's current government and military have announced a 'public security deployment' to suppress the rioters, but a substantial number of military officers appear to have joined the Japanese National Liberation Committee already. \n\nJapan's head of state, Emperor Hirohito, has made no statement and remains silent in the Imperial Palace. Japan has entered its first civil war in sixty years, since the Satsuma Rebellion of 1877."
 newsj.1.a:0 "Interesting."
 newsj.1.b:0 "For our children's freedom and future!"
 newsj.1.c:0 "The Japs are tearing themselves apart. We shall watch."
 newsj.1.d:0 "This may be an opportunity for us..."
 newsj.2.title:0 "Japan Proclaims a Republic!"
 newsj.2.desc:0 "Today, at the National Diet Building in Tokyo, the Japanese National Liberation Committee declared the end of the Japanese Civil War, announced the abolition of the monarchy and the establishment of a republic, and named the new state [JAP.GetNameDef]. \n\nTatsuji Fuse, elected as the new head of state of [JAP.GetNameDef], declared that restoring the country's freedom, democracy and stability was the overriding priority. \n\nDiplomats around the world are watching with bated breath to see how these political changes in Japan will affect Asia."
 newsj.2.a:0 "Interesting."
 newsj.2.b:0 "Long live [JAP.GetNameDef]! Long live President Tatsuji Fuse!"
 newsj.2.c:0 "Let us hope their new government will cooperate with us."
 newsj.2.d:0 "Our Republic of China is the true democratic republic!"
 newsj.3.title:0 "Showa Democracy"
 newsj.3.desc:0 "Today, the Japanese National Liberation Committee and Emperor Hirohito issued a joint statement announcing the end of the Japanese Civil War and a new democratic constitution. They pledged to establish a more effective constitutional monarchy, transferring a substantial share of the Emperor's powers to the civilian government, and to rename the Empire of Great Japan as the State of Japan. \n\nEmperor Hirohito, who had remained silent without leaving the Imperial Palace since the civil war began, made his first public appearance to console and encourage the citizens of Tokyo, left in ruins by the fighting. \n\nDiplomats around the world are watching with bated breath to see how these political changes in Japan will affect Asia."
 newsj.3.a:0 "Interesting."
 newsj.3.b:0 "Long live His Majesty the Emperor! Long live the democratic government!"
 newsj.3.c:0 "Let us hope their new government will cooperate with us."
 newsj.3.d:0 "Ha! A constitutional monarchy? We shall see."
 newsj.4.title:0 "[JAP.GetNameDef] Declares Itself Guardian of the Pacific"
 newsj.4.desc:0 "Today, [JAP.GetNameDef] issued an official statement declaring itself the 'Guardian of the Pacific' and announcing a 'firmer foreign policy' to spread freedom and democracy throughout the region. \n\n[JAP.GetNameDef] strongly condemned the colonial policies pursued by Western powers' administrations in the region as 'barbaric, anachronistic policies that only help communism spread'. It announced that [JAP.GetNameDef] and its people would lead the effort to create an Asia for Asians. \n\nThe Western colonial empires declined to comment on the declaration by [JAP.GetNameDef]."
 newsj.4.a:0 "How presumptuous."
 newsj.4.b:0 "[JAP.GetNameDef] alone can bring freedom to Asia!"

