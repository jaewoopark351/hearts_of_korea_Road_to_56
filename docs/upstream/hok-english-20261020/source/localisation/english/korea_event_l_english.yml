l_english:
 kor_events.0.t:0 "The State of the Republic of Korea"
 kor_events.0.d:0 "In 1906, after the Korean-Japanese-Russian War had left the entire peninsula in ruins, the Republic of Korea was born on the corpse of the old empire: the first democratic republic in Korean history, and in Asia. For the past thirty years, it has continued to develop.\n\nAs we walked a precarious tightrope between the great powers, modernisation and economic growth greatly improved our people's lives. When the Great War broke out in Europe, we remained neutral. While white men spilled one another's blood, we made money selling them supplies and sending them workers. Most of the unequal treaties were revised, and the first chaebol business conglomerates and an embryonic capitalist economy emerged. Economic growth, modernisation and democracy also nourished vigorous movements for civil rights, women's rights and the abolition of oppressive feudal customs.\n\nThe Great Depression changed everything. The Seoul Stock Exchange was forced to close early, countless companies and factories went bankrupt, and many citizens found themselves suddenly unemployed. All the republic's prosperity vanished like a mirage.\n\nAmid the mounting social turmoil, a non-violent civil disobedience movement erupted on 18 May 1931 in Daegu, a city known for its strong socialist sympathies as \"Joseon's Moscow\". The demonstrators demanded food, jobs, doctors and Syngman Rhee's resignation. Rhee's government sent tanks to crush these 200,000 \"reds\" demanding the president's departure, sparing neither men nor women, young nor old.\n\nAfter the bloody suppression of the Daegu Socialisation Movement, Lyuh Woon-hyung's Korean Social Democratic Party and Pak Hon-yong's Workers' Party of Joseon were blamed for organising the protests and forcibly dissolved. Democracy has withered and public life has grown increasingly repressive. Democrats have rallied under the Liberal–Independence Party Coalition to defend democracy, but containing extremist political forces now seems beyond them.\n\nMeanwhile, Japan has invaded Manchuria through its leased territory at Dalian and established a puppet state there. Invoking Hakko Ichiu, the ideal of bringing the world under one roof, and the Greater East Asia Co-Prosperity Sphere, it makes no secret of its desire to avenge the Korean-Japanese-Russian War and conquer us. Yet the League of Nations does nothing. The Europeans are preoccupied with their own problems, the Chinese are busy fighting one another, and the Americans continue their isolationist course. No one seems likely to help us.\n\nWill the Republic of Korea still be independent ten years from now?"
 KOR_events.0.a:0 "We shall defend it, whatever the cost."
 KOR_events.1.t:0 "Korea Offers Peace"
 KOR_events.1.d:0 "Apart from a few pockets of resistance, we have completely lost control of Manchuria. The Korean government has proposed a peaceful end to the present hostilities. Japan would formally abandon its invasion and cede Manchuria to Korea. How shall we respond?"
 KOR_events.1.a:0 "Sign the treaty."
 KOR_events.1.b:0 "The Imperial Army does not bow to its enemies!"
 KOR_events.101.t:0 "[From.GetNameDefCap] Rejects Peace"
 KOR_events.101.d:0 "Despite losing control of all Manchuria, [From.GetLeader] has rejected our peace proposal. It seems that only the complete conquest of the Japanese home islands can end this war."
 KOR_events.101.a:0 "Just as we hoped. We shall finish them off!"
 kor_events.2.t:0 "The Rise of the Daegu Commune"
 kor_events.2.d:0 "At midday today, trade unions, socialists and opponents of Rhee from across the country gathered in Daegu, where Rhee massacred 200,000 innocent civilians a few years ago. In a surprise assault, we overwhelmed the personnel of the North Gyeongsang provincial offices, Daegu City Hall, the provincial police headquarters and the 5th Military District headquarters, and seized the buildings. To thunderous applause from the assembled citizens, we announced the formation of a Provisional People's Committee and the founding of the Daegu Commune.\n\nRhee has denounced our actions as 'a Soviet-directed rebellion by reds intent on turning the Republic of Korea communist' and vowed to crush us with the army. The Worker-Peasant Red Guards are already fighting government troops and police across Gyeongsang. Most of our opponents, however, are surrendering without resistance and joining us, unwilling to turn their guns on people from their own hometowns.\n\nYet Rhee's forces continue to mass along Gyeongsang's borders. Civil war across our beloved homeland now seems inevitable..."
 kor_events.2.a:0 "Down with Syngman Rhee!"
 kor_events.3.t:0 "The Supreme Council's Coup"
 kor_events.3.d:0 "At dawn today, the forces of our Supreme Council for National Reconstruction moved out together, left their garrison areas and entered Seoul. We seized Gyeongbokgung Palace, the National Assembly, the Supreme Court, other major government offices and the broadcasting stations. Our surprise operation captured most senior officials and politicians, but Syngman Rhee caught wind of our movements and managed to escape the capital.\n\nRhee has branded our righteous action treason against democratic government and a coup. He has called on soldiers outside the Supreme Council, police officers and civilians to join the Free Korea Corps and fight us. Our forces now face the Free Korea Corps across Gyeonggi, with fighting already reported in some areas.\n\nCivil war across our beloved homeland now seems inevitable..."
 kor_events.3.a:0 "That rat!"
 kor_events.4.t:0 "The State of the Army"
 kor_events.4.d:0 "The Republic of Korea Army has defended our homeland since the republic was founded in 1906. It proudly traces its unbroken lineage to the Hanseong Republican Government's forces, which preserved our independence when the nation's very survival was threatened in the Korean-Japanese-Russian War.\n\nThe Battle of Seoul, Major Park Seung-hwan's final cavalry charge, the Righteous Army of the Thirteen Provinces, the delaying actions fought in Pyeongan by Generals Shin Dol-seok and Hong Beom-do, and Marshal Lee In-yeong's great pacification campaign in southern Korea remain glorious memories and part of the army's heritage.\n\nThe army's present condition is another matter. Having remained neutral during the Great War, the Republic of Korea learned none of the lessons of modern warfare. Thirty years of peace since the Korean-Japanese-Russian War have erased its practical combat experience. Discipline has deteriorated, and basic training is so inadequate that recruits never fire a single live round.\n\nTo make matters worse, spending cuts after the Great Depression forced many experienced soldiers and promising officers out of the service. Those who remain have suffered severe pay cuts, while army rations have deteriorated to meals of coarse barley and salted radish.\n\nUnder these conditions, our soldiers' morale and motivation flicker like candles in the wind. Some compare the army to Joseon's forces on the eve of the Imjin War. No one truly believes it can defend our country against invasion."
 kor_events.4.a:0 "Loyalty?"
 kor_events.5.t:0 "The State of the Navy"
 kor_events.5.d:0 "The Republic of Korea Navy has defended our territorial waters and maritime sovereignty since the republic's founding in 1906. Throughout the Korean-Japanese-Russian War, the struggle for command of the sea between the Russian and Japanese imperial navies had a profound effect on the fighting. Our country consequently spared no effort to build a modern, powerful navy.\n\nAfter the old empire's Yangmu and Gwangje were lost in that war, the navy spent more than a decade with little beyond wooden coastal defence craft. Economic growth in the 1920s allowed us to buy mothballed American Clemson-class destroyers cheaply from the scrapyard, laying the foundations of a modern fleet. Their designs formed the basis of our domestically built Donghae-class destroyers. We then enlarged the Donghae design and strengthened its armament and armour to build Isabu-class light cruisers and Eulji Mundeok-class heavy cruisers. In 1928, we also bought a Tiger-class battlecruiser scheduled for retirement in Britain and recommissioned it as Chungmugong Yi Sun-sin.\n\nEven so, our fleet is barely a handful of ships beside the mighty Imperial Japanese Navy. Sweeping cuts after the Great Depression have suspended Vision 1950, our ocean-going fleet programme, indefinitely. Sailors' pay has been slashed, and communism has spread through the ranks, much as it did in the Russian and German navies during the Great War.\n\nNaval military police routinely beat sailors like dogs to suppress their insubordination. From captains pocketing ships' victualling and fuel budgets to petty officers selling spare gun barrels to scrap merchants, the navy has fallen from the nation's pride into a disorganised rabble.\n\nCan our navy ever again honour the legacy of Admiral Yi Sun-sin?"
 kor_events.5.a:0 "Victory?"
 kor_events.6.t:0 "The State of the Air Force"
 kor_events.6.d:0 "The Republic of Korea Air Force began as the army's air arm in 1917. In 1925, it became the world's third independent air force. Its specialised role requires relatively few personnel, and its origins among temporarily mobilised civilian pilots rather than career servicemen have left it with comparatively relaxed discipline. It is also the only branch in which women can play as prominent a role as men. The air force has produced many national heroes: Colonel Ahn Chang-nam, who flew non-stop from Seoul to Honolulu, and Major Kwon Ki-ok, whose spectacular solo fighter display at the republic's twenty-fifth anniversary celebrations made her an idol to countless girls dreaming of becoming pilots. It was once the country's best-loved armed service.\n\nDisarmament after the Great Depression has left it greatly diminished. Plans to acquire new fighters were cancelled. Army generals in the Ministry of Defence dismiss it as poor value for money and call for its abolition. To make matters worse, it cannot even afford enough aviation fuel.\n\nOutraged, General Noh Baek-rin argued that air power would dominate the wars of the future and forcefully demanded greater investment from the government and the Ministry of Defence. His appeals merely earned him the hostility of the other services, and he was effectively dismissed by being forced into retirement.\n\nWith the silver wings beneath our taegeuk roundels rusting away, can our falcons still defend the homeland's skies?"
 kor_events.6.a:0 "Unity?"
 kor_events.7.t:0 "The Fate of HMS Tiger"
 kor_events.7.d:0 "Unused event"
 kor_events.7.a:0 "Begin fitting out at once!"
 kor_events.8.t:0 "Korea Requests a Guarantee of Independence"
 kor_events.8.d:0 "Korea's ambassador has approached us following the country's recent fascist revolution, asking us to guarantee its independence. Bearing a personal letter from President Lee Beom-seok, he says his homeland is in such a precarious position that Soviet forces could bring it down at any moment. He appeals for our support as a friendly, anti-communist country that shares our hatred of communism. How shall we respond?"
 kor_events.8.a:0 "Guarantee their independence."
 kor_events.8.b:0 "Their independence is no concern of ours."
 kor_events.9.t:0 "[From.GetNameDefCap] Guarantees Our Independence!"
 kor_events.9.d:0 "[From.GetNameDefCap] has approved our request for a security treaty and offered praise and respect for our resolute stand against the evil of Judeo-Bolshevism. [From.GetNameDefCap] now guarantees our independence, whatever the reason, and the treaty takes effect immediately."
 kor_events.9.a:0 "Excellent."
 kor_events.10.t:0 "[From.GetNameDefCap] Refuses to Guarantee Our Independence!"
 kor_events.10.d:0 "[From.GetNameDefCap] has rejected our request for a security treaty, adding the taunt that international affairs are cruel to weak countries. Whatever the reason, it seems we must now defend our homeland alone."
 kor_events.10.a:0 "Regrettable. We shall see what becomes of them."
 kor_events.11.t:0 "[From.GetNameDefCap] Demands Siberia"
 kor_events.11.d:0 "[From.GetNameDefCap] describes itself as Asia's foremost communist state and wishes to share our 'burden'. [From.GetNameDefCap] invokes our eternal alliance in proposing to take over the administration and development of all Eastern Siberia on our behalf. How shall we respond?"
 kor_events.11.a:0 "Accept their demands."
 kor_events.11.b:0 "Ignore their demands."
 kor_events.12.t:0 "[From.GetNameDefCap] Accepts Our Demands!"
 kor_events.12.d:0 "[From.GetNameDefCap] has thanked us for our efforts as a fellow communist state and agreed to our request. Effective immediately, the administration of all Eastern Siberia has formally passed from Moscow to Seoul."
 kor_events.12.a:0 "Excellent."
 kor_events.13.t:0 "[From.GetNameDefCap] Demands Manchuria"
 kor_events.13.d:0 "Having recently proclaimed the Second Republic of Korea, Korea has sent us an ultimatum demanding all of Manchuria. It claims the region as ancestral territory once ruled by Goguryeo and Balhae, and cites the many Koreans already living there as further justification. It also warns of direct military action if we refuse to cede Manchuria. How shall we respond?"
 kor_events.13.a:0 "Accept their demands."
 kor_events.13.b:0 "They need to learn their place."
 kor_events.14.t:0 "Manchuria Is Ours!"
 kor_events.14.d:0 "[From.GetNameDefCap] has surprisingly bowed to our threats and agreed to cede Manchuria. Its precise reasons are unclear, but its leaders probably judged a dispute with us a waste of time given their wider strategy. Whatever the reason, Manchuria has now formally been ceded to our Republic of Korea."
 kor_events.14.a:0 "Excellent."
 kor_events.15.t:0 "[From.GetNameDefCap] Refuses to Cede Manchuria"
 kor_events.15.d:0 "[From.GetNameDefCap] has, as expected, rejected our demand for Manchuria, dismissing it as an absurd pretext and sending a diplomatic insult telling us to know our place. War is now our only means of taking Manchuria."
 kor_events.15.a:0 "You know what that means, don't you?"
 kor_events.16.t:0 "Japan's Ultimatum"
 kor_events.16.d:0 "On 24 June 1939, Japan's Foreign Ministry delivered a formal ultimatum demanding that the Republic of Korea become a Japanese protectorate. It added that, unless we accept within twenty-four hours, we will bear full responsibility for everything that follows. Reports already indicate that large Japanese and Manchukuo forces are massing along the Korean–Manchurian border. An invasion appears imminent. How shall we respond?"
 kor_events.16.a:0 "Order all forces to DEFCON 1, COCKED PISTOL. Declare nationwide wartime mobilisation and martial law!"
 kor_events.17.t:0 "Korea Wishes to Buy Our Weapons"
 kor_events.17.d:0 "Korea, currently rearming and expanding its forces, has asked to buy weapons from us to address its military's shortages. It needs small arms, artillery and support equipment. We could simply sell it obsolete equipment some thirty years old that we hold in reserve, so this would place little burden on us. How shall we respond?"
 kor_events.17.a:0 "There is no reason to refuse."
 kor_events.17.b:0 "Refuse."
 kor_events.18.t:0 "Mass Chinese Demonstration"
 kor_events.18.d:0 "This morning, an estimated 700,000 people joined a mass demonstration in Buyeo, the former capital of Manchukuo once known as Xinjing.\n\nThe demonstrators were mostly Chinese. Marching along Changchun Avenue, they shouted for Manchurian independence and waved the Republic of China's Blue Sky, White Sun and Red Earth flag. They demanded that Korea withdraw from all Manchuria and return it to the Republic of China.\n\nMounted officers of the Buyeo regional police and the army's 186th Civil Affairs Military Police Brigade were dispatched to suppress the demonstration. We have arrested all the demonstrators and their families. What shall we do with them?"
 kor_events.18.a:0 "Deport the lot of them to where their kind belongs."
 kor_events.19.t:0 "Move the Capital to Gungnae?"
 kor_events.19.d:0 "With seven army engineer brigades and most of our construction companies mobilised, the new city of Gungnae is already nearing completion. The cabinet has proposed formally moving our capital there.\n\nThe move would bring many advantages, but also serious drawbacks: a cold climate and too little space to accommodate the government complex and all the principal ministries. What shall we do?"
 kor_events.19.a:0 "Gungnae cannot accommodate a national administration."
 kor_events.19.b:0 "Move the capital. The plains of Manchuria await us!"
 kor_events.20.t:0 "A Warning from the Japanese Ambassador"
 kor_events.20.d:0 "Remarks made by Japan's ambassador to Korea, Kenzo Nakagawa, at today's New Year reception in the Foreign Ministry have caused an uproar.\n\nHe denounced the Republic of Korea's military expansion, and indeed its very existence, as a grave threat to the Japanese Empire's security and the ideals of Greater East Asian Co-Prosperity. He threatened that the incomparably loyal and valiant Imperial Army would soon turn this place into a sea of fire.\n\nThough he had been drinking, such blunt language from a diplomat is a breach of diplomatic propriety and an insult to our homeland. Nakagawa was declared persona non grata and expelled to Japan today. Without offering any apology, the Japanese Empire has merely repeated that a replacement ambassador will be sent later, while reducing its embassy staff in Korea."
 kor_events.20.a:0 "What outrageous nonsense."
 kor_events.21.t:0 "A Strange German Pretending to Be Korean"
 kor_events.21.d:0 "Early this morning, a sentry serving with our martial law forces in Seoul arrested a man who had broken curfew and tried to enter martial law headquarters without permission. He was wearing sunglasses and a traditional Korean overcoat.\n\nUnder questioning, the man proved to be German, although he could understand Korean and speak it haltingly. He claims that he recently fled his homeland because of the 'machinations of despicable Judeo-Bolsheviks', and demands a meeting with His Excellency Lee Beom-seok. What shall we do with him?"
 kor_events.21.a:0 "Take him to the nearest psychiatric hospital."
 kor_events.21.b:0 "Welcome to the Land of the Morning Calm, Mr Kim Tler...!"
 kor_events.22.t:0 "Korea Demands Mongolia's Submission"
 kor_events.22.d:0 "This morning, the Korean ambassador demanded that we become a Korean protectorate. He argued that a weak country such as ours could scarcely defend its independence and should accept Korean \"protection\". He even threatened military action if we refused. How shall we respond?"
 kor_events.22.a:0 "Accept their demands."
 kor_events.22.b:0 "Reject their demands."
 kor_events.23.t:0 "Mongolia Submits"
 kor_events.23.d:0 "As expected, Mongolia has accepted our demands. It is now our protectorate."
 kor_events.23.a:0 "Excellent."
 kor_events.24.t:0 "Mongolia Rejects Our Demands"
 kor_events.24.d:0 "Surprisingly, Mongolia has dismissed our demands as absurd, declaring that if we want its territory, we must take it by force."
 kor_events.24.a:0 "You know what that means, don't you?"
 kor_events.25.t:0 "Korea Demands a Lease of Shandong"
 kor_events.25.d:0 "Today, the Republic of Korea's Foreign Ministry demanded that we grant Korea a ninety-nine-year lease over the entire Shandong Peninsula. Claiming that Shandong was once ruled by its ancient kingdom of Baekje, it threatened that we would bear responsibility for whatever happens if we refuse. How shall we respond?"
 kor_events.25.a:0 "Accept their demands."
 kor_events.25.b:0 "Reject their demands."
 kor_events.26.t:0 "China Accepts Our Demands"
 kor_events.26.d:0 "Today, the Republic of China's Foreign Ministry telegraphed its acceptance of our demand for Shandong. Korea has formally received a ninety-nine-year lease over the peninsula, and its administration has been transferred to us."
 kor_events.26.a:0 "Excellent."
 kor_events.27.t:0 "China Rejects Our Demands"
 kor_events.27.d:0 "Today, the Republic of China's Foreign Ministry dismissed our demands as absurd and made clear that it would not cede a single inch of territory. War now appears our only means of taking Shandong, and ultimately the whole Chinese mainland."
 kor_events.27.a:0 "You know what that means, don't you?"
 kor_events.28.t:0 "Korea Demands Primorye"
 kor_events.28.d:0 "Having recently taken Manchuria, the Republic of Korea has formally demanded that we cede Primorye. It argues that many Koreans already live there and that, since the region is the ancestral homeland of the Manchus, 'equal members' of its state, our possession of it violates national self-determination. It even says it is prepared to go to war if we refuse. How shall we respond?"
 kor_events.28.a:0 "Accept their demands."
 kor_events.28.b:0 "Reject their demands."
 kor_events.29.t:0 "[From.GetNameDefCap] Accepts Our Demands"
 kor_events.29.d:0 "[From.GetNameDefCap] has agreed, apparently recognising that a dispute with us would be pointless. [From.GetNameDefCap] further declared that peace and friendship with the Republic of Korea should continue for the benefit of both countries."
 kor_events.29.a:0 "Excellent."
 kor_events.30.t:0 "[From.GetNameDefCap] Rejects Our Demands"
 kor_events.30.d:0 "[From.GetNameDefCap] has dismissed our demands as absurd. [From.GetNameDefCap] will not surrender a single inch of territory, it declares. War now appears our only means of taking Primorye."
 kor_events.30.a:0 "You know what that means, don't you?"
 kor_events.31.t:0 "Korea Demands Tibet's Submission"
 kor_events.31.d:0 "This morning, the Korean ambassador demanded that we become a Korean protectorate. He argued that a weak country such as ours could scarcely defend its independence and should accept protection. He even threatened military action if we refused. How shall we respond?"
 kor_events.31.a:0 "Accept their demands."
 kor_events.31.b:0 "Reject their demands."
 kor_events.32.t:0 "Tibet Submits"
 kor_events.32.d:0 "As expected, Tibet has accepted our demands. It is now our protectorate."
 kor_events.32.a:0 "Excellent."
 kor_events.33.t:0 "Tibet Rejects Our Demands"
 kor_events.33.d:0 "Surprisingly, Tibet has dismissed our demands as absurd, declaring that if we want its territory, we must take it by force."
 kor_events.33.a:0 "You know what that means, don't you?"
 kor_events.34.t:0 "Korea Proposes an Organisation of Free Nations"
 kor_events.34.d:0 "At midday today, Korea's ambassador in Washington, DC, Chang Myon, delivered a personal letter from the Korean president to our president. It proposes expanding the existing Korean–American Mutual Defence Treaty into a new military alliance for the peace and security of the free world, formally allying the Republic of Korea with the United States. This would anger the Japanese Empire, but the Korean peninsula offers a valuable strategic foothold for our involvement in Asia. What shall we do?"
 kor_events.34.a:0 "An excellent idea."
 kor_events.34.b:0 "Under the Monroe Doctrine, we do not interfere in the Old World."
 kor_events.35.t:0 "America Accepts Our Proposal"
 kor_events.35.d:0 "US Secretary of State Cordell Hull has praised our proposal as highly beneficial to both countries, saying that a military alliance between us would form a new axis for the defence of freedom and democracy throughout the world. He says presidential approval has already been secured, and that the treaty can be ratified as soon as Congress gives its formal assent."
 kor_events.35.a:0 "The best possible outcome."
 kor_events.36.t:0 "America Rejects Our Proposal"
 kor_events.36.d:0 "The United States has rejected our proposal for a new military alliance, firmly reiterating that the Monroe Doctrine precludes interference in the Old World. It seems we must defend our homeland alone."
 kor_events.36.a:0 "Regrettable."
 kor_events.37.t:0 "Korea Demands Mengkukuo's Submission"
 kor_events.37.d:0 "This morning, a Korean diplomat demanded that we become a Korean protectorate. He argued that a weak country such as ours could scarcely defend its independence and should accept protection. He even threatened military action if we refused. How shall we respond?"
 kor_events.37.a:0 "Accept their demands."
 kor_events.37.b:0 "Reject their demands."
 kor_events.38.t:0 "Mengkukuo Submits"
 kor_events.38.d:0 "As expected, Mengkukuo has accepted our demands. It is now formally our protectorate."
 kor_events.38.a:0 "Excellent."
 kor_events.39.t:0 "Mengkukuo Rejects Our Demands"
 kor_events.39.d:0 "Surprisingly, Mengkukuo has dismissed our demands as absurd, declaring that if we want its territory, we must take it by force."
 kor_events.39.a:0 "You know what that means, don't you?"
 kor_events.40.t:0 "Support Korea's Communist Revolution?"
 kor_events.40.d:0 "A communist revolution has recently broken out in Daegu, Korea. Reportedly the largest communist uprising in the country to date, it is holding its own against government forces and has a chance of victory, according to the NKVD's Korean branch.\n\nBy helping the revolution, we could gain a friend in Asia. Shall we support it?"
 kor_events.40.a:0 "Send them support."
 kor_events.40.b:0 "Ignore them."
 kor_events.41.t:0 "The Soviet Union Supports Our Revolution!"
 kor_events.41.d:0 "Thankfully, the Soviet Union has saluted our courage in fighting bourgeois dictatorship and sent us a large shipment of much-needed military supplies through Busan. The weapons have already been unloaded at the port and await distribution to the Worker-Peasant Red Guards fighting at the front."
 kor_events.41.a:0 "Thank you, comrades. Thank you."
 kor_events.42.t:0 "The Imperial Family Appreciation Society"
 kor_events.42.d:0 "More than twenty years have passed since Emperor Gwangmu, this land's rightful sovereign, died in Germany following the Korean-Japanese-Russian War and the Eulsa Coup. After the hateful republicans drove him to die in a distant foreign land, the monarchist cause was buried, and no one would take our claims seriously. Yet the Imperial Family Appreciation Society, led by Gye Yeon-su, head of the Dangun-worshipping Taebaek Faith, refuses to surrender. It devotes itself to restoring this country's rightful emperor. Firm in the belief that our efforts will one day bear fruit, we remain loyal to His Imperial Highness Crown Prince Yi Un in Jeonju."
 kor_events.42.a:0 "May Heaven protect the Emperor!"
 kor_events.43.t:0 "Where Shall the Coronation Be Held?"
 kor_events.43.d:0 "Everything is ready for the restoration of our rightful emperor, but fierce disagreement has left the venue for his coronation undecided.\n\nGye Yeon-su, leader of the Taebaek Faith and chairman of the Imperial Family Appreciation Society, wants a Taebaek ceremony at Gyeongbokgung, once Joseon's principal royal palace and more recently the former republic's presidential offices. Crown Prince Yi Un himself, however, is a baptised Catholic. He wishes for a Western-style coronation according to Catholic rites at Myeongdong Cathedral, presided over by Archbishop Adrien-Joseph Larribeau. What shall we do?"
 kor_events.43.a:0 "Gye Yeon-su is truly blessed. Do as he says."
 kor_events.43.b:0 "I am a Catholic! My coronation will be held at Myeongdong Cathedral."
 kor_events.45.t:0 "Korea Proposes a Mutual Defence Treaty"
 kor_events.45.d:0 "This morning, Korea's ambassador to the United States, Chang Myon, visited the White House with a personal letter from the Korean president proposing a Korean–American Mutual Defence Treaty. A weak country in the Far East, Korea shares our concern about Japanese expansionism. A mutual defence treaty, however, would antagonise both the Japanese military and isolationists at home. What shall we do?"
 kor_events.45.a:0 "A good idea. Korea offers a strategic position from which to contain Japan and the Soviet Union."
 kor_events.45.b:0 "Under the Monroe Doctrine, we do not interfere in the Old World."
 kor_events.46.t:0 "America Agrees to a Mutual Defence Treaty"
 kor_events.46.d:0 "At midday today, our ambassador to the United States, Chang Myon, received confirmation from the US State Department that America had agreed to the Korean–American Mutual Defence Treaty. The treaty between our countries has now been concluded and is already in effect."
 kor_events.46.a:0 "Our descendants will benefit from this treaty for generations."
 kor_events.47.t:0 "America Rejects a Mutual Defence Treaty"
 kor_events.47.d:0 "According to a telegram received from our embassy in Washington this evening, the United States showed little interest in our proposed Korean–American Mutual Defence Treaty and politely declined. It seems we must defend our homeland alone..."
 kor_events.47.a:0 "No..."
 kor_events.48.t:0 "Korea Wishes to Buy Our Destroyers"
 kor_events.48.d:0 "This morning, Korea's ambassador to Britain, Ahn Jae-hong, delivered a personal letter from the Korean president to 10 Downing Street. It asks us to sell destroyers for an escort fleet to accompany Korean troops being sent to Europe. Shall we sell them the ships?"
 kor_events.48.a:0 "There is no reason to refuse."
 kor_events.48.b:0 "Absolutely not!"
 kor_events.49.t:0 "Britain Agrees to Sell Destroyers"
 kor_events.49.d:0 "Thankfully, Britain has accepted our proposal to buy destroyers. Taking our circumstances into account, it has also offered to let us pay in small, interest-free instalments over thirty years. We have bought five British destroyers in all, which should arrive at Incheon in around thirty days."
 kor_events.49.a:0 "Excellent news."
 kor_events.50.t:0 "Britain Refuses to Sell Destroyers"
 kor_events.50.d:0 "Unfortunately, Britain has rejected our proposal to buy destroyers. To escort our troops to the European front, we must now build additional escort vessels ourselves."
 kor_events.50.a:0 "Are they really our allies?"
 kor_events.51.t:0 "The British Destroyers Arrive"
 kor_events.51.d:0 "This morning, an unusually large crowd gathered at Busan's dry dock, where five unfamiliar destroyers lay moored. These are the British ships we bought a month ago, now ready to be recommissioned into the Republic of Korea Navy.\n\nAt the commissioning ceremony, their class was named the Hangang class. The ships themselves were named ROKS Hangang, ROKS Amnok, ROKS Duman, ROKS Yeongsan and ROKS Soyang."
 kor_events.51.a:0 "A substantial boost to our navy's strength!"
 kor_events.52.t:0 "Korea Requests MacArthur"
 kor_events.52.d:0 "This afternoon, the Korean embassy asked our State Department to send a particular officer to Korea. General MacArthur was, until recently, Chief of Staff of the United States Army, but a falling-out with President Roosevelt saw him dismissed and relegated to field marshal of the Philippine Commonwealth Army. The Koreans appear to want him to command their forces.\n\nMacArthur himself has said that, if ordered by the government, he will readily board a flight from Manila to Korea and carry out his assignment. What shall we do?"
 kor_events.52.a:0 "Send that has-been to Korea."
 kor_events.52.b:0 "We shall have important work for MacArthur later. Refuse."
 kor_events.53.t:0 "America Agrees to Send MacArthur"
 kor_events.53.d:0 "This morning, America agreed to send MacArthur to Korea, recalling him from the reserves to active service and nominally appointing him commander of US forces in the Far East and in Korea. On receiving his orders, he immediately boarded a passenger aircraft and arrived at Yeouido Airfield. Speaking to reporters there, he pledged in the name of his father, Medal of Honor recipient Arthur MacArthur, to do everything in his power to turn our armed forces into an elite fighting force."
 kor_events.53.a:0 "Welcome him."
 kor_events.54.t:0 "America Refuses to Send MacArthur"
 kor_events.54.d:0 "At midday today, the US State Department and the United States Army refused to send retired General MacArthur to Korea. MacArthur himself has telegraphed His Excellency the President, expressing regret that he cannot join Korea now but declaring his firm belief that we will fight together one day."
 kor_events.54.a:0 "A pity."
 kor_events.55.t:0 "Korea Proposes the ABCDFK Encirclement"
 kor_events.55.d:0 "Korea has proposed a comprehensive embargo on Japan by its neighbours, intended to obstruct Japan's wars of aggression and its production of war materiel. Other countries near Japan appear to have received the same proposal. What shall we do?"
 kor_events.55.a:0 "Of course we shall join."
 kor_events.55.b:0 "We must not provoke Japan!"
 kor_events.56.t:0 "The Organisation of Free Nations Proposes a Merger"
 kor_events.56.d:0 "This morning, the Organisation of Free Nations, founded around the United States and Korea, invited all the Allies to join it. Membership offers an excellent opportunity to secure American support, but could also surrender leadership of the Allies to the United States. What shall we do?"
 kor_events.56.a:0 "An excellent idea!"
 kor_events.56.b:0 "We have no intention of getting involved in the Pacific as well."
 kor_events.57.t:0 "Britain Agrees to Join the Organisation of Free Nations"
 kor_events.57.d:0 "Fortunately, Britain has agreed to join the Organisation of Free Nations. The other Allies have yet to decide, but most seem likely to follow Britain's lead."
 kor_events.57.a:0 "Now ask the other Allies what they think."
 kor_events.58.t:0 "[From.GetNameDefCap] Refuses to Join the Organisation of Free Nations"
 kor_events.58.d:0 "[From.GetNameDefCap] has dismissed the proposed expansion of the Organisation of Free Nations as absurd and refused to take part. It seems we shall not be joining forces."
 kor_events.58.a:0 "Regrettable."
 kor_events.59.t:0 "The Organisation of Free Nations Proposes a Merger"
 kor_events.59.d:0 "This morning, the Organisation of Free Nations, founded around the United States and Korea, invited all the Allies to join it. Membership offers an excellent opportunity to secure American support, but could also surrender leadership of the Allies to the United States. Britain has already decided to join. What shall we do?"
 kor_events.59.a:0 "If Britain is joining them, so should we."
 kor_events.59.b:0 "Refuse."
 kor_events.60.t:0 "[From.GetNameDefCap] Agrees to Join the Organisation of Free Nations"
 kor_events.60.d:0 "[From.GetNameDefCap] has decided to join the Organisation of Free Nations. From now on, we shall share the same fate."
 kor_events.60.a:0 "Together we shall defend freedom and democracy!"
 kor_events.61.t:0 "The Organisation of Free Nations Offers Protection!"
 kor_events.61.d:0 "This morning, the Organisation of Free Nations offered our country its protection. In return, it asks that we become a member. What shall we do?"
 kor_events.61.a:0 "An excellent idea. We shall join."
 kor_events.61.b:0 "Refuse."
 kor_events.62.t:0 "Korea Demands Independence for an Indochinese Federation"
 kor_events.62.d:0 "This afternoon, Korea demanded immediate independence for our Indochinese colonies and the establishment of a transitional government chosen through free elections by their inhabitants. Pointing to our weakening hold on the colonies, it is pressing us to agree and arguing that local support could help us expand our armed forces. What shall we do?"
 kor_events.62.a:0 "Accept their demands."
 kor_events.62.b:0 "The colonies are our lifeline! Refuse!"
 kor_events.63.t:0 "Korea Demands Independence for the Straits Settlements"
 kor_events.63.d:0 "This afternoon, Korea demanded immediate independence for the Straits Settlements and the establishment of a transitional government chosen through free elections by their inhabitants. Pointing to our weakening hold on the colonies, it is pressing us to agree and arguing that local support could help us expand our armed forces. What shall we do?"
 kor_events.63.a:0 "Accept their demands."
 kor_events.63.b:0 "The colonies are our lifeline! Refuse!"
 kor_events.64.t:0 "Korea Demands Full Philippine Independence"
 kor_events.64.d:0 "This afternoon, Korea demanded immediate independence for the Philippines and the establishment of a transitional government chosen through free elections by its inhabitants. Pointing to our weakening hold on the colonies, it is pressing us to agree and arguing that local support could help us expand our armed forces. What shall we do?"
 kor_events.64.a:0 "Accept their demands."
 kor_events.64.b:0 "The colonies are our lifeline! Refuse!"
 kor_events.65.t:0 "Korea Demands Independence for the Dutch East Indies"
 kor_events.65.d:0 "This afternoon, Korea demanded immediate independence for the East Indies and the establishment of a transitional government chosen through free elections by their inhabitants. Pointing to our weakening hold on the colonies, it is pressing us to agree and arguing that local support could help us expand our armed forces. What shall we do?"
 kor_events.65.a:0 "Accept their demands."
 kor_events.65.b:0 "The colonies are our lifeline! Refuse!"
 kor_events.66.t:0 "[From.GetNameDefCap] Approves Immediate Colonial Independence!"
 kor_events.66.d:0 "[From.GetNameDefCap] has accepted our demand to liberate its colonies and establish provisional transitional governments chosen through free elections by the indigenous inhabitants. It has also agreed to Korean oversight of those new governments. Under our protection, they will now attain true freedom and democracy."
 kor_events.66.a:0 "A wise decision."
 kor_events.67.t:0 "[From.GetNameDefCap] Rejects Colonial Independence"
 kor_events.67.d:0 "[From.GetNameDefCap] has dismissed our demand for colonial liberation as absurd and declared that it will never relinquish its colonies. What the future holds for it and its colonies is now anyone's guess..."
 kor_events.67.a:0 "Regrettable."
 kor_events.68.t:0 "Expanding the Organisation of Free Nations"
 kor_events.68.d:0 "Since we founded the Organisation of Free Nations with the Republic of Korea, many potential members have approached us about joining. This seems a good opportunity to ask our smaller democratic friends whether they would like to become members."
 kor_events.68.a:0 "Yes. Contact every potential member likely to join us."
 kor_events.68.b:0 "No. Korea and ourselves are enough."
 kor_events.69.t:0 "The Eighth Presidential Election, 1941"
 kor_events.69.d:0 "The day has finally come for the presidential election held every five years since Philip Jaisohn founded the Republic of Korea in 1906. Wartime conditions following the outbreak of the Second Korean-Japanese War could have justified cancelling this election. President Kim Gu, however, has announced that it will proceed as normal and that he will seek re-election. He intends both to demonstrate the superiority of democratic republican government to the enemy and to seek a renewed mandate from the people to sustain his administration. His challenger, Ahn Chang-ho of the Liberal Party, has condemned Kim's independent, hard-line foreign policy as 'the worst diplomatic disaster in the republic's history, an imitation of Heungseon Daewongun's old Joseon isolationism'. He calls for closer cooperation with friendly democracies to secure victory in the war.\n\nSoldiers at the front have already cast their early absentee ballots at makeshift polling stations. As civilians behind the lines leave the polling booths one by one, we can choose whether the Independence Party wins or the Liberals stage an upset."
 kor_events.69.a:0 "Unity matters now more than ever. Five more years for Baekbeom Kim Gu's Independence Party!"
 kor_events.69.b:0 "Dosan Ahn Chang-ho of the Liberal Party is the president we need."
 kor_events.70.t:0 "The Eighth Presidential Election, 1941"
 kor_events.70.d:0 "The day has finally come for the presidential election held every five years since Philip Jaisohn founded the Republic of Korea in 1906. No president has yet served four consecutive terms. Citing the unstable world situation and recent events, President Syngman Rhee has nevertheless broken with tradition once again and insisted on running for a fourth term. His challenger is Ahn Chang-ho of the Independence Party. Formerly a Liberal, Ahn publicly denounced the incumbent as 'a damned dictator blinded by power' over his fourth-term bid, the bloody suppression of the Daegu Socialisation Movement in 1931 and his pro-chaebol policies. He then left the Liberals, joined the Independence Party and became its presidential candidate.\n\nWe can choose whether the Liberal Party wins or the Independence Party brings a change of government."
 kor_events.70.a:0 "His Excellency Unam Syngman Rhee is our president for ever!"
 kor_events.70.b:0 "Dosan Ahn Chang-ho of the Independence Party is the president we need."
 kor_events.71.t:0 "The Ninth Presidential Election, 1946"
 kor_events.71.d:0 "Once again, the day has come for the presidential election held every five years since Philip Jaisohn founded the Republic of Korea in 1906. The incumbent, [Root.GetLeader], has announced retirement from politics and will not seek re-election, citing advancing age and the need to uphold democratic republican traditions. This promises to be the most fiercely contested election in our nation's history.\n\nThere are three principal candidates. The Liberal Party's Yun Po-sun, the serving mayor of Seoul, is known for his blameless private life and enjoys strong middle-class support. Independence Party executive Yi Kang is the second son of the deposed monarch Yi Myeong-bok and a republican of imperial birth who worked with Philip Jaisohn even before the Musul People's Revolt; he has strong support among women and conservatives. Finally, the prominent social democrat Lyuh Woon-hyung served as vice president under President Kim Kyu-sik in the early 1920s. Placed under house arrest after the Daegu Socialisation Movement, he was recently released and became the founder and leader of the New Korean Social Democratic Party, taking politics by storm.\n\nMany people are still weighing their choice in an election that will decide the future of Korean democracy..."
 kor_events.71.a:0 "Korea wants its moral tutor, Yun Po-sun!"
 kor_events.71.b:0 "Citizen Yi Kang is the loyal servant the Korean people need!"
 kor_events.71.c:0 "Mongyang, the workers' and peasants' friend, shall be Korea's president!"
 kor_events.72.t:0 "The Eighth Presidential Election, 1941"
 kor_events.72.d:0 "The day has finally come for the presidential election held every five years since Philip Jaisohn founded the Republic of Korea in 1906. President Kim Gu recently announced in a press interview that he would seek another term. His challenger is Ahn Chang-ho of the Liberal Party, who condemns Kim's independent, hard-line foreign policy as a dangerous course that will soon drag the nation's sons onto battlefields to die. To preserve peace and independence, Ahn calls for closer cooperation with friendly democracies.\n\nAs citizens leave the polling booths one by one, we can choose whether the Independence Party wins or the Liberals stage an upset."
 kor_events.72.a:0 "Five more years for Baekbeom Kim Gu's Independence Party!"
 kor_events.72.b:0 "Dosan Ahn Chang-ho of the Liberal Party is the president we need."
 newsk.1.title:0 "Humiliation in Manchuria"
 newsk.1.desc:0 "A peace treaty signed today between [KOR.GetLeader] and [JAP.GetLeader] has brought hostilities between the two countries to an end. Japan has agreed to dissolve Manchukuo and formally cede Manchuria to Korea.\n\nAisin-Gioro Puyi, the former Emperor of Manchukuo, declared the state's dissolution at an airfield in Manchuria and attempted to flee into exile in Japan, but was captured by Korean troops.\n\nKorea has proclaimed the rebirth of Goguryeo and formally incorporated Manchuria into its administrative territory. The Republic of China protested fiercely and brought the matter before the League of Nations, but the League has remained silent."
 newsk.1.a:0 "Will this mean peace in the Far East?"
 newsk.1.b:0 "Just you wait, Korean scum!"
 newsk.1.c:0 "Long live [KOR.GetNameDef]!"
 newsk.1.d:0 "We must drive those Korean bastards out of our land in Manchuria!"
 newsk.2.title:0 "Korean Civil War"
 newsk.2.desc:0 "News arrived today that civil war has broken out in Korea, which has yet to emerge from the turmoil following the Great Depression. Syngman Rhee's government forces are fighting the Daegu Commune, which has risen to avenge the Daegu Socialisation Movement under the twin causes of communism and opposition to Rhee. Each side has begun a struggle to build its own vision of the country's future.\n\nWhatever the reasons, the Republic of Korea is now in a state of civil war, and it seems certain that the peninsula will see immense bloodshed."
 newsk.2.a:0 "A socialist revolution in the Far East? That is something new."
 newsk.2.b:0 "Drive Syngman Rhee out!"
 newsk.3.title:0 "Korean Civil War"
 newsk.3.desc:0 "The outbreak of civil war in Korea, a country in decline since the Great Depression, is hardly surprising. Before dawn today, the Supreme Council for National Reconstruction, a clandestine organisation within the army led by the German-educated officer Lee Beom-seok, attempted a coup, seized the capital and formed a Military Revolutionary Committee. President Syngman Rhee barely escaped from Seoul and has formed the Free Korea Corps in an attempt to suppress Lee's rebellion.\n\nThe Republic of Korea is now in a state of civil war, and it seems certain that the peninsula will see immense bloodshed."
 newsk.3.a:0 "Interesting."
 newsk.3.b:0 "Long live the Republic of Korea! Long live the rebel army!"
 newsk.4.title:0 "The Birth of the Federation of Balhae"
 newsk.4.desc:0 "Since conquering Manchuria, the Republic of Korea has refused to relinquish its suzerainty over the region, citing its ties to the historical Korean state of Balhae. At the same time, it has pursued a vigorous policy of conciliation towards local residents. An inclusive and open immigration policy has encouraged the persecuted from around the world to settle in Manchuria in pursuit of the 'Korean Dream'.\n\nThe Republic of Korea has now announced that it will adopt a new name capable of representing all six ethnic groups of the Korean Peninsula and Manchuria: the Federation of Balhae.\n\nThe federation's next steps remain uncertain, but the world is watching with bated breath as a new great power emerges in the Far East."
 newsk.4.a:0 "A new great power in the Far East?"
 newsk.4.b:0 "Their arrogance knows no bounds."
 newsk.4.c:0 "Long live the Republic of Korea! Long live the Federation of Balhae!"
 newsk.4.d:0 "Manchuria belongs to China..."
 newsk.5.title:0 "The Fall of Tokyo"
 newsk.5.desc:0 "Tokyo, the capital of the Japanese Empire, fell to Korean forces today. The city, which had never before been occupied by a foreign power, is now under foreign occupation for the first time. Despite fierce resistance from a garrison centred on the Imperial Guard Division, Korean troops swept the defenders aside with artillery fire and entered the city.\n\nSporadic gunfire can still be heard, and fires have broken out repeatedly across the city, but most surviving Japanese troops have either withdrawn or been taken prisoner by the Koreans.\n\nThe imperial family left before the city was occupied. At the Imperial Palace, where the Emperor resided, a portrait of [KOR.GetLeader] now hangs in place of the Emperor's, and the Korean flag flies in place of the Japanese flag."
 newsk.5.a:0 "[KOR.GetNameDefCap]'s forces seem unstoppable!"
 newsk.5.b:0 "The Japanese invasions of Korea and the Korean-Japanese-Russian War have been avenged."
 newsk.6.title:0 "President Kim Gu"
 newsk.6.desc:0 "Kim Gu, the official presidential candidate of the Liberal-Independence coalition and leader of its Independence Party faction, was elected the Republic of Korea's new president today in the country's seventh presidential election.\n\nIn a radio address following his victory, the new occupant of Gyeongbokgung Palace pledged to build a sovereign and independent country founded on the interests of Korea's thirty million people and equality in politics, the economy and education.\n\nConflict between Kim Gu's Independence Party and former president Syngman Rhee's Liberal Party faction grew markedly during the coalition's selection of its presidential candidate. Experts now expect the Liberal-Independence coalition to be on the verge of breaking apart."
 newsk.6.a:0 "Interesting."
 newsk.6.b:0 "Long live President Kim Gu! Long live the Republic of Korea!"
 newsk.7.title:0 "Syngman Rhee's Third Term"
 newsk.7.desc:0 "The Republic of Korea's seventh presidential election today returned the incumbent, Syngman Rhee, the official candidate of the Liberal-Independence coalition. By standing again and winning, Rhee has broken the unwritten rule against presidents serving more than two terms, observed since the country's first president, Philip Jaisohn, declined a third term and voluntarily stepped down.\n\nThe decision has sharply increased tensions within the Liberal-Independence coalition, which experts now expect to begin breaking apart.\n\nIn a radio address following his victory, President Rhee pledged to overcome the Great Depression by defending a free-market economy and to safeguard national independence through cooperation with the country's free allies."
 newsk.7.a:0 "Interesting."
 newsk.7.b:0 "Long live President Syngman Rhee! Long live the Republic of Korea!"
 newsk.8.title:0 "The Supreme Council for National Reconstruction Proclaims the Second Republic of Korea"
 newsk.8.desc:0 "The Supreme Council for National Reconstruction, now in complete control of the Korean Peninsula, today proclaimed the Second Republic of Korea and announced that its chairman, Lee Beom-seok, had taken office as president. Influenced by fascism, the government has recently carried out sweeping reforms amounting to a remaking of society, transforming the country into a military-run garrison state. It has promised its people a glorious Republic of Korea that will reign supreme over the world.\n\nSyngman Rhee, the last president of the old democratic republic, is now in exile in the United States, leading the Provisional Government of Free Korea. He has denounced the new government as illegal and urged all citizens to join Free Korea's underground organisation and resist the dictators claiming the name of the Republic of Korea. His appeals, however, seem unlikely to have much effect."
 newsk.8.a:0 "Interesting."
 newsk.8.b:0 "Long live the Republic of Korea! Long live His Excellency President Lee Beom-seok!"
 newsk.9.title:0 "The Daegu Commune Proclaims the People's Republic of Korea"
 newsk.9.desc:0 "Having overthrown the Republic of Korea and taken control of the entire peninsula, the Daegu Commune today proclaimed the foundation of the People's Republic of Korea.\n\nDiplomats in neighbouring countries have been guarded in their response to the emergence of a new communist state in the Far East. The Soviet Union, however, is reported to have greeted the news with great enthusiasm, declaring that the Korean people's longing for freedom has at last borne fruit."
 newsk.9.a:0 "Another communist state in the Far East."
 newsk.9.b:0 "Long live the People's Republic of Korea!"
 newsk.10.title:0 "The Second Korean-Japanese War"
 newsk.10.desc:0 "More than thirty years ago, rivalry between the Japanese and Russian empires over suzerainty in Korea sparked the Korean-Japanese-Russian War, leaving Korea, Japan and Russia alike on the losing side of history. Korea and Japan have continued to regard one another as potential enemies ever since. Now, at last, war has broken out between them once more.\n\nWho stands to benefit remains uncertain. What seems clear is that victory will provide a springboard to dominance in East Asia, and that the whole region will be drenched in blood."
 newsk.10.a:0 "Will there be a winner this time?"
 newsk.10.b:0 "Long live His Majesty the Emperor!"
 newsk.10.c:0 "We shall prevail, whatever it takes!"
 newsk.11.title:0 "The Fall of Seoul"
 newsk.11.desc:0 "Seoul, the capital of Korea, fell to Japanese forces today. Japanese troops broke through the strong Korean defences around the capital and entered its streets. The city saw fierce fighting during the Korean-Japanese-Russian War more than thirty years ago, but did not fall then. This time was different.\n\nShocked residents watched in silence as Japanese troops marched through Namdaemun Square and along Sejong-daero. At Gyeongbokgung Palace, the former principal palace of the Joseon dynasty and now the presidential office of the Republic of Korea, the Japanese flag flies in place of the Korean flag."
 newsk.11.a:0 "Korea never stood a chance."
 newsk.11.b:0 "It is not over! We will take it back!"
 newsk.11.c:0 "Long live His Majesty the Emperor!"
 newsk.12.title:0 "The Navy of [KOR.GetNameDef] Completes Vision 1950"
 newsk.12.desc:0 "The navy of [KOR.GetNameDef] announced today that it has completed Vision 1950, its programme to build an ocean-going fleet.\n\nWith a fleet that now rivals those of the world's leading naval powers, [KOR.GetNameDef] has declared itself a formidable maritime power and announced that it will use its powerful fleet to defend its territorial waters and sovereignty at sea."
 newsk.12.a:0 "A formidable new naval power."
 newsk.12.b:0 "Go forth, fight and win!"
 newsk.13.title:0 "The Republic of Korea Announces the Asian Union"
 newsk.13.desc:0 "President Kim Gu of the Republic of Korea announced the foundation of the Asian Union today. According to a spokesman at Gyeongbokgung Palace, Kim has long envisaged an international organisation dedicated to cooperation, solidarity and peace among all the peoples of Asia. The explosive growth of Korean power since the occupation of Manchuria is said to have given him the confidence to pursue that vision.\n\nPresident Kim declared that all Asians who love freedom are fully qualified to become citizens of the Asian Union, and that the Republic of Korea will give them its wholehearted support."
 newsk.13.a:0 "What exactly are they after?"
 newsk.13.b:0 "Long live President Kim Gu! Long live the Asian Union!"
 newsk.14.title:0 "The Rebirth of Goguryeo"
 newsk.14.desc:0 "President Lee Beom-seok of the Republic of Korea announced today that, to commemorate the conquest of Manchuria and honour the country's ancestors, the state would henceforth be known as the Greater Goguryeo Empire.\n\nCrowds have poured into the streets of Seoul, cheering and praising their leader's achievements.\n\nIn his speech, President Lee declared that the glory of Goguryeo had only just been reborn, and that its revival would bring still greater glories to the country."
 newsk.14.a:0 "Interesting."
 newsk.14.b:0 "Arrogant bastards!"
 newsk.14.c:0 "Long live the Greater Goguryeo Empire!"
 newsk.14.d:0 "We must drive those invading Korean bastards out of Manchuria!"
 newsk.15.title:0 "The Birth of the Organisation of Free Nations"
 newsk.15.desc:0 "This afternoon, the White House in the United States and Gyeongbokgung Palace in the Republic of Korea jointly announced the foundation of the Organisation of Free Nations. A palace spokesman said that private discussions between the two presidents had begun several years ago, and that those efforts had now borne fruit.\n\nIn a joint statement, President [USA.GetLeader] and President [KOR.GetLeader] declared that, with the world in flames, the Organisation of Free Nations welcomes every country and people that loves freedom. They called for a united struggle against every threat to liberty and democracy."
 newsk.15.a:0 "America has gained a foothold in Asia."
 newsk.15.b:0 "The best choice for our national interests."
 newsk.15.c:0 "Together, we will defend liberty and democracy!"
 newsk.16.title:0 "Yi Un Crowned Emperor of Korea"
 newsk.16.desc:0 "Yi Un, son of Emperor Gojong of the former empire, was crowned emperor of the restored Korean Empire today. The ceremony took place at Gyeongbokgung Palace, the principal palace of the Joseon royal family and former presidential office of the Republic of Korea. It was a strange ceremony, combining a thorough rejection of the old republic's legitimacy with the Taebaek Faith's worship of Dangun.\n\nThe newly crowned emperor is reported to have shown little interest in the proceedings. The occasion was dominated by a lengthy speech from Gye Yeon-su, leader of the Taebaek Faith and chairman of the Imperial Family Appreciation Society, which played a major role in restoring the imperial family."
 newsk.16.a:0 "The old order restored? Interesting."
 newsk.16.b:0 "Long live the Korean Empire! Long live His Majesty the Emperor!"
 newsk.17.title:0 "Yi Un Crowned Emperor of Korea"
 newsk.17.desc:0 "Yi Un, son of Emperor Gojong of the former empire, was crowned emperor of the restored Korean Empire today. In accordance with the Catholic Yi Un's wishes, the ceremony was held at Myeongdong Cathedral and officiated by Archbishop Adrien-Joseph Larribeau of Seoul, following a form similar to coronations in Western monarchies.\n\nAt his coronation, Emperor Yi Un promised to defend the restored dynasty and the nation, and to be the best possible emperor for his people. He bestowed titles in the new Korean Empire's nobility on those who had worked to secure his accession."
 newsk.17.a:0 "The old order restored? Interesting."
 newsk.17.b:0 "Long live the Korean Empire! Long live His Majesty the Emperor!"
 newsk.18.title:0 "The Fall of Xinjing"
 newsk.18.desc:0 "Reports from Xinjing confirm that advancing Korean forces have occupied the capital of Manchukuo.\n\nSmall-arms fire can still be heard in some districts, but no substantial Manchukuo forces have reportedly been seen in the city.\n\nKorean troops stormed the Manchukuo Imperial Palace, but Emperor Aisin-Gioro Puyi appears to have evacuated before the attack.\n\nKorea has renamed Xinjing as Buyeo, on the grounds that Buyeoseong, the capital of the ancient Korean state of Buyeo, stood nearby."
 newsk.18.a:0 "[KOR.GetNameDefCap]'s forces seem unstoppable!"
 newsk.18.b:0 "Long live [KOR.GetNameDef]!"
 newsk.19.title:0 "Korea Proclaims the Greater Hwan Empire"
 newsk.19.desc:0 "Korea today announced that it would change its name to the Greater Hwan Empire, declaring its own power the equal of the ancient state of Hwan, which it claims existed nine thousand years ago. This enigmatic government, founded on an indigenous Korean national faith, has recently been waging vigorous wars of conquest, asserting that the entire world once belonged to it.\n\nOfficials from the world's major powers have declined to comment on the Greater Hwan Empire's claims, but their indignation seems beyond doubt."
 newsk.19.a:0 "Is there no way to stop those raving lunatics?"
 newsk.19.b:0 "Long live the Greater Hwan Empire! Long live His Holiness Gye Yeon-su!"
 newsk.20.title:0 "The Fall of Seoul"
 newsk.20.desc:0 "Chinese troops have advanced into Seoul, and the government of the Republic of China has announced the successful capture of the Korean capital after a fierce battle. At dawn, Chinese commandos seized Yeouido Airfield, while columns of infantry marched along Sejong-daero.\n\nWith Gyeongbokgung Palace secured by the Chinese, most of the fighting in central Seoul has ended. The current position of the Korean government is unknown, but its key figures appear to have escaped before the city fell."
 newsk.20.a:0 "A significant development."
 newsk.20.b:0 "This is a disaster!"
 newsk.20.c:0 "Long live the Republic of China!"
 newsk.21.title:0 "The Fall of Seoul"
 newsk.21.desc:0 "Chinese Communist troops have advanced into Seoul, and the Chinese Communist government has announced the successful capture of the Korean capital after a fierce battle. At dawn, Chinese commandos seized Yeouido Airfield, while columns of infantry marched along Sejong-daero.\n\nWith Gyeongbokgung Palace secured by Chinese troops, most of the fighting in central Seoul has ended. The current position of the Korean government is unknown, but its key figures appear to have escaped before the city fell."
 newsk.21.a:0 "A significant development."
 newsk.21.b:0 "This is a disaster!"
 newsk.21.c:0 "Long live [PRC.GetNameDef]!"
 newsk.22.title:0 "The Fall of Beiping"
 newsk.22.desc:0 "Korean troops have entered the ancient city of Beijing, capital of the Chinese empire under the Ming and Qing dynasties and renamed Beiping after the Kuomintang's second Northern Expedition in 1928.\n\nAfter the last Republic of China garrison withdrew, Mayor Xu Xiuzhi, who had chosen to remain with the city's residents, declared Beijing an open city to spare it pointless destruction. The people watched in stunned silence as Korean troops marched through Tiananmen Square in several columns, holding a victory parade.\n\nThe fall of Beijing is a severe blow to China's war effort. Many experts believe the way now lies open for Korea to conquer the Chinese mainland."
 newsk.22.a:0 "A significant development."
 newsk.22.b:0 "The Chinese nation will avenge this humiliation!"
 newsk.22.c:0 "Long live [KOR.GetNameDef]!"
 newsk.23.title:0 "The Fall of Nanjing"
 newsk.23.desc:0 "At dawn today, following indiscriminate Korean shelling of the city, Korean tanks smashed through Zhongshan Gate and improvised barricades and advanced into the streets of Nanjing. Two-and-a-half-ton lorries were seen unloading Korean motorised infantry at Chaotian Palace, built during the Ming dynasty.\n\nAs Korean infantry stormed the palace, they could see thick smoke rising into the sky from numerous fires raging in the outskirts. Reports say that grenades and flamethrowers were needed to overcome stubborn Republic of China troops defending every corner of the complex. The Chinese capital has fallen into Korean hands, but only burning ruins remain..."
 newsk.23.a:0 "A significant development."
 newsk.23.b:0 "We must drive those invading Korean bastards out of Nanjing!"
 newsk.23.c:0 "Long live [KOR.GetNameDef]!"
 newsk.24.title:0 "The Fall of Chongqing"
 newsk.24.desc:0 "Desperate fighting has been reported in Chongqing, the Republic of China's last provisional capital, but the city is now believed to be entirely in Korean hands. Korean troops crossed the Jialing River and entered the Jialing Peninsula at the heart of Chongqing.\n\nThe provisional government building collapsed under Korean artillery fire after diehard agents of the Blue Shirts Society refused to surrender. The Korean flag now flies over the ruins of Baidicheng, while the last resisting remnants of the Republic of China's forces are being cleared out."
 newsk.24.a:0 "A significant development."
 newsk.24.b:0 "Is this the beginning of the end...?"
 newsk.24.c:0 "This is truly peace for our time."
 newsk.25.title:0 "The Collapse of the Republic of Korea"
 newsk.25.desc:0 "The Republic of Korea's decline since the Great Depression was plain to see, but no one predicted that it would meet its end like this.\n\nBacked by a public weary of the far left, the far right and political wrangling within the Liberal-Independence coalition, the Imperial Family Appreciation Society recently secured a parliamentary majority. Amid thunderous cheers in the National Assembly, it has declared the dissolution of the Republic of Korea and the restoration of the Korean imperial family.\n\nThe Republic of Korea, founded in 1906 as Asia's first democratic republic, has thus fallen after thirty years. The peninsula is now governed by the 'Deoksugung Council', reorganised from the Imperial Family Appreciation Society."
 newsk.25.a:0 "Interesting."
 newsk.25.b:0 "A disgraceful end to the sham republic."
 newsk.26.title:0 "The Taebaek Faith Seizes Power in Korea"
 newsk.26.desc:0 "Shocking news has arrived from Korea, where a recent 'Glorious Revolution' by monarchists restored imperial rule. Last night, the great majority of intellectuals, republicans and even monarchists were arrested and detained without warrants on charges of high treason. The orders came from Gye Yeon-su, leader of the Taebaek Faith and chairman of the Imperial Family Appreciation Society, whom Emperor Yi Un had appointed Imperial Regent after the restoration. Whether those detained are alive or dead is now unknown.\n\nLocal sources report that, following this 'Night of the Silver Daggers', Regent Gye Yeon-su has taken complete control of the Korean Empire. Emperor Yi Un is said to have lost all resolve and sunk into despair, becoming the regent's puppet."
 newsk.26.a:0 "Are they in their right minds?"
 newsk.26.b:0 "Now no one can stop the rebirth of Hwan."
 newsk.27.title:0 "The Second Hwan-Finnish War"
 newsk.27.desc:0 "Gye Yeon-su, Imperial Regent of Hwan, announced today that research into ancient history and archaeological records from around the world had revealed the true enemy that destroyed the great Hwan Empire, which his country claims existed nine thousand years ago.\n\nAccording to Gye, the true enemy that destroyed their ancient state is present-day Finland. He has ordered all Hwan forces to prepare a scorched-earth campaign against Finland.\n\nFinland's leader, Sigurd Wettenhovi-Aspa, mocked Gye and Hwan for only now realising the truth, declaring that 'the fearless armies of the Greater Finnish Empire will bury every last witless Hwan soldier beneath the snows of Finland'.\n\nA 'second' all-out clash between the two countries now seems inevitable..."
 newsk.27.a:0 "What on earth are those lunatics talking about?"
 newsk.27.b:0 "Time to put those arrogant bastards back in their coffins!"
 newsk.27.c:0 "We have waited nine thousand years. This time we shall prevail!"
 newsk.28.title:0 "The Liberation of Seoul"
 newsk.28.desc:0 "It was confirmed today that Seoul, the largest city on the Korean Peninsula and capital of [KOR.GetNameDef], has been liberated from Japanese occupation. Like the Righteous Army of the Thirteen Provinces during the Korean-Japanese-Russian War of 1906, Korean troops entered Seoul through Independence Gate, and the remaining Japanese garrison units surrendered. Despite rumours of Japanese snipers still resisting in parts of the city, Seoul's residents have enthusiastically welcomed the 'liberators' marching through Gwanghwamun Square and along Sejong-daero.\n\nResidents had feared that Japanese scorched-earth tactics would leave Seoul engulfed in flames and reduced to ruins, but the city has suffered little damage. The Korean flag of [KOR.GetNameDef] once again flies from Namsan Tower."
 newsk.28.a:0 "A significant development."
 newsk.28.b:0 "Long live [KOR.GetNameDef]!"
 newsk.28.c:0 "Incompetent fools!"
