l_english:
#20261003_kpopmodder: Explain new decision and spirit policies through concrete circumstances; preserve gameplay and lifecycle rules.
#20261002_kpopmodder: Explain the scrap-collection tier through discarded metal and the need to recover scarce raw materials.
#20261002_kpopmodder: Explain the need for permanent and emergency material recycling in spirit prose instead of repeating mechanics.
#20261002_kpopmodder: Describe the strengthened material-cycle tiers and the repeatable 90-day emergency program.
#20260926_kpopmodder: Use escaped ASCII dialogue quotes and compact decision UI text; preserve gameplay and explicit lifecycle warnings.
#20260926_kpopmodder: Compact new focus descriptions for the fixed-height UI; preserve gameplay and non-focus localisation.
#20260925_kpopmodder: Rewrite focus, decision and event prose with grounded voices; preserve keys, gameplay rules and paired Korean text.
#20260923_kpopmodder: Describe regional operating conditions and shared field-specialization rewards.
 HOK_KOR_cmn_export_invoices:0 "Export Transaction Records"
 HOK_KOR_cmn_export_invoices_desc:0 "If we ship the goods but cannot collect payment, next month's work stops as well. We will reconcile contracts and payment records so that the proceeds find their way back to the factories."
 HOK_KOR_cmn_commercial_arbitration:0 "Commercial Arbitration Procedures"
 HOK_KOR_cmn_commercial_arbitration_desc:0 "While the parties argue over who is responsible for defective goods, the next order falls through. We will establish standards for commercial arbitration so that exporters can keep trading and investing in equipment."
 HOK_KOR_cmn_shipping_documents:0 "Standardised Shipping Documents"
 HOK_KOR_cmn_shipping_documents_desc:0 "The cargo is on the quay, but conflicting paperwork keeps it off the ship. We will standardise shipping forms and communications so that documents are less likely to hold up the goods."
 HOK_KOR_cmn_market_sampling:0 "Samples for Overseas Markets"
 HOK_KOR_cmn_market_sampling_desc:0 "\"I understand the price. But can I see how it feels?\"\nWe will add sample exhibitions to our trading and shipping arrangements to secure those first orders."
 HOK_KOR_cmn_export_settlement:0 "Export Payment Practices"
 HOK_KOR_cmn_export_settlement_desc:0 "Factories need to know when export payments will arrive before they can pay for materials and wages. Established payment practices will turn one order into the next investment."
 HOK_KOR_cmn_ore_classification:0 "Classification of Raw Ores"
 HOK_KOR_cmn_ore_classification_desc:0 "Stones that look alike can behave very differently in a furnace. Industrial research into ore types and the materials each process requires will show us what can be used where."
 HOK_KOR_cmn_scrap_collection:0 "Scrap Metal Collection Network"
 HOK_KOR_cmn_scrap_collection_desc:0 "Even the scraps behind a factory are raw materials we can use again. By recovering scrap metal and by-products, we will make the most of what we already have when fresh supplies run short."
 HOK_KOR_cmn_coke_testing:0 "Coke Quality Testing"
 HOK_KOR_cmn_coke_testing_desc:0 "Not everything that burns makes the same fuel. We will test the quality of coke and minerals and send the results back to the mines."
 HOK_KOR_cmn_foundry_exchange:0 "Exchanges between Smelters"
 HOK_KOR_cmn_foundry_exchange_desc:0 "There is no need for the neighbouring factory to repeat the same mistakes. Smelters equipped with collection networks and quality testing will share their experience and reinvest in their equipment."
 HOK_KOR_cmn_closed_material_cycle:0 "Materials Recycling System"
 HOK_KOR_cmn_closed_material_cycle_desc:0 "Recovered materials must not be forgotten in a warehouse. Linking collection to quality testing and reuse will strengthen resource production and our ability to cope with shortages."
 HOK_KOR_cmn_motor_driver_courses:0 "Driver Training for Mobile Units"
 HOK_KOR_cmn_motor_driver_courses_desc:0 "\"I know how to drive.\"\n\"And what happens to the column when the vehicle in front stops?\"\nWe will teach drivers to move a whole unit, not merely turn a steering wheel."
 HOK_KOR_cmn_mechanized_loading:0 "Mechanised Loading and Unloading Drills"
 HOK_KOR_cmn_mechanized_loading_desc:0 "There is nothing mobile about vehicles driving off while the equipment stays on the ground. We will coordinate loading, unloading and maintenance so that troops and equipment move together."
 HOK_KOR_cmn_march_discipline:0 "March Discipline for Mobile Columns"
 HOK_KOR_cmn_march_discipline_desc:0 "The arrival of the leading vehicle does not mean the whole column has arrived. Radio contact and march records will help us account for vehicles that have fallen behind."
 HOK_KOR_cmn_mobile_unit_recovery:0 "Regrouping Mobile Units"
 HOK_KOR_cmn_mobile_unit_recovery_desc:0 "Once the vehicles arrive, they must be formed back into units. Combining mechanised operations with march discipline will save time and fuel during regrouping as well."
 HOK_KOR_cmn_emergency_turn_drills:0 "Emergency Turn Drills"
 HOK_KOR_cmn_emergency_turn_drills_desc:0 "When the fleet changes course, damaged ships must not be left behind. Repeated emergency turns and disengagement drills will teach each ship its place and distance."
 HOK_KOR_cmn_smoke_screen_procedures:0 "Withdrawal under Smoke"
 HOK_KOR_cmn_smoke_screen_procedures_desc:0 "Laying smoke is little use for a withdrawal if no one knows which way to go. Signals and disengagement procedures practised for the aftermath of an initial engagement will get the fleet clear."
 HOK_KOR_cmn_rescue_station_drills:0 "Maritime Rescue Watch"
 HOK_KOR_cmn_rescue_station_drills_desc:0 "It is too late to begin preparations after a distress call arrives. We will organise watches, support vessels and repair procedures so that our ships can protect one another even far out at sea."
 HOK_KOR_cmn_flight_weather_logs:0 "Aviation Weather Logs"
 HOK_KOR_cmn_flight_weather_logs_desc:0 "Clear skies at the departure airfield do not necessarily extend to the destination. Weather logs and communications between airfields will pass observations on to the next pilot."
 HOK_KOR_cmn_instrument_approaches:0 "Instrument Approach Procedures"
 HOK_KOR_cmn_instrument_approaches_desc:0 "\"I cannot see the runway.\"\n\"Check your instruments and follow the procedure you practised.\"\nInstrument approaches and landings must be learnt before visibility is lost."
 HOK_KOR_cmn_adverse_weather_flying:0 "Bad Weather Flying Regulations"
 HOK_KOR_cmn_adverse_weather_flying_desc:0 "The sky may be very different on the return journey. Observations and manuals will ease the burden of bad weather. This branch can be pursued alongside instrument flying."
 HOK_KOR_cmn_export_practice_1:0 "Export Trading System I"
 HOK_KOR_cmn_export_practice_1_desc:0 "If goods leave the country but payment never arrives, factories cannot buy materials or pay wages for the next order. Transaction records and arbitration procedures now allow sellers and buyers to work from the same contract. Funds once tied up in disputes and late payments can begin flowing back into investment in equipment.\n\nThis is a common industrial institution that remains in place when the ruling ideology changes."
 HOK_KOR_cmn_export_practice_2:0 "Export Trading System II"
 HOK_KOR_cmn_export_practice_2_desc:0 "Even when export goods reach the quay, incorrect documents keep them off the ship. Without knowing when payment will arrive, factories struggle to prepare their next production run. Shipping forms and payment practices are now part of the trading system, with clear responsibility from the order through to receipt of payment. These working arrangements allow a first overseas order to develop into regular trade and factory expansion.\n\nReplaces tier I and remains in place when the ruling ideology changes."
 HOK_KOR_cmn_material_cycle_1:0 "Materials Recycling System I"
 HOK_KOR_cmn_material_cycle_1_desc:0 "Scraps discarded behind factories and worn-out machine parts still contain metal we can use again. The shorter our supplies of fresh materials, the more thoroughly we must use what we have already acquired. The collection network gathers scrap scattered across workshops, separates reusable metal and sends it to the smelters. When discarded metal returns to the furnaces, factories waiting for raw materials can get back to work."
 HOK_KOR_cmn_material_cycle_2:0 "Materials Recycling System II"
 HOK_KOR_cmn_material_cycle_2_desc:0 "The raw materials our mines produce cannot easily meet the demands of a growing number of factories. Reliance on imports alone leaves furnaces and workbenches vulnerable to events far out at sea. Metal offcuts and discarded, worn-out machine parts still contain useful metal. A network that sorts them by material, melts them down and sends them back to the factories that need them provides a basis for keeping production going even when fresh supplies arrive late."
 HOK_KOR_cmn_mobile_operations_1:0 "Mobile Unit Operations I"
 HOK_KOR_cmn_mobile_operations_1_desc:0 "A unit is not ready to move simply because its leading vehicles have reached the destination, if troops and equipment are still scattered along the road. By training drivers in loading, unloading and maintenance procedures together, we bring troops and vehicles into a single column from the outset. Fewer repeated stops and less idling on the road leave us better prepared for the next move.\n\nThe benefits apply to the entire army and remain in place when the ruling ideology changes."
 HOK_KOR_cmn_mobile_operations_2:0 "Mobile Unit Operations II"
 HOK_KOR_cmn_mobile_operations_2_desc:0 "If the vehicles at the rear do not know why the one in front has stopped, a brief breakdown becomes a long traffic jam. Radio contact and march records now help us account for stragglers, while established procedures bring arriving troops back into their units. Coordination of the entire column complements driving and maintenance, so that neither men nor fuel are wasted waiting.\n\nReplaces tier I. The benefits apply to the entire army and remain in place when the ruling ideology changes."
 HOK_KOR_cmn_smoke_withdrawal:0 "Fleet Disengagement Procedures"
 HOK_KOR_cmn_smoke_withdrawal_desc:0 "Once the enemy is sighted, not every ship can turn away at the same instant. Repeated practice with disengagement signals and the order in which smoke is laid prevents damaged ships and following vessels from blocking one another's courses. If the fleet must withdraw after an initial engagement, each ship knows when to move and what distance to keep.\n\nThis is a common naval institution that remains in place when the ruling ideology changes."
 HOK_KOR_cmn_maritime_rescue:0 "Maritime Rescue System"
 HOK_KOR_cmn_maritime_rescue_desc:0 "It is too late to start looking for spare parts and support vessels once a distress call comes in from the open sea. Ships on watch remain in contact with repair crews, and arrangements are made in advance for vessels that encounter trouble under way. This provides a basis for mutual support far from the fleet's home port and for returning damaged ships to service.\n\nThis is a common naval institution that remains in place when the ruling ideology changes."
 HOK_KOR_cmn_instrument_flying:0 "Instrument Flying System"
 HOK_KOR_cmn_instrument_flying_desc:0 "A pilot cannot rely on instinct alone when the runway disappears into cloud. Airfields and pilots now use the same approach procedures and practise the sequence of instrument checks. The system reduces the risk of accidents by preparing pilots to return according to familiar procedures even when visibility is lost.\n\nThis is a common air force institution that remains in place when the ruling ideology changes."
 HOK_KOR_cmn_weather_flying:0 "Bad Weather Flying Manual"
 HOK_KOR_cmn_weather_flying_desc:0 "Clear skies at the departure airfield do not necessarily extend to the destination. Observations from each airfield and the records of pilots who have already returned are brought together in a manual that accounts for the burden wind and cloud place on operations. We are now prepared to share observations and carry out missions using familiar procedures in changing weather.\n\nApplies separately from the Instrument Flying System and remains in place when the ruling ideology changes."
 HOK_KOR_cmn_material_cycle_projects:0 "Intensive Support for Materials Recycling"
 HOK_KOR_cmn_material_cycle_projects_desc:0 "Even when there is metal left to collect, smelters must wait for supplies if collection depots and sorting facilities cannot keep up. We will concentrate support on recovery, sorting and reuse facilities, along with transport, so that the permanent recycling network can meet a sudden rise in demand.\n\nEmergency expansion provides a separate national spirit lasting 90 days. It does not use the limit on simultaneous regional projects or their waiting period after completion."
 HOK_KOR_cmn_emergency_material_cycle:0 "Emergency Expansion of Materials Recycling Facilities"
 HOK_KOR_cmn_emergency_material_cycle_desc:0 "Securing raw materials does not end with mining fresh ore. Metal shavings accumulated in factories, worn-out machine parts, scrapped vehicles and demolition materials still contain resources that can put industry back to work. Yet the existing collection network and its normal processing capacity cannot recover all these materials and supply the factories that need them in time to meet a sudden surge in production demand. Before shortages become bottlenecks on the factory floor, we must rapidly expand collection depots, sorting facilities and remelting capacity, and coordinate transport between railways, warehouses and smelters.\n\nFor 90 days, the government will provide emergency administrative support to review local collection contracts and transport allocations, and standardise quality checks and requirements for reusing recovered materials. Mixed scrap will be separated according to its intended use, while reusable parts and materials requiring remelting will each go to suitable facilities. By tracking factories' demand for raw materials alongside the supply of recovered materials, we will reduce stocks stranded in warehouses and give priority to production sites facing shortages, temporarily increasing the capacity of the existing recycling system.\n\nThis project is a temporary programme of intensive expansion and operation carried out in addition to the permanent materials recycling system. When emergency support ends, the extra processing and transport assistance will cease, but the established basic recycling system will remain. If demand rises again or supplies come under pressure, fresh political and administrative support can be committed to restarting the same project. Rather than running overlapping projects, we will concentrate capacity on recovery and reuse for a set period, increasing resource availability and reducing production disruption caused by shortages.\n\nSpends §Y150 Political Power§! to provide a separate national spirit for §Y90 days§!, adding §G+30%§! Resource Gain Efficiency and §G-30%§! Resource Shortage Penalty. Combined with Materials Recycling System II, this policy provides §G+90%/-90%§!, returning to the basic §Y+60%/-60%§! when it ends. It cannot be used again while active, but can be restarted immediately after it ends. Repeated use does not stack or accumulate permanent benefits. Emergency support ends in the event of civil war, capitulation or loss of the basic national spirit, with no refund of Political Power."
 HOK_KOR_cmn_emergency_material_cycle_boost:0 "Emergency Expansion of Materials Recycling Facilities"
 HOK_KOR_cmn_emergency_material_cycle_boost_desc:0 "A smelter waits for metal to melt while usable scraps lie piled behind another factory. When production suddenly expands, the usual collection vehicles and sorting yards cannot recover these materials quickly enough. Collection depots and remelting facilities are being expanded urgently, with extra transport carrying scattered metal to factories short of raw materials. The furnaces cannot be allowed to go cold while we wait for new mines to open and supplies to arrive from overseas."
