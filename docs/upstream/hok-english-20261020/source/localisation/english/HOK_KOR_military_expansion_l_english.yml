#20261003_kpopmodder: Explain new decision and spirit policies through concrete circumstances; preserve gameplay and lifecycle rules.
#20260926_kpopmodder: Use escaped ASCII dialogue quotes and compact decision UI text; preserve gameplay and explicit lifecycle warnings.
#20260926_kpopmodder: Compact new focus descriptions for the fixed-height UI; preserve gameplay and non-focus localisation.
#20260925_kpopmodder: Rewrite focus, decision and event prose with grounded voices; preserve keys, gameplay rules and paired Korean text.
#20260921_kpopmodder: 승인된 보상 강화에 맞춰 최종 교체값·영구 효과·반복 사업 조건과 협정 설명을 두 언어 채널에 동기화합니다.
#20260921_kpopmodder: Add paired Korean military expansion names and descriptions.
 HOK_KOR_procurement_contracts:0 "Defence Procurement Contracts"
 HOK_KOR_procurement_contracts_desc:0 "The arsenals await orders; the units await supplies. Long-term procurement contracts shall align the two schedules and carry experience from rifle development into the next production run."
 HOK_KOR_ammunition_standards:0 "Standardise Ammunition"
 HOK_KOR_ammunition_standards_desc:0 "A crate of ammunition does not end the wait if its contents do not fit the guns. We shall standardise ammunition and components across arsenals and private manufacturers."
 HOK_KOR_ordnance_inspection:0 "Ordnance Inspection System"
 HOK_KOR_ordnance_inspection_desc:0 "\"The quantities delivered are correct.\"\n\"Bring the firing test results too.\"\nWe shall revise inspection standards for shells and artillery, feeding test results back to the manufacturers."
 HOK_KOR_field_maintenance:0 "Field Maintenance Workshops"
 HOK_KOR_field_maintenance_desc:0 "One broken component should not send an entire piece of equipment to the rear. Field workshops, with the personnel and tools they need, shall be established close to the units."
 HOK_KOR_distributed_ordnance_depots:0 "Dispersed Supply Depot System"
 HOK_KOR_distributed_ordnance_depots_desc:0 "A report that supplies are in a warehouse is different from a report that a unit has received them. We shall disperse military stockpiles, allowing deliveries to continue from elsewhere when a transport route is blocked."
 HOK_KOR_staff_exercises:0 "Staff Map Exercises"
 HOK_KOR_staff_exercises_desc:0 "The arrows on a map may be clear, but units may still set off at different times. Map exercises shall teach staff to read the same operational map and coordinate their orders."
 HOK_KOR_winter_training:0 "Gaema Plateau Winter Training"
 HOK_KOR_winter_training_desc:0 "Enduring the cold will not dry wet equipment. Training in protection against the cold, camping and supply on the Gaema Plateau shall prepare units to keep moving through winter."
 HOK_KOR_mountain_reconnaissance:0 "Mountain Reconnaissance School"
 HOK_KOR_mountain_reconnaissance_desc:0 "A ridge that looks close on the map can be a long walk on the ground. The Mountain Reconnaissance School shall teach troops to read terrain and find their way in small units."
 HOK_KOR_radio_coordination:0 "Standardise Radio Command Networks"
 HOK_KOR_radio_coordination_desc:0 "Communication is not complete merely because an order has been sent. We shall align frequencies and reporting procedures, and research radio equipment, so that the intended meaning reaches its destination."
 HOK_KOR_joint_arms_exercises:0 "Combined Arms Exercises"
 HOK_KOR_joint_arms_exercises_desc:0 "Artillery, infantry and armour shall work to one timetable. Replaces the staff system, granting +20% Planning Speed and +6% Coordination. Does not stack with the previous stage."
 HOK_KOR_rapid_repairs:0 "Reorganise Jinhae Repair Yards"
 HOK_KOR_rapid_repairs_desc:0 "Ships wait for repair berths; the berths wait for parts. We shall reorganise work schedules and procurement at Jinhae's repair yards to reduce the time damaged warships spend tied up in port."
 HOK_KOR_archipelago_training:0 "Archipelago Manoeuvres"
 HOK_KOR_archipelago_training_desc:0 "Simply waiting for friendly ships to reappear from behind an island will not keep a formation together. We shall practise manoeuvring and the use of smoke in the archipelago's narrow channels."
 HOK_KOR_escort_school:0 "Escort Squadron School"
 HOK_KOR_escort_school_desc:0 "Behind every cargo manifest are soldiers and factories awaiting supplies. The Escort Squadron School shall teach crews how to bring transports safely to their destination."
 HOK_KOR_anti_submarine_school:0 "Anti-submarine Warfare School"
 HOK_KOR_anti_submarine_school_desc:0 "The next watch must take over the search for the enemy below the surface. We shall develop anti-submarine equipment and crew training together."
 HOK_KOR_coastal_fire_control:0 "Naval Gunfire Support Liaison System"
 HOK_KOR_coastal_fire_control_desc:0 "Shore observers and the fleet must not have different targets in mind. Common coordinates and fire requests shall bring naval gunfire to where it is needed."
 HOK_KOR_fleet_staff_college:0 "Fleet Staff College"
 HOK_KOR_fleet_staff_college_desc:0 "On the high seas, events move faster than replies from home. Commanders of the ocean-going fleet and commerce-raiding squadrons shall study routes, enemy dispositions and logistics together."
 HOK_KOR_underway_replenishment:0 "Procedures for Replenishment at Sea"
 HOK_KOR_underway_replenishment_desc:0 "Drawing another route on an operational map does not provide more fuel. We shall revise long-range replenishment procedures, including the return journey in the calculations for the outward voyage."
 HOK_KOR_deck_training:0 "Flight Deck Operations School"
 HOK_KOR_deck_training_desc:0 "Before an aircraft can take off, hands are needed to clear and inspect the deck. Carrier research and crew training shall produce a flight deck pilots can trust."
 HOK_KOR_naval_air_coordination:0 "Naval and Air Liaison Network"
 HOK_KOR_naval_air_coordination_desc:0 "The fleet should not have to search again for a target already found by an air unit. We shall align naval and air liaison and reporting procedures, and research aircraft for maritime strikes."
 HOK_KOR_amphibious_rehearsals:0 "Joint Amphibious Support Exercises"
 HOK_KOR_amphibious_rehearsals_desc:0 "Command must not break down when troops move from sea to shore. Joint army and navy exercises shall bring transport, naval gunfire support and coastal reconnaissance together."
 HOK_KOR_domestic_aircraft_designs:0 "Concentrate Domestic Design Expertise"
 HOK_KOR_domestic_aircraft_designs_desc:0 "\"Please show us on the drawing where you had difficulties during the test flight.\"\nWe shall bring Korea Aerospace Industries' designers together with the military's experience to guide testing and improvements of domestic aircraft."
 HOK_KOR_foreign_aircraft_designs:0 "Adopt Friendly Nations' Aviation Technology"
 HOK_KOR_foreign_aircraft_designs_desc:0 "We shall learn from the aviation experience of a non-hostile major power with the same form of government. Grants two 75% aircraft research bonuses and 15 Air Experience. Does not directly grant technologies or completed designs."
 HOK_KOR_formation_flying:0 "Standardise Formation Tactics"
 HOK_KOR_formation_flying_desc:0 "Individual flying skill alone does not make a formation. Standardised communications and manoeuvres shall allow pilots to cover one another's blind spots while carrying out their missions."
 HOK_KOR_air_maintenance_school:0 "Aircraft Maintenance School"
 HOK_KOR_air_maintenance_school_desc:0 "\"Did you check it yourself before writing 'no faults'?\"\nThe Aircraft Maintenance School shall teach specialist skills and lessons from accidents, training maintenance crews who do not overlook small faults."
 HOK_KOR_combat_lessons_center:0 "Air Combat Lessons Research Group"
 HOK_KOR_combat_lessons_center_desc:0 "We shall pass one formation's experience on to the next. Replaces the previous stage with a system for sharing combat lessons, granting +30% Air Mission Efficiency. The stages do not stack."
 HOK_KOR_procurement_spirit_1:0 "Military Supply Standardisation"
 HOK_KOR_procurement_spirit_1_desc:0 "When every crate contains ammunition and components to different specifications, arsenals must rework supplies they have already made. Common specifications align machining and assembly standards, reducing confusion on the factory floor."
 HOK_KOR_procurement_spirit_2:0 "Integrated Military Supply System"
 HOK_KOR_procurement_spirit_2_desc:0 "Even with goods made to the right specifications, components remain in the wrong warehouse if supply depots and the front make separate demands. Common standards and dispersed supply depots form a system linking production to deliveries at the front.\n\nReplaces §YMilitary Supply Standardisation§!; does not stack with the previous stage."
 HOK_KOR_staff_spirit_1:0 "Staff Training System"
 HOK_KOR_staff_spirit_1_desc:0 "If every unit marks different movement times on its maps and issues orders in a different way, a plan is flawed from the start. Regular map exercises build familiarity with operational planning and the procedures for passing on orders."
 HOK_KOR_staff_spirit_2:0 "Combined Arms Staff System"
 HOK_KOR_staff_spirit_2_desc:0 "If infantry movements, artillery support and other arms' tasks are decided separately, one unit waits while another prepares. Linking the use of each arm and the radio communications network in a single operational plan coordinates their actions.\n\nReplaces §YStaff Training System§!; does not stack with the previous stage."
 HOK_KOR_winter_training_spirit:0 "Winter Warfare Preparations"
 HOK_KOR_winter_training_spirit_desc:0 "A winter march begins with preparations for overnight shelter and personnel to care for frozen equipment. Training in cold-weather camping, supply and equipment care reduces losses caused by the cold."
 HOK_KOR_rapid_repairs_spirit:0 "Fleet Repair System"
 HOK_KOR_rapid_repairs_spirit_desc:0 "Reorganised repair yard schedules and spare parts procurement return damaged ships to service quickly."
 HOK_KOR_escort_spirit:0 "Experienced Escort Squadrons"
 HOK_KOR_escort_spirit_desc:0 "When transports scatter, escort ships struggle to decide which vessel to follow. Crews trained in convoy formations and escort procedures match speed and formation to protect our sea lanes."
 HOK_KOR_coastal_fire_control_spirit:0 "Coastal Fire Support Coordination"
 HOK_KOR_coastal_fire_control_spirit_desc:0 "Troops approaching the coast and their supporting fleet cannot concentrate fire at the right moment if they receive different position reports. Common procedures allow the fleet and shore observers to request and adjust fire support, coordinating their actions during landings."
 HOK_KOR_naval_logistics_spirit:0 "Logistical Support at Sea"
 HOK_KOR_naval_logistics_spirit_desc:0 "Calculating only the fuel needed to leave port will not sustain operations on the high seas. Reviewing sailing plans alongside refuelling times allows systematic management of fuel use and supply schedules during long-range operations."
 HOK_KOR_formation_spirit_1:0 "Standard Formation Tactics"
 HOK_KOR_formation_spirit_1_desc:0 "When pilots manoeuvre entirely on their own judgement, even a formation on the same mission loses track of its members. Common manoeuvres and communications procedures allow pilots to cover one another's blind spots and provide support throughout the mission."
 HOK_KOR_formation_spirit_2:0 "System for Sharing Air Combat Lessons"
 HOK_KOR_formation_spirit_2_desc:0 "If a problem encountered by one formation stays in that formation's report alone, the next unit will learn the same lesson the hard way. The research group brings together training and combat experience and passes it on to inform mission preparations across the air force.\n\nReplaces §YStandard Formation Tactics§!; does not stack with the previous stage."
 HOK_KOR_air_maintenance_spirit:0 "Specialist Aircraft Maintenance Crews"
 HOK_KOR_air_maintenance_spirit_desc:0 "Systematic maintenance training and accident analysis reduce preventable aircraft losses."

