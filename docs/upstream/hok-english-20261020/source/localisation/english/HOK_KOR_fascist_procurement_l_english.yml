#20261003_kpopmodder: Apply varied HOI4 fascist and communist voices to description narrative; preserve effects and explicit rules.
#20261003_kpopmodder: Explain new decision and spirit policies through concrete circumstances; preserve gameplay and lifecycle rules.
#20260926_kpopmodder: Use escaped ASCII dialogue quotes and compact decision UI text; preserve gameplay and explicit lifecycle warnings.
#20260926_kpopmodder: Compact new focus descriptions for the fixed-height UI; preserve gameplay and non-focus localisation.
#20260926_kpopmodder: Restore fictional NRSC command and conscription black comedy while preserving all gameplay rules.
#20260925_kpopmodder: Rewrite focus, decision and event prose with grounded voices; preserve keys, gameplay rules and paired Korean text.
 #20260922_kpopmodder: Describe the compact fascist procurement module, preserved company orders and bounded paid programs.
 HOK_KOR_nrsc_procurement_board:0 "Reorganise Military Procurement"
 HOK_KOR_nrsc_procurement_board_desc:0 "\"You've won the contract.\"\n\"You've been assigned it.\"\nExisting powers to place orders with individual companies remain, while the National Salvation Army's procurement organisation shall oversee both costs and delivery dates."
 HOK_KOR_nrsc_contract_audits:0 "Military Contract Cost Reviews"
 HOK_KOR_nrsc_contract_audits_desc:0 "\"They're standard additional charges.\"\n\"Which unit is charging us?\"\nWe shall compare cost schedules with actual inputs to reduce waste and disruption at existing production facilities."
 HOK_KOR_nrsc_delivery_schedules:0 "Coordinate Military Deliveries"
 HOK_KOR_nrsc_delivery_schedules_desc:0 "\"We can meet the deadline with some effort.\"\n\"That effort has just been authorised.\"\nWe shall align production processes and delivery dates, introduce technology and open emergency delivery and raw materials contract programmes."
 HOK_KOR_nrsc_supply_contracts:0 "Integrated Military Contract System"
 HOK_KOR_nrsc_supply_contracts_desc:0 "\"Every document has a different explanation, but the person responsible is the same.\"\nWe shall integrate oversight of costs, delivery dates and materials to improve output and our response to shortages. Existing chaebol orders remain."
 HOK_KOR_nrsc_procurement_oversight_1:0 "Military Procurement Oversight I"
 HOK_KOR_nrsc_procurement_oversight_1_desc:0 "An order from the National Salvation Army is an honour for any factory. Naturally, that honour cannot be invoiced under 'miscellaneous expenses'. The procurement organisation compares costs incurred with work actually done and appoints those responsible for deliveries, ensuring that the patriotism written into contracts earns its keep on the factory floor. The companies were the first to promise to serve the motherland, so they will surely welcome this modest degree of scrutiny.\n\nRemoved if the government ceases to be fascist."
 HOK_KOR_nrsc_procurement_oversight_2:0 "Military Procurement Oversight II"
 HOK_KOR_nrsc_procurement_oversight_2_desc:0 "Every factory insists that, for the motherland's sake, it must receive its steel first. A loyal nation indeed, but loyalty cannot be smelted. The National Salvation Army shall bring costs, raw materials allocations and delivery schedules together, linking up the production processes that can actually run. Blaming the factory further up the chain will no longer be enough to explain delays to one's own contract.\n\nReplaces Military Procurement Oversight I. Removed if the government ceases to be fascist."
 HOK_KOR_nrsc_emergency_deliveries_project:0 "Emergency Military Deliveries"
 HOK_KOR_nrsc_emergency_deliveries_project_desc:0 "\"When will you be back?\" \"I won't be back. I'll wait here.\"\nThe National Salvation Army has decided to take a special interest in the factory. A procurement officer sits in the owner's office, finished goods pile up at the inspection bench and the next stage of production waits for overdue components. We shall link work and inspection to drive deliveries through. We expect this considerate attention to be repaid in shipments rather than letters of thanks.\n\nCosts 150 Political Power and supports military production for 90 days from the start. Does not occupy civilian factories or grant equipment immediately. Only one of the two military contract programmes can run at a time. Both programmes share a 90-day cooldown after completion or cancellation. Cancelled if the fascist government or required focus conditions are lost, or during capitulation or civil war. Costs are not refunded."
 HOK_KOR_nrsc_material_contracts_project:0 "Raw Materials Contract Coordination"
 HOK_KOR_nrsc_material_contracts_project_desc:0 "The National Salvation Army is deeply saddened to hear that every factory lacks the raw materials to serve the motherland. Reading all the requisitions demanding first claim to the same steel, however, we must first establish how many motherlands there are. We shall compare each contract's material needs and production sequence, then redraw allocations. We cannot conjure steel out of nothing, but the state has no reason to tolerate every production line stopping over steel that does exist.\n\nCosts 150 Political Power and reduces production penalties from resource shortages for 90 days from the start. Does not occupy civilian factories or change resource output, import contracts or resource consumption. Only one of the two military contract programmes can run at a time. Both programmes share a 90-day cooldown after completion or cancellation. Cancelled if the fascist government or required focus conditions are lost, or during capitulation or civil war. Costs are not refunded."
 HOK_KOR_fascist_procurement_programs:0 "National Salvation Army Military Contract Programmes"
 HOK_KOR_fascist_procurement_programs_desc:0 "\"The contract's settled.\" \"You haven't even started fulfilling it.\"\nCorporate autonomy and the state's demands are perfectly compatible. Companies fulfil contracts, and the state watches them do it. The National Salvation Army will drive production forward by concentrating support on deliveries or resolving conflicting claims to raw materials. Existing powers to place orders with individual companies remain. Please show the factory the confidence you displayed when you won the contract.\n\nUnlocked by completing the Eulhae Military Uprising and Coordinate Military Deliveries focuses. Military Contract Cost Reviews need not be completed first. Each programme costs 150 Political Power and occupies no civilian factories. Only one can run at a time, for 90 days. Both programmes share a 90-day cooldown after completion or cancellation."
 HOK_KOR_fascist_procurement_no_active_program_tt:0 "No other National Salvation Army military contract programme is in progress"
 HOK_KOR_fascist_procurement_cooldown_finished_tt:0 "90 days have passed since the previous National Salvation Army military contract programme ended or was cancelled"
 HOK_KOR_fascist_procurement_program_start_tt:0 "Costs §Y150§! Political Power and occupies no civilian factories. Effects last §Y90 days§!.\nOnly one military contract programme can run at a time. After completion/cancellation, all programmes in this category are unavailable for §Y90 days§!.\nCancelled if the fascist government/path is lost, or during capitulation/civil war. Costs are not refunded."
 HOK_KOR_fascist_procurement_program_end_tt:0 "Programme effects end. All military contract programmes are unavailable for §Y90 days§!. Costs are not refunded."
