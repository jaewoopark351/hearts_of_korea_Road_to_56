#20261003_kpopmodder: Apply varied HOI4 fascist and communist voices to description narrative; preserve effects and explicit rules.
#20261003_kpopmodder: Explain new decision and spirit policies through concrete circumstances; preserve gameplay and lifecycle rules.
#20260926_kpopmodder: Use escaped ASCII dialogue quotes and compact decision UI text; preserve gameplay and explicit lifecycle warnings.
#20260926_kpopmodder: Compact new focus descriptions for the fixed-height UI; preserve gameplay and non-focus localisation.
#20260926_kpopmodder: Restore fictional class-conscious and hardline planning voices while preserving all gameplay rules.
#20260925_kpopmodder: Rewrite focus, decision and event prose with grounded voices; preserve keys, gameplay rules and paired Korean text.
 #20260922_kpopmodder: Include technical extension and planning administration in the independently unlocked shared category.
 #20260922_kpopmodder: Describe the communist governance follow-up, preserved policy benefits, and bounded paid programs.
 HOK_KOR_yeo_worker_peasant_congress:0 "Workers' and Peasants' Consultative Congress"
 HOK_KOR_yeo_worker_peasant_congress_desc:0 "Workers speak of bread prices; peasants speak of grain prices. Even beneath the red flag, their circumstances differ. Workers' and peasants' representatives will sit down together to agree on how they will live alongside one another."
 HOK_KOR_yeo_workplace_arbitration:0 "Industrial Disputes Mediation Committee"
 HOK_KOR_yeo_workplace_arbitration_desc:0 "\"Where is the workers' share in that practice?\"\nA mediation committee will scrutinise promises made in the workplace and whether they are kept. A signed agreement cannot be left standing outside the factory gates."
 HOK_KOR_yeo_local_councils:0 "Regular Local Councils"
 HOK_KOR_yeo_local_councils_desc:0 "\"It is our country's meeting. Why are we waiting outside?\"\nLocal councils will meet regularly, with improved communications. Unlocks projects to implement labour agreements and establish local welfare compacts."
 HOK_KOR_yeo_social_compact:0 "An Established Workers' and Peasants' Compact"
 HOK_KOR_yeo_social_compact_desc:0 "\"Even if we argue tomorrow, let us remember the hands we shook today.\"\nThe promises of workers and peasants will become permanent standards. The Workers' and Peasants' Compact advances to tier II, while existing cooperative policies remain in place."
 HOK_KOR_pak_national_asset_survey:0 "Survey State-Owned Assets"
 HOK_KOR_pak_national_asset_survey_desc:0 "\"If the equipment belongs to the people, why is no one responsible for it?\"\nFactory surveys of machinery and processes will bring broken and idle equipment out of the dust and into production planning and industrial research."
 HOK_KOR_pak_annual_output_targets:0 "Annual Production Plan"
 HOK_KOR_pak_annual_output_targets_desc:0 "\"What if we fall short?\" \"That is why you should begin by listing what you need.\"\nBeneath each target we will record equipment, skills and those responsible. Factories and planning agencies will coordinate their annual results."
 HOK_KOR_pak_material_balance:0 "Materials Balance Sheet"
 HOK_KOR_pak_material_balance_desc:0 "\"Does the people's steel bear the factory manager's surname?\"\nStocks of raw materials and stalled processes will be entered on one balance sheet to inform allocation and industrial research."
 HOK_KOR_pak_capacity_reviews:0 "Regular Production Capacity Reviews"
 HOK_KOR_pak_capacity_reviews_desc:0 "\"Even penal units will not accept blank entries, comrade.\"\nWe will compare production capacity with reports. Unlocks materials reallocation and support for changes to the production plan."
 HOK_KOR_pak_integrated_output_plan:0 "Coordinate the National Production Plan"
 HOK_KOR_pak_integrated_output_plan_desc:0 "\"I will not accept an explanation that everyone succeeded while the whole failed.\"\nCoordinating the national plan will retain the efficiency growth benefit and raise the efficiency cap. Existing production policies remain in place as well."
 HOK_KOR_yeo_social_compact_1:0 "Workers' and Peasants' Compact I"
 HOK_KOR_yeo_social_compact_1_desc:0 "We have founded a country of workers and peasants. That has not, by itself, reconciled workers' desire for a low cost of living with peasants' desire for a good price for their harvest. Standing consultations between their representatives allow each to hear the other's circumstances and agree on promises they will both keep. Standing beneath the same flag is a reason to begin a conversation, not to end it.\n\nRemoved if the government ceases to be communist."
 HOK_KOR_yeo_social_compact_2:0 "Workers' and Peasants' Compact II"
 HOK_KOR_yeo_social_compact_2_desc:0 "A photograph of workers and peasants clasping hands makes excellent propaganda. We need promises that are still kept the day after the photograph. Local councils and mediation committees continue to check that agreements are honoured and establish permanent standards for the next dispute. Because we believe in solidarity, everyone must be able to ask whether the other side has kept its word.\n\nReplaces tier I in the same series. Removed if the government ceases to be communist."
 HOK_KOR_pak_output_plan_1:0 "National Production Plan I"
 HOK_KOR_pak_output_plan_1_desc:0 "The people's productive power has a great future. The planning agencies have set targets worthy of that future, and the workplace has been given the task of getting used to them. Resolve can be commanded, but skill cannot be sent down in a dispatch. Operating results and practical experience inform the plan, reducing waste in repetitive work and building production efficiency.\n\nRemoved if the government ceases to be communist."
 HOK_KOR_pak_output_plan_2:0 "National Production Plan II"
 HOK_KOR_pak_output_plan_2_desc:0 "Even if one factory makes great progress, the nation's progress is delayed while its neighbour waits for raw materials. Our plan cannot stop at praising individual achievements. Materials balances and production capacity reviews are brought together so that accumulated skills can support a higher level of output. The whole of the people's industry must move forward.\n\nRetains the efficiency growth benefit and raises the efficiency cap. Replaces tier I in the same series. Removed if the government ceases to be communist."
 HOK_KOR_communist_governance_programs:0 "Communist Domestic Administration Projects"
 HOK_KOR_communist_governance_programs_desc:0 "\"Let us not send slogans to the workplace ahead of everything else.\"\nAgreements made and plans drawn up in the people's name must not leave those same people waiting. Representatives must check that promises are kept, planning agencies must examine stalled production, and technicians must answer questions from the workplace. We can explain how excellent our institutions are after that work is done. Each project requires completion of its corresponding focus; seeing this category does not mean every project is unlocked.\n\nEach project costs 150 Political Power and occupies no civilian factories. Effects begin immediately and last 90 days, with only one project allowed at a time. All domestic administration projects share a 90-day waiting period after completion or cancellation. One economic policy project and one domestic administration project can run simultaneously; the two categories have separate waiting periods."
 HOK_KOR_communist_governance_no_active_program_tt:0 "No other communist domestic administration project is in progress"
 HOK_KOR_communist_governance_cooldown_finished_tt:0 "90 days have passed since the previous communist domestic administration project ended or was cancelled"
 HOK_KOR_communist_governance_program_start_tt:0 "Costs §Y150§! Political Power and occupies no civilian factories. Effects last §Y90 days§!.\nOnly one domestic administration project may run at a time. After completion or cancellation, this entire category is unavailable for §Y90 days§!.\nCancelled upon loss of communist government or the required political path, capitulation or civil war. Costs are not refunded. Its limit on simultaneous projects and waiting period are separate from those for communist economic policy projects."
 HOK_KOR_communist_governance_program_end_tt:0 "Domestic administration project effects end. All domestic administration projects are unavailable for §Y90 days§!. Costs are not refunded. Communist economic policy projects are unaffected."
 HOK_KOR_yeo_labor_compact_project:0 "Implement Labour Agreements"
 HOK_KOR_yeo_labor_compact_project_desc:0 "\"We have signed. Is that it?\" \"Now it is our turn.\"\nIn a country where workers are the owners, their signatures must carry weight inside the workplace too. Representatives will check compliance with agreements, mediate disputes and coordinate work schedules, laying the foundations for continued military production. Let us not give the name of revolution to excuses for breaking promises.\n\nCosts 150 Political Power. Effects begin immediately and last 90 days. Occupies no civilian factories. Only one domestic administration project may run at a time; the entire category shares a 90-day waiting period after completion or cancellation. One can run alongside one communist economic policy project. Cancelled upon loss of communist government or the conditions that unlocked it, capitulation or civil war. Costs are not refunded."
 HOK_KOR_yeo_community_welfare_project:0 "Local Welfare Compact"
 HOK_KOR_yeo_community_welfare_project_desc:0 "\"You call it a country of workers and peasants. Have you no time to let them speak?\"\nHaving announced construction for everyone's benefit, we assumed the residents would naturally be pleased. Perhaps we ought to ask the villagers who 'everyone' includes. Local councils will coordinate residents' requests with the sequence of work, carrying agreement into the construction site. Let us make time in our project schedules to hear the workers and peasants too.\n\nCosts 150 Political Power. Effects begin immediately and last 90 days. Occupies no civilian factories. Only one domestic administration project may run at a time; the entire category shares a 90-day waiting period after completion or cancellation. One can run alongside one communist economic policy project. Cancelled upon loss of communist government or the conditions that unlocked it, capitulation or civil war. Costs are not refunded."
 HOK_KOR_pak_material_reallocation_project:0 "Reallocate Materials"
 HOK_KOR_pak_material_reallocation_project_desc:0 "\"Your warehouse is well stocked, comrade. Is the people's plan as well supplied?\"\nAll our factories are the people's property. Surely there is no reason for one warehouse to boast of abundance while another production line waits for raw materials. Factory requests will be checked against warehouse records, giving priority to processes facing shortages. Let the achievement of the national plan be measured in production saved from shortages, not raw materials piled up.\n\nDoes not produce resources or grant stockpiled goods. Costs 150 Political Power. Effects begin immediately and last 90 days. Occupies no civilian factories. Only one domestic administration project may run at a time; the entire category shares a 90-day waiting period after completion or cancellation. One can run alongside one communist economic policy project. Cancelled upon loss of communist government or the conditions that unlocked it, capitulation or civil war. Costs are not refunded."
 HOK_KOR_pak_production_retooling_project:0 "Support Changes to the Production Plan"
 HOK_KOR_pak_production_retooling_project_desc:0 "\"We have raised the production targets. Your hands must work faster too.\" \"Then we must first learn the sequence of work.\"\nOur production plan demands higher results. Alongside encouraging slogans, the workplace must receive a way to become accustomed to meeting them. We will improve tool layouts and work sequences, reducing waste in repetitive tasks to support production efficiency growth. If we demand better work from the same hands, we must first give those hands a chance to learn.\n\nCosts 150 Political Power. Effects begin immediately and last 90 days. Occupies no civilian factories. Only one domestic administration project may run at a time; the entire category shares a 90-day waiting period after completion or cancellation. One can run alongside one communist economic policy project. Cancelled upon loss of communist government or the conditions that unlocked it, capitulation or civil war. Costs are not refunded."
