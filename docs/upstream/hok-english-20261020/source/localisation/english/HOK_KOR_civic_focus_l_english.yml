l_english:
#20261011_kpopmodder: Add Korean corporate and civic focus prose while preserving existing localisation keys.
 HOK_KOR_civic_industrial_compact:0 "Industrial and Social Compact"
 HOK_KOR_civic_industrial_compact_desc:0 "Factories and banks, trade unions and civic groups are asking what course the nation will take. We can rely on corporate investment, break up monopolies or bring industry into public ownership. We shall decide on an industrial and social compact, weighing each group's influence and the price of procurement."
 HOK_KOR_civic_chaebol_cooperation:0 "Industrial Cooperation with the Chaebol"
 HOK_KOR_civic_chaebol_cooperation_desc:0 "Building new facilities requires money, technology and supply networks to be brought together. We shall link investment by the chaebol business conglomerates to the national production plan. The immediate increase in output is tempting, but the preferential treatment and concealment surrounding these contracts will also become our burden."
 HOK_KOR_civic_nationalization:0 "Bring the Chaebol into Public Ownership"
 HOK_KOR_civic_nationalization_desc:0 "We shall transfer factories and contracts into public ownership. Keeping the machinery running means retaining technicians and trading networks before taking down the old company signs. Existing procurement corruption and institutional collusion will not disappear with a single change of title."
 HOK_KOR_civic_break_monopolies:0 "Break Up Monopolies and Pursue Civic Reform"
 HOK_KOR_civic_break_monopolies_desc:0 "There is no reason to reserve state orders for a handful of companies. We shall break up monopolies and give workers and citizens a role in production and oversight. In return for bearing the cost to people's livelihoods, we shall build skills and trust, while preparing for pressure from institutions opposed to reform."
 HOK_KOR_civic_sunkyong_investment:0 "Sunkyong Materials and Plant Investment"
 HOK_KOR_civic_sunkyong_investment_desc:0 "More machinery is of no use if the supply of raw materials fails. We shall support Sunkyong's raw materials trade and investment in production processes, broadening our industrial base and introducing new industrial technologies."
 HOK_KOR_civic_samsung_electronics:0 "Invest in Samsung Electronics Technology"
 HOK_KOR_civic_samsung_electronics_desc:0 "A single component in a measuring instrument or a piece of communications equipment can hold up an entire factory or military schedule. We shall support Samsung Electronics' research into electronics and link plans for developing domestic components to the state's needs."
 HOK_KOR_civic_goldstar_mass_production:0 "GoldStar Mass Production Facilities"
 HOK_KOR_civic_goldstar_mass_production_desc:0 "A good prototype alone cannot fill an order book. We shall add new facilities to GoldStar's experience in mass production, ensuring a steady flow of components and finished military supplies."
 HOK_KOR_civic_labor_compact:0 "Labour and Production Compact"
 HOK_KOR_civic_labor_compact_desc:0 "Every new production line disperses skilled workers and brings different working standards. Trade unions and workplaces shall agree together on changes to production processes, training and safety, carrying the workforce's experience over to the new facilities."
 HOK_KOR_civic_mass_conscription:0 "Reorganise Universal Military Service"
 HOK_KOR_civic_mass_conscription_desc:0 "The duty to defend the country cannot be assessed differently according to family or occupation. We shall put military service registers and reserve training in order, turning a fair system of universal military service into effective mobilisation."
 HOK_KOR_civic_public_accountability:0 "Public Accountability and Fair Appointments"
 HOK_KOR_civic_public_accountability_desc:0 "Procurement documents and personnel records must not remain locked in the safes of particular institutions. Public oversight shall establish who is responsible, and new commanders shall be chosen for their judgement in the field and their logistical ability, rather than their connections."
 HOK_KOR_civic_social_settlement:0 "Consolidate Civic Reform"
 HOK_KOR_civic_social_settlement_desc:0 "Reform will not last if workplace agreements, fair military service and public accountability operate in isolation. We shall link these established institutions to industrial research and the running of the state, making them the foundation of the next production plan."
 HOK_KOR_civic_public_procurement:0 "Public Contracts and Technical Continuity"
 HOK_KOR_civic_public_procurement_desc:0 "A change of ownership is no reason to discard the workforce's expertise or its supply contracts. Public procurement shall retain skilled workers, design documentation and existing supply chains, keeping facilities running and research moving forward."
 HOK_KOR_civic_procurement_inspections:0 "Procurement Inspection System"
 HOK_KOR_civic_procurement_inspections_desc:0 "Demands for earlier aircraft and rocket deliveries are pouring into the test facilities. We shall bring contracts and inspections into a single system and establish who has the authority to fast-track contracts. We must weigh the time saved by cutting tests against the subsequent cost of accidents and corruption."
