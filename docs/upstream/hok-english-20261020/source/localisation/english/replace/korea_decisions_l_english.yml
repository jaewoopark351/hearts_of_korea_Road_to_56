l_english:
 KOR_triumph_for_the_manchuria_category:0 "Integrating Manchuria"
 KOR_triumph_for_the_manchuria_category_desc:0 "Until the fall of Goguryeo and Balhae, Manchuria was part of our homeland. Under those states, the Manchurian peoples were equal members of the realm alongside our own. Now that Manchuria is ours, Korea and Manchuria shall be one again!"
 kor_triumph_for_the_manchuria:0 "A Triumph for Manchuria"
 kor_triumph_for_the_manchuria_desc:0 "Manchuria is under our control. A glorious triumph must mark its reintegration into the empire!"
 rename_manchuria:0 "Rename Manchurian Places"
 rename_manchuria_desc:0 "Now that Manchuria is entirely ours, its existing place names will be replaced with Korean ones."
 KOR_jaebeol_category:0 "Chaebol"
 KOR_jaebeol_category_desc:0 "Chaebol are family-controlled business conglomerates whose senior management is drawn from the same extended family. They wield enormous influence over this country's economy. By granting them favourable treatment, we can secure their help in developing it."
 KOR_order_to_samsung:0 "Issue Orders to Samsung"
 KOR_order_to_hyundai:0 "Issue Orders to Hyundai"
 KOR_order_to_sk:0 "Issue Orders to Sunkyong"
 KOR_decision_CNDP_category:0 "Comprehensive National Development Plan"
 KOR_decision_CNDP_category_desc:0 "The Comprehensive National Development Plan aims to develop and urbanise the Korean peninsula, which still lags behind the countries of Europe. Through this plan, we can extend urbanisation and development across the peninsula."
 KOR_develop_jeolla:0 "Develop Jeolla"
 KOR_develop_gyeongsang:0 "Develop Gyeongsang"
 KOR_develop_chungcheong:0 "Develop Chungcheong"
 KOR_develop_hwanghae:0 "Develop Hwanghae"
 KOR_develop_pyeongan:0 "Develop Pyeongan"
 KOR_develop_gangwon:0 "Develop Gangwon"
 KOR_develop_hamgyeong:0 "Develop Hamgyeong"
 KOR_defeat_japan:0 "Expel the Japanese Colonialists from Manchuria"
 KOR_defeat_japan_category:0 "Second Korean-Japanese War"
 KOR_defeat_japan_desc:0 "With Manchuria entirely under our control, Japan faces the loss of its bridgehead for invading the continent. Our own forces, however, cannot attack the Japanese home islands. It is time to consider offering Japan a peace settlement that recognises the situation on the ground."
 KOR_liberation_of_asia_category:0 "Liberation of Asia"
