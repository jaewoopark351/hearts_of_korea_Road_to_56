 KOR_vision_1950_step_1:0 "Vision 1950, Phase I: A Regional Navy"
 KOR_vision_1950_step_2:0 "Vision 1950, Phase II: An Ocean-Going Navy"
 KOR_vision_1950_step_3:0 "Vision 1950, Phase III: A Global Navy"
 KOR_integrate_japanese_fleet_category:0 "Absorb the Japanese Navy"
 KOR_absorb_the_japanese_fleet:0 "Requisition the Japanese Fleet"
 KOR_recommissioning_hiei:0 "Recommission Hiei"
 KOR_fall_of_the_sun_category:0 "Fall of the Sun"
 KOR_establish_protectorate_states_of_japan:0 "Establish a Japanese Protectorate"
 KOR_China_national_reconstruction_category:0 "Democratising China"
 KOR_China_national_reconstruction_category_desc:0 "Our crusade to bring the fruits of freedom and democracy to all of China is nearing its end. Now that we control China's central government, the Chinese people must be freed from brutal warlords and military dictators and united under a single democratic government."
 KOR_New_China_Government:0 "Recognise the Democratic Republic of Shandong as the Sole Chinese State"
 KOR_soyanggangdam_category:0 "Soyanggang Dam Floodgate Control"
 KOR_soyanggangdam_category_desc:0 "The completed Soyanggang Dam is the largest dam in East Asia. Its vast reservoir is a tremendous asset for agriculture, hydroelectric power and the water supply. It also holds more than enough water to flood the entire capital region. Opening the floodgates fully would cause terrible devastation, but could also provide an effective means of defending the capital..."
 KOR_inundate_the_water_lines:0 "Fully Open the Soyanggang Dam Floodgates"
 KOR_drain_the_water_lines:0 "Restore Normal Operation of the Soyanggang Dam Floodgates"
 KOR_decision_greater_hwan_category:0 "Proclaim the Greater Hwan Empire"
 KOR_decision_greater_hwan_category_desc:0 "Our Hwan Empire is now more powerful than any other country in the world and a worthy successor to the ancient Hwan Empire. To commemorate this achievement, we shall proclaim our country's official name to be the Greater Hwan Empire."
 kor_rise_of_greater_hwan:0 "Proclaim the Greater Hwan Empire"
 JAP_war_on_korea_category:0 "Attack Korea"
 jap_attack_Rhee_korea:0 "Advance into the Korean Peninsula"
 jap_attack_Rhee_korea_desc:0 "The Republic of Korea's current president, Syngman Rhee, is staunchly pro-Western and hostile towards us. Even if Korea declares its neutrality, we must disregard it and crush the country without hesitation!"
 KOR_macarthur_go_home:0 "Send MacArthur Home to America"
 KOR_macarthur_go_home_desc:0 "Thanks to General MacArthur's efforts, our armed forces are now strong enough to stand on their own. America needs him more than Korea does. We shall send him home."
 KOR_decision_expend_federation_of_balhae_category:0 "Expand the Federation of Balhae"
 KOR_decision_expend_federation_of_balhae_category_desc:0 "Like the Balhae of old, the Federation of Balhae is a multi-ethnic state in which Koreans merely take the lead. In a spirit of inclusion, we can seek to incorporate regions with historical ties to us by recognising their inhabitants as equal citizens of the federation and guaranteeing them all the rights of citizenship, including full political rights."
 KOR_admission_vladivostok_to_the_federation:0 "Admit Vladivostok to the Federation of Balhae"
 KOR_admission_khabarovsk_to_the_federation:0 "Admit Khabarovsk to the Federation of Balhae"
