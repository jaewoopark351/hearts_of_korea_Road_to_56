l_english:
 LOADING_TIP_91:0 "Remember that there is no sorrow greater than having no country. I earnestly hope you will guard our homeland well, so that it is never taken from us again.\n- Son Won-il"
 LOADING_TIP_92:0 "We must hold Seoul. If we lose this city, our country will cease to exist. Just three days. For our homeland, find the strength to hold on for three more days.\n- Kim Hong-il"
 LOADING_TIP_93:0 "If I can work for my country, I could ask for nothing more. When I die, dress me in our air force uniform.\n- Choi Yong-duk"
 LOADING_TIP_94:0 "The armed forces await the president's orders. Give us the word, and we can have lunch in Xinjing and dinner in Harbin.\n- Shin Sung-mo, after the outbreak of the Second Korean-Japanese War"
 LOADING_TIP_95:0 "Loyalty, honour, unity. A shield in life, loyal unto death. Defend Seoul at all costs!\n- Motto of the Republic of Korea Army's Capital Defence Command"
 LOADING_TIP_96:0 "The more crudely you speak, the cruder you become; the more obscenely you speak, the more obscene you become; the more savagely you speak, the more savage you become.\n- Kim Gu"
 LOADING_TIP_97:0 "I shall teach them how to break strikes, too. And the history of the Hitler Youth, of course.\n- Lee Beom-seok"
 LOADING_TIP_98:0 "There is no stopping justice. My men acted rightly. What on earth am I supposed to reprimand them for?\n- Kim Seok-won, to Ryu Dong-yeol after he criticised Kim's men"
 LOADING_TIP_99:0 "Platoon, attention! Take up your reins and carbines! The cavalry is always loyal to the country and its people. I am truly sorry it has come to this. We shall meet again at the national cemetery!\n- Second Lieutenant Jang Cheol-bu, 27 June 1939"
 LOADING_TIP_100:0 "...Therefore, with immediate effect, Korea suspends ratification of the Third Geneva Convention. All commanders and leaders at squad level and above are to disregard enemy offers of surrender.\n- Republic of Korea Army Headquarters, General Order No. 41-44"
 LOADING_TIP_101:0 "For the prosperity and glory of the empire, that peninsula, pointed like a blade at our sacred homeland, must be subjugated in the name of Greater East Asian Co-Prosperity.\n- Hideki Tojo, on the Republic of Korea"
 LOADING_TIP_102:0 "If sacrificing my life could save all my men, I would do it.\n- Tomoyuki Yamashita"
 LOADING_TIP_103:0 "If we could set aside the narrow-minded hatred of others merely for holding opinions different from our own, there would be peace in the world.\n- Ahn Chang-ho"
 LOADING_TIP_104:0 "Is that not simply throwing away our troops for nothing?\n- Prince Akihito, 19 February 1943"
 LOADING_TIP_105:0 "Here rests the spirit of our people, and those who journey with our homeland for all eternity. The sun and moon shall guard this hill for ever.\n- Monument to Veterans of the Second Korean-Japanese War, Pyongyang National Cemetery"
 LOADING_TIP_106:0 "It wasn't my fault!\n- Renya Mutaguchi, under interrogation by a Korean intelligence officer"
