l_english:
#20261031_kpopmodder: Name Korean MIO specializations and explain separate trait purchase after focus availability.
 HOK_KOR_mio_trait_daewoo_standardized_parts:0 "Interchangeable Parts System"
 HOK_KOR_mio_trait_daewoo_standardized_parts_desc:0 "Standardise chassis and drivetrain components to simplify assembly and make replacement parts more reliable in the field."
 HOK_KOR_mio_trait_rotem_reinforced_armor:0 "Heavy Tank Armour Joints"
 HOK_KOR_mio_trait_rotem_reinforced_armor_desc:0 "Design the joints between thick armour plates together with their structural supports to improve heavy tank protection."
 HOK_KOR_mio_trait_rygyeong_infantry_breakthrough:0 "Infantry Covering Fire Design"
 HOK_KOR_mio_trait_rygyeong_infantry_breakthrough_desc:0 "Improve gun placement and observation equipment on infantry support tanks to help them break through defensive positions."
 HOK_KOR_mio_trait_doosan_mobile_powertrain:0 "Mobile Warfare Powertrain"
 HOK_KOR_mio_trait_doosan_mobile_powertrain_desc:0 "Improve the transfer of power through engines and transmissions so that vehicles can maintain their speed during mobile warfare."
 HOK_KOR_mio_trait_kai_agile_airframes:0 "Agile Domestic Airframes"
 HOK_KOR_mio_trait_kai_agile_airframes_desc:0 "Establish domestic fighter design standards that consider both handling response and turning performance."
 HOK_KOR_mio_trait_hanjin_long_range_navigation:0 "Long-Range Navigation Standards"
 HOK_KOR_mio_trait_hanjin_long_range_navigation_desc:0 "Standardise navigation equipment and fuel allocation for long-distance flights to extend operational range."
 HOK_KOR_mio_trait_jinhae_torpedo_sights:0 "Naval Torpedo Sights"
 HOK_KOR_mio_trait_jinhae_torpedo_sights_desc:0 "Use naval air arm release data to improve torpedo bomber accuracy and striking power."
 HOK_KOR_mio_trait_daewoo_heavy_gun_mounts:0 "Heavy Gun Turret Supports"
 HOK_KOR_mio_trait_daewoo_heavy_gun_mounts_desc:0 "Reinforce the supporting structures and ammunition feeds of heavy main guns to improve capital ship firepower."
 HOK_KOR_mio_trait_hyundai_carrier_assembly:0 "Modular Carrier Construction"
 HOK_KOR_mio_trait_hyundai_carrier_assembly_desc:0 "Pre-assemble flight deck and hangar sections to reduce aircraft carrier construction costs."
 HOK_KOR_mio_trait_daehan_escort_sonar:0 "Escort Sonar System"
 HOK_KOR_mio_trait_daehan_escort_sonar_desc:0 "Design escort sonar equipment and depth charge coverage together to find and attack submarines."
 HOK_KOR_mio_trait_gms_torpedo_fire_control:0 "Raider Torpedo Fire Control"
 HOK_KOR_mio_trait_gms_torpedo_fire_control_desc:0 "Improve fire control systems so that torpedo firing solutions can be calculated quickly during both long-range cruising and high-speed raids."
 HOK_KOR_mio_trait_gukgun_rifle_tooling:0 "Precision Rifle Tooling"
 HOK_KOR_mio_trait_gukgun_rifle_tooling_desc:0 "Improve barrel and action machining standards to increase infantry sustained firepower."
 HOK_KOR_mio_trait_hanhwa_artillery_ammunition:0 "Consistent Artillery Ammunition"
 HOK_KOR_mio_trait_hanhwa_artillery_ammunition_desc:0 "Reduce manufacturing variation in shells and propellant charges to improve effective field artillery firepower."
 HOK_KOR_mio_trait_kia_economical_drivetrain:0 "Economical Transport Drivetrain"
 HOK_KOR_mio_trait_kia_economical_drivetrain_desc:0 "Adjust transport drivetrains and engine settings to reduce the fuel needed for each supply mission."
 HOK_KOR_mio_trait_mmaa_support_standardization:0 "Common Support Equipment Standards"
 HOK_KOR_mio_trait_mmaa_support_standardization_desc:0 "Unify common components and procurement standards for support equipment to reduce production costs."
 HOK_KOR_mio_specialization_purchase_tt:0 "This military industrial organisation trait becomes available for selection. Once its prerequisite traits have been acquired, it must be purchased separately using the organisation's trait points."
