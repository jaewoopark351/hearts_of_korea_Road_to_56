#20261031_kpopmodder: Explain conditional research-facility placement and independent one-time named-scientist training.
 HOK_KOR_land_research_network_tt:0 "§Y육군 실험시설§!을 보유하지 않았다면 §Y$STATE_525$§!을 우선하여 완전히 통제하는 소유 핵심 주에 시설 §Y1개§!를 건설합니다. 다른 실험시설이 있는 주에는 건설하지 않으며, 건설 가능한 주가 없으면 시설을 추가하지 않습니다.\n시설 지급 여부와 별개로, §Y$KOR_yonggwan_kim$§!이 우리나라에 있다면 육군 전문화 수준이 §G1§! 증가합니다. 이 과학자 성장 보상은 한 번만 지급됩니다."
