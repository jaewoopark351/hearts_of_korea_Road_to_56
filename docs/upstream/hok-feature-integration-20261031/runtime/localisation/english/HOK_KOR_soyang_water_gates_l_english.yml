l_english:
 #20261031_kpopmodder: Complete the inherited Soyang decisions with precise costs, bounded flooding and lifecycle cleanup.
 KOR_inundate_the_water_lines_desc:0 "Opening the floodgates can obstruct the Han River corridor and slow an advance on the capital. The water will not distinguish between enemy troops, our own soldiers and the people living downstream. Turning Seoul and Chuncheon into defensive barriers also means accepting damage to roads and factories.\n\nSpend 25 political power and prepare for 14 days. Flooding affects only the Seoul and Chuncheon provinces; building damage applies separately to the Gyeonggi and Gangwon states. Preparation is cancelled without a refund if the war ends or ownership, control or dam requirements are lost. The same conditions automatically end active flooding."
 KOR_drain_the_water_lines_desc:0 "The water must recede before roads and factory entrances can be used again. We will end the emergency release and return the floodgates to normal operation.\n\nSpend 25 political power to remove this operation's flooding from Seoul and Chuncheon after 14 days. Existing factory and infrastructure damage must be repaired separately. If the war ends or ownership, control or dam requirements are lost, flooding ends automatically without a refund."
 HOK_KOR_soyang_flooded:0 "Soyang Emergency Release"
 HOK_KOR_soyang_flooded_desc:0 "An emergency release from Soyang Dam has disrupted movement and supply along the Han River. Ending the release removes its flooding effect; damaged facilities still require repairs."
 HOK_KOR_soyang_opening_started_tt:0 "Prepare the floodgates for 14 days. The emergency release will then affect Seoul and Chuncheon."
 HOK_KOR_soyang_flood_effect_tt:0 "Apply §YSoyang Emergency Release§! only to the §YSeoul and Chuncheon§! provinces: defense §G+50%§!, movement speed §R-50%§!, entrenchment speed §R-20%§! and supply §R-40%§!, with increased organization loss while moving and truck attrition.\nIn each of the §YGyeonggi and Gangwon§! states, damage §R1 level§! of infrastructure and §R0.5 levels each§! of civilian and military factories. Every subsequent opening causes the same damage again."
 HOK_KOR_soyang_draining_started_tt:0 "Normalize the floodgates over 14 days. The emergency release remains active until work finishes."
 HOK_KOR_soyang_normalized_tt:0 "Remove only this operation's emergency-release effect from Seoul and Chuncheon. Existing building damage and flooding from other causes remain."
 HOK_KOR_soyang_cancelled_tt:0 "Cancel the floodgate operation and remove only its emergency-release effect. Political power already spent is not refunded."
