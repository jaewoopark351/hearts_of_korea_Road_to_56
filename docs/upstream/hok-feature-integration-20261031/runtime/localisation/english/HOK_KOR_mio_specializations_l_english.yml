l_english:
#20261031_kpopmodder: Name Korean MIO specializations and explain separate trait purchase after focus availability.
 HOK_KOR_mio_trait_daewoo_standardized_parts:0 "호환 부품 체계"
 HOK_KOR_mio_trait_daewoo_standardized_parts_desc:0 "차대와 구동계의 부품 규격을 통일하여 조립 공정을 줄이고 야전 교환 부품의 신뢰성을 높입니다."
 HOK_KOR_mio_trait_rotem_reinforced_armor:0 "중전차 장갑 접합"
 HOK_KOR_mio_trait_rotem_reinforced_armor_desc:0 "두꺼운 장갑판의 접합부와 구조재를 함께 설계하여 중전차의 방호력을 높입니다."
 HOK_KOR_mio_trait_rygyeong_infantry_breakthrough:0 "보병 엄호 사격설계"
 HOK_KOR_mio_trait_rygyeong_infantry_breakthrough_desc:0 "보병과 함께 전진하는 전차의 포 배치와 관측 장비를 개량하여 방어진지를 돌파하도록 합니다."
 HOK_KOR_mio_trait_doosan_mobile_powertrain:0 "기동전용 동력계"
 HOK_KOR_mio_trait_doosan_mobile_powertrain_desc:0 "기동전에서 속도를 유지할 수 있도록 변속기와 엔진의 동력 전달을 개선합니다."
 HOK_KOR_mio_trait_kai_agile_airframes:0 "기민한 국산 기체"
 HOK_KOR_mio_trait_kai_agile_airframes_desc:0 "조종 반응과 선회 성능을 함께 검토하는 국산 전투기 설계 기준을 마련합니다."
 HOK_KOR_mio_trait_hanjin_long_range_navigation:0 "장거리 항법 표준"
 HOK_KOR_mio_trait_hanjin_long_range_navigation_desc:0 "장거리 비행의 항법 장비와 연료 배분을 표준화하여 임무 반경을 넓힙니다."
 HOK_KOR_mio_trait_jinhae_torpedo_sights:0 "해상 뇌격 조준기"
 HOK_KOR_mio_trait_jinhae_torpedo_sights_desc:0 "해군 항공대의 투하 자료를 설계에 반영하여 뇌격기의 명중률과 공격력을 높입니다."
 HOK_KOR_mio_trait_daewoo_heavy_gun_mounts:0 "대구경 포탑 지지대"
 HOK_KOR_mio_trait_daewoo_heavy_gun_mounts_desc:0 "대구경 주포의 지지 구조와 급탄 장치를 보강하여 주력함의 화력을 높입니다."
 HOK_KOR_mio_trait_hyundai_carrier_assembly:0 "항공모함 블록 건조"
 HOK_KOR_mio_trait_hyundai_carrier_assembly_desc:0 "비행갑판과 격납고 구획을 사전에 조립하여 항공모함의 건조 비용을 줄입니다."
 HOK_KOR_mio_trait_daehan_escort_sonar:0 "호위함 수중탐지 체계"
 HOK_KOR_mio_trait_daehan_escort_sonar_desc:0 "호위함의 수중탐지 장비와 폭뢰 운용 구역을 함께 설계하여 잠수함을 찾아 공격합니다."
 HOK_KOR_mio_trait_gms_torpedo_fire_control:0 "습격함 어뢰 사격통제"
 HOK_KOR_mio_trait_gms_torpedo_fire_control_desc:0 "장거리 순항과 고속 습격 양쪽에서 어뢰 발사 자료를 신속히 계산하도록 사격통제 체계를 정비합니다."
 HOK_KOR_mio_trait_gukgun_rifle_tooling:0 "소총 정밀 가공"
 HOK_KOR_mio_trait_gukgun_rifle_tooling_desc:0 "총열과 작동부의 가공 기준을 개선하여 보병의 지속 사격 능력을 높입니다."
 HOK_KOR_mio_trait_hanhwa_artillery_ammunition:0 "포병 탄약 일관성"
 HOK_KOR_mio_trait_hanhwa_artillery_ammunition_desc:0 "포탄과 장약의 제조 편차를 줄여 야전 포병의 유효 화력을 높입니다."
 HOK_KOR_mio_trait_kia_economical_drivetrain:0 "경제적인 수송 구동계"
 HOK_KOR_mio_trait_kia_economical_drivetrain_desc:0 "수송 차량의 구동계와 엔진 설정을 조정하여 같은 보급 임무에 드는 연료를 줄입니다."
 HOK_KOR_mio_trait_mmaa_support_standardization:0 "지원장비 공동규격"
 HOK_KOR_mio_trait_mmaa_support_standardization_desc:0 "지원장비의 공통 부품과 조달 규격을 묶어 생산 비용을 낮춥니다."
 HOK_KOR_mio_specialization_purchase_tt:0 "이 군수산업조직 특성은 선택 가능해지며, 선행 특성을 갖춘 뒤 조직의 특성 포인트를 사용하여 별도로 선택해야 합니다."
