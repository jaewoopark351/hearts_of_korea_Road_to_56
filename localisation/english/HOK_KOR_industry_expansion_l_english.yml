#20261003_kpopmodder: Clarify Gyeongsang coastal-state wording without changing construction requirements.
#20261003_kpopmodder: Explain new decision and spirit policies through concrete circumstances; preserve gameplay and lifecycle rules.
#20260926_kpopmodder: Use escaped ASCII dialogue quotes and compact decision UI text; preserve gameplay and explicit lifecycle warnings.
#20260926_kpopmodder: Compact new focus descriptions for the fixed-height UI; preserve gameplay and non-focus localisation.
#20260925_kpopmodder: Rewrite focus, decision and event prose with grounded voices; preserve keys, gameplay rules and paired Korean text.
#20260923_kpopmodder: 요청한 반복 디시전 7종의 민간공장 비용을 제거하고 정치력 150 비용에 맞춰 설명을 동기화합니다.
#20260921_kpopmodder: 승인된 보상 강화에 맞춰 최종 교체값·영구 효과·반복 사업 조건과 협정 설명을 두 언어 채널에 동기화합니다.
#20260921_kpopmodder: 현재 산업 국민정신 수치에 중점·국민정신 설명과 통합 생산계획 툴팁을 맞추고 단계 교체를 명시합니다.
#20260921_kpopmodder: 바닐라 산업·교육·투자 구조를 한국의 기존 기관과 연결한 신규 설명을 양쪽 언어 채널에 제공합니다.
 HOK_KOR_link_power_grids:0 "Connect the National Power Grid"
 HOK_KOR_link_power_grids_desc:0 "Power stations have electricity to spare, yet factory machinery stands idle. We shall link regional generation and distribution. An interconnected grid reduces factory energy consumption by 10%."
 HOK_KOR_industrial_power_allocation:0 "Industrial Power Allocation"
 HOK_KOR_industrial_power_allocation_desc:0 "What matters is which factory receives power and when, rather than total generation alone. Distribution shall follow industrial demand. Replaces the previous stage with a 20% reduction in energy consumption; the stages do not stack."
 HOK_KOR_industrial_measurement_standards:0 "Standardise Industrial Measurements"
 HOK_KOR_industrial_measurement_standards_desc:0 "\"The dimensions are the same, so why doesn't it fit?\"\n\"Bring me both factories' rulers.\"\nWe shall standardise measurements and inspection criteria, reducing the waste of machining parts all over again."
 HOK_KOR_factory_safety_inspections:0 "Factory Safety Inspections"
 HOK_KOR_factory_safety_inspections_desc:0 "Restarting the machinery will not restore the life an injured worker had before. Regular safety inspections and training shall change workplaces that are only clean on inspection day."
 HOK_KOR_national_power_coordination:0 "National Power Coordination Commission"
 HOK_KOR_national_power_coordination_desc:0 "Once the power lines are connected, maintenance schedules must be linked too. We shall coordinate electricity supply and demand across the country. Replaces the previous stage with a 30% reduction in energy consumption; the stages do not stack."
 HOK_KOR_technical_colleges:0 "Expand Technical Colleges"
 HOK_KOR_technical_colleges_desc:0 "We need hands that can turn the circuit on the blackboard into working machinery. More practical training at technical colleges will prepare people to use electrical and communications technology in the workplace."
 HOK_KOR_workshop_apprenticeships:0 "Factory Apprenticeships"
 HOK_KOR_workshop_apprenticeships_desc:0 "\"Close the manual and listen to the machine first.\"\nApprenticeships shall pass skilled workers' experience on to new recruits. Grants +30% Production Efficiency Growth."
 HOK_KOR_workers_night_schools:0 "Workers' Night Schools"
 HOK_KOR_workers_night_schools_desc:0 "\"Could you teach me to write my own name first?\"\nWe shall open evening classes. Grants +5 percentage points of Stability and a permanent +10% Research Speed. Separate from rural travelling education."
 HOK_KOR_university_industry_labs:0 "University–Industry Research Laboratories"
 HOK_KOR_university_industry_labs_desc:0 "If something works in the laboratory but not in the factory, both sides need to look at the same machine together. Joint laboratories shall investigate problems encountered in production and test new processes."
 HOK_KOR_skilled_workforce:0 "Skilled Workforce Training System"
 HOK_KOR_skilled_workforce_desc:0 "A new production line need not mean building skills from scratch. We shall link practical training, work experience and retraining. Replaces Factory Apprenticeships with +60% Production Efficiency Growth; the stages do not stack."
 HOK_KOR_production_review:0 "Production Process Survey"
 HOK_KOR_production_review_desc:0 "Before building another factory, we should inspect the accumulated parts and stalled processes. After investigating the bottlenecks, we shall decide whether to concentrate on mass production or prepare for design changes."
 HOK_KOR_standardized_mass_production:0 "Standardised Mass Production"
 HOK_KOR_standardized_mass_production_desc:0 "We shall produce proven designs for longer, accepting the cost of switching products. Production Efficiency Cap +15%; Production Efficiency Retention when switching lines -5%. Mutually exclusive with Flexible Production Lines."
 HOK_KOR_flexible_production_lines:0 "Flexible Production Lines"
 HOK_KOR_flexible_production_lines_desc:0 "We shall carry our experience over when designs change. Production Efficiency Retention when switching lines +20%; Production Efficiency Cap -2.5%. Mutually exclusive with Standardised Mass Production."
 HOK_KOR_production_quality_assurance:0 "Production Quality Assurance"
 HOK_KOR_production_quality_assurance_desc:0 "The delivering factory and the receiving unit shall use the same inspection checklist. Reducing trial and error on new production lines grants +10% Production Efficiency Base."
 HOK_KOR_integrated_production_planning:0 "Integrated Production Planning"
 HOK_KOR_integrated_production_planning_desc:0 "We shall align component and labour supplies with the chosen method.\nMass production: Efficiency Cap +30%, Retention when switching -5%.\nFlexible production: Retention when switching +40%, Efficiency Cap -2.5%.\nReplaces only the chosen policy; does not stack with the previous stage."
 HOK_KOR_regional_industry_fund:0 "Regional Industrial Investment Fund"
 HOK_KOR_regional_industry_fund_desc:0 "When building funds arrive later than the plans, workers and materials disperse. A regional industrial investment fund shall carry subsequent projects from the first spade in the ground to the next stage of construction."
 HOK_KOR_pyeongan_machine_workshops:0 "Develop Pyeongan's Machine Industry"
 HOK_KOR_pyeongan_machine_workshops_desc:0 "We shall put Pyeongan's machining skills to work in arms production. Spending 150 Political Power on the subsequent investment project builds a military factory. No civilian factories are occupied."
 HOK_KOR_gangwon_electrical_workshops:0 "Gangwon Electrical Equipment Industry"
 HOK_KOR_gangwon_electrical_workshops_desc:0 "Where electricity is generated, we should also make the equipment that uses it. We shall prepare Gangwon's electrical equipment industry. Actual construction takes place through a separate investment project."
 HOK_KOR_chungcheong_supplier_network:0 "Chungcheong Component Supply Network"
 HOK_KOR_chungcheong_supplier_network_desc:0 "Even a large factory waits for small components. We shall prepare Chungcheong's component supply network, then build civilian factories through subsequent investment projects to link production across the country."
 HOK_KOR_gyeongsang_export_workshops:0 "Support Gyeongsang's Export Shipbuilding"
 HOK_KOR_gyeongsang_export_workshops_desc:0 "Alongside export cargo, we need ships to carry it. We shall link Gyeongsang's ports and industrial base, then expand construction capacity through subsequent dockyard investment projects."
 HOK_KOR_energy_coordination_1:0 "Interconnected Power Grid"
 HOK_KOR_energy_coordination_1_desc:0 "When power stations plan distribution separately, machinery in one region can stand idle while another has electricity to spare. Linking regional generation and distribution plans ensures factories receive the power they need on time and reduces waste.\n\nFactory Energy Consumption §G-10%§!."
 HOK_KOR_energy_coordination_2:0 "Industrial Power Allocation"
 HOK_KOR_energy_coordination_2_desc:0 "Even after the grids are connected, distribution comes under strain when factories start their machinery at the same time. A system that considers industrial production schedules alongside demand for electricity now coordinates where power is sent and when.\n\nFactory Energy Consumption §G-20%§!. Replaces §YInterconnected Power Grid§!; does not stack with the previous stage."
 HOK_KOR_energy_coordination_3:0 "National Power Coordination Commission"
 HOK_KOR_energy_coordination_3_desc:0 "If maintaining one region's generating equipment means changing the supply plans of its neighbours, individual factory requests are not enough. The National Power Coordination Commission coordinates electricity supply and demand with maintenance schedules across the country, keeping the interconnected grid running reliably.\n\nFactory Energy Consumption §G-30%§!. Replaces §YIndustrial Power Allocation§!; does not stack with the previous stage."
 HOK_KOR_night_school_spirit:0 "Workers' Evening Education"
 HOK_KOR_night_school_spirit_desc:0 "Workers on the production line during the day cannot stop work to fit school hours. Evening classes let them continue learning after work, acquiring the knowledge they need on the factory floor, from reading and arithmetic to technical drawings and basic science.\n\nResearch Speed §G+10%§! permanently."
 HOK_KOR_workforce_1:0 "Factory Apprenticeships"
 HOK_KOR_workforce_1_desc:0 "Every new worker learning a task needs a skilled worker's hands and explanations. Rather than merely handing over drawings and demanding production, we help workers practise machining and assembly at the same bench, passing practical experience on to the next person.\n\nProduction Efficiency Growth §G+30%§!."
 HOK_KOR_workforce_2:0 "Skilled Workforce Training System"
 HOK_KOR_workforce_2_desc:0 "If skills learnt in one workshop do not connect with training in another factory, even skilled workers must repeat the same lessons. Linking vocational education, practical training and retraining provides a steady supply of people to teach new workers, and opportunities to learn again.\n\nProduction Efficiency Growth §G+60%§!. Replaces §YFactory Apprenticeships§!; does not stack with the previous stage."
 HOK_KOR_mass_production_1:0 "Standardised Mass Production"
 HOK_KOR_mass_production_1_desc:0 "Frequent changes to designs and working sequences make it difficult for factories to build the expertise gained by producing the same parts over time. Keeping proven specifications allows us to concentrate on mass production, at the cost of losing more of our accumulated production experience when switching to a new product.\n\nProduction Efficiency Cap §G+15%§!; Production Efficiency Retention when switching lines §R-5%§!."
 HOK_KOR_mass_production_2:0 "Integrated Mass Production Plan"
 HOK_KOR_mass_production_2_desc:0 "Even when the design stays the same, mass production falters if components or workers fail to arrive on time. Aligning component procurement and workforce assignments with production schedules supports sustained output to standard specifications. The cost of switching products remains.\n\nProduction Efficiency Cap §G+30%§!; Production Efficiency Retention when switching lines §R-5%§!. Replaces §YStandardised Mass Production§!; does not stack with the previous stage."
 HOK_KOR_flexible_production_1:0 "Flexible Production Lines"
 HOK_KOR_flexible_production_1_desc:0 "We cannot keep up with deliveries if every order for new equipment means learning tools and working sequences from scratch. Our facilities and changeover procedures allow existing experience to be used even when designs change. In exchange, we give up some of our capacity to concentrate on sustained production of a single item.\n\nProduction Efficiency Retention when switching lines §G+20%§!; Production Efficiency Cap §R-2.5%§!."
 HOK_KOR_flexible_production_2:0 "Integrated Flexible Production Plan"
 HOK_KOR_flexible_production_2_desc:0 "Even agreed changeover procedures leave production lines waiting if new parts and tools arrive late. Coordinating equipment preparation with component supply plans allows more accumulated experience to carry over when products change. We still accept a lower efficiency cap on sustained mass production.\n\nProduction Efficiency Retention when switching lines §G+40%§!; Production Efficiency Cap §R-2.5%§!. Replaces §YFlexible Production Lines§!; does not stack with the previous stage."
 HOK_KOR_quality_control:0 "Production Quality Assurance"
 HOK_KOR_quality_control_desc:0 "When the delivering factory and receiving unit use different inspection standards, even a new production line struggles to know what to correct first. Common checklists linked to delivery records allow working standards established in earlier production to guide the start-up of new lines.\n\nProduction Efficiency Base §G+10%§!."
 HOK_KOR_regional_industry_projects:0 "Regional Industrial Investment"
 HOK_KOR_regional_industry_projects_desc:0 "Turning a drawing into a factory requires further investment. Machining, electrical equipment, component supply and shipbuilding each require different facilities in different regions. We shall turn the plans prepared by subsequent regional focuses into actual construction and deliveries.\n\nEach project costs 150 Political Power, occupies no civilian factories and takes 90 days. The same region cannot run duplicate projects simultaneously. After completion or cancellation, projects can be repeated without limit, provided their conditions are met and the cost is paid again."
 HOK_KOR_regional_industry_fund_tt:0 "Subsequent regional focuses prepare §YRegional Industrial Investment§! projects. Each costs only §Y150 Political Power§! and occupies no civilian factories. Construction takes §Y90 days§!. The same project can be selected again after completion. Building space, ownership and full control are still required."
 HOK_KOR_pyeongan_industry_project:0 "Invest in Pyeongan Machine Factories"
 HOK_KOR_pyeongan_industry_project_desc:0 "Growing arms orders will not turn Pyeongan's drawings into deliveries without enough machine tools and workshops. We shall expand machining facilities and workshops in Pyeongan, turning designs into arms production.\n\nCosts §Y150§! Political Power and occupies no civilian factories. After §Y90 days§!, adds §G1§! building slot and §G1§! military factory in Pyeongan.\n\nCancelled if ownership or full control of the state is lost, if no building slots remain or if Korea capitulates. Costs are not refunded. Can be repeated after completion or cancellation if the conditions are met and the cost is paid again."
 HOK_KOR_gangwon_industry_project:0 "Invest in Gangwon Electrical Equipment Factories"
 HOK_KOR_gangwon_industry_project_desc:0 "An electricity supply is not enough if there are too few facilities to make electrical equipment: factories across the country will still wait for the machinery they need. We shall build electrical equipment factories to put Gangwon's electricity to use in production.\n\nCosts §Y150§! Political Power and occupies no civilian factories. After §Y90 days§!, adds §G1§! building slot and §G1§! civilian factory in Gangwon.\n\nCancelled if ownership or full control of the state is lost, if no building slots remain or if Korea capitulates. Costs are not refunded. Can be repeated after completion or cancellation if the conditions are met and the cost is paid again."
 HOK_KOR_chungcheong_industry_project:0 "Invest in Chungcheong Component Factories"
 HOK_KOR_chungcheong_industry_project_desc:0 "Even a large factory's assembly line stops when one small component is late. We shall expand machining and delivery facilities in Chungcheong, making the parts that must arrive before the finished products can.\n\nCosts §Y150§! Political Power and occupies no civilian factories. After §Y90 days§!, adds §G1§! building slot and §G1§! civilian factory in Chungcheong.\n\nCancelled if ownership or full control of the state is lost, if no building slots remain or if Korea capitulates. Costs are not refunded. Can be repeated after completion or cancellation if the conditions are met and the cost is paid again."
 HOK_KOR_gyeongsang_shipbuilding_project:0 "Invest in Gyeongsang Export Dockyards"
 HOK_KOR_gyeongsang_shipbuilding_project_desc:0 "A shipbuilding contract remains merely paperwork awaiting delivery if there is no room to assemble the hull. We shall provide space in Gyeongsang to build the ships described in those contracts.\n\nCosts §Y150§! Political Power and occupies no civilian factories. Requires building space in the coastal state of Gyeongsang. After §Y90 days§!, adds §G1§! building slot and §G1§! dockyard.\n\nCancelled if ownership or full control of the state is lost, if no building slots remain or if Korea capitulates. Costs are not refunded. Can be repeated after completion or cancellation if the conditions are met and the cost is paid again."
 HOK_KOR_integrated_production_planning_tt:0 "Upgrades the National Spirit for the chosen production policy.\n§YStandardised Mass Production§!: Production Efficiency Cap §G+30%§!, Production Efficiency Retention when switching lines §R-5%§!.\n§YFlexible Production Lines§!: Production Efficiency Retention when switching lines §G+40%§!, Production Efficiency Cap §R-2.5%§!. Does not stack with the previous stage; the two policies' effects cannot apply simultaneously."
