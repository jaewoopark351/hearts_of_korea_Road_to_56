 hokRagnarok.7.t:0 "The World Unites"
 hokRagnarok.7.d:0 "Led by Britain, the nations of the world have united in a single front to bring down the Republic of Korea. There is nowhere left to retreat."
 hokRagnarok.7.a:0 "Come at us, all of you."
