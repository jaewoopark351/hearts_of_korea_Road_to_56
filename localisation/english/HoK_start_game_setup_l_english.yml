l_english:
 #History bookmark
 KOR_GATHERING_STORM_DESC:0 "The Korean-Japanese-Russian War left the entire Korean peninsula in ruins. From the corpse of the old empire arose the Republic of Korea, the first democratic republic in Korean history and in Asia. Yet all the glory it had built has vanished like a mirage in the wake of the Great Depression.\n\nThe economy is collapsing, democracy is in retreat, and extremist movements stand ready to overthrow the country. Japan's expansionist ambitions make no secret of its hostility towards us.\n\nKorea managed to stay out of the Great War, but escaping the next one seems impossible..."

 #Start Game Setup
 custom_diff_strong_kor:0 "Strengthen Korea"
 KOR_AI_BEHAVIOR:0 "@KOR Republic of Korea"
 RULE_OPTION_DEMOCRATIC_KOR_AI_DESC:0 "The Republic of Korea will preserve democracy, install Kim Gu as its new president and seek to remain a beacon of freedom in Asia."
 RULE_OPTION_COMMUNIST_KOR_AI_DESC:0 "A communist revolution in Daegu will overthrow the Republic of Korea and establish the People's Republic of Korea, a new state for workers and peasants."
 RULE_OPTION_FASCIST_KOR_AI_DESC:0 "A coup by Lee Beom-seok's Supreme Council for National Reconstruction will plunge Korea into civil war, after which it will seek to establish a fascist Second Republic of Korea."
 RULE_OPTION_NEUTRALITY_KOR_AI_DESC:0 "The Imperial Family Appreciation Society will reject Gye Yeon-su's mystical theories of Hwan and return to an old-style absolute monarchy under the legitimate emperor, Yi Un."
 
 #HoK Custom rule
 RULE_GROUP_GOOKPPONG_SETUP:0 "Hearts of Korea Custom Game Rules"
 
 HOK_RAGNAROK_STATUS:0 "HoK Extreme: RagnaROK §R(Single Player Only)§!"
 RULE_OPTION_DEFAULT_RAGNAROK_DESC:0 "Do not enable RagnaROK mode."
 RAGNAROK_ENABLED_TEXT:0 "Enable RagnaROK (In Development and Testing)"
 RAGNAROK_ENABLED_TEXT_DESC:0 "Korea is locked into the democratic Kim Gu route to prevent early conquests of France or Italy. On 1 January 1938, every other country in the world will unite in a single faction and declare war on Korea.\n\n§RWarning!§! Hearts of Korea Extreme: RagnaROK is intended for experienced players seeking a tougher challenge. For an even harder game, select Elite difficulty and strengthen every country except Korea.\n\n"
 
 GOOKPPONG_STATUS:0 "Super-Korea"
 RULE_OPTION_DEFAULT_GOOKPPONG_DESC:0 "Do not enable Super-Korea."
 GOOKPPONG_ENABLED_TEXT:0 "Enable Super-Korea"
 GOOKPPONG_ENABLED_TEXT_DESC:0 "Korea begins in control of Manchuria, with starting technology, factories, army units, warships, air wings and supply provision on a par with the seven great powers. It also gains the capable generals Hong Beom-do, Kim Jwa-jin and Ahn Jung-geun, who are unavailable in the normal Korean start.\n\nPlay Korea as a great power rather than the minor power of the standard HoK start. Recommended for newcomers to HOI4."
 GOOKPPONG_MIDDLE_POWER_ENABLED_TEXT:0 "Enable Middle-Power Korea"
 GOOKPPONG_MIDDLE_POWER_ENABLED_TEXT_DESC:0 "Unlike Super-Korea, this option leaves Korea with only the Korean peninsula at the start. However, it provides starting technology, factories, army units, warships, air wings, supply provision, resources and extra building slots on a par with Poland, all more generous than the standard Korean start.\n\nPlay Korea as a middle power comparable to Poland, Sweden or Brazil rather than the minor power of the standard HoK start. Recommended for multiplayer."
 
 
 
 
 
 
 #HoK Ragnarok Event
 hokRagnarok.1.t:0 "Hearts of Korea: RagnaROK"
 hokRagnarok.1.d:0 "Welcome to Hearts of Korea: RagnaROK!\n\nThis mode locks Korea into the democratic Kim Gu route to prevent early conquests of France or Italy. On 1 January 1938, every other country in the world will unite in a single faction and declare war on Korea.\n\nThe whole world is furious about the fiery heat of Korea's Buldak stir-fried noodles. Good luck to everyone taking on this challenge!\n\n§RWarning! This option is still in development and testing. The modder accepts no responsibility for errors encountered while using it.§!"
 hokRagnarok.1.a:0 "Understood."
 
 hokRagnarok.2.t:0 "All-Out Invasion"
 hokRagnarok.2.d:0 ""
 hokRagnarok.2.a:0 "We'll show them just how much heat a little red pepper packs."
 
