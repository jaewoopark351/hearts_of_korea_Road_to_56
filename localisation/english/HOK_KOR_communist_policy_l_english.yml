#20261003_kpopmodder: Apply varied HOI4 fascist and communist voices to description narrative; preserve effects and explicit rules.
#20261003_kpopmodder: Explain new decision and spirit policies through concrete circumstances; preserve gameplay and lifecycle rules.
#20260926_kpopmodder: Use escaped ASCII dialogue quotes and compact decision UI text; preserve gameplay and explicit lifecycle warnings.
#20260926_kpopmodder: Compact new focus descriptions for the fixed-height UI; preserve gameplay and non-focus localisation.
#20260926_kpopmodder: Restore fictional class-conscious and hardline planning voices while preserving all gameplay rules.
#20260925_kpopmodder: Rewrite focus, decision and event prose with grounded voices; preserve keys, gameplay rules and paired Korean text.
#20260923_kpopmodder: 요청한 반복 디시전 7종의 민간공장 비용을 제거하고 정치력 150 비용에 맞춰 설명을 동기화합니다.
 #20260922_kpopmodder: Describe preserved research benefits and distinguish the two political-power-only projects.
 #20260922_kpopmodder: Localise the two communist policy choices and their bounded paid projects.
 HOK_KOR_yeo_cooperative_registry:0 "Cooperative Registration Network"
 HOK_KOR_yeo_cooperative_registry_desc:0 "\"A list of investors?\" \"A list of the owners.\"\nWe will record cooperative members and their shared assets. Workers' equipment and practical experience will be the starting point for industrial research."
 HOK_KOR_yeo_joint_purchasing:0 "Prioritise Joint Purchasing"
 HOK_KOR_yeo_joint_purchasing_desc:0 "\"You could buy a bourgeois's safe for less than that machine.\"\n\"That is why you will not be buying it alone, comrade.\"\nWe will pool cooperative funds, giving priority to shared equipment and workshop expansion."
 HOK_KOR_yeo_rural_credit:0 "Prioritise Local Financial Autonomy"
 HOK_KOR_yeo_rural_credit_desc:0 "\"Let us not put the owners of our money behind some distant desk.\"\nLocal credit cooperatives will manage shared funds, prioritising decisions made on the ground and the administrative cooperation to support them."
 HOK_KOR_yeo_cooperative_workshops:0 "Cooperative Workshops"
 HOK_KOR_yeo_cooperative_workshops_desc:0 "\"You are an owner too, comrade. Let us start by learning to use the tools.\"\nRepair and machining workshops will be run jointly. Grants one 100% electronics research bonus, plus one 75% industrial research bonus if joint purchasing was chosen."
 HOK_KOR_yeo_cooperative_federation:0 "National Federation of Cooperatives"
 HOK_KOR_yeo_cooperative_federation_desc:0 "\"Long live the proletariat! Now let us decide which cooperative to help first.\"\nWe will connect experience across the country. Only the chosen policy advances to tier II, unlocking its corresponding temporary project."
 HOK_KOR_pak_machine_tool_allocation:0 "Machine Tool Allocation Plan"
 HOK_KOR_pak_machine_tool_allocation_desc:0 "\"If you have left the people's lathe idle, explain yourself before the people.\"\nMachine tools will go first to the processes that need them, alongside the operating experience workers have gained."
 HOK_KOR_pak_capital_goods_board:0 "Prioritise Armaments Plant Expansion"
 HOK_KOR_pak_capital_goods_board_desc:0 "\"Today's figures will fall.\" \"Which is why tomorrow's factories must be completed.\"\nLimited machinery and steel will go first to building new military factories."
 HOK_KOR_pak_steel_delivery_schedules:0 "Prioritise Current Production"
 HOK_KOR_pak_steel_delivery_schedules_desc:0 "\"Comrade, you can neither eat a blueprint nor fire it.\"\nMaterials will go to stalled production lines before future factories. The current plan demands an answer in finished goods."
 HOK_KOR_pak_industrial_reporting:0 "Industrial Statistics Reporting Network"
 HOK_KOR_pak_industrial_reporting_desc:0 "\"Was it the factory that met the plan, or your pen?\"\nEquipment installations and deliveries of materials will be reported on the same forms. The figures must match conditions on the ground."
 HOK_KOR_pak_heavy_industry_dispatch:0 "Coordinated Heavy Industry Allocation"
 HOK_KOR_pak_heavy_industry_dispatch_desc:0 "\"The machinery has been sent.\" \"And who sent the workers and the steel?\"\nWe will coordinate allocations of equipment, materials and labour. Only the chosen policy advances to tier II, unlocking its corresponding temporary project."
 HOK_KOR_yeo_joint_purchasing_1:0 "Joint Purchasing I"
 HOK_KOR_yeo_joint_purchasing_1_desc:0 "Our cooperatives belong to the people who hold the tools. Becoming an owner does not, however, mean being able to afford a new lathe on one's own from that very day. Cooperatives pool orders and contributions to buy equipment together and expand their workshops. Having gained the right to work together, we must have the strength to bargain together as well.\n\nRemoved if the government ceases to be communist. Restoring communist rule alone does not restore it automatically."
 HOK_KOR_yeo_joint_purchasing_2:0 "Joint Purchasing II"
 HOK_KOR_yeo_joint_purchasing_2_desc:0 "Cooperatives that once joined forces with neighbouring workshops now form a national purchasing network. Saying that everyone is an owner means everyone must also keep an eye on quotations and finances. Our federation brings together each cooperative's needs to procure equipment and coordinate construction with administration. The achievements of joint purchasing cannot remain a matter of pride for one cooperative alone.\n\nReplaces tier I in the same series. Removed if the government ceases to be communist. Restoring communist rule alone does not restore it automatically."
 HOK_KOR_yeo_local_credit_1:0 "Local Financial Autonomy I"
 HOK_KOR_yeo_local_credit_1_desc:0 "What has changed in a workers' country if we must still wait for a reply from some distant desk whenever we spend our own money? Local credit cooperatives examine their members' circumstances and shared funds directly. We need decisions informed by conditions on the ground, and administrative cooperation to carry them out. Let us not forget who owns the money.\n\nRemoved if the government ceases to be communist. Restoring communist rule alone does not restore it automatically."
 HOK_KOR_yeo_local_credit_2:0 "Local Financial Autonomy II"
 HOK_KOR_yeo_local_credit_2_desc:0 "A national federation is no reason for the centre to dictate village circumstances afresh. Yet preserving autonomy in name is not enough if one cooperative's construction stops while another's funds lie idle. We connect credit cooperatives' accounts with requests from the workplace to support the use of funds and workshop expansion. Helping one another needs accounts too.\n\nReplaces tier I in the same series. Removed if the government ceases to be communist. Restoring communist rule alone does not restore it automatically."
 HOK_KOR_pak_plant_expansion_1:0 "Armaments Plant Expansion I"
 HOK_KOR_pak_plant_expansion_1_desc:0 "Military factories to defend the people's country do not build themselves. If machinery arrives without anywhere to install it, or steel piles up without workers assigned to it, even an excellent plan remains on paper. The state gives new military factory construction priority in equipment and materials. Our principle is that, since these assets belong to everyone, the state must decide where they are used first.\n\nRemoved if the government ceases to be communist. Restoring communist rule alone does not restore it automatically."
 HOK_KOR_pak_plant_expansion_2:0 "Armaments Plant Expansion II"
 HOK_KOR_pak_plant_expansion_2_desc:0 "The agency that sent the machinery says its task is complete; the agency that sends the workers says it is still waiting its turn. The people have never seen a factory completed in separate pieces by separate agencies. We bring equipment requests and construction reports into a coordinated allocation system, sending machinery, labour and materials to the same process. Priority for construction has become the way the state works, rather than merely a declaration.\n\nReplaces tier I in the same series and retains the existing military factory construction benefit. Removed if the government ceases to be communist. Restoring communist rule alone does not restore it automatically."
 HOK_KOR_pak_current_output_1:0 "Current Production Plan I"
 HOK_KOR_pak_current_output_1_desc:0 "Our vision of tomorrow's industry is grand. Yet tomorrow's factory blueprints cannot replace the finished goods needed today. The state concentrates on current production, giving working military factories priority in raw materials and maintenance. Believing in the future does not mean leaving today's production lines empty, comrade.\n\nRemoved if the government ceases to be communist. Restoring communist rule alone does not restore it automatically."
 HOK_KOR_pak_current_output_2:0 "Current Production Plan II"
 HOK_KOR_pak_current_output_2_desc:0 "If every factory reports success yet the goods the country needs remain in short supply, we must ask for whose benefit that success was counted. Operating results and material requests are submitted together for coordinated national allocation. Our plan is measured in the whole of the people's industry, not a factory manager's report. The principle of prioritising current production is now established on that scale.\n\nReplaces tier I in the same series and retains the existing military factory output benefit. Removed if the government ceases to be communist. Restoring communist rule alone does not restore it automatically."
 HOK_KOR_communist_policy_projects:0 "Implement Communist Economic Policy"
 HOK_KOR_communist_policy_projects_desc:0 "\"Comrades, the meeting may be over, but the work is not.\"\nOur chosen economic policy is a promise for the people's future. That promise must now be followed by the work of those buying materials, overseeing construction and running production lines. A unanimous meeting cannot turn a lathe, after all. Only projects matching completed focuses and the chosen policy become available.\n\nEach project costs 150 Political Power and occupies no civilian factories. Effects begin immediately and last 90 days, with only one project allowed at a time. All economic policy projects share a 90-day waiting period after completion or cancellation. One economic policy project and one domestic administration project can run simultaneously; the two categories have separate waiting periods."
 HOK_KOR_communist_policy_no_active_project_tt:0 "No other communist economic policy project is in progress"
 HOK_KOR_communist_policy_cooldown_finished_tt:0 "90 days have passed since the previous communist economic policy project ended or was cancelled"
 HOK_KOR_communist_policy_project_start_tt:0 "Costs §Y150§! Political Power and occupies no civilian factories. Effects last §Y90 days§!.\nOnly one communist economic policy project may run at a time. After completion or cancellation, this entire category is unavailable for §Y90 days§!.\nCancelled upon loss of communist government or the required political path, capitulation or civil war. Costs are not refunded."
 HOK_KOR_communist_policy_project_end_tt:0 "Project effects end. All communist economic policy projects are unavailable for §Y90 days§!. Costs are not refunded."
 HOK_KOR_yeo_joint_purchasing_project:0 "Joint Purchasing Project"
 HOK_KOR_yeo_joint_purchasing_project_desc:0 "\"We cannot offer that price for one cooperative's order.\" \"That is why we came together.\"\nIt is time for our solidarity to prove its worth at the price list as well. We will pool scattered orders for materials and equipment, negotiate together, and use shared funds to procure what is needed for civilian workshop construction. Let us bring our members something better than a photograph of clasped hands.\n\nCosts 150 Political Power. Effects begin immediately and last 90 days. Occupies no civilian factories. Only one economic policy project may run at a time; the entire category shares a 90-day waiting period after completion or cancellation. One can run alongside one communist domestic administration project. Cancelled upon loss of communist government or the conditions that unlocked it, capitulation or civil war. Costs are not refunded."
 HOK_KOR_yeo_rural_credit_project:0 "Local Finance Circulation Project"
 HOK_KOR_yeo_rural_credit_project_desc:0 "\"Our money can only circulate when you are back at work, comrade.\"\nWhile liberated workers' money rests in the accounts, construction sites wait for payment for materials. Local credit cooperatives will connect funds with construction schedules, supporting different kinds of building work rather than factories alone. Shared funds can only serve their purpose when our workplaces are moving again. Surely a cooperative's money should not keep its members waiting?\n\nCosts 150 Political Power. Effects begin immediately and last 90 days. Occupies no civilian factories. Only one economic policy project may run at a time; the entire category shares a 90-day waiting period after completion or cancellation. One can run alongside one communist domestic administration project. Cancelled upon loss of communist government or the conditions that unlocked it, capitulation or civil war. Costs are not refunded."
 HOK_KOR_pak_plant_expansion_project:0 "Intensive Armaments Plant Construction"
 HOK_KOR_pak_plant_expansion_project_desc:0 "\"The revolution's factories are not built with slogans.\"\nNo one disputes that our military factories will demonstrate the people's will. But those who install the machines and the materials they need must arrive on the same day as well. Allocation agencies will concentrate support on construction, coordinating equipment arrivals with the sequence of work. Instead of accepting that each agency has done its part, we will demand that one stage leads into the next.\n\nThis project does not grant factories immediately. Costs 150 Political Power. Effects begin immediately and last 90 days. Occupies no civilian factories. Only one economic policy project may run at a time; the entire category shares a 90-day waiting period after completion or cancellation. One can run alongside one communist domestic administration project. Cancelled upon loss of communist government or the conditions that unlocked it, capitulation or civil war. Costs are not refunded."
 HOK_KOR_pak_current_output_project:0 "Intensive Support for Current Production"
 HOK_KOR_pak_current_output_project_desc:0 "\"There is no retreat in the plan.\" \"Then send the raw materials and mechanics first.\"\nNews of higher production targets has already reached the workshops. It is time to send the raw materials and mechanics needed to meet them with the same enthusiasm. The state will attend to material deliveries and equipment maintenance at working military factories before new factories. We will give the shop floor the support it needs to answer with more finished goods.\n\nCosts 150 Political Power. Effects begin immediately and last 90 days. Occupies no civilian factories. Only one economic policy project may run at a time; the entire category shares a 90-day waiting period after completion or cancellation. One can run alongside one communist domestic administration project. Cancelled upon loss of communist government or the conditions that unlocked it, capitulation or civil war. Costs are not refunded."
 HOK_KOR_yeo_cooperative_workshops_electronics_bonus:0 "Cooperative Workshop Electronics Research"
 HOK_KOR_communist_policy_project_start_pp_only_tt:0 "Costs §Y150§! Political Power and occupies no civilian factories. Effects last §Y90 days§!.\nOnly one communist economic policy project may run at a time. After completion or cancellation, this entire category is unavailable for §Y90 days§!.\nCancelled upon loss of communist government or the required political path, capitulation or civil war. Costs are not refunded."
 HOK_KOR_communist_policy_project_end_pp_only_tt:0 "Project effects end. All communist economic policy projects are unavailable for §Y90 days§!. Costs are not refunded."
