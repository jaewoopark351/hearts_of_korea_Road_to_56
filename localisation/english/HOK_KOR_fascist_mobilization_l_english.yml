#20260922_kpopmodder: Describe parallel manpower and essential-workforce policies with their separate benefits and upgrades.
 HOK_KOR_nrsc_manpower_register:0 "Military Service Register"
 HOK_KOR_nrsc_manpower_register_desc:0 "The visitor in uniform knows your name and address.\n\"But I haven't applied for anything.\"\n\"That's why we've come in person.\" We shall cross-check the military service registers."
 HOK_KOR_nrsc_reserve_rotations:0 "Reserve Call-up Plan"
 HOK_KOR_nrsc_reserve_rotations_desc:0 "The envelope gives a name and a reporting time.\n\"Can I choose the date?\" \"We've already chosen it for you.\"\nThe conscription law remains in place. This can be pursued independently of the essential workforce policy."
 HOK_KOR_nrsc_skilled_worker_exemptions:0 "Essential Workforce Assignment Standards"
 HOK_KOR_nrsc_skilled_worker_exemptions_desc:0 "\"You're not being called up.\" \"What a relief.\"\n\"You're being assigned to the night shift at an arms factory.\"\nEssential workforce assignment standards shall keep skilled workers in production."
 HOK_KOR_nrsc_manpower_coordination:0 "Unify Military Service Administration"
 HOK_KOR_nrsc_manpower_coordination_desc:0 "\"I've received two notices.\"\n\"One is a mistake. The other isn't.\"\nWe shall integrate call-up and assignment records, strengthening mobilisation benefits while retaining the essential workforce benefits."
 HOK_KOR_nrsc_manpower_administration_1:0 "Military Service Administration System I"
 HOK_KOR_nrsc_manpower_administration_1_desc:0 "The state awaits the service of its people. While waiting, it has also found out where they live. Military service administrators cross-check names, addresses and reporting times, linking records from call-up to arrival at a unit. Matching the register of notices sent with the people who actually arrive allows us to hasten the replacements we need. We shall spend less time waiting for the same person twice. We do intend to wait for them once.\n\nApplies alongside the existing conscription law and other manpower policies. Removed if the government ceases to be fascist."
 HOK_KOR_nrsc_manpower_administration_2:0 "Military Service Administration System II"
 HOK_KOR_nrsc_manpower_administration_2_desc:0 "The same name appears on both the call-up register and the arms factory register. Wanting to serve the motherland in two places at once shows admirable spirit, but one person has only one body. The National Salvation Army will cross-check military service records against essential work assignments, establish who can actually be called up and unify the handover process. Reducing the time ministries spend waiting for people lets us offer the public their opportunity to serve with greater certainty.\n\nReplaces Military Service Administration System I and strengthens its existing mobilisation benefits. The essential workforce assignment policy remains in effect separately. Removed if the government ceases to be fascist."
 HOK_KOR_nrsc_essential_workforce:0 "Essential Workforce Assignment Policy"
 HOK_KOR_nrsc_essential_workforce_desc:0 "\"You're not being called up.\" \"What a relief.\" \"You're being assigned to the night shift at an arms factory.\"\nThe National Salvation Army recognises skilled workers' talents. Rather than leaving familiar machinery to learn to use a rifle, they can serve the nation better by handling the growing orders at the same workbench. We shall keep the people we need at their workplaces, preserving their experience of the production process. Now that it has been named the production front, remaining at the factory is glorious service too.\n\nRemains in effect separately when the military service administration system is upgraded. Removed if the government ceases to be fascist."
