l_english:
#20261011_kpopmodder: Add Korean corporate and civic focus prose while preserving existing localisation keys.
 HOK_KOR_civic_industrial_compact:0 "산업·사회협약"
 HOK_KOR_civic_industrial_compact_desc:0 "공장과 은행, 노동조합과 시민단체가 국가의 진로를 묻고 있습니다. 기업의 투자에 기대거나 독점을 해체하거나 공공 소유로 전환할 수 있습니다. 각 세력의 영향력과 조달의 대가를 살피며 산업·사회협약을 정하겠습니다."
 HOK_KOR_civic_chaebol_cooperation:0 "재벌과의 산업협력"
 HOK_KOR_civic_chaebol_cooperation_desc:0 "새 설비를 세우려면 돈과 기술, 납품망을 한데 모아야 합니다. 재벌의 투자를 국가의 생산계획에 연결하겠습니다. 당장의 증산이 달콤한 만큼 계약을 둘러싼 특혜와 은폐도 우리 부담이 됩니다."
 HOK_KOR_civic_nationalization:0 "재벌의 공공 소유 전환"
 HOK_KOR_civic_nationalization_desc:0 "공장과 계약의 주인을 공공으로 바꾸겠습니다. 설비가 돌아가려면 간판을 내리는 일보다 기술자와 거래망을 붙드는 일이 먼저입니다. 기존 조달의 비리와 기관의 결탁까지 소유권 문서 한 장으로 사라지지는 않습니다."
 HOK_KOR_civic_break_monopolies:0 "독점 해체와 시민 개혁"
 HOK_KOR_civic_break_monopolies_desc:0 "국가의 주문을 몇몇 기업의 몫으로 고정할 이유는 없습니다. 독점을 해체하고 노동자와 시민이 생산과 감독에 참여하게 하겠습니다. 민생의 비용을 감수하는 대신 숙련과 신뢰를 쌓고, 개혁에 맞서는 기관의 압박에 대비하겠습니다."
 HOK_KOR_civic_sunkyong_investment:0 "선경 원료·설비 투자"
 HOK_KOR_civic_sunkyong_investment_desc:0 "설비가 늘어도 원료 공급이 끊기면 공장은 서지 못합니다. 선경의 원료 거래와 공정 투자를 지원하여 생산 기반을 넓히고 새로운 산업 기술을 도입하겠습니다."
 HOK_KOR_civic_samsung_electronics:0 "삼성전자 기술투자"
 HOK_KOR_civic_samsung_electronics_desc:0 "계측기와 통신 장비의 부품 하나가 공장과 군의 일정 전체를 붙잡습니다. 삼성전자의 전자 기술 연구를 지원하고 국산 부품의 개발 계획을 국가의 수요와 연결하겠습니다."
 HOK_KOR_civic_goldstar_mass_production:0 "금성 대량생산 설비"
 HOK_KOR_civic_goldstar_mass_production_desc:0 "좋은 시제품만으로 주문서를 채울 수는 없습니다. 금성의 대량생산 경험에 새 설비를 보태 군수 물자의 부품과 완제품이 꾸준히 출하되도록 하겠습니다."
 HOK_KOR_civic_labor_compact:0 "노동·생산 협약"
 HOK_KOR_civic_labor_compact_desc:0 "새 생산라인마다 숙련공이 흩어지고 작업 기준이 달라집니다. 노동조합과 사업장이 공정 전환과 교육, 안전을 함께 정하여 현장의 경험을 새 설비에 남기겠습니다."
 HOK_KOR_civic_mass_conscription:0 "국민개병제 정비"
 HOK_KOR_civic_mass_conscription_desc:0 "나라를 지키는 의무를 집안과 직업에 따라 달리 매길 수는 없습니다. 병역 명부와 예비인력 교육을 정비하여 공정한 국민개병제가 실제 동원으로 이어지게 하겠습니다."
 HOK_KOR_civic_public_accountability:0 "공적 책임과 공정 인사"
 HOK_KOR_civic_public_accountability_desc:0 "조달 서류와 인사 기록이 특정 기관의 금고에 묶여서는 안 됩니다. 시민의 감독 아래 책임 소재를 드러내고, 새 지휘관은 연줄보다 야전의 판단과 보급 능력으로 뽑겠습니다."
 HOK_KOR_civic_social_settlement:0 "시민 개혁의 정착"
 HOK_KOR_civic_social_settlement_desc:0 "노동 현장의 협약과 공정한 병역, 공개된 책임이 따로 움직이면 개혁은 오래가지 못합니다. 정착한 제도를 산업 연구와 국가 운영에 연결하여 다음 생산 계획의 기반으로 삼겠습니다."
 HOK_KOR_civic_public_procurement:0 "공공 계약과 기술 승계"
 HOK_KOR_civic_public_procurement_desc:0 "소유권이 바뀌었다고 현장의 기술과 납품 계약까지 버릴 수는 없습니다. 공공 조달이 숙련공과 설계 자료, 기존 공급망을 승계하여 설비를 멈추지 않고 연구를 이어가게 하겠습니다."
 HOK_KOR_civic_procurement_inspections:0 "조달 검수체계"
 HOK_KOR_civic_procurement_inspections_desc:0 "공군과 로켓의 납기를 앞당기라는 요구가 시험장으로 밀려옵니다. 계약과 검수를 한 체계로 묶고 급행 계약을 운영할 권한을 정하겠습니다. 시험을 줄여 얻는 시간과 이후 사고·비리의 대가를 함께 살펴야 합니다."
