l_english:
#20261020_kpopmodder: Name the repeatable emergency shipbuilding plan and explain its naval purpose, duration and reuse conditions.
 HOK_KOR_enact_emergency_special_shipbuilding:0 "Launch the Emergency Special Shipbuilding Programme"
 HOK_KOR_enact_emergency_special_shipbuilding_desc:0 "We cannot build an ocean-going fleet while our slipways stand empty. We shall launch an emergency special shipbuilding programme so that the navy and shipyards coordinate deliveries of steel and engines, and concentrate skilled workers and dock capacity on building ships. From the yards constructing warships to the convoys that carry supplies, we shall accelerate the work needed to fulfil Vision 1950.\n\nSpends 150 Political Power to gain the §YEmergency Special Shipbuilding Programme§! national spirit for 180 days. It cannot be launched again while active. Once it expires, it can be launched again without limit for the same cost, with no additional waiting period."
 HOK_KOR_emergency_special_shipbuilding:0 "Emergency Special Shipbuilding Programme"
 HOK_KOR_emergency_special_shipbuilding_desc:0 "The fleet the navy needs begins on the slipways. We are coordinating deliveries and concentrating skilled workers so that hulls waiting for steel plate and docks waiting for engines can make progress together. Warships, support vessels and the convoys needed to carry the fleet's supplies will be built under one emergency programme, hastening the fulfilment of Vision 1950."
