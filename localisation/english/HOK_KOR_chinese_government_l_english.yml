#20261120_kpopmodder: Integrate democratic support, intelligence and Shandong with RT56 geography.
#20261119_kpopmodder: Explain the existing CHI country and inclusive 50 percent democratic-support requirement.
#20261119_kpopmodder: Describe Shandong as a Korean dominion and require Together for Victory.
#20261119_kpopmodder: Distinguish whole Shandong warlord land integration from support-scaled Chinese territory and military defections.
#20261119_kpopmodder: Keep protected Shandong government requirements and effects visible across translation file overrides.
 HOK_KOR_chinese_government_mtg_tt:0 "The §YTogether for Victory§! DLC is enabled"
 HOK_KOR_chinese_government_chi_democracy_tt:0 "§YChina§! exists and has §Yat least 50%§! democratic support"
 HOK_KOR_chinese_government_no_existing_tt:0 "The Free Republic of Shandong does not yet exist"
 HOK_KOR_chinese_government_seed_tt:0 "Shandong or Qingdao contains a §Ysafe foothold fully controlled by a Chinese country§! (excluding territory owned or controlled by Korea or the Japanese side; the original owner must hold at least 1 other state)"
 HOK_KOR_chinese_government_effect_tt:0 "Establish the §YFree Republic of Shandong§! in Shandong as §Ya Korean dominion§! and grant it cores on mainland China.\nSecure eligible §Yfootholds in Shandong and Qingdao§! and §Yall eligible mainland territory owned by the Shandong warlord§! as founding territory, regardless of democratic support.\nOther Chinese countries contribute additional states connected by land to the founding territory according to their democratic support when the focus completes, up to §Y90%§!. Existing Shandong and Qingdao footholds count against their original owner's territorial allocation.\nFor each country that actually contributes territory, the same support-based defection share applies to its army, navy, air force, stockpiled equipment and fuel. Existing commanders are excluded from the defections. Equipment, convoys and fuel left behind by a Shandong warlord that disappears through full integration are discarded.\nExisting airfields needed for air-force defections are secured first. If no usable airfield is available in the territory to be integrated, a level 1 airfield is established at the new government's foothold.\n§YTerritory owned or controlled by Korea, Japan or Japanese subjects, and Manchuria§! will not be transferred.\nKorea gains war goals against all existing designated targets: China, Communist China and 14 warlords. Declaring or joining wars follows the normal diplomatic rules."
