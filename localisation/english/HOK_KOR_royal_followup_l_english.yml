l_english:
#20260926_kpopmodder: Use escaped ASCII dialogue quotes and compact decision UI text; preserve gameplay and explicit lifecycle warnings.
#20260926_kpopmodder: Compact new focus descriptions for the fixed-height UI; preserve gameplay and non-focus localisation.
#20260926_kpopmodder: Restore court, imperial oath and dynastic continuity voices while preserving all gameplay rules.
#20260925_kpopmodder: Rewrite focus, decision and event prose with grounded voices; preserve keys, gameplay rules and paired Korean text.
#20260923_kpopmodder: Add independently accessible royal policy modules and preserve existing route rewards.
 HOK_KOR_am_bibyeonsa_dockets:0 "비변사 집행예산"
 HOK_KOR_am_bibyeonsa_dockets_desc:0 "\"짐의 이름으로 명했다면, 무엇으로 이행할지도 아뢰라.\"\n비변사의 안건마다 예산과 책임을 붙입니다. 기존 외교 권한과 황제 특성은 유지합니다."
 HOK_KOR_am_provincial_returns:0 "지방 보고체계"
 HOK_KOR_am_provincial_returns_desc:0 "\"제때 아뢰는 것보다 늦게 예를 갖추는 것이 충성스럽더냐?\"\n지방 보고의 기한과 책임자를 정해 조정 행정체계 I을 세우겠습니다."
 HOK_KOR_am_inspector_itineraries:0 "순찰관 현장감사"
 HOK_KOR_am_inspector_itineraries_desc:0 "\"폐하의 뜻대로 했습니다.\" \"백성도 같은 말을 하겠군. 안내하시오.\"\n장부와 현장을 감사합니다. 지방 보고체계와 병렬로 추진할 수 있습니다."
 HOK_KOR_am_execution_registers:0 "조정 집행 일원화"
 HOK_KOR_am_execution_registers_desc:0 "\"관청마다 문패는 달라도 받드는 어좌는 하나다.\"\n보고와 감사를 결합해 조정 행정체계를 II로 강화합니다. 다른 국민정신은 유지합니다."
 HOK_KOR_am_petition_calendar:0 "백성의 상언"
 HOK_KOR_am_petition_calendar_desc:0 "\"폐하, 관청으로 돌려보내겠나이다.\"\n\"거기서 답을 못 얻어 온 것 아니냐. 읽어라.\"\n백성의 상언을 듣고 구휼과 복구에 예산을 쓰겠습니다."
 HOK_KOR_am_granary_ledgers:0 "구휼·민생 예산"
 HOK_KOR_am_granary_ledgers_desc:0 "황실의 은덕은 먼 고을에 곡식과 지붕으로 닿아야 합니다. 구휼곡과 민생 예산을 함께 집행하여 끼니와 건설·수리를 잇겠습니다."
 HOK_KOR_am_relief_dispatches:0 "구휼 집행규정"
 HOK_KOR_am_relief_dispatches_desc:0 "\"짐의 뜻을 거듭 묻느라 백성의 끼니를 미루지 말라.\"\n구휼 요청과 집행을 정례화하여 왕명을 기다리다 구호가 늦는 일을 줄이겠습니다."
 HOK_KOR_am_regimental_returns:0 "연대 병적대조"
 HOK_KOR_am_regimental_returns_desc:0 "\"충성은 들었소. 이제 지휘할 병력을 보여주시오.\"\n연대의 병적과 실제 편제를 대조합니다. 기존 군제개혁의 교리 혜택과 부대는 보존합니다."
 HOK_KOR_am_nco_examinations:0 "하사관 실무교육"
 HOK_KOR_am_nco_examinations_desc:0 "\"집안의 충성은 알겠네. 이 분대는 어떻게 움직이겠는가?\"\n혈통보다 야전 실무를 가르쳐 황실의 군제 전문화 I을 세우겠습니다."
 HOK_KOR_am_reserve_cadre:0 "예비 간부명부"
 HOK_KOR_am_reserve_cadre_desc:0 "\"전역한 뒤에도 이름을 남깁니까?\" \"황실은 그 경험을 잊지 않네.\"\n예비 지휘·보병 장비 연구에 숙련을 잇습니다. 하사관 교육과 병렬 추진합니다."
 HOK_KOR_am_mobilization_review:0 "동원체계 종합연습"
 HOK_KOR_am_mobilization_review_desc:0 "\"폐하께서 보시려는 것은 경례가 아니라 움직이는 부대요.\"\n하사관과 예비 간부명부를 함께 시험해 칙명이 실제 동원으로 이어지게 하겠습니다."
 HOK_KOR_am_technical_memorials:0 "기술 상주문"
 HOK_KOR_am_technical_memorials_desc:0 "\"문장이 법도에 맞느냐고 물었는가, 기계가 돌아가느냐고 물었는가?\"\n광산과 공장의 기술 상주문을 어전에서 검토하여 산업 연구를 지원하겠습니다."
 HOK_KOR_am_civil_service_practicum:0 "관료 현장수습"
 HOK_KOR_am_civil_service_practicum_desc:0 "\"폐하의 일을 보러 왔지, 관복을 자랑하러 온 것이 아니네.\"\n관료를 현장 수습에 보내고 전자공학 지식을 행정에 잇겠습니다."
 HOK_KOR_am_merit_registers:0 "기술관료 전문화"
 HOK_KOR_am_merit_registers_desc:0 "\"경의 재주로 왕실의 신임에 답하라.\"\n연구·생산 실적을 바탕으로 기술관료를 세우겠습니다. 기존 기관과 국민정신의 혜택은 유지합니다."
 HOK_KOR_hw_provincial_inventory:0 "환국 지방실사"
 HOK_KOR_hw_provincial_inventory_desc:0 "\"지도의 광대함은 보았다. 그 땅에서 무엇이 돌아가느냐?\"\n형성된 제국이 소유·완전통제하는 만주를 실사하여 산업 연구에 쓰겠습니다."
 HOK_KOR_hw_provision_accounts:0 "지방 물자관리"
 HOK_KOR_hw_provision_accounts_desc:0 "\"짐의 창고를 채우라 한 것이 아니다. 필요한 곳에 보내라.\"\n제국의 채굴과 보급 집계를 통일해 원료와 물자가 목적지에 닿게 하겠습니다."
 HOK_KOR_hw_inspection_circuits:0 "제국 지방 순찰"
 HOK_KOR_hw_inspection_circuits_desc:0 "\"접견 준비는 갖췄습니다.\" \"폐하께 아뢸 준비는 어떻소?\"\n황실의 순찰단이 지방 장부와 현장을 대조합니다. 물자관리와 병렬 추진합니다."
 HOK_KOR_hw_supply_returns:0 "물자 결산통일"
 HOK_KOR_hw_supply_returns_desc:0 "\"짐의 인장은 하나인데 경들의 계산은 어찌 다르냐?\"\n지방 순찰과 물자관리를 결산체계로 묶어 채굴·보급 혜택을 함께 강화하겠습니다."
 HOK_KOR_hw_dispatch_codes:0 "제국 공문부호"
 HOK_KOR_hw_dispatch_codes_desc:0 "\"폐하의 뜻을 짐작하지 말고 정확히 전하시오.\"\n칙명의 봉인만으로 부호의 차이가 사라지지는 않습니다. 중앙·지방·전선의 공문부호를 통일하겠습니다."
 HOK_KOR_hw_courier_relays:0 "군정 연락인계"
 HOK_KOR_hw_courier_relays_desc:0 "\"전임자가 맡던 일입니다.\"\n\"관원은 바뀌어도 왕명은 교대하지 않네.\"\n보낸 명령과 기다리는 회신까지 넘기는 군정 연락인계를 세우겠습니다."
 HOK_KOR_hw_signal_logs:0 "전선 통신기록"
 HOK_KOR_hw_signal_logs_desc:0 "\"왕명이라 하여 전파까지 서두르지는 않사옵니다.\"\n통신 지연을 기록해 전자공학 연구에 잇겠습니다. 연락인계와 병렬 추진할 수 있습니다."
 HOK_KOR_hw_relay_exercises:0 "연락망 종합연습"
 HOK_KOR_hw_relay_exercises_desc:0 "\"모두 봉명하였답니다.\" \"같은 명을 받았는지도 확인했느냐?\"\n인계·통신 기록을 종합연습으로 점검해 제국 연락망을 강화하겠습니다."
 HOK_KOR_hw_postwar_dockets:0 "전후 민정예산"
 HOK_KOR_hw_postwar_dockets_desc:0 "\"황실의 이름 아래 살아갈 집부터 살펴라.\"\n세계질서 경로 이후 평시에 민정예산을 확보합니다. 경기·만주 운영 거점의 소유·완전통제가 필요합니다."
 HOK_KOR_hw_reconstruction_priorities:0 "복구 우선순위"
 HOK_KOR_hw_reconstruction_priorities_desc:0 "\"먼저 도울 곳을 정하되 기다릴 백성의 이름도 남겨라.\"\n수리·민간 건설의 순서를 정하고 건설 연구를 지원해 복구행정 I을 세우겠습니다."
 HOK_KOR_hw_civil_accountability:0 "복구행정 정례화"
 HOK_KOR_hw_civil_accountability_desc:0 "\"짐의 뜻을 기리는 비석보다 끝낸 일을 남겨라.\"\n황실의 복구 예산과 집행을 정례화하여 기존 건물 수리·민간 건설 혜택을 강화하겠습니다."
 HOK_KOR_hw_veteran_rolls:0 "귀환 장병 지원"
 HOK_KOR_hw_veteran_rolls_desc:0 "\"복무를 마쳤습니다.\" \"그 충성을 받은 쪽의 몫이 남았소.\"\n평시의 사회 복귀와 예비훈련을 돕습니다. 기존 사단·인력은 제거하지 않습니다."
 HOK_KOR_hw_demobilization_schedule:0 "장병 복귀지원 체계"
 HOK_KOR_hw_demobilization_schedule_desc:0 "\"황실의 약속은 오늘의 접견으로 끝나지 않는다.\"\n사회 복귀와 예비훈련의 상설 지원체계를 세웁니다. 징병법과 기존 편제는 바꾸지 않습니다."
 HOK_KOR_hw_peacetime_training:0 "평시 예비훈련"
 HOK_KOR_hw_peacetime_training_desc:0 "\"맹세는 기억하는가? 이제 함께 움직이는 법을 기억하게.\"\n평시 예비훈련으로 경험과 증원을 잇겠습니다. 수립한 제도는 재전쟁 뒤에도 유지됩니다."
 HOK_KOR_am_ordered_administration_1:0 "조정 행정체계 I"
 HOK_KOR_am_ordered_administration_1_desc:0 "비변사와 지방의 정기 보고를 이어 명령의 책임을 분명히 합니다. 비동맹 정부를 잃으면 제거됩니다."
 HOK_KOR_am_ordered_administration_2:0 "조정 행정체계 II"
 HOK_KOR_am_ordered_administration_2_desc:0 "책임 있는 집행과 정기 감사를 정착시킨 상위 행정체계입니다. 하위 단계의 이점을 강화하며 비동맹 정부를 잃으면 제거됩니다."
 HOK_KOR_am_relief_protocol_1:0 "구휼·민생 집행체계 I"
 HOK_KOR_am_relief_protocol_1_desc:0 "구휼 물자와 민간 복구 예산을 함께 집행합니다. 수리 혜택은 건물 수리에 쓰이는 민간공장 작업량에 적용됩니다. 비동맹 정부를 잃으면 제거됩니다."
 HOK_KOR_am_relief_protocol_2:0 "구휼·민생 집행체계 II"
 HOK_KOR_am_relief_protocol_2_desc:0 "민생 건설과 건물 수리를 함께 강화한 구휼 집행체계입니다. 하위 단계와 중복 적용되지 않으며 비동맹 정부를 잃으면 제거됩니다."
 HOK_KOR_am_reserve_cadre_1:0 "군제 전문화 I"
 HOK_KOR_am_reserve_cadre_1_desc:0 "하사관 교육과 예비간부 배치를 표준화합니다. 훈련 시간과 육군 전투 증원율을 개선하며 비동맹 정부를 잃으면 제거됩니다."
 HOK_KOR_am_reserve_cadre_2:0 "군제 전문화 II"
 HOK_KOR_am_reserve_cadre_2_desc:0 "간부 명부와 소집 절차를 통합합니다. 하위 단계의 이점을 강화하고 동원 속도를 높입니다. 비동맹 정부를 잃으면 제거됩니다."
 HOK_KOR_am_practical_bureaucracy:0 "기술관료 전문화"
 HOK_KOR_am_practical_bureaucracy_desc:0 "기술 제안을 이해하는 관료를 현장에 배치해 연구와 군수 생산을 지원합니다. 비동맹 정부를 잃으면 제거됩니다."
 HOK_KOR_hw_provision_accounts_1:0 "제국 물자관리 I"
 HOK_KOR_hw_provision_accounts_1_desc:0 "형성된 제국의 지방 물자 관리로 육군 보급 소비를 줄이고 자원 채굴을 개선합니다. 국가 운영 제도이며 일시적인 영토 상실만으로 제거되지 않습니다."
 HOK_KOR_hw_provision_accounts_2:0 "제국 물자관리 II"
 HOK_KOR_hw_provision_accounts_2_desc:0 "지방 물자 결산을 통일해 기존 보급·자원 혜택을 모두 강화합니다. 일시적인 영토 상실만으로 제거되지 않습니다."
 HOK_KOR_hw_courier_service_1:0 "제국 연락망 I"
 HOK_KOR_hw_courier_service_1_desc:0 "지방과 전선 사이의 연락 인계를 표준화해 육군 우선권과 이동을 지원합니다. 외교·세력 규칙에는 영향을 주지 않습니다."
 HOK_KOR_hw_courier_service_2:0 "제국 연락망 II"
 HOK_KOR_hw_courier_service_2_desc:0 "통신 기록과 종합연습을 통해 연락망의 두 이점을 함께 강화합니다. 정권의 이념이 바뀌어도 이미 수립한 운영 제도는 유지됩니다."
 HOK_KOR_hw_civil_recovery_1:0 "전후 복구행정 I"
 HOK_KOR_hw_civil_recovery_1_desc:0 "평시에 수립한 복구 행정이 건물 수리와 민간 건설을 지원합니다. 재전쟁은 새 중점 착수를 막지만 이미 갖춘 제도를 삭제하지 않습니다."
 HOK_KOR_hw_civil_recovery_2:0 "전후 복구행정 II"
 HOK_KOR_hw_civil_recovery_2_desc:0 "복구 예산 집행을 정례화하여 하위 단계의 건물 수리와 민간 건설 혜택을 모두 강화합니다."
 HOK_KOR_hw_reserve_training_1:0 "귀환 장병·예비훈련 I"
 HOK_KOR_hw_reserve_training_1_desc:0 "귀환 장병의 경험을 예비훈련에 연결합니다. 훈련 시간과 육군 경험치 획득을 개선하며 기존 사단이나 인력을 회수하지 않습니다."
 HOK_KOR_hw_reserve_training_2:0 "귀환 장병·예비훈련 II"
 HOK_KOR_hw_reserve_training_2_desc:0 "예비훈련을 정례화해 하위 혜택을 강화하고 육군 전투 증원율을 높입니다. 국가는 기존 인력과 부대를 유지합니다."
