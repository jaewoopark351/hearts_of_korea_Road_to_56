l_english:
#20261003_kpopmodder: Explain new decision and spirit policies through concrete circumstances; preserve gameplay and lifecycle rules.
#20260926_kpopmodder: Use escaped ASCII dialogue quotes and compact decision UI text; preserve gameplay and explicit lifecycle warnings.
#20260926_kpopmodder: Compact new focus descriptions for the fixed-height UI; preserve gameplay and non-focus localisation.
#20260926_kpopmodder: Restore court, imperial oath and dynastic continuity voices while preserving all gameplay rules.
#20260925_kpopmodder: Rewrite focus, decision and event prose with grounded voices; preserve keys, gameplay rules and paired Korean text.
#20260923_kpopmodder: Add independently accessible royal policy modules and preserve existing route rewards.
 HOK_KOR_am_bibyeonsa_dockets:0 "Border Defence Council Budget"
 HOK_KOR_am_bibyeonsa_dockets_desc:0 "\"If an order bears my name, tell me how it is to be carried out.\"\nEvery item before the Border Defence Council will have a budget and someone responsible. Existing diplomatic powers and imperial traits remain unchanged."
 HOK_KOR_am_provincial_returns:0 "Provincial Reporting System"
 HOK_KOR_am_provincial_returns_desc:0 "\"Is a late report dressed in ceremony more loyal than one delivered on time?\"\nDeadlines and named officials for provincial reports will establish Court Administration I."
 HOK_KOR_am_inspector_itineraries:0 "Inspectors' Field Audits"
 HOK_KOR_am_inspector_itineraries_desc:0 "\"We have done as Your Majesty wished.\" \"Then the people will say the same. Show me.\"\nWe will audit both the accounts and the work itself. This can be pursued alongside the Provincial Reporting System."
 HOK_KOR_am_execution_registers:0 "Unified Court Administration"
 HOK_KOR_am_execution_registers_desc:0 "\"The offices may bear different names, but they serve one throne.\"\nCombining reports and audits will strengthen Court Administration to tier II. Other national spirits remain in place."
 HOK_KOR_am_petition_calendar:0 "Petitions to the Throne"
 HOK_KOR_am_petition_calendar_desc:0 "\"Your Majesty, I shall send them back to the authorities.\"\n\"Did they not come here because they found no answer there? Read it.\"\nWe will hear the people's petitions and devote funds to relief and reconstruction."
 HOK_KOR_am_granary_ledgers:0 "Relief and Welfare Budget"
 HOK_KOR_am_granary_ledgers_desc:0 "The imperial family's benevolence must reach distant communities as grain and roofs over their heads. Relief grain and welfare funds will be administered together, linking food provision with construction and repairs."
 HOK_KOR_am_relief_dispatches:0 "Relief Procedures"
 HOK_KOR_am_relief_dispatches_desc:0 "\"Do not keep the people waiting for their next meal while you ask my wishes yet again.\"\nRegular procedures for requesting and delivering relief will reduce delays caused by waiting for an imperial order."
 HOK_KOR_am_regimental_returns:0 "Regimental Muster Checks"
 HOK_KOR_am_regimental_returns_desc:0 "\"I have heard of your loyalty. Now show me the men you will command.\"\nWe will compare regimental service records with actual formations. Existing units and the doctrine benefits of military reform remain in place."
 HOK_KOR_am_nco_examinations:0 "Practical NCO Training"
 HOK_KOR_am_nco_examinations_desc:0 "\"I know your family's loyalty. How would you manoeuvre this squad?\"\nField skills will take precedence over ancestry in establishing Military Professionalisation I for the imperial forces."
 HOK_KOR_am_reserve_cadre:0 "Reserve Cadre Register"
 HOK_KOR_am_reserve_cadre_desc:0 "\"Will my name remain after I leave the service?\" \"The imperial family does not forget such experience.\"\nWe will carry that experience into reserve command and infantry equipment research. This can be pursued alongside NCO training."
 HOK_KOR_am_mobilization_review:0 "Comprehensive Mobilisation Exercise"
 HOK_KOR_am_mobilization_review_desc:0 "\"His Majesty wishes to see units moving, not men saluting.\"\nA joint test of NCOs and the reserve cadre register will ensure that an imperial decree leads to actual mobilisation."
 HOK_KOR_am_technical_memorials:0 "Technical Memorials to the Throne"
 HOK_KOR_am_technical_memorials_desc:0 "\"Did I ask whether the prose observed the proper forms, or whether the machine worked?\"\nThe court will examine technical memorials from mines and factories to support industrial research."
 HOK_KOR_am_civil_service_practicum:0 "Field Placements for Officials"
 HOK_KOR_am_civil_service_practicum_desc:0 "\"We are here on His Majesty's business, not to show off our robes.\"\nOfficials will receive training in the field, bringing knowledge of electronics into administration."
 HOK_KOR_am_merit_registers:0 "Professional Technocracy"
 HOK_KOR_am_merit_registers_desc:0 "\"Let your talents repay the royal family's trust.\"\nWe will build a professional technical administration on research and production results. The benefits of existing institutions and national spirits remain in place."
 HOK_KOR_hw_provincial_inventory:0 "Survey the Provinces of Hwan"
 HOK_KOR_hw_provincial_inventory_desc:0 "\"I have seen the extent of the map. What is actually working on that land?\"\nThe established empire will survey the Manchurian territory it owns and fully controls, putting the findings to use in industrial research."
 HOK_KOR_hw_provision_accounts:0 "Provincial Materials Management"
 HOK_KOR_hw_provision_accounts_desc:0 "\"I did not order you to fill my warehouses. Send the supplies where they are needed.\"\nWe will unify the empire's mining and supply accounts so that raw materials and provisions reach their destinations."
 HOK_KOR_hw_inspection_circuits:0 "Imperial Provincial Inspections"
 HOK_KOR_hw_inspection_circuits_desc:0 "\"The reception is ready.\" \"And are you ready to report to His Majesty?\"\nImperial inspectors will compare provincial accounts with conditions on the ground. This can be pursued alongside materials management."
 HOK_KOR_hw_supply_returns:0 "Unified Materials Accounts"
 HOK_KOR_hw_supply_returns_desc:0 "\"My seal is one and the same. Why, then, do your figures differ?\"\nProvincial inspections and materials management will be brought into one accounting system, strengthening both mining and supply benefits."
 HOK_KOR_hw_dispatch_codes:0 "Imperial Dispatch Codes"
 HOK_KOR_hw_dispatch_codes_desc:0 "\"Convey His Majesty's wishes precisely. Do not guess at them.\"\nThe seal on a decree cannot reconcile conflicting codes. We will standardise dispatch codes between the centre, provinces and front."
 HOK_KOR_hw_courier_relays:0 "Military and Civil Liaison Handovers"
 HOK_KOR_hw_courier_relays_desc:0 "\"That was my predecessor's responsibility.\"\n\"Officials change, but an imperial order does not go off duty.\"\nLiaison handovers will include orders already sent and replies still awaited."
 HOK_KOR_hw_signal_logs:0 "Front-Line Signals Logs"
 HOK_KOR_hw_signal_logs_desc:0 "\"Even an imperial command cannot make radio waves hurry, Your Majesty.\"\nRecords of communication delays will inform electronics research. This can be pursued alongside liaison handovers."
 HOK_KOR_hw_relay_exercises:0 "Communications Network Exercise"
 HOK_KOR_hw_relay_exercises_desc:0 "\"They all report receiving their orders.\" \"Have you checked that they received the same orders?\"\nA comprehensive exercise will test handovers and signals records to strengthen the imperial communications network."
 HOK_KOR_hw_postwar_dockets:0 "Post-War Civil Administration Budget"
 HOK_KOR_hw_postwar_dockets_desc:0 "\"First see to the homes in which people will live under the imperial family's name.\"\nAfter the World Order path, we will secure a civil administration budget in peacetime. We must own and fully control our administrative bases in Gyeonggi and Manchuria."
 HOK_KOR_hw_reconstruction_priorities:0 "Reconstruction Priorities"
 HOK_KOR_hw_reconstruction_priorities_desc:0 "\"Decide whom to help first, but record the names of those who must wait as well.\"\nPriorities for repairs and civilian construction, supported by construction research, will establish Reconstruction Administration I."
 HOK_KOR_hw_civil_accountability:0 "Regular Reconstruction Administration"
 HOK_KOR_hw_civil_accountability_desc:0 "\"Leave a record of work completed, not monuments to my intentions.\"\nRegular arrangements for imperial reconstruction budgets and their execution will strengthen existing benefits to building repairs and civilian construction."
 HOK_KOR_hw_veteran_rolls:0 "Support Returning Servicemen"
 HOK_KOR_hw_veteran_rolls_desc:0 "\"My service is complete.\" \"Those who received your loyalty still have their part to fulfil.\"\nWe will support the return to civilian life and reserve training in peacetime. Existing divisions and manpower will not be removed."
 HOK_KOR_hw_demobilization_schedule:0 "A System for Returning Servicemen"
 HOK_KOR_hw_demobilization_schedule_desc:0 "\"The imperial family's promise does not end with today's audience.\"\nWe will establish permanent support for the return to civilian life and reserve training. Conscription laws and existing formations remain unchanged."
 HOK_KOR_hw_peacetime_training:0 "Peacetime Reserve Training"
 HOK_KOR_hw_peacetime_training_desc:0 "\"Do you remember your oath? Now remember how to act together.\"\nPeacetime reserve training will link experience with reinforcement. The established system will remain in place if war resumes."
 HOK_KOR_am_ordered_administration_1:0 "Court Administration I"
 HOK_KOR_am_ordered_administration_1_desc:0 "Even when a command from the throne reaches the provinces, offices do little but wait for one another's replies if no budget or responsible official has been assigned. Linking the Border Defence Council's business to provincial reports has made responsibility and deadlines clear. The court now follows progress so that an imperial order does not remain a mere line in a ledger.\n\nRemoved if the government ceases to be non-aligned."
 HOK_KOR_am_ordered_administration_2:0 "Court Administration II"
 HOK_KOR_am_ordered_administration_2_desc:0 "The court can only issue its next command if reports arriving on schedule reflect conditions on the ground. Inspectors compare the accounts with the work actually carried out and submit their findings alongside regular provincial reports. Combining reporting and audits into one system has reduced the gaps through which officials once passed responsibility and delayed imperial commands.\n\nReplaces tier I. Removed if the government ceases to be non-aligned."
 HOK_KOR_am_relief_protocol_1:0 "Relief and Welfare Administration I"
 HOK_KOR_am_relief_protocol_1_desc:0 "Even when relief grain arrives, leaving collapsed roofs and ruined workplaces untouched will leave the people waiting for aid again next season. Grain distribution and welfare reconstruction budgets are administered together, keeping people fed while their homes and workshops are repaired. These procedures turn imperial benevolence into restored local livelihoods.\n\nThe repair benefit applies to the work performed by civilian factories assigned to building repairs. Removed if the government ceases to be non-aligned."
 HOK_KOR_am_relief_protocol_2:0 "Relief and Welfare Administration II"
 HOK_KOR_am_relief_protocol_2_desc:0 "Repeated submissions of the same relief requests from each community must not delay food and reconstruction. Regular procedures for receiving requests and allocating materials and budgets allow offices to act without asking the meaning of the imperial command yet again. Permanent standards now keep relief, construction and repairs moving together.\n\nReplaces tier I. Removed if the government ceases to be non-aligned."
 HOK_KOR_am_reserve_cadre_1:0 "Military Professionalisation I"
 HOK_KOR_am_reserve_cadre_1_desc:0 "Even accurate regimental records cannot prevent training from repeating the same mistakes if the NCOs who lead soldiers in the field are unprepared. Appointments no longer depend solely on ancestry and length of service: squad leadership and practical field skills are taught through a common course. Procedures for training troops and bringing them into the battle line remain in place even when their leaders change.\n\nRemoved if the government ceases to be non-aligned."
 HOK_KOR_am_reserve_cadre_2:0 "Military Professionalisation II"
 HOK_KOR_am_reserve_cadre_2_desc:0 "Units cannot move on time if the search for reserve leaders only begins after call-up orders are issued. Cadre registers and regimental mobilisation procedures are aligned, and comprehensive exercises identify where handovers break down. Linking NCO training to the allocation of reserve personnel has turned imperial decrees into actual mobilisation.\n\nReplaces tier I. Removed if the government ceases to be non-aligned."
 HOK_KOR_am_practical_bureaucracy:0 "Professional Technocracy"
 HOK_KOR_am_practical_bureaucracy_desc:0 "Technical proposals from mines and factories will be judged only on the propriety of their prose if the officials reading them know nothing of machinery. Officials with practical field training now consider researchers' explanations alongside production results. Conditions in the workshops inform the throne's decisions, providing the practical expertise needed to sustain research and military production.\n\nRemoved if the government ceases to be non-aligned."
 HOK_KOR_hw_provision_accounts_1:0 "Imperial Materials Management I"
 HOK_KOR_hw_provision_accounts_1_desc:0 "The empire's warehouses may be full while the front waits for supplies and the mines do not know what to dispatch first. Provincial surveys and materials accounts now bring the output of mining sites and the needs of the troops into a single record. Management has begun to look beyond filling warehouses to delivering supplies where they are needed.\n\nThis is a national administrative institution. Temporary territorial losses or a change in ruling ideology alone do not remove it."
 HOK_KOR_hw_provision_accounts_2:0 "Imperial Materials Management II"
 HOK_KOR_hw_provision_accounts_2_desc:0 "When provinces report supplies in different units and to different deadlines, surplus materials and shortages of provisions can coexist within the same empire. Inspectors' findings are incorporated into standardised accounts, coordinating allocations between mines, warehouses and the front. Separate provincial returns have developed into a system that supports supply across the empire.\n\nReplaces tier I. Temporary territorial losses or a change in ruling ideology alone do not remove it."
 HOK_KOR_hw_courier_service_1:0 "Imperial Communications Network I"
 HOK_KOR_hw_courier_service_1_desc:0 "Even an intact seal cannot prevent delay while troops interpret dispatches if codes differ or replies were not handed over by the previous official. Codes and liaison handovers between the centre, provinces and units have been brought into line. Orders already sent and answers still awaited are passed on together, allowing the army to prepare its next move.\n\nThese benefits concern military communications and do not change diplomatic or faction rules. Remains in place when the ruling ideology changes."
 HOK_KOR_hw_courier_service_2:0 "Imperial Communications Network II"
 HOK_KOR_hw_courier_service_2_desc:0 "A report that the messenger has arrived does not establish whether units have understood the same instructions. Signals logs and comprehensive exercises test the transmission, acknowledgement and reply to orders together. A system that maintains contact through changes of personnel allows decisions and movement at the front to continue.\n\nReplaces tier I and remains in place when the ruling ideology changes."
 HOK_KOR_hw_civil_recovery_1:0 "Post-War Reconstruction Administration I"
 HOK_KOR_hw_civil_recovery_1_desc:0 "Even after the guns fall silent, ruined workshops and missing materials prevent residents from earning their living. Reconstruction requests and budgets are organised, and labour and materials allocated to building repairs and civilian construction. Procedures established in peacetime have begun turning a list of ruins into actual building work.\n\nRenewed war prevents new starts on the related focuses but does not remove the established institution. Remains in place when the ruling ideology changes."
 HOK_KOR_hw_civil_recovery_2:0 "Post-War Reconstruction Administration II"
 HOK_KOR_hw_civil_recovery_2_desc:0 "If every project must request a fresh budget and compete for the same materials, reconstruction does little more than revisit places already repaired. Regular schedules and allocations keep the remaining repairs and civilian construction moving together. An administration created after the war now manages continuing reconstruction beyond individual projects.\n\nReplaces tier I. Renewed war or a change in ruling ideology alone does not remove it."
 HOK_KOR_hw_reserve_training_1:0 "Returning Servicemen and Reserve Training I"
 HOK_KOR_hw_reserve_training_1_desc:0 "As returning servicemen each resume their livelihoods, the experience gained at the front can scatter with them. Support for their return to civilian life is linked to reserve training through instructors and written records. This peacetime system preserves the skills needed to train the next units after their holders leave active service.\n\nDoes not remove existing divisions or manpower. Renewed war or a change in ruling ideology alone does not remove it."
 HOK_KOR_hw_reserve_training_2:0 "Returning Servicemen and Reserve Training II"
 HOK_KOR_hw_reserve_training_2_desc:0 "Names on a register do not, by themselves, allow reserve troops to act together. Regular training shares returning servicemen's experience and teaches the procedures and communications needed to rejoin a unit. A system linking the return to civilian life with reserve training carries those skills through to the next mobilisation.\n\nReplaces tier I. Existing manpower and units are retained. Renewed war or a change in ruling ideology alone does not remove it."
