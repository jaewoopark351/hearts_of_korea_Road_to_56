l_english:
 #20260922_kpopmodder: Describe the compact fascist procurement module, preserved company orders and bounded paid programs.
 HOK_KOR_nrsc_procurement_board:0 "군수조달 실무정비"
 HOK_KOR_nrsc_procurement_board_desc:0 "재벌에 내린 기존 주문을 군수조달 담당 조직이 함께 관리하도록 실무를 정비합니다. 기업별 주문 권한을 유지하면서 계약의 원가와 납기를 감독할 행정 기반을 마련합니다."
 HOK_KOR_nrsc_contract_audits:0 "군수계약 원가심사"
 HOK_KOR_nrsc_contract_audits_desc:0 "군수계약의 원가 산정과 집행 실적을 대조하여 낭비와 생산 차질을 줄입니다. 기존 기업과 생산시설을 활용하는 계약 감독으로 군수공장의 산출을 높입니다."
 HOK_KOR_nrsc_delivery_schedules:0 "군수 납기 조정"
 HOK_KOR_nrsc_delivery_schedules_desc:0 "주문 물량과 공정별 납기를 대조하여 군수품 인도 계획을 정비합니다. 산업 기술의 도입을 지원하고, 긴급 납품 또는 원자재 계약조정 중 필요한 사업을 선택해 운영합니다."
 HOK_KOR_nrsc_supply_contracts:0 "통합 군수계약 체계"
 HOK_KOR_nrsc_supply_contracts_desc:0 "원가심사와 납기조정의 결과를 통합하여 계약 감독을 정례화합니다. 군수공장 산출의 기존 혜택을 강화하고 원자재 부족에 따른 생산 손실을 줄이며, 재벌별 주문 사업은 유지합니다."
 HOK_KOR_nrsc_procurement_oversight_1:0 "군수계약 감독 I"
 HOK_KOR_nrsc_procurement_oversight_1_desc:0 "기존 군수계약의 원가와 이행 실적을 감독하여 군수공장 산출을 높입니다. 파시즘 정부를 잃으면 제거됩니다."
 HOK_KOR_nrsc_procurement_oversight_2:0 "군수계약 감독 II"
 HOK_KOR_nrsc_procurement_oversight_2_desc:0 "원가와 납기를 통합 관리하여 군수공장 산출의 혜택을 강화하고 자원 부족에 따른 생산 불이익을 줄입니다. I단계를 대체하며 파시즘 정부를 잃으면 제거됩니다."
 HOK_KOR_nrsc_emergency_deliveries_project:0 "긴급 군수납품"
 HOK_KOR_nrsc_emergency_deliveries_project_desc:0 "군수계약의 납품 일정을 집중 관리하여 군수공장 생산량 §G+15%§!를 사업 기간에만 적용합니다. 생산 중인 장비의 산출을 지원하며 장비를 즉시 지급하는 사업은 아닙니다.\n\n정치력 §Y150§!을 사용하고 민간공장은 점유하지 않습니다. §Y90일§! 동안 지속되며, 종료 또는 취소 후 모든 군수계약 사업에 §Y90일§!의 공통 대기시간이 적용됩니다. 파시즘 정부 상실, 항복, 내전 또는 해당 경로 상실 시 취소되며 정치력은 환급되지 않습니다."
 HOK_KOR_nrsc_material_contracts_project:0 "원자재 계약조정"
 HOK_KOR_nrsc_material_contracts_project_desc:0 "원자재 계약의 배정과 인도 시기를 조정하여 자원 부족에 따른 생산 불이익 §G-20%§!를 사업 기간에만 적용합니다. 자원 생산량이나 수입 계약 자체를 변경하지 않으며 자원 소모량 감소와는 다른 효과입니다.\n\n정치력 §Y150§!을 사용하고 민간공장은 점유하지 않습니다. §Y90일§! 동안 지속되며, 종료 또는 취소 후 모든 군수계약 사업에 §Y90일§!의 공통 대기시간이 적용됩니다. 파시즘 정부 상실, 항복, 내전 또는 해당 경로 상실 시 취소되며 정치력은 환급되지 않습니다."
 HOK_KOR_fascist_procurement_programs:0 "구국군 군수계약 사업"
 HOK_KOR_fascist_procurement_programs_desc:0 "기존 재벌 주문의 납기와 원자재 계약을 보강하는 기간제 사업입니다. 납기 조정을 완료하면 원가심사보다 먼저 운영할 수 있습니다. 각 사업은 정치력 150을 쓰며 민간공장을 점유하지 않습니다. 효과는 진행 중인 90일 동안만 적용되고, 동시에 하나만 실행할 수 있습니다. 종료 또는 취소 후 90일 동안 모든 군수계약 사업의 재착수를 기다려야 합니다. 기존 기업별 주문 사업은 그대로 유지됩니다."
 HOK_KOR_fascist_procurement_no_active_program_tt:0 "다른 구국군 군수계약 사업을 진행하고 있지 않음"
 HOK_KOR_fascist_procurement_cooldown_finished_tt:0 "이전 구국군 군수계약 사업의 종료 또는 취소 후 90일이 지남"
 HOK_KOR_fascist_procurement_program_start_tt:0 "정치력 §Y150§!을 사용하여 §Y90일§! 동안 선택한 군수계약 사업의 효과를 적용합니다. 민간공장은 사용하지 않습니다. 동시에 다른 군수계약 사업을 실행할 수 없으며, 종료 또는 취소 후 §Y90일§! 동안 재착수할 수 없습니다. 취소 시 정치력은 환급되지 않습니다."
 HOK_KOR_fascist_procurement_program_end_tt:0 "군수계약 사업의 효과가 끝납니다. 모든 구국군 군수계약 사업은 §Y90일§! 동안 재착수할 수 없습니다. 정치력은 환급되지 않습니다."
