l_english:
#20260926_kpopmodder: Use escaped ASCII dialogue quotes and compact decision UI text; preserve gameplay and explicit lifecycle warnings.
#20260926_kpopmodder: Compact new focus descriptions for the fixed-height UI; preserve gameplay and non-focus localisation.
#20260926_kpopmodder: Restore fictional NRSC command and conscription black comedy while preserving all gameplay rules.
#20260925_kpopmodder: Rewrite focus, decision and event prose with grounded voices; preserve keys, gameplay rules and paired Korean text.
 #20260922_kpopmodder: Describe the compact fascist procurement module, preserved company orders and bounded paid programs.
 HOK_KOR_nrsc_procurement_board:0 "군수조달 실무정비"
 HOK_KOR_nrsc_procurement_board_desc:0 "\"계약을 따냈군요.\"\n\"지정되신 겁니다.\"\n기존 기업별 주문 권한은 유지하되 구국군의 조달 조직이 원가와 납기를 함께 감독하겠습니다."
 HOK_KOR_nrsc_contract_audits:0 "군수계약 원가심사"
 HOK_KOR_nrsc_contract_audits_desc:0 "\"관행적인 부대비용입니다.\"\n\"어느 부대입니까?\"\n원가표와 실제 투입을 대조해 기존 생산시설의 낭비와 차질을 줄이겠습니다."
 HOK_KOR_nrsc_delivery_schedules:0 "군수 납기 조정"
 HOK_KOR_nrsc_delivery_schedules_desc:0 "\"노력하면 납기를 맞춥니다.\"\n\"노력은 방금 승인됐습니다.\"\n공정과 납기를 맞추고 기술을 도입합니다. 긴급 납품·원자재 계약조정 사업을 엽니다."
 HOK_KOR_nrsc_supply_contracts:0 "통합 군수계약 체계"
 HOK_KOR_nrsc_supply_contracts_desc:0 "\"서류마다 설명은 다른데 책임자는 같군요.\"\n원가·납기·원료 감독을 통합해 산출과 부족 대응을 강화합니다. 기존 재벌별 주문은 유지합니다."
 HOK_KOR_nrsc_procurement_oversight_1:0 "군수계약 감독 I"
 HOK_KOR_nrsc_procurement_oversight_1_desc:0 "기존 군수계약의 원가와 이행 실적을 감독하여 군수공장 산출을 높입니다. 파시즘 정부를 잃으면 제거됩니다."
 HOK_KOR_nrsc_procurement_oversight_2:0 "군수계약 감독 II"
 HOK_KOR_nrsc_procurement_oversight_2_desc:0 "원가와 납기를 통합 관리하여 군수공장 산출의 혜택을 강화하고 자원 부족에 따른 생산 불이익을 줄입니다. I단계를 대체하며 파시즘 정부를 잃으면 제거됩니다."
 HOK_KOR_nrsc_emergency_deliveries_project:0 "긴급 군수납품"
 HOK_KOR_nrsc_emergency_deliveries_project_desc:0 "\"언제 다시 오십니까?\" \"다시 오지 않습니다. 여기서 기다리겠습니다.\"\n납기를 독촉해 군수 생산을 늘립니다. 장비를 즉시 지급하지는 않습니다."
 HOK_KOR_nrsc_material_contracts_project:0 "원자재 계약조정"
 HOK_KOR_nrsc_material_contracts_project_desc:0 "\"강재가 부족합니다.\" \"배정을 다시 짜십시오.\"\n원료 부족에 따른 생산 손실을 줄입니다. 자원 생산량, 수입 계약, 자원 소모량은 바꾸지 않습니다."
 HOK_KOR_fascist_procurement_programs:0 "구국군 군수계약 사업"
 HOK_KOR_fascist_procurement_programs_desc:0 "\"계약은 끝났는데요.\" \"이행은 시작도 안 했습니다.\"\n납기 조정 중점으로 해금하며 원가심사를 먼저 마칠 필요는 없습니다. 기존 기업별 주문은 유지됩니다.\n사업당 정치력 150, 민간공장 점유 없음. 90일간 하나만 운영하며 종료/취소 후 이 분류 전체가 90일간 대기합니다."
 HOK_KOR_fascist_procurement_no_active_program_tt:0 "다른 구국군 군수계약 사업을 진행하고 있지 않음"
 HOK_KOR_fascist_procurement_cooldown_finished_tt:0 "이전 구국군 군수계약 사업의 종료 또는 취소 후 90일이 지남"
 HOK_KOR_fascist_procurement_program_start_tt:0 "정치력 §Y150§!, 민간공장 점유 없음. 효과는 §Y90일§!간 적용됩니다.\n군수계약 사업 중 하나만 진행. 종료/취소 후 이 분류 전체가 §Y90일§!간 재착수 불가합니다.\n파시즘 정부/경로 상실, 항복/내전 시 취소되며 비용은 환급되지 않습니다."
 HOK_KOR_fascist_procurement_program_end_tt:0 "사업 효과 종료. 모든 군수계약 사업은 §Y90일§!간 재착수 불가하며 비용은 환급되지 않습니다."
