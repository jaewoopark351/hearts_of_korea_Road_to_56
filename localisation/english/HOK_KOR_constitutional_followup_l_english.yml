#20260926_kpopmodder: Use escaped ASCII dialogue quotes and compact decision UI text; preserve gameplay and explicit lifecycle warnings.
#20260926_kpopmodder: Compact new focus descriptions for the fixed-height UI; preserve gameplay and non-focus localisation.
#20260925_kpopmodder: Rewrite focus, decision and event prose with grounded voices; preserve keys, gameplay rules and paired Korean text.
#20260923_kpopmodder: Localise constitutional policy modules and national-spirit stages in the existing paired Korean-text contract.
 HOK_KOR_cm_parliamentary_questions:0 "정례 대정부 질문"
 HOK_KOR_cm_parliamentary_questions_desc:0 "\"폐하께서 허락하셨습니다.\"\n\"집행하신 분께 묻고 있습니다.\"\n대신이 의회에 출석하여 예산의 쓰임을 설명하게 하겠습니다."
 HOK_KOR_cm_countersigned_orders:0 "부서명령 책임서명"
 HOK_KOR_cm_countersigned_orders_desc:0 "군주의 재가 곁에 담당 대신의 서명을 남기겠습니다. 이름을 쓰는 사람이 명령을 검토하고, 집행에도 책임져야 합니다."
 HOK_KOR_cm_ministerial_reports:0 "내각 정보행정"
 HOK_KOR_cm_ministerial_reports_desc:0 "같은 공사를 두고 부처마다 다른 숫자를 내놓아서는 안 됩니다. 보고와 통신을 맞추어 의회와 내각이 같은 현실을 보게 하겠습니다."
 HOK_KOR_cm_cabinet_confidence:0 "책임내각의 정착"
 HOK_KOR_cm_cabinet_confidence_desc:0 "의회의 질문에 답할 자료와 책임질 이름을 갖췄습니다. 내각은 약속뿐 아니라 집행 결과로 신임을 구해야 합니다."
 HOK_KOR_cm_court_clerks:0 "국민 법률구조망"
 HOK_KOR_cm_court_clerks_desc:0 "\"억울한 사정은 알겠소. 소장은 누가 써 주었소?\"\n글과 돈이 없다는 이유로 법정에서 돌아서지 않도록 법률구조망을 세우겠습니다."
 HOK_KOR_cm_public_legal_notices:0 "노사 분쟁 조정"
 HOK_KOR_cm_public_legal_notices_desc:0 "노동자는 품삯을, 기업은 납기를 잃고 있습니다. 분쟁 조정과 현장 협의로 닫힌 작업장 문을 다시 열 길을 찾겠습니다."
 HOK_KOR_cm_rural_legal_aid:0 "지방 순회재판"
 HOK_KOR_cm_rural_legal_aid_desc:0 "재판을 받으러 떠난 동안 논밭은 누가 돌봅니까. 순회재판과 상담 창구가 먼 고을까지 찾아가도록 하겠습니다."
 HOK_KOR_cm_appeal_docket:0 "권리구제 제도화"
 HOK_KOR_cm_appeal_docket_desc:0 "재판관이 떠난 뒤에도 권리를 물을 곳은 남아야 합니다. 노사 조정과 순회재판을 상설 제도로 정착시키겠습니다."
 HOK_KOR_cm_public_patronage:0 "황실 공익후원"
 HOK_KOR_cm_public_patronage_desc:0 "황실의 이름을 내건 구호라면 쓰임도 설명할 수 있어야 합니다. 후원금을 민생사업에 배분하고 사적인 은전과 구분하겠습니다."
 HOK_KOR_cm_municipal_clinics:0 "시군 진료지원"
 HOK_KOR_cm_municipal_clinics_desc:0 "후원은 전달식이 끝난 뒤에도 이어져야 합니다. 가까운 진료소와 구호망을 마련해 병을 숨기다 생계까지 잃는 일을 줄이겠습니다."
 HOK_KOR_cm_welfare_accounts:0 "공익시설 개선기금"
 HOK_KOR_cm_welfare_accounts_desc:0 "새 간판 뒤의 낡은 진료기구부터 바꾸겠습니다. 기금의 쓰임을 공개하고, 공익시설을 수리하고 유지할 기술도 갖추겠습니다."
 HOK_KOR_cm_allied_observers:0 "연합군 훈련 참관"
 HOK_KOR_cm_allied_observers_desc:0 "육군은 도착 시각을, 해군은 신호를, 공군은 지원 요청을 적습니다. 세 군의 기록을 맞추며 연합훈련을 배우겠습니다. 세력 가입이 필요합니다."
 HOK_KOR_cm_bilingual_manuals:0 "합동훈련 교범 번역"
 HOK_KOR_cm_bilingual_manuals_desc:0 "\"같은 신호를 듣고 다른 방향으로 가면 안 됩니다.\"\n참관 기록을 한국군 교범으로 옮겨 외국 부대와 용어·신호를 맞추겠습니다."
 HOK_KOR_cm_liaison_rotation:0 "순환 연락장교"
 HOK_KOR_cm_liaison_rotation_desc:0 "지휘부의 계획을 일선에, 일선의 사정을 지휘부에 전하겠습니다. 연락장교를 순환 배치하며, 세력에 참여하는 동안 제도를 유지합니다."
 HOK_KOR_cm_responsible_cabinet_1:0 "책임내각 I"
 HOK_KOR_cm_responsible_cabinet_1_desc:0 "의회의 신임과 대신의 책임서명에 기반한 내각입니다. 정책 집행과 정치 고문 등용을 지원합니다."
 HOK_KOR_cm_responsible_cabinet_2:0 "책임내각 II"
 HOK_KOR_cm_responsible_cabinet_2_desc:0 "책임서명과 정보행정이 결합해 내각의 정책 추진력을 높였습니다."
 HOK_KOR_cm_accessible_justice_1:0 "국민 권리구제 I"
 HOK_KOR_cm_accessible_justice_1_desc:0 "경제력과 거리에 관계없이 법률구조에 접근할 수 있도록 지원합니다."
 HOK_KOR_cm_accessible_justice_2:0 "국민 권리구제 II"
 HOK_KOR_cm_accessible_justice_2_desc:0 "노사 조정과 지방 순회재판을 정착시켜 생활 분쟁의 부담을 줄이고 제도에 대한 신뢰를 높입니다."
 HOK_KOR_cm_public_welfare_1:0 "황실 공익후원 I"
 HOK_KOR_cm_public_welfare_1_desc:0 "공개된 공익후원으로 생활 위기에 놓인 주민을 지원합니다."
 HOK_KOR_cm_public_welfare_2:0 "황실 공익후원 II"
 HOK_KOR_cm_public_welfare_2_desc:0 "생활 지원에 시군 진료망을 더해 민생 부담을 덜어 줍니다."
 HOK_KOR_cm_allied_liaison:0 "연합군 연락체계"
 HOK_KOR_cm_allied_liaison_desc:0 "순환 연락장교가 한국군과 연합군의 지휘 협력 및 작전 준비를 지원합니다. 민주정부 또는 세력 가입 상태를 잃으면 해제됩니다."
