#20261003_kpopmodder: Explain new decision and spirit policies through concrete circumstances; preserve gameplay and lifecycle rules.
#20260926_kpopmodder: Use escaped ASCII dialogue quotes and compact decision UI text; preserve gameplay and explicit lifecycle warnings.
#20260926_kpopmodder: Compact new focus descriptions for the fixed-height UI; preserve gameplay and non-focus localisation.
#20260925_kpopmodder: Rewrite focus, decision and event prose with grounded voices; preserve keys, gameplay rules and paired Korean text.
#20260923_kpopmodder: Localise constitutional policy modules and national-spirit stages in the existing paired Korean-text contract.
 HOK_KOR_cm_parliamentary_questions:0 "Regular Questions to Ministers"
 HOK_KOR_cm_parliamentary_questions_desc:0 "\"His Majesty gave his consent.\"\n\"I am asking the person who carried it out.\"\nMinisters will attend parliament to explain how public money has been spent."
 HOK_KOR_cm_countersigned_orders:0 "Ministerial Countersignatures"
 HOK_KOR_cm_countersigned_orders_desc:0 "The responsible minister's signature will stand beside the monarch's approval. Whoever signs must scrutinise the order and answer for its execution."
 HOK_KOR_cm_ministerial_reports:0 "Cabinet Information Services"
 HOK_KOR_cm_ministerial_reports_desc:0 "Different ministries must not produce conflicting figures for the same construction project. Coordinated reports and communications will give parliament and the cabinet the same view of the situation."
 HOK_KOR_cm_cabinet_confidence:0 "An Accountable Cabinet"
 HOK_KOR_cm_cabinet_confidence_desc:0 "We now have the evidence to answer parliament's questions and the names of those responsible. The cabinet must earn confidence through the results of its work as well as its promises."
 HOK_KOR_cm_court_clerks:0 "Public Legal Aid Network"
 HOK_KOR_cm_court_clerks_desc:0 "\"I understand your grievance. Who drafted your claim?\"\nWe will establish a legal aid network so that a lack of literacy or money does not turn people away from the courts."
 HOK_KOR_cm_public_legal_notices:0 "Mediation in Labour Disputes"
 HOK_KOR_cm_public_legal_notices_desc:0 "Workers are losing wages and businesses are missing delivery dates. Mediation and talks in the workplace will seek a way to reopen the factory gates."
 HOK_KOR_cm_rural_legal_aid:0 "Travelling Courts"
 HOK_KOR_cm_rural_legal_aid_desc:0 "Who tends the fields while their owners travel to court? Travelling courts and advice services will reach even the most distant communities."
 HOK_KOR_cm_appeal_docket:0 "Lasting Access to Legal Redress"
 HOK_KOR_cm_appeal_docket_desc:0 "People must still have somewhere to turn to defend their rights after the judge has left. Labour mediation and travelling courts will become permanent institutions."
 HOK_KOR_cm_public_patronage:0 "Imperial Public Welfare Patronage"
 HOK_KOR_cm_public_patronage_desc:0 "Relief offered in the imperial family's name must account for how it is used. We will allocate donations to welfare projects and distinguish them from personal favours."
 HOK_KOR_cm_municipal_clinics:0 "Local Medical Support"
 HOK_KOR_cm_municipal_clinics_desc:0 "Patronage must continue after the presentation ceremony. Local clinics and relief networks will help prevent people from concealing illness until it costs them their livelihood."
 HOK_KOR_cm_welfare_accounts:0 "Public Welfare Facilities Fund"
 HOK_KOR_cm_welfare_accounts_desc:0 "We will start by replacing the worn-out medical equipment behind the new sign. The fund's spending will be made public, and we will develop the expertise to repair and maintain public welfare facilities."
 HOK_KOR_cm_allied_observers:0 "Observe Allied Training"
 HOK_KOR_cm_allied_observers_desc:0 "The army records arrival times, the navy records signals, and the air force records requests for support. Comparing the three services' records will help us learn from allied exercises. Faction membership is required."
 HOK_KOR_cm_bilingual_manuals:0 "Translate Joint Training Manuals"
 HOK_KOR_cm_bilingual_manuals_desc:0 "\"The same signal must not send us in different directions.\"\nWe will incorporate our observers' records into Korean military manuals, aligning our terminology and signals with those of foreign units."
 HOK_KOR_cm_liaison_rotation:0 "Rotating Liaison Officers"
 HOK_KOR_cm_liaison_rotation_desc:0 "We will relay headquarters' plans to the front and conditions at the front to headquarters. Liaison officers will serve on rotation, and the system will remain in place while we belong to a faction."
 HOK_KOR_cm_responsible_cabinet_1:0 "Accountable Cabinet I"
 HOK_KOR_cm_responsible_cabinet_1_desc:0 "When an order arrives without identifying the minister responsible, there is no one to answer for failures in its execution. Ministers now countersign the monarch's approval, and parliament can question how the budget is spent. The cabinet must answer for its results while appointing the people it needs and pursuing its policies.\n\nRemoved if the government ceases to be democratic."
 HOK_KOR_cm_responsible_cabinet_2:0 "Accountable Cabinet II"
 HOK_KOR_cm_responsible_cabinet_2_desc:0 "If different ministries produce conflicting figures for the same construction project, neither parliament nor the cabinet can judge how the work is going. Regular reporting and communications are now linked to ministerial countersignatures, identifying both who issued an order and how far it has been carried out. With evidence to answer questions and named ministers to accept responsibility, the cabinet can pursue policy consistently.\n\nReplaces tier I. Removed if the government ceases to be democratic."
 HOK_KOR_cm_accessible_justice_1:0 "Access to Legal Redress I"
 HOK_KOR_cm_accessible_justice_1_desc:0 "Even a recognised grievance leaves rights confined to paper if there is no one to draft a claim or no money to bring it to court. Legal aid offices put residents' accounts into writing and guide them through the process. The system is intended to prevent poverty and distance from denying people the chance to defend their rights.\n\nRemoved if the government ceases to be democratic."
 HOK_KOR_cm_accessible_justice_2:0 "Access to Legal Redress II"
 HOK_KOR_cm_accessible_justice_2_desc:0 "Workplaces close while wages and delivery dates are disputed, and local livelihoods suffer while people travel to distant courts. Labour mediation and travelling courts are now linked to the legal aid network, bringing ways to resolve disputes closer to where people live. Advice and legal redress remain available after the judge has left.\n\nReplaces tier I. Removed if the government ceases to be democratic."
 HOK_KOR_cm_public_welfare_1:0 "Imperial Public Welfare Patronage I"
 HOK_KOR_cm_public_welfare_1_desc:0 "Relief offered in the imperial family's name cannot keep people fed if it ends with a presentation ceremony. Spending is made public, and households facing hardship are connected to welfare support. Sustained patronage, distinguished from personal favours, gives residents a basis for rebuilding their livelihoods.\n\nRemoved if the government ceases to be democratic."
 HOK_KOR_cm_public_welfare_2:0 "Imperial Public Welfare Patronage II"
 HOK_KOR_cm_public_welfare_2_desc:0 "Donations alone are not enough for people who conceal illness until they lose their jobs and livelihoods. Local clinics and support networks are now connected, with arrangements for the continuing maintenance of ageing public welfare facilities. Imperial patronage has developed from a single act of relief into everyday care within the community.\n\nReplaces tier I. Removed if the government ceases to be democratic."
 HOK_KOR_cm_allied_liaison:0 "Allied Liaison System"
 HOK_KOR_cm_allied_liaison_desc:0 "When the same signal sends units in different directions, a joint operation goes awry from the very first move. Observers' records are incorporated into Korean military manuals, while rotating liaison officers relay headquarters' plans and conditions at the front in both directions. Shared terminology and reporting procedures prepare us to operate alongside allied forces.\n\nRemoved if the government ceases to be democratic or the country leaves its faction."
