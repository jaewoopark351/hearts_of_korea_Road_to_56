l_english:
 #COUNTRY EVENTS FOR KOREA
 kor_events.0.t:0 "대한민국의 상황"
 kor_events.0.d:0 "1906년, 조선 팔도를 폐허로 만들어 놓은 한일러 전쟁 종전 이후, 구 제국의 시체 위에 태어난 한민족 역사상 최초이자 아시아 최초의 민주공화국 대한민국은 지난 30여년간 발전해 왔습니다. \n\n열강들 사이에서의 아슬아슬한 줄타기 속에 근대화와 경제성장의 과실은 국민들의 삶의 질을 크게 개선했으며, 유럽에서 대전쟁이 터지자, 우리는 중립을 지키고 백인들이 자기들끼리 피흘리며 싸우는 사이 그들에게 물자를 판매하고 노동자들을 보내 돈을 벌었으며, 대부분의 불평등 조약들을 개정하고 초보적인 수준의 재벌과 자본주의가 출현했습니다. 또한, 경제성장과 근대화, 민주주의를 양분으로 민권운동과 여권신장운동, 그리고 봉건주의적 악폐습 폐지운동 역시 활발히 전개되었습니다. \n\n그러나, 대공황 이후 상황이 달라졌습니다. 서울 증권거래소가 조기 폐장당하고, 수많은 기업과 공장들이 파산하고, 많은 국민들이 한순간에 실업자로 전락했으며, 대한민국의 모든 번영은 신기루와 같이 사라졌습니다. \n\n대공황 이후 사회 혼란이 가중되어가는 가운데, 1931년 5월 18일, 사회주의 성향이 강해 \"조선의 모스크바\"라 불리던 대구에서 음식과 일자리, 의사, 그리고 이승만의 하야를 요구하는 비폭력 시민 불복종 운동이 벌어지자, 이승만 정권은 대통령의 하야를 요구하는 이 20만명의 \"빨갱이\" 시위대를 남녀노소 모두 전차부대로 짓이겼습니다. \n\n대구사회화운동의 유혈진압 이후, 이 시위의 배후로 지목된 여운형의 대한사회민주당과 박헌영의 조선노동당은 강제 해산되었으며, 민주주의가 크게 위축되고 사회 분위기가 경직되어가는 가운데, 민주주의자들은 자유-독립당 연정의 이름 아래에 민주주의를 수호하려 하지만, 이제 극단주의 정치 세력들 막기에는 버거워 보입니다. \n\n한편 일본은 다롄 조차지를 통해 만주로 진공해서 만주에 자신들의 괴뢰국을 세우고 팔굉일우와 대동아공영권이라는 이름 아래에 한일러 전쟁의 복수와 우리에 대한 정복욕을 숨기지 않고 있지만, 국제연맹은 아무런 행동도 취하지 않고 있으며, 유럽인들은 자신들의 문제에 집중하느라 바쁘고, 중국인들은 자기들끼리 싸우느라 바쁘며, 미국인들은 고립주의적인 행보를 이어가며 그 누구도 우릴 도와줄 것 같지는 않습니다. \n\n과연 대한민국이, 다음 10년 뒤에도 무사히 독립을 유지할 수 있을까요?"
 KOR_events.0.a:0 "기필코 지키리라."
 KOR_events.1.t:0 "한국의 평화 제안"
 KOR_events.1.d:0 "소수의 저항을 제외하고 우리는 만주의 통제권을 완전히 상실했습니다. 한국 정부는 작금의 적대 행위를 평화적으로 끝낼 것을 제안해왔습니다. 일본은 공식적으로 만주 침략을 중단하고 만주를 한국에게 할양할 것입니다. 우린 어떻게 대답해야 할까요?"
 KOR_events.1.a:0 "조약에 서명한다."
 KOR_events.1.b:0 "황군은 적에게 굴복하지 않는다!"
 KOR_events.101.t:0 "[From.GetNameDefCap]의 평화 거부"
 KOR_events.101.d:0 "만주의 모든 영토에 대한 통제권을 상실했음에도 불구하고 [From.GetLeader]는 우리의 평화 제안을 거부했습니다. 이제 일본 본토의 완벽한 정복만이 이 전쟁을 끝낼 유일한 방법인 것 같습니다."
 KOR_events.101.a:0 "바라던 바다. 완전히 끝장을 내주마!"
 kor_events.2.t:0 "대구 코뮌의 비상"
 kor_events.2.d:0 "전국 곳곳에서 모인 노조와 사회주의자, 그리고 반 이승만 세력은 오늘 점심, 몇년 전 이승만에 의해 20만 명의 무고한 시민들이 학살당한 대구에 총 집결했습니다. 우리는 기습적으로 경상북도청과 대구시청, 경북지방경찰청, 제5군관구사령부와 그 인원들을 제압하고 점령했으며, 수많은 시민들의 우레와 같은 환호성과 함께 임시인민위원회의 결성과 대구 코뮌의 건국을 선언했습니다. \n\n이승만은 우리의 행동을 '소련의 사주를 받아 대한민국을 적화하려 하는 빨갱이들의 반란'으로 규정하고 군을 동원해 이를 분쇄하겠다고 선언했으며 현재 경상도 전역에서 노농적위군과 군경이 교전중이지만, 동향 사람에게 총을 겨눌 순 없다는 이유로 대부분 순순히 항복하고 우리 편에 가담중입니다. \n\n그러나 경상도의 경계선으로 속속 이승만의 군대가 집결하고 있으며 이제 우리가 사랑하는 조국 산하를 배경으로 한 내전은 피할 수 없을 것 같습니다..."
 kor_events.2.a:0 "이승만을 몰아내자!"
 kor_events.3.t:0 "국가재건최고회의의 쿠데타"
 kor_events.3.d:0 "우리 국가재건회고회의군은 금일 새벽 일제히 행동을 개시하고 위수지역을 이탈후 서울에 진입, 경복궁과 국회의사당, 대법원, 그외 주요 관공서와 방송사를 장악했습니다. 우리는 대부분의 고관과 정치인들을 기습적으로 체포하는데 성공했지만, 이승만은 우리 군의 움직임을 미리 눈치채고 서울에서 탈출하는데 성공하고 말았습니다. \n\n이승만은 우리의 의거를 민주정부에 대한 반역이자 쿠데타로 규정하고 국가재건최고회의 소속이 아닌 군 장병들과 경찰, 그리고 시민들에게 호소해 자유대한군단에 가입해 우리와 맞서 싸울 것을 호소했습니다. 자유대한군단과 우리 군은 경기도 일대에서 대치중이며, 이미 일부 지역에선 교전이 보고되었습니다. \n\n이제 우리가 사랑하는 조국 산하를 배경으로 한 내전은 피할 수 없을 것 같습니다..."
 kor_events.3.a:0 "쥐새끼같은놈!"
 kor_events.4.t:0 "육군의 상황"
 kor_events.4.d:0 "대한민국 육군은 1906년 대한민국 건국 이래로 우리의 조국 산하를 수호해 왔으며, 우리 육군은 한일러 전쟁에서 국가 존망의 위기로부터 조국의 독립을 지켜낸 한성공화정부군의 자랑스런 적통을 그대로 계승했습니다. \n\n서울 전투와 박승환 참령의 최후의 기병돌격, 13도 창의군, 신돌석 장군과 홍범도 장군의 평안도 지연전, 그리고 이인영 원수의 남한 대토벌은 우리 육군에게 있어서 영광스런 기억이자 유산으로 남아있습니다. \n\n그러나 육군의 상황은 녹록치가 않습니다. 대전쟁 당시에도 중립으로 남아있던 우리 대한민국은 새로운 현대 전쟁에서의 전훈과 교훈을 얻지 못했고, 한일러 전쟁의 종결 이후 30여년의 평화속에 군의 실전감각은 완전히 사라졌으며, 군기는 문란해지고 신병들을 위한 기초군사훈련 역시 실탄사격이 단 한번도 없을정도로 부실해 졌습니다. \n\n설상가상으로 대공황 이후 군비 삭감으로 인해 우리 군은 수많은 숙련된 사병들과 유망한 장교들을 군 밖으로 내보내야만 했으며 남아있는 군인들도 봉급이 크게 삭감되고 군 급식은 꽁보리밥에 염장무밖에 주지 못할 정도로 크게 악화되었습니다. \n\n이러한 악조건 속에 육군 장병들의 사기와 의욕은 바람 앞의 촛불처럼 꺼져가고 있는 실정이고, 현재의 대한민국 육군의 상황에 대해 혹자는 임진왜란 직전의 조선군과 다를 바가 없는 상황이라 평하며, 현재의 대한민국 육군이 외침으로부터 조국을 수호해 낼 수 있을거라 믿는 사람은 아무도 없습니다."
 kor_events.4.a:0 "충성?"
 kor_events.5.t:0 "해군의 상황"
 kor_events.5.d:0 "대한민국 해군은 1906년 대한민국 건국 이래로 우리의 영해와 해양 주권을 수호해 왔습니다. 우리 조국은 한일러 전쟁 당시의 러시아 제국 해군과 일본제국 해군간의 재해권 싸움이 전쟁 내내 전황에 큰 영향을 끼치는 것을 지켜보면서 근대적이고 강력한 해군의 건설에 노력을 아끼지 않았습니다. \n\n한일러 전쟁 당시 구 제국의 양무호와 광제호를 잃은 이후 10여년간 해군은 연안 방어용 목선 정도만 보유했지만, 1920년대 경제 성장 이후 미국으로부터 스크랩 처리되어 보관되고 있던 클렘슨급 구축함을 저렴하게 구입하면서 근대적 해군의 초석을 마련하고, 이후 클렘슨급의 설계를 바탕으로 자체 건조한 동해급 구축함, 동해급을 바탕으로 크기를 늘리고 무장과 장갑을 강화한 이사부급 경순양함, 을지문덕급 중순양함을 자체 건조했으며 1928년 영국으로부터 퇴역 예정이던 타이거급 순양전함 한 척을 구매해 충무공 이순신함으로 재취역 시켰습니다. \n\n그러나 우리 해군은 여전히 일본제국의 강력한 해군에 비하면 한줌 수준도 되지 않으며, 대공황 이후 대규모 군비 삭감으로 인해 대양함대 건설 계획인 비전 1950은 무기한 중지되었고, 수병들의 봉급이 대폭 삭감되면서 수병들 사이에서 대전쟁 당시 제정러시아 해군과 독일제국 해군이 그랬듯이 공산주의가 널리 퍼져버렸습니다. \n\n이런 수병들의 항명을 진압하기 위해 해군 헌병들이 수병들을 개패듯이 패는 일은 일상화 되어버리고 말았으며, 군함의 부식비와 유류비를 착복하는 함장, 예비용 포신을 고철상에 팔아버리는 부사관까지 우리 해군은 조국의 자랑에서 오합지졸로 전락해버리고 말았습니다. \n\n과연 이런 우리 해군이 충무공 이순신의 뜻을 길이길이 빛낼 수 있을까요?"
 kor_events.5.a:0 "필승?"
 kor_events.6.t:0 "공군의 상황"
 kor_events.6.d:0 "대한민국 공군은 1917년 육군항공대로 시작해 1925년 공군으로 독립되어 창설된 전 세계에서 세 번째로 창설된 독립된 공군조직입니다. 공군은 그 특성상, 인원이 상대적으로 소수이며 제복군인이 아닌 임시 소집된 민간 비행사들을 주축으로 창설된 조직 특성상 상대적으로 군기가 느슨하고 삼군중 유일하게 여성이 남성 못지 않게 활약할 수 있는 군 조직입니다. 공군은 창설 이래로 서울-호놀룰루간 무착륙 비행에 성공해 전 국민적 영웅이 된 안창남 대령, 대한민국 건국 25주년 기념식 당시 여성의 몸으로 전투기를 몰고 기념식장에서 현란한 공중기동으로 단독비행해 수많은 여자아이들에게 우상이자 공군 파일럿의 꿈을 꾸게 만든 권기옥 소령까지 공군은 전 국민적인 영웅을 많이 배출하며 국민들에게 가장 사랑받던 군 조직이였습니다. \n\n그러나 대공황 이후 군축으로 인해 공군은 예정되어 있던 신형 전투기 도입 사업이 무산되면서 크게 위축되었고, 국방부 내에서는 공군을 투자대비 효율이 떨어지는 조직이라 비하하며 해체해 버려야 한다는 육군 장성들의 견제와 설상가상으로 항공유 구입 비용을 위한 예산조차도 부족하게 되었습니다. \n\n이러한 현실에 분노한 노백린 장군은 공군이야 말로 진정한 미래전장의 주인이라 주장하며 정부와 국방부에 강경한 어조로 공군에 대한 투자를 호소했지만, 그로 인해 오히려 타군의 미움을 한몸에 받게 된 노백린 장군은 이 일로 경질에 가깝게 강제 퇴역되고 말았습니다. \n\n태극을 붙인 은빛 날개들은 녹슬어가는 가운데 과연 창공을 비상하는 우리의 보라매들이 조국의 영공을 수호해 낼 수 있을까요?"
 kor_events.6.a:0 "단결?"
 kor_events.7.t:0 "HMS 타이거의 운명"
 kor_events.7.d:0 "미사용 이벤트"
 kor_events.7.a:0 "빨리 의장작업을 게시하도록!"
 kor_events.8.t:0 "우리에게 독립보장을 요청한 대한민국"
 kor_events.8.d:0 "얼마 전, 파시스트 혁명에 성공한 한국의 특명전권대사가 우리에게 자신들의 독립을 보장해 줄것을 요청해왔습니다. 그들은 대한민국 이범석 대통령의 친서와 함께 자신들의 조국이 언제 소련의 총칼에 의해 무너질 지 모르는 위태로운 상황이라고 말하며 공산주의를 혐오하는 반공 우방으로서 도와줄 것을 호소하고 있습니다. 어떻게 답변해야 할까요?"
 kor_events.8.a:0 "그들의 독립을 보장한다."
 kor_events.8.b:0 "그들의 독립은 우리의 관심사가 아니다."
 kor_events.9.t:0 "[From.GetNameDefCap]이(가) 우리의 독립을 보장하다!"
 kor_events.9.d:0 "[From.GetNameDefCap]은(는) 우리가 요청한 안전보장조약 체결 요청을 승인했으며, 덧붙여서 사악한 유대 볼셰비즘에 당당히 맞서고 있는 우리에 대한 찬사를 경의를 표했습니다. 이유야 어찌되었건, 이제 우리는 [From.GetNameDefCap]로(으로)부터 독립을 보장받게 되었으며, 조약의 효력은 지금 이 순간부터 유효합니다."
 kor_events.9.a:0 "아주 좋군."
 kor_events.10.t:0 "[From.GetNameDefCap]이(가) 우리의 독립을 보장하길 거부하다!"
 kor_events.10.d:0 "[From.GetNameDefCap]은(는) 우리가 요청한 안전보장조약 체결 요청을 거부했으며, 덧붙여서 약소국에게는 가혹한 것이 국제사회의 룰이라는 조롱을 했습니다. 이유야 어찌되었건, 이제 우리는 혼자서 우리의 조국을 지켜나가야 할 것 같습니다."
 kor_events.10.a:0 "유감스럽군. 저들이 어떻게 될지 한번 보자고."
 kor_events.11.t:0 "시베리아 양도를 요구하는 [From.GetNameDefCap]"
 kor_events.11.d:0 "[From.GetNameDefCap]는 아시아 제일의 공산국가로서 우리와 [From.GetNameDefCap]는 영원한 혈맹이기에 우리의 '짐'을 분담하고 싶다는 뜻을 전했습니다. 그들은 그들이 우리 대신 동시베리아 전역의 행정을 담당하고 그 지역을 발전 시켜주겠다고 제안했습니다. 어떻게 답변해야 할까요?"
 kor_events.11.a:0 "저들의 요구를 수용하라."
 kor_events.11.b:0 "저들의 요구를 무시하라."
 kor_events.12.t:0 "[From.GetNameDefCap]가 우리의 요구를 수락하다!"
 kor_events.12.d:0 "[From.GetNameDefCap]은 공산주의 우방으로서의 우리의 노고에 감사를 표하며, 우리의 요청을 수락한다는 뜻을 보내왔습니다. 이에 따라 현 시간부로, 공식적으로 동 시베리아 전역의 행정은 모스크바에서 서울로 이관되었습니다."
 kor_events.12.a:0 "아주 좋군."
 kor_events.13.t:0 "만주를 요구하는 [From.GetNameDefCap]"
 kor_events.13.d:0 "최근 대한민국 제2 공화국을 선언한 한국이 우리에게 만주 전역을 넘길 것을 요구하는 최후 통첩을 보내왔습니다. 그들은 만주가 과거 고구려와 발해에 의해 지배되던 자신들의 고토라고 주장하며, 덧붙여서 이미 많은 수의 한국인들이 만주에 거주중이라는 것 역시 명분으로 들었습니다. 또한 그들은 우리가 만주를 양도하지 않을 경우 직접적인 군사행동을 취할 것이라고 경고했습니다. 어떻게 답변해야 할까요?"
 kor_events.13.a:0 "저들의 요구를 수용하라."
 kor_events.13.b:0 "그들은 그들의 분수를 알 필요가 있군."
 kor_events.14.t:0 "만주는 우리의 것!"
 kor_events.14.d:0 "놀랍게도, [From.GetNameDefCap]은 우리의 위협에 굴복해 만주를 우리에게 양도하기로 결정했습니다. 저들이 우리에게 만주를 양도하는 명확한 이유는 알 수 없지만, 저들의 국가 전략상 우리와의 분쟁을 시간 낭비로 파악했을 가능성이 높습니다. 이유야 어찌되었든 이제 만주는 공식적으로 우리 대한민국에게 양도되었습니다."
 kor_events.14.a:0 "아주 좋군."
 kor_events.15.t:0 "만주 양도요구를 거부한 [From.GetNameDefCap]"
 kor_events.15.d:0 "예상한 대로, [From.GetNameDefCap]은 우리의 만주 양도 요구를 거부했으며, 우리의 요구에 대해 말도 안되는 억지일 뿐더러, 우리의 주제를 알라는 요지의 외교적 모욕을 보내왔습니다. 이제 우리가 만주를 차지할 방법은 저들와의 전쟁 뿐입니다."
 kor_events.15.a:0 "그게 무엇을 의미하는지는 잘 알고있겠지?"
 kor_events.16.t:0 "일본의 최후 통첩"
 kor_events.16.d:0 "1939년 6월 24일, 일본 외무성은 대한민국 정부에게 공식적으로 자신들의 보호령이 될 것을 요구하는 최후통첩을 보내왔습니다. 또한 우리가 24시간 내로 그들의 요구를 수용하지 않을 경우 이후에 발생할 일들은 모두 우리의 책임이라는 말까지 덧붙였습니다. 이미 한-만 국경선으로 만주군과 일본군 병력 다수가 집결중이라는 보고가 들어왔으며, 그들은 곧 우리에 대한 침공을 감행할 것으로 예상됩니다. 그들에게 어떻게 답변하시겠습니까?"
 kor_events.16.a:0 "전군에 데프콘-1 칵크트 피스톨을 발령하고 전국에 전시동원령과 계엄령을 선포하라!"
 kor_events.17.t:0 "우리의 무기를 구매하길 원하는 한국"
 kor_events.17.d:0 "최근 재무장과 군비증강을 하고 있는 한국이, 그들의 군이 사용할 무기의 부족을 이유로 우리에게 무기의 판매를 요청해 왔습니다. 저들이 필요로 하는 무기는 개인화기와 포, 지원장비이며, 우리는 치장 물자로 보관중인 30여년 전의 구형 장비를 판매하면 되기 때문에 큰 부담은 없습니다. 저들에게 어떻게 대답해야 할까요?"
 kor_events.17.a:0 "안될것 없다."
 kor_events.17.b:0 "거부하라."
 kor_events.18.t:0 "중국인의 대규모 시위"
 kor_events.18.d:0 "금일 오전 옛 만주국의 수도이자 한때 신징으로 불린 부여 광역시에서 70만여명이 참여한 것으로 추산되는 대규모 시위가 발생했습니다. \n\n시위 참가자들은 대부분 중국인이였으며, 그들은 창춘대로를 행진하며 만주독립만세를 외치고 중화민국의 청천백일만지홍기를 흔들며 한국은 만주 전역에서 철수하고 만주를 중화민국에게 반환할 것을 요구했습니다. \n\n시위는 긴급출동한 부여지방경찰청 기마경찰대와 육군 제186민사헌병여단에 의해 진압되었으며, 우리는 시위 참가자와 그 가족들을 모두 체포했습니다. 그들을 어떻게 해야 할까요?"
 kor_events.18.a:0 "그들을 모두 그들 족속이 본래 있어야하는 곳으로 추방하라."
 kor_events.19.t:0 "국내성으로 수도 이전?"
 kor_events.19.d:0 "국내성 신도시가 우리 군의 7개 공병여단과 국내의 건설사 대다수가 동원되어 벌써 완공되어가는 가운데, 국무회의에서 우리의 수도를 공식적으로 국내성으로 옮기자는 제안이 나왔습니다. \n\n국내성으로의 수도 이전은 이점도 많지만 추운 기후와 정부청사와 주요 관청들을 모두 이주시킬만한 넓은 땅이 아니라는 단점도 많습니다. 어떻게 하시겠습니까?"
 kor_events.19.a:0 "국내성시는 한 국가의 행정부를 옮기기엔 적합하지 않다."
 kor_events.19.b:0 "국내성으로 천도하라. 만주벌판이 우릴 기다린다!"
 kor_events.20.t:0 "주한 일본대사의 경고"
 kor_events.20.d:0 "오늘, 외교부 청사에서 열린 신년축하 파티에서 나카가와 겐조 주한일본대사의 발언이 큰 논란이 되고 있습니다. \n\n나카가와 대사는 우리 대한민국의 군비 확장과 더 나아가서 대한민국의 존재 자체가 일본제국의 안보와 대동아 공영의 가치에 큰 위협이 된다고 비난했으며, 충용무쌍한 황군이 조만간 이 곳을 불바다로 만들 것이라 으름장을 놓았습니다. \n\n비록 취중인 상태였다고는 하지만, 외교관의 이러한 직설적인 발언은 외교적 결례이자 우리 조국을 무시하는 행동입니다. 나카가와 대사는 금일부로 '페르소나 논 그라타'로 지정되어 일본으로 추방되었지만, 일본제국은 그 어떤 외교적 사과 없이 후임 주한일본대사는 추후에 보내겠다는 입장만을 반복하며 주한일본대사관의 인력을 감축하고 있습니다."
 kor_events.20.a:0 "말도 안되는 억지를 부리는군."
 kor_events.21.t:0 "한국인인척 하는 기묘한 독일인"
 kor_events.21.d:0 "오늘 새벽, 서울에서 우리의 계엄군 초병이 통행금지령을 어기고 썬글라스를 쓰고 한복 두루마기를 입은 한 사나이가 무단으로 계엄사령부에 들어오려 하는 것을 발견하고 그를 체포했습니다. \n\n 그 남성은 심문 결과 독일인인것으로 확인되었으며, 그는 어눌하지만 한국어를 말하고 듣는 것이 가능했습니다. 그는 자신이 얼마 전 '비열한 유대-볼셰비키들의 농간'으로 인해 조국에서 도망쳐야 했다고 주장하며, 이범석 각하와의 면담을 요구하고 있습니다. 그를 어떻게 해야 할까요?"
 kor_events.21.a:0 "그 자를 가까운 정신병원에 데려다 줘라."
 kor_events.21.b:0 "고요한 아침의 나라에 오신것을 환영합니다 김틀어 선생님...!"
 kor_events.22.t:0 "몽골의 복종을 요구하는 한국"
 kor_events.22.d:0 "오늘 오전 주몽골한국대사는 우리에게 그들의 보호국이 될 것을 요구해왔습니다. 주몽한국대사는 우리에게 우리와 같은 약소국은 자주 독립을 지킬 것이 어려우니 한국의 \"보호\"를 받아야 한다고 주장했으며, 요구가 거부될 시 군사행동을 감행하겠다는 것까지 서슴없이 말했습니다. 어떻게 답변하시겠습니까?"
 kor_events.22.a:0 "그들의 요구를 수용하라."
 kor_events.22.b:0 "그들의 요구를 거부하라."
 kor_events.23.t:0 "우리에게 굴복한 몽골"
 kor_events.23.d:0 "예상한 대로, 몽골은 우리의 요구를 수락하기로 결정했습니다. 이제 몽골은 우리의 보호령이 되었습니다."
 kor_events.23.a:0 "아주 좋군."
 kor_events.24.t:0 "우리의 요구를 거부한 몽골"
 kor_events.24.d:0 "놀랍게도, 몽골은 우리의 요구에 대해 터문이 없는 주장이라고 일축하며, 우리가 그들의 영토를 원한다면 힘으로 뺏어야 한다고 말했습니다."
 kor_events.24.a:0 "그게 뭘 의미하는지는 잘 알고 있겠지?"
 kor_events.25.t:0 "한국의 산둥반도 양도요구"
 kor_events.25.d:0 "오늘 대한민국 외교부로부터 우리에게 산둥반도 전역을 99년간 조차지로 내놓을 것을 요구했습니다. 그들은 우리의 산둥반도가, 과거 그들의 국가였던 백제가 지배한 땅이라고 주장하며, 우리가 거부할 경우 어떤 일이 벌어지든 그 책임은 우리에게 있다고 위협했습니다. 어떻게 대답해야 할까요?"
 kor_events.25.a:0 "그들의 요구를 수용하라."
 kor_events.25.b:0 "그들의 요구를 거부하라."
 kor_events.26.t:0 "우리의 요구를 수용한 중국"
 kor_events.26.d:0 "오늘 중화민국 외교부에서 우리의 산둥반도 양도 요구를 받아들이겠다는 전보를 보내왔습니다. 이에 따라, 공식적으로 우리 대한은 산둥반도를 99년간 조차지로 양도 받게 되었으며, 해당 지역의 행정은 우리에게 이양되었습니다."
 kor_events.26.a:0 "아주 좋군."
 kor_events.27.t:0 "우리의 요구를 거부한 중국"
 kor_events.27.d:0 "오늘 중화민국 외교부에서 우리의 요구는 말도 안되는 주장이라고 일축했으며, 그들을 우리에게 단 한뼘의 땅도 양도할 생각이 없음을 분명히 했습니다. 이제 우리가 산둥반도, 더 나아가 중국대륙 전체를 차지하기 위해서는 전쟁만이 유일한 해법으로 보입니다."
 kor_events.27.a:0 "그게 뭘 의미하는지는 잘 알고 있겠지?"
 kor_events.28.t:0 "한국의 연해주 양도요구"
 kor_events.28.d:0 "최근 만주를 차지한 대한민국이 우리에게 연해주를 양도할 것을 공식적으로 요구해왔습니다. 그들은 연해주에 많은 수의 한국인들이 이미 살고있으며, 연해주는 그들 국가의 '동등한 구성원'인 만주족의 고토이기에, 우리가 연해주를 차지하고 있는 것은 민족 자결주의에 어긋난다는 억지를 부렸습니다. 또한 그들은 우리가 연해주를 양도하지 않을 경우 전쟁도 불사하지 않겠다고 했습니다. 그들의 요구에 어떻게 답변하시겠습니까?"
 kor_events.28.a:0 "그들의 요구를 수용하라."
 kor_events.28.b:0 "그들의 요구를 거부하라."
 kor_events.29.t:0 "우리의 요구를 수용한 [From.GetNameDefCap]"
 kor_events.29.d:0 "[From.GetNameDefCap]은(는) 현명하게도 우리와의 분쟁이 무익하다고 느꼈는지 동의했으며, 덧붙여서 우리 대한민국과 [From.GetNameDefCap]의 평화와 우호는 양국을 위해서 앞으로도 계속 되어야 한다고 밝혔습니다."
 kor_events.29.a:0 "아주 좋군."
 kor_events.30.t:0 "우리의 요구를 거부한 [From.GetNameDefCap]"
 kor_events.30.d:0 "[From.GetNameDefCap]은(는) 우리의 요구가 말도 안되는 것이라 일축했으며, [From.GetNameDefCap]는 단 한뼘의 땅도 우리에게 넘길 의사가 없음을 밝혔습니다. 이제 우리가 연해주를 차지하기 위해서는 전쟁만이 유일한 해답인 것으로 보입니다."
 kor_events.30.a:0 "그게 뭘 의미하는지는 잘 알고 있겠지?"
 kor_events.31.t:0 "티베트에게 복종을 요구하는 한국"
 kor_events.31.d:0 "오늘 오전 주티베트한국대사는 우리에게 그들의 보호국이 될 것을 요구해왔습니다. 주티베트한국대사는 우리에게 우리와 같은 약소국은 자주 독립을 지킬 것이 어려우니 보호를 받아야 한다고 주장했으며, 요구가 거부될 시 군사행동을 감행하겠다는 것까지 서슴없이 말했습니다. 어떻게 답변하시겠습니까?"
 kor_events.31.a:0 "그들의 요구를 수용하라."
 kor_events.31.b:0 "그들의 요구를 거부하라."
 kor_events.32.t:0 "우리에게 굴복한 티베트"
 kor_events.32.d:0 "예상한 대로, 티베트는 우리의 요구를 수락하기로 결정했습니다. 이제 티베트는 우리의 보호령이 되었습니다."
 kor_events.32.a:0 "아주 좋군."
 kor_events.33.t:0 "우리의 요구를 거부한 티베트"
 kor_events.33.d:0 "놀랍게도, 티베트는 우리의 요구에 대해 터문이 없는 주장이라고 일축하며, 우리가 그들의 영토를 원한다면 힘으로 뺏어야 한다고 말했습니다."
 kor_events.33.a:0 "그게 뭘 의미하는지는 잘 알고 있겠지?"
 kor_events.34.t:0 "한국의 자유국가기구 창설 제안"
 kor_events.34.d:0 "오늘 점심, 워싱턴 DC의 주미한국대사 장면은 우리 대통령 앞으로 대한민국의 대통령이 작성한 한 편의 친서를 가져왔습니다. 친서의 내용은 일찍이 채결한 한미상호방위조약을 확대 개편해 자유세계의 평화와 안보를 위한 새로운 군사동맹 창설에 대한 내용이였으며, 대한민국과 미합중국의 공식적인 동맹을 제안하는 내용이였습니다. 이 결정은 일본제국을 분노하게 하겠지만, 한반도는 지정학적으로 우리가 아시아로 진출하기 위한 좋은 요충지입니다. 어떻게 해야 할까요?"
 kor_events.34.a:0 "좋은 생각이군."
 kor_events.34.b:0 "우리는 먼로주의에 따라 구대륙에 간섭하지 않는다."
 kor_events.35.t:0 "우리의 제안에 찬성한 미국"
 kor_events.35.d:0 "코델 헐 미합중국 국무부 장관은 우리의 제안이 양국에게 매우 유익하며, 우리와 그들간의 군사동맹은 전 세계의 자유와 민주주의를 지키는 새로운 축이 될 것이라 찬사했습니다. 그는 이미 대통령의 재가를 받았으며, 의회의 형식적인 동의만 마친다면 바로 조약을 비준할 수 있을 것이라 밝혔습니다."
 kor_events.35.a:0 "최고의 결말이군."
 kor_events.36.t:0 "우리의 제안을 거부한 미국"
 kor_events.36.d:0 "미합중국은 우리의 새로운 군사동맹 창설 제안에 대해 자신들은 먼로주의의 원칙에 의거해 구 대륙에 간섭하지 않는다는 점을 명확히 재확인하며, 우리의 군사동맹 창설 제안을 거부했습니다. 우리는 우리 혼자의 힘으로 조국을 지켜야 할 것 같습니다."
 kor_events.36.a:0 "유감스럽군."
 kor_events.37.t:0 "몽강에게 복종을 요구하는 한국"
 kor_events.37.d:0 "오늘 오전 한국에서 온 외교관은 우리에게 그들의 보호국이 될 것을 요구해왔습니다. 그는 우리에게 우리와 같은 약소국은 자주 독립을 지킬 것이 어려우니 보호를 받아야 한다고 주장했으며, 요구가 거부될 시 군사행동을 감행하겠다는 것까지 서슴없이 말했습니다. 어떻게 답변하시겠습니까?"
 kor_events.37.a:0 "그들의 요구를 수용하라."
 kor_events.37.b:0 "그들의 요구를 거부하라."
 kor_events.38.t:0 "우리에게 굴복한 몽강"
 kor_events.38.d:0 "예상한 대로, 몽강국은 우리의 요구를 수락하기로 결정했습니다. 이제 공식적으로 몽강국은 우리의 보호령이 되었습니다."
 kor_events.38.a:0 "아주 좋군."
 kor_events.39.t:0 "우리의 요구를 거부한 몽강"
 kor_events.39.d:0 "놀랍게도, 몽강국은 우리의 요구에 대해 터문이 없는 주장이라고 일축하며, 우리가 그들의 영토를 원한다면 힘으로 뺏어야 한다고 말했습니다."
 kor_events.39.a:0 "그게 뭘 의미하는지는 잘 알고 있겠지?"
 kor_events.40.t:0 "한국의 공산혁명 지원?"
 kor_events.40.d:0 "최근 한국의 대구에서 공산 혁명이 일어났습니다. 이 혁명은 지금까지 한국에서 일어난 공산 혁명 중 가장 큰 규모라고 하며, NKVD 한국지부에 따르면 그들은 한국의 정부군과 막상막하로 싸우고 승산이 보인다고 합니다. \n\n우리가 그들의 혁명을 돕는다면, 우리는 아시아에서 우리와 함께 할 친구를 얻게 될 것입니다. 그들을 도우시겠습니까?"
 kor_events.40.a:0 "저들을 지원한다."
 kor_events.40.b:0 "저들을 무시한다."
 kor_events.41.t:0 "우리의 혁명을 지원하는 소비에트 연방!"
 kor_events.41.d:0 "고맙게도, 소비에트 연방은 부르주아 독재로부터 싸우고 있는 우리의 용기에 경의를 표하며, 우리가 필요로 하는 많은 수의 군수물자를 부산항을 통해 보내주었습니다. 해당 무기들은 이미 부산항에서 하역을 마쳤으며, 전선에서 싸우고 있는 노농적위군에게 분배되는 것을 기다리고 있습니다."
 kor_events.41.a:0 "고맙소. 고맙소 동무들."
 kor_events.42.t:0 "우리황실사랑회"
 kor_events.42.d:0 "한일러 전쟁과 을사정변 이후, 이 땅의 정당한 주인이셨던 광무제께서 구라파 덕이기 땅에서 숨을 거두신지 어언 20여년이 지났습니다. 가증스런 공화주의자들에 의해 먼 타국에서 황제께서 숨을 거둔 후, 근황주의 세력은 완전히 매장되었으며, 그 누구도 우리의 주장을 진지하게 들어주지 않고 있습니다. 그러나, 단군신앙을 기초로 하는 태백교의 교주 계연수가 이끄는 우리황실사랑회는 이에 굴복하지 않고 이 땅의 정당한 황제를 다시 모시기 위해 노력을 다하고 있습니다. 언젠가는 이런 노력이 성과를 거둘 것을 굳게 믿으며, 전주에 계신 제국의 황태자이신 이은 저하에 대한 굳은 충성심은 오늘도 계속되고 있습니다."
 kor_events.42.a:0 "상제여 황제를 보우하소서!"
 kor_events.43.t:0 "즉위식 장소 선정?"
 kor_events.43.d:0 "이제 황제께서 다시 정당한 이 나라의 황제가 될 준비가 모두 끝났지만, 아직 즉위식을 어디서 치루어야 할 지는 팽팽한 의견대립으로 인해 결정되지 못하고 있습니다. \n\n 태백교의 교주이자 우리황실사랑회의 회장인 계연수는 옛 조선왕실의 정궁이자, 구 대한민국의 대통령 집무실로 쓰이던 경복궁에서 태백교의 방식으로 즉위식을 치루길 원하지만, 즉위 당사자인 이은 황태자 저하께서는 자신이 카톨릭의 세례를 받은 카톨릭 신자로서, 카톨릭의 예법에 따라 명동성당에서 아드리앙 조셉 라리보 대주교의 집전 아래에 서구식 즉위식을 하길 원하고 계십니다. 어떻게 해야 할까요?"
 kor_events.43.a:0 "계연수는 참으로 복받은 자이다. 그가 시키는 대로 해라."
 kor_events.43.b:0 "나는 엄연한 카톨릭 교도다! 나의 즉위식은 명동성당에서 진행될 것이다."
 kor_events.45.t:0 "대한민국의 한미상호방위조약 체결 제안"
 kor_events.45.d:0 "오늘 아침, 워싱턴 DC 주재 대한민국대사관의 특명전권대사 장면이 백악관을 방문해 대한민국 대통령 명의의 친서를 가져왔습니다. 해당 친서의 내용에는 한미상호방위조약 체결 제안에 관한 내용이였습니다. 한국은 극동의 약소국으로, 우리와 마찬가지로 일본의 확장주의에 경계하고 있는 국가이지만, 우리와 한국간의 상호방위조약은 일본 군부와 우리 국내의 고립주의자들을 자극할 것입니다. 어떻게 하시겠습니까?"
 kor_events.45.a:0 "좋은 생각이다. 한반도는 우리가 일본과 소련을 견제할 좋은 전략적 요충지가 될것이다."
 kor_events.45.b:0 "우리는 먼로주의에 따라 구대륙에 간섭하지 않는다."
 kor_events.46.t:0 "미합중국의 한미상호방위조약 동의"
 kor_events.46.d:0 "오늘 점심, 주미한국대사 장면은 미 국무부로부터 한미상호방위조약 채결 동의를 확인받았습니다. 이에 따라, 현 시간 부로 우리와 미국간의 상호방위조약이 채결되었고, 조약은 이미 효력을 발휘하고 있습니다."
 kor_events.46.a:0 "우리의 후손들은 앞으로 여러 세대에 걸쳐 이 조약으로 혜택을 받을것이다."
 kor_events.47.t:0 "미합중국의 한미상호방위조약 거부"
 kor_events.47.d:0 "오늘 저녁, 주미한국대사관에서 보내온 전보에 따르면, 미국은 우리가 제안한 한미상호방위조약에 대해 별 다른 관심이 없었으며, 이를 완곡하게 거절한 것으로 확인되었습니다. 이제 우리는 우리 혼자의 힘으로 조국을 지켜야 할 것 같습니다.."
 kor_events.47.a:0 "안돼..."
 kor_events.48.t:0 "우리에게 구축함을 구매하길 원하는 대한민국"
 kor_events.48.d:0 "오늘 아침, 대한민국의 주영한국대사관 특명전권대사 안재홍은 다우닝가 10번지로 대한민국 대통령의 친서를 가져왔습니다. 해당 친서의 내용은 한국군의 유럽파병을 위한 호위함대 구성을 위해 필요한 구축함을 판매해달라는 내용이였습니다. 그들에게 구축함을 판매하시겠습니까?"
 kor_events.48.a:0 "안될것 없다."
 kor_events.48.b:0 "절대 안돼!"
 kor_events.49.t:0 "영국의 구축함 판매 동의"
 kor_events.49.d:0 "고맙게도, 영국은 우리의 구축함 구매 제안을 승인했으며, 추가로 우리의 사정을 고려한 영국은 구축함의 대금은 30년에 걸쳐 무이자 소액으로 상환하는 안을 제시했습니다. 우리가 구매한 영국제 구축함은 총 5척으로, 해당 함선들은 약 30일 후에 인천항에 도착할 예정입니다."
 kor_events.49.a:0 "정말 잘됐군."
 kor_events.50.t:0 "영국의 구축함 판매 거부"
 kor_events.50.d:0 "안타깝게도, 영국은 우리의 구축함 구매 제안을 거부했습니다. 이제 우리 군의 유럽전선 파병 호위를 위해서는 직접 추가 호위함을 건조하는 방법밖엔 없습니다."
 kor_events.50.a:0 "저것들이 동맹 맞나?"
 kor_events.51.t:0 "영국제 구축함의 도착"
 kor_events.51.d:0 "오늘 아침, 평소와는 달리 부산항 건선거에는 다수의 인파와 평소에는 보이지 않던 구축함 5척이 눈에 띄었습니다. 해당 구축함은 우리가 한 달 전에 구매한 영국제 구축함들로, 이제 현 시간부로 대한민국 해군 소속으로 재취역할 예정입니다.\n\n취역식에서 해당 구축함의 함급은 '한강급'으로 결정되었으며, 함명은 각각 ROKS 한강, ROKS 압록, ROKS 두만, ROKS 영산, ROKS 소양으로 명명되었습니다."
 kor_events.51.a:0 "우리 해군의 전력이 크게 증강되었군!"
 kor_events.52.t:0 "맥아더를 보내주길 원하는 대한민국"
 kor_events.52.d:0 "오늘 오후, 주미한국대사관에서 우리 국무부에 군인 한 명을 파병해 달라는 요청을 보내왔습니다. 그 대상은 얼마 전까지 우리 미합중국의 육군참모총장이였으나, 루스벨트 대통령과의 불화로 인해 해임되고 필리핀 자치령군 원수로 좌천된 맥아더 장군으로, 그들은 맥아더에게 한국군의 지휘를 맡길 것으로 보입니다. \n\n맥아더 장군 본인은 정부의 명령만 있으면 언제든지 바로 마닐라에서 한국으로 향하는 비행기에 탑승해 한국에서의 임무를 수행하는 것에 대해 따르겠다고 알려왔습니다. 어떻게 해야 할까요?"
 kor_events.52.a:0 "그 퇴물을 한국에게 보내주어라."
 kor_events.52.b:0 "맥아더에겐 나중에 다시 큰 일을 시킬 것이다. 거부하라."
 kor_events.53.t:0 "미국의 맥아더 파견 수락"
 kor_events.53.d:0 "오늘 아침, 미국은 맥아더를 한국에 파견하는 안에 대해 동의했으며, 동시에 그를 예비역에서 현역으로 복귀시키고 명목상의 미 극동군 사령관과 주한미군 사령관직을 맡겼습니다. 맥아더 장군은 미국정부의 명을 받자마자 여객기를 타고 한국의 여의도 비행장에 도착했으며, 비행장에서의 기자 회견에서 자신의 부친이자, 명예훈장 수훈자인 아서 맥아더의 이름을 걸고 우리 군을 정예화된 강군으로 키우기 위해 위해 최선을 다하겠다고 밝혔습니다."
 kor_events.53.a:0 "그를 환영하라."
 kor_events.54.t:0 "미국의 맥아더 파견 거부"
 kor_events.54.d:0 "오늘 점심, 미 국무부 및 미합중국 육군은 맥아더 예비역 대장의 한국 파견에 대해 거부했습니다. 맥아더 본인은 대통령 각하께 전보로, 비록 지금은 한국과 함께 할 수 없어서 아쉽지만 언젠가는 함께 싸울 것임을 믿어 의심치 않는다는 내용을 보내온 것으로 확인되었습니다."
 kor_events.54.a:0 "아쉬운 일이군."
 kor_events.55.t:0 "한국의 ABCDFK 포위망 제안"
 kor_events.55.d:0 "한국은 일본의 침략전쟁과 군수물자 생산을 막기 위해 일본에 대한 주변국의 전면적 금수조치를 제안했습니다. 우리 외에도 일본 인근 국가들이 해당 제안을 받은 것으로 보입니다. 어떻게 하시겠습니까?"
 kor_events.55.a:0 "당연히 참가한다."
 kor_events.55.b:0 "우리는 일본을 자극해선 안된다!"
 kor_events.56.t:0 "자유국가기구의 연합국 통합 제안"
 kor_events.56.d:0 "미국과 한국이 주축이 되어 결성된 자유국가기구는 오늘 아침, 연합국 전체의 자유국가기구 기입을 권유했습니다. 자유국가기구의 가입은 미국의 도움을 받을 수 있는 절호의 기회이지만, 동시에 연합국의 주도권을 미국에 빼앗길 우려가 있습니다. 어떻게 하시겠습니까?"
 kor_events.56.a:0 "좋은 생각이군!"
 kor_events.56.b:0 "우리는 태평양에까지 개입할 생각은 없다."
 kor_events.57.t:0 "영국의 자유국가기구 합류 동의"
 kor_events.57.d:0 "다행이도, 영국은 자유국가기구의 합류에 동의했습니다. 연합국의 기존 회원국들은 아직 입장을 정하지 못했지만, 대부분 영국을 따라 자유국가기구에 합류할 것으로 보입니다."
 kor_events.57.a:0 "이제 다른 연합국들의 의사를 물어본다."
 kor_events.58.t:0 "자유국가기구 합류을 거부한 [From.GetNameDefCap]"
 kor_events.58.d:0 "[From.GetNameDefCap]는 자유국가기구 확대에 대해 터문이 없는 제안이라고 일축하며 함께 하기를 거부했습니다. 우리는 그들과 함께할 수 없을 것 같습니다."
 kor_events.58.a:0 "유감이군."
 kor_events.59.t:0 "자유국가기구의 연합국 통합 제안"
 kor_events.59.d:0 "미국과 한국이 주축이 되어 결성된 자유국가기구는 오늘 아침, 연합국 전체의 자유국가기구 기입을 권유했습니다. 자유국가기구의 가입은 미국의 도움을 받을 수 있는 절호의 기회이지만, 동시에 연합국의 주도권을 미국에 빼앗길 우려가 있습니다. 영국은 이미 그들과 함께하기로 결정했습니다. 어떻게 하시겠습니까?"
 kor_events.59.a:0 "영국이 이미 그들과 함께한다면 우리도 그들에게 합류해야한다."
 kor_events.59.b:0 "거부하라."
 kor_events.60.t:0 "[From.GetNameDefCap]의 자유국가기구 합류 동의"
 kor_events.60.d:0 "[From.GetNameDefCap]은(는) 자유국가기구에 합류하기로 결정했습니다. 이제 우리와 그들은 생사를 함께 할 것입니다."
 kor_events.60.a:0 "우리는 함께 자유와 민주주의를 지킬 것이다!"
 kor_events.61.t:0 "자유국가기구가 보호를 제안하다!"
 kor_events.61.d:0 "오늘 아침, 자유국가기구는 우리 국가를 보호해 줄 것을 제안했으며, 그 대가로 그들이 바라는 것은 우리가 자유국가기구의 회원국이 되는 것입니다. 어떻게 하시겠습니까?"
 kor_events.61.a:0 "좋은 생각이다. 우리도 함께 하겠다."
 kor_events.61.b:0 "거부하라."
 kor_events.62.t:0 "인도차이나 연방의 독립을 요구하는 한국"
 kor_events.62.d:0 "오늘 오후, 한국이 인도차이나 식민지의 즉각적인 독립과 식민지인들의 자유선거로 구성된 과도정부의 설립을 요구해왔습니다. 그들은 우리의 식민지 통제력 약화를 지적하고, 현지 식민지인들의 도움으로 군대를 증강할 수 있다는 장점등을 제시하며 우리의 선택을 압박하고 있습니다. 어떻게 하시겠습니까?"
 kor_events.62.a:0 "그들의 요구를 수락하라."
 kor_events.62.b:0 "식민지는 우리의 생명선이다! 거부하라!"
 kor_events.63.t:0 "해협식민지의 독립을 요구하는 한국"
 kor_events.63.d:0 "오늘 오후, 한국이 해협식민지의 즉각적인 독립과 식민지인들의 자유선거로 구성된 과도정부의 설립을 요구해왔습니다. 그들은 우리의 식민지 통제력 약화를 지적하고, 현지 식민지인들의 도움으로 군대를 증강할 수 있다는 장점등을 제시하며 우리의 선택을 압박하고 있습니다. 어떻게 하시겠습니까?"
 kor_events.63.a:0 "그들의 요구를 수락하라."
 kor_events.63.b:0 "식민지는 우리의 생명선이다! 거부하라!"
 kor_events.64.t:0 "필리핀 자치령의 완전독립을 요구하는 한국"
 kor_events.64.d:0 "오늘 오후, 한국이 필리핀의 즉각적인 독립과 식민지인들의 자유선거로 구성된 과도정부의 설립을 요구해왔습니다. 그들은 우리의 식민지 통제력 약화를 지적하고, 현지 식민지인들의 도움으로 군대를 증강할 수 있다는 장점등을 제시하며 우리의 선택을 압박하고 있습니다. 어떻게 하시겠습니까?"
 kor_events.64.a:0 "그들의 요구를 수락하라."
 kor_events.64.b:0 "식민지는 우리의 생명선이다! 거부하라!"
 kor_events.65.t:0 "네덜란드령 동인도의 독립을 요구하는 한국"
 kor_events.65.d:0 "오늘 오후, 한국이 동인도 식민지의 즉각적인 독립과 식민지인들의 자유선거로 구성된 과도정부의 설립을 요구해왔습니다. 그들은 우리의 식민지 통제력 약화를 지적하고, 현지 식민지인들의 도움으로 군대를 증강할 수 있다는 장점등을 제시하며 우리의 선택을 압박하고 있습니다. 어떻게 하시겠습니까?"
 kor_events.65.a:0 "그들의 요구를 수락하라."
 kor_events.65.b:0 "식민지는 우리의 생명선이다! 거부하라!"
 kor_events.66.t:0 "식민지의 즉각 독립을 승인한 [From.GetNameDefCap]!"
 kor_events.66.d:0 "[From.GetNameDefCap]는 우리의 식민지 해방 요구와 해당 지역 토착 현지인들의 자유선거로 구성된 임시과도정부의 설립을 인정하며, 우리 대한이 해당 식민지인들의 신정부를 관리감독하는 것에 대해 동의했습니다. 이젠 그들은 우리의 보호하에 진정한 자유와 민주를 쟁취할 것입니다."
 kor_events.66.a:0 "현명한 판단이군."
 kor_events.67.t:0 "식민지의 독립을 거부한 [From.GetNameDefCap]"
 kor_events.67.d:0 "[From.GetNameDefCap]는 우리의 식민지 해방요구에 대해 말도 안되는 주장이라고 일축하며, 식민지를 포기하는 일은 절대 없을 것이라고 못박았습니다. 향후 미래에 그들과 식민지 사이에 벌어질 미래에 대해서는 이제 알 수 없습니다..."
 kor_events.67.a:0 "유감스럽군."
 kor_events.68.t:0 "자유국가기구 확대"
 kor_events.68.d:0 "우리와 대한민국 사이에 자유국가기구가 설립된 이후, 수 많은 잠재적인 회원국들이 우리에게 자유국가기구 가입을 타진하고 있습니다. 이번 기회에, 우리의 우방 약소민주국가들에게 자유국가기구에 참여 여부에 대해 물어보는 것이 좋을 것 같습니다."
 kor_events.68.a:0 "그래. 우리와 함께할만한 모든 잠재적인 회원국들에게 접촉하라."
 kor_events.68.b:0 "아니, 우리와 한국정도면 충분하다."
 kor_events.69.t:0 "1941년 제8대 대통령 선거"
 kor_events.69.d:0 "1906년 서재필의 대한민국 건국 이후 5년마다 치루어지는 대통령 선거의 날이 드디어 왔습니다. 2차 한일전쟁 개전 이후 전시상황이라는 특성상 이번 대선은 생략될 수도 있었으나, 현 대통령인 김구 대통령은 민주공화정의 우월성을 적에게 선전하고 국민들에게 자신의 재신임 여부를 물어서 향후의 국정동력으로 삼기 위해 이번 대선을 정상적으로 치르고 대선에 출마할 것이라 밝혔습니다. 김구 대통령에 맞서는 후보는 자유당의 안창호 후보로, 그는 김구 대통령의 독자노선형 강경 대외 정책을 '구 조선의 흥선대원군식 고립주의를 따라하는 대한민국 역사상 최악의 외교 참사' 라고 비판하며, 이번 전쟁에서의 조국의 승리를 위해 자유 우방들과의 더 적극적인 연대를 요구하고 있습니다. \n\n전선의 군 장병들은 야전에 마련된 임시 투표소에서 이미 부재자 사전투표를 마쳤고, 후방의 시민들도 하나 둘씩 투표소에서 나오는 가운데, 이 선거에서 독립당이 승리할지 자유당이 역전의 승리를 보여줄지에 대한 여부를 선택할 수 있습니다."
 kor_events.69.a:0 "이럴 때일수록 단결해야 한다. 백범의 독립당은 5년 더한다!"
 kor_events.69.b:0 "자유당의 도산 안창호야말로 우리에게 필요한 대통령이다."
 kor_events.70.t:0 "1941년 제8대 대통령 선거"
 kor_events.70.d:0 "1906년 서재필의 대한민국 건국 이래로 5년마다 치루어지는 대통령 선거의 날이 드디어 왔습니다. 대한민국 대통령 선거가 시작된 이후 그 어떤 대통령도 네 번이나 연임하지 못했습니다만, 불안정한 세계의 상태와 최근 일어난 사건들을 고려할때 이승만 대통령은 이번에도 전통을 부수고 네 번째 대선 출마를 강행했습니다. 이에 맞서는 후보는 독립당의 안창호 후보로, 그는 본디 자유당 소속이였으나, 이승만의 4연임 시도와 1931년 대구사회화운동 유혈진압, 그리고 재벌 친화적 정책등을 이유로 현 대통령을 '권력에 눈이 멀은 빌어먹을 독재자'라고 공개적으로 비난했으며, 자유당에서 탈당 후 독립당으로 이적해 이번 대선후보로 출마했습니다. \n\n이 선거에서 자유당이 승리할지 독립당이 정권교체를 보여줄지에 대한 여부를 선택할 수 있습니다."
 kor_events.70.a:0 "우남 이승만 각하는 영원한 우리의 대통령이시다!"
 kor_events.70.b:0 "독립당의 도산 안창호야말로 우리에게 필요한 대통령이다."
 kor_events.71.t:0 "1946년 제9대 대통령 선거"
 kor_events.71.d:0 "1906년 서재필의 대한민국 건국 이래로 5년마다 치루어지는 대통령 선거의 날이 이번에도 어김없이 찾아왔습니다. 현 대통령 [Root.GetLeader](은)는 육신의 노쇠와 민주공화정 전통의 수호를 이유로 대선 불출마 및 정계은퇴를 선언했으며, 이번 대선은 단군 이래 가장 치열한 대선이 될 것 같습니다. \n\n이번 대선의 주요 대선후보는 총 세명으로, 자유당 소속의 깨끗한 사생활로 유명하며 중산층의 큰 지지를 얻고 있는 현직 서울특별시장 윤보선 후보, 폐주 이명복의 둘째 아들이자 구 제국의 황족 신분으로 무술민변 이전부터 서재필과 협력한 공화주의자로써 여성들과 보수주의자들의 큰 지지를 받고 있는 현 독립당 최고위원 이강 후보, 그리고 저명한 사민주의자로서 1920년대 초 김규식 전 대통령의 밑에서 부통령을 지냈고 대구사회화운동 이후 가택연금에 처해졌지만 최근 석방되어 신한사회민주당을 창당하고 정계에서 돌풍을 일으키고 있는 신사민당의 당수 여운형 후보 이렇게 셋입니다. \n\n많은 사람들이 아직도 대한민국 민주주의의 미래를 결정짓는 이 선거에 대해 고민하고 있습니다..."
 kor_events.71.a:0 "대한민국은 도덕선생님 윤보선을 원한다!"
 kor_events.71.b:0 "시민 이강이야말로 충성스런 대한국민의 일꾼이다!"
 kor_events.71.c:0 "노동자와 농민들의 친구, 몽양 선생님이 대한의 대통령이시다!"
 kor_events.72.t:0 "1941년 제8대 대통령 선거"
 kor_events.72.d:0 "1906년 서재필의 대한민국 건국 이래로 5년마다 치루어지는 대통령 선거의 날이 드디어 왔습니다. 현 대통령인 김구 대통령은 최근 언론과의 인터뷰에서 대통령직 연임을 위한 대선 출마를 선언한 가운데 이에 맞서는 후보는 자유당의 안창호 후보로, 그는 김구 대통령의 독자노선형 강경 대외 정책을 조만간 조국의 아들들을 죽음의 전장으로 끌고갈 위험한 발상이라고 비판하며, 조국의 평화와 독립을 지키기 위해 자유 우방들과의 더 적극적인 연대를 요구하고 있습니다. \n\n시민들이 하나 둘씩 투표를 마치고 투표소에서 나오는 가운데, 이 선거에서 독립당이 승리할지 자유당이 역전의 승리를 보여줄지에 대한 여부를 선택할 수 있습니다."
 kor_events.72.a:0 "백범의 독립당은 5년 더한다!"
 kor_events.72.b:0 "자유당의 도산 안창호야말로 우리에게 필요한 대통령이다."
 
 
 

 #NEWS EVENTS FOR KOREA
 newsk.1.title:0 "만주의 굴욕"
 newsk.1.desc:0 "오늘 [KOR.GetLeader]와 [JAP.GetLeader] 사이에 평화 조약이 체결되어 양국 간의 적대 행위가 종결되었습니다. 일본은 만주국을 해산하고 만주를 공식적으로 한국에게 할양하기로 결정했습니다. \n\n만주국의 전 황제인 아이신기오로 푸이는 만주의 한 비행장에서 만주국의 해산을 선언하고 일본으로 망명하려 했으나 한국군에게 포로로 잡혔습니다. \n\n한국은 고구려의 부활을 선언하고 공식적으로 만주를 자국의 행정구역에 통합했습니다. 중화민국은 이 결정에 대해 강한 반발과 함께 국제연맹에 제소했으나 국제연맹은 침묵을 유지했습니다."
 newsk.1.a:0 "이것이 극동의 평화를 의미할까?"
 newsk.1.b:0 "두고보자 조센징들아!"
 newsk.1.c:0 "[KOR.GetNameDef] 만세!"
 newsk.1.d:0 "고려봉자들을 우리의 땅 만주에서 몰아내야 한다!"
 newsk.2.title:0 "한국 내전"
 newsk.2.desc:0 "오늘 대공황 이후 혼란에서 벗어나지 못하고 있는 한국에서 내전이 발생했다는 소식이 들어왔습니다. 내전은 이승만의 정부군과 대구 사회화 운동의 복수를 위해 일어나 반 이승만과 공산주의 이념을 가치로 하는 대구 코뮌간의 싸움이며, 이들은 각각 서로가 생각하는 미래의 조국을 만들기 위한 투쟁에 들어갔습니다. \n\n이유야 어찌 되었건 결과적으로 대한민국은 내전 상태에 들어갔으며, 한반도에 무수한 피가 뿌려질 것은 확실해 보입니다."
 newsk.2.a:0 "극동에서 사회주의 혁명이라고? 신선하군."
 newsk.2.b:0 "이승만을 몰아내자!"
 newsk.3.title:0 "한국 내전"
 newsk.3.desc:0 "대공황 이후 내리막길을 걷고 있는 한국에서 내전이 발발한 것은 결코 놀라운 일이 아닙니다. 오늘 새벽, 독일 유학파 출신 군인 이범석이 이끄는 군내 사조직 국가재건최고회의는 쿠데타를 시도, 수도를 장악해 군사혁명위원회를 조직했으며, 이승만 대통령은 간신히 서울에서 탈출, 대한자유군단을 결성하고 이범석의 반란을 진압하려 하고 있습니다. \n\n결과적으로 대한민국은 내전 상태에 들어갔으며, 한반도에 무수한 피가 뿌려질 것은 확실해 보입니다."
 newsk.3.a:0 "흥미롭군."
 newsk.3.b:0 "대한민국 만세! 궐기군 만세!"
 newsk.4.title:0 "발해 연방의 탄생"
 newsk.4.desc:0 "대한민국은 만주를 정복한 이래로, 자신들의 옛 역사적 국가인 발해의 연고를 이유로 해당 지역에 대한 종주권을 포기하진 않았지만, 만주 현지인들에게 강력한 유화 정책을 펼쳤으며, 포용적이고 개방적인 이민 정책으로 전 세계의 핍박받는 이들에게 코리안 드림이라는 이름으로 만주로의 이민을 장려했습니다. \n\n이에 따라 대한민국은 이제 한반도와 만주 6개의 민족을 모두 대변할 수 있는 새로운 국명으로 국명을 개칭할 것을 선언했으며, 이제 그들은 발해 연방으로 국명을 개칭할 것이라 발표했습니다. \n\n발해 연방의 다음 행보는 아직 의문이지만, 극동의 새로운 강대국의 탄생에 전 세계가 그 귀추를 숨죽여 지켜보고 있습니다."
 newsk.4.a:0 "극동의 새로운 강대국의 탄생인가?"
 newsk.4.b:0 "기고만장하기 짝이 없군."
 newsk.4.c:0 "대한민국 만세! 발해 연방 만세!"
 newsk.4.d:0 "만주는 우리 중화의 것이다..."
 newsk.5.title:0 "도쿄 함락"
 newsk.5.desc:0 "오늘 일본제국의 수도, 도쿄가 한국군에 의해 함락되었습니다. 그동안 단 한번도 외세에 의해 점령되지 않았던 도쿄는 최초로 외세에 의해 점령되었으며 도시에서 근위사단을 주축으로 한 수비군의 격렬한 저항에도 불구하고, 한국군은 그들을 포병 화력으로 쓸어버린 뒤 도시로 진입했습니다.\n\n산발적인 총성이 여전히 들려오고, 도시 곳곳에서 여러 차례 불길이 치솟고 있지만, 대부분의 잔존 일본군 병력은 도시에서 철수했거나, 한국군에 의해 포로로 붙잡혔습니다. \n\n천황 일가는 도시가 점령당하기 전에 도시를 떠났으며, 천황이 기거하던 고쿄에는 이제 천황의 초상화 대신 [KOR.GetLeader]의 초상화가 걸렸으며, 일장기 대신 태극기가 휘날리고 있습니다."
 newsk.5.a:0 "[KOR.GetNameDefCap] 군대는 막을 수가 없는 것 같군!"
 newsk.5.b:0 "임진왜란과 한일러전쟁의 복수를 마쳤다."
 newsk.6.title:0 "김구 대통령"
 newsk.6.desc:0 "오늘, 대한민국에서 실시된 제7대 대통령 선거의 결과로 자유-독립당 연정의 공식 대선 후보이자 독립당 파벌의 지도자인 김구가 새로운 대통령에 당선되었습니다. \n\n새로이 경복궁의 주인이 된 김구 대통령은 당선 소감 라디오 연설에서 삼천만 대한국민의 이익과 정치, 경제, 교육의 균등을 기초로 한 자주독립의 조국을 만들겠다고 밝혔습니다. \n\n자유-독립당의 이번 대선후보 선정 과정에서 김구의 독립당과 전 대통령 이승만의 자유당 파벌간의 갈등은 눈에 띄게 커졌으며, 이제 자유-독립당의 연정은 헤체 직전일 것이라고 전문가들은 예상하고 있습니다."
 newsk.6.a:0 "흥미롭군."
 newsk.6.b:0 "김구 대통령 만세! 대한민국 만세!"
 newsk.7.title:0 "이승만의 세번째 임기"
 newsk.7.desc:0 "오늘, 대한민국에서 실시된 제7대 대통령 선거의 결과로 자유-독립당 연정의 공식 대선 후보이자 현 대통령인 이승만이 당선되었습니다. 이승만 대통령은 대한민국의 초대 대통령 서재필이 3선을 사양하고 스스로 물러난 이래로 암묵적으로 지켜지던 3선 이상의 대통령을 하지 않는다는 관례를 깨고 재출마해서 당선되었습니다. \n\n이로 인해 자유-독립당 내부의 갈등이 눈에 띄게 커졌으며, 자유-독립당 연정은 해체 수순을 밟게 될 것이라고 전문가들은 예상하고 있습니다. \n\n이승만 대통령은 당선 소감 라디오 연설에서 자유로운 시장경제의 수호로 대공황을 이겨내고 자유 우방들과의 협조를 통해 조국의 독립을 지켜내겠다고 밝혔습니다."
 newsk.7.a:0 "흥미롭군."
 newsk.7.b:0 "이승만 대통령 만세! 대한민국 만세!"
 newsk.8.title:0 "국가재건최고회의의 대한민국 제 2공화국 선포"
 newsk.8.desc:0 "오늘, 현재 한반도를 완전히 지배하고 있는 국가재건최고회의는 대한민국 제 2공화국을 선포하고 신임 대통령으로 국가재건최고회의 의장인 이범석이 취임했다고 밝혔습니다. 파시스트들의 영향을 받은 이들의 정부는 최근 사회 개조에 가까운 광범위한 개혁을 실시해 그들의 국가를 군이 지배하는 병영국가로 개조했으며, 세계위에 군림하는 영광스러운 대한민국을 만들 것을 그들의 국민들에게 약속했습니다. \n\n옛 민주공화정 대한민국의 마지막 대통령이자, 현재는 미국에 망명하여 자유대한민국 임시정부를 이끌고 있는 이승만은 저들의 정부는 불법정부이며, 전 국민들은 자유대한민국의 지하조직에 합류해 대한민국을 참칭하는 독재자들에 저항할 것을 독려하고 있지만, 효과는 크지 않을 것으로 보입니다."
 newsk.8.a:0 "흥미롭군."
 newsk.8.b:0 "대한민국 만세! 이범석 대통령 각하 만세!"
 newsk.9.title:0 "대구 코뮌의 조선인민공화국 선포"
 newsk.9.desc:0 "오늘, 대한민국을 전복하고 한반도 전역을 장악한 대구 코뮌은 조선인민공화국의 건국을 선포했습니다. \n\n극동에서의 새로운 공산국가의 출현에 대해 주변국 외교 관계자들은 말을 아끼고 있지만, 소비에트 연방은 한국 인민들의 자유를 향한 염원이 마참내 결실을 맺었다며 크게 환호한 것으로 전해지고 있습니다."
 newsk.9.a:0 "극동에 새로운 공산주의 국가가 생겨버렸군."
 newsk.9.b:0 "조선인민공화국 만세!"
 newsk.10.title:0 "제 2차 한일전쟁"
 newsk.10.desc:0 "지난 30여년 전, 한반도의 종주권을 두고 일본과 러시아 제국의 대립으로 인해 발생한 한일러 전쟁은 한국, 일본, 러시아 모두를 시대의 패배자로 만들어 놓았습니다. 한일러 전쟁 이후로도 한국과 일본은 서로룰 가상적국으로 여기고 있었으며, 이제 결국 한국과 일본간의 전쟁이 다시 시작되었습니다. \n\n이 전쟁으로 인해 누가 이득을 볼 수 있을 지는 현재로서는 미지수이지만, 이 전쟁의 승자는 동아시아의 패자가 될 발판을 얻게 될것이라는 것과 동아시아 전역이 피로 물들게 될 것이라는 점은 확실해 보입니다."
 newsk.10.a:0 "이번에는 승자가 가려질까?"
 newsk.10.b:0 "덴노 헤이카 반자이!"
 newsk.10.c:0 "기필코 승리하리라!"
 newsk.11.title:0 "서울 함락"
 newsk.11.desc:0 "오늘 한국의 수도 서울이 일본군에 의해 함락되었습니다. 일본군은 한국군의 강력한 수도 방어선을 뚫고 시가지로 진입했으며, 서울은 30여년 전 한일러 전쟁 당시 격렬한 전투가 벌어졌던 곳으로, 그 당시에는 함락당하지 않았지만, 이번에는 달랐습니다. \n\n서울 시민들은 큰 충격과 함께 일본군이 남대문 광장과 세종대로를 행진하는 것을 침묵으로 지켜보았으며, 이제 옛 조선 왕조의 정궁이자 대한민국의 대통령 집무실인 경복궁에는 이제 태극기 대신 일장기가 펄럭이고 있습니다."
 newsk.11.a:0 "한국은 가망이 없었어."
 newsk.11.b:0 "아직 끝나지 않았다! 반드시 되찾으리라!"
 newsk.11.c:0 "덴노헤이카 반자이!"
 newsk.12.title:0 "비전 1950을 완성한 [KOR.GetNameDef] 해군"
 newsk.12.desc:0 "오늘, [KOR.GetNameDef] 해군은 그들 해군이 계획한 대양함대 건설 계획인 비전 1950을 완성했음을 발표했습니다. \n\n 그 규모는 세계 유수의 해군들의 규모와 비교해도 뒤쳐지지 않으며 [KOR.GetNameDef]은 이제 그들 스스로가 강력한 해양 강국으로 거듭났으며, 자신들의 강력한 함대로 자신들의 영해와 해양 주권을 수호하겠다고 발표했습니다."
 newsk.12.a:0 "위협적인 해양강국이 생겨버렸군."
 newsk.12.b:0 "나가라 싸워라 승리하라!"
 newsk.13.title:0 "아시아 연합을 선언한 대한민국"
 newsk.13.desc:0 "오늘, 대한민국의 김구 대통령은 아시아 연합의 창설을 발표했습니다. 경복궁 대변인에 따르면, 김구 대통령은 오래 전부터 아시아 만민의 협력과 단결, 평화를 위한 국제 기구를 구상하고 있었다고 밝혔으며, 대한민국이 만주를 점령한 이래로 폭발적으로 강해져 가는 국력이 이 구상을 위한 자신감이 되어주었다고 합니다. \n\n김구 대통령은 아시아 연합은 자유를 사랑하는 모든 아시아인들은 아시아 연합의 시민이 될 자격이 충분하다면서, 대한민국은 그들을 전폭적으로 지원할 것이라 밝혔습니다."
 newsk.13.a:0 "저들이 도대체 무엇을 노리는 거지?"
 newsk.13.b:0 "김구 대통령 만세! 아시아 연합 만세!"
 newsk.14.title:0 "고구려의 부활"
 newsk.14.desc:0 "오늘, 대한민국의 이범석 대통령은 그들의 만주 정복을 기리고 옛 선조들에게 경의를 표하기 위해 오늘부로 국호를 대 고구려 제국으로 변경할 것이라고 밝혔습니다. \n\n서울에서는 지금 수많은 사람들이 거리로 쏟아져 나와 그들의 지도자의 업적을 찬양하고 환호하고 있습니다. \n\n이범석 대통령은 연설에서 고구려의 영광은 이제 다시 부활했을 뿐이며, 고구려의 부활로 앞으로 더 많은 영광들이 조국과 함께할 것이라고 밝혔습니다."
 newsk.14.a:0 "흥미롭군."
 newsk.14.b:0 "기고만장한 놈들!"
 newsk.14.c:0 "대 고구려 제국 만세!"
 newsk.14.d:0 "침략자 고려봉자들을 만주에서 몰아내야 한다!"
 newsk.15.title:0 "자유국가기구의 탄생"
 newsk.15.desc:0 "오늘 오후 미합중국 백악관과 대한민국 경복궁에서 공동으로 자유국가기구의 창설을 발표했습니다. 경복궁 대변인에 따르면, 양국 대통령간의 사전 교감은 이미 몇년 전부터 이루어 지고 있었으며, 그 결실이 이제 성과를 낸 것이라고 밝혔습니다. \n\n [USA.GetLeader] 대통령과 [KOR.GetLeader] 대통령은 공동 성명에서 세계가 불타오르고 있는 지금 자유를 사랑하는 모든 국가와 그 국민들을 자유국가기구는 환영하며, 함께 자유와 민주주의를 위협하는 모든 위협에 하나로 뭉쳐 맞서 싸워야 한다고 밝혔습니다."
 newsk.15.a:0 "미국에게 아시아로의 교두보가 탄생했군."
 newsk.15.b:0 "우리의 국익을 위한 최선의 선택이다."
 newsk.15.c:0 "우리는 함께 자유와 민주주의를 지킬 것이다!"
 newsk.16.title:0 "대한제국의 황제로 즉위한 이은"
 newsk.16.desc:0 "금일, 다시 부활한 대한제국의 황제로 구 제국의 고종 황제의 아들, 이은이 황제로 즉위했습니다. 즉위식은 조선왕실의 정궁이자, 구 대한민국의 대통령 집무실로 사용되던 경복궁에서 이루어 졌으며, 즉위식은 구 공화국의 정통성을 철저히 부정하고 태백교의 단군숭배가 섞인 기묘한 즉위식으로 이루어 졌습니다. \n\n 즉위식에서 한국의 새로운 황제로 즉위한 이은 황제는 별다른 흥미를 느끼지 못했다고 전해지며, 황실복원에 큰 힘을 쓴 우리황실사랑회의 회장이자 태백교의 교주, 계연수의 일장 연설이 돋보이는 자리였습니다."
 newsk.16.a:0 "구 질서의 복원이라고? 흥미롭군."
 newsk.16.b:0 "대한제국 만세! 황제폐하 만세!"
 newsk.17.title:0 "대한제국의 황제로 즉위한 이은"
 newsk.17.desc:0 "금일, 다시 부활한 대한제국의 황제로 구 제국의 고종 황제의 아들, 이은이 황제로 즉위했습니다. 즉위식은 카톨릭 신자인 이은의 취향에 따라, 명동성당에서 천주교 서울대교구장 아드리앙 조셉 라리보 대주교의 집전하에 이루어 졌으며, 서구 군주국가들의 즉위식과 비슷한 방식으로 이루어 졌습니다. \n\n 즉위식에서 이은 황제는 다시 부활한 종묘사직과 국가를 보위하고, 국민들에게 최고의 황제가 될 것을 약속했으며, 자신의 즉위를 위해 힘쓴 이들에게 새로운 대한제국의 귀족 작위를 수여했습니다."
 newsk.17.a:0 "구 질서의 복원이라고? 흥미롭군."
 newsk.17.b:0 "대한제국 만세! 황제폐하 만세!"
 newsk.18.title:0 "신징 함락"
 newsk.18.desc:0 "신징으로부터의 보고는 진군하는 한국군에게 만주국의 수도가 점령되었다는 것을 확인해 주었습니다.\n\n일부 지역에서 여전히 소화기 총성이 들리지만, 의미 있는 규모의 만주군은 시내에서는 목격되지 않았다고 합니다.\n\n한국군이 만주국 황궁을 습격하였지만, 만주국의 황제 아이신기오로 푸이는 공격 전에 미리 대피한 것으로 보입니다. \n\n한국은 신징 인근에 고대 한국 역사상 국가 중 하나인 부여의 수도 부여성이 존재했다는 것을 이유로 신징을 부여시로 재명명했습니다."
 newsk.18.a:0 "[KOR.GetNameDefCap] 군대는 막을 수가 없는 것 같군!"
 newsk.18.b:0 "[KOR.GetNameDef] 만세!"
 newsk.19.title:0 "대환제국을 선포한 한국"
 newsk.19.desc:0 "금일, 한국은 스스로의 국력이 그들의 주장에 따르면 과거 9천년 전에 존재했던 환국과 비교해도 손색이 없다고 자평하며, 대환제국으로 국호를 변경할 것이라고 밝혔습니다. 한국의 토속 민족신앙에 기반한 이들의 불가사의한 정부는 최근 전 세계가 과거 자신들의 땅이라 주장하며 활발한 정복전쟁을 벌이고 있습니다. \n\n'대환제국'의 이러한 주장에, 세계 주요국의 정부 인사들은 논평을 거부하고 있지만, 분개하고 있는 것 만큼은 확실한 것으로 보입니다."
 newsk.19.a:0 "저 정신나간 미치광이들을 막을 방법이 없단 말인가!"
 newsk.19.b:0 "대환제국 만세! 계연수 성하 만세!"
 newsk.20.title:0 "서울 함락"
 newsk.20.desc:0 "중국군은 서울로 진군하였고 이후 중화민국 정부는 대격전 후 한국의 수도를 성공적으로 점령하였다고 발표하였습니다. 동틀 무렵, 중국군 특공대는 여의도 비행장을 장악하였고 보병대 행렬은 세종대로를 따라 진군하였습니다.\n\n중국이 경복궁을 확보하면서, 서울 도심에서의 전투는 대부분 끝났습니다. 한국 정부의 현 상태는 알 수 없으나, 도시가 함락되기 전에 핵심 인물들은 탈출한 것으로 보입니다."
 newsk.20.a:0 "중대한 발전이다."
 newsk.20.b:0 "이건 재앙이야!"
 newsk.20.c:0 "중화민국 만세!"
 newsk.21.title:0 "서울 함락"
 newsk.21.desc:0 "중국 공산당군은 서울로 진군하였고 이후 중국 공산당 정부는 대격전 후 한국의 수도를 성공적으로 점령하였다고 발표하였습니다. 동틀 무렵, 중국군 특공대는 여의도 비행장을 장악하였고 보병대 행렬은 세종대로를 따라 진군하였습니다.\n\n중국군이 경복궁을 확보하면서, 서울 도심에서의 전투는 대부분 끝났습니다. 한국 정부의 현 상태는 알 수 없으나, 도시가 함락되기 전에 핵심 인물들은 탈출한 것으로 보입니다."
 newsk.21.a:0 "중대한 발전이다."
 newsk.21.b:0 "이건 재앙이야!"
 newsk.21.c:0 "[PRC.GetNameDef] 만세!"
 newsk.22.title:0 "베이핑 함락"
 newsk.22.desc:0 "명-청 시기 중화제국의 수도이자, 1928년 국민당의 2차 북벌 이후 베이핑으로 개명되었던 중국의 고도 베이징에 한국군이 입성했습니다.\n\n최후의 중화민국 수비대가 철수한 뒤, 시민들과 함께 도시에 남기로 결정한 베이징 시장 쉬쉬우지는 베이징의 무의미한 파괴를 막기 위해 한국군에게 베이징이 무방비 도시임을 선언하였습니다. 한국군이 여러 행렬로 톈안먼 광장을 행진하며 개선식을 하는 모습을, 베이징 시민들은 충격과 침묵으로 바라보았습니다.\n\n베이징의 함락은 중국군의 전쟁 수행에 지대한 손실이며, 다수의 전문가들은 한국의 중화대륙 정복길이 활짝 열렸다고 예측했습니다."
 newsk.22.a:0 "중대한 발전이다."
 newsk.22.b:0 "우리 중화민족은 반드시 이 수모를 갚을것이다!"
 newsk.22.c:0 "[KOR.GetNameDef] 만세!"
 newsk.23.title:0 "난징 함락"
 newsk.23.desc:0 "오늘 동틀 무렵, 한국군의 도시에 대한 무차별 포격이후 한국군 전차들이 중산문과 급조된 방벽을 박살내며 난징 거리로 진격하였고 명나라 시절 지어진 자오티엔 궁전에서는 한국군 차량화보병대를 내려주는 두돈반 트럭들이 목격되었습니다. \n\n한국군 보병대는 자오티엔궁을 습격하면서 교외에서 맹렬히 타오르는 많은 화재에서 뿜어져 나오는 짙은 연기가 공중으로 솟아오르는 것을 볼 수 있었습니다. 전하는 바에 따르면, 복합단지 구석구석을 지키고 있는 완강한 중화민국군 저항군에 맞서기 위하여 수류탄과 화염방사기가 필요하였다고 합니다. 중화민국의 수도는 이제 한국의 손아귀에 떨어졌지만, 불타는 폐허만이 남았을 뿐입니다..."
 newsk.23.a:0 "중대한 발전이다."
 newsk.23.b:0 "침략자 방쯔들을 반드시 난징에서 몰아내자!"
 newsk.23.c:0 "[KOR.GetNameDef] 만세!"
 newsk.24.title:0 "충칭 함락"
 newsk.24.desc:0 "중화민국 최후의 임시수도인 충칭에서 필사적인 전투가 보고되었지만, 이제는 완전히 한국의 손에 있다고 여겨집니다. 한국군은 자링강을 도하해 충칭의 중심지인 자링반도에 입성하였습니다.\n\n 중화민국 임시정부청사는 완고한 남의사 요원들이 항복을 거부한 이후 한국군의 포격으로 무너졌습니다. 한국의 국기가 이제 백제성의 폐허 위에 펄럭이고, 저항하는 최후의 중화민국 잔존군이 정리되고 있습니다."
 newsk.24.a:0 "중대한 발전이다."
 newsk.24.b:0 "이것은 종말의 시작인가...?"
 newsk.24.c:0 "이게 바로 진정한 우리 시대의 평화이다."
 newsk.25.title:0 "대한민국의 붕괴"
 newsk.25.desc:0 "대공황 이후, 대한민국이 내리막길을 걷고 있다는 것은 명백한 사실이었지만, 그 누구도 대한민국이 이렇게 최후를 맞을 것이라고는 예측하지 못했습니다. \n\n극좌와 극우, 그리고 자유-독립당 내부의 정치적 논쟁에 염증을 느낀 대중들의 지지를 받아 최근 원내 과반을 차지한 우리황실사랑회는 국회의사당에서 우레와 같은 환호성과 함께 대한민국의 헤체와 대한제국 황실의 복원을 선언했습니다. \n\n이로서 1906년 세워진 아시아 최초의 민주주의 공화국 대한민국은 30년만에 멸망했으며, 이제 한반도는 우리황실사랑회를 모태로 개편된 '덕수궁 평의회'에 의해 통치되고 있습니다."
 newsk.25.a:0 "흥미롭군."
 newsk.25.b:0 "거짓된 민국의 꼴사나운 최후로군."
 newsk.26.title:0 "한국의 정권을 장악한 태백교"
 newsk.26.desc:0 "최근 근황주의자들의 '명예 혁명'으로 제정복고가 이루어진 한국에서 충격적인 소식이 전해졌습니다. 황실 복고 이후 대한제국의 황제, 이은에게 제국섭정으로 임명된 우리황실사랑회의 회장이자 태백교의 교주인 계연수의 명령에 의해 어젯 밤 지식인들과 공화주의자, 심지어는 근황주의자들까지 대다수가 국가반역죄 혐의로 영장없이 체포 및 구금되었으며, 현재 이들의 생사를 알 수 없게 되었습니다.\n\n 현지 소식통에 따르면, 이 '은장도의 밤' 이후, 대한제국의 전권은 제국섭정 계연수가 완전히 장악했으며, 이제 이은 황제는 모든 의지를 잃고 실의에 빠진 채 계연수 섭정의 꼭두각시가 되어버렸다고 전해지고 있습니다."
 newsk.26.a:0 "저들은 제정신인가?"
 newsk.26.b:0 "이제 그 누구도 환의 부활을 막을 수 없다."
 newsk.27.title:0 "제 2차 환핀대전"
 newsk.27.desc:0 "오늘, 환국의 제국섭정 계연수는 전 세계의 고대사와 고고학 사료들을 연구하던 중, 그들이 9천년 전에 존재했다고 주장하는 위대했던 환 제국을 멸망시킨 그들의 진정한 적을 찾았다는 사실을 발표했습니다. \n\n계연수의 주장에 따르면, 과거 자신들의 국가를 멸망시킨 진정한 적은 오늘날의 핀란드라고 밝혔으며, 계연수 섭정은 환국의 전군에게 핀란드에 대한 초토화 작전을 준비할 것을 명령했습니다. \n\n핀란드의 지도자, 시구르드 베텐호비 아스파는 환국이 이제서야 그 사실을 깨달았다고 하며 계연수와 환국을 조롱하고, '용감무쌍한 대핀제국군이 아둔한 환국군을 모두 핀란드의 눈속에 파묻어 버릴 것이다' 라고 주장했습니다. \n\n이제 저 두 국가간의 '두번째' 전면충돌은 피할 수 없을 것으로 보입니다... " 
 newsk.27.a:0 "저 미치광이들은 도대체 무슨 소리를 하는 거지?"
 newsk.27.b:0 "저 기고만장한 놈들을 이번에도 관짝에 처박아줘야겠군!"
 newsk.27.c:0 "9천년을 기다렸다. 이번에는 반드시 승리하리라!"
 newsk.28.title:0 "서울 해방"
 newsk.28.desc:0 "오늘, 일본군에 의해 점령당했던 한반도 최대의 도시이자 [KOR.GetNameDef]의 수도 서울이 일본의 점령에서 해방된 것이 확인되었습니다. 한국군은 1906년 한일러 전쟁 당시의 13도 창의군과 마찬가지로 독립문을 통과하며 서울에 입성하였고 일본군 수비대의 잔존 부대는 한국군에게 항복했습니다. 일본군 저격수가 시내 일부에서 저항을 계속하고 있다는 소문이 있음에도 불구하고, 서울 시민들은 광화문 광장과 세종대로를 행진하는 '해방군'에게 열렬한 성원을 보내고있습니다.\n\n서울 시민들은 일본이 청야전술을 실시해, 서울이 화염에 휩싸이고 폐허가 되는 것을 두려워했지만, 도시는 별다른 피해를 입지 않았습니다. 이제 남산타워에는 다시 [KOR.GetNameDef]의 태극기가 휘날리고 있습니다."
 newsk.28.a:0 "중대한 발전이다."
 newsk.28.b:0 "[KOR.GetNameDef] 만세!"
 newsk.28.c:0 "무능한 놈들!"