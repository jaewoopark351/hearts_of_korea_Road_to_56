#20260923_kpopmodder: Name the complete RT56 policy regions required by the imported operating projects.
#20260926_kpopmodder: Use escaped ASCII dialogue quotes and compact decision UI text; preserve gameplay and explicit lifecycle warnings.
#20260926_kpopmodder: Compact new focus descriptions for the fixed-height UI; preserve gameplay and non-focus localisation.
#20260925_kpopmodder: Rewrite focus, decision and event prose with grounded voices; preserve keys, gameplay rules and paired Korean text.
#20260923_kpopmodder: Localize shared project gates while preserving their flag conditions.
#20260923_kpopmodder: Describe regional operating conditions and shared field-specialization rewards.
 HOK_KOR_mc_county_dossiers:0 "만주 지방행정 조사"
 HOK_KOR_mc_county_dossiers_desc:0 "관청을 옮길 때마다 사정을 다시 말하게 해서는 안 됩니다. 만주의 업무 구역을 조사합니다. 해당 지역의 소유·완전통제가 필요하며 상실 시 중점이 취소됩니다. 대상 지역: $STATE_328$, $STATE_941$. 모든 대상 지역을 소유하고 완전히 통제해야 합니다."
 HOK_KOR_mc_payroll_registers:0 "지방 공공서비스"
 HOK_KOR_mc_payroll_registers_desc:0 "주민이 찾아왔을 때 문이 열려 있어야 합니다. 만주 공공서비스 I을 세웁니다. 지역 소유·완전통제 중에만 적용되며 다른 지역·소유국에는 승계되지 않습니다. 대상 지역: $STATE_328$, $STATE_941$. 모든 대상 지역을 소유하고 완전히 통제해야 합니다."
 HOK_KOR_mc_service_counters:0 "행정 통신망"
 HOK_KOR_mc_service_counters_desc:0 "보냈다는 서류와 못 받았다는 관청 사이에 답을 놓겠습니다. 통신망과 시설 운용 연구를 지원합니다. 다른 병렬 정책과 어느 순서로도 추진할 수 있습니다. 대상 지역: $STATE_328$, $STATE_941$. 모든 대상 지역을 소유하고 완전히 통제해야 합니다."
 HOK_KOR_mc_dispute_records:0 "민원·물자 조정"
 HOK_KOR_mc_dispute_records_desc:0 "물자는 두 관청의 소관인데 필요한 곳에는 오지 않습니다. 공공서비스와 통신망을 결합해 민원·물자 요청을 끝까지 처리하겠습니다. 대상 지역: $STATE_328$, $STATE_941$. 모든 대상 지역을 소유하고 완전히 통제해야 합니다."
 HOK_KOR_mc_service_calendar:0 "지방행정 정례화"
 HOK_KOR_mc_service_calendar_desc:0 "담당자가 바뀌어도 관청의 약속은 남아야 합니다. 공공서비스를 II로 강화하고 정치력 150·90일 사업을 엽니다. 재확보 뒤 사업을 재개하면 상위 제도를 복구합니다. 대상 지역: $STATE_328$, $STATE_941$. 모든 대상 지역을 소유하고 완전히 통제해야 합니다."
 HOK_KOR_mc_interpreter_desks:0 "다언어 행정 창구"
 HOK_KOR_mc_interpreter_desks_desc:0 "도장부터 요구하지 말고 주민의 말을 듣겠습니다. 다언어 창구를 엽니다. 해당 지역의 소유·완전통제가 필요하며 상실 시 중점이 취소됩니다. 대상 지역: $STATE_328$, $STATE_941$. 모든 대상 지역을 소유하고 완전히 통제해야 합니다."
 HOK_KOR_mc_residence_certificates:0 "주민 정착 지원"
 HOK_KOR_mc_residence_certificates_desc:0 "새 주소를 얻었다고 정착이 끝나지는 않습니다. 만주 공동체 지원 I을 세웁니다. 지역 소유·완전통제 중에만 적용되며 다른 지역·소유국에는 승계되지 않습니다. 대상 지역: $STATE_328$, $STATE_941$. 모든 대상 지역을 소유하고 완전히 통제해야 합니다."
 HOK_KOR_mc_municipal_consultation:0 "지역 보건·교육"
 HOK_KOR_mc_municipal_consultation_desc:0 "진료소의 안내와 학교의 공지가 누구에게 닿는지 묻겠습니다. 보건·교육 시설 운용 연구를 지원합니다. 다른 병렬 정책과 어느 순서로도 추진할 수 있습니다. 대상 지역: $STATE_328$, $STATE_941$. 모든 대상 지역을 소유하고 완전히 통제해야 합니다."
 HOK_KOR_mc_shared_service_manuals:0 "공동행정 협약"
 HOK_KOR_mc_shared_service_manuals_desc:0 "창구마다 같은 안내를 받을 수 있어야 합니다. 정착 지원과 보건·교육의 업무 기준을 합쳐 공동행정 협약을 정착시키겠습니다. 대상 지역: $STATE_328$, $STATE_941$. 모든 대상 지역을 소유하고 완전히 통제해야 합니다."
 HOK_KOR_mc_community_mediation:0 "공동체 지원 정례화"
 HOK_KOR_mc_community_mediation_desc:0 "도움을 받은 뒤에도 다시 물을 곳은 남아야 합니다. 공동체 지원을 II로 강화하고 정치력 150·90일 사업을 엽니다. 재확보 뒤 사업 재개로 상위 제도를 복구합니다. 대상 지역: $STATE_328$, $STATE_941$. 모든 대상 지역을 소유하고 완전히 통제해야 합니다."
 HOK_KOR_mc_workshop_inventory:0 "만주 공업재고 조사"
 HOK_KOR_mc_workshop_inventory_desc:0 "장부의 기계가 실제로 돌아가는지 살피겠습니다. 만주의 설비와 원료를 조사합니다. 해당 지역의 소유·완전통제가 필요하며 상실 시 중점이 취소됩니다. 대상 지역: $STATE_328$, $STATE_941$, $STATE_714$, $STATE_944$, $STATE_945$, $STATE_717$, $STATE_942$, $STATE_943$. 모든 대상 지역을 소유하고 완전히 통제해야 합니다."
 HOK_KOR_mc_metallurgical_trials:0 "부산물 회수 체계"
 HOK_KOR_mc_metallurgical_trials_desc:0 "폐기하기 전에 다시 쓸 원료인지 살피겠습니다. 만주 원료 회수 I을 세웁니다. 지역 소유·완전통제 중에만 적용되며 다른 지역·소유국에는 승계되지 않습니다. 대상 지역: $STATE_328$, $STATE_941$, $STATE_714$, $STATE_944$, $STATE_945$, $STATE_717$, $STATE_942$, $STATE_943$. 모든 대상 지역을 소유하고 완전히 통제해야 합니다."
 HOK_KOR_mc_material_recovery:0 "광물 선별시험"
 HOK_KOR_mc_material_recovery_desc:0 "광물의 이름보다 어느 공정에 쓰이는지가 중요합니다. 선별시험과 기술 운용 연구를 지원합니다. 다른 병렬 정책과 어느 순서로도 추진할 수 있습니다. 대상 지역: $STATE_328$, $STATE_941$, $STATE_714$, $STATE_944$, $STATE_945$, $STATE_717$, $STATE_942$, $STATE_943$. 모든 대상 지역을 소유하고 완전히 통제해야 합니다."
 HOK_KOR_mc_foundry_batches:0 "제련 현장교류"
 HOK_KOR_mc_foundry_batches_desc:0 "회수한 원료를 써 본 제련공과 선별시험 기술자가 기록을 맞추겠습니다. 두 현장의 성과를 모아 잘된 배합과 실패한 공정을 함께 나눕니다. 대상 지역: $STATE_328$, $STATE_941$, $STATE_714$, $STATE_944$, $STATE_945$, $STATE_717$, $STATE_942$, $STATE_943$. 모든 대상 지역을 소유하고 완전히 통제해야 합니다."
 HOK_KOR_mc_integrated_recovery:0 "원료 회수협업"
 HOK_KOR_mc_integrated_recovery_desc:0 "회수품이 다시 창고에 쌓여서는 안 됩니다. 원료 회수를 II로 강화하고 정치력 150·90일 사업을 엽니다. 재확보 뒤 사업 재개로 상위 제도를 복구합니다. 대상 지역: $STATE_328$, $STATE_941$, $STATE_714$, $STATE_944$, $STATE_945$, $STATE_717$, $STATE_942$, $STATE_943$. 모든 대상 지역을 소유하고 완전히 통제해야 합니다."
 HOK_KOR_mc_tenancy_records:0 "국내성 주거 실태조사"
 HOK_KOR_mc_tenancy_records_desc:0 "주소가 남아 있다고 살 수 있는 집은 아닙니다. 국내성의 거주·보수 실태를 조사합니다. 해당 지역의 소유·완전통제가 필요하며 상실 시 중점이 취소됩니다. 대상 지역: $STATE_328$, $STATE_941$. 모든 대상 지역을 소유하고 완전히 통제해야 합니다."
 HOK_KOR_mc_sanitation_rounds:0 "시가지 기반시설"
 HOK_KOR_mc_sanitation_rounds_desc:0 "집 앞의 길과 배수로도 살림의 일부입니다. 국내성 도시 운영 I을 세웁니다. 지역 소유·완전통제 중에만 적용되며 다른 지역·소유국에는 승계되지 않습니다. 대상 지역: $STATE_328$, $STATE_941$. 모든 대상 지역을 소유하고 완전히 통제해야 합니다."
 HOK_KOR_mc_housing_repairs:0 "주택 보수기술"
 HOK_KOR_mc_housing_repairs_desc:0 "같은 지붕이 또 샌다면 자재만 더 보낼 일이 아닙니다. 보수기술과 시설 운용 연구를 지원합니다. 다른 병렬 정책과 어느 순서로도 추진할 수 있습니다. 대상 지역: $STATE_328$, $STATE_941$. 모든 대상 지역을 소유하고 완전히 통제해야 합니다."
 HOK_KOR_mc_market_inspections:0 "시장·위생 정비"
 HOK_KOR_mc_market_inspections_desc:0 "주거지와 시장 사이의 문제도 누군가는 맡아야 합니다. 시가지 운영과 보수 경험을 합쳐 주민이 매일 오가는 거리의 위생을 정비하겠습니다. 대상 지역: $STATE_328$, $STATE_941$. 모든 대상 지역을 소유하고 완전히 통제해야 합니다."
 HOK_KOR_mc_settled_municipality:0 "정착도시의 일상"
 HOK_KOR_mc_settled_municipality_desc:0 "특별 지시 없이도 돌아가는 도시를 만들겠습니다. 도시 운영을 II로 강화하고 정치력 150·90일 사업을 엽니다. 재확보 뒤 사업 재개로 상위 제도를 복구합니다. 대상 지역: $STATE_328$, $STATE_941$. 모든 대상 지역을 소유하고 완전히 통제해야 합니다."
 HOK_KOR_mc_local_services_1:0 "만주 공공서비스 I"
 HOK_KOR_mc_local_services_1_desc:0 "대상 지역의 운영 제도입니다. 한국이 지역을 소유하고 완전히 통제할 때만 적용되며, 조건 상실 시 일일 갱신에서 제거됩니다."
 HOK_KOR_mc_local_services_2:0 "만주 공공서비스 II"
 HOK_KOR_mc_local_services_2_desc:0 "대상 지역의 운영 제도입니다. 한국이 지역을 소유하고 완전히 통제할 때만 적용되며, 조건 상실 시 일일 갱신에서 제거됩니다."
 HOK_KOR_mc_local_services_concentrated:0 "만주 행정·수송 집중 사업"
 HOK_KOR_mc_local_services_concentrated_desc:0 "정치력 150을 투입한 90일 집중 사업의 지역 효과입니다. 완료·취소·영토 조건 상실 시 제거됩니다."
 HOK_KOR_mc_community_services_1:0 "만주 공동체 지원 I"
 HOK_KOR_mc_community_services_1_desc:0 "대상 지역의 운영 제도입니다. 한국이 지역을 소유하고 완전히 통제할 때만 적용되며, 조건 상실 시 일일 갱신에서 제거됩니다. 민주정부 조건도 유지해야 합니다."
 HOK_KOR_mc_community_services_2:0 "만주 공동체 지원 II"
 HOK_KOR_mc_community_services_2_desc:0 "대상 지역의 운영 제도입니다. 한국이 지역을 소유하고 완전히 통제할 때만 적용되며, 조건 상실 시 일일 갱신에서 제거됩니다. 민주정부 조건도 유지해야 합니다."
 HOK_KOR_mc_community_services_concentrated:0 "만주 주민 정착 지원 사업"
 HOK_KOR_mc_community_services_concentrated_desc:0 "정치력 150을 투입한 90일 집중 사업의 지역 효과입니다. 완료·취소·영토 조건 상실 시 제거됩니다."
 HOK_KOR_mc_material_recovery_1:0 "만주 원료 회수 I"
 HOK_KOR_mc_material_recovery_1_desc:0 "대상 지역의 운영 제도입니다. 한국이 지역을 소유하고 완전히 통제할 때만 적용되며, 조건 상실 시 일일 갱신에서 제거됩니다."
 HOK_KOR_mc_material_recovery_2:0 "만주 원료 회수 II"
 HOK_KOR_mc_material_recovery_2_desc:0 "대상 지역의 운영 제도입니다. 한국이 지역을 소유하고 완전히 통제할 때만 적용되며, 조건 상실 시 일일 갱신에서 제거됩니다."
 HOK_KOR_mc_material_recovery_concentrated:0 "만주 원료 회수 집중 사업"
 HOK_KOR_mc_material_recovery_concentrated_desc:0 "정치력 150을 투입한 90일 집중 사업의 지역 효과입니다. 완료·취소·영토 조건 상실 시 제거됩니다."
 HOK_KOR_mc_municipal_routine_1:0 "국내성 도시 운영 I"
 HOK_KOR_mc_municipal_routine_1_desc:0 "대상 지역의 운영 제도입니다. 한국이 지역을 소유하고 완전히 통제할 때만 적용되며, 조건 상실 시 일일 갱신에서 제거됩니다."
 HOK_KOR_mc_municipal_routine_2:0 "국내성 도시 운영 II"
 HOK_KOR_mc_municipal_routine_2_desc:0 "대상 지역의 운영 제도입니다. 한국이 지역을 소유하고 완전히 통제할 때만 적용되며, 조건 상실 시 일일 갱신에서 제거됩니다."
 HOK_KOR_mc_municipal_routine_concentrated:0 "국내성 주거·시설 보수 사업"
 HOK_KOR_mc_municipal_routine_concentrated_desc:0 "정치력 150을 투입한 90일 집중 사업의 지역 효과입니다. 완료·취소·영토 조건 상실 시 제거됩니다."
 HOK_KOR_manchurian_followup_programs:0 "만주 후속 운영 사업"
 HOK_KOR_manchurian_followup_programs_desc:0 "행정, 정착, 원료, 주거의 현장을 지원합니다.\n정치력 150, 민간공장 점유 없음, 90일간 지역 효과 적용. 네 사업 중 하나만 운영하며 종료/취소 후 전체가 90일간 대기합니다.\n영토 조건 상실 시 지역 제도도 일일 갱신에서 제거되며, 재확보 후 재착수로 기존 상위 제도를 복구합니다. 공장/자원 영구 지급은 없고 일회 보상도 회수하지 않습니다."
 HOK_KOR_mc_local_services_project:0 "만주 행정·수송 집중 사업"
 HOK_KOR_mc_local_services_project_desc:0 "\"물건이 없는 게 아닙니다. 받아 줄 곳을 못 정한 겁니다.\"\n행정과 수송을 90일간 집중 지원하고 제거된 기존 상위 제도도 복구합니다.\n대상 지역의 소유/완전통제 등 착수 조건 상실, 항복/내전 시 취소. 비용은 환급되지 않습니다. 대상 지역: $STATE_328$, $STATE_941$. 모든 대상 지역을 소유하고 완전히 통제해야 합니다."
 HOK_KOR_mc_community_services_project:0 "만주 주민 정착 지원 사업"
 HOK_KOR_mc_community_services_project_desc:0 "창구가 달라도 주민이 같은 사정을 거듭 말하지 않게 하겠습니다.\n90일간 정착을 지원하고 제거된 기존 상위 제도도 복구합니다.\n민주정부 및 대상 지역 소유/완전통제 유지 필요. 착수 조건 상실, 항복/내전 시 취소되며 환급되지 않습니다. 대상 지역: $STATE_328$, $STATE_941$. 모든 대상 지역을 소유하고 완전히 통제해야 합니다."
 HOK_KOR_mc_material_recovery_project:0 "만주 원료 회수 집중 사업"
 HOK_KOR_mc_material_recovery_project_desc:0 "부족한 원료와 쌓인 회수품 사이에 길을 놓습니다.\n90일간 원료 회수를 지원하고 제거된 기존 상위 제도도 복구합니다.\n대상 지역 중 한 곳이라도 소유/완전통제를 잃거나 다른 착수 조건 상실, 항복/내전 시 취소. 비용은 환급되지 않습니다. 대상 지역: $STATE_328$, $STATE_941$, $STATE_714$, $STATE_944$, $STATE_945$, $STATE_717$, $STATE_942$, $STATE_943$. 모든 대상 지역을 소유하고 완전히 통제해야 합니다."
 HOK_KOR_mc_municipal_routine_project:0 "국내성 주거·시설 보수 사업"
 HOK_KOR_mc_municipal_routine_project_desc:0 "집을 고친 뒤 앞길을 다시 파는 일부터 줄이겠습니다.\n90일간 주거/시설 보수를 지원하고 제거된 기존 상위 제도도 복구합니다.\n대상 지역의 소유/완전통제 등 착수 조건 상실, 항복/내전 시 취소. 비용은 환급되지 않습니다. 대상 지역: $STATE_328$, $STATE_941$. 모든 대상 지역을 소유하고 완전히 통제해야 합니다."
 HOK_KOR_mc_followup_no_active_project_tt:0 "다른 만주 후속 운영사업을 진행하고 있지 않음"
 HOK_KOR_mc_followup_cooldown_finished_tt:0 "첫 사업이거나 이전 만주 후속 운영사업의 종료 또는 취소 후 90일이 지남"
