#20261003_kpopmodder: Apply varied HOI4 fascist and communist voices to description narrative; preserve effects and explicit rules.
#20261003_kpopmodder: Explain new decision and spirit policies through concrete circumstances; preserve gameplay and lifecycle rules.
#20260926_kpopmodder: Use escaped ASCII dialogue quotes and compact decision UI text; preserve gameplay and explicit lifecycle warnings.
#20260926_kpopmodder: Compact new focus descriptions for the fixed-height UI; preserve gameplay and non-focus localisation.
#20260926_kpopmodder: Restore fictional class-conscious and hardline planning voices while preserving all gameplay rules.
#20260925_kpopmodder: Rewrite focus, decision and event prose with grounded voices; preserve keys, gameplay rules and paired Korean text.
 #20260922_kpopmodder: Describe technical diffusion, production administration, and programs sharing the governance limits.
 HOK_KOR_yeo_rural_service_survey:0 "Survey Shared Rural Services"
 HOK_KOR_yeo_rural_service_survey_desc:0 "\"Are rich peasants the only ones who can read those accounts?\"\nA cooperative member pulls up a chair beside the clerk. We will survey shared accounting and equipment services, beginning with the skills needed to manage them together."
 HOK_KOR_yeo_cooperative_advisers:0 "Cooperative Technical Advice Centres"
 HOK_KOR_yeo_cooperative_advisers_desc:0 "\"My hands are dirty...\" \"We are here to solve the problems those hands have brought.\"\nCooperative technical advice centres will bring knowledge from the laboratory to broken machinery and workbenches."
 HOK_KOR_yeo_workshop_bulletins:0 "Workshop Technical Bulletins"
 HOK_KOR_yeo_workshop_bulletins_desc:0 "\"Print our failures as well and we will be a laughing stock.\"\n\"We cannot let other comrades waste the same metal.\"\nTechnical bulletins will share successes and failures from the shop floor alike."
 HOK_KOR_yeo_joint_service_accounts:0 "Publish Shared Service Accounts"
 HOK_KOR_yeo_joint_service_accounts_desc:0 "\"I ask because it is all our money.\"\nWe will publish the costs and results of cooperative support. Unlocks mobile technical training and rural infrastructure support projects."
 HOK_KOR_yeo_technical_extension:0 "National Cooperative Technical Outreach Network"
 HOK_KOR_yeo_technical_extension_desc:0 "We will carry questions from the fields to the laboratory and answers from the laboratory to the workbench. Advice centres and bulletins across the country will bring technical knowledge within every cooperative member's reach."
 HOK_KOR_pak_planning_secretariat:0 "National Planning Secretariat"
 HOK_KOR_pak_planning_secretariat_desc:0 "\"Everyone followed the party's instructions.\" \"Then begin by writing down which instructions each of you was responsible for.\"\nThe National Planning Secretariat will bring plans and reports together, assigning responsibility and the order in which work is handled."
 HOK_KOR_pak_provincial_plan_offices:0 "Provincial Planning Liaison Offices"
 HOK_KOR_pak_provincial_plan_offices_desc:0 "\"The instructions have been delivered.\"\n\"It is not finished until the results come back.\"\nProvincial planning liaison offices will connect central orders with replies from the workplace."
 HOK_KOR_pak_technical_delegates:0 "Field Technical Delegation"
 HOK_KOR_pak_technical_delegates_desc:0 "\"Will these bits of metal stick together if we subject them to ideological scrutiny?\"\nTechnical delegates will ensure that planning and research account for equipment's limitations. Unlocks production process conversion management and support for new production lines."
 HOK_KOR_pak_plan_review_sessions:0 "Plan Performance Review Meetings"
 HOK_KOR_pak_plan_review_sessions_desc:0 "\"An explanation for missing the target?\" \"Not yet.\"\nBehind closed doors, we will compare reports with results. Today's pledges from the responsible agencies must return to the next meeting as work completed."
 HOK_KOR_yeo_technical_extension_1:0 "Cooperative Technical Outreach I"
 HOK_KOR_yeo_technical_extension_1_desc:0 "There is little point in proclaiming liberation through learning if knowledge remains on the desks of a few. Cooperative technical advice centres carry answers from research institutions to workshops and infrastructure projects, then send questions from the field back to the laboratory. Those who hold tools in calloused hands are owners of our technology too. We will begin by solving the problems those hands bring us, together.\n\nRemoved if the government ceases to be communist."
 HOK_KOR_yeo_technical_extension_2:0 "Cooperative Technical Outreach II"
 HOK_KOR_yeo_technical_extension_2_desc:0 "If one cooperative must discover from scratch an answer another has struggled to find, we are not yet connected closely enough. Advice centres and technical bulletins across the country share examples and return practical questions to research institutions. Our pride lies in cooperatives carrying research and construction forward together with that knowledge, rather than a few people keeping it to themselves.\n\nReplaces tier I in the same series, retaining and strengthening its benefits. Removed if the government ceases to be communist."
 HOK_KOR_pak_planning_administration_1:0 "Planning Administration I"
 HOK_KOR_pak_planning_administration_1_desc:0 "When the centre changes what is to be produced, the workplace must follow the new instructions. Yet workers' skills are the people's property too, and a new dispatch is no reason to throw that property away. Plans are linked to reports from the workplace, recording changing tasks alongside experience that can still be used. Preventing a change of plan from becoming a loss of skill is also the state's responsibility.\n\nRemoved if the government ceases to be communist."
 HOK_KOR_pak_planning_administration_2:0 "Planning Administration II"
 HOK_KOR_pak_planning_administration_2_desc:0 "The centre has the authority to change production plans. It has yet to acquire the authority to replace workers' hands with new ones, so the experience recorded by field technical delegates must be put to proper use. Records from the previous process accompany the next instructions, and procedures for starting new production lines are learnt in advance. We are reducing the habit of completing our plans before the workplace is ready.\n\nImproves efficiency retention when changing products and raises the starting efficiency of new production lines. Does not immediately raise the efficiency of existing lines. Replaces tier I in the same series. Removed if the government ceases to be communist."
 HOK_KOR_yeo_mobile_technical_training_project:0 "Mobile Technical Training"
 HOK_KOR_yeo_mobile_technical_training_project_desc:0 "\"Do not keep what you have learnt to yourself, comrade.\"\nWe have declared learning to be for everyone, but there is still a long road from the laboratory door to a cooperative's workbench. Travelling instructors will cross that distance, teaching new techniques and connecting questions from the workplace with education and research. Those who go out to teach must return having learnt something too. How else can the knowledge belong to us all?\n\nCosts 150 Political Power. Effects begin immediately and last 90 days. Occupies no civilian factories. Only one domestic administration project may run at a time; the entire category shares a 90-day waiting period after completion or cancellation. One can run alongside one communist economic policy project. Cancelled upon loss of communist government or the conditions that unlocked it, capitulation or civil war. Costs are not refunded."
 HOK_KOR_yeo_rural_infrastructure_project:0 "Rural Infrastructure Support"
 HOK_KOR_yeo_rural_infrastructure_project_desc:0 "\"Are we to boast of a fine harvest without a road to carry the grain?\"\nThe abundance won by a country of workers and peasants cannot be left waiting at the roadside. Cooperatives will coordinate labour and equipment schedules, bringing together materials and work once organised separately by each village. Let our solidarity show on the roads connecting fields and workshops as well. A fine slogan cannot carry grain.\n\nThe project effect applies to infrastructure construction nationwide. Costs 150 Political Power. Effects begin immediately and last 90 days. Occupies no civilian factories. Only one domestic administration project may run at a time; the entire category shares a 90-day waiting period after completion or cancellation. One can run alongside one communist economic policy project. Cancelled upon loss of communist government or the conditions that unlocked it, capitulation or civil war. Costs are not refunded."
 HOK_KOR_pak_process_conversion_project:0 "Production Process Conversion Management"
 HOK_KOR_pak_process_conversion_project_desc:0 "\"A new plan cannot give us new hands as well.\"\nAgreement to follow a new plan does not replace the experience gained in machining metal. We will adapt records from the previous process and equipment adjustment procedures to the new product, retaining more of our accumulated production efficiency. The state intends to change the product, not the skills the people have worked so hard to acquire.\n\nCosts 150 Political Power. Effects begin immediately and last 90 days. Occupies no civilian factories. Only one domestic administration project may run at a time; the entire category shares a 90-day waiting period after completion or cancellation. One can run alongside one communist economic policy project. Cancelled upon loss of communist government or the conditions that unlocked it, capitulation or civil war. Costs are not refunded."
 HOK_KOR_pak_new_production_lines_project:0 "Support for New Production Lines"
 HOK_KOR_pak_new_production_lines_project_desc:0 "\"According to the plan, it is already running.\" \"Then we had better get used to it first.\"\nOur plan's optimism begins on a new production line's very first day. If the workplace is to keep pace with that optimism, operating procedures must be learnt in advance and equipment preparations coordinated. Higher starting efficiency for new production lines will narrow the initial gap between the plan and the workshop. An excellent first report does not, by itself, make workers familiar with their machines.\n\nDoes not immediately raise the efficiency of existing production lines. Costs 150 Political Power. Effects begin immediately and last 90 days. Occupies no civilian factories. Only one domestic administration project may run at a time; the entire category shares a 90-day waiting period after completion or cancellation. One can run alongside one communist economic policy project. Cancelled upon loss of communist government or the conditions that unlocked it, capitulation or civil war. Costs are not refunded."
