l_english:
 #20260922_kpopmodder: Describe technical diffusion, production administration, and programs sharing the governance limits.
 HOK_KOR_yeo_rural_service_survey:0 "농촌 공동업무 조사"
 HOK_KOR_yeo_rural_service_survey_desc:0 "지역마다 따로 처리하던 회계·설비 관리 업무를 조사하여 공동으로 지원할 수 있는 분야를 정하겠습니다."
 HOK_KOR_yeo_cooperative_advisers:0 "조합 기술상담소"
 HOK_KOR_yeo_cooperative_advisers_desc:0 "기존 학교와 연구기관의 지식을 조합의 실제 설비 문제와 연결할 기술상담 창구를 마련하겠습니다."
 HOK_KOR_yeo_workshop_bulletins:0 "작업장 기술회보"
 HOK_KOR_yeo_workshop_bulletins_desc:0 "작업 현장의 개선 사례와 실패 원인을 정리해 지역을 넘어 공유하겠습니다."
 HOK_KOR_yeo_joint_service_accounts:0 "공동업무 회계 공개"
 HOK_KOR_yeo_joint_service_accounts_desc:0 "조합 지원 업무의 비용과 성과를 정기적으로 공개하여 지역 주민이 사업을 신뢰할 수 있도록 하겠습니다. 공개된 재정을 바탕으로 순회 기술교육 또는 농촌 기반시설 지원 사업을 운영할 수 있습니다."
 HOK_KOR_yeo_technical_extension:0 "전국 조합 기술보급망"
 HOK_KOR_yeo_technical_extension_desc:0 "각지의 상담소와 회보를 하나의 보급망으로 연결하여 연구 성과가 작업 현장에 꾸준히 전달되도록 하겠습니다."
 HOK_KOR_pak_planning_secretariat:0 "국가계획 사무국"
 HOK_KOR_pak_planning_secretariat_desc:0 "각 기관이 따로 보관하던 계획과 보고를 모아 업무의 책임과 처리 순서를 명확히 하겠습니다."
 HOK_KOR_pak_provincial_plan_offices:0 "지방계획 연락소"
 HOK_KOR_pak_provincial_plan_offices_desc:0 "중앙의 계획과 지방의 실적을 연결할 담당 조직을 두어 지시와 보고가 누락되지 않도록 하겠습니다."
 HOK_KOR_pak_technical_delegates:0 "현장 기술대표단"
 HOK_KOR_pak_technical_delegates_desc:0 "생산 현장의 기술 담당자가 계획 검토에 참여하여 공정과 설비의 한계를 직접 설명하도록 하겠습니다. 현장 경험을 산업 연구에 반영하고, 생산공정 전환 관리 또는 신규 생산선 가동 지원 사업을 운영할 수 있습니다."
 HOK_KOR_pak_plan_review_sessions:0 "계획실적 검토회의"
 HOK_KOR_pak_plan_review_sessions_desc:0 "지방과 기업의 보고를 정기적으로 대조하고 책임 기관의 후속 조치를 기록하겠습니다."
 HOK_KOR_yeo_technical_extension_1:0 "조합 기술보급 I"
 HOK_KOR_yeo_technical_extension_1_desc:0 "조합 상담소와 기술회보가 연구 지식을 현장에 보급하고 기반시설의 건설을 돕습니다. 공산정부를 잃으면 제거됩니다."
 HOK_KOR_yeo_technical_extension_2:0 "조합 기술보급 II"
 HOK_KOR_yeo_technical_extension_2_desc:0 "조합 상담소와 기술회보가 연구 지식을 현장에 보급하고 기반시설의 건설을 돕습니다. I단계를 대체하며 하위 단계의 혜택을 유지·강화합니다. 공산정부를 잃으면 제거됩니다."
 HOK_KOR_pak_planning_administration_1:0 "계획행정 I"
 HOK_KOR_pak_planning_administration_1_desc:0 "중앙 계획과 현장 보고를 연결하여 생산 품목을 바꿀 때 숙련 손실을 줄입니다. 공산정부를 잃으면 제거됩니다."
 HOK_KOR_pak_planning_administration_2:0 "계획행정 II"
 HOK_KOR_pak_planning_administration_2_desc:0 "중앙 계획과 현장 보고를 연결하여 생산 품목을 바꿀 때 숙련 손실을 줄입니다. 새 생산선의 시작 효율도 높입니다. 기존 생산선의 효율을 즉시 올리는 효과는 아닙니다. I단계를 대체하며 하위 단계의 혜택을 유지·강화합니다. 공산정부를 잃으면 제거됩니다."
 HOK_KOR_yeo_mobile_technical_training_project:0 "순회 기술교육"
 HOK_KOR_yeo_mobile_technical_training_project_desc:0 "기술교관을 연구기관과 지역 조합에 순회 배치하여 새로운 기술의 습득을 지원합니다. 전체 연구 속도 §G+10%§!가 사업 기간에만 적용됩니다.\n\n정치력 §Y150§!을 사용하고 민간공장은 점유하지 않습니다. §Y90일§! 동안 지속되며 기존 노농 협약·국가 생산계획 사업과 실행 제한을 공유합니다. 후속 내정사업 중 한 번에 하나만 실행할 수 있고, 종료 또는 취소 후 공통 §Y90일§!의 대기시간이 적용됩니다. 공산정부 상실, 항복, 내전 또는 해당 경로 상실 시 취소되며 정치력은 환급되지 않습니다. 기존 공산 경제정책 사업은 별도로 운영할 수 있습니다."
 HOK_KOR_yeo_rural_infrastructure_project:0 "농촌 기반시설 지원"
 HOK_KOR_yeo_rural_infrastructure_project_desc:0 "조합의 기술인력과 장비를 기반시설 공사에 배정하여 농촌의 교통·생산 기반을 정비합니다. 기반시설 건설 속도 §G+30%§!가 사업 기간에만 적용됩니다.\n\n정치력 §Y150§!을 사용하고 민간공장은 점유하지 않습니다. §Y90일§! 동안 지속되며 기존 노농 협약·국가 생산계획 사업과 실행 제한을 공유합니다. 후속 내정사업 중 한 번에 하나만 실행할 수 있고, 종료 또는 취소 후 공통 §Y90일§!의 대기시간이 적용됩니다. 공산정부 상실, 항복, 내전 또는 해당 경로 상실 시 취소되며 정치력은 환급되지 않습니다. 기존 공산 경제정책 사업은 별도로 운영할 수 있습니다."
 HOK_KOR_pak_process_conversion_project:0 "생산공정 전환 관리"
 HOK_KOR_pak_process_conversion_project_desc:0 "계획 사무국과 현장 기술대표가 설비 전환을 조율하여 생산 품목을 바꿀 때의 숙련 손실을 줄입니다. 생산 효율 유지 §G+20%§!가 사업 기간에만 적용됩니다.\n\n정치력 §Y150§!을 사용하고 민간공장은 점유하지 않습니다. §Y90일§! 동안 지속되며 기존 노농 협약·국가 생산계획 사업과 실행 제한을 공유합니다. 후속 내정사업 중 한 번에 하나만 실행할 수 있고, 종료 또는 취소 후 공통 §Y90일§!의 대기시간이 적용됩니다. 공산정부 상실, 항복, 내전 또는 해당 경로 상실 시 취소되며 정치력은 환급되지 않습니다. 기존 공산 경제정책 사업은 별도로 운영할 수 있습니다."
 HOK_KOR_pak_new_production_lines_project:0 "신규 생산선 가동 지원"
 HOK_KOR_pak_new_production_lines_project_desc:0 "표준 작업지침과 숙련 인력을 새 생산선에 배치하여 가동 초기의 생산 효율을 높입니다. 기본 생산 효율 §G+15%§!가 사업 기간에만 적용됩니다. 새 생산선의 시작 효율을 높이며 현재 생산선의 효율을 즉시 올리지는 않습니다.\n\n정치력 §Y150§!을 사용하고 민간공장은 점유하지 않습니다. §Y90일§! 동안 지속되며 기존 노농 협약·국가 생산계획 사업과 실행 제한을 공유합니다. 후속 내정사업 중 한 번에 하나만 실행할 수 있고, 종료 또는 취소 후 공통 §Y90일§!의 대기시간이 적용됩니다. 공산정부 상실, 항복, 내전 또는 해당 경로 상실 시 취소되며 정치력은 환급되지 않습니다. 기존 공산 경제정책 사업은 별도로 운영할 수 있습니다."
