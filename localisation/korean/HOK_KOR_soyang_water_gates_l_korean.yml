l_korean:
 #20261031_kpopmodder: Complete the inherited Soyang decisions with precise costs, bounded flooding and lifecycle cleanup.
 KOR_inundate_the_water_lines_desc:0 "수문을 열어 한강 수계의 통행을 어렵게 하면 수도로 향하는 진격을 늦출 수 있습니다. 그러나 물은 적군과 주민, 우리 군을 가리지 않습니다. 서울과 춘천을 방어선으로 삼으려면 도로와 공장의 피해도 감수해야 합니다.\n\n정치력 25를 지불하고 14일간 준비합니다. 침수는 서울·춘천 두 프로빈스에만 적용되며, 건물 피해는 경기·강원 두 주에 각각 발생합니다. 준비 중 전쟁이 끝나거나 소유·통제·댐 조건을 잃으면 취소되며 비용은 반환되지 않습니다. 침수 중에도 같은 안전 조건이 사라지면 수문은 자동으로 정상화됩니다."
 KOR_drain_the_water_lines_desc:0 "물에 잠긴 도로를 다시 쓰고 공장에 드나들려면 먼저 수위를 낮춰야 합니다. 방어를 위해 내린 비상조치를 거두고 수문을 평상시 운용으로 돌립니다.\n\n정치력 25를 지불하고 14일 후 이 수문 조절로 발생한 서울·춘천의 침수 효과를 제거합니다. 이미 손상된 공장과 기반시설은 별도로 수리해야 합니다. 도중에 전쟁이 끝나거나 소유·통제·댐 조건을 잃으면 자동으로 정상화되며 비용은 반환되지 않습니다."
 HOK_KOR_soyang_flooded:0 "소양강댐 비상 방류"
 HOK_KOR_soyang_flooded_desc:0 "소양강댐의 비상 방류로 한강 수계의 통행과 보급이 어려워졌습니다. 이 방류가 끝나면 침수 효과가 해제되지만 파손된 시설은 별도로 수리해야 합니다."
 HOK_KOR_soyang_opening_started_tt:0 "14일간 수문 개방을 준비합니다. 준비를 마치면 서울과 춘천에 비상 방류 효과가 적용됩니다."
 HOK_KOR_soyang_flood_effect_tt:0 "§Y서울·춘천§! 두 프로빈스에 §Y소양강댐 비상 방류§!를 적용합니다. 방어 §G+50%§!, 이동속도 §R-50%§!, 참호 구축속도 §R-20%§!, 보급 §R-40%§!이며 이동 중 조직력 손실과 트럭 소모가 증가합니다.\n§Y경기·강원§! 두 주 각각 기반시설 §R1단계분§!, 민간공장·군수공장 §R각 0.5단계분§!을 손상시킵니다. 다시 개방할 때도 같은 피해가 발생합니다."
 HOK_KOR_soyang_draining_started_tt:0 "14일간 수문을 정상화합니다. 작업이 끝날 때까지 비상 방류 효과가 유지됩니다."
 HOK_KOR_soyang_normalized_tt:0 "이 수문 조절로 발생한 서울·춘천의 비상 방류 효과를 제거합니다. 공장·기반시설 손상과 다른 원인의 침수 효과는 그대로 남습니다."
 HOK_KOR_soyang_cancelled_tt:0 "수문 작업을 취소하고 이 조치의 비상 방류 효과만 제거합니다. 이미 지불한 정치력은 반환되지 않습니다."
