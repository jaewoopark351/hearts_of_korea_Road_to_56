#20260926_kpopmodder: Use escaped ASCII dialogue quotes and compact decision UI text; preserve gameplay and explicit lifecycle warnings.
#20260926_kpopmodder: Compact new focus descriptions for the fixed-height UI; preserve gameplay and non-focus localisation.
#20260926_kpopmodder: Restore fictional class-conscious and hardline planning voices while preserving all gameplay rules.
#20260925_kpopmodder: Rewrite focus, decision and event prose with grounded voices; preserve keys, gameplay rules and paired Korean text.
#20260923_kpopmodder: 요청한 반복 디시전 7종의 민간공장 비용을 제거하고 정치력 150 비용에 맞춰 설명을 동기화합니다.
 #20260922_kpopmodder: Describe preserved research benefits and distinguish the two political-power-only projects.
 #20260922_kpopmodder: Localise the two communist policy choices and their bounded paid projects.
 HOK_KOR_yeo_cooperative_registry:0 "협동조합 등록망"
 HOK_KOR_yeo_cooperative_registry_desc:0 "\"출자자 명단입니까?\" \"주인들의 명단이오.\"\n조합원과 공동 자산을 기록하겠습니다. 노동자의 설비와 작업 경험이 산업 연구의 출발점입니다."
 HOK_KOR_yeo_joint_purchasing:0 "연합 공동구매 우선"
 HOK_KOR_yeo_joint_purchasing_desc:0 "\"부르주아의 금고보다 비싼 기계군.\"\n\"그러니 동무 혼자 사지 말자는 거요.\"\n조합 자금을 모아 공동 설비와 작업장 확충에 먼저 쓰겠습니다."
 HOK_KOR_yeo_rural_credit:0 "지역 자율금융 우선"
 HOK_KOR_yeo_rural_credit_desc:0 "\"우리 돈의 주인을 먼 책상 뒤에 앉히지는 맙시다.\"\n지역 신용조합이 공동 자금을 운용하게 하여, 현장의 판단과 행정 협력을 먼저 뒷받침하겠습니다."
 HOK_KOR_yeo_cooperative_workshops:0 "협동 작업장"
 HOK_KOR_yeo_cooperative_workshops_desc:0 "\"동무도 주인이오. 공구 쓰는 법부터 배웁시다.\"\n수리·가공 작업장을 함께 운영합니다. 전자공학 연구 100% 1회, 공동구매 선택 시 산업 연구 75% 1회도 얻습니다."
 HOK_KOR_yeo_cooperative_federation:0 "전국 협동조합 연합"
 HOK_KOR_yeo_cooperative_federation_desc:0 "\"프롤레타리아 만세! 이제 어느 조합부터 도울지 정합시다.\"\n전국의 경험을 잇겠습니다. 선택한 정책만 II단계로 교체하고 해당 기간제 사업을 엽니다."
 HOK_KOR_pak_machine_tool_allocation:0 "공작기계 배치계획"
 HOK_KOR_pak_machine_tool_allocation_desc:0 "\"인민의 선반을 놀렸다면 인민 앞에서 설명하시오.\"\n공작기계를 필요한 공정에 먼저 배치하고, 노동자가 쌓은 운용 경험을 함께 나누겠습니다."
 HOK_KOR_pak_capital_goods_board:0 "군수설비 확충 우선"
 HOK_KOR_pak_capital_goods_board_desc:0 "\"오늘의 숫자는 줄겠군요.\" \"그래서 내일의 공장을 완성해야 하오.\"\n한정된 설비와 강재를 새 군수공장 건설에 먼저 배정하겠습니다."
 HOK_KOR_pak_steel_delivery_schedules:0 "현행 생산계획 우선"
 HOK_KOR_pak_steel_delivery_schedules_desc:0 "\"동무, 도면은 먹지도 쏘지도 못하오.\"\n미래의 공장보다 지금 멈춘 생산선에 원료를 먼저 보내겠습니다. 현행 계획에는 완성품으로 답해야 합니다."
 HOK_KOR_pak_industrial_reporting:0 "공업통계 보고망"
 HOK_KOR_pak_industrial_reporting_desc:0 "\"계획을 달성한 것은 공장이오, 그대의 펜이오?\"\n설비 설치와 자재 인수 실적을 같은 양식으로 보고하게 하겠습니다. 숫자는 현장과 같아야 합니다."
 HOK_KOR_pak_heavy_industry_dispatch:0 "중공업 종합배정"
 HOK_KOR_pak_heavy_industry_dispatch_desc:0 "\"기계는 보냈습니다.\" \"사람과 쇠는 누가 보냈소?\"\n설비·자재·인력 배정을 잇겠습니다. 선택한 정책만 II단계로 교체하고 해당 기간제 사업을 엽니다."
 HOK_KOR_yeo_joint_purchasing_1:0 "연합 공동구매 I"
 HOK_KOR_yeo_joint_purchasing_1_desc:0 "조합 자금의 우선순위를 연합 단위의 설비 구매와 민간 작업장 확충에 두었습니다. 공산정부를 잃으면 제거되며 정권 복귀만으로 자동 복구되지 않습니다."
 HOK_KOR_yeo_joint_purchasing_2:0 "연합 공동구매 II"
 HOK_KOR_yeo_joint_purchasing_2_desc:0 "조합 자금의 우선순위를 연합 단위의 설비 구매와 민간 작업장 확충에 두었습니다. 공산정부를 잃으면 제거되며 정권 복귀만으로 자동 복구되지 않습니다."
 HOK_KOR_yeo_local_credit_1:0 "지역 자율금융 I"
 HOK_KOR_yeo_local_credit_1_desc:0 "지역 신용조합의 자금 운영과 행정 협력을 우선합니다. 공산정부를 잃으면 제거되며 정권 복귀만으로 자동 복구되지 않습니다."
 HOK_KOR_yeo_local_credit_2:0 "지역 자율금융 II"
 HOK_KOR_yeo_local_credit_2_desc:0 "지역 신용조합의 자금 운영과 행정 협력을 우선합니다. 공산정부를 잃으면 제거되며 정권 복귀만으로 자동 복구되지 않습니다."
 HOK_KOR_pak_plant_expansion_1:0 "군수설비 확충 I"
 HOK_KOR_pak_plant_expansion_1_desc:0 "국가계획의 설비와 자재 배정을 새 군수공장 건설에 집중합니다. 공산정부를 잃으면 제거되며 정권 복귀만으로 자동 복구되지 않습니다."
 HOK_KOR_pak_plant_expansion_2:0 "군수설비 확충 II"
 HOK_KOR_pak_plant_expansion_2_desc:0 "국가계획의 설비와 자재 배정을 새 군수공장 건설에 집중합니다. 공산정부를 잃으면 제거되며 정권 복귀만으로 자동 복구되지 않습니다."
 HOK_KOR_pak_current_output_1:0 "현행 생산계획 I"
 HOK_KOR_pak_current_output_1_desc:0 "국가계획의 물자 배정을 현재 가동 중인 군수공장의 생산에 집중합니다. 공산정부를 잃으면 제거되며 정권 복귀만으로 자동 복구되지 않습니다."
 HOK_KOR_pak_current_output_2:0 "현행 생산계획 II"
 HOK_KOR_pak_current_output_2_desc:0 "국가계획의 물자 배정을 현재 가동 중인 군수공장의 생산에 집중합니다. 공산정부를 잃으면 제거되며 정권 복귀만으로 자동 복구되지 않습니다."
 HOK_KOR_communist_policy_projects:0 "공산 경제정책 실행"
 HOK_KOR_communist_policy_projects_desc:0 "\"동무들, 회의가 끝났다고 일이 끝난 것은 아니오.\"\n선택한 경제정책을 집행합니다. 사업당 정치력 150, 민간공장 점유 없음. 90일간 하나만 운영하며 종료/취소 후 이 분류 전체가 90일간 대기합니다.\n공산 후속 내정사업과는 동시 진행 및 대기시간 제한을 공유하지 않습니다."
 HOK_KOR_communist_policy_no_active_project_tt:0 "다른 공산 경제정책 사업을 진행하고 있지 않음"
 HOK_KOR_communist_policy_cooldown_finished_tt:0 "이전 공산 경제정책 사업의 종료 또는 취소 후 90일이 지남"
 HOK_KOR_communist_policy_project_start_tt:0 "정치력 §Y150§!, 민간공장 점유 없음. 효과는 §Y90일§!간 적용됩니다.\n공산 경제정책 사업 중 하나만 진행. 종료/취소 후 이 분류 전체가 §Y90일§!간 재착수 불가합니다.\n공산정부/경로 상실, 항복/내전 시 취소되며 비용은 환급되지 않습니다."
 HOK_KOR_communist_policy_project_end_tt:0 "사업 효과 종료. 모든 공산 경제정책 사업은 §Y90일§!간 재착수 불가하며 비용은 환급되지 않습니다."
 HOK_KOR_yeo_joint_purchasing_project:0 "공동구매 조달 사업"
 HOK_KOR_yeo_joint_purchasing_project_desc:0 "\"한 조합의 주문이면 이 값에 못 줍니다.\" \"그래서 함께 왔소.\"\n공동 자금으로 자재와 기계를 조달하여 민간공장 건설을 돕습니다."
 HOK_KOR_yeo_rural_credit_project:0 "지역 금융 순환 사업"
 HOK_KOR_yeo_rural_credit_project_desc:0 "\"동무가 다시 일해야 우리 돈도 도는 것 아니겠소.\"\n조합의 자금을 건설 현장으로 돌려 여러 종류의 건설을 지원합니다."
 HOK_KOR_pak_plant_expansion_project:0 "군수설비 집중 건설"
 HOK_KOR_pak_plant_expansion_project_desc:0 "\"혁명의 공장은 구호로 세우는 게 아니오.\"\n기계와 인력을 군수공장 건설에 집중합니다. 공장을 즉시 지급하지는 않습니다."
 HOK_KOR_pak_current_output_project:0 "현행 생산 집중 지원"
 HOK_KOR_pak_current_output_project_desc:0 "\"계획에는 후퇴가 없소.\" \"그러면 원료와 정비공부터 보내시오.\"\n새 공장을 짓는 대신 가동 중인 군수공장의 생산을 지원합니다."
 HOK_KOR_yeo_cooperative_workshops_electronics_bonus:0 "협동 작업장 전자공학 연구"
 HOK_KOR_communist_policy_project_start_pp_only_tt:0 "정치력 §Y150§!, 민간공장 점유 없음. 효과는 §Y90일§!간 적용됩니다.\n공산 경제정책 사업 중 하나만 진행. 종료/취소 후 이 분류 전체가 §Y90일§!간 재착수 불가합니다.\n공산정부/경로 상실, 항복/내전 시 취소되며 비용은 환급되지 않습니다."
 HOK_KOR_communist_policy_project_end_pp_only_tt:0 "사업 효과 종료. 모든 공산 경제정책 사업은 §Y90일§!간 재착수 불가하며 비용은 환급되지 않습니다."
