#20260923_kpopmodder: Describe regional operating conditions and shared field-specialization rewards.
 HOK_KOR_cmn_export_invoices:0 "수출거래 명세"
 HOK_KOR_cmn_export_invoices_desc:0 "수출 계약과 결제 기록을 정비하여 국내 생산시설이 안정적으로 해외 거래를 이어갈 기반을 마련합니다."
 HOK_KOR_cmn_commercial_arbitration:0 "상거래 중재절차"
 HOK_KOR_cmn_commercial_arbitration_desc:0 "거래 분쟁의 조정 기준을 정하고 수출업체의 설비 투자를 지원합니다."
 HOK_KOR_cmn_shipping_documents:0 "선적서류 통일"
 HOK_KOR_cmn_shipping_documents_desc:0 "선적 서류와 통신 절차를 통일하고 전자 장비를 연구하여 납품 지연을 줄입니다."
 HOK_KOR_cmn_market_sampling:0 "해외시장 견본"
 HOK_KOR_cmn_market_sampling_desc:0 "거래 조정과 선적 체계를 모두 갖춘 뒤 해외 견본 전시와 시장 개척을 지원합니다."
 HOK_KOR_cmn_export_settlement:0 "수출대금 결제관행"
 HOK_KOR_cmn_export_settlement_desc:0 "수출대금 결제와 국내 투자의 연결을 정착시켜 기존 수출거래 체계를 강화합니다."
 HOK_KOR_cmn_ore_classification:0 "원료 광종분류"
 HOK_KOR_cmn_ore_classification_desc:0 "광종과 공정별 투입 원료를 조사하고 산업 기술 연구를 지원합니다."
 HOK_KOR_cmn_scrap_collection:0 "폐금속 수거망"
 HOK_KOR_cmn_scrap_collection_desc:0 "폐금속과 공정 부산물을 다시 투입할 수거망을 마련하여 자원 생산과 원료 부족 대응을 개선합니다."
 HOK_KOR_cmn_coke_testing:0 "코크스 품질시험"
 HOK_KOR_cmn_coke_testing_desc:0 "연료와 광물의 품질시험을 지원하여 채굴 기술을 발전시킵니다."
 HOK_KOR_cmn_foundry_exchange:0 "제련 현장교류"
 HOK_KOR_cmn_foundry_exchange_desc:0 "수거망과 품질시험을 모두 갖춘 뒤 제련 현장의 작업 경험을 공유하고 재투자를 지원합니다."
 HOK_KOR_cmn_closed_material_cycle:0 "원료 순환체계"
 HOK_KOR_cmn_closed_material_cycle_desc:0 "원료의 수거·품질시험·재투입을 연결하여 자원 생산과 원료 부족 대응의 기존 혜택을 강화합니다."
 HOK_KOR_cmn_motor_driver_courses:0 "기동부대 운전과정"
 HOK_KOR_cmn_motor_driver_courses_desc:0 "기동부대 운전과정을 정비하고 육군의 차량 운용 경험을 축적합니다."
 HOK_KOR_cmn_mechanized_loading:0 "기계화 승하차훈련"
 HOK_KOR_cmn_mechanized_loading_desc:0 "기계화부대의 승하차·정비 절차를 통일하여 기동 속도와 연료 운용을 개선합니다."
 HOK_KOR_cmn_march_discipline:0 "기동종대 규율"
 HOK_KOR_cmn_march_discipline_desc:0 "무선 연락과 기동종대의 행군 기록을 표준화합니다. 전자공학 연구와 육군의 실무 경험을 지원합니다."
 HOK_KOR_cmn_mobile_unit_recovery:0 "기동부대 재정렬"
 HOK_KOR_cmn_mobile_unit_recovery_desc:0 "기계화 운용과 행군 규율을 함께 정착시켜 육군 이동과 연료 절감의 기존 혜택을 강화합니다."
 HOK_KOR_cmn_emergency_turn_drills:0 "긴급변침 연습"
 HOK_KOR_cmn_emergency_turn_drills_desc:0 "함대의 긴급변침과 손상 함정의 이탈을 훈련하여 해군 경험을 축적합니다."
 HOK_KOR_cmn_smoke_screen_procedures:0 "연막 이탈절차"
 HOK_KOR_cmn_smoke_screen_procedures_desc:0 "초기 교전 이후 연막을 이용한 이탈 절차를 마련해 철수 확률과 철수 속도를 높입니다."
 HOK_KOR_cmn_rescue_station_drills:0 "해상구조 당직"
 HOK_KOR_cmn_rescue_station_drills_desc:0 "해상구조 당직과 지원 함정의 활동을 정비하여 해군의 작전 범위와 함선 수리를 개선합니다."
 HOK_KOR_cmn_flight_weather_logs:0 "비행기상 일지"
 HOK_KOR_cmn_flight_weather_logs_desc:0 "비행장별 기상 기록과 통신 장비를 보급하고 공군 경험을 축적합니다."
 HOK_KOR_cmn_instrument_approaches:0 "계기접근 절차"
 HOK_KOR_cmn_instrument_approaches_desc:0 "계기에 의존한 접근과 착륙을 훈련하여 비행 사고를 줄입니다."
 HOK_KOR_cmn_adverse_weather_flying:0 "악천후 비행규정"
 HOK_KOR_cmn_adverse_weather_flying_desc:0 "관측 자료와 운용 교범으로 악천후의 불이익을 줄입니다. 계기비행 가지와 함께 추진할 수 있습니다."
 HOK_KOR_cmn_export_practice_1:0 "수출거래 체계 I"
