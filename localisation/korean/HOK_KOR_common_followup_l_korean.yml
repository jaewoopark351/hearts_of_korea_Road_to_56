#20260926_kpopmodder: Use escaped ASCII dialogue quotes and compact decision UI text; preserve gameplay and explicit lifecycle warnings.
#20260926_kpopmodder: Compact new focus descriptions for the fixed-height UI; preserve gameplay and non-focus localisation.
#20260925_kpopmodder: Rewrite focus, decision and event prose with grounded voices; preserve keys, gameplay rules and paired Korean text.
#20260923_kpopmodder: Describe regional operating conditions and shared field-specialization rewards.
 HOK_KOR_cmn_export_invoices:0 "수출거래 명세"
 HOK_KOR_cmn_export_invoices_desc:0 "물건을 보냈는데 대금이 묶이면 다음 달의 작업도 멈춥니다. 계약과 결제 기록을 맞추어 상품의 값이 공장으로 돌아오게 하겠습니다."
 HOK_KOR_cmn_commercial_arbitration:0 "상거래 중재절차"
 HOK_KOR_cmn_commercial_arbitration_desc:0 "불량의 책임을 다투는 동안 다음 주문이 끊깁니다. 상거래 중재 기준을 세워 수출업체가 거래와 설비 투자를 이어가게 하겠습니다."
 HOK_KOR_cmn_shipping_documents:0 "선적서류 통일"
 HOK_KOR_cmn_shipping_documents_desc:0 "짐은 부두에 있는데 서류가 달라 배에 싣지 못합니다. 선적 서식과 통신을 통일하여 화물보다 서류가 늦는 일을 줄이겠습니다."
 HOK_KOR_cmn_market_sampling:0 "해외시장 견본"
 HOK_KOR_cmn_market_sampling_desc:0 "\"값은 알겠소. 직접 만져 볼 수는 없습니까?\"\n거래와 선적 체계에 견본 전시를 더해 첫 주문을 끌어내겠습니다."
 HOK_KOR_cmn_export_settlement:0 "수출대금 결제관행"
 HOK_KOR_cmn_export_settlement_desc:0 "수출대금이 들어오는 날을 알아야 원료와 품삯을 준비합니다. 결제 관행을 정착시켜 한 번의 주문을 다음 투자로 잇겠습니다."
 HOK_KOR_cmn_ore_classification:0 "원료 광종분류"
 HOK_KOR_cmn_ore_classification_desc:0 "비슷해 보이는 돌도 용광로에서는 다릅니다. 광종과 공정별 원료를 조사하여 어디에 무엇을 쓸지 산업 연구로 밝혀내겠습니다."
 HOK_KOR_cmn_scrap_collection:0 "폐금속 수거망"
 HOK_KOR_cmn_scrap_collection_desc:0 "공장 뒤의 쇳조각도 다시 쓸 원료입니다. 폐금속과 부산물을 회수하여 새 원료가 부족할 때 손에 쥔 것부터 살리겠습니다."
 HOK_KOR_cmn_coke_testing:0 "코크스 품질시험"
 HOK_KOR_cmn_coke_testing_desc:0 "불이 붙는다고 같은 연료는 아닙니다. 코크스와 광물의 품질을 시험하고 결과를 채굴 현장에 돌려보내겠습니다."
 HOK_KOR_cmn_foundry_exchange:0 "제련 현장교류"
 HOK_KOR_cmn_foundry_exchange_desc:0 "옆 공장도 같은 실패를 되풀이할 필요는 없습니다. 수거망과 품질시험을 갖춘 제련소들이 경험을 나누고 설비에 재투자하게 하겠습니다."
 HOK_KOR_cmn_closed_material_cycle:0 "원료 순환체계"
 HOK_KOR_cmn_closed_material_cycle_desc:0 "수거한 원료가 창고에서 잊혀져서는 안 됩니다. 품질시험과 재투입까지 이어 자원 생산과 원료 부족 대응을 강화하겠습니다."
 HOK_KOR_cmn_motor_driver_courses:0 "기동부대 운전과정"
 HOK_KOR_cmn_motor_driver_courses_desc:0 "\"차는 움직일 줄 압니다.\"\n\"앞차가 멈추면 뒤의 종대는?\"\n운전대를 잡는 법을 넘어 부대 전체를 움직이는 법을 가르치겠습니다."
 HOK_KOR_cmn_mechanized_loading:0 "기계화 승하차훈련"
 HOK_KOR_cmn_mechanized_loading_desc:0 "차량만 떠나고 장비가 땅에 남으면 기동이 아닙니다. 승하차와 정비 순서를 맞추어 사람과 장비가 함께 움직이게 하겠습니다."
 HOK_KOR_cmn_march_discipline:0 "기동종대 규율"
 HOK_KOR_cmn_march_discipline_desc:0 "선두의 도착이 종대 전체의 도착은 아닙니다. 무선 연락과 행군 기록을 맞추어 뒤처진 차량까지 파악하겠습니다."
 HOK_KOR_cmn_mobile_unit_recovery:0 "기동부대 재정렬"
 HOK_KOR_cmn_mobile_unit_recovery_desc:0 "목적지에 도착한 차량들을 다시 부대로 모아야 합니다. 기계화 운용과 행군 규율을 결합해 재정렬 때도 시간과 연료를 아끼겠습니다."
 HOK_KOR_cmn_emergency_turn_drills:0 "긴급변침 연습"
 HOK_KOR_cmn_emergency_turn_drills_desc:0 "함대가 침로를 바꿀 때 손상된 배를 놓쳐서는 안 됩니다. 긴급변침과 이탈을 반복하여 각 함정이 제 차례와 거리를 익히게 하겠습니다."
 HOK_KOR_cmn_smoke_screen_procedures:0 "연막 이탈절차"
 HOK_KOR_cmn_smoke_screen_procedures_desc:0 "연막은 펼쳤지만 돌아갈 방향을 모르면 철수가 아닙니다. 초기 교전 뒤의 신호와 이탈 절차를 익혀 함대를 빠져나오게 하겠습니다."
 HOK_KOR_cmn_rescue_station_drills:0 "해상구조 당직"
 HOK_KOR_cmn_rescue_station_drills_desc:0 "구조 요청을 받은 뒤 준비를 시작해서는 늦습니다. 당직과 지원 함정, 수리 절차를 정비하여 먼 바다에서도 서로를 지키겠습니다."
 HOK_KOR_cmn_flight_weather_logs:0 "비행기상 일지"
 HOK_KOR_cmn_flight_weather_logs_desc:0 "출발지의 맑은 하늘이 목적지까지 이어지지는 않습니다. 비행장별 기상 일지와 통신으로 다음 조종사에게 관측을 전하겠습니다."
 HOK_KOR_cmn_instrument_approaches:0 "계기접근 절차"
 HOK_KOR_cmn_instrument_approaches_desc:0 "\"활주로가 보이지 않습니다.\"\n\"계기를 확인하고, 익힌 절차대로.\"\n시야를 잃기 전에 계기접근과 착륙을 배워야 합니다."
 HOK_KOR_cmn_adverse_weather_flying:0 "악천후 비행규정"
 HOK_KOR_cmn_adverse_weather_flying_desc:0 "돌아올 때의 하늘은 다를 수 있습니다. 관측과 교범으로 악천후의 부담을 줄이겠습니다. 계기비행 가지와 함께 추진할 수 있습니다."
 HOK_KOR_cmn_export_practice_1:0 "수출거래 체계 I"
 HOK_KOR_cmn_export_practice_1_desc:0 "수출거래 체계 I의 운용 기준을 정착시킨 제도입니다. 공통 분야 정책이므로 집권 이념이 바뀌어도 유지됩니다."
 HOK_KOR_cmn_export_practice_2:0 "수출거래 체계 II"
 HOK_KOR_cmn_export_practice_2_desc:0 "수출거래 체계 II의 운용 기준을 정착시킨 제도입니다. 공통 분야 정책이므로 집권 이념이 바뀌어도 유지됩니다."
