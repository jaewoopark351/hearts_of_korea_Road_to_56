 HOK_KOR_nrsc_staff_registry:0 "참모보직 정비"
 HOK_KOR_nrsc_staff_registry_desc:0 "\"이 보직은 자원자입니까?\"\n\"아니. 아직 통보하지 않은 사람이다.\"\n구국군의 참모 명부에 전문 분야와 인수인계 책임을 함께 적겠습니다."
 HOK_KOR_nrsc_operations_directorate:0 "작전기획국"
 HOK_KOR_nrsc_operations_directorate_desc:0 "\"그때까지 준비가 됩니까?\"\n\"되도록 계획을 세우라는 명령입니다.\"\n기존 참모 체계에 작전기획을 더해 준비 속도와 최대 계획 보너스를 높입니다."
 HOK_KOR_nrsc_field_report_system:0 "야전보고 체계"
 HOK_KOR_nrsc_field_report_system_desc:0 "\"보고의 현재 위치는?\" \"사단장님 책상입니다.\"\n\"부대 위치 말이다!\"\n통신·보고를 통일합니다. 작전기획국과 독립적으로 추진할 수 있습니다."
 HOK_KOR_nrsc_staff_regulations:0 "참모업무 규정"
 HOK_KOR_nrsc_staff_regulations_desc:0 "\"부재중이면 누가 책임집니까?\"\n\"그 아래 적힌 사람. 자네 이름도 있군.\"\n작전기획과 야전보고를 묶어 기존 계획 혜택을 강화하겠습니다."
 HOK_KOR_nrsc_staff_administration_1:0 "참모업무 체계 I"
 HOK_KOR_nrsc_staff_administration_1_desc:0 "구국군의 승리를 의심할 이유는 없습니다. 승리하기 전까지 어느 부대가 무엇을 준비해야 하는지는 조금 더 자세히 살펴야겠습니다. 작전기획국은 담당 업무와 준비 일정을 정하고 자료를 모아 계획을 검토합니다. 참모가 자리를 비워도 인계할 책임은 남습니다. 조국을 향한 확신만으로 빈 책상에서 작전이 완성되지는 않으니 말입니다.\n\n기존 군 지휘기관 및 다른 참모 정책과 함께 적용됩니다. 파시즘 정부를 잃으면 제거됩니다."
 HOK_KOR_nrsc_staff_administration_2:0 "참모업무 체계 II"
 HOK_KOR_nrsc_staff_administration_2_desc:0 "책상 위에서는 전군이 질서정연하게 진격하고 있습니다. 야전 보고에 따르면 몇 부대의 현재 위치부터 다시 확인해야 합니다. 구국군은 통일된 군대의 위엄을 위해 우선 지도와 현실을 통일하기로 했습니다. 공통 규정으로 부대의 준비와 위치를 계획에 반영하고, 담당자가 바뀌어도 검토와 인계가 이어지게 합니다. 이제 승리의 구상에는 그곳까지 도착할 준비도 포함됩니다.\n\n참모업무 체계 I을 대체하여 기존 계획 혜택을 강화합니다. 파시즘 정부를 잃으면 제거됩니다."
