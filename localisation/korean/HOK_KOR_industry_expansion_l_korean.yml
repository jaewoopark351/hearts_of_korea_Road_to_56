l_korean:
#20260921_kpopmodder: 승인된 보상 강화에 맞춰 최종 교체값·영구 효과·반복 사업 조건과 협정 설명을 두 언어 채널에 동기화합니다.
#20260921_kpopmodder: 현재 산업 국민정신 수치에 중점·국민정신 설명과 통합 생산계획 툴팁을 맞추고 단계 교체를 명시합니다.
#20260921_kpopmodder: 바닐라 산업·교육·투자 구조를 한국의 기존 기관과 연결한 신규 설명을 양쪽 언어 채널에 제공합니다.
 HOK_KOR_link_power_grids:0 "전국 전력망 연계"
 HOK_KOR_link_power_grids_desc:0 "지역마다 따로 움직이는 발전과 배전 체계로는 늘어나는 공업 수요를 감당하기 어렵습니다. 기존 발전시설을 공동 배전계획으로 연결하여 공장이 필요한 전력을 안정적으로 공급받게 할 것입니다.\n\n§Y연계된 전력망§! 국민정신을 얻습니다. 이 국민정신의 효과: 공장 에너지 소비 §G-10%§!."
 HOK_KOR_industrial_power_allocation:0 "산업용 전력 배분"
 HOK_KOR_industrial_power_allocation_desc:0 "발전량이 충분해도 지역과 시간에 따른 수급 불균형은 공장의 가동을 멈추게 합니다. 공업지대의 전력 사용을 조사하고 발전소와 배전소가 함께 공급계획을 세우도록 하겠습니다.\n\n§Y연계된 전력망§!을 §Y산업용 전력 배분§!으로 교체합니다. 교체 후 이 국민정신의 효과: 공장 에너지 소비 §G-20%§!. 이전 단계와 중첩되지 않습니다."
 HOK_KOR_industrial_measurement_standards:0 "공업 계량규격 통일"
 HOK_KOR_industrial_measurement_standards_desc:0 "공장마다 다른 치수와 검사 기준은 부품의 호환성을 떨어뜨리고 생산계획을 어지럽힙니다. 도량형과 공업 계량규격을 정리하여 연구 성과가 현장의 설비와 제품에 이어지도록 하겠습니다."
 HOK_KOR_factory_safety_inspections:0 "공장 안전검사제"
 HOK_KOR_factory_safety_inspections_desc:0 "반복되는 산업재해는 숙련된 노동자를 잃게 하고 지역사회와 공장의 신뢰를 무너뜨립니다. 정기 안전검사와 작업장 교육을 정착시켜 산업 성장의 기반을 지키겠습니다."
 HOK_KOR_national_power_coordination:0 "국가전력조정위원회"
 HOK_KOR_national_power_coordination_desc:0 "팔도의 공장과 광산이 안정적으로 가동되려면 발전과 배전이 하나의 계획 아래 움직여야 합니다. 국가전력조정위원회가 전력 수급과 설비 보수를 조정하여 산업의 낭비를 줄일 것입니다.\n\n§Y산업용 전력 배분§!을 §Y국가전력조정위원회§!로 교체합니다. 교체 후 이 국민정신의 효과: 공장 에너지 소비 §G-30%§!. 이전 단계와 중첩되지 않습니다."
 HOK_KOR_technical_colleges:0 "실업전문학교 확충"
 HOK_KOR_technical_colleges_desc:0 "대학의 연구를 실제 설비와 제품으로 옮길 기술자가 필요합니다. 실업전문학교의 실습교육을 확충하여 전기와 통신 기술을 이해하는 인력을 길러내겠습니다."
 HOK_KOR_workshop_apprenticeships:0 "공장 도제교육"
 HOK_KOR_workshop_apprenticeships_desc:0 "새로운 기계를 들이는 것만으로 생산성이 높아지지는 않습니다. 숙련공의 경험을 신입 노동자에게 전수하는 도제교육을 마련하여 생산 현장의 시행착오를 줄이겠습니다.\n\n§Y공장 도제교육§! 국민정신을 얻습니다. 이 국민정신의 효과: 생산효율 성장 §G+30%§!."
 HOK_KOR_workers_night_schools:0 "노동자 야간학교"
 HOK_KOR_workers_night_schools_desc:0 "일을 시작한 뒤에도 배움의 기회는 이어져야 합니다. 공업지대의 야간학교가 읽기와 계산, 작업장 지식을 가르치고 노동자들이 산업사회의 변화에 참여하도록 돕겠습니다.\n\n안정도를 §G5%p§! 높이고, 연구 속도 §G+10%§!의 §Y노동자 야간교육§! 국민정신을 기한 없이 얻습니다. 농촌 순회교육 사업과는 별도의 효과입니다."
 HOK_KOR_university_industry_labs:0 "산학 공동연구실"
 HOK_KOR_university_industry_labs_desc:0 "대학의 실험실과 공장의 생산라인이 서로의 문제를 함께 풀도록 하겠습니다. 공동연구실은 현장의 요구를 연구 과제로 옮기고 새로운 공정을 시험할 기회를 마련할 것입니다."
 HOK_KOR_skilled_workforce:0 "숙련공 양성체계"
 HOK_KOR_skilled_workforce_desc:0 "학교의 교육과 공장의 실습이 하나의 경력으로 이어져야 합니다. 숙련도 인증과 재교육을 정착시켜 새로운 생산라인에도 경험을 갖춘 인력을 배치하겠습니다.\n\n§Y공장 도제교육§!을 §Y숙련공 양성체계§!로 교체합니다. 교체 후 이 국민정신의 효과: 생산효율 성장 §G+60%§!. 이전 단계보다 30%p 증가하며, 이전 단계와 중첩되지 않습니다."
 HOK_KOR_production_review:0 "생산공정 실태조사"
 HOK_KOR_production_review_desc:0 "공장을 더 짓기 전에 현재의 설비가 어떻게 쓰이는지 알아야 합니다. 생산 병목과 부품 공급을 조사하여 양산에 집중할지, 설계 변경에 유연하게 대응할지 결정할 것입니다."
 HOK_KOR_standardized_mass_production:0 "표준규격 대량생산"
 HOK_KOR_standardized_mass_production_desc:0 "검증된 설계와 부품 규격을 오래 유지하면 대규모 생산에 유리합니다. 생산효율의 상한을 높이는 대신 설계를 바꾸었을 때 생산라인을 다시 정비하는 부담을 감수하겠습니다.\n\n§Y표준규격 대량생산§! 국민정신을 얻습니다. 이 국민정신의 효과: 생산효율 상한 §G+15%§!, 생산라인 전환 시 효율 유지 §R-5%§!. §Y유연한 생산라인§!과 동시에 선택할 수 없습니다."
 HOK_KOR_flexible_production_lines:0 "유연한 생산라인"
 HOK_KOR_flexible_production_lines_desc:0 "새로운 장비에 신속히 대응할 수 있도록 설비와 부품 공급체계를 유연하게 만들겠습니다. 생산효율의 상한 일부를 양보하는 대신 설계가 바뀌어도 기존의 경험을 더 많이 활용할 것입니다.\n\n§Y유연한 생산라인§! 국민정신을 얻습니다. 이 국민정신의 효과: 생산라인 전환 시 효율 유지 §G+20%§!, 생산효율 상한 §R-2.5%§!. §Y표준규격 대량생산§!과 동시에 선택할 수 없습니다."
 HOK_KOR_production_quality_assurance:0 "생산품 품질보증"
 HOK_KOR_production_quality_assurance_desc:0 "납품 전에 같은 기준으로 부품과 완성품을 검사하면 새 생산라인의 시행착오를 줄일 수 있습니다. 검사 기록을 공장과 발주기관이 공유하는 품질보증 체계를 마련하겠습니다.\n\n§Y생산품 품질보증§! 국민정신을 얻습니다. 이 국민정신의 효과: 기본 생산효율 §G+10%§!."
 HOK_KOR_integrated_production_planning:0 "통합 생산계획"
 HOK_KOR_integrated_production_planning_desc:0 "선택한 생산 방식이 부품과 인력의 공급계획에도 반영되어야 합니다. 발주기관과 공장이 함께 일정을 조정하여 양산 또는 유연생산 체계의 장점을 더욱 살리겠습니다.\n\n선택한 생산 정책의 국민정신을 상위 단계로 교체합니다.\n§Y대량생산 선택 시§!: 생산효율 상한 §G+30%§!, 생산라인 전환 시 효율 유지 §R-5%§!.\n§Y유연생산 선택 시§!: 생산라인 전환 시 효율 유지 §G+40%§!, 생산효율 상한 §R-2.5%§!.\n이전 단계와 중첩되지 않으며 두 정책의 효과를 동시에 받지 않습니다."
 HOK_KOR_regional_industry_fund:0 "지역 공업 투자기금"
 HOK_KOR_regional_industry_fund_desc:0 "신도시와 산업단지를 잇는 생산 거점을 육성하려면 장기 자금과 건설 인력이 필요합니다. 각 지역의 후속 사업에 투자할 기금을 마련하고 공업시설 건설을 단계적으로 추진하겠습니다."
 HOK_KOR_pyeongan_machine_workshops:0 "평안 기계공업 육성"
 HOK_KOR_pyeongan_machine_workshops_desc:0 "평안의 산업 기반을 활용하여 기계 가공과 병기 생산을 맡을 공업 거점을 마련하겠습니다. 후속 투자 사업에 정치력과 민간 건설 역량을 투입하면 새로운 군수공장이 들어설 것입니다."
 HOK_KOR_gangwon_electrical_workshops:0 "강원 전기기기 공업"
 HOK_KOR_gangwon_electrical_workshops_desc:0 "강원의 발전시설과 공업 거점을 연결하여 전기기기와 산업 부품의 생산을 지원하겠습니다. 계획을 실행하려면 별도의 투자 사업을 통해 자금과 건설 역량을 배정해야 합니다."
 HOK_KOR_chungcheong_supplier_network:0 "충청 부품공급망"
 HOK_KOR_chungcheong_supplier_network_desc:0 "공업지대 사이에 위치한 충청은 여러 지역의 생산을 연결할 수 있습니다. 후속 투자 사업으로 민간공장을 세워 공업용 부품과 자재를 공급하는 거점으로 육성하겠습니다."
 HOK_KOR_gyeongsang_export_workshops:0 "경상 수출조선 지원"
 HOK_KOR_gyeongsang_export_workshops_desc:0 "경상의 항만과 공업시설을 활용하면 해상교역을 뒷받침할 선박을 더 안정적으로 건조할 수 있습니다. 후속 조선소 투자 사업에 건설 역량을 배정하여 수출 산업의 기반을 확충하겠습니다."
 HOK_KOR_energy_coordination_1:0 "연계된 전력망"
 HOK_KOR_energy_coordination_1_desc:0 "지역별 발전과 배전 계획을 연결하여 공장이 소비하는 전력의 낭비를 줄이고 있습니다.\n\n이 국민정신의 효과: 공장 에너지 소비 §G-10%§!."
 HOK_KOR_energy_coordination_2:0 "산업용 전력 배분"
 HOK_KOR_energy_coordination_2_desc:0 "공업지대의 수요에 맞추어 발전과 배전을 조정하는 체계를 마련했습니다.\n\n이 국민정신의 효과: 공장 에너지 소비 §G-20%§!. §Y연계된 전력망§!을 대체하며 이전 단계와 중첩되지 않습니다."
 HOK_KOR_energy_coordination_3:0 "국가전력조정위원회"
 HOK_KOR_energy_coordination_3_desc:0 "국가전력조정위원회가 산업 전력의 수급과 설비 보수를 조정하여 전력망의 효율을 높입니다.\n\n이 국민정신의 효과: 공장 에너지 소비 §G-30%§!. §Y산업용 전력 배분§!을 대체하며 이전 단계와 중첩되지 않습니다."
 HOK_KOR_night_school_spirit:0 "노동자 야간교육"
 HOK_KOR_night_school_spirit_desc:0 "일을 마친 노동자도 배움을 이어 갈 수 있도록 야간교육을 정착시켰습니다. 연구 속도 §G+10%§!가 기한 없이 적용됩니다."
 HOK_KOR_workforce_1:0 "공장 도제교육"
 HOK_KOR_workforce_1_desc:0 "숙련공의 현장 경험을 새 노동자에게 전달하여 생산라인이 효율을 쌓도록 돕습니다.\n\n이 국민정신의 효과: 생산효율 성장 §G+30%§!."
 HOK_KOR_workforce_2:0 "숙련공 양성체계"
 HOK_KOR_workforce_2_desc:0 "실업교육과 재교육을 연계하여 산업 현장에 숙련된 인력을 안정적으로 공급합니다.\n\n이 국민정신의 효과: 생산효율 성장 §G+60%§!. §Y공장 도제교육§!을 대체하며 이전 단계와 중첩되지 않습니다."
 HOK_KOR_mass_production_1:0 "표준규격 대량생산"
 HOK_KOR_mass_production_1_desc:0 "표준 설계를 오래 유지하여 생산효율 상한을 높이지만, 생산라인 전환 시 더 많은 효율을 잃습니다.\n\n이 국민정신의 효과: 생산효율 상한 §G+15%§!, 생산라인 전환 시 효율 유지 §R-5%§!."
 HOK_KOR_mass_production_2:0 "통합된 대량생산 계획"
 HOK_KOR_mass_production_2_desc:0 "부품과 인력 공급을 양산 일정에 맞추어 생산효율 상한을 더 높입니다. 생산라인 전환의 부담은 유지됩니다.\n\n이 국민정신의 효과: 생산효율 상한 §G+30%§!, 생산라인 전환 시 효율 유지 §R-5%§!. §Y표준규격 대량생산§!을 대체하며 이전 단계와 중첩되지 않습니다."
 HOK_KOR_flexible_production_1:0 "유연한 생산라인"
 HOK_KOR_flexible_production_1_desc:0 "설계 변경에도 기존 생산 경험을 활용할 수 있도록 설비를 구성했습니다. 생산효율 상한 일부를 양보합니다.\n\n이 국민정신의 효과: 생산라인 전환 시 효율 유지 §G+20%§!, 생산효율 상한 §R-2.5%§!."
 HOK_KOR_flexible_production_2:0 "통합된 유연생산 계획"
 HOK_KOR_flexible_production_2_desc:0 "설비와 부품 공급계획을 조정하여 생산라인 전환 시 더 많은 효율을 보존합니다. 생산효율 상한의 제약은 유지됩니다.\n\n이 국민정신의 효과: 생산라인 전환 시 효율 유지 §G+40%§!, 생산효율 상한 §R-2.5%§!. §Y유연한 생산라인§!을 대체하며 이전 단계와 중첩되지 않습니다."
 HOK_KOR_quality_control:0 "생산품 품질보증"
 HOK_KOR_quality_control_desc:0 "공통 검사 기준과 납품 기록을 활용하여 새 생산라인도 더 안정적인 효율로 가동합니다.\n\n이 국민정신의 효과: 기본 생산효율 §G+10%§!."
 HOK_KOR_regional_industry_projects:0 "지역 공업 투자"
 HOK_KOR_regional_industry_projects_desc:0 "지역별 후속 중점으로 공업 투자 사업을 준비할 수 있습니다. 각 사업은 정치력과 민간공장 사용, 90일의 공사 기간을 요구합니다. 같은 지역의 사업은 진행 중에 중복 착수할 수 없으며, 완료 또는 취소 뒤 조건을 갖추고 비용을 다시 내면 횟수 제한 없이 반복할 수 있습니다."
 HOK_KOR_regional_industry_fund_tt:0 "후속 지역 중점으로 §Y지역 공업 투자§! 사업을 준비할 수 있습니다. 각 사업은 §Y정치력 150§!과 §Y민간공장 5개§!를 §Y90일§! 동안 사용합니다. 완료 후 같은 사업을 다시 선택할 수 있으며, 건설 부지와 소유·완전통제 조건은 계속 필요합니다."
 HOK_KOR_pyeongan_industry_project:0 "평안 기계공장 투자"
 HOK_KOR_pyeongan_industry_project_desc:0 "평안의 기계공업 거점에 건설 인력과 자금을 투입합니다. 정치력 §Y150§!과 §Y90일§! 동안 민간공장 §Y5개§!를 사용하며, 완료하면 평안에 건설 슬롯 §G1개§!와 군수공장 §G1개§!를 추가합니다. 해당 주의 소유권이나 완전통제, 건설 부지를 잃거나 항복하면 취소됩니다. 이미 지출한 정치력은 반환되지 않습니다. 완료하거나 취소한 뒤 조건을 갖추고 비용을 다시 내면 횟수 제한 없이 다시 착수할 수 있습니다."
 HOK_KOR_gangwon_industry_project:0 "강원 전기기기 공장 투자"
 HOK_KOR_gangwon_industry_project_desc:0 "강원의 전기기기 공업에 건설 인력과 자금을 투입합니다. 정치력 §Y150§!과 §Y90일§! 동안 민간공장 §Y5개§!를 사용하며, 완료하면 강원에 건설 슬롯 §G1개§!와 민간공장 §G1개§!를 추가합니다. 해당 주의 소유권이나 완전통제, 건설 부지를 잃거나 항복하면 취소됩니다. 이미 지출한 정치력은 반환되지 않습니다. 완료하거나 취소한 뒤 조건을 갖추고 비용을 다시 내면 횟수 제한 없이 다시 착수할 수 있습니다."
 HOK_KOR_chungcheong_industry_project:0 "충청 부품공장 투자"
 HOK_KOR_chungcheong_industry_project_desc:0 "충청의 부품 공급망에 건설 인력과 자금을 투입합니다. 정치력 §Y150§!과 §Y90일§! 동안 민간공장 §Y5개§!를 사용하며, 완료하면 충청에 건설 슬롯 §G1개§!와 민간공장 §G1개§!를 추가합니다. 해당 주의 소유권이나 완전통제, 건설 부지를 잃거나 항복하면 취소됩니다. 이미 지출한 정치력은 반환되지 않습니다. 완료하거나 취소한 뒤 조건을 갖추고 비용을 다시 내면 횟수 제한 없이 다시 착수할 수 있습니다."
 HOK_KOR_gyeongsang_shipbuilding_project:0 "경상 수출조선소 투자"
 HOK_KOR_gyeongsang_shipbuilding_project_desc:0 "경상의 수출조선 산업에 건설 인력과 자금을 투입합니다. 정치력 §Y150§!과 §Y90일§! 동안 민간공장 §Y5개§!를 사용하며, 완료하면 경상에 건설 슬롯 §G1개§!와 조선소 §G1개§!를 추가합니다. 해당 주의 소유권이나 완전통제, 건설 부지를 잃거나 항복하면 취소됩니다. 이미 지출한 정치력은 반환되지 않습니다. 완료하거나 취소한 뒤 조건을 갖추고 비용을 다시 내면 횟수 제한 없이 다시 착수할 수 있습니다."
 HOK_KOR_integrated_production_planning_tt:0 "선택한 생산 정책의 국민정신을 상위 단계로 교체합니다.\n§Y표준규격 대량생산§!: 생산효율 상한 §G+30%§!, 생산라인 전환 시 효율 유지 §R-5%§!.\n§Y유연한 생산라인§!: 생산라인 전환 시 효율 유지 §G+40%§!, 생산효율 상한 §R-2.5%§!. 이전 단계와 중첩되지 않으며 두 정책의 효과를 동시에 받지 않습니다."
