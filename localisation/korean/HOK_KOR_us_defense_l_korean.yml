l_korean:
#20261111_kpopmodder: Use font-compatible separators in the new defence-cost tooltips.
#20261111_kpopmodder: Explain an unsuccessful stationing plan after refusal or changed circumstances.
#20261111_kpopmodder: Localise bilateral defence-cost spirits, conditional focus outcomes, stationing choices and news.
 HOK_KOR_us_defense_cost_sharing_1:0 "미국 방위비"
 HOK_KOR_us_defense_cost_sharing_1_desc:0 "상호방위조약의 서명에는 동맹을 지탱할 비용도 뒤따릅니다. 미국의 안보 약속을 유지하기 위해 우리 정부는 방위비를 분담하고, 국내에서 마련한 재원을 양국의 방위 협력에 투입합니다.\n\n상대국이 소멸하거나 양국이 전쟁 상태가 되면 제거됩니다."
 HOK_KOR_us_defense_cost_sharing_2:0 "미국 방위비"
 HOK_KOR_us_defense_cost_sharing_2_desc:0 "미군의 병영과 보급창, 수송망을 유지하는 비용이 새 협정에 따라 우리 예산에 더해졌습니다. 미국은 공정한 분담이라고 부르고, 우리는 안보를 위한 지출이라고 설명합니다. 어느 쪽 표현을 쓰든 청구서는 우리 정부가 지불해야 합니다.\n\n상대국이 소멸하거나 양국이 전쟁 상태가 되면 제거됩니다."
 HOK_KOR_korean_defense_contribution_1:0 "대한민국 방위비"
 HOK_KOR_korean_defense_contribution_1_desc:0 "대한민국이 상호방위조약에 따른 방위비를 분담합니다. 한국의 기여는 극동에서 우리의 안보 공약을 뒷받침하고, 그 비용이 미국 납세자에게만 돌아가는 부담을 줄여 줍니다.\n\n상대국이 소멸하거나 양국이 전쟁 상태가 되면 제거됩니다."
 HOK_KOR_korean_defense_contribution_2:0 "대한민국 방위비"
 HOK_KOR_korean_defense_contribution_2_desc:0 "새로운 주둔 협정에 따라 대한민국은 미군의 병영과 보급, 운영을 지원하는 비용을 확대하여 부담합니다. 한국은 안보를 얻고 우리는 납세자의 부담을 덜었습니다. 동맹의 가치는 굳건하며, 그 가치를 유지할 비용의 출처도 분명해졌습니다.\n\n상대국이 소멸하거나 양국이 전쟁 상태가 되면 제거됩니다."
 HOK_KOR_us_defense_treaty_request_tt:0 "미국이 조약 체결을 선택하면 양국에 방위비 국민정신이 추가됩니다.\n대한민국: §Y$HOK_KOR_us_defense_cost_sharing_1$§!: 소비재 공장 계수 §R+5%§!.\n미국: §Y$HOK_KOR_korean_defense_contribution_1$§!: 소비재 공장 계수 §G-5%§!."
 HOK_KOR_us_defense_treaty_accept_tt:0 "대한민국에 §Y$HOK_KOR_us_defense_cost_sharing_1$§!(소비재 공장 계수 §R+5%§!), 미국에 §Y$HOK_KOR_korean_defense_contribution_1$§!(소비재 공장 계수 §G-5%§!) 국민정신을 추가합니다."
 HOK_KOR_us_defense_station_request_tt:0 "미국에 주한미군 배치 협상을 제안합니다. 결과는 미국의 선택에 따릅니다.\n§Y배치·방위비 협정§!: 방위비 국민정신의 최종 소비재 공장 계수는 대한민국 §R+35%§!·미국 §G-15%§!, 대한민국에 주한미군 3개 사단 지급.\n§Y자치령 편입§!: 대한민국이 미국 자치령으로 전환되며, 기존 방위비 정신 유지·주한미군 3개 사단 지급.\n§Y주둔 거부§!: 기존 조약과 방위비 정신 유지, 추가 효과 없음.\n미국이 주둔을 승인해야 §YKATUSA§!의 주둔 승인 조건을 충족합니다."
 HOK_KOR_us_defense_waiting_tt:0 "미국의 주한미군 배치 협상 결정을 기다리는 중"
 HOK_KOR_us_defense_station_approved_tt:0 "미국이 주한미군 주둔을 승인함"
 HOK_KOR_us_defense_station_agreement_tt:0 "방위비 국민정신을 강화합니다. 국민정신의 최종 소비재 공장 계수:\n대한민국의 §Y$HOK_KOR_us_defense_cost_sharing_2$§!: §R+35%§!.\n미국의 §Y$HOK_KOR_korean_defense_contribution_2$§!: §G-15%§!.\n대한민국에 주한미군 3개 사단을 지급하고 §YKATUSA§! 중점의 주둔 승인 조건을 충족합니다.\n세계 뉴스 §Y대한민국과 미국 방위비 협정§!이 발생합니다."
 HOK_KOR_us_defense_dominion_tt:0 "대한민국이 미국의 §Y자치령§!이 됩니다.\n조약 단계의 양국 방위비 국민정신(소비재 공장 계수: 대한민국 §R+5%§!·미국 §G-5%§!)을 유지합니다.\n대한민국에 주한미군 3개 사단을 지급하고 §YKATUSA§! 중점의 주둔 승인 조건을 충족합니다.\n대한민국에 결과를 통보하고 세계 뉴스 §Y미국의 51번째 주 대한민국!§!이 발생합니다."
 HOK_KOR_us_defense_refused_tt:0 "주한미군 사단을 배치하지 않으며 추가 방위비 효과도 없습니다.\n이 결과로 기존 상호방위조약과 보유 중인 양국 방위비 국민정신을 변경하지 않습니다(정상 조약 단계의 소비재 공장 계수: 대한민국 §R+5%§!·미국 §G-5%§!).\n대한민국에 주둔 계획이 성립되지 않았음을 통보합니다."
 HOK_KOR_us_defense.1.t:0 "대한민국의 주한미군 배치 요청"
 HOK_KOR_us_defense.1.d:0 "대한민국 정부가 상호방위조약에 따른 협력을 구체화하기 위해 우리 군의 한국 주둔을 요청했다. 태평양의 전진 거점을 확보할 기회지만, 병력과 물자를 바다 건너에 유지하는 비용까지 미국 납세자에게 맡길 필요는 없을 것이다.\n\n한국에 주둔 비용의 확대 분담을 요구하며 배치를 승인할 수 있다. 더 나아가 대한민국을 미국 자치령으로 편입하여 그 안보와 대외 정책을 우리의 지도 아래 둘 수도 있다. 물론 조약만 유지한 채 병력 배치는 거부하는 선택도 남아 있다."
 HOK_KOR_us_defense.1.a:0 "주한미군 배치 및 방위비 협정을 체결한다."
 HOK_KOR_us_defense.1.b:0 "대한민국을 미국 자치령으로 편입한다."
 HOK_KOR_us_defense.1.c:0 "주한미군 주둔을 거부한다."
 HOK_KOR_us_defense.2.t:0 "미국의 주한미군 배치 승인"
 HOK_KOR_us_defense.2.d:0 "미국 정부가 우리 정부의 주한미군 배치 요청을 승인했다. 양국은 병력의 주둔과 운영을 지원하기 위한 새로운 방위비 분담 협정에도 합의했다.\n\n대한민국은 독립국 지위를 유지하며 미군의 주둔으로 안보를 보강하게 된다. 그 대신 우리 정부가 부담할 비용도 늘어났다. 워싱턴은 동맹의 책임을 공정하게 나누는 합의라고 발표했다."
 HOK_KOR_us_defense.2.a:0 "안보에는 대가가 따른다."
 HOK_KOR_us_defense.3.t:0 "미국의 51번째 주 대한민국!"
 HOK_KOR_us_defense.3.d:0 "미합중국 정부는 대한민국의 미국 자치령 편입을 발표했다. 새로운 관계 아래에서도 대한민국 정부는 국내 행정을 계속 담당하지만, 독자적인 대외·군사 행동에는 자치령 지위에 따른 제약을 받게 된다.\n\n미국 측은 이번 결정을 양국의 안보와 번영을 결합하는 역사적인 합의이자, ‘미국의 51번째 주’가 탄생하는 첫걸음이라고 선언했다."
 HOK_KOR_us_defense.3.a:0 "수락"
 HOK_KOR_us_defense.4.t:0 "주한미군 배치 무산"
 HOK_KOR_us_defense.4.d:0 "주한미군 배치를 위한 양국의 협의는 실제 병력 배치로 이어지지 못했다. 미국이 요청을 받아들이지 않았거나, 협의 도중 달라진 양국의 사정으로 주둔 계획을 실현할 수 없게 되었다.\n\n주둔을 위한 새로운 협정은 체결되지 않았고, 이번 결과만으로 기존 조약이나 방위비 약정을 변경하지는 않는다. 우리 군의 계획은 이제 미군의 도착을 전제로 삼을 수 없다."
 HOK_KOR_us_defense.4.a:0 "주둔을 전제로 한 계획을 재검토하라."
 HOK_KOR_us_defense.5.t:0 "대한민국과 미국 방위비 협정"
 HOK_KOR_us_defense.5.d:0 "대한민국 정부와 미합중국 정부는 주한미군 배치에 관한 협의를 마무리하고 새로운 방위비 분담 협정의 체결을 발표했다. 미국 측의 분담 확대 요구를 반영한 이번 협정에 따라, 대한민국은 미군의 주둔과 운영을 지원하기 위한 비용을 종전보다 확대하여 부담하게 된다.\n\n미국 정부는 이번 합의가 자국 납세자에게 편중된 부담을 줄이고, 동맹의 혜택과 책임을 공정하게 나누기 위한 조치라고 밝혔다. 또한 지속 가능한 동맹은 우호적인 선언뿐 아니라 그에 상응하는 비용을 부담하려는 의지 위에 세워져야 한다고 강조했다."
 HOK_KOR_us_defense.5.a:0 "동맹에도 청구서가 붙는군."
 HOK_KOR_us_defense.6.t:0 "미국의 51번째 주 대한민국!"
 HOK_KOR_us_defense.6.d:0 "미합중국 정부가 대한민국의 미국 자치령 편입을 공식 발표했다. 워싱턴은 대한민국을 ‘미국의 51번째 주’라고 부르며, 태평양 양안의 안보와 경제적 이해를 결합한 새로운 관계의 출범을 대대적으로 알렸다.\n\n대한민국은 자체 정부와 국내 행정체계를 유지하지만, 독립국으로 행사하던 권한 일부는 새로운 종속 관계에 따라 제한된다. 미국 정부는 이를 더욱 긴밀한 동맹의 완성이라고 설명하고 있다."
 HOK_KOR_us_defense.6.a:0 "별 하나를 더 달겠다는 것인가?"
