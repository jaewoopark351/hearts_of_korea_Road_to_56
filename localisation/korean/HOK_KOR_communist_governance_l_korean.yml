#20261003_kpopmodder: Apply varied HOI4 fascist and communist voices to description narrative; preserve effects and explicit rules.
#20261003_kpopmodder: Explain new decision and spirit policies through concrete circumstances; preserve gameplay and lifecycle rules.
#20260926_kpopmodder: Use escaped ASCII dialogue quotes and compact decision UI text; preserve gameplay and explicit lifecycle warnings.
#20260926_kpopmodder: Compact new focus descriptions for the fixed-height UI; preserve gameplay and non-focus localisation.
#20260926_kpopmodder: Restore fictional class-conscious and hardline planning voices while preserving all gameplay rules.
#20260925_kpopmodder: Rewrite focus, decision and event prose with grounded voices; preserve keys, gameplay rules and paired Korean text.
 #20260922_kpopmodder: Include technical extension and planning administration in the independently unlocked shared category.
 #20260922_kpopmodder: Describe the communist governance follow-up, preserved policy benefits, and bounded paid programs.
 HOK_KOR_yeo_worker_peasant_congress:0 "노농 협의대회"
 HOK_KOR_yeo_worker_peasant_congress_desc:0 "노동자는 빵값을, 농민은 곡식값을 말합니다. 붉은 깃발 아래에서도 사정은 다릅니다. 노농 대표가 마주 앉아 함께 살아갈 약속을 정하겠습니다."
 HOK_KOR_yeo_workplace_arbitration:0 "산업분쟁 조정위원회"
 HOK_KOR_yeo_workplace_arbitration_desc:0 "\"그 관행에 노동자의 몫은 어디 있습니까?\"\n조정위원회가 현장의 약속과 이행을 묻게 하겠습니다. 서명한 협약을 작업장 문밖에 세워 둘 수는 없습니다."
 HOK_KOR_yeo_local_councils:0 "지방협의회 정례화"
 HOK_KOR_yeo_local_councils_desc:0 "\"우리 나라 회의인데 왜 우리는 밖에서 기다립니까?\"\n지방협의회를 정례화하고 통신을 보강합니다. 노사협약 이행·지역민생 협약 사업을 엽니다."
 HOK_KOR_yeo_social_compact:0 "노농 협약 정착"
 HOK_KOR_yeo_social_compact_desc:0 "\"내일 다투더라도 오늘 잡은 손은 기억합시다.\"\n노농의 약속을 상설 기준으로 삼겠습니다. 노농 협약을 II로 강화하며 기존 조합 정책은 유지합니다."
 HOK_KOR_pak_national_asset_survey:0 "국유자산 실태조사"
 HOK_KOR_pak_national_asset_survey_desc:0 "\"인민의 설비라면서 왜 아무도 책임지지 않소?\"\n공장별 기계와 공정을 실사하여 먼지 속의 고장·유휴 설비를 생산계획과 산업 연구에 반영하겠습니다."
 HOK_KOR_pak_annual_output_targets:0 "연간 생산계획"
 HOK_KOR_pak_annual_output_targets_desc:0 "\"미달하면 어떻게 됩니까?\" \"그러니 필요한 것부터 쓰시오.\"\n목표 아래에 설비와 숙련, 책임자를 적겠습니다. 공장과 계획기관이 연간 실적을 함께 맞춥니다."
 HOK_KOR_pak_material_balance:0 "물자수급 대조표"
 HOK_KOR_pak_material_balance_desc:0 "\"인민의 강재에 공장장의 성씨가 새겨져 있소?\"\n쌓인 원료와 멈춘 공정을 한 대조표에 올려 배분과 산업 연구의 근거를 마련하겠습니다."
 HOK_KOR_pak_capacity_reviews:0 "생산능력 정기점검"
 HOK_KOR_pak_capacity_reviews_desc:0 "\"동무, 형벌부대에서도 공란은 받지 않소.\"\n생산능력과 보고를 대조합니다. 물자 배정 재조정·생산계획 전환 지원 사업을 엽니다."
 HOK_KOR_pak_integrated_output_plan:0 "국가 생산계획 조정"
 HOK_KOR_pak_integrated_output_plan_desc:0 "\"각자 성공했는데 전체가 실패했다는 설명은 받지 않겠소.\"\n국가계획을 조정해 효율 성장 혜택을 유지하고 상한을 높입니다. 기존 생산 정책도 유지합니다."
 HOK_KOR_yeo_social_compact_1:0 "노농 협약 I"
 HOK_KOR_yeo_social_compact_1_desc:0 "우리는 노동자와 농민의 나라를 세웠습니다. 노동자가 바라는 낮은 생활비와 농민이 바라는 좋은 수확값까지 저절로 하나가 된 것은 아닙니다. 노농 대표의 상설 협의가 서로의 사정을 듣고 함께 지킬 약속을 정합니다. 같은 깃발 아래 있다는 사실은 대화를 마칠 이유가 아니라 시작할 이유입니다.\n\n공산정부를 잃으면 제거됩니다."
 HOK_KOR_yeo_social_compact_2:0 "노농 협약 II"
 HOK_KOR_yeo_social_compact_2_desc:0 "노농이 손을 맞잡은 사진은 훌륭한 선전이 됩니다. 우리에게는 사진을 찍은 다음 날에도 지켜지는 약속이 필요합니다. 지방협의회와 조정위원회가 협약의 이행을 계속 확인하고 다음 갈등에도 쓸 상설 기준을 세웁니다. 연대를 믿기에, 누구든 상대가 약속을 지켰는지 물을 수 있어야 합니다.\n\n같은 계열의 I단계를 대체하며 공산정부를 잃으면 제거됩니다."
 HOK_KOR_pak_output_plan_1:0 "국가 생산계획 I"
 HOK_KOR_pak_output_plan_1_desc:0 "인민의 생산력에는 큰 미래가 있습니다. 계획기관은 그 미래에 어울리는 목표를 세웠으며 현장은 그 목표에 익숙해지는 일을 맡았습니다. 의지는 명령할 수 있어도 숙련까지 공문으로 내려보낼 수는 없습니다. 가동 실적과 작업 경험을 계획에 반영하여 반복의 낭비를 줄이고 생산 효율을 키워 나갑니다.\n\n공산정부를 잃으면 제거됩니다."
 HOK_KOR_pak_output_plan_2:0 "국가 생산계획 II"
 HOK_KOR_pak_output_plan_2_desc:0 "한 공장이 위대한 진보를 이루었어도 이웃 공장이 원료를 기다린다면 국가의 진보는 그만큼 늦어집니다. 우리의 계획은 개별 성과를 칭찬하는 데 그칠 수 없습니다. 물자수급과 생산능력 점검을 통합하여 쌓인 숙련이 더 높은 생산 수준을 감당하게 합니다. 인민의 산업 전체가 앞으로 나아가야 합니다.\n\n효율 성장 혜택을 유지하며 효율 상한을 높입니다. 같은 계열의 I단계를 대체하며 공산정부를 잃으면 제거됩니다."
 HOK_KOR_communist_governance_programs:0 "공산 후속 내정사업"
 HOK_KOR_communist_governance_programs_desc:0 "\"구호만 현장에 먼저 도착하게 두지는 맙시다.\"\n인민의 이름으로 맺은 협약과 세운 계획이 다시 인민을 기다리게 할 수는 없습니다. 대표는 약속을 확인하고, 계획기관은 막힌 생산을 살피며, 기술자는 현장의 질문에 답해야 합니다. 우리의 제도가 훌륭하다는 설명은 그 일을 마친 뒤에 합시다. 각 사업은 해당 중점을 완료해야 열리며, 이 범주가 보인다고 모두 해금되는 것은 아닙니다.\n\n사업당 정치력 150, 민간공장 점유 없음. 효과는 즉시 시작해 90일간 적용되며 한 번에 하나만 진행합니다. 종료·취소 후 모든 후속 내정사업이 90일간 대기합니다. 경제정책 사업과 후속 내정사업은 각각 하나씩 동시에 진행할 수 있으며, 두 범주의 대기시간은 서로 별개입니다."
 HOK_KOR_communist_governance_no_active_program_tt:0 "다른 공산 후속 내정사업을 진행하고 있지 않음"
 HOK_KOR_communist_governance_cooldown_finished_tt:0 "이전 공산 후속 내정사업의 종료 또는 취소 후 90일이 지남"
 HOK_KOR_communist_governance_program_start_tt:0 "정치력 §Y150§!, 민간공장 점유 없음. 효과는 §Y90일§!간 적용됩니다.\n후속 내정사업 중 하나만 진행. 종료/취소 후 이 분류 전체가 §Y90일§!간 재착수 불가합니다.\n공산정부/경로 상실, 항복/내전 시 취소되며 환급되지 않습니다. 공산 경제정책 사업의 동시 진행/대기 제한과는 별개입니다."
 HOK_KOR_communist_governance_program_end_tt:0 "내정사업 효과 종료. 모든 후속 내정사업은 §Y90일§!간 재착수 불가하며 비용은 환급되지 않습니다. 공산 경제정책 사업에는 영향이 없습니다."
 HOK_KOR_yeo_labor_compact_project:0 "노사협약 이행"
 HOK_KOR_yeo_labor_compact_project_desc:0 "\"서명했으니 끝났소?\" \"이제부터 우리 차례요.\"\n노동자가 주인인 나라라면 노동자의 서명도 작업장 안에서 힘을 가져야 합니다. 대표들이 협약의 이행을 확인하고 분쟁과 작업 일정을 함께 조정하여 군수 생산이 이어질 기반을 다집니다. 약속을 지키지 않은 핑계에 혁명이라는 이름을 붙이지는 맙시다.\n\n정치력 150을 소모하며 효과는 즉시 시작해 90일간 적용됩니다. 민간공장은 점유하지 않습니다. 후속 내정사업은 한 번에 하나만 진행하며, 종료·취소 후 이 범주 전체가 90일간 대기합니다. 공산 경제정책 사업과는 각각 하나씩 병행할 수 있습니다. 공산정부나 해금 조건 상실, 항복·내전 시 취소되며 비용은 환급되지 않습니다."
 HOK_KOR_yeo_community_welfare_project:0 "지역 민생협약"
 HOK_KOR_yeo_community_welfare_project_desc:0 "\"노농의 나라라면서, 노농이 말할 시간은 없소?\"\n모두를 위한 공사라고 발표했으니 주민들도 당연히 좋아할 것이라고 여겼습니다. 그 모두가 누구인지는 마을 사람들에게 들어 볼 필요가 있겠습니다. 지방협의회가 주민의 요구와 작업 순서를 함께 조정하여 합의를 건설 현장으로 이어 갑니다. 노농의 목소리를 들을 시간도 우리의 사업 일정에 넣읍시다.\n\n정치력 150을 소모하며 효과는 즉시 시작해 90일간 적용됩니다. 민간공장은 점유하지 않습니다. 후속 내정사업은 한 번에 하나만 진행하며, 종료·취소 후 이 범주 전체가 90일간 대기합니다. 공산 경제정책 사업과는 각각 하나씩 병행할 수 있습니다. 공산정부나 해금 조건 상실, 항복·내전 시 취소되며 비용은 환급되지 않습니다."
 HOK_KOR_pak_material_reallocation_project:0 "물자 배정 재조정"
 HOK_KOR_pak_material_reallocation_project_desc:0 "\"동무의 창고는 넉넉하군. 인민의 계획도 그런가?\"\n우리의 공장들은 모두 인민의 재산입니다. 그렇다면 한 창고의 넉넉함을 자랑하는 동안 다른 생산선이 원료를 기다릴 이유도 없겠지요. 공장별 요청과 창고 기록을 대조하여 부족한 공정에 배정의 우선순위를 둡니다. 국가계획의 성과는 쌓아 둔 원료가 아니라 부족 때문에 잃지 않은 생산으로 보여 줍시다.\n\n자원 생산이나 비축품 지급은 아닙니다. 정치력 150을 소모하며 효과는 즉시 시작해 90일간 적용됩니다. 민간공장은 점유하지 않습니다. 후속 내정사업은 한 번에 하나만 진행하며, 종료·취소 후 이 범주 전체가 90일간 대기합니다. 공산 경제정책 사업과는 각각 하나씩 병행할 수 있습니다. 공산정부나 해금 조건 상실, 항복·내전 시 취소되며 비용은 환급되지 않습니다."
 HOK_KOR_pak_production_retooling_project:0 "생산계획 전환 지원"
 HOK_KOR_pak_production_retooling_project_desc:0 "\"계획을 올렸으니 손도 빨라져야지.\" \"그러려면 작업 순서부터 익혀야 하오.\"\n우리의 생산계획은 더 높은 실적을 요구합니다. 현장에는 고무적인 구호와 함께 그 실적에 익숙해질 방법도 보내야 합니다. 공구 배치와 작업 순서를 다듬고 반복 작업의 낭비를 고쳐 생산 효율의 성장을 돕겠습니다. 같은 손으로 더 잘 만들라는 요구라면, 그 손이 배울 기회부터 마련해야지요.\n\n정치력 150을 소모하며 효과는 즉시 시작해 90일간 적용됩니다. 민간공장은 점유하지 않습니다. 후속 내정사업은 한 번에 하나만 진행하며, 종료·취소 후 이 범주 전체가 90일간 대기합니다. 공산 경제정책 사업과는 각각 하나씩 병행할 수 있습니다. 공산정부나 해금 조건 상실, 항복·내전 시 취소되며 비용은 환급되지 않습니다."
