l_korean:
 #20260922_kpopmodder: Include technical extension and planning administration in the independently unlocked shared category.
 #20260922_kpopmodder: Describe the communist governance follow-up, preserved policy benefits, and bounded paid programs.
 HOK_KOR_yeo_worker_peasant_congress:0 "노농 협의대회"
 HOK_KOR_yeo_worker_peasant_congress_desc:0 "협동조합의 경험을 바탕으로 노동조합과 농촌 대표가 생계와 생산의 우선순위를 협의합니다. 합의에 필요한 정치적 기반을 다지고 지역의 신뢰를 회복하겠습니다."
 HOK_KOR_yeo_workplace_arbitration:0 "산업분쟁 조정위원회"
 HOK_KOR_yeo_workplace_arbitration_desc:0 "노동자와 경영 현장의 분쟁을 공개된 조정 절차로 다루겠습니다. 안정적인 협약과 상설 협의가 정책을 꾸준히 집행할 기반이 됩니다."
 HOK_KOR_yeo_local_councils:0 "지방협의회 정례화"
 HOK_KOR_yeo_local_councils_desc:0 "지방의 생활 문제와 중앙의 정책을 연결할 정기 협의회를 설치합니다. 통신과 행정 기술을 보급하고, 노사협약 이행 또는 지역민생 협약을 기간제 사업으로 선택할 수 있게 합니다."
 HOK_KOR_yeo_social_compact:0 "노농 협약 정착"
 HOK_KOR_yeo_social_compact_desc:0 "노동자와 농민의 합의를 행정의 정기적인 판단 기준으로 삼겠습니다. 노농 협약을 II단계로 강화하며 기존 협동조합의 공동구매 또는 자율금융 정책은 유지합니다."
 HOK_KOR_pak_national_asset_survey:0 "국유자산 실태조사"
 HOK_KOR_pak_national_asset_survey_desc:0 "배정된 설비와 국유자산의 실제 가동 상태를 조사하겠습니다. 공장별 장비와 공정 자료를 산업 연구에 반영해 다음 생산계획의 근거로 삼습니다."
 HOK_KOR_pak_annual_output_targets:0 "연간 생산계획"
 HOK_KOR_pak_annual_output_targets_desc:0 "공장의 가동 실적과 숙련 축적을 기준으로 연간 목표를 수립합니다. 현장과 계획기관이 생산 경험을 공유해 생산 효율의 성장을 촉진하겠습니다."
 HOK_KOR_pak_material_balance:0 "물자수급 대조표"
 HOK_KOR_pak_material_balance_desc:0 "원료 공급과 공정별 소요를 같은 대조표에서 검토합니다. 실제 생산에 맞춘 산업 기술을 연구하고 부족한 물자의 배분을 판단할 자료를 축적하겠습니다."
 HOK_KOR_pak_capacity_reviews:0 "생산능력 정기점검"
 HOK_KOR_pak_capacity_reviews_desc:0 "설비의 한계와 계획의 오차를 정기적으로 점검합니다. 필요에 따라 물자 배정을 재조정하거나 생산계획 전환을 지원하는 기간제 사업을 선택할 수 있습니다."
 HOK_KOR_pak_integrated_output_plan:0 "국가 생산계획 조정"
 HOK_KOR_pak_integrated_output_plan_desc:0 "현장의 생산 경험과 물자수급 조사를 국가계획에 반영하겠습니다. 생산 효율 성장의 혜택을 유지하며 효율 상한을 높이고, 기존 설비 확충 또는 현행 생산 정책도 계속 운영합니다."
 HOK_KOR_yeo_social_compact_1:0 "노농 협약 I"
 HOK_KOR_yeo_social_compact_1_desc:0 "노동자와 농민의 상설 협의가 사회의 안정과 정책 집행을 뒷받침합니다. 공산정부를 잃으면 제거됩니다."
 HOK_KOR_yeo_social_compact_2:0 "노농 협약 II"
 HOK_KOR_yeo_social_compact_2_desc:0 "상설 조정과 지방협의회에 뿌리내린 노농 협약이 안정과 정책 집행의 기반을 강화합니다. I단계를 대체하며 공산정부를 잃으면 제거됩니다."
 HOK_KOR_pak_output_plan_1:0 "국가 생산계획 I"
 HOK_KOR_pak_output_plan_1_desc:0 "가동 실적과 현장 경험을 반영한 계획으로 생산 효율의 성장을 촉진합니다. 공산정부를 잃으면 제거됩니다."
 HOK_KOR_pak_output_plan_2:0 "국가 생산계획 II"
 HOK_KOR_pak_output_plan_2_desc:0 "물자수급과 생산능력 점검을 통합한 계획으로 효율 성장의 혜택을 유지하고 효율 상한을 높입니다. I단계를 대체하며 공산정부를 잃으면 제거됩니다."
 HOK_KOR_communist_governance_programs:0 "공산 후속 내정사업"
 HOK_KOR_communist_governance_programs_desc:0 "노농 협약, 국가 생산계획, 농촌 기술보급과 계획행정을 구체적인 기간제 사업으로 실행합니다. 각 사업은 정치력 150을 쓰며 민간공장을 점유하지 않습니다. 효과는 진행 중인 90일 동안만 적용됩니다. 후속 내정사업끼리는 한 번에 하나만 실행할 수 있으며, 종료 또는 취소 후 90일 동안 다른 후속 내정사업을 시작할 수 없습니다. 기존 공산 경제정책 사업과는 실행 제한과 대기시간을 별도로 관리하므로 각 범주에서 하나씩 동시에 진행할 수 있습니다. 공산정부 상실, 항복, 내전 또는 해당 정책 경로의 상실로 취소되면 사업 효과가 끝나며 정치력은 환급되지 않습니다."
 HOK_KOR_communist_governance_no_active_program_tt:0 "다른 공산 후속 내정사업을 진행하고 있지 않음"
 HOK_KOR_communist_governance_cooldown_finished_tt:0 "이전 공산 후속 내정사업의 종료 또는 취소 후 90일이 지남"
 HOK_KOR_communist_governance_program_start_tt:0 "정치력 §Y150§!을 사용하여 §Y90일§! 동안 선택한 내정사업의 효과를 적용합니다. 민간공장은 사용하지 않습니다. 동시에 다른 공산 후속 내정사업을 실행할 수 없으며, 종료 또는 취소 후 §Y90일§! 동안 재착수할 수 없습니다. 취소 시 정치력은 환급되지 않습니다. 기존 공산 경제정책 사업의 실행 제한과 대기시간에는 영향을 주지 않습니다."
 HOK_KOR_communist_governance_program_end_tt:0 "내정사업의 효과가 끝납니다. 모든 공산 후속 내정사업은 §Y90일§! 동안 재착수할 수 없습니다. 정치력은 환급되지 않습니다. 기존 공산 경제정책 사업에는 영향을 주지 않습니다."
 HOK_KOR_yeo_labor_compact_project:0 "노사협약 이행"
 HOK_KOR_yeo_labor_compact_project_desc:0 "노동자 대표와 기업의 합의 사항을 현장에서 이행하여 산업분쟁을 줄이고 생산의 연속성을 확보합니다. 안정도 §G+10%§!와 군수공장 생산량 §G+10%§!가 사업 기간에만 적용됩니다.\n\n정치력 §Y150§!을 사용하고 민간공장은 점유하지 않습니다. §Y90일§! 동안 지속되며, 종료 또는 취소 후 모든 후속 내정사업에 §Y90일§!의 공통 대기시간이 적용됩니다. 공산정부 상실, 항복, 내전 또는 해당 경로 상실 시 취소되며 정치력은 환급되지 않습니다."
 HOK_KOR_yeo_community_welfare_project:0 "지역 민생협약"
 HOK_KOR_yeo_community_welfare_project_desc:0 "지방협의회가 주민과 시공 주체의 요구를 조정하여 생활 기반시설의 건설을 지원합니다. 안정도 §G+10%§!와 전체 건설 속도 §G+10%§!가 사업 기간에만 적용됩니다.\n\n정치력 §Y150§!을 사용하고 민간공장은 점유하지 않습니다. §Y90일§! 동안 지속되며, 종료 또는 취소 후 모든 후속 내정사업에 §Y90일§!의 공통 대기시간이 적용됩니다. 공산정부 상실, 항복, 내전 또는 해당 경로 상실 시 취소되며 정치력은 환급되지 않습니다."
 HOK_KOR_pak_material_reallocation_project:0 "물자 배정 재조정"
 HOK_KOR_pak_material_reallocation_project_desc:0 "물자수급표를 바탕으로 원료의 배정을 조정하여 부족한 자원 때문에 발생하는 생산 손실을 줄입니다. 자원 부족에 따른 생산 불이익 §G-20%§!가 사업 기간에만 적용됩니다. 자원을 새로 생산하거나 비축량을 지급하는 사업은 아닙니다.\n\n정치력 §Y150§!을 사용하고 민간공장은 점유하지 않습니다. §Y90일§! 동안 지속되며, 종료 또는 취소 후 모든 후속 내정사업에 §Y90일§!의 공통 대기시간이 적용됩니다. 공산정부 상실, 항복, 내전 또는 해당 경로 상실 시 취소되며 정치력은 환급되지 않습니다."
 HOK_KOR_pak_production_retooling_project:0 "생산계획 전환 지원"
 HOK_KOR_pak_production_retooling_project_desc:0 "생산계획의 변경에 맞춰 현장 작업 순서와 설비 운용을 조정하여 생산 효율이 빠르게 성장하도록 지원합니다. 생산 효율 성장 §G+25%§!가 사업 기간에만 적용됩니다.\n\n정치력 §Y150§!을 사용하고 민간공장은 점유하지 않습니다. §Y90일§! 동안 지속되며, 종료 또는 취소 후 모든 후속 내정사업에 §Y90일§!의 공통 대기시간이 적용됩니다. 공산정부 상실, 항복, 내전 또는 해당 경로 상실 시 취소되며 정치력은 환급되지 않습니다."
