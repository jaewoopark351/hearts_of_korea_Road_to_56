 HOK_KOR_civic_ui_leader_tt:0 "현재 한국 정부의 지도자입니다. 초상은 기존 지도자 이미지를 재사용합니다."
 HOK_KOR_civic_ui_leader_unmapped_tt:0 "현재 지도자에게 대응하는 패널 초상이 등록되지 않았습니다. 이름과 직위는 현재 정부를 표시합니다."
 HOK_KOR_civic_ui_chaebol_tt:0 "재벌은 투자·생산·납품 계약을 통해 국가 운영에 영향력을 행사합니다. 세력의 영향력과 이미 쌓인 조달 비리는 따로 관리됩니다."
 HOK_KOR_civic_ui_civic_tt:0 "시민사회는 노동·교육·공정 인사와 공적 감사를 뒷받침합니다. 개혁의 편익을 확보하려면 소비재 부담과 기득권의 반격을 감당해야 합니다."
 HOK_KOR_civic_ui_corruption_tt:0 "조달 비리는 특혜 계약과 검수 생략으로 누적됩니다. 40 이상이면 부실 조달의 부담이, 70 이상이면 비리 카르텔의 큰 부담이 적용됩니다. 사고 조사·검수·공급망 교체로 줄일 수 있습니다."
 HOK_KOR_civic_ui_capture_tt:0 "기관 장악은 재벌과 결탁한 권력망이 행정·수사를 흔드는 정도입니다. 재벌 영향력이 줄어도 남을 수 있으며, 개혁 정부에 대한 정변 위험과 연결됩니다."
 HOK_KOR_civic_ui_support_chaebol_tt:0 "정치력 50을 사용해 재벌 영향력을 최대 10 높입니다. 영향력 100에서는 지원할 수 없습니다. 특혜 의존으로 조달 비리와 기관 장악이 커집니다. 모든 지원·견제 행동은 90일 대기시간을 공유합니다."
 HOK_KOR_civic_ui_suppress_chaebol_tt:0 "정치력 50을 사용해 재벌 영향력을 최대 10 낮춥니다. 영향력 0에서는 견제할 수 없습니다. 감독 강화는 비리를 줄이지만 기득권의 반발을 부를 수 있습니다. 모든 지원·견제 행동은 90일 대기시간을 공유합니다."
 HOK_KOR_civic_ui_support_civic_tt:0 "정치력 50을 사용해 시민사회 영향력을 10 높입니다. 시민 감시는 조달 비리를 줄이고 개혁의 기반을 넓힙니다. 모든 지원·견제 행동은 90일 대기시간을 공유합니다."
 HOK_KOR_civic_ui_suppress_civic_tt:0 "정치력 50을 사용해 시민사회 영향력을 10 낮춥니다. 감독 약화와 탄압은 비리를 키우고 사회적 부담을 남깁니다. 모든 지원·견제 행동은 90일 대기시간을 공유합니다."
 HOK_KOR_civic_ui_actions_locked:0 "산업·사회 협약 중점 완료 후 지원·견제를 사용할 수 있습니다."
 HOK_KOR_civic_ui_actions_cooldown:0 "다음 지원·견제까지 [?HOK_KOR_civic_action_cooldown:days_left|Y0]일"
