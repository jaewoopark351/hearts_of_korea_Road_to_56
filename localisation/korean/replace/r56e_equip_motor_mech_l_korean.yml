 r56_railway_mortar_equipment_short:0 "레일 박격포"
 r56_railway_mortar_equipment_desc:0 "대형 철도포와 중화포의 중간 형태입니다. 크기가 작기 때문에 대형 포의 엄청난 무게를 감당할 수 없는 철로에서 더 실용적입니다. 또한 크기가 작기 때문에 이동하기도 쉽습니다. 하지만 대포 크기가 작아 요새를 파괴하는 데는 효율성이 현저히 떨어집니다."
 train_equipment_4:0 "42년형 전시 긴축형 열차"
 train_equipment_4_short:0 "42년형 전시 긴축형 열차"
 train_equipment_4_desc:0 "Recent lessons in locomotive design with previous classes have allowed our locomotive works to come up with even cheaper designs that even function better than previous austerity class locomotives. Talk about doing more with less!"
 train_equipment_5:0 "디젤 열차"
 train_equipment_5_short:0 "디젤 열차"
 train_equipment_5_desc:0 "디젤 연소 엔진의 발전으로 디젤 기관차는 증기 기관차보다 훨씬 더 특수하고 생산하기 쉬워졌습니다. 생산에 필요한 부품은 다른 전쟁 물자 생산에 더 잘 사용할 수 있는 일부 자원을 식인하는 역할을 합니다."
