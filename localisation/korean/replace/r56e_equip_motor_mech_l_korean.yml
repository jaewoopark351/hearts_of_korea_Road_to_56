l_korean:
#20261110_kpopmodder: Preserve HOK equipment names and name the RT56 successors in both languages.
 motorized_rocket_equipment:0 "차량화 로켓포"
 motorized_rocket_equipment_short:0 "차량화 로켓포"
 motorized_rocket_equipment_desc:0 "다연장 로켓포는 재래식 포보다 더 빨리 목표 지역에 폭발물을 전달하지만, 정확도가 낮고 재장전 시간이 더 깁니다. 트럭에 장착된 이 버전은 적이 응사하기 전에 공격을 개시하고 위치를 변경할 수 있습니다."
 motorized_rocket_equipment_1:0 "차량화 로켓포"
 motorized_rocket_equipment_1_short:0 "차량화 로켓포"
 motorized_rocket_equipment_1_desc:0 "다연장 로켓포는 재래식 포보다 더 빨리 목표 지역에 폭발물을 전달하지만, 정확도가 낮고 재장전 시간이 더 깁니다. 트럭에 장착된 이 버전은 적이 응사하기 전에 공격을 개시하고 위치를 변경할 수 있습니다."
 motorized_equipment:0 "차량화"
 motorized_equipment_desc:0 "병력을 야전으로나 야전에서 수송하는 데 사용되는 트럭과 다른 차량입니다."
 motorized_equipment_1:0 "차량화"
 motorized_equipment_1_desc:0 "보병 차량화는 육군의 기계화를 향한 첫 단계입니다. 민간 트럭들은 병력 수송, 포 견인, 장비 및 보급품 수송 등 군용으로 쉽게 적응할 수 있습니다. 이는 행군에 의존하던 보병부대의 전략적 기동성을 극적으로 상승시켰습니다."
 mechanized_equipment:0 "기계화"
 mechanized_equipment_short:0 "기계화"
 mechanized_equipment_desc:0 "기계화보병은 수송 및 전투를 위하여 병력수송장갑차 또는 보병전투차로 장비한 보병입니다. 차량이 차량화보병의 비무장 차륜 차량(트럭 또는 지프)과 달리 적의 포화로부터 어느 정도의 보호를 제공한다는 점에서 차량화보병과 구분됩니다."
 mechanized_equipment_1:0 "39년형 병력수송장갑차"
 mechanized_equipment_1_short:0 "39년형 병력수송장갑차"
 mechanized_equipment_1_desc:0 "기계화보병은 수송 및 전투를 위하여 병력수송장갑차 또는 보병전투차로 장비한 보병입니다. 차량이 차량화보병의 비무장 차륜 차량(트럭 또는 지프)과 달리 적의 포화로부터 어느 정도의 보호를 제공한다는 점에서 차량화보병과 구분됩니다."
