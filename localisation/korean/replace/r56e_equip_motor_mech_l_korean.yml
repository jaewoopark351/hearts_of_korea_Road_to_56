 HOL_motorized_equipment_1_desc:0 "The Trado suspension system was a considerable commercial success and applied to many new civilian and military truck types. It consisted of a leaf-springed bogie with two actuated road wheels that could be easily attached to, driven by, and rotated on the back axis of any commercial truck, thus adding a \"walking beam\" to the vehicle that significantly improved its cross-country performance."
 HOL_mechanized_equipment_1_desc:0 "Designed in 1940 and based on a Chevrolet COE (Cab Over Chassis) truck. To deflect or stop small arms fire, the sloped hull was 20 mm thick at the front glacis and 12 mm thick at the sides and rear. The main cab counted one driver armored hinged panel and a side vision slit, while the commander position received a three-faced casemate housing an air-cooled cal.30 (7.62 mm) Browning machine gun or a liquid-cooled .303 (7.7 mm) Vickers and a rear hatch."
 SLV_mechanized_equipment_x_2:0 "53년형 병력수송장갑차"
 r56_convoy_highways_2:0 "최전선 보급"
 r56_convoy_highways_2_desc:0 "최전방 보급은 전투 작전을 수행하는 군대를 지탱하는 생명선입니다. 전선 보급은 필수 자원이 최전방에 지속적으로 공급될 수 있도록 설계된 포괄적인 물류 프로세스 및 시스템 네트워크를 포함합니다."
 r56_convoy_highways_3:0 "전술적 군수"
 r56_convoy_highways_3_desc:0 "전술 군수는 군사 작전의 중추로서 전진 배치된 군대의 성공에 필요한 중요한 지원을 제공합니다. 여기에는 전진하는 군대에 자원을 적시에 원활하게 전달하기 위해 복잡한 공급망, 운송 네트워크, 보관 시설을 신중하게 계획하고 실행하는 것이 포함됩니다."
 r56_convoy_highways_4:0 "전진 작전 기지"
 r56_convoy_highways_4_desc:0 "전진 작전 기지는 특정 작전 지역에서 군사 작전을 지원하고 유지하는 전략적으로 배치된 군사 시설입니다. 일반적으로 전선과 가까운 곳이나 작전상 중요한 지역에 설치됩니다."
