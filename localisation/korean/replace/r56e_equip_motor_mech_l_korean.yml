 r56_gw_railway_gun_equipment_desc:0 "1차 대전의 무거운 요새화에 대한 해결책으로 개발되었습니다. 육지에서 사용할 수 있도록 개조된 거대한 전함 대포입니다. 대포의 엄청난 반동을 처리하기 위해 철도 수송선에 장착되었습니다."
