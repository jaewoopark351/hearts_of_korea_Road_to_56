l_korean:
#20260926_kpopmodder: Use escaped ASCII dialogue quotes and compact decision UI text; preserve gameplay and explicit lifecycle warnings.
#20260926_kpopmodder: Compact new focus descriptions for the fixed-height UI; preserve gameplay and non-focus localisation.
#20260925_kpopmodder: Rewrite focus, decision and event prose with grounded voices; preserve keys, gameplay rules and paired Korean text.
#20260923_kpopmodder: 공직 감찰 정비와 상위 공개 결산 제도의 매일 정치력 +1.0을 설명에 반영합니다.
#20260923_kpopmodder: 요청한 반복 디시전 7종의 민간공장 비용을 제거하고 정치력 150 비용에 맞춰 설명을 동기화합니다.
#20260921_kpopmodder: 승인된 보상 강화에 맞춰 최종 교체값·영구 효과·반복 사업 조건과 협정 설명을 두 언어 채널에 동기화합니다.
#20260921_kpopmodder: 바닐라 제도·원조·협정 구조를 한국 후속 중점에 맞춰 번안하고 신규 효과와 비용을 영문·한국어 채널에 함께 표시합니다.
 HOK_KOR_parliamentary_committee:0 "국정 협의위원회"
 HOK_KOR_parliamentary_committee_desc:0 "국회가 책임을 다투는 동안 청사 밖의 민생은 기다립니다. 각 정파와 행정부가 마주 앉아 합의할 수 있는 일부터 집행하겠습니다."
 HOK_KOR_civil_service_audit:0 "공직 감찰 정비"
 HOK_KOR_civil_service_audit_desc:0 "\"그분 소개로 왔는데도 절차가 필요합니까?\"\n청사마다 답이 달라서는 안 됩니다. 채용·지출·청탁 기록으로 공직의 책임을 묻겠습니다."
 HOK_KOR_technical_civic_schools:0 "실업·시민교육 확대"
 HOK_KOR_technical_civic_schools_desc:0 "기계의 눈금과 시민의 권리를 함께 가르치겠습니다.\n경기·전라·충청의 소유·완전통제·부지가 필요합니다. 각 주에 슬롯·민간공장 2개씩, 전자공학 연구 25% 1회를 얻습니다."
 HOK_KOR_rural_education_missions:0 "농촌 순회교육"
 HOK_KOR_rural_education_missions_desc:0 "교사에게 누군가는 편지를, 누군가는 고장 난 농기구를 내밉니다. 마을의 질문에서 수업을 시작하겠습니다. 연구 속도 +10%는 기한 없이 유지됩니다."
 HOK_KOR_public_accounts_committee:0 "국회 결산위원회"
 HOK_KOR_public_accounts_committee_desc:0 "학교를 짓겠다던 예산이라면 결산 때는 학교를 보여 주십시오. 전문 인력을 갖춘 국회 결산위원회가 세금의 쓰임을 묻게 하겠습니다."
 HOK_KOR_volunteer_liaison_bureau:0 "의용군 연락본부"
 HOK_KOR_volunteer_liaison_bureau_desc:0 "파병을 결정했다면 보낸 사람들의 말도 끝까지 들어야 합니다. 연락장교와 통역을 모아 전장의 요청이 본국까지 닿게 하겠습니다."
 HOK_KOR_overseas_medical_detachments:0 "해외 의료지원반"
 HOK_KOR_overseas_medical_detachments_desc:0 "돕겠다는 답신만으로 장비가 도착하지는 않습니다. 의료진을 교육하고 전쟁 중인 동맹국·의용군 주둔국에 우리 비축 지원장비를 보낼 길을 엽니다."
 HOK_KOR_volunteer_supply_depots:0 "의용군 보급계획"
 HOK_KOR_volunteer_supply_depots_desc:0 "파병 인원이 적어도 식량과 탄약은 제때 도착해야 합니다. 해외 보급을 정비한 경험으로 한국 육군 전체의 보급 소비를 기한 없이 10% 줄입니다."
 HOK_KOR_expeditionary_lessons:0 "전훈 교류"
 HOK_KOR_expeditionary_lessons_desc:0 "성과보다 막힌 대목을 듣겠습니다. 평시에는 해외 사례를 연구하고, 전쟁·의용군 파병 중에는 별도의 현장 전훈 교류회를 열 수 있습니다."
 HOK_KOR_overseas_relief_network:0 "해외 구호망"
 HOK_KOR_overseas_relief_network_desc:0 "지원품이 창고에서 목적지를 기다려서는 안 됩니다. 교민·원조 연락망으로 전쟁 중인 동맹국·의용군 주둔국에 우리 비축 기초 장비를 전하겠습니다."
 HOK_KOR_asian_trade_secretariat:0 "아시아 공동통상사무국"
 HOK_KOR_asian_trade_secretariat_desc:0 "공동 선언 뒤에는 서로 다른 계약서가 남습니다. 통상사무국에서 각국의 요청을 조정하되, 무엇에 동의할지는 각자가 정하게 하겠습니다."
 HOK_KOR_asian_customs_convention:0 "아시아 관세협약"
 HOK_KOR_asian_customs_convention_desc:0 "서명을 거절할 권리도 협력의 일부입니다. 한국산 자원의 수입 부담을 낮추는 협약을 제안합니다. 수락국의 수입 비용이 730일간 30% 감소합니다."
 HOK_KOR_asian_development_fund:0 "아시아 공동개발기금"
 HOK_KOR_asian_development_fund_desc:0 "협약서 다음 장에는 지을 공장이 있어야 합니다. 관세협약 참여 동맹국의 민간공장 건설을 돕겠습니다. 사업당 정치력 150만 쓰며 민간공장은 점유하지 않습니다."
 HOK_KOR_asian_armaments_commission:0 "아시아 공동군수위원회"
 HOK_KOR_asian_armaments_commission_desc:0 "같은 장비라는데 부품이 맞지 않는다면 공동 방위도 멈춥니다. 연합 군수위원회에서 규격과 생산 경험부터 나누겠습니다."
 HOK_KOR_asian_license_agreement:0 "아시아 면허생산협정"
 HOK_KOR_asian_license_agreement_desc:0 "도면을 나누어도 생산권은 존중해야 합니다. 상호 면허생산협정을 제안합니다. 실제 면허는 별도 계약하며, 기능을 사용할 수 없으면 군수 실무 교육으로 대신합니다."

 HOK_KOR_accountable_administration_idea:0 "책임 행정"
 HOK_KOR_accountable_administration_idea_desc:0 "공직 감찰 절차가 행정의 신뢰와 업무 연속성을 뒷받침합니다. 민주정부가 유지되는 동안 적용됩니다."
 HOK_KOR_public_accounts_idea:0 "공개 결산 제도"
 HOK_KOR_public_accounts_idea_desc:0 "국회가 예산의 집행 결과를 검토하고 공개하여 행정의 신뢰를 높입니다. 책임 행정의 일일 정치력 §G+1.0§!를 유지하고 안정도 §G+2%§!를 제공합니다. 민주정부가 유지되는 동안 적용되며, 이전 책임 행정 국민정신과 중첩되지 않습니다."
 HOK_KOR_rural_education_idea:0 "농촌 순회교육 사업"
 HOK_KOR_rural_education_idea_desc:0 "지역의 교사와 학생이 기초 과학·기술교육을 나누는 상설 사업입니다. 연구 속도 §G+10%§!가 기한 없이 적용되며, 노동자 야간교육과는 별도의 효과입니다."
 HOK_KOR_volunteer_supply_idea:0 "해외 보급업무 개선"
 HOK_KOR_volunteer_supply_idea_desc:0 "의용군 지원을 위해 정리한 보급 절차를 한국 육군 전체에 적용합니다. 보급 소비 §G-10%§!가 기한 없이 적용되며, 통합 군수체계의 보급 효과와 함께 적용됩니다."
 HOK_KOR_customs_participant_idea:0 "한·아시아 관세협약"
 HOK_KOR_customs_participant_idea_desc:0 "한국과 합의한 관세협약에 따라 한국에서 수입하는 자원의 비용이 감소합니다. 협약은 730일간 유효하며, 한국과의 세력 관계가 끝나거나 양국이 교전하거나 한국이 민주정부 또는 세력 지도국의 지위를 잃으면 종료됩니다."
 HOK_KOR_license_participant_idea:0 "한·아시아 면허생산협정"
 HOK_KOR_license_participant_idea_desc:0 "한국과의 상호 면허생산협정입니다. 양국 사이의 면허 생산을 지원하며, 실제 장비 면허 계약은 별도로 체결해야 합니다. 협정은 730일 후 또는 세력 이탈·양국 교전·한국의 민주정부 및 지도국 지위 상실 시 종료됩니다."
 HOK_KOR_asian_license_relation:0 "아시아 면허생산협정"
 HOK_KOR_license_participant_tt:0 "한국과의 상호 면허 생산 속도: §G+30%§!\n면허 기술 격차에 따른 생산 불이익 완화: §G+30%§!\n면허 계약 수락 의향: §G+20§!"

 HOK_KOR_overseas_support_category:0 "해외 지원과 전훈 교류"
 HOK_KOR_overseas_support_category_desc:0 "공문보다 먼저 도착해야 할 물자가 있습니다.\n전쟁 중인 동맹국이나 우리 의용군 주둔국에 장비를 지원하고 전훈을 나눕니다. 보낸 장비는 우리 비축분에서 차감됩니다."
 HOK_KOR_send_medical_equipment:0 "[FROM.GetName]에 의료·지원장비 전달"
 HOK_KOR_send_medical_equipment_desc:0 "의료진이 기다리는 것은 약속이 아니라 장비입니다.\n전쟁 중인 동맹국이나 우리 의용군 주둔국에 비축 지원장비 §Y50개§!를 보냅니다. 같은 대상에는 §Y60일§! 뒤 다시 지원할 수 있습니다."
 HOK_KOR_send_relief_equipment:0 "[FROM.GetName]에 기초 장비 원조"
 HOK_KOR_send_relief_equipment_desc:0 "요청서의 품목을 우리 창고의 비축분과 맞춥니다.\n전쟁 중인 동맹국이나 우리 의용군 주둔국에 비축 보병장비 §Y100개§!를 보냅니다. 같은 대상에는 §Y90일§! 뒤 다시 지원할 수 있습니다."
 HOK_KOR_field_experience_conference:0 "현장 전훈 교류회"
 HOK_KOR_field_experience_conference_desc:0 "\"계획대로 되지 않은 대목부터 말씀해 주십시오.\"\n참전 또는 의용군 파병 중 §Y30일§!간 보고서를 검토합니다. 완료 시 육군 경험치 §G25§!, 시행은 한 번뿐입니다.\n참전과 파병이 모두 끝나거나 민주정부 상실/항복 시 취소됩니다. 비용과 시행 기회는 반환되지 않습니다."
 HOK_KOR_asian_cooperation_category:0 "아시아 연합 공동협력"
 HOK_KOR_asian_cooperation_category_desc:0 "협력은 서명 뒤의 이행으로 이어져야 합니다.\n협정은 상대국의 수락 후 발효됩니다. 새 회원국이나 이전에 거절한 국가에도 조건을 갖추면 다시 제안할 수 있습니다."
 HOK_KOR_offer_customs_convention:0 "[FROM.GetName]에 관세협약 제안"
 HOK_KOR_offer_customs_convention_desc:0 "조건을 제시하되 참여 여부는 상대국이 결정합니다.\n수락 시 §Y730일§!간 한국산 자원 수입 비용 §G-30%§!. 같은 대상에 대한 재제안은 §Y180일§! 뒤 가능하며 유효한 협약과 중복되지 않습니다."
 HOK_KOR_offer_license_agreement:0 "[FROM.GetName]에 면허생산협정 제안"
 HOK_KOR_offer_license_agreement_desc:0 "공동 생산의 약속도 장비별 계약을 대신할 수는 없습니다.\n수락 시 §Y730일§!간 상호 면허생산을 지원합니다. 장비 면허는 별도 계약이며 설계도를 지급하지 않습니다. 같은 대상에 대한 재제안은 §Y180일§! 뒤 가능합니다."
 HOK_KOR_finance_allied_industry:0 "[FROM.GetName]의 민간공장 건설 지원"
 HOK_KOR_finance_allied_industry_desc:0 "동맹의 계획서가 실제 공장으로 이어지게 하겠습니다.\n관세협약 참가국에 §Y180일§! 후 민간공장 §G1개§!와 슬롯 §G1개§!를 건설합니다. 상대국이 소유/완전통제하는 핵심 주에 부지가 필요합니다.\n협정/동맹/정부/지도국/독립 지위나 부지 조건 상실, 항복 시 취소됩니다. 완료/취소 후 횟수 제한 없이 다시 투자할 수 있습니다."
 HOK_KOR_industrial_project_commitment_tt:0 "정치력 §Y150§!, 민간공장 점유 없음. 공사 §Y180일§!.\n같은 대상에는 완료/취소 후 다시 투자할 수 있습니다. 재투자 시 비용도 다시 냅니다.\n취소되거나 완료 시 부지가 없으면 공장을 받지 못하며 비용도 환급되지 않습니다."
 HOK_KOR_customs_offers_tt:0 "현재 동맹국에 §Y730일§!의 관세협약을 제안합니다. 수락한 국가만 한국으로부터의 자원 수입 비용 §G-30%§!를 받습니다. 세력 이탈·양국 교전·한국의 민주정부 또는 지도국 지위 상실 시 협약이 종료됩니다."
 HOK_KOR_license_offers_tt:0 "현재 동맹국에 §Y730일§!의 상호 면허생산협정을 제안합니다. 수락한 국가와 한국 사이에만 면허생산 보정이 적용됩니다. 협정 종료 시 양방향 보정이 제거됩니다."

 HOK_KOR_democratic_expansion.1.t:0 "한국의 관세협약 제안"
 HOK_KOR_democratic_expansion.1.desc:0 "한국의 공동통상사무국이 관세협약 제안서를 보내왔습니다. 실무진은 자원 거래에 관한 조건을 검토하며 서명란 앞에 문서를 펼쳐 놓았습니다.\n\n\"연합의 다른 나라들도 같은 제안을 받았답니다.\"\n\"그렇다면 우리 사정에 맞는지는 우리가 답해야겠군.\"\n\n게임 규칙:\n협약은 730일간 우리나라가 한국에서 수입하는 자원의 비용을 줄여 줍니다. 같은 세력을 유지하고 서로 교전하지 않아야 하며, 한국이 민주정부와 세력 지도국의 지위를 잃으면 협약도 종료됩니다."
 HOK_KOR_democratic_expansion.1.a:0 "이 조건으로 참여하겠다고 회신하자."
 HOK_KOR_democratic_expansion.1.b:0 "이번에는 서명하지 않겠다고 전하자."
 HOK_KOR_democratic_expansion.2.t:0 "[FROM.GetName]의 관세협약 참여"
 HOK_KOR_democratic_expansion.2.desc:0 "[FROM.GetName] 정부의 회신에는 협약 참여에 동의한다는 답이 담겨 있었습니다. 통상 담당자는 서명된 문서를 확인하고 거래 절차를 정비할 서류를 꺼냈습니다.\n\n\"축하 전문부터 보낼까요?\"\n\"보내게. 실무 담당자의 연락처도 함께.\"\n\n양국의 합의는 이제 실제 거래에서 이행할 약속이 되었습니다."
 HOK_KOR_democratic_expansion.2.a:0 "이제 약속한 절차를 갖추자."
 HOK_KOR_democratic_expansion.3.t:0 "[FROM.GetName]의 관세협약 거절"
 HOK_KOR_democratic_expansion.3.desc:0 "[FROM.GetName]에서 온 회신은 정중했지만, 이번 관세협약에는 참여하지 않겠다는 뜻이 분명했습니다. 사무국장은 제안서의 '자발적 참여'라는 문구를 다시 읽었습니다.\n\n\"다음 제안에도 그 문구를 남깁니까?\"\n\"남겨야지. 검토해 주어 감사하다고 답신을 쓰게.\"\n\n게임 규칙:\n어떠한 협약 효과도 적용되지 않았으며, 정해진 협상 간격이 지난 뒤 다시 제안할 수 있습니다."
 HOK_KOR_democratic_expansion.3.a:0 "그들의 결정을 존중한다."
 HOK_KOR_democratic_expansion.4.t:0 "한국의 면허생산협정 제안"
 HOK_KOR_democratic_expansion.4.desc:0 "한국에서 면허생산협정 제안서가 도착했습니다. 계약 담당자가 조건을 설명하자 생산 책임자는 장비 목록을 옆으로 당겼습니다.\n\n\"이 협정만 체결하면 바로 생산할 수 있습니까?\"\n\"아닙니다. 각 장비의 면허 계약은 따로 맺어야 합니다.\"\n\n공통 절차를 받아들일지, 지금의 조달 방침을 유지할지 결정할 차례입니다.\n\n게임 규칙:\n협정은 730일간 양방향 생산 보정을 제공하지만, 실제 면허는 별도의 계약으로 확보해야 합니다. 세력 이탈이나 양국의 교전, 한국의 민주정부 또는 지도국 지위 상실 시 협정이 종료됩니다."
 HOK_KOR_democratic_expansion.4.a:0 "협정을 맺고 개별 계약을 준비하자."
 HOK_KOR_democratic_expansion.4.b:0 "지금의 조달 방침을 유지하자."
 HOK_KOR_democratic_expansion.5.t:0 "[FROM.GetName]의 면허생산협정 수락"
 HOK_KOR_democratic_expansion.5.desc:0 "[FROM.GetName] 정부가 상호 면허생산협정을 수락했습니다. 협정 문서를 확인한 실무진은 곧바로 별도 협상이 필요한 장비 목록을 펼쳤습니다.\n\n\"서명은 끝났군요.\"\n\"장비 계약은 이제부터입니다.\"\n\n양국은 공통 절차를 이용하되 각 장비의 생산권과 조건은 따로 협상하게 됩니다."
 HOK_KOR_democratic_expansion.5.a:0 "실무진이 계약을 이어가도록 하자."
 HOK_KOR_democratic_expansion.6.t:0 "[FROM.GetName]의 면허생산협정 거절"
 HOK_KOR_democratic_expansion.6.desc:0 "[FROM.GetName] 정부는 이번 면허생산협정을 체결하지 않기로 했습니다. 담당자는 회신을 제안서와 함께 묶었습니다.\n\n\"거절 사유를 추측해서 보고할까요?\"\n\"확인된 답만 적게. 다음 협상도 그 기록에서 시작할 테니.\"\n\n게임 규칙:\n양국의 면허생산 조건은 바뀌지 않았으며, 정해진 협상 간격 이후 새 제안을 검토할 수 있습니다."
 HOK_KOR_democratic_expansion.6.a:0 "회신을 남기고 다음 기회를 기다리자."
