l_korean:
#20260923_kpopmodder: 공직 감찰 정비와 상위 공개 결산 제도의 매일 정치력 +1.0을 설명에 반영합니다.
#20260923_kpopmodder: 요청한 반복 디시전 7종의 민간공장 비용을 제거하고 정치력 150 비용에 맞춰 설명을 동기화합니다.
#20260921_kpopmodder: 승인된 보상 강화에 맞춰 최종 교체값·영구 효과·반복 사업 조건과 협정 설명을 두 언어 채널에 동기화합니다.
#20260921_kpopmodder: 바닐라 제도·원조·협정 구조를 한국 후속 중점에 맞춰 번안하고 신규 효과와 비용을 영문·한국어 채널에 함께 표시합니다.
 HOK_KOR_parliamentary_committee:0 "국정 협의위원회"
 HOK_KOR_parliamentary_committee_desc:0 "정부에 대한 신뢰는 선언만으로 회복되지 않습니다. 국회의 각 정파와 행정부가 함께 민생 현안을 검토할 협의위원회를 구성하여, 국정 정상화가 진행되는 동안에도 필요한 개혁을 이어갈 것입니다."
 HOK_KOR_civil_service_audit:0 "공직 감찰 정비"
 HOK_KOR_civil_service_audit_desc:0 "공화국의 행정은 특정 정당이나 유력자의 사유물이 되어서는 안 됩니다. 채용과 지출을 정기적으로 점검하고 부당한 청탁을 기록하여, 공직자가 국민에게 책임지는 절차를 마련할 것입니다."
 HOK_KOR_technical_civic_schools:0 "실업·시민교육 확대"
 HOK_KOR_technical_civic_schools_desc:0 "현대의 공화국에는 권리와 의무를 이해하는 시민, 새로운 기계를 다룰 수 있는 기술자가 모두 필요합니다. 지역 학교의 실업교육과 시민교육을 함께 확충하여 산업과 민주정의 기반을 넓힐 것입니다.\n\n경기·전라·충청을 소유하고 완전통제하며 건설 부지를 확보해야 합니다. 완료하면 각 주에 건설 슬롯 §G2개§!와 민간공장 §G2개§!, 총 민간공장 §G6개§!를 추가합니다. 기존 전자공학 연구 보너스 §G25%§! §Y1회§!도 함께 얻습니다."
 HOK_KOR_rural_education_missions:0 "농촌 순회교육"
 HOK_KOR_rural_education_missions_desc:0 "배움의 기회가 큰 도시에만 머물러서는 안 됩니다. 교사와 기술학교 학생으로 구성한 순회교육반을 농촌에 보내 읽기와 계산, 기초 과학과 농기구 정비를 가르칠 것입니다.\n\n연구 속도 §G+10%§!의 농촌 순회교육 사업을 기한 없이 정착시킵니다."
 HOK_KOR_public_accounts_committee:0 "국회 결산위원회"
 HOK_KOR_public_accounts_committee_desc:0 "예산을 승인하는 권한에는 그 사용 결과를 확인할 의무가 따릅니다. 전문 인력의 도움을 받는 국회 결산위원회를 마련하여, 국민의 세금이 약속한 목적에 쓰였는지 공개적으로 설명하게 할 것입니다."
 HOK_KOR_volunteer_liaison_bureau:0 "의용군 연락본부"
 HOK_KOR_volunteer_liaison_bureau_desc:0 "대한의용군단이 먼 전장에서 임무를 수행하려면 본국과 현지 지휘부 사이의 연락이 끊겨서는 안 됩니다. 연락 장교와 통역 인력을 한곳에서 관리하여 작전 보고와 지원 요청이 신속하게 전달되도록 할 것입니다."
 HOK_KOR_overseas_medical_detachments:0 "해외 의료지원반"
 HOK_KOR_overseas_medical_detachments_desc:0 "전쟁으로 상처 입은 이들을 돕는 일에도 준비된 인력과 장비가 필요합니다. 군 의료진과 지원병과의 교육을 보강하고, 전쟁 중인 동맹국 또는 우리 의용군이 주둔한 국가에 우리 비축 지원장비를 보낼 절차를 마련할 것입니다."
 HOK_KOR_volunteer_supply_depots:0 "의용군 보급계획"
 HOK_KOR_volunteer_supply_depots_desc:0 "소규모 파병이라도 탄약과 식량이 제때 도착하지 않으면 오래 버틸 수 없습니다. 해외 보급계획을 정리하면서 얻은 개선안을 국군의 보급 업무에도 적용할 것입니다.\n\n한국 육군 전체의 보급 소비를 §G10%§! 줄이는 국민정신을 기한 없이 얻습니다."
 HOK_KOR_expeditionary_lessons:0 "전훈 교류"
 HOK_KOR_expeditionary_lessons_desc:0 "연락본부와 의료·보급 부서가 모은 보고서를 장교단이 함께 검토하도록 합시다. 평시에는 해외 사례를 연구하고, 실제 전쟁이나 의용군 파병에 참여하고 있을 때에는 현장 경험을 교환하는 별도 회의를 열 수 있습니다."
 HOK_KOR_overseas_relief_network:0 "해외 구호망"
 HOK_KOR_overseas_relief_network_desc:0 "위험에 처한 우방을 돕는 노력은 일회성 파병에 그쳐서는 안 됩니다. 교민단체와 원조 담당자들의 연락망을 정비하여, 전쟁 중인 동맹국과 우리 의용군 주둔국이 요청한 기초 장비를 우리 비축분에서 지원할 것입니다."
 HOK_KOR_asian_trade_secretariat:0 "아시아 공동통상사무국"
 HOK_KOR_asian_trade_secretariat_desc:0 "아시아 연합을 공동의 번영으로 이어 가려면 회원국 사이의 실무 협력이 필요합니다. 기존 연합 안에 통상사무국을 두어 각국의 요청을 조정하고, 자발적인 경제 협정의 협상 창구를 마련할 것입니다."
 HOK_KOR_asian_customs_convention:0 "아시아 관세협약"
 HOK_KOR_asian_customs_convention_desc:0 "연합국들이 서로 필요한 자원을 보다 쉽게 거래할 수 있도록 관세협약을 제안합시다. 각국의 동의를 얻어 한국으로부터 자원을 수입하는 비용을 낮추며, 협약 참여 여부는 각 정부가 결정하도록 할 것입니다.\n\n수락한 국가가 한국에서 수입하는 자원의 비용이 §G30%§! 감소합니다. 협약은 §Y730일§!간 유지됩니다."
 HOK_KOR_asian_development_fund:0 "아시아 공동개발기금"
 HOK_KOR_asian_development_fund_desc:0 "무역 확대가 산업 기반의 차이를 저절로 해소해 주지는 않습니다. 관세협약에 참여한 동맹국의 민간공장 건설에 자금을 투입할 수 있도록 공동개발기금을 마련할 것입니다. 사업마다 정치력 150만 사용하며 민간공장을 점유하지 않습니다."
 HOK_KOR_asian_armaments_commission:0 "아시아 공동군수위원회"
 HOK_KOR_asian_armaments_commission_desc:0 "서로 다른 장비와 조달 절차는 공동 방위의 부담을 키웁니다. 연합의 군수 담당자들이 규격과 생산 경험을 교환할 위원회를 구성하여, 각국이 필요한 장비를 더 안정적으로 확보하도록 할 것입니다."
 HOK_KOR_asian_license_agreement:0 "아시아 면허생산협정"
 HOK_KOR_asian_license_agreement_desc:0 "동맹국과 기술자료를 나누되 각국의 생산권과 계약을 존중해야 합니다. 한국과 참가국 사이의 면허생산을 돕는 상호 협정을 제안할 것입니다. 면허생산 기능을 사용할 수 없는 경우에는 군수 실무 교육으로 협력을 발전시킵니다."

 HOK_KOR_accountable_administration_idea:0 "책임 행정"
 HOK_KOR_accountable_administration_idea_desc:0 "공직 감찰 절차가 행정의 신뢰와 업무 연속성을 뒷받침합니다. 민주정부가 유지되는 동안 적용됩니다."
 HOK_KOR_public_accounts_idea:0 "공개 결산 제도"
 HOK_KOR_public_accounts_idea_desc:0 "국회가 예산의 집행 결과를 검토하고 공개하여 행정의 신뢰를 높입니다. 책임 행정의 일일 정치력 §G+1.0§!를 유지하고 안정도 §G+2%§!를 제공합니다. 민주정부가 유지되는 동안 적용되며, 이전 책임 행정 국민정신과 중첩되지 않습니다."
 HOK_KOR_rural_education_idea:0 "농촌 순회교육 사업"
 HOK_KOR_rural_education_idea_desc:0 "지역의 교사와 학생이 기초 과학·기술교육을 나누는 상설 사업입니다. 연구 속도 §G+10%§!가 기한 없이 적용되며, 노동자 야간교육과는 별도의 효과입니다."
 HOK_KOR_volunteer_supply_idea:0 "해외 보급업무 개선"
 HOK_KOR_volunteer_supply_idea_desc:0 "의용군 지원을 위해 정리한 보급 절차를 한국 육군 전체에 적용합니다. 보급 소비 §G-10%§!가 기한 없이 적용되며, 통합 군수체계의 보급 효과와 함께 적용됩니다."
 HOK_KOR_customs_participant_idea:0 "한·아시아 관세협약"
 HOK_KOR_customs_participant_idea_desc:0 "한국과 합의한 관세협약에 따라 한국에서 수입하는 자원의 비용이 감소합니다. 협약은 730일간 유효하며, 한국과의 세력 관계가 끝나거나 양국이 교전하거나 한국이 민주정부 또는 세력 지도국의 지위를 잃으면 종료됩니다."
 HOK_KOR_license_participant_idea:0 "한·아시아 면허생산협정"
 HOK_KOR_license_participant_idea_desc:0 "한국과의 상호 면허생산협정입니다. 양국 사이의 면허 생산을 지원하며, 실제 장비 면허 계약은 별도로 체결해야 합니다. 협정은 730일 후 또는 세력 이탈·양국 교전·한국의 민주정부 및 지도국 지위 상실 시 종료됩니다."
 HOK_KOR_asian_license_relation:0 "아시아 면허생산협정"
 HOK_KOR_license_participant_tt:0 "한국과의 상호 면허 생산 속도: §G+30%§!\n면허 기술 격차에 따른 생산 불이익 완화: §G+30%§!\n면허 계약 수락 의향: §G+20§!"

 HOK_KOR_overseas_support_category:0 "해외 지원과 전훈 교류"
 HOK_KOR_overseas_support_category_desc:0 "대한의용군단을 뒷받침하고 전쟁 중인 동맹국 또는 우리 의용군이 주둔한 국가에 비축 장비를 지원할 수 있습니다. 원조 장비는 우리 비축분에서 차감됩니다."
 HOK_KOR_send_medical_equipment:0 "[FROM.GetName]에 의료·지원장비 전달"
 HOK_KOR_send_medical_equipment_desc:0 "전쟁 중인 동맹국 또는 우리 의용군이 주둔한 국가에 비축 지원장비 §Y50개§!를 보냅니다. 같은 대상에 대한 지원은 §Y60일§!마다 가능합니다."
 HOK_KOR_send_relief_equipment:0 "[FROM.GetName]에 기초 장비 원조"
 HOK_KOR_send_relief_equipment_desc:0 "전쟁 중인 동맹국 또는 우리 의용군이 주둔한 국가에 비축 보병장비 §Y100개§!를 보냅니다. 같은 대상에 대한 지원은 §Y90일§!마다 가능합니다."
 HOK_KOR_field_experience_conference:0 "현장 전훈 교류회"
 HOK_KOR_field_experience_conference_desc:0 "우리가 전쟁 중이거나 의용군을 보내고 있는 동안 §Y30일§!에 걸쳐 현장 보고서를 분석합니다. 완료 시 육군 경험치 §G25§!를 얻습니다. 한 번만 시행할 수 있으며, 참여가 끝나거나 정부가 바뀌거나 항복하면 취소됩니다. 이미 지출한 정치력과 시행 기회는 반환되지 않습니다."
 HOK_KOR_asian_cooperation_category:0 "아시아 연합 공동협력"
 HOK_KOR_asian_cooperation_category_desc:0 "기존 아시아 연합의 통상·산업·군수 협력을 발전시킵니다. 협정은 상대국이 수락해야 효력이 생기며, 신규 회원국이나 이전 제안을 거절한 국가에는 별도로 협상을 제안할 수 있습니다."
 HOK_KOR_offer_customs_convention:0 "[FROM.GetName]에 관세협약 제안"
 HOK_KOR_offer_customs_convention_desc:0 "730일간의 관세협약을 제안합니다. 수락한 국가는 한국에서 자원을 수입하는 비용이 §G30%§! 감소합니다. 같은 국가에는 제안 후 §Y180일§!이 지나야 다시 제안할 수 있으며, 유효한 협약이 있으면 중복 제안할 수 없습니다."
 HOK_KOR_offer_license_agreement:0 "[FROM.GetName]에 면허생산협정 제안"
 HOK_KOR_offer_license_agreement_desc:0 "730일간 한국과 상대국 사이의 상호 면허생산협정을 제안합니다. 수락하면 생산 속도와 기술 격차에 따른 생산 불이익이 개선됩니다. 별도의 장비 면허 계약이 필요하며, 협정 자체가 장비 설계도를 제공하지는 않습니다. 재제안 간격은 §Y180일§!입니다."
 HOK_KOR_finance_allied_industry:0 "[FROM.GetName]의 민간공장 건설 지원"
 HOK_KOR_finance_allied_industry_desc:0 "관세협약에 참여한 동맹국에 민간공장 §G1개§!와 건설 슬롯 §G1개§!를 추가합니다. 정치력 §Y150§!만 사용하며 민간공장을 점유하지 않습니다. 사업 기간은 §Y180일§!입니다. 전체 또는 같은 국가에 대한 완료 횟수 상한은 없으며, 같은 대상의 사업은 완료 또는 취소 뒤 다시 착수할 수 있습니다. 중도에 협정·동맹 관계가 끝나거나 항복하는 등 조건을 잃으면 취소됩니다. 이미 지출한 정치력은 반환되지 않으며 재시도에는 비용을 다시 내야 합니다. 완료 시점에 상대국이 소유·완전통제하는 핵심 주에 건설 가능한 부지가 있어야 공장이 건설됩니다."
 HOK_KOR_industrial_project_commitment_tt:0 "정치력 §Y150§!만 사용하여 §Y180일§! 동안 상대국의 산업 건설을 지원합니다. 민간공장은 점유하지 않습니다. 같은 대상에는 진행 중인 사업이 끝난 뒤 다시 투자할 수 있습니다. 취소되거나 완료 시 건설 부지를 확보하지 못해도 이미 지출한 정치력은 반환되지 않습니다."
 HOK_KOR_customs_offers_tt:0 "현재 동맹국에 §Y730일§!의 관세협약을 제안합니다. 수락한 국가만 한국으로부터의 자원 수입 비용 §G-30%§!를 받습니다. 세력 이탈·양국 교전·한국의 민주정부 또는 지도국 지위 상실 시 협약이 종료됩니다."
 HOK_KOR_license_offers_tt:0 "현재 동맹국에 §Y730일§!의 상호 면허생산협정을 제안합니다. 수락한 국가와 한국 사이에만 면허생산 보정이 적용됩니다. 협정 종료 시 양방향 보정이 제거됩니다."

 HOK_KOR_democratic_expansion.1.t:0 "한국의 관세협약 제안"
 HOK_KOR_democratic_expansion.1.desc:0 "한국의 공동통상사무국이 양국의 자원 거래를 돕는 관세협약을 제안했습니다. 협약은 730일간 우리나라가 한국에서 수입하는 자원의 비용을 줄여 줍니다. 같은 세력을 유지하고 서로 교전하지 않아야 하며, 한국이 민주정부와 세력 지도국의 지위를 잃으면 협약도 종료됩니다."
 HOK_KOR_democratic_expansion.1.a:0 "상호 협력의 첫걸음으로 삼자."
 HOK_KOR_democratic_expansion.1.b:0 "이번 협약에는 참여하지 않겠다."
 HOK_KOR_democratic_expansion.2.t:0 "[FROM.GetName]의 관세협약 참여"
 HOK_KOR_democratic_expansion.2.desc:0 "[FROM.GetName] 정부가 우리의 제안을 수락했습니다. 양국의 통상 담당자들이 관세협약에 따른 거래 절차를 정비하기 시작했습니다."
 HOK_KOR_democratic_expansion.2.a:0 "합의를 충실히 이행하자."
 HOK_KOR_democratic_expansion.3.t:0 "[FROM.GetName]의 관세협약 거절"
 HOK_KOR_democratic_expansion.3.desc:0 "[FROM.GetName] 정부는 현재 우리의 관세협약에 참여하지 않겠다고 통보했습니다. 어떠한 협약 효과도 적용되지 않았으며, 정해진 협상 간격이 지난 뒤 다시 제안할 수 있습니다."
 HOK_KOR_democratic_expansion.3.a:0 "그들의 결정을 존중한다."
 HOK_KOR_democratic_expansion.4.t:0 "한국의 면허생산협정 제안"
 HOK_KOR_democratic_expansion.4.desc:0 "한국이 양국의 군수기업 사이에서 면허생산을 장려하는 협정을 제안했습니다. 협정은 730일간 양방향 생산 보정을 제공하지만, 실제 면허는 별도의 계약으로 확보해야 합니다. 세력 이탈이나 양국의 교전, 한국의 민주정부 또는 지도국 지위 상실 시 협정이 종료됩니다."
 HOK_KOR_democratic_expansion.4.a:0 "상호 면허생산협정을 체결하자."
 HOK_KOR_democratic_expansion.4.b:0 "현재의 조달 방침을 유지하겠다."
 HOK_KOR_democratic_expansion.5.t:0 "[FROM.GetName]의 면허생산협정 수락"
 HOK_KOR_democratic_expansion.5.desc:0 "[FROM.GetName] 정부가 상호 면허생산협정을 수락했습니다. 양국은 각 장비의 면허 계약을 별도로 협상하면서, 생산 협력을 위한 공통 절차를 이용할 수 있게 되었습니다."
 HOK_KOR_democratic_expansion.5.a:0 "공동 방위의 기반이 넓어졌다."
 HOK_KOR_democratic_expansion.6.t:0 "[FROM.GetName]의 면허생산협정 거절"
 HOK_KOR_democratic_expansion.6.desc:0 "[FROM.GetName] 정부는 이번 면허생산협정을 체결하지 않기로 했습니다. 양국의 면허생산 조건은 바뀌지 않았으며, 정해진 협상 간격 이후 새 제안을 검토할 수 있습니다."
 HOK_KOR_democratic_expansion.6.a:0 "다음 기회를 기다리자."
