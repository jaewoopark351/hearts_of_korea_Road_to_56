#20260926_kpopmodder: Use escaped ASCII dialogue quotes and compact decision UI text; preserve gameplay and explicit lifecycle warnings.
#20260926_kpopmodder: Compact new focus descriptions for the fixed-height UI; preserve gameplay and non-focus localisation.
#20260926_kpopmodder: Restore fictional NRSC command and conscription black comedy while preserving all gameplay rules.
#20260925_kpopmodder: Rewrite focus, decision and event prose with grounded voices; preserve keys, gameplay rules and paired Korean text.
#20260922_kpopmodder: Describe parallel manpower and essential-workforce policies with their separate benefits and upgrades.
 HOK_KOR_nrsc_manpower_register:0 "병역행정 명부"
 HOK_KOR_nrsc_manpower_register_desc:0 "제복을 입은 방문자는 이름과 주소를 알고 있습니다.\n\"아무것도 신청하지 않았는데요.\"\n\"그래서 직접 왔습니다.\" 병역 명부를 대조하겠습니다."
 HOK_KOR_nrsc_reserve_rotations:0 "예비인력 소집계획"
 HOK_KOR_nrsc_reserve_rotations_desc:0 "봉투에는 이름과 집합 시각이 적혀 있습니다.\n\"날짜를 고를 수 있습니까?\" \"이미 골라 드렸습니다.\"\n징병법은 유지하며 필수인력 정책과 병렬 추진합니다."
 HOK_KOR_nrsc_skilled_worker_exemptions:0 "필수인력 배치기준"
 HOK_KOR_nrsc_skilled_worker_exemptions_desc:0 "\"입영 대상이 아닙니다.\" \"다행이네요.\"\n\"군수공장 야간조 배치 대상입니다.\"\n필수인력 배치기준으로 숙련공을 생산 현장에 남기겠습니다."
 HOK_KOR_nrsc_manpower_coordination:0 "병역행정 일원화"
 HOK_KOR_nrsc_manpower_coordination_desc:0 "\"통지서가 두 장입니다.\"\n\"하나는 착오군요. 나머지는 아닙니다.\"\n소집·배치 기록을 통합합니다. 동원 혜택을 강화하고 필수인력 혜택은 유지합니다."
 HOK_KOR_nrsc_manpower_administration_1:0 "병역행정 체계 I"
 HOK_KOR_nrsc_manpower_administration_1_desc:0 "예비 인력의 소집과 보충 절차를 정비한 병역행정 체계입니다. 기존 징병법 및 다른 인력 정책과 함께 적용되며, 파시즘 정부를 잃으면 제거됩니다."
 HOK_KOR_nrsc_manpower_administration_2:0 "병역행정 체계 II"
 HOK_KOR_nrsc_manpower_administration_2_desc:0 "소집 기록과 필수 업무 배치를 연계한 병역행정 체계입니다. 하위 체계의 징병 가능 인구 계수와 동원 속도를 강화하여 승계하며, 파시즘 정부를 잃으면 제거됩니다."
 HOK_KOR_nrsc_essential_workforce:0 "필수인력 배치정책"
 HOK_KOR_nrsc_essential_workforce_desc:0 "생산에 필요한 숙련 인력의 배치를 유지하여 생산효율 증가를 지원하는 정책입니다. 병역행정 체계가 강화되어도 별도로 유지되며, 파시즘 정부를 잃으면 제거됩니다."
