 HOK_KOR_mc_municipal_routine_concentrated:0 "국내성 주거·시설 보수 사업"
 HOK_KOR_mc_municipal_routine_concentrated_desc:0 "정치력 150을 투입한 90일 집중 사업의 지역 효과입니다. 완료·취소·영토 조건 상실 시 제거됩니다."
 HOK_KOR_manchurian_followup_programs:0 "만주 후속 운영 사업"
 HOK_KOR_manchurian_followup_programs_desc:0 "완료한 지역 정책의 집중 사업을 진행합니다. 정치력 150, 민간공장 점유 없음, 90일 지속입니다. 네 사업은 동시에 하나만 진행하며 종료·취소 후 공통 90일을 기다립니다. 대상 지역의 소유·완전 통제가 필요하고 주민 정착 사업은 민주정부도 요구합니다. 조건을 잃으면 해당 사업이 취소되고 지역 제도는 일일 갱신에서 제거됩니다. 재확보 후 사업을 다시 시작하면 이미 획득한 상위 제도를 복구합니다. 연구·정치력 등 이미 받은 일회 보상은 회수하지 않습니다."
 HOK_KOR_mc_local_services_project:0 "만주 행정·수송 집중 사업"
 HOK_KOR_mc_local_services_project_desc:0 "정치력 150으로 90일 동안 대상 지역의 집중 사업을 지원합니다. 민간공장을 점유하지 않으며 기존 상위 지역 제도가 제거된 경우 함께 복구합니다. 영토·정부 등 착수 조건 상실 시 취소되며, 종료·취소 후 공통 90일 대기시간이 적용됩니다. 취소 시 비용을 환급하거나 공장·자원을 영구 지급하지 않습니다. 대상 지역: $STATE_328$, $STATE_941$. 모든 대상 지역을 소유하고 완전히 통제해야 합니다."
