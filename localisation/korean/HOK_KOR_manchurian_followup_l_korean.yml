 HOK_KOR_mc_county_dossiers:0 "만주 지방행정 조사"
 HOK_KOR_mc_county_dossiers_desc:0 "기존 만주 개발의 성과를 바탕으로 실제 소유하고 완전히 통제하는 지역의 후속 운영을 준비합니다. 관련 지역을 잃으면 진행 중인 중점은 취소됩니다. 대상 지역: $STATE_328$, $STATE_941$. 모든 대상 지역을 소유하고 완전히 통제해야 합니다."
 HOK_KOR_mc_payroll_registers:0 "지방 공공서비스"
 HOK_KOR_mc_payroll_registers_desc:0 "만주 공공서비스 I을 해당 지역에 적용합니다. 지역을 소유·완전 통제하는 동안만 유지되며 다른 지역이나 새 소유국에는 효과를 넘기지 않습니다. 대상 지역: $STATE_328$, $STATE_941$. 모든 대상 지역을 소유하고 완전히 통제해야 합니다."
