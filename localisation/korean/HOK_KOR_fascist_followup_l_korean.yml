l_korean:
#20260923_kpopmodder: Describe independent occupation, interservice and post-coup reconstruction policies and their actual gates.
 HOK_KOR_nrsc_military_administration:0 "군정 실무편람"
 HOK_KOR_nrsc_military_administration_desc:0 "우리 핵심 영토가 아닌 지역을 실제로 장악한 뒤 군과 행정기관의 업무 경계를 정합니다. 군정 문서와 담당 인력을 정비하여 민생물자 처리와 민원 기록을 병렬로 추진할 기반을 마련합니다."
 HOK_KOR_nrsc_civil_supply_offices:0 "민생물자 관리소"
 HOK_KOR_nrsc_civil_supply_offices_desc:0 "점령지 주민에게 필요한 생활물자의 처리와 행정 창구를 정비합니다. 불필요한 마찰과 주둔군 부담을 줄이는 점령행정 체계를 마련하며, 민원·보상 기록부와 어느 순서로도 추진할 수 있습니다."
 HOK_KOR_nrsc_claims_accounts:0 "민원·보상 기록부"
 HOK_KOR_nrsc_claims_accounts_desc:0 "현지 주민의 민원과 재산 관련 기록을 보존하고 행정기관의 책임 소재를 정합니다. 일관된 업무 기준을 통해 정책 집행 여력을 확보하고 국가의 안정도를 높입니다."
 HOK_KOR_nrsc_civil_administration_rules:0 "군정 행정규정"
 HOK_KOR_nrsc_civil_administration_rules_desc:0 "민생물자 관리와 민원 기록을 모두 정비한 뒤 공통 행정규정으로 통합합니다. 기존 저항 목표와 필요 주둔군 감소를 유지하면서 순응도 증가를 돕고 저항에 따른 주둔군 피해를 줄입니다."
 HOK_KOR_nrsc_interservice_liaison:0 "삼군 연락사무국"
 HOK_KOR_nrsc_interservice_liaison_desc:0 "육군·해군·공군 사이의 연락 창구를 정하고 각 군의 실무 경험을 공유합니다. 기존 참모업무와 별도로 보급품 청구, 발송 기록 및 연료 사용을 조정할 기반을 마련합니다."
 HOK_KOR_nrsc_joint_logistics_board:0 "삼군 군수조정회의"
 HOK_KOR_nrsc_joint_logistics_board_desc:0 "각 군이 요구하는 보급품과 수송 일정을 함께 검토하여 중복 청구와 과잉 적치를 줄입니다. 육군의 보급 소모와 해군·공군의 연료 소비를 낮추며, 통합 청구·수송 명부와 어느 순서로도 추진할 수 있습니다."
 HOK_KOR_nrsc_joint_dispatch_records:0 "통합 청구·수송 명부"
 HOK_KOR_nrsc_joint_dispatch_records_desc:0 "보급 청구와 발송 기록을 대조할 공통 명부를 마련하고 통신·전자 장비의 연구에 투자합니다. 해군과 공군의 청구·수송 실무 경험도 함께 축적합니다."
 HOK_KOR_nrsc_service_supply_rules:0 "삼군 군수업무 규정"
 HOK_KOR_nrsc_service_supply_rules_desc:0 "군수조정회의와 통합 명부의 성과를 각 군의 일상 업무에 반영합니다. 삼군 군수조정의 기존 보급 및 해군·공군 연료 절감 혜택을 모두 강화합니다."
 HOK_KOR_nrsc_reconstruction_secretariat:0 "재건행정 사무국"
 HOK_KOR_nrsc_reconstruction_secretariat_desc:0 "을해군란 이후 정치 체제를 정비하고 전쟁이 끝난 뒤, 경기를 온전히 소유·통제하는 상태에서 중앙 재건업무를 통합합니다. 한정된 예산을 행정 능력과 민간 생산시설 중 어느 분야에 먼저 배정할지 결정할 기반을 마련합니다."
 HOK_KOR_nrsc_public_accounts:0 "행정예산 우선배정"
 HOK_KOR_nrsc_public_accounts_desc:0 "재건예산을 회계와 행정 조직의 정비에 우선 배정하여 매일의 정책 집행 여력을 높입니다. 건물 수리도 지원하며, 민간공장 건설예산 우선배정과는 함께 선택할 수 없습니다."
 HOK_KOR_nrsc_construction_practice:0 "건설예산 우선배정"
 HOK_KOR_nrsc_construction_practice_desc:0 "재건예산을 민간 생산시설의 건설과 손상된 건물의 수리에 우선 배정합니다. 행정예산 우선배정과는 함께 선택할 수 없으며, 선택한 건설 정책은 재건예산 정례화를 통해 강화할 수 있습니다."
 HOK_KOR_nrsc_reconstruction_budget:0 "재건예산 정례화"
 HOK_KOR_nrsc_reconstruction_budget_desc:0 "선택한 우선 분야의 예산을 정기 편성 체계에 반영합니다. 행정예산을 선택했다면 건물 수리 혜택을 유지하며 매일 정치력 획득을 강화하고, 건설예산을 선택했다면 민간공장 건설과 건물 수리 속도를 모두 강화합니다."
 HOK_KOR_nrsc_occupation_administration_1:0 "점령행정 체계 I"
 HOK_KOR_nrsc_occupation_administration_1_desc:0 "점령지의 민생물자와 행정 창구를 정비한 체계입니다. 저항 목표와 필요 주둔군을 줄입니다. 점령지를 잃어도 제도는 남지만 해당 지역에 적용할 점령 효과는 없으며, 파시즘 정부를 잃으면 제거됩니다."
 HOK_KOR_nrsc_occupation_administration_2:0 "점령행정 체계 II"
 HOK_KOR_nrsc_occupation_administration_2_desc:0 "민생물자·민원·행정 인계 절차를 통합한 체계입니다. 하위 단계의 혜택을 유지하며 순응도 증가와 주둔군 피해 감소를 추가합니다. 파시즘 정부를 잃으면 제거됩니다."
 HOK_KOR_nrsc_service_coordination_1:0 "삼군 군수조정 I"
 HOK_KOR_nrsc_service_coordination_1_desc:0 "육군의 보급과 해군·공군의 연료 사용을 함께 조정하는 체계입니다. 기존 참모 및 보급 정책과 별도로 적용되며, 파시즘 정부를 잃으면 제거됩니다."
 HOK_KOR_nrsc_service_coordination_2:0 "삼군 군수조정 II"
 HOK_KOR_nrsc_service_coordination_2_desc:0 "공통 명부와 군수업무 규정을 갖춘 삼군 조정체계입니다. 하위 단계의 보급 및 해군·공군 연료 절감 효과를 모두 강화하며, 파시즘 정부를 잃으면 제거됩니다."
 HOK_KOR_nrsc_administrative_budget_1:0 "재건 행정예산 I"
 HOK_KOR_nrsc_administrative_budget_1_desc:0 "재건예산을 행정 능력에 우선 배정하여 매일 정치력 획득과 건물 수리를 지원합니다. 건설예산과 함께 선택할 수 없으며, 파시즘 정부를 잃으면 제거됩니다."
 HOK_KOR_nrsc_administrative_budget_2:0 "재건 행정예산 II"
 HOK_KOR_nrsc_administrative_budget_2_desc:0 "행정 중심의 재건예산을 정례화한 정책입니다. 매일 정치력 획득을 강화하고 기존 건물 수리 혜택을 유지하며, 파시즘 정부를 잃으면 제거됩니다."
 HOK_KOR_nrsc_construction_budget_1:0 "재건 건설예산 I"
 HOK_KOR_nrsc_construction_budget_1_desc:0 "재건예산을 민간공장 건설과 건물 수리에 우선 배정합니다. 행정예산과 함께 선택할 수 없으며, 파시즘 정부를 잃으면 제거됩니다."
 HOK_KOR_nrsc_construction_budget_2:0 "재건 건설예산 II"
 HOK_KOR_nrsc_construction_budget_2_desc:0 "건설 중심의 재건예산을 정례화한 정책입니다. 민간공장 건설과 건물 수리 속도를 모두 강화하며, 파시즘 정부를 잃으면 제거됩니다."
