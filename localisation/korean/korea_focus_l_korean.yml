l_korean:
#economy
 kor_hok_gookppong_enabled_flag:0 "게임 시작 전 사용자 게임정의의 국뽕옵션을 활성화함."
 ##KOR_devalue_the_won:0 "원화 가치 절하"
 KOR_devalue_the_won_desc:0 "대공황 이래로 세계 주요국들은 대공황을 타개하기 위한 수단으로 수출경쟁력 확보와 물가 안정을 위해 자국 통화의 가치를 절하했지만, 우리는 한국산 농산물의 가격경쟁력이 커지는 것을 못마땅하게 여긴 일본의 압력으로 통화가치를 절하하지 못했습니다. 하지만 이젠 우리의 경제주권과 대공황 극복을 위해 과감하게 행동해야할 때입니다."
 KOR_support_light_industry_export:0 "경공업 수출 지원"
 KOR_support_light_industry_export_desc:0 "한반도는 수출할 자원이 적은 국가입니다. 따라서 우리는 그동안 타국의 원자재를 수입해서 2차 가공으로 만든 공업 제품을 수출해왔지만, 대공황 이후 원자재값의 급등으로 인해 대부분의 산업체가 파산해서 그조차도 어렵게 되었습니다. 따라서 특별한 기술과 자본이 필요하지 않는 농산물, 가발, 쥐가죽으로 만든 '코리안 밍크'와 같은 경공업 제품의 생산을 늘리고, 이를 수출해야 합니다."
 KOR_ask_the_ifc_to_invest:0 "IFC에게 투자 요청"
 KOR_ask_the_ifc_to_invest_desc:0 "국제금융공사(IFC)는 한국에 주목하고 있습니다. 그들은 언젠가는 한국이 수출에 유리한 지리적 이점과 근면한 국민성을 이용해 세계 순위권의 주요 경제대국이 될거라 예측하고 있으며, 먼 훗날 그 때가 되면 투자에 대한 과실을 얻고자 합니다. 지금 외교부 청사에서 IFC 경제투자 실사단과의 미팅이 준비되어 있습니다."
 KOR_eight_province_development_committee:0 "팔도 개발 위원회"
 KOR_eight_province_development_committee_desc:0 "팔도 개발 위원회는 경제학자이자 사업가인 유일한이 주도하는 경제부장관 직속의 분과 위원회로, 좁은 한반도의 국토를 각 지방의 특성에 맞춰서 효율적으로 개발하는 것을 목적으로 하는 조직입니다."
 KOR_northern_development:0 "북부지방 개발"
 KOR_northern_development_desc:0 "우리는 북부지방을 개발하기에 앞서서 공무원들을 파견해 북부지방의 현황조사와 경제개발에 필요한 토지부터 먼저 매입하거나 국유화 해야 합니다."
 KOR_southern_development:0 "남부지방 개발"
 KOR_southern_development_desc:0 "우리는 남부지방을 개발하기에 앞서서 공무원들을 파견해 남부지방의 현황조사와 경제개발에 필요한 토지부터 먼저 매입하거나 국유화 해야 합니다."
 KOR_central_region_development:0 "중부지방 개발"
 KOR_central_region_development_desc:0 "우리는 중부지방을 개발하기에 앞서서 공무원들을 파견해 중부지방의 현황조사와 경제개발에 필요한 토지를 먼저 매입하거나 국유화 해야 합니다."
 KOR_develop_unsan_gold_mine:0 "운산 금광"
 KOR_develop_unsan_gold_mine_desc:0 "평안북도의 운산, 창선, 덕천등지에는 아시아 최대 규모의 금광이 존재합니다. 비록 이들 금광은 구 제국시절 민비가 민씨 일가의 보호를 대가로 미국인 호러스 뉴턴 알렌에게 채굴권을 넘기고 1920년대 중반에 채굴이 종료된 상태이지만, 아직 미탐사된 금맥이 존재하며, 그 규모는 보수적인 통계로도 세계 10위 규모의 금광이 존재할 것으로 예상됩니다. 우리는 이 금광들을 개발해서 우리의 국고에 보태야 합니다."
 KOR_build_soyanggang_dam:0 "소양강댐 건설 재개"
 KOR_build_soyanggang_dam_desc:0 "소양강댐은 총 29억 톤의 물을 저장할 수 있는 동양 최대 크기의 사력댐으로 설계되었습니다. 비록 대공황으로 인해 완성되지 못한 채 방치되어 있었지만, 우리는 이 댐을 완공해 수도권과 강원도 전역에 전기와 수돗물을 공급할 수 있을 것입니다."
 KOR_honam_plain_food_factory:0 "호남평야 가공식품 공장"
 KOR_honam_plain_food_factory_desc:0 "호남은 한반도의 몇 안되는 평야지대이자 대규모 곡창 지대로, 한국의 식량창고입니다. 우리는 호남평야에 한국인들이 선호하는 닭고기를 생산하는 공장형 양계장과 미국식 프레스 햄을 생산하는 대규모 식품 가공공장을 세워서 일자리를 창출하고, 수출도 할 수 있으며, 국민들의 식생활도 개선할 수 있을것입니다."
 KOR_saemangeum_reclamation:0 "대덕 산업단지 확장"
 KOR_saemangeum_reclamation_desc:0 "호서지방 대전에는 소형 기계, 전자, 화학, 섬유, 제지 등 민간에 필요한 경공업 제품들을 생산하는 대덕 산업단지가 존재합니다. 우리는 대덕 산업단지를 확장해 더 많은 중견 및 중소기업체들이 입주해 사업을 시작할 편의 및 여건을 제공해줘야 합니다."
 KOR_busan_free_trade_zone:0 "부산 자유무역지대"
 KOR_busan_free_trade_zone_desc:0 "부산은 개항 이래로 한반도 최대의 항구도시이자, 일본, 중국, 소련간의 중계무역이 발생하는 무역항입니다. 우리는 부산을 영국의 홍콩, 중국의 상하이, 일본의 도쿄와 같은 세계규모의 국제 무역항으로 키우기 위해서 제도적 편의 보장과 국가차원의 투자를 실시해야 합니다."
 KOR_agricultural_support_in_jaeryeong_plain:0 "재령평야 농업 지원"
 KOR_agricultural_support_in_jaeryeong_plain_desc:0 "황해도의 재령 평야는 전라도의 호남평야만큼 넓지 못하지만, 경기도의 수도권과 평안도의 평양권과 가까운 이점을 가집니다. 우리는 재령평야의 농업을 투자하고 지원해서 서울과 평양이 소모할 신선한 농산물을 공급하는 거점으로 삼을 수 있습니다."
 KOR_support_gaema_plateau:0 "개마고원 목축업 지원"
 KOR_support_gaema_plateau_desc:0 "함경도의 대부분을 차지하는 개마고원은 쌀농사도 불가능하고 인간의 거주 역시 어렵지만, 넓게 펼처진 고산 평원은 알프스식 목축업에 적합합니다. 우리는 개마고원의 목축업을 지원해 경제적 이득과 개마고원에서 훈련된 튼튼한 군마를 보급품 수송에 이용할 수 있습니다."
 KOR_seoul_national_university_expansion:0 "서울대학교 확장"
 KOR_seoul_national_university_expansion_desc:0 "만일 누군가 조국의 미래를 묻거든 고개를 들어 관악을 보게 하라 - 국립 서울대학교는 1906년 민국 건국 이래로 한국 최고의 인재를 양성하고 학문을 연구하는 서구식 4년제 국립 종합대학교로 기능하고 있습니다. 그러나, 대공황 이후 정부 예산 감축으로 인해 우리는 이들에게 충분한 투자를 하지 못하고 있었습니다. 이제 이러한 불행은 끝나야 합니다."
 KOR_attract_worldclass_scholars:0 "세계수준 석학 유치"
 KOR_attract_worldclass_scholars_desc:0 "이제 우리는 경제적 여유가 생겼으니 국가 차원에서 세계적 수준의 석학들을 초빙해 새로운 기술을 연구하고 세계적인 추세에 더이상 뒤쳐지지 않도록 충분한 추자를 해야 합니다."
 KOR_hamgyeong_underground_resources:0 "함경도 지하자원 개발"
 KOR_hamgyeong_underground_resources_desc:0 "함경도는 험준한 산지가 대부분이기 때문에 농업에는 적합하지 않습니다. 그러나, 적지 않은 양의 지하자원들이 매장되어있으며, 우리는 이 지하자원들을 활용하는 것이 가능합니다."
 KOR_gangwon_underground_resources:0 "강원도 지하자원 개발"
 KOR_gangwon_underground_resources_desc:0 "강원도는 험준한 산지가 대부분이기 때문에 농업에는 적합하지 않습니다. 그러나, 적지 않은 양의 지하자원들이 매장되어있으며, 우리는 이 지하자원들을 활용하는 것이 가능합니다."
 KOR_comprehensive_national_development_plan:0 "국토개발종합계획"
 KOR_comprehensive_national_development_plan_desc:0 "국토개발종합계획은 한반도 전역을 개발하고 도시화 시키기 위한 계획입니다. 비록 엄청난 시간과 예산이 필요하겠지만, 한반도 전역을 개발한다면, 우린 우리의 좁은 국토 전역을 산업화 시킬 준비를 마칠 수 있습니다."
 KOR_synthetic_rubber:0 "합성 고무"
 KOR_synthetic_rubber_desc:0 "한반도의 기후는 고무나무가 자라기 적합하지 않기 때문에 우리는 필요한 고무를 전량 수입에 의존하고 있습니다. 따라서 우리는 국부 유출을 줄이고 고무를 자급자족하기 위해 독일의 IG 파르벤이 특허를 가지고 있는 스티렌-부타디엔 합성 고무의 합성식을 참고해서 국내 고무의 수요를 일부라도 자급자족 해야 합니다."
 KOR_gyeongbu_expressway:0 "경부고속도로"
 KOR_gyeongbu_expressway_desc:0 "1929년 대공황 이래로 우리는 경제회복을 위해 루스벨트의 뉴딜 정책과 히틀러의 아우토반을 참고해서 정부주도의 대규모 토목공사들로 일자리를 창출하려 했으나, 공사 도중 자금의 부족으로 1935년 중단되었습니다. 이제 경공업 수출로 세수의 여유가 생겼으니 지금이라도 이 토목공사들을 다시 재개해야 합니다."
 KOR_gyeongui_expressway:0 "경의고속도로"
 KOR_gyeongui_expressway_desc:0 "경부고속도로가 완성되었으니 이번에는 경의고속도로의 공사를 재개할 차례입니다. 경의고속도로까지 제대로 완성되면 이제 우리는 신의주부터 부산까지 1일 생활권의 시대가 열리게 되고, 북쪽으로의 군 긴급 재배치에도 크게 도움이 될것입니다."
 KOR_gyeongui_expressway_tt:0 "대공황의 여파 감소"
 KOR_first_new_city_plan:0 "1기 신도시 계획"
 KOR_first_new_city_plan_desc:0 "서울은 우리 조국의 정치적, 경제적, 문화적 중심지이고 모두가 서울에 살기를 원하지만 서울은 이미 주택부족으로 포화상태입니다. 따라서 우리는 서울 근교에 '신도시'라는 이름의 위성 도시들을 세우고 한반도에 풍부한 석회를 활용해 200만호의 다층식 공동주택들을 짓고 교통망을 통합해 수도권을 하나의 초 거대 도시로 만들어야 합니다."
 ##KOR_construction_boom:0 "건설 붐"
 KOR_construction_boom_desc:0 "우리가 그동안 벌인 정부주도의 토목공사들로 인해 비록 정부 부채는 크게 늘었지만, 실업난이 크게 개선되었으며 현금이 시장에 다시 풀리고 경제가 다시 살아나고 있습니다. 또한 건설사들은 그간의 공사들로 대규모 토목공사에 대한 노하우들이 쌓였으며 이들은 우리가 줄 일감만을 기다리고 있습니다."
 KOR_development_of_heavy_industry:0 "중공업 개발"
 KOR_development_of_heavy_industry_desc:0 "이제 경공업 수출로 조금이나마 여유가 생겼으니 경공업 중심에서 중화학 공업 중심의 경제로 전환해야 합니다. 우리는 중공업 개발에 앞서서 우리의 산업 역량의 상황과 다른 산업 강국들의 기술들을 주의깊게 참고해야 합니다."
 KOR_guro_industrial_complex:0 "구로공단"
 KOR_guro_industrial_complex_desc:0 "우리는 인천항을 통한 수출에 유리한 서울 구로에 제조업 기반의 한국수출산업단지 1, 2, 3단지를 건설해서 그 곳을 수도권 최대의 산업단지로 조성할 것입니다. 공장의 매연이 섞인 저녁노을이 아름답겠군요."
 KOR_pohang_iron__steel_company:0 "포항제철"
 KOR_pohang_iron__steel_company_desc:0 "우리는 그동안 산업의 쌀인 철강을 직접 생산하지 못하고, 전량 미제, 일제 수입 철강에 의지했습니다. 하지만 지속적인 중공업 개발을 위해서는 자체적인 철강 생산이 필수이며, 이에 따라 우리는 경상도 포항에 정부주도의 공기업 포항종합제철주식회사를 세우고 우리 손으로 만든 용광로를 세워서 우리 손으로 만든 철강을 생산할 것입니다!"
 KOR_namdong_imhae_industrial_complex:0 "남동-임해공업지대"
 KOR_namdong_imhae_industrial_complex_desc:0 "경상도는 부산항을 통한 원자재 수입과 완재품 수출이 편리하기 때문에 중공업이 발달하기 유리합니다. 우리는 경상도 동쪽의 영일만부터 광양만까지 울산, 부산, 창원, 거제, 통영을 연결하는 대규모 대상형 중화학 공업 단지를 조성할 것입니다."
 KOR_saemaeul_undong:0 "[GetSaemaulUndongName]"
 KOR_saemaeul_undong_default:0 "새마을 운동"
 KOR_saemaeul_undong_commie:0 "천리마 운동"
 KOR_saemaeul_undong_desc:0 "새마을 운동은 한국의 전통 시골 공동체주의인 향약을 사상적 기반으로 하는 농촌 근대화 운동입니다. 우리는 이 사회 운동을 통해 도시에 비해 상대적으로 개발에서 소외된 농촌의 빈곤을 퇴치하고, 농촌을 재건하고, 계몽하고, 재개발 및 현대화 할것입니다."
 KOR_industrialized_society:0 "산업화 사회로 진입"
 KOR_industrialized_society_desc:0 "이제 우리 조국은 더이상 미개발된 농업국가가 아닙니다. 마천루와 공장들로 가득찬 대도시에선 엄청난 수의 공장 노동자들과 사무직 노동자들이 출퇴근을 하고 서비스업 종사자들이 그들에게 영업을 하며 청년들은 가업을 잇는 것이 아닌 입신양명을 위해 공부를 하고 있습니다."
 KOR_miracle_on_the_han_river:0 "한강의 기적"
 KOR_miracle_on_the_han_river_desc:0 "이제 우리 조국은 지난 대공황의 여파를 모두 극복하고 경제를 제건 및 발전하는데 성공했습니다. 비록, 급격한 산업화와 도시화에 따른 후유증이 적지 않았지만, 눈부신 경제성장으로 이젠 우리도 유럽의 국가들과도 어깨를 나란히 할 수 있는 경제력과 산업력을 갖추게 되었습니다."
 KOR_mugunghwa_kkochi_pieossseubnida:0 "무궁화 꽃이 피었습니다"
 KOR_mugunghwa_kkochi_pieossseubnida_desc:0 "원자 과학의 초기실험은 유망한 결과를 보여주었습니다. 그 힘을 활용하는 것은 인류가 이전에 본 것과 다른 무기를 우리에게 줄 것입니다."
 KOR_create_add:0 "국방과학연구소 설립"
 KOR_create_add_desc:0 "이제 경제적 여유가 생겼으니 우리는 우리의 뒤처진 과학기술을 개발하기 위해 이 땅의 천재들을 모아 새로운 전쟁병기들을 개발하는 국방과학연구소를 창설해야 합니다."
 KOR_korean_jet_engine:0 "현대의 신기전"
 KOR_korean_jet_engine_desc:0 "먼 거리를 날아 적지를 타격하는 개념은 한민족에게 그렇게 생소한 개념이 아닙니다. 우리는 장거리를 비행해 적지를 타격하는 발사체를 개발해 적진을 타격하기 위해 노력해야 합니다."
 KOR_oil_from_korean_coal:0 "석탄 액화"
 KOR_oil_from_korean_coal_desc:0 "한반도는 기름 한방울 나지 않지만, 석탄은 매우 풍부합니다. 우리는 연료 자립을 위해 독일이 20여년 전 대전쟁때 처음 선보인 석탄 액화기술의 합성식을 활용해 우리 손으로 만든 기름을 만들어야 합니다."

#manchuria
 kor_triumph_for_the_manchuria_flag:0 "만주 정복을 완료함."
 KOR_the_manchurian_project:0 "만주 계획"
 KOR_the_manchurian_project_desc:0 "마침내, 우리는 민족의 고토인 만주를 수복하는데 성공했습니다. 현재 만주는 만주족(여진족)과 몽골족, 중국 한족, 일본제국이 이주시킨 만주일본인(히키아게샤), 적백내전 이후 정착한 백계 러시아인, 그리고 간도의 한국계로 매우 복잡한 인종적 구성을 가지고 있습니다. 우리는 서둘러 만주의 행정관청들을 접수하고 공무원들을 파견해서 이 땅에서 할 수 있는 것들을 조사해야 합니다."
 KOR_manchurian_oil:0 "만주 유전지대 개발"
 KOR_manchurian_oil_desc:0 "우리가 만주에 파견한 공무원 중 한명이 북만주에서 석유의 흔적을 발견했습니다. 그는 모험 활극과 마적들의 습격을 피한 끝에 군의 도움을 받아 무사히 복귀해 그 위치가 담긴 지도를 가져왔으며, 이 소문을 들은 미국의 스탠다드 오일과 영국의 로열 더치 쉘이 투자를 제안했습니다. 이 유전을 개발한다면, 우리는 우리가 필요로 하는 산업유와 비축유를 완전히 자급자족할 수 있을것입니다."
 KOR_multiethnic_embrace:0 "다문화 수용"
 KOR_multiethnic_embrace_desc:0 "만주는 비록 과거에는 우리 한민족의 강역이였지만, 이젠 현실을 직시해야 합니다. 우리가 만주의 영토와 산업시설들을 온전히 차지하고 앞으로도 유지하기 위해서는 자유와 민주주의의 인본주의적 가치 아래에 만주에 거주중인 각 민족들의 문화를 존중하고, 자치를 인정해 그들이 우릴 지배자가 아닌 이웃으로 생각하게 하고, 궁극적으로 대한을 그들의 새로운 조국으로 생각하게 해야 합니다."
 KOR_invitation_jewish:0 "유대인 정착 허가"
 KOR_invitation_jewish_desc:0 "우리는 만주 황궁을 점령하는 과정에서 과거 일본제국과 만주국이 유럽과 미주에서 핍박받는 유대인들을 만주에 정착시켜서 그들의 노동력과 자본, 기술력을 활용하는 것을 목표로 하는 '복어 계획'문건을 입수했습니다. 비록 그들의 계획은 독일과의 동맹으로 실현되지 않았지만 이젠 만주의 지배자는 그들이 아닌 우리고, 우리가 이 계획을 활용하지 않을 이유는 없습니다."
 KOR_invitation_white_russian:0 "반공 러시아인 정착 허가"
 KOR_invitation_white_russian_desc:0 "적백내전이후, 백군을 지지한 수십만명의 러시아인들은 볼셰비키들을 피해 그들의 조국에서 도망쳐서 세계 각국으로 흩어졌으며, 그들은 러시아인들이 세운 도시인 만주의 합이빈에도 많이 거주중입니다. 우리는 세계를 떠도는 이 유랑민들에게 군 복무를 대가로 대한민국의 시민권을 제안하고 만주에 안정적으로 정착하는 것을 허락할 수 있습니다."
 ##KOR_korean_dream:0 "코리안 드림"
 KOR_korean_dream_desc:0 "우리의 관용주의적인 다문화 수용은 전 세계에 핍박받는 이들에게 큰 희망이 되었습니다. 자유와 민주주의의 이름 아래에 인종차별과 전란의 고통, 식민지배를 피하기 위해 백인, 흑인, 황인 구분없이 가식없는 진정한 자유의 요람이자 아시아 자유의 등불인 대한민국으로 들어오고 있습니다."
 KOR_proclaim_federation_of_balhae:0 "발해 연방"
 KOR_proclaim_federation_of_balhae_desc:0 "이제 우리는 더이상 한국인도, 만주인도, 중국인도, 몽골인도, 러시아인도, 일본인도, 유대인도, 그 외 이방인도 아닙니다. 우리는 홍익인간의 정신 아래 동등한 구성원이자 한 명의 시민으로서 진정한 자유민주주의 국가를 건설해나가고 있습니다. 이제 우리는 우리의 가치관을 잘 나타낼 수 있는, 한민족 역사상 유일한 다민족 국가의 이름을 딴 새로운 국명을 재정할 것입니다. - Pro Hominum Beneficio! Pax Balhaeana!"
 KOR_deportation_of_chinese_from_manchuria:0 "문화 동화정책"
 KOR_deportation_of_chinese_from_manchuria_desc:0 "우리는 우리가 단일민족이라고 주장하지만, 사실 그동안 한반도에 유입된 많은 민족들을 한민족으로 동화해 왔습니다. 고려 말 몽골인들과 조선 초 여진족들, 조선 중기 항왜들과 명나라 유민들까지 결과적으론 모두 성공적으로 한민족에 동화되었습니다. 우린 이쪽일에는 이미 충분한 경험을 가지고 있으며 이제 만주가 우리의 품으로 돌아온 이상, 만주인들 역시 모두 한민족으로 '동화'되어야만 합니다. 그 수가 얼마나 되던간에 말이죠."
 KOR_korean_settlement:0 "한국인 거주지 건설"
 KOR_korean_settlement_desc:0 "우리의 고토 만주가 다시 우리의 품으로 돌아온 이래로, 반도 내의 많은 하층민들이 '기회의 땅' 만주로 가서 한몫을 잡고 싶어합니다. 우리는 이들의 기대를 부응하기 위해, 만주에 한국인들을 위한 부촌을 건설하고 그들을 만주로 이주시켜야 합니다."
 KOR_teaching_korean_to_manchurians:0 "한국어 교육 의무화"
 KOR_teaching_korean_to_manchurians_desc:0 "한국인이란 한국을 조국으로 여기고 한국문화를 향유하고 한국인처럼 생각하고 한국어를 사용하는 사람들을 의미합니다. 우리는 만주인들에게 한국인으로 거듭날 수 있는 기회를 절호의 기회를 주기 위해 이들에게 먼저 훈민정음을 배울 수 있는 영광을 부여할 것입니다."
 KOR_rebuild_guknaeseong_as_new_city:0 "국내성 신도시 건설"
 KOR_rebuild_guknaeseong_as_new_city_desc:0 "옛 고구려의 수도 국내성의 터는 사실 도시로서 기능하기에는 적합하지 않습니다. 압록강을 수원지로 사용할 수 있지만, 너무 험준한 산들은 도시를 건설하기에는 최악의 조건입니다. 그러나 우리의 만주 탈환을 기념하기위한 금자탑으로 삼고, 한반도에서 만주로 나아가는 주요 관문으로 삼기에는 최적의 장소이기에, 우리의 모든 건설 역량을 총 동원해서 이 영광스러운 도시를 재건해야만 합니다!"
 KOR_revive_of_goguryo:0 "고구려의 부활"
 KOR_revive_of_goguryo_desc:0 "이제 우리의 명실상부한 만주 지배는 기정사실화 되었습니다. 우리는 대륙을 향한 우리의 야망을 더욱 공고히 표현할 수 있는 새로운 국명을 칭할 준비가 되었습니다."
 KOR_rebuild_manchurian_heavy_industry_facility:0 "만주 중공업 시설 재건"
 KOR_rebuild_manchurian_heavy_industry_facility_desc:0 "만주는 본래 아시아에서도 손꼽히는 공업화된 지역입니다. 그러나 애석하게도, 우리 군의 작전 과정과 행정 이관 과정에서 대부분의 중공업 시설들이 파괴되거나 유실되었습니다. 우린 서둘러서 이 중공업 단지들을 재건해야 합니다."
 KOR_arsenal_of_far_east:0 "극동의 무기고"
 KOR_arsenal_of_far_east_desc:0 "만주의 중공업 산업단지들의 재건 이후로 만주의 중공업은 항상 호황입니다. 이 기세를 모아서 우린 만주를 극동의 무기고로 재편해서 추후의 분쟁에 대비해야 합니다."
 KOR_resource_exploration_in_manchuria:0 "만주 지하자원 개발"
 KOR_resource_exploration_in_manchuria_desc:0 "만주의 드넓은 삼강평원은 농업에도 적합하긴 하지만 아직 미탐사된 자원이 풍부하게 존재합니다. 우린 만주의 지하자원들을 활용해 더 많은 자원들을 자급자족 할 수 있습니다."
 
#military
 KOR_build_the_gyeryongdae:0 "계룡대 건설"
 KOR_build_the_gyeryongdae_desc:0 "기존 서울의 육,해,공 삼군본부는 따로따로 떨어져 있어서 3군의 통합 지휘 및 제병 합동에 불리한 데다, 이들 본부의 건물들은 증가하는 군 행정업무를 소화하기엔 너무 포화된 상태입니다. 따라서 효율적인 군 지휘를 위해 우린 충청도 계룡에 육해공 삼군이 함께 사용할 거대한 합동 지휘소를 건설해야 합니다."
 KOR_establish_dasmfe:0 "국방정신전력원 창설"
 KOR_establish_dasmfe_desc:0 "우리 군인들은 우리가 어떤 정치적 신념을 가져야 하고, 우리의 적이 무엇이고, 우리가 무엇을 위해 싸워야 하는지 감을 잡지 못하고 있으며, 군의 민간과의 공조 및 홍보능력은 재앙에 가까운 수준입니다. 따라서 우리는 소련의 정치 장교와 서방권 군대의 공보(Public Affairs)병과의 기능과 장점을 합친 '정훈공보'병과를 신설하고, 이 병과에 소속될 장병들을 체계적으로 교육할 기관을 창설해야 합니다."

 KOR_begin_rearmament:0 "재무장 시작"
 KOR_begin_rearmament_desc:0 "한일러 전쟁 종전 이후 지난 30여년의 평화로 인해 우리 군은 위험할 정도로 실전감각을 잃고 나태해졌으며, 군 예산, 장비의 질과 양은 모두 우려스러울 정도로 저하되어 있습니다. 전 세계적으로 긴장이 고조되어가고 있는 지금, 우리는 군 예산을 추가 배정하고 대공황으로 가동이 중지된 군수공장들을 재 가동할 준비를 해야 합니다."
 KOR_daehanminguk_yuggun:0 "대한민국 육군"
 KOR_daehanminguk_yuggun_desc:0 "국가방위의 중심군, Pride & Trust 대한민국 육군은 1906년 민국 건국 이래로 조국의 산하를 수호해온 수호자들입니다. 우리는 이들의 현황에 대해 점검해야 합니다."
 KOR_army_augmentation:0 "육군 확장"
 KOR_army_augmentation_desc:0 "대공황 이후 군축으로 인해, 우리 육군은 50개 사단에서 22개 사단으로 축소되었으며, 그조차도 대부분 편제가 반토막이 나게 되었습니다. 우리는 전역한 예비역 장병들 중 군문에 복귀하기를 희망하는 지원자를 모아 다시 현역에 복귀시키고, 그들을 완편된 사단으로 재편성해야 합니다."
 KOR_army_augmentation_tt:0 "4개 완편 보병 사단을 수도에서 얻습니다."
 KOR_organization_rokasf:0 "제1공수군단 창설"
 KOR_organization_rokasf_desc:0 "육군이 자랑하는 영웅, 홍범도 예비역 장군의 전속부관을 역임한 주소한국대사관 주재무관 김공수 중령은 소련이 1935년 실시한 키예프 대연습을 참관하고 우리 군에도 군단급 규모의 공수부대 창설이 필요하다고 건의했습니다. 공수부대는 육상으로 진입이 불가능한 곳에 전략적인 병력 투입이 가능한 장점이 있으며, 이를 실현하기 위해 각 야전부대의 특급전사들을 차출해서 공수사단들을 창설하고 훈련시켜야 합니다."
 KOR_organization_rokasf_tt:0 "3개 정예 공수사단을 수도에서 얻습니다."
 KOR_armored_focus:0 "기갑 중점"
 KOR_armored_focus_desc:0 "전차야말로 미래 전장을 지배할 육상의 왕자입니다. 우리는 유럽의 프랑스나 독일, 체코슬로바키아와 같은 유럽의 전차 선진국들의 사례와 기술들을 수집해서 연구할 것입니다."
 KOR_mobile_infantry:0 "기동 보병"
 KOR_mobile_infantry_desc:0 "트럭에 탑승해 빠르게 이동하는 차량화 보병대는 비싸지만 전략 예비대로서의 가치가 충분합니다. 우리는 여기에 더 발전해, 농업용 트랙터를 개조한 반궤도 장갑차를 개발해 튼튼한 방어력과 험지를 돌파할 수 있는 반궤도 장갑차를 개발해야 합니다."
 KOR_armored_vanguard:0 "기갑 선봉대"
 KOR_armored_vanguard_desc:0 "기갑전의 시대가 도래함에 따라, 이제 전차들은 예전보다 더 큰 체급과 두꺼운 장갑, 강력한 관통력을 가진 포를 필요로 합니다. 우리 군 역시, 이러한 시대의 흐름에 뒤쳐져서는 안되며, 차량화 보병대와의 제병협동이 이루어지는 본격적인 기갑사단을 육성해야만 합니다!"
 KOR_armored_vanguard_tt:0 "2개 중형전차 기갑 사단을 수도에서 얻습니다."
 KOR_infantry_focus:0 "보병 중점"
 KOR_infantry_focus_desc:0 "전쟁의 시작과 끝은 언제나 보병이 장식합니다. 아무리 강력한 병기들을 이용한다 하더라도, 보병이 마지막에 깃발을 꽂아야 전투가 종결되며, 보병이야말로 육군, 더 나아가 군대를 대표하는 병종입니다. 우리는 보병에 더 투자하고, 전군규모의 혹한기/혹서기 훈련을 실시해서 더 많은 보병전 경험을 쌓아야 합니다."
 KOR_new_model_rifle:0 "신형 소총 개발"
 KOR_new_model_rifle_desc:0 "국군부산조병창 병기장교 채병덕 중위는 외산 개인화기들을 참고해 기존 국군의 제식소총 만리허 M1907보다 더 뛰어난 개인화기를 설계하고, 군에 이를 채용할 것을 건의했습니다. 우리의 결심만 선다면, 우리 장병들을 위한 새로운 개인 화기의 생산 라인을 준비할 수 있습니다."
 KOR_improved_artillery:0 "개선된 화포 도입"
 KOR_improved_artillery_desc:0 "포병은 전쟁의 신입니다. 압도적인 포병의 화력앞에 적이 할 수 있는 일따윈 존재하지 않습니다. 우리는 더욱 크고 강력하고 대구경의 화포들을 개발하고 생산해서 전장에 배치해야만 합니다."
 KOR_expansion_of_non_combat_support_units:0 "비전투병과 확대"
 KOR_expansion_of_non_combat_support_units_desc:0 "전쟁은 전투병과만의 몫이 아닙니다. 전선의 병사들을 위한 충분한 군수 지원과 지원병과들의 적절한 지원은 현대전에서 매우 중요한 요소입니다."
 KOR_research_army_doctrine:0 "육군 교리 연구"
 KOR_research_army_doctrine_desc:0 "어떠한 보병 병력이나 첨단 전차라도 혼자서는 전쟁에서 이길 수 없습니다. 우리는 전술적, 전략적 능력을 모두 함양하는데 주력해야만 합니다. 육군본부에는 이미 이러한 일에 적합한 참모 인재들이 우리의 요구를 충족할 준비가 되어있습니다."
 
 KOR_daehanminguk_haegun:0 "대한민국 해군"
 KOR_daehanminguk_haegun_desc:0 "바다로, 세계로! 충무공의 후예 대한민국 해군은 1906년 민국 건국 이래로 우리의 해양 주권과 영해를 수호해 왔습니다. 우리는 이들의 현황에 대해 점검해야 합니다."
 KOR_invitation_of_foreign_naval_designers:0 "독일 조선공 포섭"
 KOR_invitation_of_foreign_naval_designers_desc:0 "비록 아돌프 히틀러의 집권 이후, 독일과의 해군 협력관계는 중단되었지만, 아직 을지문덕급 중순양함을 건조한 블룸 운트 보스 코리아의 일부 독일인 직원들은 국내에 남아있습니다. 우리는 그들에게 특별귀화를 허가하고, 그들이 계속 한국에 남아 우리를 위한 함선을 설계할 수 있도록 편의를 제공해야 합니다."
 KOR_organization_rokmc:0 "대한민국 해병대 창설"
 KOR_organization_rokmc_desc:0 "조선 초의 명재상으로 유명한 황희의 16대손이자, 자유-독립당 영일군 지역구의 5선 국회의원 황룡의 아들로 유명한 황근출 중령은 해군 산하의 독자적인 육상전 전문부대의 창설을 건의했습니다. 이들은 강력한 함포사격이 가능한 주력함대의 지원을 받아 극도로 잘 요새화된 항구의 방어선도 쉽게 돌파할 수 있는 장점이 있으며, 이를 위해 각 함정의 해상병들과 해군 헌병들을 차출해서 해병사단을 창설해야 합니다."
 KOR_organization_rokmc_tt:0 "3개 정예 해병 사단을 수도에서 얻습니다."
 KOR_large_surface_fleet:0 "대양함대 건설"
 KOR_large_surface_fleet_desc:0 "비록 대공황으로 인해 좌절되었지만, 우리 해군은 아직 대양해군의 꿈을 포기하지 않았습니다. 국가의 힘을 상징하는 전략병기이자 대양을 누비며 바다위에 떠있는 강철의 요새들이야말로 해군의 진정한 표상입니다."
 KOR_battleship_focus:0 "세종대왕급 전함"
 KOR_battleship_focus_desc:0 "우리는 우리 손으로 만든 신형 전함을 연구하기에 앞서서, 대공황 전까지 계획되었던 건함계획때 기획한 군함들의 설계도를 재점검하고, 새로운 시대를 위한 전함의 설계를 마쳐야 합니다."
 KOR_carrier_focus:0 "백두산급 항공모함"
 KOR_carrier_focus_desc:0 "해군 항공에 잠재성에 대해서는 해군 내에서도 의견이 갈리지만, 그래도 해상 정찰이나 보조적인 역할로서의 항공모함의 유용성에 대해 의심하는 인사는 거의 없습니다. 미국의 렉싱턴급 항공모함이나 영국의 커레이져스 항공모함과 같은 폐기 순양전함 함체 기반의 초보적인 항공모함에 대해 연구해볼 가치는 충분해 보입니다."
 KOR_build_new_ship:0 "신조 대형함 건조"
 KOR_build_new_ship_desc:0 "이제 설계도가 결정되었으니 우리는 이제 우리 손으로 만든 첫 주력함의 건조를 시작할 것입니다!"
 KOR_fate_of_hms_tiger_tt:0 "이전에 선택한 중점에 따라 전함 2대 혹은 항공모함 2대를 생산 대기열에 추가합니다."
 KOR_fate_of_hms_tiger_BC_tt:0 "2대의 세종대왕급 전함을 한대는 완성율 90%, 한대는 완성율 30%로 생산대기열에 추가합니다."
 KOR_fate_of_hms_tiger_CV_tt:0 "2대의 백두산급 항공모함을 한대는 완성율 80%, 한대는 완성율 20%로 생산대기열에 추가합니다."
 KOR_commerce_raiding:0 "통상파괴 중점"
 KOR_commerce_raiding_desc:0 "안타깝지만 우리는 우리의 현실을 직시해야 합니다. 비록 강력한 대양함대를 만드는 것이 우리 해군의 오랜 소망이었지만, 현재의 제한된 예산으로는 어림도 없습니다. 대신 우리는 지난 대전쟁 당시 독일제국의 통상파괴전과 잠수함에 주목해야 합니다. 이들은 상대적으로 적은 규모와 예산으로도 해군의 전략적 목적을 달성하는데 문제가 없음을 잘 증명했습니다."
 KOR_new_submarine:0 "신형 잠수함 도입"
 KOR_new_submarine_desc:0 "잠수함이야말로 현대의 거북선이며, 일본제국해군에 비해 압도적 열세인 우리 해군이 대항할 수 있는 유일한 열쇠입니다. 우리는 BV코리아가 남겨둔 독일제 잠수함 설계도의 문제점을 연구해 더 진보되고 우수한 잠항능력을 발휘할 수 있는 잠수함을 개발해야 합니다."
 KOR_submarine_Squadron:0 "잠수함대"
 KOR_submarine_Squadron_desc:0 "위협적인 잠수함 울프팩을 꾸리기 위해서는 더 많은 연습용 잠수함들을 도입해 실전과 같은 연습을 해야 합니다. 고맙게도, BV코리아의 중계로 우리는 독일이 연습용으로 사용하다 퇴역할 예정인 Type II형 유보트 7대를 추가로 구매할 수 있습니다."
 ##KOR_vision_1950:0 "비전 1950"
 KOR_vision_1950_desc:0 "비전 1950은 1950년 전까지 전함과 항공모함을 포함한 대양 해군을 육성하는 것을 목표로 하는 손원일 제독의 건함 계획입니다. 우리는 이 목표 달성에 매진하여 강력한 해군을 건설해서, 조국의 영해를 지키기 위해 조선소에 더 많은 자원 할당과 초과 근무를 요청해야 합니다."
 KOR_jeju_naval_base:0 "제주 해군기지 건설"
 KOR_jeju_naval_base_desc:0 "제주도는 한반도 남쪽에 위치한 화산섬으로, 우리나라의 가장 큰 섬입니다. 혹자는 이 섬을 평화의 섬이라 주장하지만, 제주도는 우리가 남방 해역을 통제하고, 중국의 난징 수도권과 일본제국해군 3함대 본부인 사세보를 견제할 수 있는 환상적인 요충지입니다. 우리는 제주도를 요새화하고 대규모 군항을 지어서 한국의 진주만이자 한국해군이 대양으로 진출하는 전진기지로 삼아야 합니다."
 KOR_peninsula_dockyard:0 "반도 조선시설 확장"
 KOR_peninsula_dockyard_desc:0 "육군이 만주를 정복한 이후, 우리 조국의 관심사는 이제 육상이 아닌 바다로 향하고 있습니다. 이제 우린 풍족한 예산의 지원 아래, 삼면이 바다와 접한 한반도 곳곳에서 조선소를 짓기 적합한 모든 곳에 조선소를 건설하고 함대를 육성할 것입니다."
 
 KOR_daehanminguk_gonggun:0 "대한민국 공군"
 KOR_daehanminguk_gonggun_desc:0 "대한민국을 지키는 가장 높은 힘! 대한민국 공군은 노백린 준장의 제안으로 1925년 육군항공대에서 독립한 신생군으로, 세계에서 세 번째로 창설된 독립된 공군조직입니다. 우리는 이들의 현황에 대해 점검해야 합니다."
 KOR_new_fighter:0 "신형 전투기"
 KOR_new_fighter_desc:0 "공군은 현재의 노후화된 전술기 대신 더 튼튼하고 높은 비행성능의 신형 전술기들이 필요합니다. 우리는 항공기 제작사들에게 신형 전술기의 프로토타입들을 경합에 입찰시킬 것을 지시할 수 있습니다."
 KOR_expand_air_bases:0 "공군기지 확대"
 KOR_expand_air_bases_desc:0 "우리는 공군전력의 확대에 앞서서, 공군 전술기들을 정비하고 조종사들이 휴식을 취할 수 있는 공군기지들을 전국 곳곳에 증설해야 합니다."
 KOR_1st_air_defense_brigade:0 "제1방공포병여단"
 KOR_1st_air_defense_brigade_desc:0 "우리 공군의 전술기 숫자는 우리의 영공을 지키기에는 턱없이 부족하고, 지상 방공망 역시 양적으로나 질적으로나 형편없으며, 그마저도 공군이 아닌 육군소속이기에 공군 전술기들과의 연계 역시 형편없는 수준입니다. 따라서, 우리는 기존 육군의 방공포병대대들을 모두 공군으로 전군시키고, 그들을 물적과 인적 양쪽으로 더 증강해서 공군 제1방공포병여단으로 개편해야 합니다."
 ##KOR_korea_aerospace_industry:0 "한국항공우주산업"
 KOR_korea_aerospace_industry_desc:0 "한국의 항공기 제작사는 이 좁고 항공기 수요도 적은 나라에 삼성항공, 한진, 대우중공업비행기사업부, 현대우주항공 등 여러 개의 작은 회사들로 나뉘어 있는 탓에 비효율적입니다. 우리는 이들 기업을 하나로 통합하고, 국영기업으로 전환해 우리의 필요에 따라 움직이게 해야 합니다."
 KOR_tactical_air_force:0 "전술 공군"
 KOR_tactical_air_force_desc:0 "공군의 의의는 어디까지나 육군의 도우미입니다. 우리 공군은 작고 날렵한 요격기와 급강하폭격기, 공격기 다수로 이루어 진 타격단으로 육군의 작전을 지원하는 것을 주 목표로 삼아야 합니다."
 ##KOR_air_artillery:0 "항공포병대"
 KOR_air_artillery_desc:0 "우리 공군의 경험많은 숙련된 공격비행대 소속의 급강하폭격기와 공격기들의 정확한 폭탄 투하와 높은 명중률은 적 지상군들에겐 악몽과도 같습니다. 우리는 이들의 경험을 전 공군 파일럿들에게 주지시켜서 전 공군이 비행하는 대포와 같게 해야 합니다."
 KOR_strategic_air_force:0 "전략 공군"
 KOR_strategic_air_force_desc:0 "공군은 육군의 보조 따위가 그 목적이 아닙니다! 우리는 크고 아름다운 4발 중폭격기들을 통해 적의 본토를 폭격해 적들의 사기와 산업 역량을 망가트릴 수 있으며, 이는 통해 공군은 육군을 직접 지원하지 않아도 적의 세력을 약화시켜 궁극적으로 조국의 승리를 가져올 것입니다."
 ##KOR_burn_the_enemy_mainland:0 "적의 본토를 불태워라!"
 KOR_burn_the_enemy_mainland_desc:0 "무고한 민간인 따윈 존재하지 않습니다. 적 민간인들도 적국의 전쟁에 협조하는 잠재적인 전투원이며, 우리는 이들을 의식해서 공군의 폭격 역량을 제한할 필요따윈 없습니다. 우리 공군 폭격기들은 기존 고폭탄 뿐만 아니라, 소이탄과 네이팜탄도 적극적으로 활용해 적의 본토를 노릇노릇하게 구워버려야 합니다."
 KOR_establishment_of_the_afoc:0 "공군사관학교 투자"
 KOR_establishment_of_the_afoc_desc:0 "지금까지 우리 공군은 육군이나 해군과는 달리 독자적인 사관학교 없이 전투조종사가 될 장교들을 민간 비행학교 출신 비행사들을 임용해 소위로 임관시켜왔습니다. 그러나 이들은 이들이 간직한 비행사의 낭만과 뛰어난 조종술에도 불구하고 상명하복의 군 조직문화에 잘 녹아들지 못했습니다. 따라서 우린 자체적인 조종사 수급과 비행전술의 발전 및 연구를 위해 공군사관학교를 개교해야 합니다."
 KOR_age_of_jet:0 "제트기의 시대로"
 KOR_age_of_jet_desc:0 "기존 프롭기와 비교해, 제트엔진을 사용하는 항공기들은 아직 공상의 영역에 있지만, 점점 그 실현 가능성에 대해 많은 엔지니어들이 긍정적으로 보고 있습니다. 우리 군은 만주정복 완료 이래로 그 필요성과 예산이 넘쳐나니, 이제 우리 공군도 이 공상의 영역에 가까운 기체를 구현하기 위한 막대한 예산을 투입할 준비가 되었습니다!"
 
#politic
 KOR_future_of_the_republic:0 "공화국의 미래"
 KOR_future_of_the_republic_desc:0 "1936년 새해가 밝았습니다. 우리는 조국의 현황을 점검하고 조국의 미래에 대해 고민해야 합니다."


#politic - communism
 KOR_commie_civil_war:0 "공산주의 지지자들이 대구에서 대구 코뮌을 선포하고 내전을 시작합니다."
 KOR_korea_manchuria_border_dispute_tt:0 "만주국과 전쟁에 돌입할 시 만주국이 일본의 괴뢰국일 경우, 세력 미가입 상태에서 단독으로 만주를 점령하면 일본과 평화협상을 결정할 수 있습니다."
 
 KOR_long_live_the_dictatorship_of_the_proletariat:0 "프롤레타리아 독재여 영원하라!"
 KOR_long_live_the_dictatorship_of_the_proletariat_desc:0 "그동안 대한민국의 노동자와 농민들은 조국 근대화를 위한 희생이라는 이름 아래에 착취되었습니다. 대공황 이후, 평화적으로 일자리와 식료품, 의사를 요구하는 20만 명의 '조선의 모스크바' 대구 시민들은 '빨갱이'로 몰려 이승만 정부의 총칼아래 도살당했습니다. 우린 그들과 대화를 위해 기다렸지만, 그들은 우리와 대화할 생각따윈 없었습니다. 이제 우리는 더이상 참지 않을 것이며 이 땅에 진정한 노동자와 농민을 위한 혁명을 시작할 것입니다!"
 KOR_agitate_the_union:0 "노동조합 포섭"
 KOR_agitate_the_union_desc:0 "대공황 이후 공안정국 속에 대한민국 헌법 제33조에 의해 보장되던 노조 결성의 자유는 사실상 사문화 되었으며, 노동조합들은 경찰과 재벌이 고용한 용역 깡패들의 탄압 속에 하나 둘씩 쓰러지고 있습니다. 우리는 이들에게 무기를 지급하고 우리의 대의와 함께 할것을 제안해야 합니다."
 KOR_formation_of_the_provisional_peoples_committee:0 "임시인민위원회 조직"
 KOR_formation_of_the_provisional_peoples_committee_desc:0 "이제 모든 준비가 끝났습니다. 우리는 대구를 중심으로 궐기할 것이며, 이미 전국의 주요 노조와 노동자, 농민들 역시 하나 둘씩 경상도로 집결을 시작했으며, 대구 사회화 운동 진압을 수치스럽게 여기는 일부 반 이승만 국군 지휘관들 역시 우리와 함께하기로 결정했습니다. 우리는 이제 힘을 모아 자국민을 학살한 이승만의 자유-독립당 정권을 이땅에서 몰아낼 것입니다!"
 KOR_proclaim_peoples_republic_of_korea:0 "조선인민공화국 선포"
 KOR_proclaim_peoples_republic_of_korea_desc:0 "노동자, 농민, 그리고 양심적인 참군인들의 활약 속에 우리는 성공적으로 이승만 정권을 몰아내고 조국 해방 혁명을 성공했습니다! 이제 우리는 거짓된 공화국 대신 진정한 노동자와 농민을 위한 국가를 세울 것입니다."
 KOR_yeo_woon_hyung_as_the_leader:0 "여운형 주석"
 KOR_yeo_woon_hyung_as_the_leader_desc:0 "노동자와 농민들의 가혹한 처우를 개선하기 위해 노력했고, 대구 사회화 운동 이후 오랫동안 자유-독립당 정권에 의해 가택연금상태로 있던 옛 대한사회민주당의 당수 몽양 여운형 선생이 드디어 자유의 몸이 되셨습니다. 우리는 그분을 주석으로 추대해 진정한 노동자와 농민들을 위한 국가를 세울 수 있게 해야 합니다."
 KOR_park_heon_young_as_the_leader:0 "박헌영 주석"
 KOR_park_heon_young_as_the_leader_desc:0 "대구 사회화 운동의 실패 이후, 소련으로 망명해 소련에서 반 이승만-공산혁명을 지휘하시던 옛 조선 노동당의 이정 박헌영 선생께서 드디어 조국으로 귀국하셨습니다. 우리는 세계 혁명의 대의를 위해 그분을 새로운 조국의 주석으로 추대해야 합니다."
 KOR_confiscation_of_chaebol_assets:0 "재벌 자산 국유화"
 KOR_confiscation_of_chaebol_assets_desc:0 "재벌들은 그동안, 노동자와 농민들의 피를 빨며 자신들의 부를 축적하고, 대공황 와중에도 그들의 끝없는 탐욕은 계속되어왔습니다. 이제 그들의 재산은 노동자와 농민의 공화국에게 몰수될 것이며, 우리는 그들이 쌓은 부를 남김없이 재분배 할 것입니다."
 KOR_lessons_form_the_civil_war:0 "내전의 교훈"
 KOR_lessons_form_the_civil_war_desc:0 "비록, 조국을 배경으로 하는 피비린내 나는 내전은 많은 상처를 남겼지만, 우리 노동자와 농민의 군대가 실전경험을 쌓을 기회를 주었으며, 젊고 유망하며, 사회주의의 대의에 충성을 하는 신진 장교들이 두각을 들어내는 계기가 되었습니다."
 KOR_korea_manchuria_border_dispute:0 "남만주 포격도발"
 KOR_korea_manchuria_border_dispute_desc:0 "우리가 비록, 거짓된 공화국을 대신한 새로운 농민과 노동자들의 나라를 세웠다지만, 간도와 만주의 우리 동포들을 잊은 것은 절대로 아니며, 만주의 봉건주의자들은 장차 우리의 새로운 조국에 위협을 가할 것이 분명합니다. 따라서 우리는, 그들이 날카로운 발톱을 들어내기 전에, 먼저 그들을 처부술 것입니다."
 KOR_democratic_communism:0 "민주공산주의"
 KOR_democratic_communism_desc:0 "비록, 옛 대한민국의 부르주아 민주주의는 오로지 부유한 자들만을 위한 것이였지만, 그 대의와 이념만큼은 기려저야 합니다. 우리는 주석 직선제와 정당 결성의 자유를 포함한, 진정한 의미의 노동자와 농민의 공화국을 세울 것입니다."
 KOR_pain_sharing:0 "고통 분담"
 KOR_pain_sharing_desc:0 "대공황 이후 경제적 어려움 속에, 수많은 가정이 무너지고 사회가 무너지는 것을 우리는 똑똑히 보았습니다. 우리는 옛 대한민국의 자유 방임주의적 겅제 대신, 빈민과 약자들을 위한 선별적 기본소득과 국가가 직접 운영하는 사회보장제도와 의료보험체계를 실시해 이들의 고통을 분담해야 합니다."
 KOR_rural_support_plan:0 "농촌 진흥계획"
 KOR_rural_support_plan_desc:0 "대공황 이후 이 땅의 자영농들은 완전히 몰락했으며, 그들은 팔리지 않는 농산물들을 부등켜 앉고 울고 있습니다. 우리는 그들을 위해, 잉여농산물의 국가 차원의 매입과 휴농기의 농민들을 위한 국가 차원의 일자리를 만들 것입니다."
 KOR_road_to_world_revolution:0 "세계 혁명의 길"
 KOR_road_to_world_revolution_desc:0 "비록, 우리 조선의 공산혁명은 성공했지만, 아직 전 세계에서는 부르주아들에게 착취당하고 있는 불쌍한 노동자들로 가득하며, 부르주아 진영은 언제든 우리 혁명 조선을 박살내기 위해 움직이고 있습니다. 따라서 세계 혁명이 끝나기 전까지는 우리의 혁명은 끝난 것이 아닙니다."
 KOR_purge_reactionarist:0 "반동분자 숙청"
 KOR_purge_reactionarist_desc:0 "지난 조선 혁명전쟁 당시, 우리는 많은 수의 자유-독립당 정치인들과 이승만 군대 부역자들, 경찰, 지주, 재벌, 그리고 그들의 가족들을 모두 남김없이 체포했습니다. 그들은 혁명의 적이자 새로운 노동자와 농민의 공화국에는 더이상 필요하지 않는 불온분자들입니다. 우리는 그들을 인민재판소의 공정한 재판을 통해 잘잘못을 가리고 '적절한' 처벌을 내릴 것입니다..."
 KOR_heavy_industry_concentration:0 "스탈린식 중공업"
 KOR_heavy_industry_concentration_desc:0 "혁명은 이제 시작되었을 뿐입니다! 우리는 전 세계를 부르주아들로부터 해방하기 위해 생필품 따위가 아닌, 더 많은 무기들을 생산해야 합니다!"
 KOR_anti_fascist_coalition:0 "반 파시스트 동맹"
 KOR_anti_fascist_coalition_desc:0 "지금 세계는 불타오르고 있습니다. 부르주아들은 파쇼들에게 일방적으로 밀리고 있으며, 그들이 끝난 후는 우리의 차례일 것입니다. 따라서 '지금은' 이념의 차이는 재쳐두고, 파쇼들을 막기 위해 그들과 연합전선을 형성해야 합니다."
 KOR_collaborating_with_western_capitalists:0 "서구 자본가와 협상"
 KOR_collaborating_with_western_capitalists_desc:0 "서구 자본가들은 연합국을 결성해 유럽 전선에서 파쇼들에 맞서 싸우고 있습니다. 우리는 이들과 접촉해, 조선인민공화국을 한반도의 정당한 합법 정부로 인정하는 대가로, 원군을 파견하는 것을 제안할 것입니다."
 KOR_join_the_chinese_united_front:0 "국공합작 가담"
 KOR_join_the_chinese_united_front_desc:0 "일본 제국주의자들은 만주사변 이래로 중국 대륙의 주권을 침탈하고 있으며, 그들은 함께 뭉쳐서 이에 저항하고 있습니다. 우리도 그들에게 합류해 그들과 함께 일본의 제국주의자들과 싸워야 합니다!"
 KOR_ilboneul_gonggyeoghanda:0 "일본을 공격한다"
 KOR_ilboneul_gonggyeoghanda_desc:0 "일본의 제국주의적 야욕을 우리 조선은 더이상 지켜보고 있지 않을것입니다. 우리는 일본의 제국주의자들을 끝내기 위한 성전을 시작할 것입니다."
 KOR_join_the_comintern:0 "코민테른과 함께"
 KOR_join_the_comintern_desc:0 "코민테른은 전 세계를 부르주아로부터 해방하고, 적화하기 위해 뭉친 국제기구입니다. 우리도 코민테른에 참가해 그들의 대의와 함께할 것입니다."
 KOR_soviet_economic_aid:0 "소련의 경제원조"
 KOR_soviet_economic_aid_desc:0 "소련은 오랫동안 그 넓은 국토와 근면한 국민성으로 눈부신 발전을 일으킨 사회주의 국가들의 맹주입니다. 우리는 그들에게 극동 사회주의의 최전선인 우리에 대한 경제적 투자를 요구할 것입니다."
 KOR_request_for_Siberia:0 "동시베리아 양도요청"
 KOR_request_for_Siberia_desc:0 "소련과 우리는 이미 혈맹이자, 소련은 서조선이고 우리 조선은 동소련이라 해도 과언이 아닐 정도로 한 몸이나 다름 없습니다. 따라서 우린 모스크바에서 직접 관장하기 힘든, 동 시베리아의 행정을 공식적으로 서울로 이관해, 우리가 동 시베리아를 대신 '관리'해주는 안을 제안해야 합니다."
 KOR_preparing_for_asian_liberation:0 "아시아 해방 준비"
 KOR_preparing_for_asian_liberation_desc:0 "아시아는 오랫동안 봉건주의자, 제국주의자들에 의해 너무 많은 고통을 받았습니다. 우리는 아시아 사회주의의 맹주를 선언해, 아시아 전역의 적화를 위해 아시아 곳곳의 공산당들을 후원해야 합니다."
 KOR_support_the_japanese_communist_party:0 "일본공산당 지원"
 KOR_support_the_japanese_communist_party_desc:0 "일본 공산당의 동지들은 봉건주의자들의 \"치안 유지법\"으로 인해 무자비한 탄압 속에 고생하고 있었습니다. 이제 우린 일본의 공산주의 형제들을 지원할 것입니다."
 KOR_support_the_chinese_communist_party:0 "중국공산당 지원"
 KOR_support_the_chinese_communist_party_desc:0 "중국 공산당의 동지들은 대장정 이후 완전히 지친 상태로 포위되어 있습니다. 우린 그들을 도와, 중국대륙 적화를 위해 힘을 합쳐야 합니다!"
 KOR_overthrow_of_japanese_feudalist:0 "일본 봉건주의자 공격"
 KOR_overthrow_of_japanese_feudalist_desc:0 "이제 우리는 일본 제국주의자들의 사악한 통치로 부터 일본 인민을 해방시킬 때가 되었습니다. 우리는 일본의 봉건주의자들을 몰아내고, 일본 열도를 해방시킬 것입니다!"
 KOR_no_cpc_no_new_china:0 "공산당 없인 신중국도 없다"
 KOR_no_cpc_no_new_china_desc:0 "중국 대륙은 그동안 군부 독재자들과 군벌들에게 오랫동안 고통받았습니다. 우리는 우리의 동지 중국 공산당과 함께, 중화대륙 전체를 해방시킬 것이며, 공산당 없인 신중국은 만들어 질 수 없습니다!"
 KOR_attack_the_western_imperialists:0 "서구 자본가 공격"
 KOR_attack_the_western_imperialists_desc:0 "이제 동아시아 주요국들을 모두 해방시켰으니, 불쌍한 아시아 식민지의 주민들을 착취하는 제국주의자들의 차례입니다. 우리는 그들을 몰아내 아시아 전역을 해방할 것입니다."
 
#politic - democratic
 KOR_preemptive_strike_on_manchuria_tt:0 "만주국과 전쟁에 돌입할 시 만주국이 일본의 괴뢰국일 경우, 세력 미가입 상태에서 단독으로 만주 전역을 점령하면 일본과 평화협상을 결정할 수 있습니다."
 KOR_construction_syngman_rhee_line_tt:0 "한-만 국경선에 2단계의 요새를 추가합니다."
 KOR_syngman_rhee_line_final_fortifications_tt:0 "한-만 국경선에 2단계의 요새를 추가합니다."
 KOR_port_fortification_tt:0 "인천, 부산, 남포, 해주, 원산, 목포, 군산에 3단계의 해안 요새를 추가합니다."
 KOR_minshu_ikki_tt:0 "우리의 후원을 받는 일본의 민주주의자들이 내전을 시작하며, 우린 그들을 도와 자동으로 참전합니다."
 KOR_overthrow_the_chinese_dictators_tt:0 "우리의 후원을 받는 중국의 민주주의자들이 산둥반도에서 독립을 선언하며, 우리는 모든 중국 군벌에 대한 전쟁명분을 얻습니다."
 
 KOR_democracy_advance_forward:0 "전진하는 민주주의!"
 KOR_democracy_advance_forward_desc:0 "비록 대공황과 대구 사회화 운동은 우리 국민들에게 민주공화정에 대한 큰 실망과 의구심을 남겼지만, 우리는 이 길을 포기해서는 안됩니다. 우리 대한은 아시아 최초이자 유일의 민주공화국으로서, 아시아 자유의 등불을 꺼트려선 안됩니다."
 KOR_president_kim_gu:0 "김구 대통령"
 KOR_president_kim_gu_desc:0 "자유당의 이승만은 대공황과 대구 사회화 운동을 대처하는데 끔찍한 모습을 보였습니다. 이제 그는 그만 민주공화국의 수호를 위해 다음 대선때는 나오지 말아야 하며, 자유-독립당의 차기 대선후보는 독립당의 영수이자 현 부통령인 김구가 출마해야 합니다."
 KOR_syngman_rhee_reelected:0 "이승만 재선"
 KOR_syngman_rhee_reelected_desc:0 "이승만 대통령이 대통령직에서 물러난다는 것은 어불성설입니다! 대통령 각하께서는 무술민변때부터 대한민국의 국부이자 초대 대통령이신 서재필 전 대통령과 함께 전제군주와 일본에 맞서 싸운 투사입니다. 대통령께서는 다음 대선때도 자유-독립당의 공식 대선후보로 출마할 것입니다."
 KOR_independent_party_in_power:0 "독립당 단독집권"
 KOR_independent_party_in_power_desc:0 "자유-독립당 연정은 최악의 선택이였습니다. 연정은 비록 민주주의를 수호하기 위한 어쩔 수 없는 선택이였지만, 국민들에게 큰 실망을 주었으며, 대공황과 대구 사회화 운동에서 최악의 처신을 한 이승만에게 면죄부를 주기 위한 것으로 이용되었을 뿐입니다. 이제 우리 독립당은 자유당에서 다시 분당되어 독자행동을 할 것입니다."
 KOR_cooperation_with_the_jaebeol:0 "재벌과의 협력"
 KOR_cooperation_with_the_jaebeol_desc:0 "비록 대공황으로 인해 대부분의 기업과 공장들이 파산했지만, 일부 재벌들은 그 여파를 버티고 살아남는데 성공했습니다. 우리는 재벌들에게 소소한 특혜를 주어 그들의 능력을 조국을 위해 발휘하도록 배려해야 합니다."
 KOR_liberal_party_sole_power:0 "자유당 단독집권"
 KOR_liberal_party_sole_power_desc:0 "비록 지금은 자유-독립당 연정의 이름 아래 함께하고 있지만, 독립당놈들은 우리 자유당과는 물과 기름의 관계입니다. 이제 대공황으로부터 슬슬 회복중이고, 대구 사회화 운동의 여파도 슬슬 줄어들고 있으니 이제 그만 독립당과의 협력관계를 재고해야 합니다."
 KOR_democracy_is_our_strength:0 "민주주의는 우리의 힘"
 KOR_democracy_is_our_strength_desc:0 "비록, 대공황 이후 우리 정부는 국민들에게 실망스러운 모습만 보여주었지만, 자유와 민주주의의 가치야 말로 우리 조국의 진정한 힘입니다. 우리는 이 점을 강조해 국민들에게 용서와 협력을 구해야 합니다."
 KOR_ban_extremism:0 "극단주의 금지"
 KOR_ban_extremism_desc:0 "대공황과 대구 사회화 운동을 계기로 이 땅에는 양극단주의 폭력 단체들과 정치깡패들이 독버섯처럼 우후죽순으로 생겨났습니다. 우리는 정치에 혼란만 불러오는 이러한 폭력 정치단체들에게 관용없이 준엄한 법의 철퇴를 내리고, 이들을 해산시켜야 합니다."
 KOR_strengthen_government_support:0 "정부 지원 강화"
 KOR_strengthen_government_support_desc:0 "우리는 대한민국 국민의 가치와 이상을 이루기 위해 다음 20년을 위한 계획을 구상했습니다. 민주주의 대한민국을 앞으로도 지켜나갈 가치가 충분하다는 것을 국민들에게 보여준다면, 대한민국은 다시 하나되어 일어날 수 있을 것입니다."
 KOR_national_unity:0 "조국 단결"
 KOR_national_unity_desc:0 "이제 우리의 조국은 하나로 단결해 다시 일어날 준비가 끝났습니다. 우리는 아시아 최초의 민주공화국이며, 우리의 위대한 역사가 앞으로도 계속 이어지는 한, 우리의 후손들 역시 민주주의를 수호하고 발전해 나갈 것입니다."
 KOR_expend_military_budget:0 "군 예산안 증액"
 KOR_expend_military_budget_desc:0 "1906년 한일러 전쟁 종전 후 계속된 평화와 대공황으로 인한 군축으로 인해 우리 조국의 아들들인 대한민국 국군은 그동안 그들을 위한 충분한 예산과 대우를 받을 수 없었습니다. 이제 정부가 다시 안정되어가고 전 세계적으로 긴장이 고조되어가는 가운데, 이러한 불행은 이제 끝나야 합니다."
 KOR_homeland_defence_special_act:0 "향토방위특별법 제정"
 KOR_homeland_defence_special_act_desc:0 "우리의 적들은 감히 어리석게도, 우리 자유 대한에 침공을 감행했습니다. 우리 국민들 중 전쟁을 위해 태어난 사람은 단 한사람도 없지만 우리 국민들은 고구려-수전쟁, 나당전쟁, 대몽항쟁, 임진왜란, 정묘호란, 병자호란, 한일러전쟁때 그랬던 것처럼 마지막 한명까지 하나되어 우리의 자유를 지키기 위해 저 침략의 무리들을 불지옥으로 보내줄 준비가 되었습니다!"
 KOR_the_vanguard_of_asian_democracy:0 "아시아 민주주의의 선봉"
 KOR_the_vanguard_of_asian_democracy_desc:0 "우리 대한민국은 아시아 최초의 민주공화국이자 현재 아시아 유일의 민주공화국입니다. 비록 방관하는 미국과 자기들 문제로 바쁜 유럽은 우릴 도와줄 것 같지는 않지만, 우리는 아시아 민주주의의 선봉으로서 혼자서라도 자유와 민주주의의 가치를 아시아 전역으로 전파해야 합니다."
 KOR_stop_moderate_diplomacy:0 "온건외교 중단"
 KOR_stop_moderate_diplomacy_desc:0 "한일러 전쟁의 종결과 포츠머스 조약의 채결 이후 성립된 포츠머스 체제는 사실상 유명무실화 된 우리의 영세중립국 지위와 일본의 만주국 건설, 그리고 이에 대한 국제연맹의 침묵으로 인해 붕괴되었으며, 이제 더이상 외교적 해법은 통하지 않는 다는 것이 명확하게 들어났습니다. 따라서 우리는 우리의 의지를 관철하고 민주주의를 수호하기 위해 더 과감한 외교정책을 할 필요가 있습니다."
 KOR_war_on_pacifism:0 "평화주의와의 전쟁"
 KOR_war_on_pacifism_desc:0 "일부 국민들은 아직도 우리의 영세중립국 지위가 국제법상으로 보장되고 있으며, 우리의 군비증강이 침략전쟁의 부정이 명문화 되어있는 대한민국 헌법에 반하고 일본을 자극할 것으로 여기며 크게 반대하고 있습니다. 그러나, 대화는 강자의 특권이며 강력한 힘이야 말로 국제정치의 유일한 법입니다. 따라서 우리는 국내의 반전주의 운동과 먼저 '전쟁'을 벌여야 합니다."
 KOR_claiming_northern_conquest:0 "북벌론"
 KOR_claiming_northern_conquest_desc:0 "이제 우리의 자유와 독립, 민주주의를 지키기 위해 우리는 우리에게 육로로 직접적인 위협이 되는 적, 만주국에 대한 전시 선전을 시작할 것입니다."
 KOR_preemptive_strike_on_manchuria:0 "만주 선제타격"
 KOR_preemptive_strike_on_manchuria_desc:0 "이제 운명의 시간이 되었습니다. 우리는 한일러 전쟁 이후 상실한 간도땅을 회복하고, 우리 조국을 사사건건 위협하는 만주국과 그 뒤를 봐주고 있는 일본과의 전쟁을 시작할 것입니다. 이것은 침략전쟁이 아닌 자위전쟁이자 예방전쟁으로 공표될 것이며, 선전포고문 역시 국제법에 따른 관례대로 상대국에 전달될 것입니다. 대한민국 만세. 대한민국 국군 만세."
 KOR_rok_roc_alliance:0 "한중동맹"
 KOR_rok_roc_alliance_desc:0 "일본의 확장주의적 행보는 만주사변때 이미 선을 넘었습니다. 그들은 아시아 전역을 정복할 욕심을 숨기지 않고 있으며, 만주의 다음은 우리 대한이 될 것입니다. 비록 중국과의 동맹은 지난 한일러 전쟁 이후 잃은 간도 및 우리의 선조인 고구려와 발해가 지배하던 만주를 영구히 포기하는 결정이 되겠지만, 우리는 우리의 생존을 위해 중국과의 동맹을 고려해야 합니다."
 KOR_prepare_for_the_next_war:0 "다음 전쟁의 준비"
 KOR_prepare_for_the_next_war_desc:0 "대한민국 헌법 제1장 5조에 의거해, 우리는 우리 장병과 국군이 헌법을 어기게 하면서 침략전쟁을 할 순 없습니다. 그러나 세계정세는 불안정해가고 있고, 일본과 만주국, 소련의 움직임이 심상치 않으며, 우리의 영세중립국 지위 역시 사문화 되었으니 우리는 조국을 지키기 위한 준비를 시작해야 합니다."
 KOR_construction_syngman_rhee_line:0 "홍범도선 건설"
 KOR_construction_syngman_rhee_line_desc:0 "지난 유럽에서의 대전쟁은 현대전에선 방어자가 유리하며, 강력한 화력의 지원을 받는 튼튼한 요새선은 적에게 큰 출혈을 강요한다는 교훈을 주었습니다. 이에 우리는 우리의 북방 국경에 프랑스의 마지노선, 체코슬로바키아의 주데텐란드 요새선, 벨기에의 에반-에마엘 요새선과 같은 요새화를 시작할 것입니다."
 KOR_syngman_rhee_line_final_fortifications:0 "홍범도선 최종 요새화"
 KOR_syngman_rhee_line_final_fortifications_desc:0 "홍범도선의 요새화는 순조롭게 진행중이며, 이미 압록강과 두만강이 자연 혜자의 역할을 해주는 덕분에 충분히 강합니다. 그러나, 우리는 완벽한 전쟁 억제를 위해 요새화를 더 진행할 것입니다."
 KOR_port_fortification:0 "항구 요새화"
 KOR_port_fortification_desc:0 "이제 북쪽 국경의 요새화가 완료되었으니 다음은 해안요새를 건설할 차례입니다! 우리 해군은 일본제국 해군에 절대적으로 열세이기 때문에 항구 역시 강력한 요새화를 해서 강력한 함포사격의 지원을 받는 일본의 상륙군들을 막을 준비를 해야 합니다."
 KOR_call_up_the_rokrf:0 "국민방위군 소집"
 KOR_call_up_the_rokrf_desc:0 "우리는 우리보다 몇배는 강대한 적을 상대로 한민족 역사상 최악의 전쟁을 치르는 중입니다. 우리의 병력은 적들에 비해 머릿수에서 열세이기에, 체력 문제로 정규군에는 부적합한 여성과 제2국민역, 중장년층들부터 지원자를 받아 지역을 방어할 유격대를 편성할 것입니다. 그들은 정규군보단 부족하겠지만, 과거의 대몽항쟁, 임진왜란, 그리고 한일러 전쟁 당시의 의병들처럼 고향과 강토를 지키기 위해 억척스럽게 싸울 것입니다!"
 KOR_join_the_allie:0 "연합국 가입"
 KOR_join_the_allie_desc:0 "워싱턴 해군 군축조약 이후의 영일동맹의 파기에 따라, 이제 영국과 일본은 중국의 이권을 두고 대립하는 가상적국입니다. 우리는 영국과 접촉해서 일본에 대한 견제와 유럽전선에 대규모 육군의 파병을 약속해 그들의 동맹에 들어갈 수 있을지를 물어볼 수 있습니다."
 KOR_establish_ofn:0 "자유국가기구 창설"
 KOR_establish_ofn_desc:0 "대공황과 파시즘의 궐기로 세계는 불타오르고 있으며, 우리와 미국의 힘만으로는 자유세계를 지키는 것은 역부족입니다. 따라서, 우리는 이제 한미상호방위조약을 새로운 국제군사동맹으로 대체하고, 우리와 뜻을 함께할 이들을 이 동맹에 초청할 것을 미국에 제안해야 합니다!"
 KOR_liberation_of_the_europe:0 "유럽의 해방"
 KOR_liberation_of_the_europe_desc:0 "서양의 배불뚝이 백인들은 자신들의 욕심을 위해 아주와 아프리카의 식민지인들에게 고통을 주고 있지만, 그렇다고 그들이 나치독일의 야만적인 폭정아래 있어도 상관없다는 의미는 아닙니다. 우리는 인류의 공적 나치독일에 맞서기 위해 연합국의 대의와 함께 해야 합니다. 물론, 그들은 우리의 대독전 참전을 조건으로 우리 대한의 영구적인 만주 합병 및 영유권을 정식으로 인정해야만 하지만, 그들에겐 선택의 여지가 없습니다."
 KOR_founding_of_the_asian_union:0 "아시아 연합 창설"
 KOR_founding_of_the_asian_union_desc:0 "우리는 일본으로부터 승리를 거두고 만주의 고토를 남김없이 모두 흡수했으며, 이젠 아시아의 새로운 열강으로 거듭났습니다. 이제 우리는 아시아를 해방하기 위한 독자적인 군사조약기구를 창설해서 우리의 이상을 전 세계에 관철시켜야 합니다."
 KOR_invitation_to_independent_asian_countries:0 "아시아 독립국가 초대"
 KOR_invitation_to_independent_asian_countries_desc:0 "우리는 제국주의자들에게 독립을 위협받는 모든 아시아 국가들에게 아시아 연합의 가맹을 제안할 것이며, 우리는 함께 아시아를 해방하고 자유와 민주주의의 가치를 전파해야 합니다."
 KOR_invite_china:0 "중국 초대"
 KOR_invite_china_desc:0 "아편전쟁 이후, 중국은 서구 열강의 침탈 아래에 진통하고 있습니다. 우리는 아시아 연합의 이름으로, 중국에게 우리의 동맹에 가입할 것을 제안할 것입니다."
 KOR_support_for_democracy_in_china:0 "중국 민주인사 지원"
 KOR_support_for_democracy_in_china_desc:0 "중국의 반식민지화는 서구 열강들의 잔악한 경제적 침탈도 원인이지만, 더욱 본질적인 이유는 그들의 민주주의가 제대로 작동하지 않으며, 군벌과 군사독재자들에 의해 돌아가는 국정 때문인 것이 더 큽니다. 우리는 중국의 뜻을 품은 민주인사들을 후원해 이들에 대한 저항을 선동할 것입니다."
 KOR_overthrow_the_chinese_dictators:0 "중국 독재자 축출"
 KOR_overthrow_the_chinese_dictators_desc:0 "이제 우리 군은 중국으로 출병해 중국 국민들을 억압하는 극악무도한 독재자 장개석과 그 외 떨거지 군벌무리들을 소탕하는 '특별군사작전'을 실시할 것입니다. 이미 아시아 연합군은 중국과의 국경선으로 속속 집결하고 있으며, 우리 군이 한중국경선을 넘는 것과 동시에, 산둥반도에서는 우리의 후원을 받은 봉기가 발생할 것입니다. 아시아 연합 만세! 아시아 민주주의 만세!"
 KOR_invite_japan:0 "일본 초대"
 KOR_invite_japan_desc:0 "놀랍게도, 일본은 지금 민주주의자들에 의해 지배되고 있으며, 그들의 민주주의 역시 정상적으로 작동하고 있습니다. 비록, 한일러 전쟁 이후 양국의 감정은 최악에 가깝지만, 그래도 저들의 민주주의가 진심이라면, 우리는 정중하게 그들을 아시아 연합에 초대해 우리와 함께할 의사가 있는지를 물어봐야 합니다."
 KOR_support_for_democracy_in_japan:0 "일본 민주인사 지원"
 KOR_support_for_democracy_in_japan_desc:0 "다이쇼 데모크라시의 종결 이후, 일본인들은 군국주의와 봉건주의의 폭정 아래 끔찍한 지배를 받고 있습니다. 자유와 민주주의를 사랑하는 아시아 연합의 앞에 이러한 만행은 용납될 수 없으며, 우리는 자유를 사랑하는 일본인들을 위해 비밀리에 저항에 사용할 물자와 무기를 지원할 것입니다."
 KOR_minshu_ikki:0 "민슈 잇키"
 KOR_minshu_ikki_desc:0 "이제 우리 군과 아시아 연합군은 자유를 사랑하는 일본인들의 해방을 위해 일본에 대한 전면 공격을 개시할 것입니다. 우리의 공격과 동시에, 일본의 민주주의자들은 자신들의 조국을 천황과 군인들로부터 해방하기 위한 궐기를 시작할 것이며, 우리 군과 아시아연합군은 자유를 사랑하는 일본국민들의 도움을 받아 일본의 봉건주의자와 군국주의자들을 모두 역사의 쓰레기통 속으로 넣어버릴 것입니다!"
 KOR_asian_independence_support:0 "아시아 독립 지원"
 KOR_asian_independence_support_desc:0 "제국주의의 시대가 끝나고 이제는 독립의 시대가 오고 있지만, 배불뚝이 유럽인들은 시대의 흐름을 읽지 못하고 여전히 아시아 곳곳의 자신들의 식민지가 자신들의 영원한 안방이라고 착각하고 있습니다. 우리 아시아 연합은 이를 두고보고 있지만은 않을 것이며, 백인들에게 핍박받는 불쌍한 아시아의 국민들을 위해 비밀리에 그들을 위한 망명정부를 서울에 세워 지원할 것입니다."
 KOR_expelling_european_imperialists:0 "유럽 제국주의자 축출"
 KOR_expelling_european_imperialists_desc:0 "유럽의 제국주의자들은 자신들이 의회민주주의를 추종하고 파시스트에 대한 성전을 벌리고 있다고 주장하고 있지만, 실상은 그들의 전쟁을 위해 식민지 유색인종의 피와 땀, 눈물을 착취하고 있으며, 그들의 민주주의는 오로지 그들 백인 족속만을 위한 가식일 뿐입니다. 우리는 이러한 가식을 종말시키고 아시아의 진정한 자유를 위한 성전을 시작할 것입니다. 아시아 연합 만세! 아시아 독립 만세!"
 KOR_death_to_the_fascists:0 "파시스트들에게 죽음을"
 KOR_death_to_the_fascists_desc:0 "어리석은 파시스트들은 우생학을 신봉하고 자신들 백인이 우리 황인보다 더 우월한 족속이라고 착각하고 있으며, 전 세계를 자신의 것으로 삼으려는 헛된 야망에 사로잡혀 있습니다. 이들을 참교육 하는 것은 우리 자유 대한과 아시아 연합의 마땅한 사명입니다."
 KOR_end_of_the_red_plague:0 "붉은 역병의 종말"
 KOR_end_of_the_red_plague_desc:0 "소비에트 연방은 자신들이 자본가들의 착취로부터 노동자들을 해방해 지상 낙원을 건설하겠다고 선동하고 있지만, 실상은 소수의 엘리트 볼셰비키들에 의해 돌아가는 과두정치이자, 자국내 소수민족을 억압할 뿐인 공산주의의 탈을 쓴 붉은 제국주의자 이상도 이하도 아닙니다. 이 붉은 역병을 청소하는 것은 우리 자유 대한과 아시아 연합의 의무입니다."
 KOR_korea_in_the_world:0 "세계 속의 대한민국"
 KOR_korea_in_the_world_desc:0 "뭉치면 살고, 흩어지면 죽음 뿐입니다. 비록 대공황과 파시즘의 발흥 이후 전 세계가 불타오르고 있지만, 우리는 책임있는 민주국가이자 지구촌의 한 일원으로서 우리와 같은 생각을 가지고 있는 자유 우방들과 힘을 합쳐 이 위기의 시대를 이겨내야 합니다!"
 KOR_korean_volunteer_corps:0 "대한의용군단"
 KOR_korean_volunteer_corps_desc:0 "대공황과 파시즘의 궐기 이래로, 세계 각국에서 크고 작은 이념대립이 일어나고 있습니다. 우리는 그 갈등이 우리 국가 내까지 흘러들어오기 전에, 우리의 독립에 도움이 될 세력을 과감하게 후원하고 그들이 승리자가 되게 해야 합니다."
 KOR_trust_in_the_west:0 "서쪽을 믿자"
 KOR_trust_in_the_west_desc:0 "1919년 대전쟁의 종결과 베르사유 조약의 체결 이후, 지금 이 세계의 질서를 유지하는 것은 대영제국과 프랑스 제3공화국 이 두 강대국입니다. 이 두 강대국은 세계질서의 현상유지를 위해 동서분주하고 있으니, 우리는 이들과 협조해 조국의 독립과 극동의 평화를 지켜내야 합니다!"
 KOR_contect_with_america:0 "미국과의 접촉"
 KOR_contect_with_america_desc:0 "이승만 대통령께서는 한일러 전쟁 종전 이후, 미국으로 건너가 프린스턴 대학교에서 수학하여 정치학 박사학위를 받았으며, 우드로 윌슨이 그의 지도교수였던 덕분에 미국 민주당에 강력한 인맥을 가지고 있습니다. 우리는 이 점을 활용해 미국과 함께 자유 민주주의를 수호할 새로운 군사동맹을 채결하는 것을 시도해 볼 수 있습니다..."
 KOR_rok_us_mutual_defense_treaty:0 "한미상호방위조약"
 KOR_rok_us_mutual_defense_treaty_desc:0 "미국은 만주사변 이후, 태평양에 이권을 가진 국가들 중 일본의 확장주의적 모험에 대해 가장 크게 경계하고 있는 국가이며, 그들의 영역인 필리핀을 지키기 위해 일본을 견제할 우방을 찾고 있습니다. 비록, 대공황 이후 미국의 고립주의는 심화되고 있지만, 그들과의 상호방위조약 채결은 우리에게나 그들에게나 제안해 볼 가치가 있습니다."
 rok_us_alliance_formed_flag:0 "한미상호방위조약이 체결됨."
 KOR_expand_merchant_marine:0 "상선 추가 징발"
 KOR_expand_merchant_marine_desc:0 "비록, 우리가 유럽전선 파병을 대가로 영국과 동맹을 맺었지만, 애석하게도 우리의 수송선 숫자로는 유럽전선에 보낼 한국군과 그들을 위한 군수물자를 실을 수송선이 부족합니다. 따라서 우리는 우리의 동맹국들에게 수송선 대여를 요청하고, 국내 해운기업 소유의 화물선들을 국유자산으로 징발해야 합니다."
 KOR_learn_from_french_army:0 "샤쇠르-알팡 교관초빙"
 KOR_learn_from_french_army_desc:0 "파란색 베레모와 특유의 등산지팡이로 유명한 프랑스의 정예 산악병 샤쇠르-알팡(Chasseurs-Alpins)은 지난 대전쟁에서 산악전 능력으로 그 악명을 떨었습니다. 한반도는 70%가 산지이기 때문에 우리 군도 그들을 교관으로 초빙해 한국판 샤쇠르-알팡을 육성해야 하며, 산악병이 아닌 일반 보병들에게도 그들의 산악전 능력에서 배울 점이 많을 것입니다."
 KOR_usfk:0 "주한미군 배치"
 KOR_usfk_desc:0 "한미상호방위조약에 의거해서, 우리는 미국의 독립보장을 받고 있지만, 미국 국내의 고립주의자들은 언제든 이 약속을 저버릴 위험이 있습니다. 또한, 미육군 역시 향후 일본과의 전쟁에서의 교두보 역할을 할 한국에 미리 군대를 주둔시키기를 원하고 있으니, 우리는 주한미군의 배치를 허용해 우리의 안보에 도움을 받고, 또한 그들을 미국의 한국 독립보장 지속을 위한 인계철선으로 삼을 수 있습니다."
 KOR_usfk_tt:0 "3개의 주한미군 사단을 지원군으로 얻습니다."
 KOR_lend_lease_from_usa:0 "미국의 경제원조"
 KOR_lend_lease_from_usa_desc:0 "지난 한미상호방위조약 체결 이후, 한국과 미국 사이의 관계가 더 끈끈해지며 우리는 전쟁 시기에 상호 경제원조를 보장 할 수 있을 것입니다."
 KOR_british_naval_ship:0 "영국 구축함 구매"
 KOR_british_naval_ship_desc:0 "우리 군 장병들을 인도양과 수에즈 운하를 거쳐 유럽까지 안전하게 이송하기 위해, 우리는 수송선을 호위할 해군 순항전단이 필요하지만, 우리의 빈약한 해군력으로는 영해를 지킬 해군 이외의 함선을 차출하기가 곤란합니다. 따라서 우리는 영국에게 우리 원정군을 호위할 구축함들을 발주해야 합니다."
 KOR_allies_military_aid:0 "연합국 군사원조"
 KOR_allies_military_aid_desc:0 "유럽에 파병될 우리 군 장병들에게는 더 양질의 중화기가 필요합니다! 따라서 우리는 우리의 동맹들에게 그들을 위해 먼 타지에서 피를 흘릴 우리 군을 무장시킬 무기공장을 지어줄 것을 부탁할 것입니다."
 KOR_katusa:0 "KATUSA"
 KOR_katusa_desc:0 "주한미군의 배치 이후, 주한미군사령관은 우리 대통령께 병력의 부족을 토로하며, 우리 한국의 젊은이들을 임시로 미군부대에 배치하는 것을 골자로 하는 구두 협약을 제안했습니다. 이 협약은 우리 장병들 중 일부를 주한미군 부대에 배치하는 것을 골자로 하며, 그들은 미군과 함께 싸우게 될 것입니다. 이는 우리 군에게 미군의 선진 교리와 장비, 기술을 바로 옆에서 접할 좋은 기회이니 마다해서는 안됩니다!"
 KOR_invite_macarthur:0 "맥아더 초청"
 KOR_invite_macarthur_desc:0 "이승만 대통령의 미국 유학시절 친우이자, 제13대 미육군 참모총장을 지낸 맥아더 장군은 루스벨트와의 갈등으로 인해 미육군에서 퇴역하고 현재 필리핀에서 필리핀군 원수직을 수행하고 있습니다. 그와 같은 뛰어난 군인은 필리핀군보단 우리 대한민국 육군에 더 필요로 합니다! 따라서 우리는 미국 정부에 맥아더를 한국으로 보내달라는 요청을 해야 합니다."
 KOR_eef_command:0 "유럽원정군사령부 창설"
 KOR_eef_command_desc:0 "이제 모든 준비가 끝났습니다! 우리는 우리 군을 유럽전선으로 파병할 준비가 끝났으며, 물자와 장비들은 이미 부산항과 인천항에서 유럽으로 보내질 준비가 되었습니다. 단군이래 최대규모, 최장거리 군사원정인 이번 작전을 위해, 우리는 본토의 국방부 대신, 현지에서 주유럽한국군 전체를 통솔할 유럽원정군사령부를 창설하고, 그들에게 재량을 부여해야 합니다."
 KOR_forced_decolonization:0 "탈식민의 물결"
 KOR_forced_decolonization_desc:0 "지난 대전쟁은 영국과 프랑스 중심의 협상국이 승리했지만, 승자인 그들 역시 이제는 계속되는 전쟁으로 노쇠하고 힘을 잃어가고 있으며, 동방식민지에 대한 통제권이 날이 갈수록 약화되가고 있습니다. 이젠 그들에게 그만 아시아 식민지에게 자유를 줄 때라는 것과, 그들을 진정한 민주주의의 빛으로 이끌 수 있는 것은 우리 대한이라는 것을 말할 때입니다."
 KOR_freedom_to_indochina:0 "인도차이나에 자유를"
 KOR_freedom_to_indochina_desc:0 "프랑스령 인도차이나는 막대한 쌀과 노동인구를 가진 땅입니다. 우리는 이들에게 자유를 주고, 이들의 힘을 빌려야 합니다!"
 KOR_freedom_to_malaysia:0 "말레이시아에 자유를"
 KOR_freedom_to_malaysia_desc:0 "영국령 해협식민지는 서양과 동양간의 최대 무역로인 말라카 해협을 통제하는 요충지입니다. 우리는 이들에게 자유를 주고, 이들의 힘을 빌려야 합니다!"
 KOR_freedom_to_philippines:0 "필리핀에 자유를"
 KOR_freedom_to_philippines_desc:0 "필리핀인들은 일찍이 스페인에게서 독립해 기독교와 민주주의를 스스로 이루었지만 미국에 의해 식민화 되었습니다. 우리는 이들에게 자유를 주고, 이들의 힘을 빌려야 합니다!"
 KOR_freedom_to_indonesia:0 "인도네시아에 자유를"
 KOR_freedom_to_indonesia_desc:0 "네덜란드령 동인도에는 막대한 양의 고무와 석유가 나오며 태평양과 인도양을 분리하는 요충지입니다. 우리는 이들에게 자유를 주고, 이들의 힘을 빌려야 합니다!"
 KOR_abcdfk_blocade:0 "ABCDFK 포위망"
 KOR_abcdfk_blocade_desc:0 "지하자원이 부족한 일본은 침략전쟁을 위한 군수물자 생산에 사용할 원자재의 대다수를 수입에 의존하고 있습니다. 우리 자유 우방들이 일본에 대한 동시 금수조치를 취한다면, 그들의 전쟁수행 역량을 크게 깍을 수 있을것입니다."
 KOR_pressure_on_thailand:0 "시암에 압력 행사"
 KOR_pressure_on_thailand_desc:0 "우리와 함께 아시아에서 독립을 유지중인 몇안되는 국가 중 하나인 시암은 입헌군주정 국가이지만, 친일파 파시스트 장군 쁠랙 파분송크람에 의해 언제든 일본의 동맹국이 될 위험이 있습니다. 우리는 비밀리에 시암의 민주주의자들을 후원해 그들이 오판을 할 수 없게 해야 합니다."
 KOR_freedom_to_ryukyu_and_ainu:0 "류큐와 아이누의 해방 보장"
 KOR_freedom_to_ryukyu_and_ainu_desc:0 "일본이 향후에 대륙을 향한 야망을 더 이상 꿈꾸지 못하게 하려면 그들을 영구히 분할해 그들의 힘을 깍아야 합니다. 우리는 훗날 유사시 일본을 분할하기 위해 일본 내 소수민족 인사들과 비밀리에 접촉할 것입니다."
 KOR_end_the_threat:0 "위협의 끝"
 KOR_end_the_threat_desc:0 "극동의 평화를 막기 위한 우리의 외교적 노력에도 불구하고, 우리와 일본간의 타협은 불가능했습니다. 이제 외교가 아닌, 무력으로 그들을 막는 것 외에는 다른 선택의 여지가 없습니다."
 KOR_absorb_the_allies:0 "연합국 흡수"
 KOR_absorb_the_allies_desc:0 "영국주도의 연합국은 자유를 지키기 위한 여러 국가들의 모임으로 그들과 우리의 가치관은 크게 다르지 않습니다. 우리는 연합국 회원국들에게 자유국가기구와 함께할 것을 제안할 것입니다."
 KOR_securing_the_former_commonwealth:0 "구 영연방 확보"
 KOR_securing_the_former_commonwealth_desc:0 "영국의 정치적 변화 이후, 영국의 자치령들은 영국과의 연고를 끊고 이제 독자적인 행동을 시작했습니다. 우리는 그들을 초대해 그들과 함께 힘을 합쳐야 합니다!"
 KOR_torch_of_the_freedom:0 "멸공의 횃불"
 KOR_torch_of_the_freedom_desc:0 "아름다운 이 강산을 지키는 우리 자유국가기구는 모두 하나의 목적 - 자유, 민주, 반공 - 하에 사상적으로 더욱 단결해야 합니다."
 KOR_torch_of_the_freedom_tt:0 "모든 동맹국들에게 365일간 멸공의 횃불 국민정신을 추가합니다."
 KOR_protect_benelux:0 "베네룩스 보호"
 KOR_protect_benelux_desc:0 "저지대 국가들은 유럽으로의 관문이자, 지난 대전쟁 당시에도 독일의 큰 위협을 받았습니다. 우리는 이 국가들에게 정중히 안전보장과 자유국가기구 가입을 제안할 것입니다."
 KOR_protect_finland:0 "핀란드 보호"
 KOR_protect_finland_desc:0 "북유럽의 약소국 핀란드는 소련에게 큰 위협을 받고 있습니다. 우리는 자유를 갈망하는 핀란드인들을 정중하게 보호와 자유국가기구 가입을 제안할 것입니다."
 KOR_crash_the_nazis:0 "국가사회주의 척결"
 KOR_crash_the_nazis_desc:0 "독일의 국가사회주의자들은 자신들이 공산주의와는 다르다고 주장하지만, 그들의 경제정책은 명백히 붉은 냄새가 나며, 그들의 주요 정부인사중 상당수는 공산주의 운동 투신경력을 가지고 있습니다. 우리는 이 '변종공산주의자'들 역시 다른 공산주의자들과 '평등하게' 대할 것입니다."
 KOR_hunt_the_bear:0 "곰 사냥"
 KOR_hunt_the_bear_desc:0 "러시아 혁명으로 새워진 소련은 전 세계 공산주의의 총 본산입니다. 이들을 척결하지 않는 한, 이 지구상에서 공산주의로부터 안전한 곳은 존재할 수 없습니다."
 
#politic - fascism
 KOR_fasci_civil_war:0 "국가재건최고회의에 소속된 지휘관들이 지휘하는 부대들이 비밀리에 서울에 집결해서 쿠데타를 시도합니다."

 KOR_empowering_the_nrsc:0 "국가재건최고회의에 힘을!"
 KOR_empowering_the_nrsc_desc:0 "대공황과 대구사회화운동 이후, 공화국은 명백하게 위기에 처했습니다. 우리는 더 이상 문민 정치인들에게 조국의 운명을 맡길 수 없습니다. 조국수호의 선봉인 국군, 그리고 군내 사조직 국가재건최고회의야말로 위기에 처한 조국을 구원할 유일한 해답입니다."
 KOR_gathering_the_farright_in_the_military:0 "군내 극우인사 포섭"
 KOR_gathering_the_farright_in_the_military_desc:0 "대공황 이후 실시된 군 감축으로 수많은 능력있는 군인들이 강제 전역처리 되었으며, 현역 군인들 중에서도 현 대한민국에 불만을 품은 의로운 군인들이 많이 있습니다. 우리는 이들을 모두 포섭하고, 국가재건최고회의에 가입시켜야 합니다."
 KOR_establishment_of_the_national_salvation_army:0 "을해군란"
 KOR_establishment_of_the_national_salvation_army_desc:0 "이제 때가 되었습니다! 우리 국가재건최고회의는 서울로 진공해 부패하고 무능한 이승만정부와 기성 정치인들을 몰아내고, 이 땅에 진정한 자유와 번영을 가져올 것입니다. 대한민국 만세! 궐기군 만세!"
 KOR_stop_democracy:0 "한국식 민주주의"
 KOR_stop_democracy_desc:0 "서구식 민주주의는 우리와는 맞지 않는 다는 것이 일련의 사태로 완벽하게 증명되었습니다. 이제 우리는, 전국민이 참여하는 대통령 직선제를 기본 골자로 하는 서구식 민주주의 대신, 대통령에 의해 임명받은 '애국자'들이 대통령을 간접선거하는 한국식 민주주의를 실시해야 할 때가 되었습니다."
 KOR_samcheong_re_education_camp:0 "삼청교육대"
 KOR_samcheong_re_education_camp_desc:0 "우리는 서울과 경기도를 기습 점거하는 과정에서, 비록 이승만은 놓쳤지만, 자유-독립당 당사를 점령해 김구, 안창호, 그 외 자유-독립당의 주요 인사들과 경기도의 자유-독립당 권리당원들을 모두 체포하는데 성공했습니다. 이들은 선량한 애국 시민들을 선동하고 이 땅에 혼란을 가져온 주범들이니 단 한명도 남김없이 목숨으로 그 죗값을 치러야 합니다."
 ##KOR_armed_forces_intelligence_command:0 "국군정보사령부"
 KOR_armed_forces_intelligence_command_desc:0 "저주받을 볼셰비키들의 러시아 혁명 이후, 러시아와 국경을 접한 우리의 조국 역시 공산 혁명으로부터 안전하지 않습니다. 따라서 우리는 기존의 군 방첩대를 국군정보사령부로 확대 개편해 불온분자들을 감시해야 합니다."
 KOR_prussia_in_the_far_east:0 "선군주의"
 KOR_prussia_in_the_far_east_desc:0 "한일러 전쟁 종결 이후, 지난 30여년의 평화로 인해 시민들은 군의 노고를 무시하며, 정치인들은 군을 위한 충분한 예산을 배정해주지 않았습니다. 이제 이러한 불행은 끝나야 합니다. 이제 우리 조국은 저 독일의 프로이센처럼, 국가가 곧 병영이요, 병영이 곧 국가인 병영국가로 개편되어야 합니다."
 KOR_taming_the_jaebeol:0 "재벌 길들이기"
 KOR_taming_the_jaebeol_desc:0 "재벌들은 그동안 문민 정치인들에게 빌붙고 정경유착으로 선량한 서민들을 착취해 자신들의 배를 불려왔습니다. 그러나 우리는 쿠데타 과정에서 서울에 있는 재벌들의 본사를 모두 점령했으며, 재벌 회장들은 모두 정보사 안전가옥에 연금되어있습니다. 우리는 이들을 모두 호출해 군사정권에 대한 충성을 강요할 것입니다. 그들은 우리와 한배를 탈지, 아니면 삼청교육대로 갈지를 말입니다."
 KOR_korea_reigns_above_the_world:0 "세계위에 군림하는 대한"
 KOR_korea_reigns_above_the_world_desc:0 "이제 끝났습니다. 이승만은 미국으로 도망쳤고, 자유대한군단과 이승만의 편에 선 군인들은 모두 항복해서 군사재판과 삼청교육대 입소를 기다리고 있으며, 조국을 구하기 위한 우리의 성전을 성공적으로 마쳤습니다. 이제 우리는 대한민국 제2공화국을 선포하고, 철기 이범석 각하께서는 정식으로 대한민국 대통령에 취임하실 것입니다."
 KOR_threelegged_boys:0 "삼족오 소년단"
 KOR_threelegged_boys_desc:0 "퇴폐적인 서구 문화에 오염된 요즘 어린이와 청소년들은 어른들의 말도 안들으며 제멋대로입니다. 우리는 모든 어린이와 청소년들을 '삼족오 소년단'에 의무적으로 가입시키고 이들에게 아버지에 대한 충성, 상관에 대한 충성, 조국에 대한 충성을 가르치고 17세 이상일 경우 바로 군에서 임무를 수행할 수 있도록 기초군사훈련을 시킬 것입니다."
 KOR_anticommunism_agreement_signed:0 "방공협정 서명"
 KOR_anticommunism_agreement_signed_desc:0 "대한민국은 북쪽의 소련, 동쪽의 일본, 북서쪽의 만주국에 의해 위협을 받고 있습니다. 우리는 이러한 외교적 포위를 돌파하기 위해 우리와 같은 반공 애국자들이 집권중인 독일과 이탈리아에게 협력을 요청해야 합니다."
 KOR_memory_of_goguryeo:0 "고구려의 기억"
 KOR_memory_of_goguryeo_desc:0 "고구려는 우리 겨레의 역사상 가장 제국이라 칭할 만한 강력한 국가였습니다. 우리는 고구려의 후예로서 고구려의 영광을 되찾는 것을 사명으로 삼아야 합니다."
 KOR_manchulus:0 "만슐루스"
 KOR_manchulus_desc:0 "고구려의 영광을 되찾는 것을 우리의 지상 과제로 삼은 이래로, 고구려 고토 수복은 우리 국민들의 염원이 되었습니다. 비록 일본의 괴뢰국인 만주국이 이를 좌시하진 않겠지만, 우리의 강력한 군대가 그들을 위협한다면 '평화적으로' 해결할 수 있을지도 모릅니다."
 KOR_demand_primorye:0 "연해주 요구"
 KOR_demand_primorye_desc:0 "만주를 되찾은 이래로 우리의 국력은 놀랍도록 신장되어 가고 있습니다. 이제 우린 러시아에게 한국인들이 많이 살고 있는 연해주 지방을 '국경 조정'차원에서 요구할 것입니다. 그들이 유럽전선에서 안보를 위협받고있는 이상, 그들은 우리와의 양면전선을 피하기 위해 긍정적인 답변을 보낼 수도 있습니다."
 KOR_demands_submission_to_mongolia:0 "몽골에게 복종 요구"
 KOR_demands_submission_to_mongolia_desc:0 "몽골은 칭기즈 칸의 시대가 끝난 이후로 추락하고있는 약소국일 뿐입니다. 따라서 우리가 강력한 군대로 위협한다면, 소련의 안전보장의 의심스러운 이상 우리의 요구에 순순히 따를 것입니다."
 KOR_operation_hyojong:0 "신류 상황"
 KOR_operation_hyojong_desc:0 "저 자칭 '노동자의 낙원이자 혁명의 고향'이라는 소비에트 연방은 그 구역질나는 사상으로 전 세계를 오염시키려 합니다. 우리는 더 이상 이를 좌시하지 않을 것입니다."
 KOR_demand_shandong:0 "산둥반도 요구"
 KOR_demand_shandong_desc:0 "산둥반도는 일찍이 백제가 진출한 무역의 요충지이며, 발전하기 좋은 땅입니다. 우리는 중화민국에게 정중하게 산둥반도 전역의 조차를 요구할 것이며, 그들이 우리의 힘을 두려워 한다면, 이 요구는 순순히 받아들여 질것입니다. "
 KOR_operation_eulji:0 "을지 상황"
 KOR_operation_eulji_desc:0 "중국의 거대한 땅과 자원, 인력은 우리 자유 대한의 번영에 꼭 필요한 거대한 꿀단지입니다. 또한, 중국이 하나로 뭉쳐 발전하게 된다면, 먼 훗날 중국은 우리에 대한 가장 위험한 도전이 될 것입니다. 따라서 우리는 진정한 이 시대의 승리자가 되기 위해 중국을 반드시 장악해야 합니다."
 KOR_fate_of_tibet:0 "티베트의 운명"
 KOR_fate_of_tibet_desc:0 "티베트는 그 험준한 산으로 보호되는 땅이지만, 그들과 같은 약소국은 더 이상 중국이나 인도와 같은 강대국을 상대로 버티기 어렵습니다. 따라서, 우리는 티베트에게 정중하게 '보호'를 제안할 것이며, 그들은 당연히 이에 따라야 합니다!"
 KOR_puppet_mengjiang:0 "몽강 괴뢰화"
 KOR_puppet_mengjiang_desc:0 "우리가 만주국을 성공적으로 흡수한 지금, 몽강인들은 일본의 보호에 의구심을 품고 있습니다. 따라서, 우리는 몽강인들에게 추락하는 일본 대신 상승하는 우리 대한의 '보호'를 받을 것을 제안할 것이며, 그들도 가까이 있는 우리의 뜻에 따를 것입니다."
 KOR_operation_chungmu:0 "충무 상황"
 KOR_operation_chungmu_desc:0 "이제 때가 되었습니다. 일본은 임진왜란, 한일러 전쟁당시 우리의 동포들을 무자비하게 유린한 적이며, 우리가 동아의 진정한 지배자로 등극하기 위해 넘어야 하는 벽입니다. 우리는 이제 정교하게 계획된 일본침공을 시작할 것입니다. 대한민국 만세."
 KOR_fall_of_the_sun:0 "낙일"
 KOR_fall_of_the_sun_desc:0 "우리의 용감무쌍한 국군은 일본열도 전역을 손쉽게 장악했으며, 이제는 일본이 다시는 감히 우리 자유 대한에게 해꼬지를 할 수 없도록 그들의 정신, 긍지, 육체를 모두 더럽힐 것입니다... 우리는 이를 위해 일본을 효율적으로 지배할 통치기관을 설치해야 합니다."
 KOR_southern_attack:0 "남방 공격"
 KOR_southern_attack_desc:0 "이제 일본이 우리의 수중에 들어왔으니, 다음은 남방 자원지대의 차례입니다. 남방의 자원지대는 우리 자유 대한의 산업 발전에 꼭 필요하며, 이를 지키는 서구 열강의 식민지군들은 오합지졸들일 뿐입니다!"
 KOR_horang_horang_horang:0 "충장 상황"
 KOR_horang_horang_horang_desc:0 "비열한 미국은 우리 자유 대한의 정복전쟁에 대해 비난을 하며, 건방지게 금수조치를 내리려 하고 있습니다. 한때, 일본을 가상적국으로 삼아 경계하던 그들이, 그 일본을 '처리'해준 우리에게 이러는 것은 명백히 아시아를 지배하려는 음모입니다. 우리는 신미양요의 복수와, 자유 대한의 의지를 담아 이에 화답할 것입니다."
 KOR_ties_with_anti_communist_allies:0 "반공 우방과의 유대"
 KOR_ties_with_anti_communist_allies_desc:0 "북쪽의 소비에트 연방은 일찍이 대구 사회화 운동을 선동해 우리의 자랑스러운 조국을 붉게 적화시키려는 음모를 꾸민 바 있습니다. 우리는 우리의 신성한 국토를 보호하기 위해, 소비에트에 맞서는 파시스트 진영과 협동해야 합니다!"
 KOR_friendship_with_germany:0 "독일과의 친선"
 KOR_friendship_with_germany_desc:0 "이범석 각하께서는 일찍이, 소령 시절 독일에서 장군참모 과정을 수료하고 중령 진급후 주독한국대사관 국방무관으로 근무하면서 독일의 히틀러와 친분을 쌓은 바 있습니다. 이범석 각하와 히틀러 총통의 유대관계는 독일과의 외교에서의 우리의 큰 자산이 될것입니다."
 KOR_join_the_axis:0 "추축국 가입"
 KOR_join_the_axis_desc:0 "국가사회주의 독일은 베르사유 조약의 사슬을 끊고 날이 갈수록 더욱 강해져 가고 있습니다. 이범석 각하께서도 독일 유학시절, 이들의 힘과 의지를 직접 보아 그들의 능력을 의심하지 않으십니다. 우리는 독일과 함께 추축동맹에 가입해, 그들과 함께 해야 합니다!"
 KOR_korean_general_staff:0 "한국의 장군참모"
 KOR_korean_general_staff_desc:0 "독일의 장군참모제도는 정말 놀라울 정도로 숙련되고 능력있는 고급 지휘관과 참모들을 양성하는 과정이며, 이범석 각하께서도 젊은시절 독일 국비유학 위탁교육과정 당시 이를 직접 경험했습니다. 따라서, 우리는 독일에게 '한국식 장군참모 제도'를 만들기 위한 교관들을 보내줄 것을 요청해야 합니다."
 KOR_german_technology:0 "독일의 기술"
 KOR_german_technology_desc:0 "독일의 과학 기술은 세계 제일입니다. 우리는 반공십자군의 일원으로서 독일에게 기술공유를 요청해야 합니다."
 KOR_friendship_with_japan:0 "일본과의 친선"
 KOR_friendship_with_japan_desc:0 "비록 한일러 전쟁 이후, 우리 대한과 일본의 관계는 빗말로라도 좋은 관계가 아니지만, 우리는 일본에게 배울 것이 많습니다. 우리는 일본과의 외교 관계를 원점부터 재검토해 그들과의 우호와 친선을 고려해봐야 합니다."
 KOR_join_the_co_prosperity_sphere:0 "공영권 가입"
 KOR_join_the_co_prosperity_sphere_desc:0 "일본은 대동아공영권의 이름 아래 아시아 전역을 해방하고자 합니다. 우리는 일본과 함깨, 대동아 공영이라는 대의의 이름 아래에 함께 할 것을 요청할 수 있습니다."
 KOR_purchase_japanese_weapons:0 "일제 무기 구매"
 KOR_purchase_japanese_weapons_desc:0 "우리는 대동아공영의 대의 아래에 우리의 몫을 다하기 위해 군을 급격하게 확장하고 있지만, 무기가 부족합니다. 우리는 우리의 친구 일본에게 무기를 판매해 줄 것을 요청해야 합니다."

#politic - neutrality
 kor_coronation_in_gyeongbok_palace:0 "이은이 경복궁에서 즉위함."
 kor_coronation_in_myongdong_cathedral:0 "이은이 명동성당에서 즉위함."
#Hwan
 KOR_urihwangsilsaranghoe:0 "우리황실사랑회"
 KOR_urihwangsilsaranghoe_desc:0 "사단법인 우리황실사랑회는 태백교의 교주 계연수가 이끄는 왕정 복고와 대한제국의 재건을 위해 활동하는 민간 단체입니다. 우리는 법인의 현황에 대해 점검하고, 왕실복고를 위한 다음 계획을 세워야 합니다."
 KOR_take_control_the_radio_media:0 "라디오 미디어 장악"
 KOR_take_control_the_radio_media_desc:0 "현재 대한민국에서는 농담으로라도 황실 복고를 주장하는 이는 아무도 없습니다. 그러니 우리는 최신 과학문명의 산물인 라디오에 주목해야 합니다. 라디오는 대부분의 가정에 1대 이상씩은 존재하며, 라디오는 국민들의 오락수단이자 정보를 얻는 수단으로 사용됩니다. 우리는 근황주의자들과 태백교 신도들의 '기부금'으로 라디오 방송국들을 매수해 구 조선왕실에 대한 우호적인 여론을 조성할 것입니다..."
 KOR_deoksugung_pyeonguihoe:0 "덕수궁 평의회"
 KOR_deoksugung_pyeonguihoe_desc:0 "다가오는 다음 국회의원 선거에서, 우리는 자유-독립당을 대신한 의회의 과반을 차지할 것으로 예상되며, 우리는 대한민국 국회에 공식적으로 대한민국의 해체를 요구할 것입니다... 또한 대한민국 정부를 대신해서 적법한 황제께서 즉위하시기 전까지 우리황실사랑회를 모태로 개편된 덕수궁 평의회가 이 나라의 입법, 사법, 행정을 대신 담당할 것이며 그 누구도 우리에게 감히 이의를 제기할 수 없습니다."
 KOR_revise_the_constitution:0 "헌법 개정"
 KOR_revise_the_constitution_desc:0 "대한민국 헌법 제11조 2항 '사회적 특수계급의 제도는 인정되지 아니하며, 어떠한 형태로도 이를 창설할 수 없다.' - 이 문구는 우리가 이 땅의 적법한 주인을 모셔오는데에 방해가 되는 문구입니다. 우리는 황실 복원의 마지막 단계로서, 해당 문구 및 대한제국의 부활을 막는 모든 헌법의 효력을 공식적으로 정지할 것입니다."
 KOR_return_of_the_king:0 "왕의 귀환"
 KOR_return_of_the_king_desc:0 "이제 모든 준비가 다 끝났습니다! 우리는 전주에 계신 제국의 진정한 계승자, 이은 황태자 저하를 서울로 모셔서 그분께 그분의 정당한 몫을 돌려드릴 것입니다."
 KOR_imperial_regent_gyeyeonsu:0 "제국섭정 계연수"
 KOR_imperial_regent_gyeyeonsu_desc:0 "오랫동안 우리황실사랑회를 이끌고 자금을 후원한 계연수는 제국의 부활에 혁혁한 공을 세웠습니다. 이제 그의 공을 기려서 아직 경험이 부족한 황상을 대신해 그를 제국의 섭정으로 임명해 조국의 대소사를 관장하게 해야 합니다."
 KOR_purge_the_imperialists:0 "근황주의자 숙청"
 KOR_purge_the_imperialists_desc:0 "이제 때가 되었습니다! 우리는 아무 생각도 없는 미련한 도련님을 황제로 앉혀놨으며, 이 나라의 모든 실권은 계연수 성하께서 장악하시었습니다. 이젠 몇 안남은 똑똑이들만 모두 '처리'하면 더이상 환 제국의 부활을 막을 자들은 그 누구도 없습니다..."
 KOR_educate_hwandangogi:0 "공교육에 환단고기 도입"
 KOR_educate_hwandangogi_desc:0 "이제, 우리는 우리 겨레의 진정한 역사서인 환단고기를 자라나는 어린이와 청소년들에게 교육할 것입니다. 우리는 환단고기를 공식적으로 초중고교의 교과서로 채택할 것이며, 환단고기 낭송대회와 환단고기 독후감 대회등을 열어서 어린이와 청소년들에게 환단고기를 더욱 친숙하게 다가갈 수 있게 할것입니다."
 KOR_idolization_dangun:0 "단군 우상화"
 KOR_idolization_dangun_desc:0 "모든 겨레의 진정한 아버지인 환인께서는 선택받은 우리 환민족을 위해 단군왕검을 보내주셨으며, 계연수 성하께서는 그분들의 의지이자 사자이십니다. 이제 대한의 전 국민들은 모두 의무적으로 태백교에 입교해 함께 입을 모아 그분들을 찬양해야 하며, 그 외의 모든 종교들은 공식적으로 금지될 것입니다."
 KOR_ideological_fanaticism:0 "환-신비주의 광신"
 KOR_ideological_fanaticism_desc:0 "이제 대한의 전 국민은 태백교의 이름아래 단결했습니다. 더 이상 안으로의 싸움은 없을 것이며, 이제 우리는 환 제국의 재건을 위해 몸과 마음을 바쳐 계연수 성하께 충성을 다 바쳐야 합니다."
 KOR_northern_restoration:0 "대북방 평정"
 KOR_northern_restoration_desc:0 "북방의 만주는 우리 환민족의 고토이자, 단군께서 환민족을 이끌고 도착한 약속된 낙원이자 성지입니다. 우리는 이 땅을 차지하고 있는 그 어떤것이든지 몰아내 우리의 고토을 되찾을 것입니다!"
 KOR_empire_of_hwan:0 "환제국의 부활"
 KOR_empire_of_hwan_desc:0 "오환건국 최고 (우리 환족이 세운 나라가 가장 오래 되었다.) \n환자 전일야 광명야 (환은 온전한 하나됨이며 광명이다.) \n전일 위삼신지지능 (온전한 하나됨은 삼신의 지혜와 권능이다.)"
 KOR_retake_yellow_river_civilization:0 "황하문명 탈환"
 KOR_retake_yellow_river_civilization_desc:0 "환민다국 십이연맹 (환민족은 12개의 국가로 이루어진 연방을 이루었다.) \n 남행 월지양윤 농본(남쪽은 월지국과 양윤국이 존재했으며, 농업에 종사했다.)"
 KOR_conquest_indu:0 "인두국 정복"
 KOR_conquest_indu_desc:0 "서환건국인두 우숭파문 (동쪽으로 간 환인들은 인두국을 세웠으며, 그들은 소를 숭배해 파문되었다.)"
 KOR_sumilyee:0 "수밀이국 재건"
 KOR_sumilyee_desc:0 "원서환민 건수국밀 (가장 먼 서쪽으로 간 환민족은 수밀이국을 세웠다.) \n수밀축성 서원벌멸정 (수밀이국은 성을 건설해 서쪽의 야만족들을 정벌했다.)"
 KOR_occupat_yamoedo:0 "야뫼도 점령"
 KOR_occupat_yamoedo_desc:0 "환민 해달사 (환민족은 바다에 능했다.) \n 발본열도 부명야뫼도 (그들은 바다에서 발견한 섬의 이름을 '야뫼도'라 이름지었다.)"
 KOR_liberation_of_sanaba_and_tonggosa:0 "사납아와 통고사의 해방"
 KOR_liberation_of_sanaba_and_tonggosa_desc:0 "북행환민 개척삼림 (북쪽으로 올라간 환인들은 삼림을 개척했다.) \n 북환건통고사국사납아 (북쪽의 환민족은 통고사국과 사납아국을 세웠다.)"
 KOR_our_true_enemy:0 "우리의 진정한 적"
 KOR_our_true_enemy_desc:0 "동환서분 만계치세 양대강국 (동쪽의 환국과 서쪽의 핀국이 가장 강하였다.) \n환분 불양립 진적토하 (환국과 핀국은 서로 대 전쟁을 벌였다.) \n환멸분망 세계혼란 (환국과 핀국의 전쟁으로 양국은 멸망했으며, 세계에 암흑기가 찾아왔다.)"
 KOR_hwan_world_order:0 "환 세계 질서"
 KOR_hwan_world_order_desc:0 "시 인개자호위환 이감군위인 (당시 지구상의 사람들은 모두 스스로를 '환'이라 부르고 무리를 다스리는 사람을 '인'이라 하였다.) \n\n대천선화 사인무병 (그 분께서는 하늘을 대신해 널리 교화를 베풀어 사람들로 하여금 싸움이 없게 하셨다.)"
#neutral
 KOR_oppose_gyeyeonsu:0 "계연수 축출"
 KOR_oppose_gyeyeonsu_desc:0 "계연수는 명백하게 정신나간 노인입니다. 비록 그의 활동덕분에 이 땅에 제국이 다시 부활한 것은 사실이지만, 그의 비정상적인 환-신비주의 종교관과 사상은 분명히 황실과 조국에 해를 끼칠 것입니다. 이제 그만 그와 그의 추종자들을 '처분'할 때가 되었습니다."
 KOR_reconstruction_confusian_order:0 "성리학 질서 재건"
 KOR_reconstruction_confusian_order_desc:0 "이제 이 땅의 적법한 주인인 황제께서 이 땅의 진정한 주인이 되셨으니, 공화주의자들이 이 땅에 들여놓은 저질스런 잔재를 쓸어버릴 때가 되었습니다. 조선과 대한제국의 사상적 근본인 성리학 질서야 말로 이 땅을 다시 정화시킬 유일한 해결책입니다."
 KOR_revive_bibyeonsa:0 "비변사 부활"
 KOR_revive_bibyeonsa_desc:0 "비변사는 임진왜란 이후 조선의 입법, 사법, 행정 삼권을 모두 장악해 담당하던 최고 의결기관입니다. 비록 비변사는 조선 말 세도가문들이 그 수장을 맡아 국정을 장악하는데 악용되었지만, 한 명에게 국가의 모든 권력을 집중한다는 점 만큼은 황상께 가장 필요한 것입니다. 우리는 비변사를 부활시킬 것이며, 그 수장은 이 땅의 적법한 주인이신 황제 폐하께서 직접 겸임하게 될것입니다."
 KOR_go_with_kaiserreich:0 "카이저라이히와 함께"
 KOR_go_with_kaiserreich_desc:0 "일찍이 독일 제국의 카이저 빌헬름 2세는 한일러 전쟁 전 상황이신 고종 황제께 'Kaiser von Korea'라 부르며 기이할 정도로 우호적이였으나, 한일러 전쟁후 무술민변으로 인한 대한제국의 붕괴, 그리고 대전쟁으로 인한 독일 제국의 붕괴로 결국 양국간의 동맹은 실현되지 못했습니다. 그러나 이제 양국 모두 제정이 부활했으니, 이 이루지 못한 동맹을 실현할 때가 되었습니다!"
 KOR_agitate_nationalist:0 "민족주의자 선동"
 KOR_agitate_nationalist_desc:0 "구 제국을 끝장낸 것은 한일러 전쟁 당시 민족주의자들을 효율적으로 선동한 공화주의자들의 몫이 컷습니다. 그러나, 공화주의자들의 간도상실 이래로, 민국은 그들의 기대에 부응하지 못했습니다. 우리는 이를 역으로 이용해 민족주의자들을 선동해 황실에 반하는 자들의 입을 다물게 하고 황실의 통치를 더욱 공고히 해야 합니다."
 KOR_reform_military:0 "군제개혁"
 KOR_reform_military_desc:0 "한일러 전쟁 이후 30여년의 평화동안 우리 군은 공화주의자들에 의해 부패하고 퇴폐적인 조직으로 전락해 버리고 말았습니다. 이제 명목상 제국 육해공군의 대원수이자 최고 통수권자이신 황제 폐하께서 직접 군제 개혁을 명하실 것이며, 상명하복의 원칙에 따라 아랫것들은 당연히 그 어떠한 불만 없이 이에 복종해야만 합니다."
 KOR_reconstruction_sapodae:0 "사포대 재창설"
 KOR_reconstruction_sapodae_desc:0 "사포대는 구 제국에 의해 설치되고 공화주의자들의 간도 상실 이전까지 간도에서 우리의 실효지배를 위해 활동하던 현지 한국인 민병대로, 간도의 치안과 국방을 맡던 조직입니다. 비록 간도 상실 이후, 사포대는 완전히 붕괴되었지만, 이제 우리는 비밀스럽게 간도땅에 다시 사포대를 재건하고 그들은 간도에 잠입시켜서 결정적인 순간에 만주국의 뒤통수를 칠 준비를 하게 할것입니다."
 KOR_gando_revellion:0 "간도 반란"
 KOR_gando_revellion_desc:0 "이제 드디어 때가 되었습니다! 간도에 잠입한 사포대와 간도 현지 한국인들의 동시다발적인 봉기와 함께, 우리 군은 우리 백성들을 '보호'하기 위해 우리의 정당한 영토인 간도로 진군할 것입니다. 또한 우리 군은 사랑하는 간도의 백성들의 도움을 받아 옛 고구려의 땅 만주 고토를 완전히 수복할 것입니다. 상제여 황제를 도우소서!"
 KOR_revenge_samjeondo:0 "삼전도의 복수"
 KOR_revenge_samjeondo_desc:0 "만주국의 멸망과 함께, 용감무쌍한 우리 군에게 생포된 만주국의 자칭 '황제' 애신각라 부의는 현재 우리 군의 엄중한 감시 속에 위만황궁에 감금되어 있습니다. 이제 우리는 그를 서울로 대려와, 진정한 황제이신 이은 폐하께 머리가 깨질때까지 삼궤구고두례를 올리게 할것입니다. 이는 300년 전 인조 상황께서 애신각라 홍태극에게 당한 굴욕의 완벽한 복수가 될 것이며 우리 국민들의 사기에 큰 영향을 끼칠 것입니다."
 KOR_sojunghwa:0 "소중화"
 KOR_sojunghwa_desc:0 "조선과 그 후계인 대한제국은 오랫동안 명나라에게 입은 은혜를 잊지 않았습니다. 이제 명나라를 멸망시킨 여진족과 애신각라 일족들에게 그 복수를 마쳤으니, 우리 대한이야말로 소중화를 뛰어넘는 진정한 중화 제국의 계승자라 할 수 있습니다. 우리는 이 사실을 국민들에게 적극적으로 선전해야만 합니다."
 KOR_claim_the_mandate_of_heaven:0 "천명 주장"
 KOR_claim_the_mandate_of_heaven_desc:0 "예로부터 동방을 지배해온 중화의 질서는 한족이 독점하던 것이 절대 아닙니다. 선비족, 몽골족, 만주족은 한족이 무시하던 북적이었지만, 결국 중화의 지배자이자 천명의 주인으로 등극했습니다. 그렇다면 동이족이라고 그러지 못하는 것은 없습니다!"
 KOR_korean_ming_empire:0 "한명제국"
 KOR_korean_ming_empire_desc:0 "현재 중원은 자칭 '중화민국'을 칭하는 평민 무리들에 의해 지배되고 있으며, 적법한 중화제국의 황제는 존재하지 않습니다. 이제 우리는 저 역도의 무리들을 몰아내고, 중원에 다시금 삼황오제의 질서를 복원해야 합니다."
 KOR_revenge_yimjin:0 "임진년의 복수"
 KOR_revenge_yimjin_desc:0 "고려말 왜구부터 임진왜란, 한일러 전쟁까지, 야마토 민족은 황실과 조국을 대대로 위협해온 전통적인 숙적입니다. 이제 한반도를 둘러싼 벽과 같은 저 열도를 대한의 이름으로 정복해 다시금 야마토 민족이 대한의 황실을 능멸하지 못하게 해야 합니다."
 KOR_the_last_empire:0 "최후의 제국"
 KOR_the_last_empire_desc:0 "우리 대한제국의 공격적인 확장에 대해 미합중국은 지속적으로 '외교적 우려'를 표하고 있으며, 북쪽의 소비에트 연방은 우리 대한에 대해 '노동자를 착취하고 귀족적 허영에 가득찬 차르와 같은 전쟁광 전제군주'라고 헐뜯으며 선량한 우리 국민들을 선동하고 있습니다. 황실과 제국은 더 이상 이러한 모욕을 참지 않을 것이며, 그들에게 말보다는 행동으로 보일 것입니다. 대한제국 만세! 황제폐하 만세!"
 KOR_emperors_order:0 "황제의 명령"
 KOR_emperors_order_desc:0 "대공황 이래로 황제폐하의 즉위 전까지, 이 나라에는 해결되지 못한 채 쌓여있는 문제들이 산적합니다. 이제 황제께서 보위에 오르셨으니, 그동안 산적한 문제들을 해결하기 위한 긴 행정업무를 시작해야 합니다."
 KOR_royal_guards_division:0 "황실근위사단 창설"
 KOR_royal_guards_division_desc:0 "대한제국 황군은 구 대한민국 국군의 인적자원을 그대로 계승한 탓에 이들의 충성심을 완전히 신뢰하기는 아직 힘듭니다. 따라서, 우리황실사랑회의 광신적인 근황주의자들과 일반 제국군중 강인한 체력을 가진 이들에게 높은 급료와 좋은 장비, 더 나은 대우를 약속해 모아서 군부가 아닌 황실 직속의 황실근위사단으로 편성해 황실의 경호대이자 친위부대로 삼아야 합니다."
 KOR_march_of_the_king:0 "황제의 친정"
 KOR_march_of_the_king_desc:0 "조선의 창업군주이신 태조 고황제께서는 몸소 직접 군을 이끈 무인이셨지만, 한 국가의 군주가 직접 군대를 이끌고 전장에 나서는 것은 현대전에서는 위험천만하기 짝이 없는 일입니다. 그러나, 불란서의 나파륜이 그러 했듯이, 황제께서 직접 전장에 나서서 군을 이끄는 것은 병졸들의 사기와 신뢰를 올릴 수 있는 저렴하면서도 좋은 방법입니다. 따라서 황제께서 직접 친정에 나서는 것을 검토해 볼 필요가 있습니다."
 KOR_modern_sejong_the_great:0 "현대의 세종대왕"
 KOR_modern_sejong_the_great_desc:0 "새로이 즉위하신 황제께서는 이 일에 대해 꽤 큰 의욕을 보여주고 있지만, 아직 경험이 부족한 탓에 능율적이지 못합니다. 이에 따라, 우리는 황제폐하의 업무를 도울 능력과 충성심이 검증된 관료들에게 더 많은 업무를 분배해야 합니다."
 KOR_dedication_of_emperor:0 "황제의 헌신"
 KOR_dedication_of_emperor_desc:0 "군주는 이 나라의 주인으로서 일반인보다 더 많은 것을 누리지만, 국가 통합의 상징으로서의 역할을 포함한 의무와 책임 역시 막중합니다. 따라서 황제께서는 국민의 모범을 보여 궁궐에만 있는 것이 아닌, 대중들에게 직접 가까이 다가가 봉사활동과 위문등을 실시해 그들의 자발적인 존경과 충성을 이끌어내야 합니다."
 KOR_addresses_to_the_korean_nation:0 "대한국인들에게 고함"
 KOR_addresses_to_the_korean_nation_desc:0 "이제 우리 조국은 더이상 자중지란속에서 싸워서는 안됩니다. 황제 폐하를 구심점으로 삼아 전 국민이 단결해서 이 위기의 시대를 이겨내야만 합니다."
 KOR_lee_seong_gyes_resurrection:0 "이성계의 부활"
 KOR_lee_seong_gyes_resurrection_desc:0 "그 누구도 예상하지 못했지만, 황제께서는 예상되었던 것보다 더 군을 지휘하는데 능숙한 모습을 보이며, 이제는 궁에서의 업무보다는 전장에 나서는 것에 더 능숙하신 모습을 보입니다. 그 모습은 마치 태조 고황제, 이성계의 환생과 같으며, 전 군은 황제 폐하의 효율적인 지휘 아래 강군으로 성장했고, 우리 군과 국민들은 황제께 강한 존경을 보내고 있습니다."
 KOR_constitutional_monarchy:0 "입헌군주정 실시"
 KOR_constitutional_monarchy_desc:0 "비록 제국이 부활하긴 했지만, 이젠 시대가 바뀌었습니다. 황제께서도 자신은 통치자로서는 적합하지 않다고 여기고 있으며, 혈통에 따른 종묘사직 수호의 의무만을 맡고자 합니다. 우리는 그의 뜻을 존중해서 입헌 군주정을 실시할 것입니다."
 KOR_nomination_prime_minister:0 "공화주의자들과의 화해"
 KOR_nomination_prime_minister_desc:0 "안창호, 김구, 여운형, 이들은 황실에 대해 별로 좋게 생각하지 않는 공화주의자들이지만, 그 애국심만큼은 진심으로 보입니다. 우리는 이들에게 황권의 제한과 스웨덴 헌법을 참고한 입헌군주정의 실시를 약속해 이들을 우리편으로 끌어들일 수 있을것입니다."
 KOR_re_open_national_assambly:0 "국회 재개장"
 KOR_re_open_national_assambly_desc:0 "우리는 이제 입헌군주 민주정부 구성을 위해 구 대한민국의 전복 이후 폐원된 의회의 복원을 시작할 것입니다. 다시 부활한 의회는 구 민국과 마찬가지로 자유 선거로 그 구성원들을 선출할 것입니다."
 KOR_reaffirming_the_independence_of_the_judiciary:0 "사법부의 독립 보장"
 KOR_reaffirming_the_independence_of_the_judiciary_desc:0 "우리는 민주적인 삼권분립의 원칙 아래에 사법부의 독립성을 보장할 것입니다. 또한, 설령 황제라 할지라도 국법을 어길 경우에는 법의 심판을 받아야 한다는 것을 명문화 해서 그 권한과 독립성을 준엄하게 보호할 것입니다."
 KOR_confucian_democracy:0 "유교 민주주의"
 KOR_confucian_democracy_desc:0 "유교는 인의예지를 강조하는 동아시아에서 최초로 탄생한 인본주의 사상으로서, 유교와 민주주의는 서로 양립할 수 없는 개념이 절대 아닙니다. 우리는 사회적 약자를 배려하고, 경험있는 노인들을 공경하며, 덕으로서 주변의 존경을 받고자 노력하는, 더 진화한 민주주의의 실현을 위해 노력해야 합니다."
 KOR_join_the_allies_2:0 "연합국 가입"
 KOR_join_the_allies_2_desc:0 "마침내, 우리 국내에서의 일련의 혼란과 소동들은 완전히 가라앉았습니다. 그러나 우리와는 별개로 세계는 불타오르고 있습니다. 우리 대한역시 자유를 사랑하는 국가로서, 우리의 몫을 다하고, 우리와 함께할 친구들에게 기꺼이 우리의 힘을 빌려줄 것입니다."
 KOR_joint_military_practice:0 "연합국 합동군사훈련"
 KOR_joint_military_practice_desc:0 "우리 군은 한일러 전쟁 이후 30여년간의 평화로 인해 타국의 군대에 비해 뒤떨어집니다. 따라서 우리는 우리의 우방국과의 합동군사훈련을 통해 그들의 군대에게 배워야할 점들을 배울 것입니다."
 KOR_aeguk_gongchae:0 "애국 공채"
 KOR_aeguk_gongchae_desc:0 "이제 대한의 전 국민이 충성과 의로 뭉쳐서 전쟁을 준비해야 합니다. 국민은 제국의 부속품이요, 3천만 국민들이 사치를 줄이고 그 대금을 국가에게 매달 거둔다면, 더 많은 소총과 전차, 항공기를 만들 수 있습니다. 이를 위해 애국 공채를 발행해 국민들에게 강매해 더 많은 군수물자를 준비해야 합니다."
 KOR_penal_regions:0 "형벌부대 도입"
 KOR_penal_regions_desc:0 "오자병법에 따르면, 죄수들을 징집한 형벌부대는 최고의 수단입니다. 형벌부대는 불명예를 씻고 용서를 받고자 하는 이들, 자유를 되찾기 위한 이들은 더욱 용맹하게 싸울 것이며, 설령 그게 아니라 할지라도 부모에게 효를 다하지 않은 이들, 황실에 대해 불경한 말을 한 자들, 공화주의 사상을 가진 사회의 쓰레기들을 우리의 총알 대신 적의 총알로 처분하는 것은 매력적이지 않을 수 없는 좋은 방법입니다."