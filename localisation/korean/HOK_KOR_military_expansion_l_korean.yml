l_korean:
#20260926_kpopmodder: Use escaped ASCII dialogue quotes and compact decision UI text; preserve gameplay and explicit lifecycle warnings.
#20260926_kpopmodder: Compact new focus descriptions for the fixed-height UI; preserve gameplay and non-focus localisation.
#20260925_kpopmodder: Rewrite focus, decision and event prose with grounded voices; preserve keys, gameplay rules and paired Korean text.
#20260921_kpopmodder: 승인된 보상 강화에 맞춰 최종 교체값·영구 효과·반복 사업 조건과 협정 설명을 두 언어 채널에 동기화합니다.
#20260921_kpopmodder: Add paired Korean military expansion names and descriptions.
 HOK_KOR_procurement_contracts:0 "국방조달계약"
 HOK_KOR_procurement_contracts_desc:0 "병기창은 주문을, 부대는 보급을 기다립니다. 장기 조달계약으로 두 일정을 맞추고 소총 개발의 경험을 다음 생산에 반영하겠습니다."
 HOK_KOR_ammunition_standards:0 "탄약 규격 통일"
 HOK_KOR_ammunition_standards_desc:0 "탄약 상자가 와도 총에 맞지 않으면 기다림은 끝나지 않습니다. 병기창과 민간 업체의 탄약·부품 규격을 통일하겠습니다."
 HOK_KOR_ordnance_inspection:0 "병기 검사제도"
 HOK_KOR_ordnance_inspection_desc:0 "\"납품 수량은 맞습니다.\"\n\"사격 시험 결과도 가져오게.\"\n포탄과 화포의 검사 기준을 정비해 시험 결과를 제조 현장에 돌려보내겠습니다."
 HOK_KOR_field_maintenance:0 "야전 정비창"
 HOK_KOR_field_maintenance_desc:0 "부품 하나의 고장으로 장비 전체를 후방에 보낼 수는 없습니다. 부대 가까이에 인력과 공구를 갖춘 야전 정비창을 두겠습니다."
 HOK_KOR_distributed_ordnance_depots:0 "분산 군수창 체계"
 HOK_KOR_distributed_ordnance_depots_desc:0 "창고에 있다는 보고와 부대가 받았다는 보고는 다릅니다. 군수품을 분산 비축하고 수송로가 막혀도 다른 곳에서 이어 보내겠습니다."
 HOK_KOR_staff_exercises:0 "참모부 도상훈련"
 HOK_KOR_staff_exercises_desc:0 "지도 위 화살표가 명료해도 부대의 출발 시각은 다를 수 있습니다. 도상훈련에서 같은 작전도를 읽고 명령을 맞추겠습니다."
 HOK_KOR_winter_training:0 "개마고원 동계훈련"
 HOK_KOR_winter_training_desc:0 "추위를 참는다고 젖은 장비가 마르지는 않습니다. 개마고원에서 방한·숙영·보급을 익혀 겨울에도 움직일 부대를 만들겠습니다."
 HOK_KOR_mountain_reconnaissance:0 "산악 정찰학교"
 HOK_KOR_mountain_reconnaissance_desc:0 "지도에서 가까운 능선이 발밑에서는 먼 길입니다. 산악 정찰학교에서 지형을 읽고 소부대로 길을 찾는 법을 가르치겠습니다."
 HOK_KOR_radio_coordination:0 "무선 지휘망 표준화"
 HOK_KOR_radio_coordination_desc:0 "명령을 보냈다는 말만으로 통신은 끝나지 않습니다. 주파수와 보고 절차를 맞추고 무선 장비를 연구해 같은 뜻이 전달되게 하겠습니다."
 HOK_KOR_joint_arms_exercises:0 "제병협동 연습"
 HOK_KOR_joint_arms_exercises_desc:0 "포병·보병·기갑의 시간을 한 계획에 맞춥니다. 참모체계를 교체해 계획 수립 +20%, 조직적 협동 +6%를 얻습니다. 이전 단계와 중첩되지 않습니다."
 HOK_KOR_rapid_repairs:0 "진해 수리창 정비"
 HOK_KOR_rapid_repairs_desc:0 "배는 작업대를, 작업대는 부품을 기다립니다. 진해 수리창의 순서와 조달을 정비해 손상된 군함이 항구에 묶인 시간을 줄이겠습니다."
 HOK_KOR_archipelago_training:0 "다도해 기동훈련"
 HOK_KOR_archipelago_training_desc:0 "섬 뒤로 사라진 아군을 기다리기만 해서는 대형을 지킬 수 없습니다. 다도해의 좁은 수로에서 기동과 연막 운용을 익히겠습니다."
 HOK_KOR_escort_school:0 "호위전대 학교"
 HOK_KOR_escort_school_desc:0 "화물 명세 뒤에는 보급을 기다리는 병사와 공장이 있습니다. 호위전대 학교에서 수송선을 목적지까지 데려가는 법을 가르치겠습니다."
 HOK_KOR_anti_submarine_school:0 "대잠전 학교"
 HOK_KOR_anti_submarine_school_desc:0 "수면 아래의 적을 찾는 관측을 다음 당직도 이어받아야 합니다. 대잠 장비와 승조원 교육을 함께 발전시키겠습니다."
 HOK_KOR_coastal_fire_control:0 "함포지원 연락체계"
 HOK_KOR_coastal_fire_control_desc:0 "해안 관측반과 함대가 다른 표적을 떠올려서는 안 됩니다. 공통 좌표와 사격 요청으로 함포의 힘을 필요한 곳에 전하겠습니다."
 HOK_KOR_fleet_staff_college:0 "함대 참모학교"
 HOK_KOR_fleet_staff_college_desc:0 "먼 바다에서는 본국의 답보다 상황이 빨리 바뀝니다. 대양함대와 통상파괴 전대의 지휘관에게 항로·적정·보급을 함께 가르치겠습니다."
 HOK_KOR_underway_replenishment:0 "해상 보급절차"
 HOK_KOR_underway_replenishment_desc:0 "작전도에 항로를 더 그어도 연료는 늘지 않습니다. 장거리 보급 절차를 정비하여 갈 때의 계산에 돌아올 계산까지 넣겠습니다."
 HOK_KOR_deck_training:0 "갑판 운용학교"
 HOK_KOR_deck_training_desc:0 "비행기를 띄우기 전에 갑판을 비우고 점검할 손이 필요합니다. 항공모함 연구와 승조원 교육으로 조종사가 믿고 맡길 갑판을 만들겠습니다."
 HOK_KOR_naval_air_coordination:0 "해공 합동연락망"
 HOK_KOR_naval_air_coordination_desc:0 "항공대가 찾은 목표를 함대가 다시 찾게 해서는 안 됩니다. 해공 연락과 보고 절차를 맞추고 해상 공격 항공기를 연구하겠습니다."
 HOK_KOR_amphibious_rehearsals:0 "상륙지원 합동연습"
 HOK_KOR_amphibious_rehearsals_desc:0 "바다에서 육지로 넘어갈 때 지휘까지 끊어져서는 안 됩니다. 수송·함포 지원·해안 정찰을 묶어 육해군 합동연습을 하겠습니다."
 HOK_KOR_domestic_aircraft_designs:0 "국산 설계 역량 집중"
 HOK_KOR_domestic_aircraft_designs_desc:0 "\"시험비행에서 불편했던 곳을 도면에 짚어 주십시오.\"\n한국항공우주산업의 설계진과 군의 경험을 이어 국산 항공기의 시험·개량을 이끌겠습니다."
 HOK_KOR_foreign_aircraft_designs:0 "우방 항공기술 도입"
 HOK_KOR_foreign_aircraft_designs_desc:0 "같은 정부 형태의 비적대 강대국에서 항공 경험을 배웁니다. 항공 연구 75% 2회와 공군 경험치 15를 얻습니다. 기술·완성 설계도를 직접 받는 것은 아닙니다."
 HOK_KOR_formation_flying:0 "편대전술 표준화"
 HOK_KOR_formation_flying_desc:0 "각자 잘 나는 것만으로 편대가 되지는 않습니다. 통신과 기동을 표준화해 조종사들이 서로의 빈틈을 지키며 임무를 수행하게 하겠습니다."
 HOK_KOR_air_maintenance_school:0 "항공정비학교"
 HOK_KOR_air_maintenance_school_desc:0 "\"이상 없다고 적기 전에 직접 확인했나?\"\n항공정비학교에서 전문 기술과 사고 사례를 가르쳐 작은 이상을 놓치지 않는 정비진을 기르겠습니다."
 HOK_KOR_combat_lessons_center:0 "항공전훈 연구반"
 HOK_KOR_combat_lessons_center_desc:0 "한 편대의 시행착오를 다음 편대에 전하겠습니다. 전훈 공유체계로 교체해 공군 임무 효율 +30%를 얻습니다. 이전 단계와 중첩되지 않습니다."
 HOK_KOR_procurement_spirit_1:0 "군수 규격화"
 HOK_KOR_procurement_spirit_1_desc:0 "통일된 탄약과 부품 규격은 병기창의 생산 혼란을 줄입니다."
 HOK_KOR_procurement_spirit_2:0 "통합 군수체계"
 HOK_KOR_procurement_spirit_2_desc:0 "공통 규격과 분산 군수창이 생산에서 전선 보급까지 이어지는 체계를 이룹니다."
 HOK_KOR_staff_spirit_1:0 "참모부 훈련체계"
 HOK_KOR_staff_spirit_1_desc:0 "정기적인 도상훈련으로 작전 계획과 명령 전달 절차를 숙달하고 있습니다."
 HOK_KOR_staff_spirit_2:0 "제병협동 참모체계"
 HOK_KOR_staff_spirit_2_desc:0 "병과별 운용과 무선 연락망이 하나의 작전 계획으로 연결되어 있습니다."
 HOK_KOR_winter_training_spirit:0 "동계전 준비"
 HOK_KOR_winter_training_spirit_desc:0 "혹한기 숙영과 보급, 장비 관리 훈련이 겨울철 손실을 줄여 줍니다."
 HOK_KOR_rapid_repairs_spirit:0 "함대 수리체계"
 HOK_KOR_rapid_repairs_spirit_desc:0 "수리창의 작업 순서와 예비 부품 조달을 정비하여 손상된 함선을 빠르게 복귀시킵니다."
 HOK_KOR_escort_spirit:0 "숙련된 호위전대"
 HOK_KOR_escort_spirit_desc:0 "수송대 편성과 호위 절차를 익힌 승조원들이 해상 교통로를 지키고 있습니다."
 HOK_KOR_coastal_fire_control_spirit:0 "해안 화력협동"
 HOK_KOR_coastal_fire_control_spirit_desc:0 "함대와 해안 관측반이 공통 절차로 사격 지원을 요청하고 조정합니다."
 HOK_KOR_naval_logistics_spirit:0 "해상 군수지원"
 HOK_KOR_naval_logistics_spirit_desc:0 "장거리 작전의 연료 사용과 보급 일정을 체계적으로 관리합니다."
 HOK_KOR_formation_spirit_1:0 "표준 편대전술"
 HOK_KOR_formation_spirit_1_desc:0 "조종사들이 공통 기동과 통신 절차를 사용하여 임무 중 서로를 지원합니다."
 HOK_KOR_formation_spirit_2:0 "항공전훈 공유체계"
 HOK_KOR_formation_spirit_2_desc:0 "훈련과 전투의 경험이 연구반을 통해 전 항공대로 전달됩니다."
 HOK_KOR_air_maintenance_spirit:0 "전문 항공정비진"
 HOK_KOR_air_maintenance_spirit_desc:0 "체계적인 정비 교육과 사고 분석으로 예방 가능한 항공기 손실을 줄입니다."

