l_korean:
#20260921_kpopmodder: 승인된 보상 강화에 맞춰 최종 교체값·영구 효과·반복 사업 조건과 협정 설명을 두 언어 채널에 동기화합니다.
#20260921_kpopmodder: Add paired Korean military expansion names and descriptions.
 HOK_KOR_procurement_contracts:0 "국방조달계약"
 HOK_KOR_procurement_contracts_desc:0 "일선 부대가 요구하는 장비를 안정적으로 공급하려면 병기창과 군의 주문 계획이 맞아야 합니다. 장기 조달계약으로 생산 일정을 보장하고 소총 개발에 축적된 경험을 반영할 것입니다."
 HOK_KOR_ammunition_standards:0 "탄약 규격 통일"
 HOK_KOR_ammunition_standards_desc:0 "같은 부대 안에서도 탄약 규격과 부품 치수가 달라 보급에 차질이 생겨서는 안 됩니다. 병기창과 민간 업체가 공통 규격을 따르게 하여 생산과 보급의 혼란을 줄일 것입니다."
 HOK_KOR_ordnance_inspection:0 "병기 검사제도"
 HOK_KOR_ordnance_inspection_desc:0 "수량을 채우는 것만으로는 좋은 무기를 만들 수 없습니다. 포탄과 화포의 검사 기준을 정비하고 시험 사격의 결과를 제조 현장에 돌려보내야 합니다."
 HOK_KOR_field_maintenance:0 "야전 정비창"
 HOK_KOR_field_maintenance_desc:0 "수리할 수 있는 장비를 후방으로 반송하는 동안 전선의 전력은 줄어듭니다. 부대 가까이에 정비 인력과 공구를 배치하여 고장 난 장비를 신속히 복귀시킬 것입니다."
 HOK_KOR_distributed_ordnance_depots:0 "분산 군수창 체계"
 HOK_KOR_distributed_ordnance_depots_desc:0 "한 곳에 집중된 보급품은 수송망이 끊기면 전선에 닿지 못합니다. 규격화된 장비와 부품을 분산 저장하고 부대별 소요를 연결하여 군수 체계를 완성해야 합니다."
 HOK_KOR_staff_exercises:0 "참모부 도상훈련"
 HOK_KOR_staff_exercises_desc:0 "각 부대의 보고를 모으고 같은 작전도를 읽는 능력은 참모부의 기본입니다. 정기적인 도상훈련을 통해 지휘관의 결심이 명료한 명령으로 전달되도록 할 것입니다."
 HOK_KOR_winter_training:0 "개마고원 동계훈련"
 HOK_KOR_winter_training_desc:0 "북부 고원의 혹한은 훈련되지 않은 부대에 적만큼 위험합니다. 방한 장비 관리와 동계 숙영, 혹한기 보급을 함께 연습하여 겨울에도 부대의 전력을 유지해야 합니다."
 HOK_KOR_mountain_reconnaissance:0 "산악 정찰학교"
 HOK_KOR_mountain_reconnaissance_desc:0 "산길과 능선을 읽는 능력은 한반도에서 작전하는 군대에 필수적입니다. 산악 정찰과 소부대 이동을 전문적으로 가르쳐 지형을 이해하는 병력을 양성할 것입니다."
 HOK_KOR_radio_coordination:0 "무선 지휘망 표준화"
 HOK_KOR_radio_coordination_desc:0 "부대마다 다른 통신 절차는 신속한 지휘를 어렵게 합니다. 주파수 운용과 보고 양식을 통일하고 무선 장비의 연구를 지원하여 명령과 정보가 끊기지 않게 할 것입니다."
 HOK_KOR_joint_arms_exercises:0 "제병협동 연습"
 HOK_KOR_joint_arms_exercises_desc:0 "보병과 포병, 기갑부대가 각자의 전투만 벌이면 서로의 강점을 살릴 수 없습니다. 공통 통신망과 참모 절차를 실제 기동에 적용하여 부대들이 하나의 작전 계획 아래 싸우게 해야 합니다.\n\n§Y참모부 훈련체계§!를 §Y제병협동 참모체계§!로 교체합니다. 교체 후 계획 수립 속도는 §G+20%§!, 조직적 협동은 §G+6%§!입니다. 이전 단계와 중첩되지 않습니다."
 HOK_KOR_rapid_repairs:0 "진해 수리창 정비"
 HOK_KOR_rapid_repairs_desc:0 "새 군함을 건조하는 것만큼 손상된 군함을 빨리 복귀시키는 일도 중요합니다. 진해 수리창의 작업 순서와 부품 조달을 정비하여 함대가 항구에서 보내는 시간을 줄일 것입니다."
 HOK_KOR_archipelago_training:0 "다도해 기동훈련"
 HOK_KOR_archipelago_training_desc:0 "우리 연안의 섬과 좁은 수로는 숙련된 함대에게 유리한 지형이 될 수 있습니다. 시야와 항로가 제한된 해역에서 기동하고 연막을 활용하는 훈련을 실시해야 합니다."
 HOK_KOR_escort_school:0 "호위전대 학교"
 HOK_KOR_escort_school_desc:0 "수송선 한 척을 잃을 때마다 전선의 보급과 국내 산업이 함께 흔들립니다. 호위함의 배치와 수송대 운용을 전문적으로 교육하여 상선 항로를 지켜야 합니다."
 HOK_KOR_anti_submarine_school:0 "대잠전 학교"
 HOK_KOR_anti_submarine_school_desc:0 "수면 아래의 적을 상대하려면 관측과 추적, 공격이 긴밀하게 이어져야 합니다. 대잠 장비 연구와 승조원 교육을 함께 진행하여 호위전대의 탐색 능력을 높일 것입니다."
 HOK_KOR_coastal_fire_control:0 "함포지원 연락체계"
 HOK_KOR_coastal_fire_control_desc:0 "함포 사격이 아군의 진격과 어긋나지 않도록 해안의 관측반과 함대를 연결해야 합니다. 상륙부대와 해군이 공통 사격 요청 절차를 사용하도록 훈련할 것입니다."
 HOK_KOR_fleet_staff_college:0 "함대 참모학교"
 HOK_KOR_fleet_staff_college_desc:0 "대양함대와 통상파괴 전대 모두 먼 바다에서 독립적으로 판단할 지휘관이 필요합니다. 항로와 적정, 보급을 함께 검토하는 함대 참모 교육을 강화할 것입니다."
 HOK_KOR_underway_replenishment:0 "해상 보급절차"
 HOK_KOR_underway_replenishment_desc:0 "함대의 활동 범위는 연료와 보급품을 얼마나 효율적으로 운용하느냐에 달려 있습니다. 장거리 작전의 보급 계획과 연료 사용 절차를 정비해야 합니다."
 HOK_KOR_deck_training:0 "갑판 운용학교"
 HOK_KOR_deck_training_desc:0 "함상 항공기를 운용하려면 비행뿐 아니라 갑판의 모든 작업이 정확하게 맞아야 합니다. 항공모함 연구와 승조원 교육을 함께 진행하여 해군 항공의 기반을 넓힐 것입니다."
 HOK_KOR_naval_air_coordination:0 "해공 합동연락망"
 HOK_KOR_naval_air_coordination_desc:0 "해상의 목표를 발견해도 함대와 항공대가 정보를 공유하지 못하면 기회를 놓칩니다. 공통 보고 절차를 마련하고 해상 공격 항공기의 연구를 지원할 것입니다."
 HOK_KOR_amphibious_rehearsals:0 "상륙지원 합동연습"
 HOK_KOR_amphibious_rehearsals_desc:0 "상륙 작전은 해안에 도착하는 순간부터 육군과 해군의 협동을 요구합니다. 수송과 화력 지원, 해안 정찰을 한 계획으로 묶는 합동연습을 실시할 것입니다."
 HOK_KOR_domestic_aircraft_designs:0 "국산 설계 역량 집중"
 HOK_KOR_domestic_aircraft_designs_desc:0 "한국항공우주산업에 모인 기술을 우리 군의 운용 경험과 연결해야 합니다. 국내 설계진이 시험과 개량을 주도하도록 지원하여 필요한 항공기를 스스로 개발할 능력을 높일 것입니다."
 HOK_KOR_foreign_aircraft_designs:0 "우방 항공기술 도입"
 HOK_KOR_foreign_aircraft_designs_desc:0 "같은 정부 형태를 유지하며 우리와 적대하지 않는 강대국의 공개 항공자료와 제작·정비 경험을 도입하겠습니다. 국내 연구진이 이를 우리 공군의 요구에 맞게 연구하고 시험하여 새로운 항공기의 개발을 앞당길 것입니다.\n\n항공장비 연구 보너스 §G75%§!를 §Y2회§! 얻고 공군 경험치 §G15§!를 얻습니다. 특정 국가의 기술이나 완성된 설계도를 직접 지급하는 효과는 아닙니다."
 HOK_KOR_formation_flying:0 "편대전술 표준화"
 HOK_KOR_formation_flying_desc:0 "좋은 항공기만으로는 공중에서 우세를 유지할 수 없습니다. 편대의 통신과 기동 절차를 표준화하여 조종사들이 서로를 지원하며 임무를 수행하게 해야 합니다."
 HOK_KOR_air_maintenance_school:0 "항공정비학교"
 HOK_KOR_air_maintenance_school_desc:0 "항공기 한 대의 안전은 수많은 정비 절차와 숙련된 손에 달려 있습니다. 정비 인력의 전문 교육을 확대하고 사고 사례를 교육 과정에 반영하여 피할 수 있는 손실을 줄일 것입니다."
 HOK_KOR_combat_lessons_center:0 "항공전훈 연구반"
 HOK_KOR_combat_lessons_center_desc:0 "훈련과 작전에서 얻은 경험이 개별 부대에만 머물러서는 안 됩니다. 임무 보고를 체계적으로 분석하고 유효한 전술을 전체 항공대에 전파하는 연구반을 설치할 것입니다.\n\n§Y표준 편대전술§!을 §Y항공전훈 공유체계§!로 교체합니다. 교체 후 공군 임무 효율은 §G+30%§!이며 이전 단계보다 20%p 증가합니다. 이전 단계와 중첩되지 않습니다."
 HOK_KOR_procurement_spirit_1:0 "군수 규격화"
 HOK_KOR_procurement_spirit_1_desc:0 "통일된 탄약과 부품 규격은 병기창의 생산 혼란을 줄입니다."
 HOK_KOR_procurement_spirit_2:0 "통합 군수체계"
 HOK_KOR_procurement_spirit_2_desc:0 "공통 규격과 분산 군수창이 생산에서 전선 보급까지 이어지는 체계를 이룹니다."
 HOK_KOR_staff_spirit_1:0 "참모부 훈련체계"
 HOK_KOR_staff_spirit_1_desc:0 "정기적인 도상훈련으로 작전 계획과 명령 전달 절차를 숙달하고 있습니다."
 HOK_KOR_staff_spirit_2:0 "제병협동 참모체계"
 HOK_KOR_staff_spirit_2_desc:0 "병과별 운용과 무선 연락망이 하나의 작전 계획으로 연결되어 있습니다."
 HOK_KOR_winter_training_spirit:0 "동계전 준비"
 HOK_KOR_winter_training_spirit_desc:0 "혹한기 숙영과 보급, 장비 관리 훈련이 겨울철 손실을 줄여 줍니다."
 HOK_KOR_rapid_repairs_spirit:0 "함대 수리체계"
 HOK_KOR_rapid_repairs_spirit_desc:0 "수리창의 작업 순서와 예비 부품 조달을 정비하여 손상된 함선을 빠르게 복귀시킵니다."
 HOK_KOR_escort_spirit:0 "숙련된 호위전대"
 HOK_KOR_escort_spirit_desc:0 "수송대 편성과 호위 절차를 익힌 승조원들이 해상 교통로를 지키고 있습니다."
 HOK_KOR_coastal_fire_control_spirit:0 "해안 화력협동"
 HOK_KOR_coastal_fire_control_spirit_desc:0 "함대와 해안 관측반이 공통 절차로 사격 지원을 요청하고 조정합니다."
 HOK_KOR_naval_logistics_spirit:0 "해상 군수지원"
 HOK_KOR_naval_logistics_spirit_desc:0 "장거리 작전의 연료 사용과 보급 일정을 체계적으로 관리합니다."
 HOK_KOR_formation_spirit_1:0 "표준 편대전술"
 HOK_KOR_formation_spirit_1_desc:0 "조종사들이 공통 기동과 통신 절차를 사용하여 임무 중 서로를 지원합니다."
 HOK_KOR_formation_spirit_2:0 "항공전훈 공유체계"
 HOK_KOR_formation_spirit_2_desc:0 "훈련과 전투의 경험이 연구반을 통해 전 항공대로 전달됩니다."
 HOK_KOR_air_maintenance_spirit:0 "전문 항공정비진"
 HOK_KOR_air_maintenance_spirit_desc:0 "체계적인 정비 교육과 사고 분석으로 예방 가능한 항공기 손실을 줄입니다."

